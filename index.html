slide không nhắc hoạt động liên tục ở phần này. Theo slide, tổ hợp {khách quan, thận trọng, nhất quán} không có trong các phương án. Giữ C theo đáp án đề nhưng cần xác nhận."}]},{"id":"other-de1-u018","context":null,"questions":[{"id":"other-de1-q018","num":"Câu 18","type":"mcq","text":"<p>Giá gốc của hàng tồn kho mua ngoài bao gồm những chi phí cấu thành?<\/p>","options":[{"id":"other-de1-q018-A","text":"Giá mua, chi phí liên quan đến việc mua sắm hàng tồn kho, các khoản thuế không được hoàn lại"},{"id":"other-de1-q018-B","text":"Chi phí nhân công, chi phí nguyên vật liệu, chi phí sản xuất chung."},{"id":"other-de1-q018-C","text":"Giá mua (trừ các khoản giảm trừ), Chi phí liên quan đến việc mua sắm hàng tồn kho."},{"id":"other-de1-q018-D","text":"Giá mua (trừ các khoản giảm trừ), Chi phí liên quan đến việc mua sắm hàng tồn kho, các khoản thuế không được hoàn lại."}],"correctOptionId":"other-de1-q018-D","answerBasis":"given","explanation":"<p>Giá gốc hàng tồn kho mua ngoài = giá mua (trừ chiết khấu thương mại, giảm giá, hàng trả lại) + các khoản thuế không được hoàn lại + chi phí liên quan trực tiếp đến việc mua.<\/p><p>A thiếu phần trừ giảm trừ; C thiếu thuế không hoàn lại; B là cấu thành giá thành sản phẩm sản xuất.<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho); TT200 (TK 152, 156)","status":"ok"}]},{"id":"other-de1-u019","context":null,"questions":[{"id":"other-de1-q019","num":"Câu 19","type":"mcq","text":"<p>Khi tham gia vào quá trình hoạt động sản xuất kinh doanh của đơn vị, nguyên liệu, vật liệu?<\/p>","options":[{"id":"other-de1-q019-A","text":"Chỉ tham gia vào một chu kỳ sản xuất"},{"id":"other-de1-q019-B","text":"Hình thái vật chất ban đầu thay đổi"},{"id":"other-de1-q019-C","text":"Chuyển toàn bộ giá trị vào giá thành sản phẩm"},{"id":"other-de1-q019-D","text":"Tất cả đều đúng","pinned":true}],"correctOptionId":"other-de1-q019-D","answerBasis":"given","explanation":"<p>Nguyên vật liệu chỉ tham gia một chu kỳ sản xuất, thay đổi hình thái vật chất ban đầu (hoặc mất đi) và chuyển toàn bộ giá trị vào giá thành sản phẩm. Cả A, B, C đều đúng nên chọn D.<\/p>","source":"Slide Chương 5, slide 2, 6 (đặc điểm nguyên vật liệu, công cụ dụng cụ); Slide Chương 4 (hàng tồn kho)","status":"ok"}]},{"id":"other-de1-u020","context":null,"questions":[{"id":"other-de1-q020","num":"Câu 20","type":"mcq","text":"<p>Kế toán hàng tồn kho theo phương pháp kê khai thường xuyên?<\/p>","options":[{"id":"other-de1-q020-A","text":"Kế toán chỉ tổ chức theo dõi nghiệp vụ nhập kho."},{"id":"other-de1-q020-B","text":"Kế toán theo dõi phản ánh thường xuyên liên tục tình hình nhập, xuất, tồn kho sau mỗi lần phát sinh nghiệp vụ nhập, xuất kho."},{"id":"other-de1-q020-C","text":"Kế toán cuối kỳ kiểm kê hàng còn tồn kho, tính giá của hàng còn tồn kho."},{"id":"other-de1-q020-D","text":"A và C đúng","pinned":true}],"correctOptionId":"other-de1-q020-B","answerBasis":"given","explanation":"<p>Kê khai thường xuyên: theo dõi, phản ánh thường xuyên, liên tục, có hệ thống tình hình nhập, xuất, tồn kho sau mỗi nghiệp vụ.<\/p><p>A sai: theo dõi cả nhập và xuất. C là đặc điểm của kiểm kê định kỳ (cuối kỳ kiểm kê để tính giá hàng tồn). D sai vì A, C sai.<\/p>","source":"Slide Chương 4, slide 35 (kê khai thường xuyên)","status":"ok"}]},{"id":"other-de1-u021","context":null,"questions":[{"id":"other-de1-q021","num":"Câu 21","type":"mcq","text":"<p>Doanh nghiệp tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT 10%.<\/p><p>Nhập khẩu 5.000 kg nguyên liệu A, giá nhập khẩu (CIF) 5 USD/kg, tỷ giá giao dịch 23.300 VND/USD. Thuế suất thuế nhập khẩu là 35%, thuế suất thuế giá trị gia tăng là 10%. Đơn giá nhập khẩu 1 kg nguyên liệu A?<\/p>","options":[{"id":"other-de1-q021-A","text":"157.275 VND"},{"id":"other-de1-q021-B","text":"173.002,5 VND"},{"id":"other-de1-q021-C","text":"167.275 VND"},{"id":"other-de1-q021-D","text":"183.002,5 VND"}],"correctOptionId":"other-de1-q021-A","answerBasis":"given","explanation":"<p>Giá nhập khẩu 1 kg = giá CIF quy đổi + thuế nhập khẩu (thuế GTGT hàng nhập khẩu được khấu trừ nên không tính vào giá gốc).<\/p><table class=\"t\"><tbody><tr><td>Giá CIF/kg<\/td><td class=\"num\">5 x 23.300 = 116.500<\/td><\/tr><tr><td>Thuế nhập khẩu/kg<\/td><td class=\"num\">116.500 x 35% = 40.775<\/td><\/tr><tr><td>Đơn giá nhập khẩu<\/td><td class=\"num\">157.275<\/td><\/tr><\/tbody><\/table><p>Các phương án B, D (173.002,5 và 183.002,5) cộng thêm thuế GTGT 10% trên giá gồm thuế, là sai vì thuế GTGT khấu trừ không tính vào giá. C là kết quả sai số.<\/p>","source":"Slide Chương 4, slide 18, 36 (thuế không được hoàn lại là một phần giá gốc; thuế GTGT khấu trừ không tính); TT200 (TK 152)","status":"ok"}]},{"id":"other-de1-u022","context":null,"questions":[{"id":"other-de1-q022","num":"Câu 22","type":"mcq","text":"<p>Doanh nghiệp tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT 10%.<\/p><p>Có các số liệu sau:<\/p><ul><li>Hàng hóa tồn kho đầu kỳ: 100 kg, đơn giá 10.000 đồng/kg<\/li><li>Trong kỳ: nhập kho 210 kg, đơn giá mua chưa thuế GTGT là 10.150 đồng/kg, chi phí vận chuyển đã thanh toán là 231.000 đồng<\/li><li>Xuất kho: 150 kg theo phương pháp Nhập trước xuất trước (FIFO). Giá trị hàng hóa xuất kho là?<\/li><\/ul>","options":[{"id":"other-de1-q022-A","text":"1.500.000 đồng"},{"id":"other-de1-q022-B","text":"1.507.000 đồng"},{"id":"other-de1-q022-C","text":"1.557.500 đồng"},{"id":"other-de1-q022-D","text":"1.562.500 đồng"}],"correctOptionId":"other-de1-q022-C","answerBasis":"given","explanation":"<p>Chi phí vận chuyển 231.000 đồng là giá đã gồm thuế GTGT 10%, nên phần tính vào giá hàng là 231.000 / 1,1 = 210.000 đồng (thuế GTGT 21.000 được khấu trừ). Phân bổ cho 210 kg: 1.000 đồng/kg.<\/p><p>Đơn giá lô nhập = 10.150 + 1.000 = 11.150 đồng/kg. Xuất 150 kg theo FIFO: 100 kg tồn đầu kỳ x 10.000 + 50 kg lô nhập x 11.150.<\/p><table class=\"t\"><tbody><tr><td>100 x 10.000<\/td><td class=\"num\">1.000.000<\/td><\/tr><tr><td>50 x 11.150<\/td><td class=\"num\">557.500<\/td><\/tr><tr><td>Giá trị xuất kho<\/td><td class=\"num\">1.557.500<\/td><\/tr><\/tbody><\/table><p>Phương án D (1.562.500) xảy ra khi tính cả thuế GTGT vào chi phí vận chuyển (11.250/kg). A, B sai.<\/p>","source":"Slide Chương 4, slide 36, 39 (FIFO); TT200 (TK 156, thuế GTGT khấu trừ)","status":"ok"}]},{"id":"other-de1-u023","context":null,"questions":[{"id":"other-de1-q023","num":"Câu 23","type":"mcq","text":"<p>Báo cáo kết quả hoạt động kinh doanh là?<\/p>","options":[{"id":"other-de1-q023-A","text":"Báo cáo tài chính tổng hợp phản ánh tình hình chi phí sản xuất phát sinh và sản lượng sản xuất của doanh nghiệp trong một kỳ kế toán"},{"id":"other-de1-q023-B","text":"Báo cáo tài chính tổng hợp phản ánh tình hình và kết quả hoạt động kinh doanh của đơn vị trong một kỳ kế toán"},{"id":"other-de1-q023-C","text":"Báo cáo tài chính tổng hợp phản ánh tình hình và kết quả hoạt động kinh của đơn vị tại một thời điểm nhất định"},{"id":"other-de1-q023-D","text":"Báo cáo tài chính tổng hợp phản ánh tình hình và kết quả lao động của công nhân viên trong đơn vị tại một thời điểm nhất định"}],"correctOptionId":"other-de1-q023-B","answerBasis":"given","explanation":"<p>Báo cáo kết quả hoạt động kinh doanh là BCTC tổng hợp phản ánh tình hình và kết quả hoạt động kinh doanh của đơn vị trong một kỳ kế toán (báo cáo dòng, theo kỳ).<\/p><p>A, D mô tả sai nội dung; C sai vì phản ánh tại một thời điểm (đó là đặc điểm của báo cáo tình hình tài chính).<\/p>","source":"Slide Chương 2, slide 29–30 (báo cáo kết quả hoạt động kinh doanh)","status":"ok"}]},{"id":"other-de1-u024","context":null,"questions":[{"id":"other-de1-q024","num":"Câu 24","type":"mcq","text":"<p>Lợi nhuận gộp từ việc bán hàng và cung cấp dịch vụ được xác định?<\/p>","options":[{"id":"other-de1-q024-A","text":"Doanh thu bán hàng và cung cấp dịch vụ - Giá vốn hàng bán"},{"id":"other-de1-q024-B","text":"Doanh thu thuần về bán hàng hóa và cung cấp dịch vụ - Giá vốn hàng bán"},{"id":"other-de1-q024-C","text":"Doanh thu bán hàng và cung cấp dịch vụ - Các khoản giảm trừ"},{"id":"other-de1-q024-D","text":"Doanh thu thuần về bán hàng và cung cấp dịch vụ - Chi phí hoạt động sản xuất kinh doanh"}],"correctOptionId":"other-de1-q024-B","answerBasis":"given","explanation":"<p>Lợi nhuận gộp = Doanh thu thuần về bán hàng và cung cấp dịch vụ - Giá vốn hàng bán, trong đó doanh thu thuần = doanh thu - các khoản giảm trừ.<\/p><p>A dùng doanh thu chưa trừ giảm trừ. C thiếu giá vốn. D trừ chi phí hoạt động SXKD (chứ không phải giá vốn).<\/p>","source":"Slide Chương 2 (báo cáo KQHĐKD); Slide Chương 1, slide 67; Slide Chương 5, slide 66, 72","status":"ok"}]},{"id":"other-de1-u025","context":null,"questions":[{"id":"other-de1-q025","num":"Câu 25","type":"mcq","text":"<p>Các khoản giảm trừ doanh thu bao gồm?<\/p>","options":[{"id":"other-de1-q025-A","text":"Chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại"},{"id":"other-de1-q025-B","text":"Chiết khấu thanh toán, giảm giá hàng bán, hàng bán bị trả lại"},{"id":"other-de1-q025-C","text":"Chiết khấu thương mại, chiết khấu thanh toán, hàng bán bị trả lại"},{"id":"other-de1-q025-D","text":"Chiết khấu thương mại, chiết khấu thanh toán giảm giá hàng bán, hàng bán bị trả lại"}],"correctOptionId":"other-de1-q025-A","answerBasis":"given","explanation":"<p>Các khoản giảm trừ doanh thu (TK 521): chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại.<\/p><p>Chiết khấu thanh toán không phải giảm trừ doanh thu mà là chi phí tài chính (TK 635), nên B, C, D sai.<\/p>","source":"Slide Chương 5, slide 66 (TK 521); TT200 (TK 521, 635)","status":"ok"}]},{"id":"other-de1-u026","context":null,"questions":[{"id":"other-de1-q026","num":"Câu 26","type":"mcq","text":"<p>Bảng báo cáo tình hình tài chính là báo cáo tài chính tổng hợp phản ánh?<\/p>","options":[{"id":"other-de1-q026-A","text":"Chi tiết về tình hình tài sản của doanh nghiệp tại một thời điểm nhất định"},{"id":"other-de1-q026-B","text":"Chi tiết về tình hình nguồn hình tài sản của doanh nghiệp trong một kỳ kế toán"},{"id":"other-de1-q026-C","text":"Chi tiết về tình hình tài sản và nguồn hình thành tài sản của doanh nghiệp trong một kỳ kế toán"},{"id":"other-de1-q026-D","text":"Chi tiết về tình hình tài sản và nguồn hình thành tài sản của doanh nghiệp tại một thời điểm nhất định"}],"correctOptionId":"other-de1-q026-D","answerBasis":"given","explanation":"<p>Báo cáo tình hình tài chính (bảng cân đối kế toán) là BCTC tổng hợp phản ánh tài sản và nguồn hình thành tài sản của đơn vị tại một thời điểm nhất định.<\/p><p>A, B thiếu một vế; B, C sai thời gian (trong một kỳ).<\/p>","source":"Slide Chương 2, slide 31 (báo cáo tình hình tài chính)","status":"ok"}]},{"id":"other-de1-u027","context":null,"questions":[{"id":"other-de1-q027","num":"Câu 27","type":"mcq","text":"<p>Doanh nghiệp lập Báo cáo lưu chuyển tiền tệ theo phương pháp?<\/p>","options":[{"id":"other-de1-q027-A","text":"Phương pháp trực tiếp"},{"id":"other-de1-q027-B","text":"Phương pháp gián tiếp"},{"id":"other-de1-q027-C","text":"Phương pháp trực tiếp hoặc phương pháp gián tiếp tùy thuộc vào doanh nghiệp"},{"id":"other-de1-q027-D","text":"Phương pháp trực tiếp và phương pháp gián tiếp"}],"correctOptionId":"other-de1-q027-C","answerBasis":"given","explanation":"<p>Doanh nghiệp được chọn lập Báo cáo lưu chuyển tiền tệ theo phương pháp trực tiếp hoặc gián tiếp tùy doanh nghiệp (đều được chế độ cho phép).<\/p><p>A, B chỉ nêu một phương pháp; D ngụ ý áp dụng đồng thời cả hai.<\/p>","source":"Slide Chương 2, slide 48–49 (báo cáo lưu chuyển tiền tệ); TT200/TT133 (BCLCTT)","status":"ok"}]},{"id":"other-de1-u028","context":null,"questions":[{"id":"other-de1-q028","num":"Câu 28","type":"mcq","text":"<p>Vào đầu niên độ tài chính 01/01/N, nguồn vốn chủ sở hữu của công ty là 7 tỷ đồng, nợ phải trả là 2 tỷ đồng, tài sản dài hạn là 5 tỷ đồng, tài sản ngắn hạn của công ty là?<\/p>","options":[{"id":"other-de1-q028-A","text":"4 tỷ đồng"},{"id":"other-de1-q028-B","text":"5 tỷ đồng"},{"id":"other-de1-q028-C","text":"6 tỷ đồng"},{"id":"other-de1-q028-D","text":"7 tỷ đồng"}],"correctOptionId":"other-de1-q028-A","answerBasis":"given","explanation":"<p>Tổng nguồn vốn = 7 + 2 = 9 tỷ đồng = Tổng tài sản. Tài sản ngắn hạn = 9 - 5 = 4 tỷ đồng.<\/p><p>Kiểm tra: 4 + 5 = 9 = 7 + 2.<\/p>","source":"Slide Chương 1, slide 23–31 (phương trình kế toán: Tài sản = Nợ phải trả + Vốn chủ sở hữu)","status":"ok"}]},{"id":"other-de1-u029","context":null,"questions":[{"id":"other-de1-q029","num":"Câu 29","type":"mcq","text":"<p>Chuyển khoản thanh toán tiền lương cho người lao động làm?<\/p>","options":[{"id":"other-de1-q029-A","text":"Giá trị tổng tài sản và tổng nguồn vốn của doanh nghiệp cùng tăng"},{"id":"other-de1-q029-B","text":"Giá trị tổng tài sản và tổng nguồn vốn của doanh nghiệp cùng giảm"},{"id":"other-de1-q029-C","text":"Giá trị tổng tài sản và tổng nguồn vốn của doanh nghiệp không thay đổi"},{"id":"other-de1-q029-D","text":"Giá trị tổng tài sản của doanh nghiệp tăng, giá trị tổng nguồn vốn của doanh nghiệp giảm"}],"correctOptionId":"other-de1-q029-B","answerBasis":"given","explanation":"<p>Chuyển khoản trả lương: Nợ TK 334 / Có TK 112. Nợ phải trả giảm (nguồn vốn giảm) và tiền gửi giảm (tài sản giảm), tức tổng tài sản và tổng nguồn vốn cùng giảm.<\/p><div class=\"je\"><div>Nợ TK 334 &nbsp; xxx<\/div><div class=\"cr\">Có TK 112 &nbsp; xxx<\/div><\/div>","source":"Slide Chương 3, slide 65 (quan hệ đối ứng); Slide Chương 5, slide 38 (kế toán tiền lương)","status":"ok"}]},{"id":"other-de1-u030","context":null,"questions":[{"id":"other-de1-q030","num":"Câu 30","type":"mcq","text":"<p>Doanh nghiệp đầu tư vào công ty liên doanh liên kết bằng tài sản cố định làm?<\/p>","options":[{"id":"other-de1-q030-A","text":"Giá trị tài sản cố định tăng, giá trị vốn chủ sở hữu tăng"},{"id":"other-de1-q030-B","text":"Giá trị tài sản cố định giảm, giá trị vốn chủ sở hữu giảm"},{"id":"other-de1-q030-C","text":"Giá trị tài sản cố định giảm, giá trị đầu tư vào công ty liên doanh liên kết tăng"},{"id":"other-de1-q030-D","text":"Giá trị tài sản cố định tăng, giá trị đầu tư vào công ty liên doanh liên kết giảm"}],"correctOptionId":"other-de1-q030-C","answerBasis":"given","explanation":"<p>Góp vốn vào công ty liên doanh, liên kết bằng TSCĐ: Nợ TK 222 / Có TK 211 (kèm TK 214, 711, 811 nếu có chênh lệch). TSCĐ giảm, khoản đầu tư vào công ty liên doanh, liên kết tăng.<\/p><p>A, B, D sai vì không làm vốn chủ sở hữu thay đổi và ghi sai chiều TSCĐ/đầu tư.<\/p>","source":"Slide Chương 1, slide 27 (đầu tư vào công ty liên doanh, liên kết); TT200 (TK 222, 211)","status":"ok"}]},{"id":"other-de1-u031","context":null,"questions":[{"id":"other-de1-q031","num":"Câu 31","type":"mcq","text":"<p>Người sử dụng thông tin bên trong doanh nghiệp là?<\/p>","options":[{"id":"other-de1-q031-A","text":"Nhà nước"},{"id":"other-de1-q031-B","text":"Cơ quan thuế"},{"id":"other-de1-q031-C","text":"Nhà đầu tư"},{"id":"other-de1-q031-D","text":"Ban Giám đốc"}],"correctOptionId":"other-de1-q031-D","answerBasis":"given","explanation":"<p>Ban Giám đốc (nhà quản lý) là người sử dụng thông tin kế toán bên trong doanh nghiệp.<\/p><p>Nhà nước, cơ quan thuế, nhà đầu tư là đối tượng sử dụng thông tin bên ngoài doanh nghiệp.<\/p>","source":"Slide Chương 1, slide 13–18 (đối tượng sử dụng thông tin kế toán)","status":"ok"}]},{"id":"other-de1-u032","context":null,"questions":[{"id":"other-de1-q032","num":"Câu 32","type":"mcq","text":"<p>Khoản mục nào sau đây không phải tài sản ngắn hạn của doanh nghiệp?<\/p>","options":[{"id":"other-de1-q032-A","text":"Tiền và các khoản tương đương tiền"},{"id":"other-de1-q032-B","text":"Chứng khoán kinh doanh"},{"id":"other-de1-q032-C","text":"Hàng tồn kho"},{"id":"other-de1-q032-D","text":"Tài sản cố định vô hình"}],"correctOptionId":"other-de1-q032-D","answerBasis":"given","explanation":"<p>Tài sản cố định vô hình là tài sản dài hạn. Tiền và tương đương tiền, chứng khoán kinh doanh, hàng tồn kho là tài sản ngắn hạn.<\/p>","source":"Slide Chương 1, slide 23–25; Slide Chương 2, slide 33 (tài sản ngắn hạn, dài hạn)","status":"ok"}]},{"id":"other-de1-u033","context":null,"questions":[{"id":"other-de1-q033","num":"Câu 33","type":"mcq","text":"<p>Khoản mục nào sau đây không phải tài sản dài hạn của doanh nghiệp?<\/p>","options":[{"id":"other-de1-q033-A","text":"Các khoản đầu tư tài chính dài hạn"},{"id":"other-de1-q033-B","text":"TSCĐ thuê tài chính"},{"id":"other-de1-q033-C","text":"Hàng tồn kho"},{"id":"other-de1-q033-D","text":"Tài sản cố định vô hình"}],"correctOptionId":"other-de1-q033-C","answerBasis":"given","explanation":"<p>Hàng tồn kho là tài sản ngắn hạn, không phải tài sản dài hạn. Đầu tư tài chính dài hạn, TSCĐ thuê tài chính, TSCĐ vô hình đều là tài sản dài hạn.<\/p>","source":"Slide Chương 1, slide 23–25; Slide Chương 2, slide 33","status":"ok"}]},{"id":"other-de1-u034","context":null,"questions":[{"id":"other-de1-q034","num":"Câu 34","type":"mcq","text":"<p>Khoản mục nào sau đây không phải là nợ phải trả của doanh nghiệp?<\/p>","options":[{"id":"other-de1-q034-A","text":"Thuế phải nộp cho nhà nước"},{"id":"other-de1-q034-B","text":"Phải trả cho người bán"},{"id":"other-de1-q034-C","text":"Phải trả người lao động"},{"id":"other-de1-q034-D","text":"Thặng dư vốn cổ phần"}],"correctOptionId":"other-de1-q034-D","answerBasis":"given","explanation":"<p>Thặng dư vốn cổ phần là một khoản của vốn chủ sở hữu, không phải nợ phải trả. Thuế phải nộp nhà nước, phải trả người bán, phải trả người lao động đều là nợ phải trả.<\/p>","source":"Slide Chương 1, slide 23, 28–30 (nợ phải trả, vốn chủ sở hữu); Slide Chương 2","status":"ok"}]},{"id":"other-de1-u035","context":null,"questions":[{"id":"other-de1-q035","num":"Câu 35","type":"mcq","text":"<p>Các chính sách và phương pháp kế toán doanh nghiệp đã chọn phải được áp dụng thống nhất ít nhất trong một kỳ kế toán năm. Trường hợp có thay đổi chính sách và phương pháp kế toán đã chọn thì phải giải trình lý do và ảnh hưởng của sự thay đổi đó trong phần thuyết minh báo cáo tài chính. Đây là nội dung nguyên tắc kế toán nào?<\/p>","options":[{"id":"other-de1-q035-A","text":"Cơ sở dồn tích"},{"id":"other-de1-q035-B","text":"Nhất quán"},{"id":"other-de1-q035-C","text":"Phù hợp"},{"id":"other-de1-q035-D","text":"Trọng yếu"}],"correctOptionId":"other-de1-q035-B","answerBasis":"given","explanation":"<p>Nguyên tắc nhất quán: chính sách, phương pháp kế toán đã chọn phải áp dụng thống nhất ít nhất trong một kỳ kế toán năm; nếu thay đổi phải giải trình lý do và ảnh hưởng trong thuyết minh BCTC.<\/p><p>Cơ sở dồn tích, phù hợp, trọng yếu có nội dung khác.<\/p>","source":"Slide Chương 1, slide 59–60, 68 (nguyên tắc nhất quán); Slide Chương 4, slide 9","status":"ok"}]},{"id":"other-de1-u036","context":"<p>Công ty cổ phần An An có các tài liệu sau:<\/p><p><b>I. Số dư đầu kỳ<\/b><\/p><ul><li>TK Chi phí sản xuất kinh doanh dở dang (TK 154): 15.000.000 đồng<\/li><li>TK Thành phẩm (TK 155): 30.000.000 đồng (200 sản phẩm)<\/li><\/ul><p><b>II. Tình hình sản xuất tiêu thụ và trong kỳ (đơn vị tính: đồng)<\/b><\/p><p>1. Tập hợp chi phí SX phát sinh trong tháng:<\/p><table class=\"t\"><thead><tr><th>Khoản mục chi phí \\ Đối tượng<\/th><th>Trực tiếp SX<\/th><th>Phục vụ SX<\/th><\/tr><\/thead><tbody><tr><td>Nguyên vật liệu<\/td><td class=\"num\">100.000.000<\/td><td class=\"num\">20.000.000<\/td><\/tr><tr><td>Công cụ dụng cụ<\/td><td class=\"num\"><\/td><td class=\"num\">10.000.000<\/td><\/tr><tr><td>Tiền lương<\/td><td class=\"num\">80.000.000<\/td><td class=\"num\">20.000.000<\/td><\/tr><tr><td>Các khoản trích theo lương<\/td><td class=\"num\">?<\/td><td class=\"num\">?<\/td><\/tr><tr><td>Khấu hao TSCĐ<\/td><td class=\"num\"><\/td><td class=\"num\">25.000.000<\/td><\/tr><\/tbody><\/table><p>2. Kết quả SX:<\/p><ul><li>Hoàn thành nhập kho: 2.000 sản phẩm<\/li><li>Chi phí sản xuất dở dang cuối tháng: 9.000.000 đồng<\/li><\/ul>","questions":[{"id":"other-de1-q036","num":"Câu 36","type":"mcq","text":"<p>Các khoản trích theo lương của người lao động ghi nhận vào chi phí của doanh nghiệp (TK 622 và 627) là?<\/p>","options":[{"id":"other-de1-q036-A","text":"18.800.000 đồng và 4.700.000 đồng"},{"id":"other-de1-q036-B","text":"80.000.000 đồng và 20.000.000 đồng"},{"id":"other-de1-q036-C","text":"23.500.000 đồng và 10.500.000 đồng"},{"id":"other-de1-q036-D","text":"34.000.000 đồng và 100.000.000 đồng"}],"correctOptionId":"other-de1-q036-A","answerBasis":"given","explanation":"<p>Tỷ lệ trích theo lương (slide): doanh nghiệp chịu 17,5% BHXH + 3% BHYT + 1% BHTN + 2% KPCĐ = 23,5%; người lao động chịu 8% + 1,5% + 1% = 10,5%.<\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>TK 621/154 (trực tiếp)<\/th><th>TK 627 (phục vụ)<\/th><\/tr><\/thead><tbody><tr><td>Lương<\/td><td class=\"num\">80.000.000<\/td><td class=\"num\">20.000.000<\/td><\/tr><tr><td>Trích theo lương DN chịu (17,5% + 3% + 1% + 2% = 23,5%)<\/td><td class=\"num\">18.800.000<\/td><td class=\"num\">4.700.000<\/td><\/tr><\/tbody><\/table><p>TK 622: 80.000.000 x 23,5% = 18.800.000; TK 627: 20.000.000 x 23,5% = 4.700.000. Đáp án A.<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 18.800.000<\/div><div>Nợ TK 627 &nbsp; 4.700.000<\/div><div class=\"cr\">Có TK 338 &nbsp; 23.500.000<\/div><\/div><p>B là tiền lương; C là tổng trích (23.500.000) và phần NLĐ chịu (10.500.000); D sai số liệu.<\/p>","source":"Slide Chương 5, slide 39–41 (BHXH 17,5%/8%, BHYT 3%/1,5%, KPCĐ 2%, BHTN 1%/1%); TT200 (TK 334, 338)","status":"ok"},{"id":"other-de1-q037","num":"Câu 37","type":"mcq","text":"<p>Các khoản trích theo lương của người lao động ghi nhận vào bên Nợ TK Phải trả người lao động (TK 334) là?<\/p>","options":[{"id":"other-de1-q037-A","text":"10.500.000 đồng"},{"id":"other-de1-q037-B","text":"23.500.000 đồng"},{"id":"other-de1-q037-C","text":"34.000.000 đồng"},{"id":"other-de1-q037-D","text":"100.000.000 đồng"}],"correctOptionId":"other-de1-q037-A","answerBasis":"given","explanation":"<p>Phần NLĐ chịu 10,5% được khấu trừ vào lương: Nợ TK 334 / Có TK 338. Tổng lương = 80.000.000 + 20.000.000 = 100.000.000 nên 100.000.000 x 10,5% = 10.500.000.<\/p><div class=\"je\"><div>Nợ TK 334 &nbsp; 10.500.000<\/div><div class=\"cr\">Có TK 338 &nbsp; 10.500.000<\/div><\/div><p>B (23.500.000) là phần DN chịu; C (34.000.000) là cả hai phần; D (100.000.000) là tổng tiền lương, không phải khoản trích.<\/p>","source":"Slide Chương 5, slide 39–41 (BHXH 17,5%/8%, BHYT 3%/1,5%, KPCĐ 2%, BHTN 1%/1%); TT200 (TK 334, 338)","status":"ok"},{"id":"other-de1-q038","num":"Câu 38","type":"mcq","text":"<p>Tổng giá thành thực tế sản phẩm là?<\/p>","options":[{"id":"other-de1-q038-A","text":"271.500.000 đồng"},{"id":"other-de1-q038-B","text":"284.500.000 đồng"},{"id":"other-de1-q038-C","text":"293.500.000 đồng"},{"id":"other-de1-q038-D","text":"295.000.000 đồng"}],"correctOptionId":"other-de1-q038-B","answerBasis":"given","explanation":"<p>Tổng giá thành = CPSX dở dang đầu kỳ + chi phí phát sinh trong kỳ - CPSX dở dang cuối kỳ.<\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>CP SX dở dang đầu kỳ (TK 154)<\/td><td class=\"num\">15.000.000<\/td><\/tr><tr><td>Chi phí nguyên vật liệu trực tiếp<\/td><td class=\"num\">100.000.000<\/td><\/tr><tr><td>Chi phí nhân công trực tiếp (80.000.000 + 18.800.000)<\/td><td class=\"num\">98.800.000<\/td><\/tr><tr><td>Chi phí sản xuất chung: 20.000.000 + 10.000.000 + (20.000.000 + 4.700.000) + 25.000.000<\/td><td class=\"num\">79.700.000<\/td><\/tr><tr><td>Tổng chi phí cần phân bổ<\/td><td class=\"num\">293.500.000<\/td><\/tr><tr><td>Trừ CP SX dở dang cuối kỳ<\/td><td class=\"num\">(9.000.000)<\/td><\/tr><tr><td>Tổng giá thành thực tế<\/td><td class=\"num\">284.500.000<\/td><\/tr><\/tbody><\/table><p>Kiểm tra: 15 + (100 + 98,8 + 79,7) - 9 = 284,5 triệu. Đáp án B.<\/p>","source":"Slide Chương 5, slide 48–63 (tập hợp chi phí, tính giá thành, TK 154, 155); TT200 (TK 621, 622, 627, 154, 155)","status":"ok"},{"id":"other-de1-q039","num":"Câu 39","type":"mcq","text":"<p>Giá thành sản xuất 1 đơn vị sản phẩm là?<\/p>","options":[{"id":"other-de1-q039-A","text":"137.750 đồng"},{"id":"other-de1-q039-B","text":"142.250 đồng"},{"id":"other-de1-q039-C","text":"146.750 đồng"},{"id":"other-de1-q039-D","text":"147.500 đồng"}],"correctOptionId":"other-de1-q039-B","answerBasis":"given","explanation":"<p>Giá thành đơn vị = Tổng giá thành / số sản phẩm hoàn thành = 284.500.000 / 2.000 = 142.250 đồng/sản phẩm.<\/p><p>Tổng giá thành 284.500.000 được tính ở câu 38.<\/p>","source":"Slide Chương 5, slide 48–63 (tập hợp chi phí, tính giá thành, TK 154, 155); TT200 (TK 621, 622, 627, 154, 155)","status":"ok"},{"id":"other-de1-q040","num":"Câu 40","type":"mcq","text":"<p>Số dư cuối kỳ của TK Thành phẩm (TK 155) là?<\/p>","options":[{"id":"other-de1-q040-A","text":"301.500.000 đồng"},{"id":"other-de1-q040-B","text":"314.500.000 đồng"},{"id":"other-de1-q040-C","text":"323.500.000 đồng"},{"id":"other-de1-q040-D","text":"325.000.000 đồng"}],"correctOptionId":"other-de1-q040-B","answerBasis":"given","explanation":"<p>Số dư cuối kỳ TK 155 = Số dư đầu kỳ + giá thành thành phẩm nhập kho - giá vốn xuất bán = 30.000.000 + 284.500.000 - 0 = 314.500.000 (đề không cho số liệu thành phẩm xuất bán nên coi như chưa tiêu thụ).<\/p><p>Đơn giá đầu kỳ 30.000.000 / 200 = 150.000 đồng; tồn cuối kỳ 2.200 sản phẩm.<\/p>","source":"Slide Chương 5, slide 48–63 (tập hợp chi phí, tính giá thành, TK 154, 155); TT200 (TK 621, 622, 627, 154, 155)","status":"needs_review","reviewNote":"Đề nêu \"tình hình sản xuất tiêu thụ\" nhưng không có dữ liệu tiêu thụ; đáp án B khớp khi không có sản phẩm xuất bán. Cần đối chiếu đề gốc nếu có phần tiêu thụ."}]}]},{"key":"deon1","title":"Đề ôn có đáp án 1","units":[{"id":"other-deon1-u001","context":null,"questions":[{"id":"other-deon1-q001","num":"Câu 1","type":"mcq","text":"Trái phiếu phát hành là:","options":[{"id":"other-deon1-q001-A","text":"Khoản đầu tư tài chính."},{"id":"other-deon1-q001-B","text":"Một khoản tiền mặt."},{"id":"other-deon1-q001-C","text":"Khoản nợ phải trả."},{"id":"other-deon1-q001-D","text":"Khoản vốn của chủ sở hữu."}],"correctOptionId":"other-deon1-q001-C","explanation":"<p>Doanh nghiệp phát hành trái phiếu là đi vay: nhận tiền từ nhà đầu tư và có nghĩa vụ hoàn trả gốc, lãi nên đây là <b>khoản nợ phải trả<\/b> (TK 343). Phương án A sai vì đó là góc nhìn của người mua trái phiếu; B sai vì tiền mặt là tài sản thu được; D sai vì chỉ cổ phiếu mới là vốn chủ sở hữu.<\/p>","source":"Slide Chương 1 (đối tượng kế toán: nợ phải trả, slide 37); TT200 (TK 343)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u002","context":null,"questions":[{"id":"other-deon1-q002","num":"Câu 2","type":"mcq","text":"Doanh nghiệp mua một tài sản cố định, giá mua đã có thuế GTGT là 315.000.000 đồng (biết rằng GTGT là 5%) chưa trả tiền người bán. Chi phí vận chuyển là 220.000 đồng (trong đó GTGT là 10%) bằng tiền mặt. Chi phí lắp đặt là 400.000 đồng, GTGT là 5% chưa thanh toán. Nguyên giá của tài sản cố định sẽ là?","options":[{"id":"other-deon1-q002-A","text":"300.000.000 đồng"},{"id":"other-deon1-q002-B","text":"315.640.000 đồng"},{"id":"other-deon1-q002-C","text":"300.600.000 đồng"},{"id":"other-deon1-q002-D","text":"300.640.000 đồng"}],"correctOptionId":"other-deon1-q002-C","explanation":"<p>Thuế GTGT được khấu trừ (TK 133) nên không tính vào nguyên giá.<\/p><ul><li>Giá mua chưa thuế: 315.000.000 / 1,05 = 300.000.000<\/li><li>Vận chuyển: 220.000 đã gồm GTGT 10% nên chưa thuế = 200.000<\/li><li>Lắp đặt: 400.000 (hiểu là giá chưa thuế, thuế GTGT 5% = 20.000 tính thêm)<\/li><\/ul><p>Nguyên giá = 300.000.000 + 200.000 + 400.000 = <b>300.600.000<\/b> đồng (C). A thiếu chi phí; B cộng cả thuế; D hiểu 220.000 là giá chưa thuế.<\/p>","source":"Slide Chương 4 (nguyên giá TSCĐ, slide 18–21); Slide Chương 5 slide 8; TT200 (TK 211, 133)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u003","context":null,"questions":[{"id":"other-deon1-q003","num":"Câu 3","type":"mcq","text":"Tài khoản “Hao mòn tài sản cố định” là:","options":[{"id":"other-deon1-q003-A","text":"Tài khoản tài sản."},{"id":"other-deon1-q003-B","text":"Tài khoản điều chỉnh giảm tài sản."},{"id":"other-deon1-q003-C","text":"Tài khoản nguồn vốn."},{"id":"other-deon1-q003-D","text":"Tài khoản điều chỉnh giảm nguồn vốn."}],"correctOptionId":"other-deon1-q003-B","explanation":"<p>TK 214 có số dư Có, dùng để ghi giảm giá trị TSCĐ (nguyên giá) khi lập báo cáo nên là <b>tài khoản điều chỉnh giảm tài sản<\/b>. Slide ghi: số dư Có TK điều chỉnh giảm ghi số âm phần tài sản (214, 229).<\/p>","source":"Slide Chương 2, slide 38–39; Slide Chương 3 (phân loại tài khoản, slide 43)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u004","context":null,"questions":[{"id":"other-deon1-q004","num":"Câu 4","type":"mcq","text":"Phân loại tài khoản theo nội dung kinh tế:","options":[{"id":"other-deon1-q004-A","text":"Phân thành 2 loại: tài khoản tài sản và tài khoản nguồn vốn."},{"id":"other-deon1-q004-B","text":"Phân thành 3 loại: tài khoản tài sản, tài khoản nguồn vốn và tài khoản trung gian."},{"id":"other-deon1-q004-C","text":"Phân thành 4 loại: tài khoản tài sản, tài khoản nguồn vốn, tài khoản doanh thu và tài khoản chi phí."},{"id":"other-deon1-q004-D","text":"Phân thành 3 loại: tài khoản chủ yếu, tài khoản điều chỉnh và tài khoản nghiệp vụ."}],"correctOptionId":"other-deon1-q004-B","explanation":"<p>Theo nội dung kinh tế: TK phản ánh tài sản, TK phản ánh nguồn vốn và TK phản ánh quá trình kinh doanh (trung gian: doanh thu, chi phí, xác định KQKD) = 3 loại (B). A thiếu nhóm trung gian; C chia doanh thu và chi phí thành 2 loại riêng không phải cách phân loại này; D là phân loại theo công dụng và kết cấu.<\/p>","source":"Slide Chương 3, slide 43 (2.4 Phân loại tài khoản)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u005","context":null,"questions":[{"id":"other-deon1-q005","num":"Câu 5","type":"mcq","text":"Nghiệp vụ “Mua chịu vật liệu nhập kho” có được ghi vào sổ kế toán không? Theo nguyên tắc nào?","options":[{"id":"other-deon1-q005-A","text":"Không, theo nguyên tắc thận trọng"},{"id":"other-deon1-q005-B","text":"Có, theo nguyên tắc trọng yếu"},{"id":"other-deon1-q005-C","text":"Có, theo nguyên tắc cơ sở dồn tích"},{"id":"other-deon1-q005-D","text":"Có, theo nguyên tắc phù hợp"}],"correctOptionId":"other-deon1-q005-C","explanation":"<p>Theo cơ sở dồn tích, nghiệp vụ được ghi sổ vào thời điểm phát sinh, không chờ thu hoặc chi tiền. Mua chịu vật liệu đã nhập kho nên phải ghi ngay (Nợ TK 152 / Có TK 331). A sai vì vẫn phải ghi; B, D không phải nguyên tắc quyết định thời điểm ghi nhận.<\/p>","source":"Slide Chương 1, slide 60–62 (cơ sở dồn tích)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u006","context":null,"questions":[{"id":"other-deon1-q006","num":"Câu 6","type":"mcq","text":"Kế toán tổng hợp sử dụng thước đo:","options":[{"id":"other-deon1-q006-A","text":"Hiện vật."},{"id":"other-deon1-q006-B","text":"Giá trị."},{"id":"other-deon1-q006-C","text":"Giá trị và hiện vật."},{"id":"other-deon1-q006-D","text":"Giá trị, hiện vật và thời gian lao động."}],"correctOptionId":"other-deon1-q006-B","explanation":"<p>Kế toán tổng hợp (tài khoản cấp 1) chỉ sử dụng thước đo giá trị (tiền tệ); kế toán chi tiết mới dùng thước đo giá trị, hiện vật và thời gian lao động (D là của kế toán chi tiết).<\/p>","source":"Slide Chương 3, slide 72 (kế toán tổng hợp và chi tiết)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u007","context":null,"questions":[{"id":"other-deon1-q007","num":"Câu 7","type":"mcq","text":"Doanh nghiệp nộp thuế GTGT theo phương pháp khấu trừ mua một tài sản cố định giá mua 10.000.000đ, thuế GTGT 10%, tiền vận chuyển lắp đặt 1.000.000đ, thuế GTGT 5%. Vậy nguyên giá của tài sản cố định là","options":[{"id":"other-deon1-q007-A","text":"11.000.000đ"},{"id":"other-deon1-q007-B","text":"11.500.000đ"},{"id":"other-deon1-q007-C","text":"12.500.000đ"},{"id":"other-deon1-q007-D","text":"12.550.000đ"}],"correctOptionId":"other-deon1-q007-A","explanation":"<p>Thuế GTGT đầu vào được khấu trừ nên không tính vào nguyên giá. Nguyên giá = 10.000.000 + 1.000.000 = <b>11.000.000đ<\/b> (giả thiết 10.000.000 và 1.000.000 là giá chưa thuế). Các phương án khác cộng thêm thuế GTGT (1.000.000 + 50.000...) là sai.<\/p>","source":"Slide Chương 4 (nguyên giá TSCĐ); Slide Chương 5, slide 8; TT200 (TK 211, 133)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u008","context":null,"questions":[{"id":"other-deon1-q008","num":"Câu 8","type":"mcq","text":"Nếu phân loại sổ kế toán theo cách ghi chép thì sổ cái thuộc loại ","options":[{"id":"other-deon1-q008-A","text":"Sổ ghi chép theo thứ tự thời gian"},{"id":"other-deon1-q008-B","text":"Sổ liên hợp"},{"id":"other-deon1-q008-C","text":"Sổ ghi chép theo hệ thống"},{"id":"other-deon1-q008-D","text":"Sổ chi tiết"}],"correctOptionId":"other-deon1-q008-C","explanation":"<p>Theo cách ghi chép: sổ ghi theo thời gian (Nhật ký chung), sổ ghi theo hệ thống (Sổ cái, sổ chi tiết), sổ kết hợp (Nhật ký – Sổ cái). Sổ cái thuộc loại <b>ghi theo hệ thống<\/b>. D sai vì sổ chi tiết là phân loại theo nội dung ghi chép.<\/p>","source":"Slide Chương 3, slide 77","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u009","context":"<p>Có số liệu như sau: tồn kho đầu kì 800kg với đơn giá 20.000đ. Nhập kho 400kg vật liệu chưa trả người bán, giá mua chưa thuế là 24.000đ/kg, thuế GTGT 10%, chi phí vận chuyển là 800.000đ, sau đó xuất kho 1000kg vật liệu dùng trực tiếp để sản xuất sản phẩm 900kg, dùng cho phân xưởng 100kg.<\/p>","questions":[{"id":"other-deon1-q009","num":"Câu 9","type":"mcq","text":"Tính giá xuất kho theo phương pháp bình quân gia quyền một lần vào cuối kỳ:","options":[{"id":"other-deon1-q009-A","text":"22.000đ/kg"},{"id":"other-deon1-q009-B","text":"21.300đ/kg"},{"id":"other-deon1-q009-C","text":"22.300đ/kg"},{"id":"other-deon1-q009-D","text":"21.000đ/kg"}],"correctOptionId":"other-deon1-q009-A","explanation":"<p>Giá trị: tồn đầu 800 x 20.000 = 16.000.000; nhập 400 x 24.000 + 800.000 (vận chuyển) = 10.400.000 (thuế GTGT được khấu trừ nên không tính). Tổng 26.400.000 / 1.200kg = <b>22.000đ/kg<\/b>. Kiểm tra: 22.000 x 1.200 = 26.400.000.<\/p>","source":"Slide Chương 4, slide 37–38 (bình quân gia quyền cuối kỳ)","status":"ok","answerBasis":"given"},{"id":"other-deon1-q010","num":"Câu 10","type":"mcq","text":"Định khoản nghiệp vụ xuất kho ở câu 9:","options":[{"id":"other-deon1-q010-A","text":"<div class=\"je\"><div>Nợ TK 621 &nbsp; 2.200.000đ<\/div><div>Nợ TK 627 &nbsp; 19.800.000đ<\/div><div class=\"cr\">Có TK 152 &nbsp; 22.000.000đ<\/div><\/div>"},{"id":"other-deon1-q010-B","text":"<div class=\"je\"><div>Nợ TK 621 &nbsp; 22.000.000đ<\/div><div class=\"cr\">Có TK 152 &nbsp; 22.000.000đ<\/div><\/div>"},{"id":"other-deon1-q010-C","text":"<div class=\"je\"><div>Nợ TK 621 &nbsp; 19.800.000đ<\/div><div>Nợ TK 627 &nbsp; 2.200.000đ<\/div><div class=\"cr\">Có TK 152 &nbsp; 22.000.000đ<\/div><\/div>"},{"id":"other-deon1-q010-D","text":"<div class=\"je\"><div>Nợ TK 627 &nbsp; 22.000.000đ<\/div><div class=\"cr\">Có TK 152 &nbsp; 22.000.000đ<\/div><\/div>"}],"correctOptionId":"other-deon1-q010-C","explanation":"<p>Giá xuất 22.000đ/kg: sản xuất sản phẩm 900kg = 19.800.000 ghi Nợ TK 621; phân xưởng 100kg = 2.200.000 ghi Nợ TK 627; Có TK 152 tổng 22.000.000. A đảo số tiền; B, D dồn cả vào một tài khoản.<\/p>","source":"Slide Chương 5, slide 29 (kế toán xuất NVL)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u010","context":null,"questions":[{"id":"other-deon1-q011","num":"Câu 11","type":"mcq","text":"Những người sử dụng thông tin kế toán có lợi ích liên quan trực tiếp là","options":[{"id":"other-deon1-q011-A","text":"Cơ quan thuế"},{"id":"other-deon1-q011-B","text":"Chủ doanh nghiệp"},{"id":"other-deon1-q011-C","text":"Tổng giám đốc"},{"id":"other-deon1-q011-D","text":"Nhà đầu tư"}],"correctOptionId":"other-deon1-q011-D","explanation":"<p>Theo khoá, đáp án là Nhà đầu tư: nhóm có lợi ích tài chính trực tiếp (nhà đầu tư, chủ nợ) khác với nhóm có lợi ích gián tiếp (cơ quan thuế, cơ quan quản lý). Lưu ý chủ doanh nghiệp, tổng giám đốc là đối tượng nội bộ nên thông tin cho họ chủ yếu là kế toán quản trị.<\/p>","source":"Slide Chương 1, slide 13–14 (đối tượng sử dụng thông tin)","status":"needs_review","answerBasis":"given","reviewNote":"Đề mơ hồ: 'chủ doanh nghiệp' cũng có thể xem là có lợi ích trực tiếp; slide không liệt kê rõ danh sách này. Giữ đáp án khoá D."}]},{"id":"other-deon1-u011","context":"<p>Cho doanh thu bán hàng và cung cấp dịch vụ là 468.800.000đ, các khoản chiết khấu thương mại là 800.000đ, giá vốn hàng bán là 320.000.000đ<\/p>","questions":[{"id":"other-deon1-q012","num":"Câu 12","type":"mcq","text":"Doanh thu thuần về bán hàng và cung cấp dịch vụ là:","options":[{"id":"other-deon1-q012-A","text":"468.000.000đ"},{"id":"other-deon1-q012-B","text":"450.000.000đ"},{"id":"other-deon1-q012-C","text":"500.000.000đ"},{"id":"other-deon1-q012-D","text":"568.000.000đ"}],"correctOptionId":"other-deon1-q012-A","explanation":"<p>Doanh thu thuần = Doanh thu bán hàng - các khoản giảm trừ = 468.800.000 - 800.000 = <b>468.000.000đ<\/b>.<\/p>","source":"Slide Chương 2, slide 41 (báo cáo kết quả hoạt động kinh doanh)","status":"ok","answerBasis":"given"},{"id":"other-deon1-q013","num":"Câu 13","type":"mcq","text":"Lợi nhuận gộp về bán hàng và cung cấp dịch vụ là:","options":[{"id":"other-deon1-q013-A","text":"184.000.000đ"},{"id":"other-deon1-q013-B","text":"150.000.000đ"},{"id":"other-deon1-q013-C","text":"148.000.000đ"},{"id":"other-deon1-q013-D","text":"105.000.000đ"}],"correctOptionId":"other-deon1-q013-C","explanation":"<p>Lợi nhuận gộp = Doanh thu thuần - Giá vốn = 468.000.000 - 320.000.000 = <b>148.000.000đ<\/b>.<\/p>","source":"Slide Chương 2, slide 41","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u012","context":null,"questions":[{"id":"other-deon1-q014","num":"Câu 14","type":"mcq","text":"Có mấy loại chứng từ kế toán theo tính chất pháp lý:","options":[{"id":"other-deon1-q014-A","text":"2"},{"id":"other-deon1-q014-B","text":"3"},{"id":"other-deon1-q014-C","text":"4"},{"id":"other-deon1-q014-D","text":"Không phân loại"}],"correctOptionId":"other-deon1-q014-A","explanation":"<p>Theo tính chất pháp lý, chứng từ gồm 2 loại: chứng từ bắt buộc và chứng từ hướng dẫn (hướng dẫn, không bắt buộc).<\/p>","source":"Slide Chương 3 (phân loại chứng từ, slide 8–17); Luật Kế toán","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u013","context":null,"questions":[{"id":"other-deon1-q015","num":"Câu 15","type":"mcq","text":"Khái niệm tổ chức kinh doanh có ý nghĩa:","options":[{"id":"other-deon1-q015-A","text":"Giúp cho kế toán xác định được phạm vi kế toán"},{"id":"other-deon1-q015-B","text":"Kế toán ghi nhận xử lý lập báo cáo trên cơ sở những dữ liệu của tổ chức kinh doanh bao gồm cả dữ liệu của cá nhân chủ sở hữu"},{"id":"other-deon1-q015-C","text":"A và B đều đúng","pinned":true},{"id":"other-deon1-q015-D","text":"A và B đều sai","pinned":true}],"correctOptionId":"other-deon1-q015-A","explanation":"<p>Khái niệm đơn vị kế toán (tổ chức kinh doanh) giúp xác định phạm vi kế toán (A đúng). B sai vì kế toán phải tách bạch dữ liệu của doanh nghiệp với dữ liệu cá nhân của chủ sở hữu. Do đó chọn A.<\/p>","source":"Slide Chương 1 (giả định đơn vị kế toán / thực thể kinh doanh)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u014","context":null,"questions":[{"id":"other-deon1-q016","num":"Câu 16","type":"mcq","text":"Giá cả dự kiến trong niên độ mới có chiều hướng giảm, kế toán quyết định sử dụng phương pháp tính giá trong niên độ mới để kế toán thuế thu nhập.","options":[{"id":"other-deon1-q016-A","text":"Nhập trước, xuất trước."},{"id":"other-deon1-q016-B","text":"Nhập sau, xuất trước."},{"id":"other-deon1-q016-C","text":"Thực tế đích danh."},{"id":"other-deon1-q016-D","text":"Bình quân gia quyền."}],"correctOptionId":"other-deon1-q016-A","explanation":"<p>Giá giảm: FIFO xuất hàng nhập trước (giá cao) nên giá vốn cao, lợi nhuận thấp, thuế thu nhập phải nộp thấp (A). Đề gốc diễn đạt chưa trọn câu (thiếu cụm 'tính thuế thu nhập thấp nhất'); khoá chọn FIFO.<\/p>","source":"Slide Chương 4, slide 39 (FIFO)","status":"needs_review","answerBasis":"given","reviewNote":"Câu đề hỏng cú pháp (thiếu mục tiêu); suy luận ngầm là giảm thuế thu nhập. Đáp án FIFO phù hợp với suy luận đó."}]},{"id":"other-deon1-u015","context":null,"questions":[{"id":"other-deon1-q017","num":"Câu 17","type":"mcq","text":"Cân đối trong tài khoản biểu hiện:","options":[{"id":"other-deon1-q017-A","text":"SD đầu kỳ = SD kỳ cuối"},{"id":"other-deon1-q017-B","text":"Phát sinh tăng = phát sinh giảm"},{"id":"other-deon1-q017-C","text":"Phát sinh nợ = phát sinh có"},{"id":"other-deon1-q017-D","text":"SD đầu kỳ + phát sinh tăng = SD cuối kỳ + phát sinh giảm"}],"correctOptionId":"other-deon1-q017-D","explanation":"<p>Tài khoản một bên: SD cuối kỳ = SD đầu kỳ + PS tăng - PS giảm, tức <b>SD đầu kỳ + PS tăng = SD cuối kỳ + PS giảm<\/b> (D). Các phương án A, B, C không đúng cho một tài khoản (C là cân đối của cả hệ thống tài khoản).<\/p>","source":"Slide Chương 3 (kết cấu tài khoản)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u016","context":null,"questions":[{"id":"other-deon1-q018","num":"Câu 18","type":"mcq","text":"Nhập kho 1.200 sản phẩm, tổng giá thành 14.400. Xuất bán 800 sản phẩm, giá chưa thuế 19 đồng/sp. Thuế GTGT 10%. Chi phí bán hàng 0,5 đồng/sp. Chi phí quản lí doanh nghiệp bằng ½ chi phí bán hàng. Vậy kết quả kinh doanh sẽ là","options":[{"id":"other-deon1-q018-A","text":"Lãi 5000"},{"id":"other-deon1-q018-B","text":"Lãi 5600"},{"id":"other-deon1-q018-C","text":"Lãi 6520"},{"id":"other-deon1-q018-D","text":"Tất cả đều sai"}],"correctOptionId":"other-deon1-q018-A","explanation":"<p>Doanh thu = 800 x 19 = 15.200 (thuế GTGT đầu ra không là doanh thu). Giá vốn = 800 x (14.400/1.200 = 12) = 9.600. CPBH = 0,5 x 800 = 400; CPQLDN = 200. Lãi = 15.200 - 9.600 - 400 - 200 = <b>5.000<\/b> (A).<\/p>","source":"Slide Chương 2, slide 41; Slide Chương 5 (giá vốn, CPBH, CPQLDN)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u017","context":null,"questions":[{"id":"other-deon1-q019","num":"Câu 19","type":"mcq","text":"Khi giá gốc của hàng hoá tồn kho cuối năm lớn hơn giá trị thị trường thì kế toán tiến hành lập dự phòng giảm giá. Việc này là do tuân thủ nguyên tắc:","options":[{"id":"other-deon1-q019-A","text":"Phù hợp"},{"id":"other-deon1-q019-B","text":"Thận trọng"},{"id":"other-deon1-q019-C","text":"Trọng yếu"},{"id":"other-deon1-q019-D","text":"Giá gốc"}],"correctOptionId":"other-deon1-q019-C","explanation":"<p>Lập dự phòng (khi giá gốc > giá trị thuần có thể thực hiện) là biểu hiện của nguyên tắc <b>thận trọng<\/b> (phải lập các khoản dự phòng nhưng không quá lớn). Theo khoá, đáp án là C (Trọng yếu) nhưng không phù hợp với slide.<\/p>","source":"Slide Chương 1, slide 69–70 (nguyên tắc thận trọng)","status":"needs_review","answerBasis":"given","reviewNote":"Khoá đáp án chọn C (Trọng yếu) nhưng kế toán/slide 69–70 cho thấy đáp án đúng là B (Thận trọng). Giữ khoá, cần giảng viên xác nhận."}]},{"id":"other-deon1-u018","context":null,"questions":[{"id":"other-deon1-q020","num":"Câu 20","type":"mcq","text":"Câu phát biểu nào sau đây không đúng?","options":[{"id":"other-deon1-q020-A","text":"Phải lập các khoản dự phòng nhưng không quá lớn."},{"id":"other-deon1-q020-B","text":"Chi phí phải được ghi nhận khi có bằng chứng về khả năng phát sinh chi phí."},{"id":"other-deon1-q020-C","text":"Không đánh giá thấp hơn giá trị của các tài sản và các khoản thu nhập."},{"id":"other-deon1-q020-D","text":"Không đánh giá thấp hơn giá trị của các khoản nợ phải trả và chi phí."}],"correctOptionId":"other-deon1-q020-C","explanation":"<p>Nguyên tắc thận trọng: không đánh giá <b>cao hơn<\/b> giá trị của tài sản và thu nhập; không đánh giá <b>thấp hơn<\/b> nợ phải trả và chi phí. Phương án C nói 'thấp hơn' đối với tài sản và thu nhập nên sai.<\/p>","source":"Slide Chương 1, slide 69","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u019","context":null,"questions":[{"id":"other-deon1-q021","num":"Câu 21","type":"mcq","text":"Nguyên tắc giá gốc xuất phát từ nguyên tắc:","options":[{"id":"other-deon1-q021-A","text":"Thận trọng"},{"id":"other-deon1-q021-B","text":"Khách quan"},{"id":"other-deon1-q021-C","text":"Hoạt động liên tục"},{"id":"other-deon1-q021-D","text":"Nhất quán"}],"correctOptionId":"other-deon1-q021-C","explanation":"<p>Giả định hoạt động liên tục (doanh nghiệp tiếp tục hoạt động, không bị buộc phải thanh lý) là cơ sở để ghi nhận tài sản theo giá gốc chứ không theo giá thanh lý. Slide nêu hoạt động liên tục ảnh hưởng đến định giá tài sản đang sử dụng.<\/p>","source":"Slide Chương 1, slide 63–65","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u020","context":null,"questions":[{"id":"other-deon1-q022","num":"Câu 22","type":"mcq","text":"Nghiệp vụ: “Dùng lợi nhuận chưa chưa phân phối bổ sung quỹ đầu tư phát triển” sẽ làm cho:","options":[{"id":"other-deon1-q022-A","text":"Thay đổi số tổng cộng trên bảng cân đối kế toán."},{"id":"other-deon1-q022-B","text":"Một khoản mục thuộc nguồn vốn tăng, một khoản mục thuộc tài sản giảm."},{"id":"other-deon1-q022-C","text":"Một khoản mục thuộc nguồn vốn tăng, một khoản mục thuộc nguồn vốn giảm."},{"id":"other-deon1-q022-D","text":"Một khoản mục thuộc nguồn vốn giảm, một khoản mục thuộc tài sản tăng."}],"correctOptionId":"other-deon1-q022-C","explanation":"<p>Nợ TK 421 / Có TK 414: LNST chưa phân phối giảm, quỹ đầu tư phát triển tăng; cả hai đều là nguồn vốn nên tổng không đổi: một nguồn vốn tăng, một nguồn vốn giảm (C).<\/p><div class=\"je\"><div>Nợ TK 421<\/div><div class=\"cr\">Có TK 414<\/div><\/div>","source":"Slide Chương 2 (quan hệ NV – TS); TT200 (TK 421, 414)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u021","context":null,"questions":[{"id":"other-deon1-q023","num":"Câu 23","type":"mcq","text":"Đầu kì tại một doanh nghiệp có các tài liệu: Tiền mặt 50, Tiền gửi ngân hàng 150, Tài sản cố định hữu hình 1.200, Hao mòn tài sản cố định 200, Trả trước người bán 200, Khách hàng trả trước 100, và nguồn vốn kinh doanh.<br>Sau đó phát sinh nghiệp vụ kinh tế: phát hành trái phiếu thu bằng tiền mặt 500. Vậy Tài sản và nguồn vốn kinh doanh lúc này là:","options":[{"id":"other-deon1-q023-A","text":"2.200 và 2.000"},{"id":"other-deon1-q023-B","text":"1.900 và 1.800"},{"id":"other-deon1-q023-C","text":"1.900 và 1.300"},{"id":"other-deon1-q023-D","text":"1.800 và 1.100"}],"correctOptionId":"other-deon1-q023-C","explanation":"<p>Tài sản đầu kỳ = 50 + 150 + 1.200 - 200 + 200 = 1.400. Nguồn vốn gồm Khách hàng trả trước 100 và nguồn vốn kinh doanh = 1.400 - 100 = 1.300. Phát hành trái phiếu thu tiền mặt 500: tài sản tăng 500 = 1.900, nợ phải trả tăng 500; nguồn vốn kinh doanh vẫn 1.300. Kết quả: <b>1.900 và 1.300<\/b> (C). Kiểm tra: 100 + 500 + 1.300 = 1.900.<\/p>","source":"Slide Chương 2 (phương trình kế toán, slide 38–39)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u022","context":null,"questions":[{"id":"other-deon1-q024","num":"Câu 24","type":"mcq","text":"Các phương pháp kế toán để ghi nhận và kiểm soát đối tượng kế toán là:","options":[{"id":"other-deon1-q024-A","text":"Lập chứng từ kế toán, Tính giá, Kiểm kê, Ghi sổ kép, Tổng hợp và cân đối."},{"id":"other-deon1-q024-B","text":"Lập chứng từ kế toán, Tính giá, Tài khoản, Ghi sổ kép, Kiểm kê, Tổng hợp và cân đối."},{"id":"other-deon1-q024-C","text":"Lập chứng từ kế toán, Kiểm kê, Tính giá, Ghi sổ cái, Tài khoản, Tổng hợp và cân đối."},{"id":"other-deon1-q024-D","text":"Lập chứng từ kế toán, Tài khoản, Tính giá, Kiểm tra, Ghi sổ kép, Tổng hợp và cân đối."}],"correctOptionId":"other-deon1-q024-B","explanation":"<p>Các phương pháp kế toán: Chứng từ, Kiểm kê, Tính giá, Tài khoản, Ghi sổ kép, Tổng hợp và cân đối. Chỉ phương án B có đủ (khác thứ tự). A thiếu Tài khoản; C dùng 'Ghi sổ cái' thay cho Ghi sổ kép; D có 'Kiểm tra' thay cho Kiểm kê.<\/p>","source":"Slide Chương 1, slide 52 (quy trình, các phương pháp kế toán)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u023","context":null,"questions":[{"id":"other-deon1-q025","num":"Câu 25","type":"mcq","text":"Đặc trưng cơ bản của hình thức kế toán Nhật kí chung là:","options":[{"id":"other-deon1-q025-A","text":"Tất cả các nghiệp vụ kinh tế, tài chính phát sinh đều phải ghi vào sổ Nhật kí, trọng tâm là sổ Nhật kí chung."},{"id":"other-deon1-q025-B","text":"Ghi vào sổ Nhật kí theo thứ tự thời gian phát sinh."},{"id":"other-deon1-q025-C","text":"Ghi vào sổ Nhật kí theo nội dung kinh tế của nghiệp vụ đó."},{"id":"other-deon1-q025-D","text":"Cả A, B và C","pinned":true}],"correctOptionId":"other-deon1-q025-D","explanation":"<p>Đặc trưng của hình thức Nhật ký chung gồm cả 3 ý: mọi nghiệp vụ ghi vào Nhật ký (trọng tâm Nhật ký chung), ghi theo trình tự thời gian và theo nội dung kinh tế (định khoản), sau đó ghi Sổ Cái từ Nhật ký. Chọn D.<\/p>","source":"Slide Chương 3, slide 77–79; Slide Chương 6, slide 24; TT200 (hình thức Nhật ký chung)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u024","context":null,"questions":[{"id":"other-deon1-q026","num":"Câu 26","type":"mcq","text":"Vào cuối kỳ tại một doanh nghiệp có các tài liệu: Tiền mặt 3.000, nguyên vật liệu 4.000, hao mòn tài sản cố định 2.000, vay ngắn hạn 4.000, ứng trước cho người bán 1.000, tài sản cố định hữu hình 30.000 và nguồn vốn kinh doanh x. Vậy x là:","options":[{"id":"other-deon1-q026-A","text":"34.000"},{"id":"other-deon1-q026-B","text":"36.000"},{"id":"other-deon1-q026-C","text":"30.000"},{"id":"other-deon1-q026-D","text":"32.000"}],"correctOptionId":"other-deon1-q026-D","explanation":"<p>Tài sản = 3.000 + 4.000 - 2.000 + 1.000 + 30.000 = 36.000. Nguồn vốn = vay ngắn hạn 4.000 + x. Suy ra x = 36.000 - 4.000 = <b>32.000<\/b> (D).<\/p>","source":"Slide Chương 2, slide 38–39","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u025","context":null,"questions":[{"id":"other-deon1-q027","num":"Câu 27","type":"mcq","text":"Phương pháp nào sau đây thường dẫn đến kết quả hàng trong kho còn tồn thường là các mặt hàng cũ của doanh nghiệp?","options":[{"id":"other-deon1-q027-A","text":"Thực tế đích danh."},{"id":"other-deon1-q027-B","text":"Nhập trước-xuất trước."},{"id":"other-deon1-q027-C","text":"Nhập sau-xuất trước."},{"id":"other-deon1-q027-D","text":"Bình quân gia quyền."}],"correctOptionId":"other-deon1-q027-C","explanation":"<p>LIFO (nhập sau xuất trước) xuất các lô mới nhập, nên hàng tồn cuối kỳ là các lô cũ nhất. FIFO ngược lại (tồn là hàng mới); bình quân và đích danh không có đặc điểm này.<\/p>","source":"Slide Chương 4, slide 37–39 (các phương pháp tính giá xuất kho)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u026","context":null,"questions":[{"id":"other-deon1-q028","num":"Câu 28","type":"mcq","text":"“Chứng từ kế toán là những giấy tờ và vật mang tin phản ánh nghiệp vụ kế toán tài chính ..., làm căn cứ ghi sổ kế toán”. Hãy điền từ còn thiếu vào dấu 3 chấm?","options":[{"id":"other-deon1-q028-A","text":"Phát sinh và đã hoàn thành"},{"id":"other-deon1-q028-B","text":"Đã hoàn thành"},{"id":"other-deon1-q028-C","text":"Phát sinh"},{"id":"other-deon1-q028-D","text":"Đã phát sinh và có thể hoàn thành"}],"correctOptionId":"other-deon1-q028-A","explanation":"<p>Theo Luật Kế toán: chứng từ kế toán là giấy tờ và vật mang tin phản ánh nghiệp vụ kinh tế, tài chính <b>phát sinh và đã hoàn thành<\/b>, làm căn cứ ghi sổ.<\/p>","source":"Slide Chương 3, slide 3–6 (khái niệm chứng từ); Luật Kế toán 2015","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u027","context":null,"questions":[{"id":"other-deon1-q029","num":"Câu 29","type":"mcq","text":"Khi tính kết quả kinh doanh của doanh nghiệp vào cuối kỳ, kế toán xác định doanh nghiệp bị lỗ 40.000.000 đồng. Bút toán ghi chép sẽ là:","options":[{"id":"other-deon1-q029-A","text":"<div class=\"je\"><div>Nợ TK 421 &nbsp; 40.000.000<\/div><div class=\"cr\">Có TK 911 &nbsp; 40.000.000<\/div><\/div>"},{"id":"other-deon1-q029-B","text":"<div class=\"je\"><div>Nợ TK 421 &nbsp; (40.000.000)<\/div><div class=\"cr\">Có TK 911 &nbsp; (40.000.000)<\/div><\/div>"},{"id":"other-deon1-q029-C","text":"<div class=\"je\"><div>Nợ TK 911 &nbsp; 40.000.000<\/div><div class=\"cr\">Có TK 421 &nbsp; 40.000.000<\/div><\/div>"},{"id":"other-deon1-q029-D","text":"<div class=\"je\"><div>Nợ TK 911 &nbsp; (40.000.000)<\/div><div class=\"cr\">Có TK 421 &nbsp; (40.000.000)<\/div><\/div>"}],"correctOptionId":"other-deon1-q029-A","explanation":"<p>Lỗ: chi phí lớn hơn doanh thu nên TK 911 có số dư Nợ; kết chuyển lỗ: Nợ TK 421 (lỗ chưa phân phối tăng) / Có TK 911. Bút toán lãi mới là Nợ 911 / Có 421. Bút toán không ghi số âm.<\/p><div class=\"je\"><div>Nợ TK 421 &nbsp; 40.000.000<\/div><div class=\"cr\">Có TK 911 &nbsp; 40.000.000<\/div><\/div>","source":"Slide Chương 5 (xác định kết quả kinh doanh); TT200 (TK 911, 421)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u028","context":null,"questions":[{"id":"other-deon1-q030","num":"Câu 30","type":"mcq","text":"Tiền điện, nước dùng cho trực tiếp sản xuất sản phẩm và chưa trả tiền là 5.500.000đ, trong đó thuế GTGT 10%, sẽ được hạch toán:","options":[{"id":"other-deon1-q030-A","text":"<div class=\"je\"><div>Nợ TK 627 &nbsp; 5.000.000đ<\/div><div>Nợ TK 133 &nbsp; 500.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 5.500.000đ<\/div><\/div>"},{"id":"other-deon1-q030-B","text":"<div class=\"je\"><div>Nợ TK 627 &nbsp; 5.500.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 5.500.000đ<\/div><\/div>"},{"id":"other-deon1-q030-C","text":"<div class=\"je\"><div>Nợ TK 621 &nbsp; 5.000.000đ<\/div><div>Nợ TK 133 &nbsp; 500.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 5.500.000đ<\/div><\/div>"},{"id":"other-deon1-q030-D","text":"<div class=\"je\"><div>Nợ TK 621 &nbsp; 5.500.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 5.500.000đ<\/div><\/div>"}],"correctOptionId":"other-deon1-q030-A","explanation":"<p>Giá chưa thuế 5.500.000/1,1 = 5.000.000; thuế GTGT 500.000 được khấu trừ (TK 133). Tiền điện nước phục vụ sản xuất là chi phí sản xuất chung (TK 627; TK 621 chỉ dành cho nguyên vật liệu trực tiếp). B, D ghi cả thuế vào chi phí là sai.<\/p>","source":"Slide Chương 5 (CPSX chung, TK 627, slide 29–30); TT200","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u029","context":null,"questions":[{"id":"other-deon1-q031","num":"Câu 31","type":"mcq","text":"Điều nào sau đây không phải là nguyên tắc cơ bản của kế toán?","options":[{"id":"other-deon1-q031-A","text":"Nhất quán"},{"id":"other-deon1-q031-B","text":"Giá gốc"},{"id":"other-deon1-q031-C","text":"Trung thực"},{"id":"other-deon1-q031-D","text":"Trọng yếu"}],"correctOptionId":"other-deon1-q031-C","explanation":"<p>Các nguyên tắc kế toán: cơ sở dồn tích, hoạt động liên tục, giá gốc, phù hợp, nhất quán, thận trọng, trọng yếu. Trung thực là yêu cầu đối với công tác kế toán, không phải nguyên tắc.<\/p>","source":"Slide Chương 1, slide 57 (yêu cầu) và slide 60 (nguyên tắc)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u030","context":null,"questions":[{"id":"other-deon1-q032","num":"Câu 32","type":"mcq","text":"Tài khoản điều chỉnh giảm tài sản, có số dư:","options":[{"id":"other-deon1-q032-A","text":"Bên Nợ"},{"id":"other-deon1-q032-B","text":"Bên Có"},{"id":"other-deon1-q032-C","text":"Tuỳ từng trường hợp cụ thể"},{"id":"other-deon1-q032-D","text":"Không có số dư"}],"correctOptionId":"other-deon1-q032-B","explanation":"<p>Tài khoản điều chỉnh giảm tài sản (214, 229...) có kết cấu ngược tài sản nên có số dư bên Có.<\/p>","source":"Slide Chương 2, slide 38–39","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u031","context":null,"questions":[{"id":"other-deon1-q033","num":"Câu 33","type":"mcq","text":"Chọn câu sai trong các phát biếu sau đây","options":[{"id":"other-deon1-q033-A","text":"Tài khoản cấp 2 là một hình thức kế tóan chi tiết nội dung và số tiền đã phản ánh trên tài khoản cấp 1"},{"id":"other-deon1-q033-B","text":"Tài khoản cấp 2 là một bộ phận của tài khoản cấp 1"},{"id":"other-deon1-q033-C","text":"Kế toán tổng hợp là việc phản ánh các nghiệp vụ kinh tế phát sinh với các tài khoản cấp 2 có liên quan"},{"id":"other-deon1-q033-D","text":"Nguyên tắc phản ảnh của tài khoản cấp 2 giống như nguyên tắc phản ảnh của tài khoản cấp 1"}],"correctOptionId":"other-deon1-q033-C","explanation":"<p>Kế toán tổng hợp phản ánh nghiệp vụ vào tài khoản <b>cấp 1<\/b> (tổng hợp), không phải cấp 2 (chi tiết). Vậy câu C sai.<\/p>","source":"Slide Chương 3, slide 72","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u032","context":"<p>Có các số liệu:<\/p><p>Vật liệu tồn kho: 10kg, đơn giá 10.000 đồng/kg<\/p><p>Mua nhập kho: 10kg. giá mua chưa thuế 10.000 đồng/kg, thuế GTGT 10% trên giá bán, chi phí vận chuyển 500 đồng/kg.<\/p>","questions":[{"id":"other-deon1-q034","num":"Câu 34","type":"mcq","text":"Xuất kho 15kg theo phương pháp FIFO, giá xuất kho là:","options":[{"id":"other-deon1-q034-A","text":"150.000 đồng."},{"id":"other-deon1-q034-B","text":"152.500 đồng."},{"id":"other-deon1-q034-C","text":"155.000 đồng."},{"id":"other-deon1-q034-D","text":"157.000 đồng."}],"correctOptionId":"other-deon1-q034-B","explanation":"<p>Lô đầu: 10kg x 10.000 = 100.000. Lô nhập: đơn giá = 10.000 + 500 = 10.500đ/kg (thuế GTGT được khấu trừ). Xuất 15kg FIFO = 100.000 + 5 x 10.500 = <b>152.500<\/b>.<\/p>","source":"Slide Chương 4, slide 39 (FIFO)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u033","context":null,"questions":[{"id":"other-deon1-q035","num":"Câu 35","type":"mcq","text":"Khi ghi sai quan hệ đối ứng của các tài khoản trong sổ kế toán, sửa bằng các phương pháp:","options":[{"id":"other-deon1-q035-A","text":"Ghi số âm."},{"id":"other-deon1-q035-B","text":"Ghi bổ sung"},{"id":"other-deon1-q035-C","text":"Cải chính."},{"id":"other-deon1-q035-D","text":"Cả A, B và C đều đúng","pinned":true}],"correctOptionId":"other-deon1-q035-A","explanation":"<p>Khi ghi sai quan hệ đối ứng (định khoản sai) thường dùng cách ghi số âm (đỏ): ghi lại bút toán sai bằng số âm rồi ghi bút toán đúng. Cải chính chỉ dùng khi sai chữ/số đơn giản; ghi bổ sung dùng khi ghi thiếu số tiền. Theo khoá chọn A.<\/p>","source":"Slide Chương 3, slide 89–90","status":"needs_review","answerBasis":"given","reviewNote":"Slide 90 nêu 3 phương pháp sửa sổ chung (cải chính, ghi số âm, ghi điều chỉnh/bổ sung); đáp án D cũng có thể bị cho là đúng. Giữ đáp án khoá A (đặc thù cho sai quan hệ đối ứng)."}]},{"id":"other-deon1-u034","context":null,"questions":[{"id":"other-deon1-q036","num":"Câu 36","type":"mcq","text":"Nghiệp vụ “khách hàng ứng trước cho doanh nghiệp bằng tiền mặt” sẽ làm cho:","options":[{"id":"other-deon1-q036-A","text":"Tài sản tăng và nguồn vốn tăng"},{"id":"other-deon1-q036-B","text":"Tài sản tăng và tài sản giảm"},{"id":"other-deon1-q036-C","text":"Tài sản giảm và nguồn vốn tăng"},{"id":"other-deon1-q036-D","text":"Nguồn vốn và tài sản đều giảm"}],"correctOptionId":"other-deon1-q036-A","explanation":"<p>Nợ TK 111 / Có TK 131: tiền mặt (tài sản) tăng, nghĩa vụ phải trả khách hàng (nguồn vốn) tăng.<\/p><div class=\"je\"><div>Nợ TK 111<\/div><div class=\"cr\">Có TK 131<\/div><\/div>","source":"Slide Chương 3, slide 52 (TK phải thu khách hàng); Slide Chương 2","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u035","context":null,"questions":[{"id":"other-deon1-q037","num":"Câu 37","type":"mcq","text":"Khi tài sản cố định được mua dùng cho hoạt động sản xuất sản phẩm tính thuế GTGT theo phương pháp khấu trừ thì giá trị ghi sổ của tài sản cố định là","options":[{"id":"other-deon1-q037-A","text":"Giá mua"},{"id":"other-deon1-q037-B","text":"Giá mua cộng chi phí trước khi sử dụng"},{"id":"other-deon1-q037-C","text":"Giá mua cộng thuế GTGT"},{"id":"other-deon1-q037-D","text":"Giá mua trừ thuế GTGT"}],"correctOptionId":"other-deon1-q037-B","explanation":"<p>Nguyên giá = giá mua (chưa thuế GTGT được khấu trừ) + các chi phí liên quan trực tiếp đến khi đưa tài sản vào sử dụng (B). A thiếu chi phí; C, D sai về thuế GTGT (thuế khấu trừ không vào nguyên giá, cũng không 'trừ' vì giá mua đã là giá chưa thuế).<\/p>","source":"Slide Chương 4, slide 11, 18; Slide Chương 5, slide 8","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u036","context":null,"questions":[{"id":"other-deon1-q038","num":"Câu 38","type":"mcq","text":"Chọn câu đúng trong các phát biểu sau?","options":[{"id":"other-deon1-q038-A","text":"Việc thu thập xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế - tài chính bằng báo cáo tài chính là kế toán quản trị."},{"id":"other-deon1-q038-B","text":"Việc thu thập xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế - tài chính theo yêu cầu quản trị là kế toán tài chính."},{"id":"other-deon1-q038-C","text":"Việc thu thập xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế - tài chính bằng báo cáo tài chính là kế toán tài chính."},{"id":"other-deon1-q038-D","text":"Tất cả đều sai."}],"correctOptionId":"other-deon1-q038-C","explanation":"<p>Kế toán tài chính: cung cấp thông tin thông qua báo cáo tài chính; kế toán quản trị: theo yêu cầu của nhà quản trị. A và B đảo ngược nên sai; C đúng.<\/p>","source":"Slide Chương 1, slide 14","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u037","context":null,"questions":[{"id":"other-deon1-q039","num":"Câu 39","type":"mcq","text":"Có các số liệu doanh thu bán hàng 37.500.000, giảm giá hàng bán 3.500.000, chiết khấu thương mại 2.000.000, chiết khấu thanh toán 1.500.000, chỉ tiêu doanh thu thuần là:","options":[{"id":"other-deon1-q039-A","text":"35.500.000"},{"id":"other-deon1-q039-B","text":"34.000.000"},{"id":"other-deon1-q039-C","text":"32.000.000"},{"id":"other-deon1-q039-D","text":"30.500.000"}],"correctOptionId":"other-deon1-q039-C","explanation":"<p>Doanh thu thuần = 37.500.000 - 3.500.000 - 2.000.000 = <b>32.000.000<\/b>. Chiết khấu thanh toán là chi phí tài chính, không phải khoản giảm trừ doanh thu.<\/p>","source":"Slide Chương 2, slide 41","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u038","context":null,"questions":[{"id":"other-deon1-q040","num":"Câu 40","type":"mcq","text":"Chi phí khấu hao thiết bị tại cửa hàng là chi phí thuộc:","options":[{"id":"other-deon1-q040-A","text":"Chi phí bán hàng"},{"id":"other-deon1-q040-B","text":"Chi phí tài chính"},{"id":"other-deon1-q040-C","text":"Chi phí quản lý doanh nghiệp"},{"id":"other-deon1-q040-D","text":"Chi phí sản xuất chung"}],"correctOptionId":"other-deon1-q040-A","explanation":"<p>Thiết bị đặt tại cửa hàng phục vụ việc bán hàng nên khấu hao ghi Nợ TK 641 (chi phí bán hàng). Khấu hao TSCĐ ở phân xưởng mới vào TK 627; ở bộ phận quản lý mới vào TK 642.<\/p>","source":"Slide Chương 5, slide 13–14 (kế toán khấu hao TSCĐ); TT200","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u039","context":null,"questions":[{"id":"other-deon1-q041","num":"Câu 41","type":"mcq","text":"Vietnam Airline ghi nhận doanh thu khi nào:","options":[{"id":"other-deon1-q041-A","text":"Khi chuyến bay đã hoàn thành."},{"id":"other-deon1-q041-B","text":"Khi hành khách lên máy bay"},{"id":"other-deon1-q041-C","text":"Khi khách hàng hoàn tất việc đặt vé"},{"id":"other-deon1-q041-D","text":"Khi thu tiền bán vé của khách hàng hoàn tất"}],"correctOptionId":"other-deon1-q041-C","explanation":"<p>Theo cơ sở dồn tích, dịch vụ vận chuyển hành khách được ghi nhận doanh thu khi dịch vụ đã cung cấp, tức khi chuyến bay hoàn thành (A); tiền thu trước vé là khoản nhận trước/doanh thu chưa thực hiện. Khoá chọn C (đặt vé), không phù hợp lý thuyết.<\/p>","source":"Slide Chương 1, slide 61–62 (cơ sở dồn tích)","status":"needs_review","answerBasis":"given","reviewNote":"Khoá đáp án C (khi khách hoàn tất việc đặt vé) mâu thuẫn với kế toán: doanh thu dịch vụ ghi nhận khi cung cấp dịch vụ (chuyến bay hoàn thành, phương án A). Giữ khoá, cần xác nhận."}]},{"id":"other-deon1-u040","context":null,"questions":[{"id":"other-deon1-q042","num":"Câu 42","type":"mcq","text":"Phân loại theo tính chất pháp lí, chứng từ kế toán bao gồm ","options":[{"id":"other-deon1-q042-A","text":"Chứng từ bắt buộc, chứng từ hướng dẫn"},{"id":"other-deon1-q042-B","text":"Chứng từ bằng giấy, chứng từ điện tử"},{"id":"other-deon1-q042-C","text":"Chứng từ mệnh lệnh, chứng từ chấp hành"},{"id":"other-deon1-q042-D","text":"Chứng từ gốc, chứng từ ghi sổ"}],"correctOptionId":"other-deon1-q042-A","explanation":"<p>Theo tính chất pháp lý: chứng từ bắt buộc và chứng từ hướng dẫn (A). B là phân loại theo hình thức; C theo công dụng; D theo trình tự lập.<\/p>","source":"Slide Chương 3, slide 8–17","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u041","context":null,"questions":[{"id":"other-deon1-q043","num":"Câu 43","type":"mcq","text":"Có các số liệu doanh thu thuần 10.000, giá vốn hàng bán 6.000, chi phí sản xuất chung 1.000, giá thành sản phẩm trong kỳ 2.000, chi phí bán hàng 400, chi phí quản lý doanh nghiệp 600, chỉ tiêu lợi nhuận là:","options":[{"id":"other-deon1-q043-A","text":"4.000"},{"id":"other-deon1-q043-B","text":"2.000"},{"id":"other-deon1-q043-C","text":"3.000"},{"id":"other-deon1-q043-D","text":"1.000"}],"correctOptionId":"other-deon1-q043-C","explanation":"<p>Lợi nhuận = Doanh thu thuần - Giá vốn - CPBH - CPQLDN = 10.000 - 6.000 - 400 - 600 = <b>3.000<\/b>. Chi phí sản xuất chung và giá thành đã nằm trong giá vốn nên không trừ lần nữa.<\/p>","source":"Slide Chương 2, slide 41","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u042","context":null,"questions":[{"id":"other-deon1-q044","num":"Câu 44","type":"mcq","text":"Kết chuyển chi phí nguyên vật liệu trực tiếp để tính giá thành sản phẩm sản xuất thì kế toán định khoản:","options":[{"id":"other-deon1-q044-A","text":"Nợ TK 154 / Có TK 621"},{"id":"other-deon1-q044-B","text":"Nợ TK 621 / Có TK 155"},{"id":"other-deon1-q044-C","text":"Nợ TK 621 / Có TK 154"},{"id":"other-deon1-q044-D","text":"Nợ TK 155 / Có TK 621"}],"correctOptionId":"other-deon1-q044-A","explanation":"<p>Cuối kỳ kết chuyển chi phí NVL trực tiếp sang TK 154 để tính giá thành:<\/p><div class=\"je\"><div>Nợ TK 154<\/div><div class=\"cr\">Có TK 621<\/div><\/div>","source":"Slide Chương 5, slide 50–51 (TK 621)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u043","context":null,"questions":[{"id":"other-deon1-q045","num":"Câu 45","type":"mcq","text":"Trình tự ghi sổ theo hình thức nhật kí chung là:","options":[{"id":"other-deon1-q045-A","text":"Nhật kí chung, chứng từ, sổ cái."},{"id":"other-deon1-q045-B","text":"Chứng từ, sổ cái, nhật kí chung."},{"id":"other-deon1-q045-C","text":"Chứng từ, nhật kí chung, sổ cái."},{"id":"other-deon1-q045-D","text":"Nhật kí chung, sổ cái, chứng từ."}],"correctOptionId":"other-deon1-q045-C","explanation":"<p>Chứng từ gốc được ghi vào Nhật ký chung trước, sau đó từ Nhật ký chung ghi vào Sổ Cái: Chứng từ, Nhật ký chung, Sổ cái.<\/p>","source":"Slide Chương 3, slide 77–79; Slide Chương 6, slide 24","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u044","context":"<p>Số dư đầu tháng của một số tài khoản sau:<\/p><table class=\"t\"><tbody><tr><td>TK 111: 12.000.000đ<\/td><td>TK 211: a<\/td><td>TK 331: 9.000.000đ<\/td><\/tr><tr><td>TK 112: 15.000.000đ<\/td><td>TK 214: 10.000.000đ<\/td><td>TK 411: 64.000.000đ<\/td><\/tr><tr><td>TK 141: 8.000.000đ<\/td><td>TK 414: b<\/td><td>TK 152: 16.000.000đ<\/td><\/tr><\/tbody><\/table><p>Các TK khác từ loại 1 đến loại 4 có số dư bằng 0.<\/p>","questions":[{"id":"other-deon1-q046","num":"Câu 46","type":"mcq","text":"Cho a = 5b, tính a và b:","options":[{"id":"other-deon1-q046-A","text":"a = 40.000.000đ, b = 8.000.000đ"},{"id":"other-deon1-q046-B","text":"a = 8.000.000đ, b = 40.000.000đ"},{"id":"other-deon1-q046-C","text":"a = 15.000.000đ, b = 3.000.000đ"},{"id":"other-deon1-q046-D","text":"a = 3.000.000đ, b = 15.000.000đ"}],"correctOptionId":"other-deon1-q046-A","explanation":"<p>Tài sản = 12 + 15 + 8 + 16 + a - 10 = 41 + a (triệu). Nguồn vốn = 9 + 64 + b = 73 + b. Cân đối: 41 + a = 73 + b và a = 5b nên 4b = 32, b = 8, a = 40. Kiểm tra: 81 = 81.<\/p>","source":"Slide Chương 2, slide 38–39 (cân đối kế toán)","status":"ok","answerBasis":"given"},{"id":"other-deon1-q047","num":"Câu 47","type":"mcq","text":"Tính tổng tài sản của doanh nghiệp là:","options":[{"id":"other-deon1-q047-A","text":"91.000.000đ"},{"id":"other-deon1-q047-B","text":"101.000.000đ"},{"id":"other-deon1-q047-C","text":"81.000.000đ"},{"id":"other-deon1-q047-D","text":"71.000.000đ"}],"correctOptionId":"other-deon1-q047-C","explanation":"<p>Tổng tài sản = 41.000.000 + a = 41 + 40 = <b>81.000.000đ<\/b> (hao mòn 214 trừ 10 triệu). Kiểm tra nguồn vốn: 9 + 64 + 8 = 81.<\/p>","source":"Slide Chương 2, slide 38–39","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u045","context":null,"questions":[{"id":"other-deon1-q048","num":"Câu 48","type":"mcq","text":"Khi tính giá thì kế toán cần tôn trọng nguyên tắc:","options":[{"id":"other-deon1-q048-A","text":"Giá gốc, phù hợp, thận trọng, nhất quán, hoạt động liên tục"},{"id":"other-deon1-q048-B","text":"Giá gốc, thận trọng, nhất quán, dồn tích, yêu cầu khách quan"},{"id":"other-deon1-q048-C","text":"Giá gốc, hoạt động liên tục, thận trọng, nhất quán, yêu cầu khách quan"},{"id":"other-deon1-q048-D","text":"Giá gốc, trọng yếu, dồn tích, phù hợp, hoạt động liên tục, yêu cầu khách quan"}],"correctOptionId":"other-deon1-q048-C","explanation":"<p>Nguyên tắc chi phối việc tính giá: giá gốc, hoạt động liên tục, thận trọng, nhất quán và yêu cầu khách quan (slide Chương 4 nhấn mạnh khách quan và thận trọng ảnh hưởng rõ nét đến xác định giá trị). Chọn C.<\/p>","source":"Slide Chương 4, slide 8, 11; Slide Chương 1, slide 63–69","status":"needs_review","answerBasis":"given","reviewNote":"Câu mang tính học thuộc theo giáo trình; slide không nêu danh sách đúng 5 nguyên tắc như đáp án. Giữ đáp án khoá C."}]},{"id":"other-deon1-u046","context":null,"questions":[{"id":"other-deon1-q049","num":"Câu 49","type":"mcq","text":"Sản xuất 10 cái áo giá 10.000đ/cái. Bán được 8 cái giá 12.000đ/cái không có phát sinh thêm. Tính lợi nhuận thu được theo nguyên tắc phù hợp","options":[{"id":"other-deon1-q049-A","text":"Lỗ 4.000"},{"id":"other-deon1-q049-B","text":"Lời 4.000"},{"id":"other-deon1-q049-C","text":"Lời 16.000"},{"id":"other-deon1-q049-D","text":"Chưa xác định được"}],"correctOptionId":"other-deon1-q049-C","explanation":"<p>Nguyên tắc phù hợp: doanh thu nào, chi phí đó. Doanh thu 8 x 12.000 = 96.000; giá vốn 8 x 10.000 = 80.000; lợi nhuận = <b>16.000<\/b>. 2 áo còn lại là hàng tồn kho, chưa là chi phí.<\/p>","source":"Slide Chương 1, slide 66–67 (nguyên tắc phù hợp)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u047","context":null,"questions":[{"id":"other-deon1-q050","num":"Câu 50","type":"mcq","text":"“Giá mua cộng chi phí thu mua” là vấn đề thuộc:","options":[{"id":"other-deon1-q050-A","text":"Giá thành."},{"id":"other-deon1-q050-B","text":"Nguyên tắc trọng yếu."},{"id":"other-deon1-q050-C","text":"Tính chi phí."},{"id":"other-deon1-q050-D","text":"Nguyên tắc giá gốc"}],"correctOptionId":"other-deon1-q050-D","explanation":"<p>Giá gốc của tài sản = giá mua thực tế + chi phí mua và các chi phí trực tiếp để đưa tài sản đến trạng thái sẵn sàng sử dụng.<\/p>","source":"Slide Chương 1, slide 65; Slide Chương 4, slide 11","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u048","context":null,"questions":[{"id":"other-deon1-q051","num":"Câu 51","type":"mcq","text":"Điều nào sau đây là yêu cầu cơ bản của kế toá?","options":[{"id":"other-deon1-q051-A","text":"Đầy đủ"},{"id":"other-deon1-q051-B","text":"Kịp thời"},{"id":"other-deon1-q051-C","text":"Khách quan"},{"id":"other-deon1-q051-D","text":"Bao gồm các nội dung trên","pinned":true}],"correctOptionId":"other-deon1-q051-D","explanation":"<p>Các yêu cầu đối với công tác kế toán gồm: trung thực, khách quan, đầy đủ, kịp thời, dễ hiểu, có thể so sánh. Cả A, B, C đều đúng nên chọn D.<\/p>","source":"Slide Chương 1, slide 56–58","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u049","context":"<p>Vật liệu tồn kho đầu tháng: 600 kg, đơn giá 20 đồng/kg.<\/p><p>Tình hình nhập xuất trong tháng.<\/p><ul><li>Ngày 01: mua nhập kho 1.200 kg, đơn giá nhập 18 đồng/kg.<\/li><li>Ngày 04: xuất 1.600kg để sản xuất sản phẩm.<\/li><li>Ngày 10: mua nhập kho 600kg, đơn giá 21đồng/kg.<\/li><li>Ngày 20: xuất 500 kg để sản xuất sản phẩm.<\/li><\/ul>","questions":[{"id":"other-deon1-q052","num":"Câu 52","type":"mcq","text":"Trị giá vật liệu xuất sử dụng ngày 04 của tháng theo phương pháp LIFO là:","options":[{"id":"other-deon1-q052-A","text":"29.600"},{"id":"other-deon1-q052-B","text":"30.600"},{"id":"other-deon1-q052-C","text":"33.600"},{"id":"other-deon1-q052-D","text":"31.400"}],"correctOptionId":"other-deon1-q052-A","explanation":"<p>Trước ngày 04: tồn 600kg x 20 và nhập ngày 01: 1.200kg x 18. LIFO xuất 1.600kg: 1.200 x 18 = 21.600, phần còn lại 400 x 20 = 8.000. Tổng = <b>29.600<\/b>.<\/p>","source":"Slide Chương 4, slide 37–39 (phương pháp tính giá xuất kho)","status":"ok","answerBasis":"given"},{"id":"other-deon1-q053","num":"Câu 53","type":"mcq","text":"Đơn giá tính theo phương pháp bình quân gia quyền là","options":[{"id":"other-deon1-q053-A","text":"19"},{"id":"other-deon1-q053-B","text":"19,25"},{"id":"other-deon1-q053-C","text":"19,667"},{"id":"other-deon1-q053-D","text":"19,5"}],"correctOptionId":"other-deon1-q053-B","explanation":"<p>Bình quân gia quyền cả kỳ: (600 x 20 + 1.200 x 18 + 600 x 21) / (600 + 1.200 + 600) = (12.000 + 21.600 + 12.600) / 2.400 = 46.200 / 2.400 = <b>19,25<\/b>.<\/p>","source":"Slide Chương 4, slide 38 (bình quân gia quyền cuối kỳ)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u050","context":null,"questions":[{"id":"other-deon1-q054","num":"Câu 54","type":"mcq","text":"Điều nào sau đây là không đúng khi nói về kế toán quản trị","options":[{"id":"other-deon1-q054-A","text":"Cung cấp theo yêu cầu nhà quản trị"},{"id":"other-deon1-q054-B","text":"Có tính linh hoạt cao"},{"id":"other-deon1-q054-C","text":"Không phản ánh sự kiện quá khứ"},{"id":"other-deon1-q054-D","text":"Có tính pháp lệnh"}],"correctOptionId":"other-deon1-q054-D","explanation":"<p>Kế toán quản trị phục vụ nội bộ, theo yêu cầu nhà quản trị, linh hoạt, không bắt buộc theo khuôn mẫu pháp lý nên <b>không có tính pháp lệnh<\/b>. Phương án D sai.<\/p>","source":"Slide Chương 1, slide 14","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u051","context":"<p>Chi phí sản xuất dở dang đầu kì: 10.000.000 đồng;<\/p><p>Chi phí sản xuất phát sinh trong kì: chi phí nguyên vật liệu trực tiếp 30.000.000 đồng; chi phí nhân công trực tiếp 24.400.000 đồng; chi phí sản xuất chung 15.600.000 đồng;<\/p><p>Cuối kỳ không có sản phẩm dở dang.<\/p>","questions":[{"id":"other-deon1-q055","num":"Câu 55","type":"mcq","text":"Giá trị thực tế nhập kho là:","options":[{"id":"other-deon1-q055-A","text":"80.000.000 đồng"},{"id":"other-deon1-q055-B","text":"60.000.000 đồng"},{"id":"other-deon1-q055-C","text":"70.000.000 đồng"},{"id":"other-deon1-q055-D","text":"54.400.000 đồng"}],"correctOptionId":"other-deon1-q055-A","explanation":"<p>Cuối kỳ không có dở dang: Tổng giá thành = 10.000.000 (dở dang đầu kỳ) + 30.000.000 + 24.400.000 + 15.600.000 = <b>80.000.000<\/b> đồng.<\/p>","source":"Slide Chương 5 (tập hợp chi phí và tính giá thành, TK 154)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u052","context":null,"questions":[{"id":"other-deon1-q056","num":"Câu 56","type":"mcq","text":"Trong các chứng từ sau, chứng từ nào được gọi là chứng từ mênh lệnh","options":[{"id":"other-deon1-q056-A","text":"Phiếu xuất kho"},{"id":"other-deon1-q056-B","text":"Phiếu chi"},{"id":"other-deon1-q056-C","text":"Phiếu thu"},{"id":"other-deon1-q056-D","text":"Lệnh xuất kho"}],"correctOptionId":"other-deon1-q056-D","explanation":"<p>Chứng từ mệnh lệnh truyền đạt lệnh từ cấp trên xuống cấp dưới, ví dụ lệnh chi tiền, lệnh xuất kho vật tư. Phiếu xuất kho, phiếu thu, phiếu chi là chứng từ chấp hành.<\/p>","source":"Slide Chương 3, slide 15","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u053","context":null,"questions":[{"id":"other-deon1-q057","num":"Câu 57","type":"mcq","text":"Kế toán tài chính là gì ?","options":[{"id":"other-deon1-q057-A","text":"Ghi nhận quá khứ"},{"id":"other-deon1-q057-B","text":"Tuân thủ nguyên tắc kế toán"},{"id":"other-deon1-q057-C","text":"Cung cấp thông tin cho nhà đầu tư"},{"id":"other-deon1-q057-D","text":"Bao gồm các nội dung trên","pinned":true}],"correctOptionId":"other-deon1-q057-D","explanation":"<p>Kế toán tài chính ghi nhận các sự kiện đã xảy ra, tuân thủ nguyên tắc và chuẩn mực kế toán và cung cấp thông tin qua báo cáo tài chính cho nhà đầu tư, chủ nợ và các bên bên ngoài. Chọn D.<\/p>","source":"Slide Chương 1, slide 8, 14","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u054","context":null,"questions":[{"id":"other-deon1-q058","num":"Câu 58","type":"mcq","text":"Chọn câu sai trong các câu sau:","options":[{"id":"other-deon1-q058-A","text":"Thông tin cung cấp cho kế toán quản trị phải thông qua hệ thống báo cáo quản trị phải tuân thủ theo các quy tắc chung của kế toán và mang tính pháp lệnh."},{"id":"other-deon1-q058-B","text":"Thông tin kế toán được chia làm 2 loại: kế toán quản trị và kế toán tài chính."},{"id":"other-deon1-q058-C","text":"Sổ chi tiết là hình thức kế toán chi tiết số liệu đã được phản ánh trên các tài khoản cấp 1, cấp 2."},{"id":"other-deon1-q058-D","text":"Nhận hóa đơn tiền điện là 1 nghiệp vụ kinh tế."}],"correctOptionId":"other-deon1-q058-A","explanation":"<p>Kế toán quản trị không bắt buộc tuân thủ quy tắc chung và không mang tính pháp lệnh nên A sai. Các câu còn lại được chấp nhận theo giáo trình.<\/p>","source":"Slide Chương 1, slide 13–14; Slide Chương 3, slide 72","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u055","context":"<p>Tại doanh nghiệp Thiên Hà có bảng cân đối kế toán ngày 30/06/2010 như sau:<\/p><p>Đơn vị tính: 1.000 đồng<\/p><table class=\"t\"><thead><tr><th>Tên Tài sản<\/th><th>Số tiền<\/th><th>Tên Nguồn vốn<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt<\/td><td class=\"num\">7.000<\/td><td>Vay ngắn hạn<\/td><td class=\"num\">37.000<\/td><\/tr><tr><td>Tiền gửi Ngân hàng<\/td><td class=\"num\">20.000<\/td><td>Phải trả người bán<\/td><td class=\"num\">8.000<\/td><\/tr><tr><td>Phải thu khách hàng<\/td><td class=\"num\">3.000<\/td><td>Nguồn vốn kinh doanh<\/td><td class=\"num\">113.000<\/td><\/tr><tr><td>Nguyên liệu vật liệu<\/td><td class=\"num\">7.000<\/td><td><\/td><td><\/td><\/tr><tr><td>Hàng hóa<\/td><td class=\"num\">36.000<\/td><td><\/td><td><\/td><\/tr><tr><td>Tài sản cố định hữu hình<\/td><td class=\"num\">85.000<\/td><td><\/td><td><\/td><\/tr><tr><td><b>Tổng cộng<\/b><\/td><td class=\"num\"><b>158.000<\/b><\/td><td><b>Tổng cộng<\/b><\/td><td class=\"num\"><b>158.000<\/b><\/td><\/tr><\/tbody><\/table><p>Các nghiệp vụ kinh tế phát sinh trong tháng 7 như sau:<\/p><ol><li>Khách hàng A trả nợ 2.000.000 đồng bằng tiền mặt<\/li><li>Khách hàng B ứng trước cho Doanh nghiệp 8.000.000 đồng bằng tiền gửi Ngân hàng<\/li><li>Doanh nghiệp xuất tiền mặt trả nợ người bán X 3.000.000 đồng<\/li><li>Doanh nghiệp xuất tiền mặt ứng trước cho người bán Y 2.000.000 đồng<\/li><li>Doanh nghiệp được cấp 1 tài sản cố định hữu hình nguyên giá 15.000.000 đồng<\/li><\/ol>","questions":[{"id":"other-deon1-q059","num":"Câu 59","type":"mcq","text":"Như vậy cuối tháng 7/2010 tổng tài sản của doanh nghiệp sẽ là:","options":[{"id":"other-deon1-q059-A","text":"183.000.000 đồng"},{"id":"other-deon1-q059-B","text":"164.000.000 đồng"},{"id":"other-deon1-q059-C","text":"178.000.000 đồng"},{"id":"other-deon1-q059-D","text":"163.000.000 đồng"}],"correctOptionId":"other-deon1-q059-C","explanation":"<p>Tổng tài sản đầu kỳ 158.000. Ảnh hưởng: (1) thu nợ khách hàng bằng tiền: không đổi; (2) khách hàng ứng trước bằng TGNH: +8.000; (3) trả nợ người bán bằng tiền: -3.000; (4) ứng trước người bán bằng tiền: không đổi; (5) được cấp TSCĐ: +15.000. Tổng tài sản = 158.000 + 8.000 - 3.000 + 15.000 = <b>178.000<\/b> (nghìn đồng). Kiểm tra nguồn vốn: 158.000 + 8.000 (nhận ứng trước) - 3.000 + 15.000 = 178.000.<\/p>","source":"Slide Chương 2, slide 38–39 (bảng cân đối kế

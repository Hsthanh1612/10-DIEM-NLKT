p.<\/li>\n<li>Khác: theo quy định Nhà nước (bắt buộc / hướng dẫn); theo số lần ghi: chứng từ <b>1 lần<\/b> / <b>nhiều lần<\/b> (theo dõi nhiều nghiệp vụ cùng loại liên tiếp).<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Loại<\/th><th>Bản chất<\/th><th>Ví dụ<\/th><th>Ghi sổ?<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Chứng từ gốc<\/b> (ban đầu)<\/td><td>Lập ngay khi nghiệp vụ phát sinh/hoàn thành, phản ánh trực tiếp đối tượng kế toán<\/td><td>Hóa đơn, phiếu thu/chi, phiếu nhập/xuất kho<\/td><td>Có giá trị pháp lý quan trọng nhất<\/td><\/tr>\n<tr><td><b>Chứng từ tổng hợp<\/b> (ghi sổ)<\/td><td>Tổng hợp chứng từ gốc cùng loại, cùng nghiệp vụ để giảm khối lượng ghi chép<\/td><td>Bảng tổng hợp chứng từ gốc, bảng kê nộp séc<\/td><td>Chỉ có giá trị khi <b>đính kèm chứng từ gốc<\/b><\/td><\/tr>\n<tr><td><b>Chứng từ mệnh lệnh<\/b><\/td><td>Truyền mệnh lệnh cấp trên → cấp dưới; mới chứng minh xuất xứ, <b>chưa hoàn thành<\/b><\/td><td>Lệnh chi, lệnh xuất kho, quyết định thanh lý TSCĐ, giấy đề nghị tạm ứng<\/td><td><b>Chưa<\/b> là căn cứ ghi sổ riêng<\/td><\/tr>\n<tr><td><b>Chứng từ chấp hành<\/b><\/td><td>Chứng minh nghiệp vụ <b>đã phát sinh và hoàn thành<\/b><\/td><td>Phiếu thu, phiếu chi, phiếu nhập/xuất kho<\/td><td>Dùng ghi sổ (cùng chứng từ mệnh lệnh)<\/td><\/tr>\n<tr><td><b>Chứng từ thủ tục kế toán<\/b><\/td><td>Chứng từ trung gian, phân loại nghiệp vụ theo đối tượng, thuận tiện ghi sổ<\/td><td>Bảng kê nộp séc, chứng từ ghi sổ<\/td><td>Phải kèm chứng từ ban đầu<\/td><\/tr>\n<tr><td><b>Chứng từ nội bộ<\/b><\/td><td>Do <b>đơn vị lập<\/b>, liên quan nội bộ<\/td><td>Bảng thanh toán lương, phiếu xuất kho NVL cho phân xưởng, giấy thanh toán tạm ứng<\/td><td><\/td><\/tr>\n<tr><td><b>Chứng từ bên ngoài<\/b><\/td><td>Liên quan đơn vị nhưng <b>do đơn vị khác lập<\/b><\/td><td>Hóa đơn GTGT (liên 2), giấy báo Nợ/Có của ngân hàng<\/td><td><\/td><\/tr>\n<\/tbody><\/table>\n<p><i>Mẹo:<\/i> thấy &quot;đề nghị / quyết định / lệnh&quot; → mệnh lệnh; thấy &quot;đã thu/đã chi/đã nhập/đã xuất&quot; → chấp hành. Giấy báo <b>Nợ<\/b> = tiền gửi <b>giảm<\/b>; giấy báo <b>Có<\/b> = tiền gửi <b>tăng<\/b> (chứng từ bên ngoài).<\/p>","source":"Slide Chương 3, slide 8–20 (bổ sung: nghĩa giấy báo Nợ/Có theo bài tập)"},{"id":"ch3-t03","title":"Nội dung (yếu tố) của chứng từ và bộ chứng từ theo nghiệp vụ","core":"<p><b>Yếu tố chủ yếu (bắt buộc)<\/b>: thiếu thì chứng từ không đầy đủ, không đáng tin cậy. Gồm: tên chứng từ; <b>thời điểm<\/b> (ngày lập) phát sinh nghiệp vụ; nơi phát hành; nơi nhận; <b>nội dung kinh tế<\/b> của nghiệp vụ; <b>quy mô<\/b> (số lượng, đơn giá, số tiền); chữ ký, dấu (đảm bảo pháp lý giữa các pháp nhân).<\/p>\n<p><b>Yếu tố bổ sung (không bắt buộc)<\/b>: làm rõ thêm thông tin: <b>định khoản<\/b>, hình thức thanh toán, thời gian thanh toán, hạn mức công nợ…<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Nghiệp vụ<\/th><th>Chứng từ cần có<\/th><\/tr><\/thead><tbody>\n<tr><td>Mua hàng/NVL, nhập kho, chưa trả tiền<\/td><td>Hóa đơn GTGT + phiếu nhập kho<\/td><\/tr>\n<tr><td>Mua, nhập kho, trả tiền mặt<\/td><td>Hóa đơn GTGT + phiếu nhập kho + <b>phiếu chi<\/b><\/td><\/tr>\n<tr><td>Bán hàng (bên bán)<\/td><td>Hóa đơn GTGT (bên bán lập)<\/td><\/tr>\n<tr><td>Xuất NVL cho sản xuất<\/td><td>Phiếu xuất kho<\/td><\/tr>\n<tr><td>Thu tiền mặt của khách<\/td><td>Phiếu thu<\/td><\/tr>\n<tr><td>Tạm ứng bằng tiền mặt<\/td><td>Giấy đề nghị tạm ứng (mệnh lệnh) + <b>phiếu chi<\/b> (chấp hành, căn cứ ghi giảm tiền mặt)<\/td><\/tr>\n<tr><td>Tiền gửi bị trừ / tiền vào TK<\/td><td>Giấy báo Nợ / giấy báo Có<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 21–23; bộ chứng từ theo bài tập LMS chương 3"},{"id":"ch3-t04","title":"Trình tự xử lý, luân chuyển và lưu trữ chứng từ","core":"<p>5 bước: <b>Lập → Kiểm tra → Hoàn chỉnh → Luân chuyển → Bảo quản, lưu trữ<\/b>.<\/p>\n<ul><li><b>Lập<\/b>: đủ yếu tố; chữ rõ ràng, <b>không tẩy xoá, sửa chữa, viết tắt<\/b>; số tiền bằng chữ <b>khớp<\/b> số tiền bằng số; lập đủ liên, một lần cho tất cả liên (máy tính, giấy than); đủ chữ ký người lập, người duyệt và dấu đơn vị; chứng từ điện tử phải in ra giấy lưu trữ.<\/li>\n<li><b>Kiểm tra<\/b>: tính rõ ràng, đầy đủ, chính xác, trung thực; hợp lệ, hợp pháp của nghiệp vụ; chấp hành quy chế nội bộ. Phát hiện vi phạm → <b>từ chối thực hiện<\/b> và báo kế toán trưởng, thủ trưởng. <b>Chỉ chứng từ hợp pháp, hợp lệ mới được ghi sổ.<\/b><\/li>\n<li><b>Hoàn chỉnh<\/b>: bổ sung đủ yếu tố; phân loại chứng từ phục vụ ghi sổ.<\/li>\n<li><b>Luân chuyển<\/b>: theo quy định của kế toán trưởng về thứ tự và thời gian.<\/li>\n<li><b>Lưu trữ<\/b> (NĐ 174/2016/NĐ-CP): tài liệu phục vụ quản lý điều hành <b>5 năm<\/b>; chứng từ trực tiếp ghi sổ và lập báo cáo tài chính <b>10 năm<\/b>; tư liệu có tính sử liệu, ý nghĩa quan trọng <b>vĩnh viễn<\/b>. Không tiêu huỷ ngay sau khi ghi sổ.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 3, slide 24–30"},{"id":"ch3-t05","title":"Tài khoản kế toán: khái niệm, nội dung và kết cấu chung","core":"<p><b>Tài khoản kế toán<\/b> = phương pháp kế toán dùng để <b>theo dõi thường xuyên, liên tục, có hệ thống<\/b> tình hình <b>hiện có<\/b> và <b>sự biến động<\/b> của từng đối tượng kế toán cụ thể (tài sản, nguồn vốn, doanh thu, chi phí); phân loại và hệ thống hoá nghiệp vụ theo nội dung kinh tế (Luật Kế toán, Điều 23).<\/p>\n<ul><li>Cần thiết vì chứng từ chỉ thu thập dữ liệu rời rạc, chưa thành hệ thống; đối tượng kế toán luôn vận động <b>theo 2 hướng đối lập<\/b> (tăng/giảm). Thông tin trên TK là căn cứ lập BCTC; BCTC kỳ này là căn cứ mở sổ đầu kỳ sau.<\/li>\n<li>Mỗi TK theo dõi một đối tượng (hoặc nhóm đối tượng giống nhau), có <b>tên và số hiệu<\/b>.<\/li>\n<li><b>Số dư<\/b> (đầu kỳ, cuối kỳ) = tình hình <b>hiện có<\/b> tại một thời điểm. <b>Số phát sinh<\/b> (tăng, giảm) = <b>biến động<\/b> trong kỳ.<\/li>\n<li>Kết cấu: chia 2 bên, trái = <b>Nợ<\/b> (Debit), phải = <b>Có<\/b> (Credit). <b>Nợ/Có chỉ là quy ước, không có ý nghĩa kinh tế.<\/b> Dạng lý thuyết: sơ đồ chữ T; thực tế: sổ có cột chứng từ, diễn giải, TK đối ứng, số tiền Nợ/Có.<\/li><\/ul>","formulas":"<div class=\"formula\">Số dư cuối kỳ = Số dư đầu kỳ + Số phát sinh tăng − Số phát sinh giảm<\/div>\n<p>Ví dụ TK 111: SDĐK 200; PS Nợ 340; PS Có 320 → SDCK = 200 + 340 − 320 = <b>220<\/b>.<\/p>","compare":null,"source":"Slide Chương 3, slide 31–42, 47–48"},{"id":"ch3-t06","title":"Số hiệu và hệ thống tài khoản","core":"<ul><li><b>Chữ số đầu<\/b> = loại TK; <b>chữ số thứ hai<\/b> = nhóm TK trong loại; <b>chữ số thứ ba<\/b> = số thứ tự TK trong nhóm (VD 111, 112, 113 cùng nhóm 11 – tiền). TK cấp 1 (tổng hợp) 3 chữ số; TK cấp 2 (chi tiết) thêm chữ số thứ tư (1331, 1332).<\/li>\n<li>Theo slide: loại TK tài sản; nguồn vốn (nợ phải trả); vốn CSH; doanh thu; chi phí SXKD; thu nhập khác; chi phí khác; XĐKQKD.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Loại<\/th><th>Nội dung<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td>Tài sản ngắn hạn<\/td><td>111, 112, 131, 133, 141, 152, 153, 156<\/td><\/tr>\n<tr><td>2<\/td><td>Tài sản dài hạn<\/td><td>211, 214 (điều chỉnh giảm)<\/td><\/tr>\n<tr><td>3<\/td><td>Nợ phải trả<\/td><td>331, 334, 341, 344<\/td><\/tr>\n<tr><td>4<\/td><td>Vốn chủ sở hữu<\/td><td>411, 414, 421<\/td><\/tr>\n<tr><td>5<\/td><td>Doanh thu<\/td><td>511<\/td><\/tr>\n<tr><td>6<\/td><td>Chi phí sản xuất, kinh doanh<\/td><td>621, 627, 632, 641, 642<\/td><\/tr>\n<tr><td>7 / 8<\/td><td>Thu nhập khác / Chi phí khác<\/td><td><\/td><\/tr>\n<tr><td>9<\/td><td>Xác định kết quả kinh doanh<\/td><td>911<\/td><\/tr>\n<\/tbody><\/table>\n<p><span class=\"tag ext\">Bổ sung<\/span> Loại 1–2 = tài sản; loại 3–4 = nguồn vốn (TT200). Có thêm loại 0 – TK ngoài bảng (ghi sổ đơn).<\/p>","source":"Slide Chương 3, slide 61–62; bài tập về số hiệu TK; bổ sung theo TT200/2014"},{"id":"ch3-t07","title":"Kết cấu tài khoản theo loại (trọng tâm)","core":"<p>Theo <b>nội dung kinh tế<\/b>: TK phản ánh tài sản; TK phản ánh nguồn vốn; TK phản ánh quá trình kinh doanh (doanh thu, chi phí, XĐKQKD). Theo <b>công dụng và kết cấu<\/b>: TK chủ yếu (tài sản, nguồn vốn, hỗn hợp), TK điều chỉnh, TK nghiệp vụ. Theo <b>mức độ<\/b>: TK tổng hợp (cấp 1) / TK chi tiết (cấp 2, sổ thẻ chi tiết).<\/p>\n<p><b>Nguyên tắc nhớ:<\/b> TK tài sản: tăng ghi Nợ. TK nguồn vốn: tăng ghi Có. Chi phí giống tài sản (tăng bên Nợ); doanh thu giống nguồn vốn (tăng bên Có). Chi phí, doanh thu <b>không có số dư<\/b> cuối kỳ (kết chuyển sang 911). TK điều chỉnh có kết cấu <b>ngược<\/b> TK chủ yếu mà nó điều chỉnh.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Loại TK<\/th><th>Bên Nợ<\/th><th>Bên Có<\/th><th>Số dư<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Tài sản<\/b> (111, 152, 211…)<\/td><td>SDĐK; PS <b>tăng<\/b><\/td><td>PS <b>giảm<\/b><\/td><td>SDCK bên <b>Nợ<\/b><\/td><\/tr>\n<tr><td><b>Nguồn vốn<\/b> (nợ phải trả, vốn CSH: 331, 341, 411…)<\/td><td>PS <b>giảm<\/b><\/td><td>SDĐK; PS <b>tăng<\/b><\/td><td>SDCK bên <b>Có<\/b><\/td><\/tr>\n<tr><td><b>Chi phí<\/b> (621, 627, 641, 642, 632…)<\/td><td>PS <b>tăng<\/b> (chi phí phát sinh)<\/td><td>PS giảm / <b>kết chuyển<\/b> sang 911<\/td><td><b>Không có<\/b> số dư<\/td><\/tr>\n<tr><td><b>Doanh thu, thu nhập<\/b> (511…)<\/td><td>PS giảm / <b>kết chuyển<\/b> sang 911<\/td><td>PS <b>tăng<\/b> (doanh thu phát sinh)<\/td><td><b>Không có<\/b> số dư<\/td><\/tr>\n<tr><td><b>Điều chỉnh giảm TK tài sản<\/b> (214, dự phòng)<\/td><td>PS giảm<\/td><td>SDĐK; PS tăng<\/td><td>SDCK bên <b>Có<\/b><\/td><\/tr>\n<tr><td><b>Điều chỉnh giảm vốn CSH<\/b> (cổ phiếu mua lại của chính mình)<\/td><td>SDĐK; PS tăng<\/td><td>PS giảm<\/td><td>SDCK bên <b>Nợ<\/b><\/td><\/tr>\n<tr><td><b>XĐKQKD<\/b> (911)<\/td><td>K/c chi phí; k/c lãi<\/td><td>K/c thu nhập; k/c lỗ<\/td><td>Không có số dư<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 43–51, 56–60; bài tập kết cấu TK"},{"id":"ch3-t08","title":"Tài khoản hỗn hợp (131, 331)","core":"<p><b>TK hỗn hợp<\/b> vừa phản ánh <b>tài sản<\/b> vừa phản ánh <b>nguồn vốn<\/b>: TK 131 &quot;Phải thu khách hàng&quot; và TK 331 &quot;Phải trả người bán&quot;.<\/p>\n<ul><li>TK 131: giao hàng, <b>phải thu tăng<\/b> → Nợ 131 (tài sản). Khách <b>trả trước<\/b> tiền → Có 131 (nghĩa vụ phải trả tăng). Khách trả nợ → Có 131.<\/li>\n<li>TK 331: phải trả tăng → Có 331; đã trả → Nợ 331; <b>ứng trước cho người bán<\/b> → Nợ 331.<\/li>\n<li>Có thể dư <b>Nợ<\/b> hoặc dư <b>Có<\/b>. 131: dư Nợ = phải thu, dư Có = khách trả trước. 331: dư Có = phải trả, dư Nợ = trả trước người bán.<\/li>\n<li>Mở <b>TK chi tiết từng đối tượng<\/b>; khi lập Bảng cân đối kế toán <b>không bù trừ<\/b> nợ phải thu với nợ phải trả (tách số dư Nợ và số dư Có).<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th><\/th><th>TK 131<\/th><th>TK 331<\/th><\/tr><\/thead><tbody>\n<tr><td>Bên Nợ<\/td><td>Phải thu tăng<\/td><td>Đã trả / trả trước người bán<\/td><\/tr>\n<tr><td>Bên Có<\/td><td>Đã thu / khách trả trước<\/td><td>Phải trả tăng<\/td><\/tr>\n<tr><td>Dư Nợ<\/td><td>Phải thu (tài sản)<\/td><td>Trả trước người bán (tài sản)<\/td><\/tr>\n<tr><td>Dư Có<\/td><td>Khách trả trước (nguồn vốn)<\/td><td>Phải trả người bán (nguồn vốn)<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 52–55; bài tập LMS (khách ứng trước; ứng trước người bán)"},{"id":"ch3-t09","title":"Tài khoản điều chỉnh","core":"<p><b>TK điều chỉnh<\/b>: luôn đi kèm TK chủ yếu mà nó điều chỉnh, nhằm phản ánh <b>giá trị thực tế<\/b> của tài sản/nguồn vốn mà TK chủ yếu chưa phản ánh được.<\/p>\n<ul><li><b>Điều chỉnh giảm<\/b>: kết cấu <b>ngược<\/b> TK chủ yếu. VD: TK 214 Hao mòn TSCĐ (điều chỉnh giảm TK 211), các TK dự phòng (giảm TK tài sản); cổ phiếu mua lại của chính mình (giảm vốn CSH).<\/li>\n<li><b>Điều chỉnh tăng<\/b>: cùng kết cấu TK chủ yếu.<\/li>\n<li><b>Vừa tăng vừa giảm<\/b>: kết hợp hai kết cấu. VD: chênh lệch đánh giá lại tài sản, chênh lệch tỷ giá hối đoái.<\/li>\n<li>Trích khấu hao 20 triệu → <b>Có TK 214<\/b> (hao mòn tăng); Nợ 214 chỉ khi thanh lý, nhượng bán.<\/li><\/ul>","formulas":"<div class=\"formula\">Giá trị còn lại TSCĐ = Nguyên giá (dư Nợ 211) − Hao mòn lũy kế (dư Có 214)<\/div>","compare":null,"source":"Slide Chương 3, slide 56–60 (công thức giá trị còn lại: giải thích trong bài tập LMS)"},{"id":"ch3-t10","title":"Ghi sổ kép, quan hệ đối ứng và định khoản","core":"<p><b>Ghi sổ kép<\/b>: phản ánh mỗi nghiệp vụ vào <b>ít nhất hai TK<\/b>, một TK ghi <b>Nợ<\/b>, một TK ghi <b>Có<\/b>, với <b>số tiền bằng nhau<\/b>.<\/p>\n<p><b>Quan hệ đối ứng<\/b> (mỗi nghiệp vụ thuộc một trong các dạng): TS ↔ TS (một tăng, một giảm); NV ↔ NV; TS ↔ NV (cùng tăng hoặc cùng giảm); TK tài sản/nguồn vốn ↔ TK quá trình kinh doanh; TK quá trình kinh doanh ↔ nhau (VD kết chuyển 511 → 911).<\/p>\n<p><b>Định khoản<\/b> = xác định ghi Nợ TK nào, Có TK nào, bao nhiêu tiền. Ý nghĩa ghi sổ kép: phản ánh nguyên nhân tăng/giảm; kiểm tra tính chính xác của ghi sổ.<\/p>","formulas":"<div class=\"formula\">Tổng phát sinh Nợ của các TK tổng hợp = Tổng phát sinh Có của các TK tổng hợp<\/div>\n<p>Ghi sổ <b>đơn<\/b>: ghi độc lập vào một đối tượng, không có quan hệ đối ứng; dùng cho <b>TK chi tiết<\/b> và <b>TK ngoài bảng<\/b>.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Định khoản giản đơn<\/th><th>Định khoản phức tạp<\/th><\/tr><\/thead><tbody>\n<tr><td>Liên quan <b>2 TK tổng hợp<\/b><\/td><td>Liên quan <b>từ 3 TK tổng hợp<\/b> trở lên<\/td><\/tr>\n<tr><td>Nợ 153 / Có 111: 4 (mua CCDC trả tiền mặt)<\/td><td>Nợ 111: 200; Nợ 112: 300 / Có 131: 500 (khách trả 40% TM, 60% CK)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Định khoản phức tạp: tổng Nợ = tổng Có.<\/p>","source":"Slide Chương 3, slide 63–71 (chú ý TK chi tiết/ngoài bảng ở slide 71)"},{"id":"ch3-t11","title":"Bút toán mẫu trọng tâm","core":"<p>Quy trình: xác định <b>TK nào tăng/giảm<\/b> → áp quy tắc (tài sản tăng Nợ/giảm Có; nguồn vốn tăng Có/giảm Nợ) → kiểm tra Nợ = Có. <b>Thuế GTGT đầu vào được khấu trừ<\/b> ghi riêng Nợ TK 133, không cộng vào giá hàng/TSCĐ.<\/p>\n<table class=\"t\"><thead><tr><th>Nghiệp vụ<\/th><th>Định khoản<\/th><\/tr><\/thead><tbody>\n<tr><td>Rút TGNH nhập quỹ 140<\/td><td>Nợ 111 / Có 112<\/td><\/tr>\n<tr><td>Mua hàng chịu 200 + GTGT 10%<\/td><td>Nợ 156: 200; Nợ 133: 20 / Có 331: 220<\/td><\/tr>\n<tr><td>Mua NVL nhập kho 50 + GTGT 5, trả tiền mặt<\/td><td>Nợ 152: 50; Nợ 133: 5 / Có 111: 55<\/td><\/tr>\n<tr><td>Mua TSCĐ 600 + GTGT 60, chưa trả<\/td><td>Nợ 211: 600; Nợ 133: 60 / Có 331: 660<\/td><\/tr>\n<tr><td>Tạm ứng cho nhân viên bằng tiền mặt<\/td><td>Nợ 141 / Có 111<\/td><\/tr>\n<tr><td>Vay ngắn hạn, tiền vào TK ngân hàng<\/td><td>Nợ 112 / Có 341<\/td><\/tr>\n<tr><td>Vay ngắn hạn trả nợ người bán<\/td><td>Nợ 331 / Có 341<\/td><\/tr>\n<tr><td>Khách chuyển khoản trả trước<\/td><td>Nợ 112 / Có 131<\/td><\/tr>\n<tr><td>Ứng trước cho người bán bằng tiền mặt<\/td><td>Nợ 331 / Có 111<\/td><\/tr>\n<tr><td>Nhận vốn góp bằng tiền mặt<\/td><td>Nợ 111 / Có 411<\/td><\/tr>\n<tr><td>Nhận ký quỹ ngắn hạn bằng tiền mặt<\/td><td>Nợ 111 / Có 344<\/td><\/tr>\n<tr><td>Trả lương kỳ 1 bằng tiền mặt<\/td><td>Nợ 334 / Có 111<\/td><\/tr>\n<tr><td>Trích lợi nhuận sau thuế lập quỹ đầu tư phát triển<\/td><td>Nợ 421 / Có 414<\/td><\/tr>\n<tr><td>Xuất NVL cho sản xuất<\/td><td>Nợ 621 / Có 152<\/td><\/tr>\n<tr><td>Trích khấu hao TSCĐ<\/td><td>Nợ TK chi phí (627/641/642) / Có 214<\/td><\/tr>\n<tr><td>Kết chuyển doanh thu<\/td><td>Nợ 511 / Có 911<\/td><\/tr>\n<\/tbody><\/table>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Dễ nhầm<\/th><th>Cách nhớ<\/th><\/tr><\/thead><tbody>\n<tr><td>Ứng trước cho người bán vs. vay trả nợ người bán<\/td><td>Cả hai đều Nợ 331, nhưng vế Có khác (111 vs. 341)<\/td><\/tr>\n<tr><td>Khách trả trước vs. doanh thu<\/td><td>Chưa giao hàng thì <b>chưa<\/b> ghi Có 511; ghi Có 131<\/td><\/tr>\n<tr><td>Nhận ký quỹ vs. nhận vốn góp<\/td><td>Ký quỹ là nợ phải trả (Có 344), vốn góp là vốn CSH (Có 411)<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 64–67, 69; bài 1–4 LMS chương 3 (TK 344, 414, 421, 133 bổ sung theo TT200)"},{"id":"ch3-t12","title":"Kế toán tổng hợp và kế toán chi tiết","core":"<p>TK chi tiết (cấp 2, sổ/thẻ chi tiết) <b>mở cho TK tổng hợp<\/b> (cấp 1); số dư và số phát sinh của các TK chi tiết cộng lại <b>phải bằng<\/b> TK tổng hợp tương ứng.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th><\/th><th>Kế toán tổng hợp<\/th><th>Kế toán chi tiết<\/th><\/tr><\/thead><tbody>\n<tr><td>Ghi vào<\/td><td>TK tổng hợp (cấp 1)<\/td><td>TK chi tiết (cấp 2) hoặc sổ, thẻ chi tiết<\/td><\/tr>\n<tr><td>Thước đo<\/td><td><b>Giá trị<\/b><\/td><td>Giá trị, <b>hiện vật<\/b>, <b>thời gian lao động<\/b><\/td><\/tr>\n<tr><td>Cung cấp<\/td><td>Chỉ tiêu tổng quát về tài sản, nguồn vốn<\/td><td>Số liệu chi tiết phục vụ điều hành, xử lý vấn đề nhanh<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 61, 72–73"},{"id":"ch3-t13","title":"Sổ kế toán: khái niệm và phân loại","core":"<p><b>Sổ kế toán<\/b>: các tờ sổ thiết kế theo <b>mẫu nhất định<\/b>, liên hệ chặt chẽ với nhau, dùng ghi chép, hệ thống hoá thông tin kinh tế tài chính <b>trên cơ sở chứng từ kế toán<\/b> theo đúng phương pháp kế toán; mở theo <b>kỳ kế toán<\/b> (tháng, quý, năm). Tác dụng: ghi chép, lưu giữ toàn bộ nghiệp vụ; tổng hợp số liệu, lập báo cáo; cung cấp thông tin cho nhà quản lý.<\/p>\n<p><b>Mở sổ<\/b>: khi đơn vị <b>mới thành lập<\/b> hoặc bắt đầu <b>kỳ kế toán mới<\/b>; việc gồm đăng ký danh mục sổ và <b>ghi chuyển số dư đầu kỳ<\/b>. Mỗi đơn vị chỉ mở <b>một hệ thống sổ chính thức duy nhất<\/b>.<\/p>\n<p><b>Căn cứ ghi sổ<\/b>: chứng từ kế toán đã được kiểm tra, hoàn chỉnh.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Các loại<\/th><\/tr><\/thead><tbody>\n<tr><td>Nội dung ghi chép<\/td><td><b>Sổ tổng hợp<\/b>: sổ cái, nhật ký chung, sổ đăng ký chứng từ ghi sổ, nhật ký chứng từ. <b>Sổ chi tiết<\/b>: chi tiết tài sản, thanh toán, chi phí, doanh thu…<\/td><\/tr>\n<tr><td>Cách ghi chép<\/td><td><b>Theo thời gian<\/b>: nhật ký chung, sổ đăng ký CTGS. <b>Theo hệ thống<\/b>: sổ cái, sổ chi tiết, nhật ký chứng từ. <b>Kết hợp<\/b>: Nhật ký – Sổ cái.<\/td><\/tr>\n<tr><td>Cấu trúc mẫu<\/td><td>Một bên, hai bên, nhiều cột, bàn cờ<\/td><\/tr>\n<tr><td>Cách tổ chức<\/td><td>Đóng thành quyển / tờ rời<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 74–88"},{"id":"ch3-t14","title":"Quy tắc chữa sổ kế toán","core":"<p>Khi sai sót: <b>không được tẩy xoá<\/b> làm mất dấu vết; sửa theo 1 trong 3 phương pháp (cải chính, ghi số âm: kèm chữ ký kế toán trưởng). <b>Sổ điện tử<\/b>: chỉ ghi <b>điều chỉnh<\/b> bằng chứng từ điều chỉnh, có truy vết.<\/p>\n<ul><li><b>Cải chính<\/b>: gạch một đường thẳng vào chỗ sai, ghi số/chữ đúng ở phía trên, kế toán trưởng ký bên cạnh (VD sai số tiền, phát hiện ngay trước khi cộng sổ).<\/li>\n<li><b>Ghi số âm<\/b>: ghi lại số sai bằng <b>mực đỏ hoặc trong ngoặc đơn<\/b>, rồi ghi lại số đúng.<\/li>\n<li><b>Ghi điều chỉnh (bổ sung)<\/b>: lập chứng từ điều chỉnh, ghi thêm số chênh lệch cho đúng.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Sai sót<\/th><th>Cách sửa<\/th><\/tr><\/thead><tbody>\n<tr><td>Đúng quan hệ đối ứng, ghi số tiền <b>nhỏ hơn<\/b> đúng<\/td><td><b>Ghi bổ sung<\/b> số chênh lệch, cùng chiều bút toán (VD đúng 90, ghi 60 → ghi thêm 30)<\/td><\/tr>\n<tr><td>Đúng quan hệ đối ứng, ghi số tiền <b>lớn hơn<\/b> đúng<\/td><td><b>Ghi số âm<\/b> số sai rồi ghi lại số đúng<\/td><\/tr>\n<tr><td>Sai quan hệ đối ứng (sai TK, ngược chiều)<\/td><td><b>Ghi số âm<\/b> bút toán sai (cả hai vế) + ghi lại bút toán đúng<\/td><\/tr>\n<tr><td>Ghi <b>trùng<\/b> bút toán<\/td><td><b>Ghi âm một lần<\/b> bút toán trùng<\/td><\/tr>\n<tr><td><b>Bỏ sót<\/b> nghiệp vụ<\/td><td><b>Ghi bổ sung<\/b> đầy đủ bút toán theo chứng từ hợp lệ<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 90–91; cách sửa theo loại sai sót: bài tập LMS chương 3 (bổ sung)"},{"id":"ch3-t15","title":"Đối chiếu, kiểm tra số liệu: Bảng cân đối tài khoản","core":"<p>Cần kiểm tra vì có thể sai sót khi ghi sổ; số liệu phải chính xác, trung thực trước khi lập báo cáo.<\/p>\n<p><b>Bảng cân đối tài khoản<\/b> (đối chiếu số dư và số phát sinh) = bảng kê <b>SDĐK, số phát sinh trong kỳ, SDCK<\/b> của <b>tất cả TK tổng hợp<\/b>; dùng kiểm tra, <b>không phải<\/b> báo cáo tài chính.<\/p>\n<p><b>Bảng tổng hợp chi tiết<\/b>: kê số liệu các TK cấp 2, sổ thẻ chi tiết theo từng TK tổng hợp, rồi <b>đối chiếu<\/b> với TK tổng hợp (có thể bằng tiền hoặc hiện vật).<\/p>","formulas":"<div class=\"formula\">Tổng số dư Nợ = Tổng số dư Có (đầu kỳ, cuối kỳ)<\/div>\n<div class=\"formula\">Tổng PS Nợ = Tổng PS Có<\/div>\n<div class=\"formula\">Tổng SDCK = Tổng SDĐK + Tổng PS tăng − Tổng PS giảm<\/div>","compare":"<table class=\"t\"><thead><tr><th><\/th><th>Bảng cân đối TK<\/th><th>Bảng cân đối TK kiểu bàn cờ<\/th><\/tr><\/thead><tbody>\n<tr><td>Phát hiện<\/td><td>Lệch Nợ ≠ Có (sai tổng)<\/td><td>Như bảng cân đối TK, <b>và<\/b> phát hiện <b>sai quan hệ đối ứng<\/b><\/td><\/tr>\n<tr><td>Không phát hiện<\/td><td colspan=\"2\">4 lỗi (bảng thường): sai quan hệ đối ứng, bỏ sót nghiệp vụ, ghi trùng bút toán, sai cùng một số tiền. Bàn cờ vẫn <b>không<\/b> phát hiện: <b>sai cùng số tiền, ghi trùng, bỏ sót<\/b><\/td><\/tr>\n<tr><td>Hạn chế<\/td><td>—<\/td><td>Nhiều TK, nhiều nghiệp vụ thì lập mất thời gian, thực tế ít dùng<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 3, slide 92–98"}],"flashcards":[{"id":"ch3-f01","topic":"ch3-t01","front":"Định nghĩa chứng từ kế toán?","back":"Giấy tờ, vật mang tin phản ánh nghiệp vụ kinh tế <b>phát sinh và đã hoàn thành<\/b>, làm <b>căn cứ ghi sổ<\/b> (Luật Kế toán Điều 4)."},{"id":"ch3-f02","topic":"ch3-t01","front":"Khi nào lập chứng từ?","back":"Ngay theo <b>đúng thời gian, địa điểm<\/b> phát sinh nghiệp vụ; không chờ cuối tháng, khi lập báo cáo hay yêu cầu của giám đốc."},{"id":"ch3-f03","topic":"ch3-t02","front":"Chứng từ gốc khác chứng từ tổng hợp?","back":"Gốc: lập ngay khi nghiệp vụ phát sinh, giá trị pháp lý cao nhất. Tổng hợp (ghi sổ): tổng hợp nhiều chứng từ gốc cùng loại, chỉ có giá trị khi <b>kèm chứng từ gốc<\/b>."},{"id":"ch3-f04","topic":"ch3-t02","front":"Chứng từ mệnh lệnh khác chứng từ chấp hành?","back":"Mệnh lệnh (lệnh chi, đề nghị tạm ứng): truyền lệnh, chưa hoàn thành, chưa đủ ghi sổ. Chấp hành (phiếu thu, chi, nhập, xuất): nghiệp vụ đã hoàn thành."},{"id":"ch3-f05","topic":"ch3-t02","front":"Chứng từ thủ tục kế toán là gì?","back":"Chứng từ trung gian phân loại nghiệp vụ để ghi sổ (bảng kê nộp séc, chứng từ ghi sổ); phải kèm chứng từ ban đầu."},{"id":"ch3-f06","topic":"ch3-t02","front":"Chứng từ nội bộ và bên ngoài, mỗi loại cho 2 ví dụ.","back":"Nội bộ (đơn vị lập): bảng thanh toán lương, phiếu xuất kho NVL. Bên ngoài (đơn vị khác lập): hóa đơn GTGT mua vào, giấy báo Nợ/Có ngân hàng."},{"id":"ch3-f07","topic":"ch3-t02","front":"Chứng từ 1 lần và nhiều lần?","back":"Theo số lần ghi nghiệp vụ trên chứng từ. Nhiều lần: theo dõi nhiều nghiệp vụ cùng loại liên tiếp trong một khoảng thời gian."},{"id":"ch3-f08","topic":"ch3-t02","front":"Giấy báo Nợ và giấy báo Có của ngân hàng?","back":"Báo Nợ: tiền gửi <b>giảm<\/b> (ghi Có 112). Báo Có: tiền gửi <b>tăng<\/b> (ghi Nợ 112). Chứng từ bên ngoài."},{"id":"ch3-f09","topic":"ch3-t03","front":"Yếu tố chủ yếu và yếu tố bổ sung của chứng từ?","back":"Chủ yếu (bắt buộc): tên, ngày, nơi lập/nhận, nội dung, quy mô, chữ ký. Bổ sung (không bắt buộc): <b>định khoản<\/b>, hình thức/thời gian thanh toán, hạn mức công nợ."},{"id":"ch3-f10","topic":"ch3-t03","front":"Mua NVL nhập kho, trả tiền mặt cần bộ chứng từ nào?","back":"Hóa đơn GTGT + phiếu nhập kho + phiếu chi."},{"id":"ch3-f11","topic":"ch3-t03","front":"Tạm ứng tiền mặt cho nhân viên: chứng từ nào là căn cứ ghi giảm tiền mặt?","back":"<b>Phiếu chi<\/b> (chấp hành). Giấy đề nghị tạm ứng, quyết định cử đi công tác là mệnh lệnh."},{"id":"ch3-f12","topic":"ch3-t04","front":"Trình tự xử lý chứng từ?","back":"Lập → Kiểm tra → Hoàn chỉnh → Luân chuyển → Bảo quản, lưu trữ."},{"id":"ch3-f13","topic":"ch3-t04","front":"Quy tắc lập chứng từ cần nhớ?","back":"Không tẩy xoá, không viết tắt; số tiền bằng chữ khớp bằng số; lập đủ liên một lần; đủ chữ ký, dấu; chứng từ điện tử phải in ra lưu trữ."},{"id":"ch3-f14","topic":"ch3-t04","front":"Thời hạn lưu trữ chứng từ?","back":"5 năm (quản lý điều hành); 10 năm (ghi sổ, lập BCTC); vĩnh viễn (tư liệu sử liệu quan trọng). NĐ 174/2016/NĐ-CP."},{"id":"ch3-f15","topic":"ch3-t05","front":"Định nghĩa tài khoản kế toán?","back":"Phương pháp theo dõi thường xuyên, liên tục, có hệ thống tình hình hiện có và biến động của từng đối tượng kế toán cụ thể."},{"id":"ch3-f16","topic":"ch3-t05","front":"Số dư và số phát sinh khác nhau thế nào?","back":"Số dư: tình hình hiện có tại một thời điểm (đầu/cuối kỳ). Số phát sinh: biến động tăng, giảm trong kỳ."},{"id":"ch3-f17","topic":"ch3-t05","front":"Công thức số dư cuối kỳ?","back":"<div class=\"formula\">SDCK = SDĐK + PS tăng − PS giảm<\/div>"},{"id":"ch3-f18","topic":"ch3-t05","front":"Nợ và Có nghĩa là gì?","back":"Chỉ là <b>quy ước<\/b> (trái = Nợ, phải = Có), không có ý nghĩa kinh tế."},{"id":"ch3-f19","topic":"ch3-t06","front":"Ý nghĩa 3 chữ số của số hiệu TK (VD 111)?","back":"Số 1: loại TK; số 2: nhóm TK trong loại (11 – tiền); số 3: số thứ tự trong nhóm."},{"id":"ch3-f20","topic":"ch3-t06","front":"Loại 1, 2, 3, 4, 5, 6, 9 lần lượt là gì?","back":"1 TS ngắn hạn; 2 TS dài hạn; 3 nợ phải trả; 4 vốn CSH; 5 doanh thu; 6 chi phí SXKD; 9 xác định kết quả kinh doanh."},{"id":"ch3-f21","topic":"ch3-t07","front":"Kết cấu TK tài sản?","back":"SDĐK và PS tăng bên <b>Nợ<\/b>; PS giảm bên <b>Có<\/b>; SDCK bên Nợ."},{"id":"ch3-f22","topic":"ch3-t07","front":"Kết cấu TK nguồn vốn?","back":"SDĐK và PS tăng bên <b>Có<\/b>; PS giảm bên <b>Nợ<\/b>; SDCK bên Có."},{"id":"ch3-f23","topic":"ch3-t07","front":"Kết cấu TK chi phí và TK doanh thu?","back":"Chi phí: tăng Nợ, kết chuyển Có. Doanh thu: tăng Có, kết chuyển Nợ. Cả hai không có số dư cuối kỳ."},{"id":"ch3-f24","topic":"ch3-t07","front":"Kết cấu TK 911?","back":"Nợ: kết chuyển chi phí và lãi. Có: kết chuyển thu nhập và lỗ. Không có số dư."},{"id":"ch3-f25","topic":"ch3-t07","front":"Phân loại TK theo công dụng và kết cấu?","back":"TK chủ yếu (tài sản, nguồn vốn, hỗn hợp), TK điều chỉnh, TK nghiệp vụ."},{"id":"ch3-f26","topic":"ch3-t08","front":"TK hỗn hợp là gì? Cho ví dụ.","back":"Vừa phản ánh tài sản vừa phản ánh nguồn vốn, có thể dư Nợ hoặc Có: TK 131, TK 331."},{"id":"ch3-f27","topic":"ch3-t08","front":"Khách trả trước tiền hàng, ghi thế nào? Số dư 131 ra sao?","back":"Nợ 112 (hoặc 111) / Có 131. Khi dư Có, TK 131 là khách trả trước (nguồn vốn). Chưa giao hàng: chưa ghi doanh thu."},{"id":"ch3-f28","topic":"ch3-t08","front":"Lập Bảng CĐKT với TK 131, 331 có bù trừ không?","back":"<b>Không bù trừ<\/b>: mở chi tiết từng đối tượng, tách số dư Nợ và số dư Có."},{"id":"ch3-f29","topic":"ch3-t09","front":"TK điều chỉnh giảm tài sản có kết cấu thế nào? Ví dụ.","back":"<b>Ngược<\/b> TK tài sản: tăng Có, giảm Nợ, dư Có. VD TK 214, dự phòng."},{"id":"ch3-f30","topic":"ch3-t09","front":"Trích khấu hao TSCĐ ghi vào bên nào của TK 214?","back":"Bên <b>Có<\/b> (hao mòn tăng); Nợ 214 chỉ khi thanh lý, nhượng bán."},{"id":"ch3-f31","topic":"ch3-t09","front":"TK điều chỉnh giảm vốn CSH, ví dụ và số dư?","back":"Cổ phiếu mua lại của chính mình; dư <b>Nợ<\/b>, trình bày số âm trong vốn CSH. TK 421 dư Nợ = lỗ lũy kế."},{"id":"ch3-f32","topic":"ch3-t10","front":"Nguyên tắc ghi sổ kép?","back":"Ghi vào ít nhất 2 TK, một Nợ một Có, số tiền bằng nhau; tổng PS Nợ = tổng PS Có."},{"id":"ch3-f33","topic":"ch3-t10","front":"Định khoản giản đơn và phức tạp?","back":"Giản đơn: 2 TK tổng hợp. Phức tạp: từ 3 TK tổng hợp trở lên."},{"id":"ch3-f34","topic":"ch3-t10","front":"Ghi sổ đơn dùng khi nào?","back":"Phản ánh vào <b>TK chi tiết<\/b> và <b>TK ngoài bảng<\/b>, độc lập, không có quan hệ đối ứng."},{"id":"ch3-f35","topic":"ch3-t11","front":"Mua hàng chịu 200, GTGT 10%: định khoản?","back":"Nợ 156: 200; Nợ 133: 20 / Có 331: 220."},{"id":"ch3-f36","topic":"ch3-t11","front":"Vay ngắn hạn trả nợ người bán 300?","back":"Nợ 331: 300 / Có 341: 300 (NV tăng, NV giảm)."},{"id":"ch3-f37","topic":"ch3-t11","front":"Nhận vốn góp tiền mặt; nhận ký quỹ ngắn hạn tiền mặt?","back":"Vốn góp: Nợ 111 / Có 411. Ký quỹ: Nợ 111 / Có 344."},{"id":"ch3-f38","topic":"ch3-t11","front":"Trích lợi nhuận sau thuế lập quỹ đầu tư phát triển?","back":"Nợ 421 / Có 414."},{"id":"ch3-f39","topic":"ch3-t12","front":"Kế toán tổng hợp khác kế toán chi tiết?","back":"Tổng hợp: TK cấp 1, thước đo giá trị. Chi tiết: TK cấp 2/sổ thẻ chi tiết, thước đo giá trị, hiện vật, thời gian lao động."},{"id":"ch3-f40","topic":"ch3-t13","front":"Khi nào mở sổ kế toán? Mở sổ gồm việc gì?","back":"Khi mới thành lập hoặc bắt đầu kỳ kế toán mới. Đăng ký danh mục sổ, ghi chuyển số dư đầu kỳ; chỉ một hệ thống sổ chính thức."},{"id":"ch3-f41","topic":"ch3-t13","front":"Sổ ghi theo thời gian, theo hệ thống, kết hợp?","back":"Thời gian: nhật ký chung, sổ đăng ký CTGS. Hệ thống: sổ cái, sổ chi tiết, NKCT. Kết hợp: Nhật ký – Sổ cái."},{"id":"ch3-f42","topic":"ch3-t14","front":"Ba phương pháp chữa sổ?","back":"Cải chính (gạch, ghi đúng, KTT ký); ghi số âm (mực đỏ/ngoặc đơn, ghi lại đúng); ghi điều chỉnh (chứng từ điều chỉnh, ghi thêm chênh lệch)."},{"id":"ch3-f43","topic":"ch3-t14","front":"Ghi số tiền nhỏ hơn đúng (60 thay vì 90): sửa thế nào?","back":"Ghi bổ sung 30 cùng chiều bút toán. Ghi lớn hơn đúng: ghi số âm rồi ghi lại số đúng."},{"id":"ch3-f44","topic":"ch3-t14","front":"Sửa ghi trùng bút toán, sai quan hệ đối ứng, bỏ sót?","back":"Trùng: ghi âm một lần. Sai đối ứng: ghi âm bút toán sai rồi ghi lại đúng. Bỏ sót: ghi bổ sung bút toán đầy đủ."},{"id":"ch3-f45","topic":"ch3-t15","front":"Các hệ thức kiểm tra của Bảng cân đối TK?","back":"Tổng dư Nợ = tổng dư Có; tổng PS Nợ = tổng PS Có; tổng SDCK = tổng SDĐK + PS tăng − PS giảm."},{"id":"ch3-f46","topic":"ch3-t15","front":"4 sai sót Bảng cân đối TK không phát hiện được?","back":"Sai quan hệ đối ứng, bỏ sót nghiệp vụ, ghi trùng bút toán, sai cùng một số tiền."},{"id":"ch3-f47","topic":"ch3-t15","front":"Bảng cân đối TK kiểu bàn cờ khắc phục gì?","back":"Phát hiện được sai quan hệ đối ứng; vẫn không phát hiện sai cùng số tiền, ghi trùng, bỏ sót. Thực tế ít dùng."},{"id":"ch3-f48","topic":"ch3-t15","front":"Bảng tổng hợp chi tiết dùng để làm gì?","back":"Kê số liệu TK cấp 2/sổ thẻ chi tiết theo từng TK tổng hợp rồi đối chiếu với TK tổng hợp."}],"notes":"<p><b>Khác biệt slide – nguồn ngoài:<\/b> slide ghi một số tên TK cũ (TK 411 &quot;Nguồn vốn kinh doanh&quot;, TK 341 &quot;Vay ngắn hạn&quot;); theo TT200 là 411 &quot;Vốn đầu tư của chủ sở hữu&quot;, 341 &quot;Vay và nợ thuê tài chính&quot;. Dùng số hiệu theo bài tập/slide. Slide 56 ghi TK điều chỉnh gồm &quot;tăng, giảm, vừa tăng vừa giảm&quot;; đề thi hay hỏi nhóm điều chỉnh giảm.<\/p>\n<p><b>Cần hỏi giảng viên:<\/b> (1) thời điểm dùng cải chính (trước khi cộng sổ) so với ghi số âm; (2) phạm vi bắt buộc nhớ số hiệu TK (TT200 hay TT133); (3) chênh lệch số hiệu TK ký quỹ (344) và quỹ đầu tư phát triển (414) lấy theo bài tập LMS.<\/p>","fx":{"items":[{"id":"ch3-f-01","name":"Số dư cuối kỳ – TK tài sản (và TK chi phí khi có số dư)","topic":"ch3","formula":"<div class=\"formula\">SDCK (Nợ) = SDĐK (Nợ) + PS Nợ (tăng) − PS Có (giảm)<\/div>","parts":"<ul><li><b>SDĐK<\/b>: số dư đầu kỳ, nằm bên Nợ<\/li><li><b>PS Nợ<\/b>: tổng số phát sinh bên Nợ trong kỳ (tăng)<\/li><li><b>PS Có<\/b>: tổng số phát sinh bên Có trong kỳ (giảm)<\/li><li>Đơn vị: đồng (hoặc triệu đồng)<\/li><\/ul>","example":"<p>VD: TK 111: 200 + 340 − 320 = 220 (triệu đồng).<\/p>","source":"Slide Chương 3, slide 38, 47–48 (SDCK = SDĐK + SPS tăng − SPS giảm)"},{"id":"ch3-f-02","name":"Số dư cuối kỳ – TK nguồn vốn (nợ phải trả, vốn chủ sở hữu)","topic":"ch3","formula":"<div class=\"formula\">SDCK (Có) = SDĐK (Có) + PS Có (tăng) − PS Nợ (giảm)<\/div>","parts":"<ul><li><b>SDĐK<\/b>: số dư đầu kỳ, nằm bên Có<\/li><li><b>PS Có<\/b>: số phát sinh tăng, ghi bên Có<\/li><li><b>PS Nợ<\/b>: số phát sinh giảm, ghi bên Nợ<\/li><\/ul>","example":"<p>VD: TK 341: 200 + 300 − (140 + 100) = 260 (triệu đồng).<\/p>","source":"Slide Chương 3, slide 49–50 (VD 2: vay ngắn hạn)"},{"id":"ch3-f-03","name":"Cân đối của bảng cân đối tài khoản – số dư","topic":"ch3","formula":"<div class=\"formula\">Tổng SDĐK bên Nợ của các TK = Tổng SDĐK bên Có của các TK<\/div><div class=\"formula\">Tổng SDCK bên Nợ của các TK = Tổng SDCK bên Có của các TK<\/div>","parts":"<ul><li>Lấy tất cả TK tổng hợp trên bảng<\/li><li>Hai vế phải bằng nhau; lệch nghĩa là có sai sót ghi sổ hoặc tính số dư<\/li><\/ul>","example":"<p>VD: Tổng SDCK Nợ = 1.250 và tổng SDCK Có = 1.250 (triệu đồng) thì bảng cân đối.<\/p>","source":"Slide Chương 3, slide 94 (tính cân đối)"},{"id":"ch3-f-04","name":"Cân đối của bảng cân đối tài khoản – số phát sinh","topic":"ch3","formula":"<div class=\"formula\">Tổng PS Nợ của các TK = Tổng PS Có của các TK<\/div>","parts":"<ul><li>Nhờ nguyên tắc ghi kép: mỗi nghiệp vụ ghi Nợ một (hay nhiều) TK và ghi Có số tiền tương ứng<\/li><li>Chỉ đúng khi cộng đủ mọi TK tổng hợp trong kỳ<\/li><\/ul>","example":"<p>VD: Tổng PS Nợ = 3.480 và tổng PS Có = 3.480 (triệu đồng).<\/p>","source":"Slide Chương 3, slide 94"},{"id":"ch3-f-05","name":"Liên hệ số dư cuối kỳ trên bảng cân đối tài khoản","topic":"ch3","formula":"<div class=\"formula\">Σ SDCK = Σ SDĐK + Σ PS tăng − Σ PS giảm (của các TK)<\/div>","parts":"<ul><li><b>Σ SDĐK<\/b>: tổng số dư đầu kỳ của các TK<\/li><li><b>Σ PS tăng, Σ PS giảm<\/b>: tổng phát sinh tăng, giảm trong kỳ<\/li><li>Dùng để kiểm tra cột số dư cuối kỳ có tính đúng không<\/li><\/ul>","example":"<p>VD: Σ SDĐK = 1.100, Σ PS tăng = 400, Σ PS giảm = 250 thì Σ SDCK = 1.100 + 400 − 250 = 1.250.<\/p>","source":"Slide Chương 3, slide 94"},{"id":"ch3-f-06","name":"Đối chiếu tài khoản tổng hợp với tài khoản chi tiết","topic":"ch3","formula":"<div class=\"formula\">Số liệu TK tổng hợp = Σ số liệu các TK/sổ chi tiết của TK đó<\/div>","parts":"<ul><li>Áp dụng cho số dư đầu kỳ, số phát sinh, số dư cuối kỳ<\/li><li>Lập bảng tổng hợp chi tiết rồi so với TK tổng hợp<\/li><\/ul>","example":"<p>VD: TK 131 có SDCK 90 = 50 (KH A) + 40 (KH B) (triệu đồng).<\/p>","source":"Slide Chương 3, slide 98"},{"id":"ch3-f-07","name":"Kết quả kinh doanh (kết chuyển vào TK 911)","topic":"ch3","formula":"<div class=\"formula\">Lãi (Lỗ) = Σ doanh thu, thu nhập kết chuyển − Σ chi phí kết chuyển<\/div>","parts":"<ul><li>Doanh thu, thu nhập k/c bên Có TK 911; chi phí k/c bên Nợ TK 911<\/li><li>Kết quả dương là lãi, âm là lỗ<\/li><\/ul>","example":"<p>VD: Doanh thu và thu nhập 500, chi phí 420 thì lãi = 500 − 420 = 80 (triệu đồng).<\/p>","source":"Slide Chương 3, slide 51 (TK phản ánh KQKD)"}],"note":"<p>Chương 3 chủ yếu là nguyên tắc ghi chép, nên chỉ có một số công thức tính số: số dư tài khoản, tính cân đối của bảng cân đối tài khoản và đối chiếu số liệu. Công thức giá trị còn lại, khấu hao TSCĐ nằm ở Chương 4.<\/p>"}},"ch4":{"chapter":"ch4","title":"Chương 4 – Tính giá các đối tượng kế toán","topics":[{"id":"ch4-t01","title":"Xác định giá trị đối tượng kế toán: khái niệm, ý nghĩa, yêu cầu","core":"<ul>\n<li><b>Xác định giá trị<\/b> (tính giá) = chỉ định <b>số tiền<\/b> mà các yếu tố của BCTC được ghi nhận và báo cáo, lượng hóa bằng thước đo tiền tệ.<\/li>\n<li><b>Ý nghĩa:<\/b> là bước đi trước ghi sổ, tổng hợp số liệu, lập BCTC; kết quả ảnh hưởng trực tiếp đến chất lượng quyết định của người dùng thông tin.<\/li>\n<li><b>Yêu cầu:<\/b> tránh tùy tiện, chủ quan; hai đặc điểm chất lượng chi phối là:\n<ul><li><b>Đáng tin cậy:<\/b> thông tin liên quan được ghi nhận <b>đầy đủ<\/b>; chịu tác động rõ nét của nguyên tắc <b>khách quan<\/b> và <b>thận trọng<\/b>.<\/li>\n<li><b>Có thể so sánh:<\/b> <b>thống nhất, nhất quán<\/b> phương pháp giữa các kỳ/giữa các đơn vị; nếu <b>thay đổi phương pháp<\/b> phải <b>giải trình trong Thuyết minh BCTC<\/b>.<\/li><\/ul><\/li>\n<li>Nguyên tắc <b>giá gốc<\/b> xuất phát từ giả định <b>hoạt động liên tục<\/b> (không định giá theo giá thanh lý). <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Yêu cầu<\/th><th>Nội dung<\/th><th>Nguyên tắc/biểu hiện<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Đáng tin cậy<\/b><\/td><td>Đầy đủ, trung thực, không chủ quan<\/td><td>Khách quan, thận trọng (VD: lập dự phòng giảm giá)<\/td><\/tr>\n<tr><td><b>So sánh được<\/b><\/td><td>Cùng phương pháp giữa các kỳ/đơn vị<\/td><td>Nhất quán; đổi phương pháp phải thuyết minh<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 4–9; (bổ sung: nguyên tắc giá gốc – hoạt động liên tục)"},{"id":"ch4-t02","title":"Các loại giá dùng trong kế toán","core":"<ul>\n<li><b>Giá gốc:<\/b> giá trị ghi nhận <b>ban đầu<\/b> của tài sản/nợ phải trả = <b>chi phí mua, bốc xếp, vận chuyển, lắp ráp, chế biến và chi phí liên quan trực tiếp<\/b> đến khi tài sản <b>sẵn sàng sử dụng<\/b>; tính theo tiền/tương đương tiền <b>đã trả, phải trả<\/b> hoặc giá trị hợp lý lúc ghi nhận. <b>Không thay đổi<\/b> trừ khi chuẩn mực cụ thể có quy định khác (VAS 01). Ưu: khách quan, có chứng từ, đáng tin cậy; nhược: không phản ánh giá thị trường hiện tại.<\/li>\n<li><b>Giá trị hợp lý:<\/b> giá trị phù hợp giá thị trường, có thể nhận được khi bán tài sản/chuyển nhượng nợ phải trả tại thời điểm xác định; là giá trị trao đổi giữa các bên <b>hiểu biết đầy đủ, tự nguyện, ngang giá<\/b> (VAS 03). Ghi nhận ban đầu theo giá gốc; <b>sau đó<\/b> tài sản/nợ biến động thường xuyên theo thị trường và xác định lại đáng tin cậy thì ghi theo giá trị hợp lý <b>tại cuối kỳ lập BCTC<\/b> (Luật Kế toán 2015).<\/li>\n<li><b>Giá trị thuần có thể thực hiện được (NRV)<\/b> (VAS 02, hàng tồn kho): là <b>cơ sở lập dự phòng giảm giá hàng tồn kho<\/b>.<\/li>\n<li><b>Giá thị trường<\/b> <span class=\"tag ext\">Bổ sung<\/span>: bên <b>mua<\/b> nhìn là <b>giá thay thế<\/b> (giá phải trả để mua sắm lại); bên <b>bán<\/b> nhìn là <b>giá bán<\/b>.<\/li>\n<li><b>Giá hạch toán<\/b> <span class=\"tag ext\">Bổ sung<\/span>: do <b>doanh nghiệp tự xây dựng<\/b>, tương đối ổn định, dùng ghi sổ tạm thời trong kỳ; <b>cuối kỳ phải điều chỉnh về giá gốc<\/b> (qua hệ số giá) để lập BCTC.<\/li>\n<\/ul>","formulas":"<div class=\"formula\">Giá trị thuần có thể thực hiện (NRV) = Giá bán ước tính − Chi phí ước tính để hoàn thành − Chi phí ước tính để tiêu thụ<\/div>\n<div class=\"formula\">Hệ số giá = (Giá thực tế tồn đầu + Giá thực tế nhập trong kỳ) ÷ (Giá hạch toán tồn đầu + Giá hạch toán nhập trong kỳ)<br>Giá thực tế xuất = Giá hạch toán xuất × Hệ số giá<\/div>\n<p><span class=\"tag ext\">Bổ sung<\/span> Hệ số giá là cách điều chỉnh giá hạch toán về giá gốc, không có trong slide.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Giá gốc<\/th><th>Giá trị hợp lý<\/th><th>Giá trị thuần có thể thực hiện<\/th><\/tr><\/thead><tbody>\n<tr><td>Bản chất<\/td><td>Chi phí thực tế để có tài sản<\/td><td>Giá thị trường, trao đổi ngang giá<\/td><td>Giá bán ước tính − chi phí hoàn thành, bán<\/td><\/tr>\n<tr><td>Thời điểm dùng<\/td><td>Ghi nhận <b>ban đầu<\/b>; không đổi<\/td><td>Sau ghi nhận ban đầu, <b>cuối kỳ<\/b> lập BCTC (tài sản/nợ biến động thường xuyên)<\/td><td>Cuối kỳ/BCTC năm, so với giá gốc<\/td><\/tr>\n<tr><td>Độ tin cậy<\/td><td>Cao (có chứng từ)<\/td><td>Phụ thuộc thị trường, phải đáng tin cậy<\/td><td>Dựa ước tính<\/td><\/tr>\n<tr><td>Dùng cho<\/td><td>Mọi tài sản, nợ phải trả<\/td><td>Một số tài sản/nợ (VD: chứng khoán kinh doanh ghi nhận ban đầu)<\/td><td>Hàng tồn kho (dự phòng giảm giá)<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Giá thị trường – góc nhìn<\/th><th>Là<\/th><\/tr><\/thead><tbody>\n<tr><td>Doanh nghiệp là <b>bên mua<\/b><\/td><td>Giá thay thế<\/td><\/tr>\n<tr><td>Doanh nghiệp là <b>bên bán<\/b><\/td><td>Giá bán<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 10–13; (bổ sung: giá thị trường, giá hạch toán từ ngân hàng bài tập)"},{"id":"ch4-t03","title":"Tài sản cố định: tiêu chuẩn và nguyên giá","core":"<ul>\n<li><b>TSCĐ hữu hình:<\/b> có hình thái vật chất, DN nắm giữ để dùng cho SXKD (VAS 03). <b>TSCĐ vô hình:<\/b> không có hình thái vật chất nhưng xác định được giá trị, DN nắm giữ, sử dụng trong SXKD/cung cấp dịch vụ/cho thuê (VAS 04).<\/li>\n<li><b>3 tiêu chuẩn ghi nhận TSCĐ<\/b> (TT 45/2013): (1) chắc chắn thu <b>lợi ích kinh tế<\/b> tương lai; (2) <b>thời gian sử dụng trên 1 năm<\/b>; (3) nguyên giá xác định tin cậy và <b>từ 30.000.000 đồng trở lên<\/b>.<\/li>\n<li>TSCĐ tính theo <b>giá gốc = nguyên giá<\/b>: toàn bộ chi phí DN bỏ ra để có TSCĐ tính đến thời điểm đưa vào <b>trạng thái sẵn sàng sử dụng<\/b>. TSCĐ vô hình cũng ghi ban đầu theo nguyên giá.<\/li>\n<li>Mỗi TSCĐ quản lý theo 3 chỉ tiêu: <b>nguyên giá, hao mòn lũy kế, giá trị còn lại<\/b>.<\/li>\n<li>Thuế GTGT đầu vào của TSCĐ: DN tính thuế <b>khấu trừ<\/b> → thuế được khấu trừ (Nợ TK 133), <b>không<\/b> vào nguyên giá; DN tính thuế <b>trực tiếp<\/b> → thuế đầu vào <b>tính vào nguyên giá<\/b>. <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":"<div class=\"formula\">Nguyên giá (mua sắm) = Giá mua (trừ chiết khấu, giảm giá) + Thuế không được hoàn lại (VD: thuế NK, lệ phí trước bạ) + Chi phí trước khi sử dụng (vận chuyển, lắp đặt, chạy thử...)<\/div>\n<div class=\"formula\">Nguyên giá (nhận góp vốn) = Giá trị theo đánh giá của Hội đồng giao nhận + Chi phí liên quan trực tiếp khác<\/div>\n<div class=\"formula\">Nguyên giá (được cấp) = Giá trị còn lại trên sổ đơn vị cấp (hoặc giá do Hội đồng giao nhận đánh giá) + Chi phí liên quan trực tiếp khác<\/div>\n<div class=\"formula\">Nguyên giá (đầu tư XDCB) = Giá quyết toán công trình + Lệ phí trước bạ + Chi phí liên quan trực tiếp khác<\/div>\n<div class=\"formula\">Giá trị còn lại = Nguyên giá − Hao mòn lũy kế (khấu hao lũy kế)<\/div>\n<p>VD (slide): mua ô tô giá 550 triệu (gồm GTGT 10%), chi phí liên quan 13,2 triệu (gồm GTGT 10%), khấu trừ → Nguyên giá = 550/1,1 + 13,2/1,1 = 500 + 12 = <b>512 triệu<\/b>.<\/p>\n<p>Bóc thuế: Giá chưa thuế = Giá thanh toán ÷ (1 + thuế suất).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Cách hình thành TSCĐ<\/th><th>Cơ sở tính nguyên giá<\/th><\/tr><\/thead><tbody>\n<tr><td>Mua sắm<\/td><td>Giá mua + thuế không hoàn lại + chi phí trước sử dụng<\/td><\/tr>\n<tr><td>Nhận góp vốn<\/td><td>Giá Hội đồng giao nhận đánh giá + chi phí liên quan<\/td><\/tr>\n<tr><td>Được cấp<\/td><td>Giá trị còn lại trên sổ đơn vị cấp (hoặc đánh giá) + chi phí liên quan<\/td><\/tr>\n<tr><td>Đầu tư XDCB<\/td><td>Giá quyết toán + lệ phí trước bạ + chi phí liên quan<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Thuế GTGT đầu vào<\/th><th>Khấu trừ<\/th><th>Trực tiếp<\/th><\/tr><\/thead><tbody>\n<tr><td>Vào nguyên giá TSCĐ?<\/td><td>Không (Nợ TK 133)<\/td><td>Có<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 15–23; (bổ sung: GTGT khấu trừ/trực tiếp)"},{"id":"ch4-t04","title":"Hao mòn và khấu hao TSCĐ","core":"<ul>\n<li><b>Hao mòn TSCĐ:<\/b> giảm dần giá trị sử dụng và giá trị do sử dụng, bào mòn tự nhiên, tiến bộ kỹ thuật. <b>Hao mòn lũy kế<\/b> = tổng hao mòn đến thời điểm báo cáo (TK 214, tài khoản điều chỉnh giảm TSCĐ).<\/li>\n<li><b>Khấu hao:<\/b> tính toán và <b>phân bổ có hệ thống nguyên giá<\/b> vào chi phí SXKD trong <b>thời gian trích khấu hao<\/b> (thời gian cần thiết để thu hồi vốn đầu tư). <b>Khấu hao lũy kế<\/b> = tổng số đã trích vào chi phí qua các kỳ.<\/li>\n<li><b>3 phương pháp:<\/b> đường thẳng; số dư giảm dần (có điều chỉnh); theo số lượng sản phẩm.<\/li>\n<li>Khấu hao tính vào chi phí theo bộ phận sử dụng: phân xưởng → TK 627; bán hàng → TK 641; quản lý → TK 642 (Nợ TK chi phí / Có TK 214). <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<li>Không tự ý đổi phương pháp khấu hao trong kỳ (nhất quán); đổi phải giải trình. <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":"<div class=\"formula\">Mức KH năm (đường thẳng) = Nguyên giá ÷ Thời gian sử dụng (năm)<br>Mức KH tháng = Mức KH năm ÷ 12 = Nguyên giá ÷ (Số năm × 12)<\/div>\n<div class=\"formula\">Tỷ lệ KH nhanh = Tỷ lệ KH đường thẳng × Hệ số điều chỉnh<br>Mức KH năm (số dư giảm dần) = Giá trị còn lại đầu năm × Tỷ lệ KH nhanh<\/div>\n<p>Trong đó Tỷ lệ KH đường thẳng = 1 ÷ số năm sử dụng. Hệ số điều chỉnh <span class=\"tag ext\">Bổ sung<\/span> (TT 45/2013): thời gian sử dụng <b>≤ 4 năm → 1,5<\/b>; <b>&gt; 4 đến 6 năm → 2<\/b>; <b>&gt; 6 năm → 2,5<\/b>. Những năm cuối, khi mức KH nhanh <b>&lt;<\/b> mức KH bình quân (GTCL ÷ số năm còn lại) thì lấy <b>mức bình quân<\/b> đó (chuyển sang đường thẳng).<\/p>\n<div class=\"formula\">Mức KH tháng (theo sản lượng) = Số lượng SP tháng × Mức KH bình quân 1 đơn vị SP<br>Mức KH bình quân 1 đơn vị SP = Nguyên giá ÷ Sản lượng theo công suất thiết kế<\/div>\n<p>VD (slide): thiết bị K, nguyên giá 900 triệu, 5 năm. Đường thẳng: 900/5 = <b>180<\/b>/năm. Số dư giảm dần: tỷ lệ 20% × 2 = 40% → năm 1: <b>360<\/b> (GTCL 540); năm 2: <b>216<\/b> (324); năm 3: <b>129,6<\/b> (194,4); năm 4 và 5: 194,4 ÷ 2 = <b>97,2<\/b> mỗi năm. Tổng = 900.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Đường thẳng<\/th><th>Số dư giảm dần (điều chỉnh)<\/th><th>Theo số lượng sản phẩm<\/th><\/tr><\/thead><tbody>\n<tr><td>Mức KH hằng năm<\/td><td><b>Không đổi<\/b><\/td><td><b>Giảm dần<\/b> (năm đầu cao nhất)<\/td><td>Thay đổi theo sản lượng<\/td><\/tr>\n<tr><td>Căn cứ tính<\/td><td>Nguyên giá<\/td><td>Giá trị còn lại đầu kỳ × tỷ lệ nhanh<\/td><td>Nguyên giá ÷ sản lượng thiết kế<\/td><\/tr>\n<tr><td>Cần hệ số điều chỉnh<\/td><td>Không<\/td><td>Có (1,5 / 2 / 2,5)<\/td><td>Không<\/td><\/tr>\n<tr><td>Cuối thời gian<\/td><td>GTCL về 0 đều<\/td><td>Chuyển sang mức bình quân ở các năm cuối<\/td><td>Theo sản lượng thực tế<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Khái niệm<\/th><th>Là<\/th><\/tr><\/thead><tbody>\n<tr><td>Nguyên giá<\/td><td>Giá gốc TSCĐ lúc ghi nhận<\/td><\/tr>\n<tr><td>Khấu hao lũy kế (hao mòn lũy kế)<\/td><td>Tổng KH đã trích đến thời điểm báo cáo<\/td><\/tr>\n<tr><td>Giá trị còn lại<\/td><td>Nguyên giá − KH lũy kế<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 24–32; (bổ sung: hệ số điều chỉnh TT 45/2013, công thức khấu hao theo sản lượng, TK chi phí)"},{"id":"ch4-t05","title":"Hàng tồn kho và phương pháp kế toán hàng tồn kho","core":"<ul>\n<li><b>Hàng tồn kho:<\/b> tài sản (a) <b>giữ để bán<\/b> trong kỳ SXKD bình thường; (b) đang trong quá trình <b>sản xuất dở dang<\/b>; (c) <b>nguyên liệu, vật liệu, công cụ, dụng cụ<\/b> dùng cho SXKD/dịch vụ.<\/li>\n<li>Gồm: hàng hóa mua về để bán (tồn kho, đang đi đường, gửi đi bán, gửi gia công); sản phẩm tồn kho và gửi bán; sản phẩm dở dang (gồm thành phẩm chưa làm thủ tục nhập kho); NVL, CCDC (tồn kho, gửi gia công, mua đang đi đường); chi phí dịch vụ dở dang.<\/li>\n<li><b>Kê khai thường xuyên (KKTX):<\/b> theo dõi, phản ánh <b>liên tục, có hệ thống<\/b> nhập – xuất – tồn trên sổ; TK hàng tồn kho phản ánh số hiện có và biến động tăng, giảm. Giá xuất tính <b>ngay khi xuất<\/b>.<\/li>\n<li><b>Kiểm kê định kỳ (KKĐK):<\/b> căn cứ <b>kết quả kiểm kê thực tế cuối kỳ<\/b> để xác định giá trị tồn cuối kỳ, từ đó <b>suy ra giá trị xuất<\/b> trong kỳ. Giá xuất tính <b>cuối kỳ<\/b>.<\/li>\n<li>Hàng tồn kho ghi sổ theo <b>giá gốc<\/b>; trình bày trên BCTC theo giá <b>thấp hơn<\/b> giữa giá gốc và giá trị thuần có thể thực hiện. <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":"<div class=\"formula\">Giá trị tồn cuối kỳ = Tồn đầu kỳ + Nhập trong kỳ − Xuất trong kỳ<\/div>\n<div class=\"formula\">KKĐK: Giá trị xuất trong kỳ = Tồn đầu kỳ + Nhập trong kỳ − Tồn cuối kỳ (theo kiểm kê)<\/div>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Kê khai thường xuyên<\/th><th>Kiểm kê định kỳ<\/th><\/tr><\/thead><tbody>\n<tr><td>Theo dõi nhập – xuất<\/td><td>Liên tục sau mỗi nghiệp vụ<\/td><td>Chỉ theo dõi nhập; xuất suy ra cuối kỳ<\/td><\/tr>\n<tr><td>Căn cứ giá trị tồn<\/td><td>Sổ kế toán<\/td><td>Kiểm kê thực tế cuối kỳ<\/td><\/tr>\n<tr><td>Thời điểm tính giá xuất<\/td><td>Khi xuất<\/td><td>Cuối kỳ<\/td><\/tr>\n<tr><td>TK thường dùng <span class=\"tag ext\">Bổ sung<\/span><\/td><td>152, 156, 154, 632<\/td><td>611, 631<\/td><\/tr><\/tbody><\/table>\n<p>Lưu ý: kê khai thường xuyên/kiểm kê định kỳ là <b>phương pháp theo dõi<\/b> hàng tồn kho; FIFO, bình quân, đích danh là <b>phương pháp tính giá xuất<\/b>.<\/p>","source":"Slide Chương 4, slide 33–35; (bổ sung: TK 611/631, trình bày BCTC)"},{"id":"ch4-t06","title":"Giá thực tế nhập kho (NVL, CCDC, hàng hóa)","core":"<ul>\n<li><b>Mua ngoài:<\/b> giá gốc = giá mua <b>trừ<\/b> chiết khấu thương mại, giảm giá, hàng mua trả lại <b>cộng<\/b> các khoản thuế <b>không được hoàn lại<\/b> <b>cộng<\/b> chi phí mua khác (vận chuyển, bốc dỡ, bảo quản trong quá trình mua...).<\/li>\n<li><b>Thuế GTGT khấu trừ<\/b>: thuế đầu vào được khấu trừ (Nợ TK 133) → <b>không<\/b> tính vào giá gốc; chi phí mua cũng phải <b>bóc thuế GTGT<\/b> (chia 1,1 nếu thuế 10%). <b>Thuế GTGT trực tiếp<\/b>: thuế đầu vào <b>tính vào<\/b> giá gốc.<\/li>\n<li><b>Hàng nhập khẩu:<\/b> giá gốc = giá nhập khẩu (CIF, đổi ra VND theo tỷ giá) + <b>thuế nhập khẩu<\/b> + <b>thuế TTĐB<\/b> (nếu có) + chi phí khác. Thuế NK, TTĐB <b>không được hoàn lại<\/b> nên vào giá gốc; thuế GTGT hàng nhập khẩu được khấu trừ nên <b>không<\/b> vào giá gốc (trừ khi nộp thuế GTGT trực tiếp).<\/li>\n<li><b>Hao hụt khi mua<\/b> <span class=\"tag ext\">Bổ sung<\/span>: hao hụt <b>trong định mức<\/b> vẫn tính vào giá gốc (tổng giá giữ nguyên, số lượng thực nhập giảm → đơn giá tăng); phần <b>vượt định mức<\/b> xử lý riêng (chờ xử lý/bồi thường), <b>không<\/b> tính vào giá nhập kho.<\/li>\n<\/ul>","formulas":"<div class=\"formula\">Giá thực tế nhập kho = Giá mua − (Chiết khấu TM + Giảm giá + Hàng mua trả lại) + Thuế không được hoàn lại + Chi phí khác<\/div>\n<div class=\"formula\">Đơn giá nhập kho = Tổng giá thực tế nhập kho ÷ Số lượng thực nhập<\/div>\n<p><b>Hàng nhập khẩu<\/b> (thứ tự tính thuế <span class=\"tag ext\">Bổ sung<\/span> – theo quy định thuế):<\/p>\n<div class=\"formula\">Giá nhập khẩu (VND) = Giá CIF (ngoại tệ) × Tỷ giá<br>Thuế nhập khẩu = Giá nhập khẩu × Thuế suất NK<br>Thuế TTĐB = (Giá nhập khẩu + Thuế NK) × Thuế suất TTĐB<br>Thuế GTGT hàng NK = (Giá nhập khẩu + Thuế NK + Thuế TTĐB) × Thuế suất GTGT<\/div>\n<div class=\"formula\">Giá gốc nhập khẩu (GTGT khấu trừ) = Giá nhập khẩu + Thuế NK + Thuế TTĐB + Chi phí khác (đã bóc thuế GTGT)<br>Nếu GTGT trực tiếp: cộng thêm Thuế GTGT hàng NK<\/div>\n<p>Bóc thuế chi phí: Chi phí chưa thuế = Chi phí đã gồm thuế ÷ (1 + thuế suất). Nếu không có TTĐB thì bỏ dòng TTĐB.<\/p>\n<p>VD: CIF 6 × 23 = 138/kg; NK 20% = 27,6 → đơn giá nhập kho = <b>165,6<\/b> (GTGT khấu trừ, không tính).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Khoản<\/th><th>GTGT khấu trừ<\/th><th>GTGT trực tiếp<\/th><\/tr><\/thead><tbody>\n<tr><td>Thuế GTGT đầu vào (hàng mua trong nước)<\/td><td>Không vào giá gốc<\/td><td>Vào giá gốc<\/td><\/tr>\n<tr><td>Thuế GTGT hàng nhập khẩu<\/td><td>Không vào giá gốc<\/td><td>Vào giá gốc<\/td><\/tr>\n<tr><td>Thuế nhập khẩu, thuế TTĐB<\/td><td>Vào giá gốc<\/td><td>Vào giá gốc<\/td><\/tr>\n<tr><td>Chiết khấu TM, giảm giá, hàng trả lại<\/td><td>Trừ khỏi giá mua<\/td><td>Trừ khỏi giá mua<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 36 và bài tập; (bổ sung: công thức thuế NK/TTĐB/GTGT hàng nhập khẩu, hao hụt định mức)"},{"id":"ch4-t07","title":"Giá thực tế xuất kho: các phương pháp tính","core":"<ul>\n<li><b>Bình quân gia quyền:<\/b> (a) <b>cuối kỳ<\/b> (một lần): tính một đơn giá cho cả kỳ dự trữ; (b) <b>sau mỗi lần nhập<\/b> (liên hoàn): tính lại đơn giá sau mỗi lần nhập.<\/li>\n<li><b>Nhập trước – xuất trước (FIFO):<\/b> hàng <b>nhập kho trước xuất trước<\/b>; xuất hết lô cũ mới sang lô sau, với đơn giá từng lô; tồn cuối kỳ là các lô <b>nhập gần nhất<\/b>.<\/li>\n<li><b>Thực tế đích danh:<\/b> hàng nhập giá nào xuất đúng giá đó; hợp với hàng <b>giá trị cao, quý hiếm, nhận diện được từng lô/chiếc<\/b>.<\/li>\n<li><b>Nhập sau – xuất trước (LIFO)<\/b> <span class=\"tag ext\">Bổ sung<\/span>: xuất lô <b>nhập sau cùng<\/b> trước; tồn cuối kỳ là lô <b>cũ nhất<\/b>.<\/li>\n<li>Slide còn nêu <b>chi phí chuẩn<\/b> (theo mức sử dụng bình thường) và <b>giá bán lẻ<\/b> (ngành bán lẻ).<\/li>\n<li>Tính theo <b>từng loại<\/b> hàng; chọn phương pháp phải <b>nhất quán<\/b>, đổi phải thuyết minh.<\/li>\n<\/ul>","formulas":"<div class=\"formula\">Đơn giá bình quân cả kỳ = (SL tồn đầu × Đơn giá tồn đầu + Σ SL nhập × Đơn giá nhập) ÷ (SL tồn đầu + SL nhập trong kỳ)<\/div>\n<div class=\"formula\">Đơn giá bình quân sau mỗi lần nhập = (Giá trị tồn trước nhập + Giá trị nhập) ÷ (SL tồn trước nhập + SL nhập)<\/div>\n<div class=\"formula\">Giá thực tế xuất kho (bình quân) = SL xuất × Đơn giá bình quân<\/div>\n<div class=\"formula\">Giá thực tế xuất kho (FIFO) = Σ (SL xuất từng lô × Đơn giá lô tương ứng)<\/div>\n<div class=\"formula\">Tồn cuối kỳ = Tồn đầu kỳ + Nhập trong kỳ − Xuất trong kỳ (cả số lượng và giá trị)<\/div>\n<p>VD: tồn 600×20; nhập 1.200×18 và 600×21 → bình quân cả kỳ = (12.000 + 21.600 + 12.600) ÷ 2.400 = <b>19,25<\/b>. Lưu ý đơn giá nhập là đơn giá <b>sau khi cộng chi phí mua phân bổ<\/b>, đã loại thuế GTGT khấu trừ.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>FIFO<\/th><th>LIFO (bổ sung)<\/th><th>Bình quân cuối kỳ<\/th><th>Bình quân sau mỗi lần nhập<\/th><th>Đích danh<\/th><\/tr><\/thead><tbody>\n<tr><td>Giả định<\/td><td>Nhập trước xuất trước<\/td><td>Nhập sau xuất trước<\/td><td>Một đơn giá cả kỳ<\/td><td>Đơn giá cập nhật sau mỗi nhập<\/td><td>Đúng giá từng lô<\/td><\/tr>\n<tr><td>Thời điểm tính giá xuất<\/td><td>Khi xuất<\/td><td>Khi xuất<\/td><td><b>Cuối kỳ<\/b><\/td><td>Khi xuất<\/td><td>Khi xuất<\/td><\/tr>\n<tr><td>Tồn cuối kỳ gồm<\/td><td>Lô mới nhất<\/td><td>Lô cũ nhất<\/td><td>Đơn giá bình quân<\/td><td>Đơn giá bình quân hiện hành<\/td><td>Lô còn lại thực tế<\/td><\/tr>\n<tr><td>Phù hợp<\/td><td>Giá ít biến động/dễ áp dụng<\/td><td>—<\/td><td>Giá ít biến động<\/td><td>Cần số liệu tồn kịp thời<\/td><td>Hàng quý hiếm, giá trị cao<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Xu hướng giá<\/th><th>FIFO<\/th><th>LIFO <span class=\"tag ext\">Bổ sung<\/span><\/th><th>Bình quân<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Giá tăng<\/b><\/td><td>Giá vốn thấp, lợi nhuận <b>cao<\/b>, tồn kho cao<\/td><td>Giá vốn cao, lợi nhuận thấp, tồn kho thấp<\/td><td>Ở giữa<\/td><\/tr>\n<tr><td><b>Giá giảm<\/b><\/td><td>Giá vốn <b>cao<\/b>, lợi nhuận <b>thấp<\/b>, thuế TNDN thấp, tồn kho thấp<\/td><td>Giá vốn thấp, lợi nhuận cao, tồn kho cao<\/td><td>Ở giữa<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 37–39; (bổ sung: LIFO, bình quân sau mỗi lần nhập, tác động xu hướng giá)"},{"id":"ch4-t08","title":"Dự phòng giảm giá hàng tồn kho","core":"<ul>\n<li>Cuối kỳ kế toán <b>năm<\/b>, khi <b>giá trị thuần có thể thực hiện được &lt; giá gốc<\/b> thì phải <b>lập dự phòng giảm giá hàng tồn kho<\/b>.<\/li>\n<li>Biểu hiện của nguyên tắc <b>thận trọng<\/b> (không đánh giá cao hơn giá trị có thể thực hiện); BCTC trình bày hàng tồn kho theo giá <b>thấp hơn<\/b> giữa giá gốc và NRV.<\/li>\n<li>Sổ cái ghi hàng tồn kho theo <b>giá gốc<\/b>, khoản dự phòng ghi riêng (TK 2294). <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":"<div class=\"formula\">Mức dự phòng = SL tồn kho × (Giá gốc − Giá trị thuần có thể thực hiện)   (chỉ lập khi giá gốc &gt; NRV)<\/div>\n<p><span class=\"tag ext\">Bổ sung<\/span> Mức cần lập kỳ này so với số dự phòng đã lập: lập thêm (chênh lệch tăng) hoặc hoàn nhập (chênh lệch giảm).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Trường hợp<\/th><th>Hàng tồn kho trình bày theo<\/th><\/tr><\/thead><tbody>\n<tr><td>NRV ≥ Giá gốc<\/td><td>Giá gốc (không lập dự phòng)<\/td><\/tr>\n<tr><td>NRV &lt; Giá gốc<\/td><td>NRV (= giá gốc − dự phòng)<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 13, 40; (bổ sung: công thức mức dự phòng, TK 2294)"},{"id":"ch4-t09","title":"Giá trị chứng khoán kinh doanh","core":"<ul>\n<li><b>Chứng khoán kinh doanh<\/b> ghi nhận ban đầu theo <b>giá trị hợp lý<\/b> (giá mua).<\/li>\n<li><b>Chi phí phát sinh khi mua<\/b> (môi giới, giao dịch...) ghi vào <b>chi phí tài chính (TK 635)<\/b>, không tính vào giá trị chứng khoán.<\/li>\n<li>Khi thanh lý, nhượng bán: tính giá vốn <b>theo từng loại chứng khoán<\/b> bằng <b>FIFO<\/b> hoặc <b>bình quân gia quyền<\/b>.<\/li>\n<li>Khi lập BCTC: có bằng chứng <b>giảm giá<\/b> thì lập <b>dự phòng giảm giá chứng khoán<\/b> → phản ánh giá trị thuần.<\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Khoản<\/th><th>Hàng tồn kho (mua ngoài)<\/th><th>Chứng khoán kinh doanh<\/th><\/tr><\/thead><tbody>\n<tr><td>Ghi nhận ban đầu<\/td><td>Giá gốc<\/td><td>Giá trị hợp lý (giá mua)<\/td><\/tr>\n<tr><td>Chi phí liên quan khi mua<\/td><td>Vào giá gốc<\/td><td>Vào chi phí tài chính (TK 635)<\/td><\/tr>\n<tr><td>Tính giá xuất/bán<\/td><td>FIFO, bình quân, đích danh<\/td><td>FIFO, bình quân gia quyền<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 4, slide 41–42"}],"flashcards":[{"id":"ch4-f01","topic":"ch4-t01","front":"Hai đặc điểm chất lượng chi phối xác định giá trị?","back":"<b>Đáng tin cậy<\/b> (khách quan, thận trọng) và <b>có thể so sánh<\/b> (nhất quán; đổi phương pháp phải thuyết minh BCTC)."},{"id":"ch4-f02","topic":"ch4-t01","front":"Khi thay đổi phương pháp tính giá phải làm gì?","back":"Giải trình trong <b>Thuyết minh BCTC<\/b> (đảm bảo so sánh được, nhất quán)."},{"id":"ch4-f03","topic":"ch4-t02","front":"Giá gốc là gì? Có đổi không?","back":"Giá trị ghi nhận <b>ban đầu<\/b>: chi phí mua, vận chuyển, lắp ráp... đến khi sẵn sàng sử dụng. <b>Không thay đổi<\/b> trừ khi chuẩn mực cụ thể quy định khác (VAS 01)."},{"id":"ch4-f04","topic":"ch4-t02","front":"Giá trị hợp lý là gì? Dùng khi nào?","back":"Giá trao đổi giữa các bên hiểu biết, ngang giá. Sau ghi nhận ban đầu, tài sản/nợ biến động thường xuyên và xác định tin cậy → ghi theo giá trị hợp lý <b>cuối kỳ lập BCTC<\/b>."},{"id":"ch4-f05","topic":"ch4-t02","front":"Công thức giá trị thuần có thể thực hiện (NRV)?","back":"<b>Giá bán ước tính − chi phí ước tính để hoàn thành − chi phí ước tính để tiêu thụ<\/b>. Cơ sở lập dự phòng giảm giá HTK."},{"id":"ch4-f06","topic":"ch4-t02","front":"Giá thị trường: bên mua nhìn là gì, bên bán nhìn là gì?","back":"Bên mua: <b>giá thay thế<\/b>. Bên bán: <b>giá bán<\/b>."},{"id":"ch4-f07","topic":"ch4-t02","front":"Giá hạch toán: đặc điểm và xử lý cuối kỳ?","back":"DN tự xây dựng, ổn định, ghi sổ tạm trong kỳ. Cuối kỳ <b>điều chỉnh về giá gốc<\/b> bằng hệ số giá = (TT tồn đầu + TT nhập) ÷ (HT tồn đầu + HT nhập)."},{"id":"ch4-f08","topic":"ch4-t02","front":"Ưu và nhược điểm của giá gốc?","back":"Ưu: khách quan, có chứng từ, đáng tin cậy. Nhược: không phản ánh giá thị trường hiện tại."},{"id":"ch4-f09","topic":"ch4-t03","front":"3 tiêu chuẩn ghi nhận TSCĐ (TT 45/2013)?","back":"Chắc chắn thu lợi ích kinh tế; thời gian sử dụng <b>&gt; 1 năm<\/b>; nguyên giá xác định tin cậy và <b>≥ 30.000.000 đồng<\/b>."},{"id":"ch4-f10","topic":"ch4-t03","front":"Nguyên giá TSCĐ hữu hình mua sắm?","back":"<b>Giá mua + thuế không được hoàn lại + chi phí trước sử dụng<\/b> (vận chuyển, lắp đặt, chạy thử). GTGT khấu trừ không tính vào."},{"id":"ch4-f11","topic":"ch4-t03","front":"Nguyên giá TSCĐ nhận góp vốn / được cấp / XDCB?","back":"Góp vốn: giá HĐ giao nhận + chi phí. Được cấp: <b>giá trị còn lại<\/b> trên sổ đơn vị cấp (hoặc đánh giá) + chi phí. XDCB: giá quyết toán + lệ phí trước bạ + chi phí."},{"id":"ch4-f12","topic":"ch4-t03","front":"Giá trị còn lại của TSCĐ?","back":"<b>Nguyên giá − hao mòn lũy kế<\/b> (khấu hao lũy kế)."},{"id":"ch4-f13","topic":"ch4-t03","front":"Mua TSCĐ giá 550tr (gồm GTGT 10%), chi phí 13,2tr (gồm GTGT 10%), khấu trừ. Nguyên giá?","back":"550/1,1 + 13,2/1,1 = 500 + 12 = <b>512 triệu<\/b>."},{"id":"ch4-f14","topic":"ch4-t03","front":"DN tính GTGT trực tiếp: thuế GTGT đầu vào TSCĐ xử lý thế nào?","back":"<b>Tính vào nguyên giá<\/b> (không được khấu trừ)."},{"id":"ch4-f15","topic":"ch4-t04","front":"Khấu hao TSCĐ là gì?","back":"Tính toán và <b>phân bổ có hệ thống nguyên giá<\/b> vào chi phí SXKD trong thời gian trích khấu hao."},{"id":"ch4-f16","topic":"ch4-t04","front":"Công thức khấu hao đường thẳng?","back":"Mức KH năm = <b>Nguyên giá ÷ số năm sử dụng<\/b>; tháng = năm ÷ 12. Mức KH không đổi."},{"id":"ch4-f17","topic":"ch4-t04","front":"Công thức khấu hao số dư giảm dần có điều chỉnh?","back":"Mức KH năm = <b>GTCL đầu năm × (tỷ lệ đường thẳng × hệ số điều chỉnh)<\/b>. Hệ số: ≤4 năm 1,5; &gt;4–6 năm 2; &gt;6 năm 2,5. Các năm cuối chuyển sang mức bình quân (GTCL ÷ số năm còn lại)."},{"id":"ch4-f18","topic":"ch4-t04","front":"Thiết bị 900tr, 5 năm: KH năm 1 theo đường thẳng và số dư giảm dần?","back":"Đường thẳng: <b>180<\/b>. Số dư giảm dần: 900 × 40% = <b>360<\/b>."},{"id":"ch4-f19","topic":"ch4-t04","front":"Công thức khấu hao theo số lượng sản phẩm?","back":"Mức KH tháng = SL SP tháng × (Nguyên giá ÷ sản lượng theo công suất thiết kế)."},{"id":"ch4-f20","topic":"ch4-t04","front":"Khấu hao TSCĐ của phân xưởng / bán hàng / quản lý ghi Nợ TK nào?","back":"Phân xưởng: <b>627<\/b>; bán hàng: <b>641<\/b>; quản lý DN: <b>642<\/b>. Đều Có TK 214."},{"id":"ch4-f21","topic":"ch4-t05","front":"Hàng tồn kho gồm những loại tài sản nào?","back":"(a) Giữ để bán; (b) sản xuất dở dang; (c) NVL, CCDC dùng cho SXKD. Gồm cả hàng đang đi đường, gửi bán, gửi gia công."},{"id":"ch4-f22","topic":"ch4-t05","front":"Phân biệt kê khai thường xuyên và kiểm kê định kỳ?","back":"KKTX: theo dõi liên tục nhập–xuất–tồn, tính giá xuất khi xuất. KKĐK: căn cứ kiểm kê cuối kỳ xác định tồn, <b>suy ra xuất<\/b>; tính giá xuất cuối kỳ."},{"id":"ch4-f23","topic":"ch4-t05","front":"Giá trị xuất trong kỳ theo kiểm kê định kỳ?","back":"<b>Tồn đầu + Nhập trong kỳ − Tồn cuối kỳ (kiểm kê)<\/b>."},{"id":"ch4-f24","topic":"ch4-t06","front":"Giá thực tế nhập kho hàng mua ngoài?","back":"<b>Giá mua − chiết khấu TM, giảm giá, hàng trả lại + thuế không được hoàn lại + chi phí khác<\/b>."},{"id":"ch4-f25","topic":"ch4-t06","front":"Thuế nào tính vào giá gốc hàng nhập khẩu (GTGT khấu trừ)?","back":"Thuế <b>nhập khẩu<\/b> và <b>TTĐB<\/b> (không hoàn lại). Thuế GTGT hàng NK được khấu trừ nên <b>không<\/b> tính."},{"id":"ch4-f26","topic":"ch4-t06","front":"Công thức tính thuế NK, TTĐB, GTGT hàng nhập khẩu?","back":"NK = giá NK × t%; TTĐB = (giá NK + thuế NK) × t%; GTGT = (giá NK + NK + TTĐB) × t%."},{"id":"ch4-f27","topic":"ch4-t06","front":"Mua hàng, chi phí vận chuyển 8,8tr đã gồm GTGT 10%, khấu trừ: tính vào giá bao nhiêu?","back":"8,8 ÷ 1,1 = <b>8 triệu<\/b>."},{"id":"ch4-f28","topic":"ch4-t06","front":"DN tính GTGT trực tiếp: giá gốc hàng nhập khẩu?","back":"Giá NK + thuế NK (+ TTĐB) <b>+ thuế GTGT hàng NK<\/b> + chi phí khác."},{"id":"ch4-f29","topic":"ch4-t06","front":"Hao hụt trong định mức khi mua hàng xử lý thế nào?","back":"Vẫn tính vào giá gốc: tổng giá giữ nguyên, <b>đơn giá nhập = tổng giá ÷ SL thực nhập<\/b>. Phần vượt định mức xử lý riêng, không vào giá."},{"id":"ch4-f30","topic":"ch4-t07","front":"Công thức đơn giá bình quân gia quyền cuối kỳ?","back":"(<b>Giá trị tồn đầu + giá trị nhập trong kỳ<\/b>) ÷ (<b>SL tồn đầu + SL nhập<\/b>). Giá xuất = SL xuất × đơn giá bình quân."},{"id":"ch4-f31","topic":"ch4-t07","front":"Bình quân cuối kỳ khác bình quân sau mỗi lần nhập ở đâu?","back":"Cuối kỳ: một đơn giá cho cả kỳ, tính giá xuất <b>cuối kỳ<\/b>. Sau mỗi lần nhập: tính lại đơn giá sau mỗi lần nhập, tính xuất ngay."},{"id":"ch4-f32","topic":"ch4-t07","front":"FIFO: giả định và tồn cuối kỳ?","back":"Nhập trước xuất trước, xuất theo đơn giá từng lô. Tồn cuối kỳ là <b>lô nhập gần nhất<\/b>."},{"id":"ch4-f33","topic":"ch4-t07","front":"Khi nào dùng phương pháp thực tế đích danh?","back":"Hàng <b>quý hiếm, giá trị cao<\/b>, nhận diện được từng lô/chiếc."},{"id":"ch4-f34","topic":"ch4-t07","front":"Giá giảm: FIFO cho giá vốn và lợi nhuận thế nào?","back":"Giá vốn <b>cao<\/b>, lợi nhuận <b>thấp<\/b>, thuế TNDN thấp, tồn kho giá trị thấp."},{"id":"ch4-f35","topic":"ch4-t07","front":"LIFO: tồn cuối kỳ gồm lô nào?","back":"Lô <b>cũ nhất<\/b> (xuất lô nhập sau cùng trước). Không có trong slide."},{"id":"ch4-f36","topic":"ch4-t08","front":"Khi nào lập dự phòng giảm giá HTK và theo nguyên tắc nào?","back":"Cuối kỳ năm, khi <b>NRV &lt; giá gốc<\/b>; theo nguyên tắc <b>thận trọng<\/b>."},{"id":"ch4-f37","topic":"ch4-t08","front":"Công thức mức dự phòng giảm giá HTK?","back":"<b>SL tồn × (giá gốc − NRV)<\/b>, chỉ lập khi giá gốc &gt; NRV."},{"id":"ch4-f38","topic":"ch4-t09","front":"Chứng khoán kinh doanh: ghi nhận ban đầu và chi phí mua?","back":"Ghi theo <b>giá trị hợp lý<\/b>; chi phí mua vào <b>chi phí tài chính (TK 635)<\/b>."},{"id":"ch4-f39","topic":"ch4-t09","front":"Giá vốn chứng khoán kinh doanh khi bán tính theo phương pháp nào?","back":"<b>FIFO<\/b> hoặc <b>bình quân gia quyền<\/b>, tính theo từng loại chứng khoán."}],"notes":"<ul>\n<li><b>Khác biệt/chưa chắc, nên hỏi giảng viên:<\/b>\n<ul>\n<li>Slide không nêu <b>LIFO<\/b>, <b>giá hạch toán<\/b>, <b>giá thay thế<\/b> nhưng ngân hàng bài tập có hỏi; đã đưa vào với nhãn Bổ sung. TT200 hiện chỉ liệt kê đích danh, bình quân gia quyền, FIFO.<\/li>\n<li>Câu LMS 11.2 (giá giảm, phương pháp cho tồn kho cao nhất) có lời giải thích mâu thuẫn; trong các phương pháp của slide thì bình quân cuối kỳ cao hơn FIFO; LIFO (nếu xét) cho tồn kho cao nhất.<\/li>\n<li>Chi phí <b>lưu kho/thuê kho<\/b> (bài 2, bài 3, bài 4) có tính vào giá gốc không: theo VAS 02 chi phí bảo quản <b>trong quá trình mua<\/b> tính vào giá, chi phí lưu kho sau khi mua thì không; cần xác nhận cách giảng viên xử lý.<\/li>\n<li>Hệ số điều chỉnh khấu hao số dư giảm dần (1,5/2/2,5) lấy từ TT 45/2013, slide chỉ nêu chung \"hệ số điều chỉnh\".<\/li>\n<li>Thuế GTGT trực tiếp: đã hạch toán thuế đầu vào vào giá gốc theo đáp án câu LMS 11.4 và ngân hàng bài tập.<\/li>\n<li>Xử lý hao hụt vượt định mức (bài 3 trường hợp 2) tham khảo quy định chung, chưa có trong slide.<\/li>\n<\/ul><\/li><\/ul>","fx":{"items":[{"id":"ch4-f-01","name":"Nguyên giá TSCĐ hữu hình mua sắm","topic":"ch4","formula":"<div class=\"formula\">Nguyên giá = Giá mua + Thuế không được hoàn lại + Chi phí trước khi sử dụng<\/div>","parts":"<ul><li><b>Giá mua<\/b>: giá mua chưa có thuế GTGT được khấu trừ (đồng)<\/li><li><b>Thuế không được hoàn lại<\/b>: vd thuế nhập khẩu, trước bạ<\/li><li><b>Chi phí trước sử dụng<\/b>: vận chuyển, lắp đặt, chạy thử… (chưa có GTGT khấu trừ)<\/li><li>Trừ chiết khấu, giảm giá nếu có<\/li><\/ul>","example":"<p>VD: Ô tô: giá mua 550/1,1 = 500; chi phí 13,2/1,1 = 12; nguyên giá = 500 + 12 = 512 (triệu đồng, GTGT 10% khấu trừ).<\/p>","source":"Slide Chương 4, slide 18"},{"id":"ch4-f-02","name":"Nguyên giá TSCĐ hữu hình nhận góp vốn","topic":"ch4","formula":"<div class=\"formula\">Nguyên giá = Giá trị theo đánh giá của Hội đồng giao nhận + Chi phí liên quan trực tiếp khác<\/div>","parts":"<ul><li><b>Giá trị đánh giá<\/b>: giá do Hội đồng giao nhận xác định<\/li><li><b>Chi phí liên quan<\/b>: vận chuyển, lắp đặt, lệ phí… (đồng)<\/li><\/ul>","example":"<p>VD: 400 + 5 = 405 (triệu đồng).<\/p>","source":"Slide Chương 4, slide 19"},{"id":"ch4-f-03","name":"Nguyên giá TSCĐ hữu hình được cấp","topic":"ch4","formula":"<div class=\"formula\">Nguyên giá = Giá trị còn lại trên sổ ở đơn vị cấp (hoặc giá trị Hội đồng giao nhận đánh giá) + Chi phí liên quan trực tiếp khác<\/div>","parts":"<ul><li><b>GTCL ở đơn vị cấp<\/b> hoặc <b>giá đánh giá<\/b> của Hội đồng giao nhận<\/li><li><b>Chi phí liên quan<\/b>: chi phí trực tiếp khác (đồng)<\/li><\/ul>","example":"<p>VD: 220 + 2 = 222 (triệu đồng).<\/p>","source":"Slide Chương 4, slide 20"},{"id":"ch4-f-04","name":"Nguyên giá TSCĐ hữu hình do đầu tư xây dựng cơ bản","topic":"ch4","formula":"<div class=\"formula\">Nguyên giá = Giá quyết toán công trình + Lệ phí trước bạ + Chi phí liên quan trực tiếp khác<\/div>","parts":"<ul><li><b>Giá quyết toán<\/b>: giá trị công trình được quyết toán<\/li><li><b>Lệ phí trước bạ<\/b> và các chi phí trực tiếp khác (đồng)<\/li><\/ul>","example":"<p>VD: 2.000 + 20 + 30 = 2.050 (triệu đồng).<\/p>","source":"Slide Chương 4, slide 21"},{"id":"ch4-f-05","name":"Giá trị còn lại của TSCĐ","topic":"ch4","formula":"<div class=\"formula\">Giá trị còn lại = Nguyên giá − Hao mòn lũy kế (khấu hao lũy kế)<\/div>","parts":"<ul><li><b>Nguyên giá<\/b>: giá gốc TSCĐ (đồng)<\/li><li><b>Hao mòn lũy kế<\/b>: tổng khấu hao đã trích đến thời điểm báo cáo<\/li><\/ul>","example":"<p>VD: 900 − 360 − 216 = 324 (triệu đồng) sau 2 năm theo số dư giảm dần.<\/p>","source":"Slide Chương 4, slide 23"},{"id":"ch4-f-06","name":"Khấu hao đường thẳng","topic":"ch4","formula":"<div class=\"formula\">Mức khấu hao năm = Nguyên giá / Thời gian sử dụng (năm)<\/div><div class=\"formula\">Mức khấu hao tháng = Mức khấu hao năm / 12<\/div>","parts":"<ul><li><b>Nguyên giá<\/b>: đồng<\/li><li><b>Thời gian sử dụng<\/b>: số năm trích khấu hao<\/li><li>Mức khấu hao các năm bằng nhau<\/li><\/ul>","example":"<p>VD: 900 / 5 = 180 triệu đồng/năm = 15 triệu đồng/tháng.<\/p>","source":"Slide Chương 4, slide 27, 30–31"},{"id":"ch4-f-07","name":"Khấu hao theo số dư giảm dần có điều chỉnh","topic":"ch4","formula":"<div class=\"formula\">Tỷ lệ khấu hao nhanh = (1 / Số năm sử dụng) × Hệ số điều chỉnh<\/div><div class=\"formula\">Mức khấu hao năm = Giá trị còn lại đầu năm × Tỷ lệ khấu hao nhanh<\/div><div class=\"formula\">Mức khấu hao tháng = Mức khấu hao năm / 12<\/div>","parts":"<ul><li><b>Hệ số điều chỉnh<\/b> (Thông tư 45): 1,5 nếu thời gian sử dụng ≤ 4 năm; 2 nếu trên 4 đến 6 năm; 2,5 nếu trên 6 năm <span class=\"tag ext\">Bổ sung<\/span><\/li><li><b>Giá trị còn lại đầu năm<\/b>: nguyên giá trừ khấu hao lũy kế<\/li><li>Những năm cuối: khi mức khấu hao nhanh nhỏ hơn mức chia đều (GTCL / số năm còn lại) thì lấy GTCL chia cho số năm còn lại <span class=\"tag ext\">Bổ sung<\/span><\/li><\/ul>","example":"<p>VD: NG 900, 5 năm, hệ số 2: tỷ lệ 40%; khấu hao năm 1 = 360, năm 2 = 540 × 40% = 216, năm 3 = 324 × 40% = 129,6; năm 4 và 5 = 194,4 / 2 = 97,2 mỗi năm (triệu đồng).<\/p>","source":"Slide Chương 4, slide 28–30, 32; hệ số và quy tắc năm cuối bổ sung theo Thông tư 45/2013"},{"id":"ch4-f-08","name":"Khấu hao theo số lượng sản phẩm","topic":"ch4","formula":"<div class=\"formula\">Mức khấu hao bình quân 1 đơn vị sản phẩm = Nguyên giá / Sản lượng theo công suất thiết kế<\/div><div class=\"formula\">Mức khấu hao tháng = Số lượng sản phẩm tháng × Mức khấu hao bình quân 1 đơn vị<\/div>","parts":"<ul><li><b>Nguyên giá<\/b>: đồng<\/li><li><b>Sản lượng theo công suất thiết kế<\/b>: tổng sản lượng ước tính trong đời sử dụng<\/li><li><b>Số lượng sản phẩm tháng<\/b>: sản lượng thực tế trong tháng<\/li><\/ul>","example":"<p>VD: 600.000.000 / 300.000 = 2.000 đ/sản phẩm; tháng làm 5.000 sản phẩm thì khấu hao = 5.000 × 2.000 = 10.000.000 đồng.<\/p>","source":"Slide Chương 4, slide 26; công thức bổ sung theo Thông tư 45/2013 <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-09","name":"Giá thực tế nhập kho hàng mua ngoài","topic":"ch4","formula":"<div class=\"formula\">Giá nhập kho = Giá mua − Chiết khấu thương mại, giảm giá, hàng mua trả lại + Thuế không được hoàn lại + Chi phí khác<\/div>","parts":"<ul><li><b>Giá mua<\/b>: chưa có GTGT được khấu trừ<\/li><li><b>Thuế không được hoàn lại<\/b>: thuế nhập khẩu, TTĐB, GTGT không khấu trừ<\/li><li><b>Chi phí khác<\/b>: vận chuyển, bốc dỡ, bảo quản trong quá trình mua (chưa GTGT khấu trừ)<\/li><\/ul>","example":"<p>VD: Giá mua 200 − chiết khấu 10 + chi phí 6 = 196 (triệu đồng).<\/p>","source":"Slide Chương 4, slide 36"},{"id":"ch4-f-10","name":"Thuế nhập khẩu","topic":"ch4","formula":"<div class=\"formula\">Giá tính thuế nhập khẩu = Giá CIF (ngoại tệ) × Tỷ giá<\/div><div class=\"formula\">Thuế nhập khẩu = Giá tính thuế × Thuế suất thuế nhập khẩu<\/div>","parts":"<ul><li><b>Giá CIF<\/b>: giá nhập khẩu gồm giá hàng, bảo hiểm, cước vận chuyển đến cửa khẩu<\/li><li><b>Tỷ giá<\/b>: đồng/ngoại tệ tại thời điểm tính<\/li><li><b>Thuế suất<\/b>: theo biểu thuế<\/li><\/ul>","example":"<p>VD: 6 × 18.000 USD × 24.150 = 2.608.200.000; thuế NK 10% = 260.820.000 (đồng).<\/p>","source":"Bổ sung: bài tập Chương 4 (nhập khẩu) <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-11","name":"Thuế tiêu thụ đặc biệt hàng nhập khẩu","topic":"ch4","formula":"<div class=\"formula\">Thuế TTĐB = (Giá tính thuế NK + Thuế NK) × Thuế suất TTĐB<\/div>","parts":"<ul><li><b>Giá tính thuế NK + thuế NK<\/b>: giá tính thuế TTĐB<\/li><li><b>Thuế suất TTĐB<\/b>: theo mặt hàng<\/li><\/ul>","example":"<p>VD: (2.608.200.000 + 260.820.000) × 25% = 717.255.000 (đồng).<\/p>","source":"Bổ sung: bài tập Chương 4 <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-12","name":"Thuế GTGT hàng nhập khẩu","topic":"ch4","formula":"<div class=\"formula\">Thuế GTGT hàng NK = (Giá tính thuế NK + Thuế NK + Thuế TTĐB) × Thuế suất GTGT<\/div>","parts":"<ul><li><b>Cơ sở tính<\/b>: giá nhập khẩu cộng các khoản thuế NK, TTĐB<\/li><li><b>Thuế suất GTGT<\/b>: thường 10%<\/li><li>Phương pháp khấu trừ: thuế này được khấu trừ, không tính vào giá gốc<\/li><\/ul>","example":"<p>VD: (2.608.200.000 + 260.820.000 + 717.255.000) × 10% = 358.627.500 (đồng).<\/p>","source":"Bổ sung: bài tập Chương 4 <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-13","name":"Giá gốc hàng nhập khẩu (GTGT khấu trừ)","topic":"ch4","formula":"<div class=\"formula\">Giá gốc = Giá tính thuế NK + Thuế NK + Thuế TTĐB + Chi phí khác<\/div>","parts":"<ul><li>Thuế NK và TTĐB không được hoàn lại nên vào giá gốc<\/li><li>Thuế GTGT hàng nhập khẩu không tính vào giá gốc (khấu trừ)<\/li><li><b>Chi phí khác<\/b>: vận chuyển, bốc dỡ… chưa GTGT khấu trừ<\/li><\/ul>","example":"<p>VD: 2.608.200.000 + 260.820.000 + 717.255.000 = 3.586.275.000 đồng (chưa gồm chi phí khác).<\/p>","source":"Slide Chương 4, slide 36 và bài tập Chương 4"},{"id":"ch4-f-14","name":"Đơn giá và giá xuất kho bình quân cả kỳ dự trữ","topic":"ch4","formula":"<div class=\"formula\">Đơn giá bq = (SL tồn đầu × Đơn giá tồn đầu + Σ SL nhập × Đơn giá nhập) / (SL tồn đầu + SL nhập)<\/div><div class=\"formula\">Giá xuất kho = SL xuất × Đơn giá bq<\/div>","parts":"<ul><li>Tử số là tổng giá trị tồn đầu và nhập trong kỳ (đồng)<\/li><li>Mẫu số là tổng số lượng tồn đầu và nhập<\/li><li>Tính một lần vào cuối kỳ<\/li><\/ul>","example":"<p>VD: Tồn 100 × 10; nhập 200 × 12 và 100 × 14: đơn giá = 4.800 / 400 = 12; xuất 250 = 3.000; tồn cuối 150 = 1.800 (nghìn đồng).<\/p>","source":"Slide Chương 4, slide 37–38"},{"id":"ch4-f-15","name":"Đơn giá bình quân sau mỗi lần nhập (liên hoàn)","topic":"ch4","formula":"<div class=\"formula\">Đơn giá bq sau lần nhập = (Giá trị tồn trước nhập + Giá trị nhập) / (SL tồn trước nhập + SL nhập)<\/div><div class=\"formula\">Giá xuất kho = SL xuất × Đơn giá bq mới nhất<\/div>","parts":"<ul><li>Cập nhật đơn giá sau mỗi lần nhập<\/li><li>Xuất ngay sau lần nhập nào thì dùng đơn giá đó<\/li><\/ul>","example":"<p>VD: Tồn 100 × 10, nhập 200 × 12: đơn giá = 3.400 / 300 ≈ 11,33; xuất 150 = 1.700, còn 1.700. Nhập 100 × 14: (1.700 + 1.400) / 250 = 12,4; xuất 100 = 1.240 (nghìn đồng).<\/p>","source":"Slide Chương 4, slide 37; công thức chi tiết bổ sung <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-16","name":"Giá xuất kho nhập trước xuất trước (FIFO)","topic":"ch4","formula":"<div class=\"formula\">Giá xuất kho = Σ (SL xuất từ từng lô × Đơn giá lô đó), lấy lô nhập sớm nhất trước<\/div>","parts":"<ul><li>Xuất hết lô cũ rồi mới sang lô mới<\/li><li>Tồn cuối là các lô nhập gần nhất<\/li><\/ul>","example":"<p>VD: Xuất 250: 100 × 10 + 150 × 12 = 2.800; tồn cuối = 4.800 − 2.800 = 2.000 (nghìn đồng).<\/p>","source":"Slide Chương 4, slide 39"},{"id":"ch4-f-17","name":"Giá xuất kho nhập sau xuất trước (LIFO)","topic":"ch4","formula":"<div class=\"formula\">Giá xuất kho = Σ (SL xuất từ từng lô × Đơn giá lô đó), lấy lô nhập muộn nhất trước<\/div>","parts":"<ul><li>Ngược với FIFO<\/li><li>Phương pháp này không có trong slide; theo Thông tư 200 hiện hành không còn được phép dùng<\/li><\/ul>","example":"<p>VD: Xuất 250: 100 × 14 + 150 × 12 = 3.200; tồn cuối = 1.600 (nghìn đồng).<\/p>","source":"Bổ sung ngoài slide <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch4-f-18","name":"Giá xuất kho thực tế đích danh","topic":"ch4","formula":"<div class=\"formula\">Giá xuất kho = Σ (SL xuất của từng lô xác định × Đơn giá thực tế của lô đó)<\/div>","parts":"<ul><li>Nhận diện được từng lô hàng<\/li><li>Hàng nhập giá nào, xuất đúng giá đó<\/li><\/ul>","example":"<p>VD: Xuất 100 của lô tồn đầu (10) và 150 của lô 12: 1.000 + 1.800 = 2.800 (nghìn đồng).<\/p>","source":"Slide Chương 4, slide 37"},{"id":"ch4-f-19","name":"Giá trị tồn cuối kỳ và giá trị xuất theo kiểm kê định kỳ","topic":"ch4","formula":"<div class=\"formula\">Giá trị xuất kho = Tồn đầu kỳ + Nhập trong kỳ − Tồn cuối kỳ<\/div><div class=\"formula\">Giá trị tồn cuối kỳ = SL tồn kiểm kê × Đơn giá<\/div>","parts":"<ul><li><b>Tồn đầu, nhập<\/b>: giá trị (đồng)<\/li><li><b>Tồn cuối kỳ<\/b>: theo kết quả kiểm kê thực tế<\/li><li>Kê khai thường xuyên: tồn cuối = tồn đầu + nhập − xuất<\/li><\/ul>","example":"<p>VD: 1.000 + 3.800 − 1.800 = 3.000 (nghìn đồng).<\/p>","source":"Slide Chương 4, slide 35, 38–39"},{"id":"ch4-f-20","name":"Giá trị thuần có thể thực hiện được","topic":"ch4","formula":"<div class=\"formula\">GTTCTHĐ = Giá bán ước tính − Chi phí ước tính để hoàn thành − Chi phí ước tính để tiêu thụ<\/div>","parts":"<ul><li><b>Giá bán ước tính<\/b>: trong kỳ sản xuất, kinh doanh bình thường<\/li><li>Cơ sở để so sánh với giá gốc khi lập dự phòng<\/li><\/ul>","example":"<p>VD: 105.000 − 8.000 = 97.000 đồng/đơn vị.<\/p>","source":"Slide Chương 4, slide 13"},{"id":"ch4-f-21","name":"Dự phòng giảm giá hàng tồn kho","topic":"ch4","formula":"<div class=\"formula\">Dự phòng cần lập = SL tồn × (Giá gốc − GTTCTHĐ), nếu GTTCTHĐ < Giá gốc<\/div><div class=\"formula\">Số trích bổ sung = Dự phòng cần lập − Dự phòng đã có<\/div>","parts":"<ul><li><b>Giá gốc<\/b>: giá trị ghi sổ mỗi đơn vị (đồng)<\/li><li><b>GTTCTHĐ<\/b>: giá trị thuần có thể thực hiện được<\/li><li>Chỉ lập khi GTTCTHĐ nhỏ hơn giá gốc, vào cuối kỳ kế toán năm<\/li><li>Số trích bổ sung âm là hoàn nhập dự phòng <span class=\"tag ext\">Bổ sung<\/span><\/li><\/ul>","example":"<p>VD: 500 đơn vị × (100.000 − 97.000) = 1.500.000; đã có 1.000.000 thì trích thêm 500.000 đồng.<\/p>","source":"Slide Chương 4, slide 13, 40; công thức tính bổ sung <span class=\"tag ext\">Bổ sung<\/span>"}],"note":null}},"ch5":{"chapter":"ch5","title":"Chương 5 – Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","topics":[{"id":"ch5-t01","title":"Tổng quan: DN sản xuất và dòng nghiệp vụ chủ yếu","core":"<p>Chương gồm 5.1 <b>DN sản xuất (DNSX)<\/b> và 5.2 <b>DN thương mại (DNTM)<\/b> (DNTM tương tự DNSX, khác ở <b>chi phí thu mua<\/b> khi mua hàng).<\/p>\n<ul><li><b>Đầu vào<\/b>: TSCĐ; NVL – CCDC; tiền lương và các khoản trích theo lương.<\/li>\n<li><b>Quá trình sản xuất<\/b>: tập hợp CPSX (621, 622, 627) &rarr; <b>TK 154<\/b> &rarr; giá thành &rarr; nhập kho <b>TK 155<\/b>.<\/li>\n<li><b>Tiêu thụ<\/b>: doanh thu 511 &ndash; giá vốn 632 &ndash; CP bán hàng 641 &ndash; CP QLDN 642 &rarr; xác định kết quả <b>TK 911<\/b> &rarr; 421.<\/li><\/ul>\n<p>Mọi bút toán trong chương xét thuế GTGT <b>phương pháp khấu trừ<\/b> (trừ khi đề nói khác); hàng tồn kho theo <b>kê khai thường xuyên<\/b> (dùng TK 154).<\/p>\n<p><b>Quy tắc chung<\/b>: tài sản/chi phí tăng ghi <b>Nợ<\/b>; nguồn vốn/doanh thu tăng ghi <b>Có<\/b>. Thuế GTGT đầu vào &rarr; Nợ 133; thuế GTGT đầu ra &rarr; Có 3331.<\/p>","formulas":null,"compare":null,"source":"Slide Chương 5, slide 1–5, 74"},{"id":"ch5-t02","title":"Kế toán TSCĐ: tăng, khấu hao, sửa chữa","core":"<p><b>TSCĐ hữu hình<\/b>: tham gia <b>nhiều chu kỳ<\/b> SXKD; <b>hình thái vật chất không đổi<\/b>; giá trị <b>chuyển dần<\/b> vào chi phí (khấu hao). Tài khoản: <b>211<\/b> (hữu hình), <b>213<\/b> (vô hình), <b>214<\/b> – Hao mòn TSCĐ (TK điều chỉnh giảm, số dư Có = hao mòn lũy kế).<\/p>\n<p><b>Chứng từ<\/b>: biên bản giao

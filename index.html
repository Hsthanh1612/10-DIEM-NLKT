:"lms-ch5-q022-B","text":"TK 622"},{"id":"lms-ch5-q022-C","text":"TK 627"},{"id":"lms-ch5-q022-D","text":"TK 642"}],"correctOptionId":"lms-ch5-q022-C","explanation":"TK 627 - Chi phí sản xuất chung (tập hợp theo phân xưởng, bộ phận sản xuất).","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 56–58","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u023","context":null,"questions":[{"id":"lms-ch5-q023","num":"Câu 23","type":"mcq","text":"Cuối kỳ, chi phí trên TK 621, 622, 627 được kết chuyển vào:","options":[{"id":"lms-ch5-q023-A","text":"TK 154"},{"id":"lms-ch5-q023-B","text":"TK 155"},{"id":"lms-ch5-q023-C","text":"TK 511"},{"id":"lms-ch5-q023-D","text":"TK 911"}],"correctOptionId":"lms-ch5-q023-A","explanation":"Cuối kỳ kết chuyển 621, 622, 627 sang TK 154 - Chi phí SXKD dở dang để tính giá thành. TK 155 chỉ nhận khi nhập kho thành phẩm; 511 và 911 không liên quan trực tiếp.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 50–60","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u024","context":null,"questions":[{"id":"lms-ch5-q024","num":"Câu 24","type":"mcq","text":"Tiền điện sử dụng cho hoạt động sản xuất tại phân xưởng thuộc:","options":[{"id":"lms-ch5-q024-A","text":"Chi phí NVL trực tiếp"},{"id":"lms-ch5-q024-B","text":"Chi phí nhân công trực tiếp"},{"id":"lms-ch5-q024-C","text":"Chi phí sản xuất chung"},{"id":"lms-ch5-q024-D","text":"Chi phí quản lý doanh nghiệp"}],"correctOptionId":"lms-ch5-q024-C","explanation":"Chi phí dịch vụ mua ngoài (điện) phục vụ sản xuất tại phân xưởng là chi phí sản xuất chung (TK 627).","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 56–58","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u025","context":null,"questions":[{"id":"lms-ch5-q025","num":"Câu 25","type":"mcq","text":"Khấu hao máy móc thiết bị dùng tại phân xưởng thuộc:","options":[{"id":"lms-ch5-q025-A","text":"Chi phí sản xuất chung"},{"id":"lms-ch5-q025-B","text":"Chi phí bán hàng"},{"id":"lms-ch5-q025-C","text":"Chi phí quản lý doanh nghiệp"},{"id":"lms-ch5-q025-D","text":"Giá vốn hàng bán"}],"correctOptionId":"lms-ch5-q025-A","explanation":"Khấu hao TSCĐ ở phân xưởng là chi phí sản xuất chung (Nợ TK 627, Có TK 214); sau đó mới theo giá thành thành phẩm vào giá vốn khi bán.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), slide 14, 57–58","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u026","context":null,"questions":[{"id":"lms-ch5-q026","num":"Câu 26","type":"mcq","text":"Xuất kho nguyên liệu trực tiếp cho sản xuất, bút toán là:","options":[{"id":"lms-ch5-q026-A","text":"Nợ 621 / Có 152"},{"id":"lms-ch5-q026-B","text":"Nợ 152 / Có 621"},{"id":"lms-ch5-q026-C","text":"Nợ 627 / Có 153"},{"id":"lms-ch5-q026-D","text":"Nợ 154 / Có 155"}],"correctOptionId":"lms-ch5-q026-A","explanation":"Nợ TK 621, Có TK 152. B ghi ngược (đó là bút toán NVL dùng không hết nhập lại kho); C là CCDC; D không phải nghiệp vụ xuất NVL.","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 29–30, 52","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u027","context":null,"questions":[{"id":"lms-ch5-q027","num":"Câu 28","type":"mcq","text":"Công thức tính tổng giá thành sản phẩm hoàn thành trong kỳ là:","options":[{"id":"lms-ch5-q027-A","text":"CPSX dở dang đầu kỳ + CPSX phát sinh - CPSX dở dang cuối kỳ - phế liệu thu hồi"},{"id":"lms-ch5-q027-B","text":"CPSX phát sinh + CPBH + CPQLDN"},{"id":"lms-ch5-q027-C","text":"Doanh thu thuần - giá vốn hàng bán"},{"id":"lms-ch5-q027-D","text":"CPSX dở dang cuối kỳ + CPSX phát sinh - CPSX dở dang đầu kỳ"}],"correctOptionId":"lms-ch5-q027-A","explanation":"Tổng giá thành = giá trị SPDD đầu kỳ + CPSX phát sinh trong kỳ - giá trị SPDD cuối kỳ - phế liệu thu hồi (nếu có). B gồm cả chi phí ngoài sản xuất; C là lợi nhuận gộp; D đảo vị trí dở dang đầu/cuối kỳ.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 62","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u028","context":null,"questions":[{"id":"lms-ch5-q028","num":"Câu 29","type":"mcq","text":"CPSX dở dang đầu kỳ 100, CPSX phát sinh trong kỳ 900, CPSX dở dang cuối kỳ 150, phế liệu thu hồi 10 (triệu đồng). Tổng giá thành sản phẩm hoàn thành là:","options":[{"id":"lms-ch5-q028-A","text":"830"},{"id":"lms-ch5-q028-B","text":"840"},{"id":"lms-ch5-q028-C","text":"850"},{"id":"lms-ch5-q028-D","text":"860"}],"correctOptionId":"lms-ch5-q028-B","explanation":"Z = 100 + 900 - 150 - 10 = 840 triệu đồng.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 62","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u029","context":null,"questions":[{"id":"lms-ch5-q029","num":"Câu 30","type":"mcq","text":"Nếu tổng giá thành là 840 triệu đồng và hoàn thành 800 sản phẩm, giá thành đơn vị là:","options":[{"id":"lms-ch5-q029-A","text":"0,95 triệu đồng"},{"id":"lms-ch5-q029-B","text":"1,00 triệu đồng"},{"id":"lms-ch5-q029-C","text":"1,05 triệu đồng"},{"id":"lms-ch5-q029-D","text":"1,20 triệu đồng"}],"correctOptionId":"lms-ch5-q029-C","explanation":"Giá thành đơn vị = 840 / 800 = 1,05 triệu đồng/sản phẩm.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 62–63","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u030","context":null,"questions":[{"id":"lms-ch5-q030","num":"Câu 31","type":"mcq","text":"Khi sản phẩm hoàn thành nhập kho, kế toán ghi:","options":[{"id":"lms-ch5-q030-A","text":"Nợ 154 / Có 155"},{"id":"lms-ch5-q030-B","text":"Nợ 155 / Có 154"},{"id":"lms-ch5-q030-C","text":"Nợ 632 / Có 155"},{"id":"lms-ch5-q030-D","text":"Nợ 155 / Có 632"}],"correctOptionId":"lms-ch5-q030-B","explanation":"Nhập kho thành phẩm theo giá thành thực tế: Nợ TK 155, Có TK 154. A ghi ngược; C là xuất bán; D là hàng bán bị trả lại nhập kho.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 60–61, 64","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u031","context":null,"questions":[{"id":"lms-ch5-q031","num":"Câu 32","type":"mcq","text":"Số dư cuối kỳ của TK 154 phản ánh:","options":[{"id":"lms-ch5-q031-A","text":"Doanh thu chưa thực hiện"},{"id":"lms-ch5-q031-B","text":"Giá trị sản phẩm dở dang cuối kỳ"},{"id":"lms-ch5-q031-C","text":"Giá vốn hàng bán"},{"id":"lms-ch5-q031-D","text":"Chi phí bán hàng"}],"correctOptionId":"lms-ch5-q031-B","explanation":"TK 154 có số dư Nợ cuối kỳ là giá trị sản phẩm dở dang cuối kỳ.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 60","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u032","context":null,"questions":[{"id":"lms-ch5-q032","num":"Câu 33","type":"mcq","text":"Khoản nào sau đây không thuộc giá thành sản xuất sản phẩm?","options":[{"id":"lms-ch5-q032-A","text":"Chi phí NVL trực tiếp"},{"id":"lms-ch5-q032-B","text":"Chi phí nhân công trực tiếp"},{"id":"lms-ch5-q032-C","text":"Chi phí sản xuất chung"},{"id":"lms-ch5-q032-D","text":"Chi phí bán hàng"}],"correctOptionId":"lms-ch5-q032-D","explanation":"Giá thành sản xuất gồm 3 khoản mục: chi phí NVL trực tiếp, nhân công trực tiếp, sản xuất chung. Chi phí bán hàng là chi phí thời kỳ, kết chuyển sang TK 911.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 63; slide 70–71","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u033","context":null,"questions":[{"id":"lms-ch5-q033","num":"Câu 34","type":"mcq","text":"Nếu không có sản phẩm dở dang cuối kỳ và không có phế liệu thu hồi, tổng giá thành sản phẩm hoàn thành bằng:","options":[{"id":"lms-ch5-q033-A","text":"CPSX dở dang đầu kỳ + CPSX phát sinh trong kỳ"},{"id":"lms-ch5-q033-B","text":"Chỉ CPSX phát sinh trong kỳ"},{"id":"lms-ch5-q033-C","text":"CPSX phát sinh - CPSX dở dang đầu kỳ"},{"id":"lms-ch5-q033-D","text":"Doanh thu - chi phí"}],"correctOptionId":"lms-ch5-q033-A","explanation":"Z = SPDD đầu kỳ + CPSX phát sinh - 0 - 0 = SPDD đầu kỳ + CPSX phát sinh. B chỉ đúng khi cả SPDD đầu kỳ bằng 0.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 62","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u034","context":null,"questions":[{"id":"lms-ch5-q034","num":"Câu 35","type":"mcq","text":"Trường hợp nào sau đây có thể ghi nhận doanh thu bán hàng?","options":[{"id":"lms-ch5-q034-A","text":"Khách hàng ứng trước tiền nhưng chưa nhận hàng"},{"id":"lms-ch5-q034-B","text":"Khách hàng đã nhận hàng và chấp nhận thanh toán"},{"id":"lms-ch5-q034-C","text":"Doanh nghiệp mới lập kế hoạch bán hàng"},{"id":"lms-ch5-q034-D","text":"Doanh nghiệp chuyển hàng nội bộ giữa hai kho"}],"correctOptionId":"lms-ch5-q034-B","explanation":"Doanh thu ghi nhận khi quyền kiểm soát/rủi ro, lợi ích gắn với hàng hóa đã chuyển giao cho người mua (đã nhận hàng, chấp nhận thanh toán). A mới là khoản nhận ứng trước; C, D không phát sinh giao dịch bán.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 66–67; TT200 (chuẩn mực VAS 14)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u035","context":null,"questions":[{"id":"lms-ch5-q035","num":"Câu 36","type":"mcq","text":"Bán sản phẩm cho khách hàng, giá chưa thuế GTGT 100 triệu đồng, thuế GTGT 10%, chưa thu tiền. Bút toán doanh thu là:","options":[{"id":"lms-ch5-q035-A","text":"Nợ 131: 110 / Có 511: 100, Có 3331: 10"},{"id":"lms-ch5-q035-B","text":"Nợ 111: 110 / Có 511: 110"},{"id":"lms-ch5-q035-C","text":"Nợ 511: 100, Nợ 3331: 10 / Có 131: 110"},{"id":"lms-ch5-q035-D","text":"Nợ 632: 100 / Có 155: 100"}],"correctOptionId":"lms-ch5-q035-A","explanation":"Chưa thu tiền ghi Nợ TK 131 theo giá thanh toán 110; doanh thu 100 ghi Có TK 511; thuế GTGT đầu ra 10 ghi Có TK 3331. B ghi thu tiền mặt và tính cả thuế vào doanh thu; C ghi ngược; D là bút toán giá vốn.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 66–67","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u036","context":null,"questions":[{"id":"lms-ch5-q036","num":"Câu 37","type":"mcq","text":"Khi xuất kho sản phẩm bán trực tiếp, bút toán ghi nhận giá vốn là:","options":[{"id":"lms-ch5-q036-A","text":"Nợ 511 / Có 155"},{"id":"lms-ch5-q036-B","text":"Nợ 632 / Có 155"},{"id":"lms-ch5-q036-C","text":"Nợ 155 / Có 632"},{"id":"lms-ch5-q036-D","text":"Nợ 911 / Có 155"}],"correctOptionId":"lms-ch5-q036-B","explanation":"Nợ TK 632 - Giá vốn hàng bán, Có TK 155 - Thành phẩm (slide 69). A, D sai tài khoản Nợ; C ghi ngược.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 68–69","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u037","context":null,"questions":[{"id":"lms-ch5-q037","num":"Câu 38","type":"mcq","text":"Chi phí vận chuyển hàng bán do doanh nghiệp chịu phát sinh tại bộ phận bán hàng được ghi vào:","options":[{"id":"lms-ch5-q037-A","text":"TK 621"},{"id":"lms-ch5-q037-B","text":"TK 627"},{"id":"lms-ch5-q037-C","text":"TK 641"},{"id":"lms-ch5-q037-D","text":"TK 642"}],"correctOptionId":"lms-ch5-q037-C","explanation":"Chi phí vận chuyển hàng bán là chi phí bán hàng - TK 641.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 70–71","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u038","context":null,"questions":[{"id":"lms-ch5-q038","num":"Câu 39","type":"mcq","text":"Tiền lương nhân viên văn phòng quản lý doanh nghiệp được ghi vào:","options":[{"id":"lms-ch5-q038-A","text":"TK 622"},{"id":"lms-ch5-q038-B","text":"TK 627"},{"id":"lms-ch5-q038-C","text":"TK 641"},{"id":"lms-ch5-q038-D","text":"TK 642"}],"correctOptionId":"lms-ch5-q038-D","explanation":"Lương nhân viên quản lý doanh nghiệp là chi phí quản lý doanh nghiệp - TK 642.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 70–71; slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u039","context":null,"questions":[{"id":"lms-ch5-q039","num":"Câu 40","type":"mcq","text":"Khi phát sinh khoản giảm giá hàng bán/chiết khấu thương mại/hàng bán bị trả lại, tài khoản dùng để phản ánh khoản giảm trừ doanh thu là:","options":[{"id":"lms-ch5-q039-A","text":"TK 521"},{"id":"lms-ch5-q039-B","text":"TK 511"},{"id":"lms-ch5-q039-C","text":"TK 632"},{"id":"lms-ch5-q039-D","text":"TK 911"}],"correctOptionId":"lms-ch5-q039-A","explanation":"Các khoản giảm trừ doanh thu (chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại) phản ánh trên TK 521, cuối kỳ kết chuyển trừ vào TK 511 (slide 66). Lưu ý: theo TT133 các khoản này được ghi thẳng Nợ TK 511.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 66; TT200 (TK 521)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u040","context":null,"questions":[{"id":"lms-ch5-q040","num":"Câu 41","type":"mcq","text":"Cuối kỳ, sau khi xác định doanh thu thuần, bút toán kết chuyển doanh thu thuần là:","options":[{"id":"lms-ch5-q040-A","text":"Nợ 911 / Có 511"},{"id":"lms-ch5-q040-B","text":"Nợ 511 / Có 911"},{"id":"lms-ch5-q040-C","text":"Nợ 521 / Có 511"},{"id":"lms-ch5-q040-D","text":"Nợ 632 / Có 911"}],"correctOptionId":"lms-ch5-q040-B","explanation":"Kết chuyển doanh thu thuần: Nợ TK 511, Có TK 911 (TK 911 ghi Có doanh thu thuần). A ghi ngược; C là kết chuyển giảm trừ doanh thu sai chiều (đúng là Nợ 511 / Có 521); D sai tài khoản.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 72–73","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u041","context":null,"questions":[{"id":"lms-ch5-q041","num":"Câu 42","type":"mcq","text":"Cuối kỳ, bút toán kết chuyển giá vốn hàng bán, chi phí bán hàng và chi phí quản lý doanh nghiệp là:","options":[{"id":"lms-ch5-q041-A","text":"Nợ 911 / Có 632, 641, 642"},{"id":"lms-ch5-q041-B","text":"Nợ 632, 641, 642 / Có 911"},{"id":"lms-ch5-q041-C","text":"Nợ 511 / Có 632, 641, 642"},{"id":"lms-ch5-q041-D","text":"Nợ 154 / Có 632, 641, 642"}],"correctOptionId":"lms-ch5-q041-A","explanation":"Giá vốn, CPBH, CPQLDN là chi phí của kỳ nên kết chuyển vào bên Nợ TK 911: Nợ 911 / Có 632, 641, 642. B ghi ngược; C, D sai tài khoản.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 72–73","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u042","context":null,"questions":[{"id":"lms-ch5-q042","num":"Câu 43","type":"mcq","text":"Doanh thu thuần 500, giá vốn hàng bán 300, chi phí bán hàng 80, chi phí quản lý doanh nghiệp 60 (triệu đồng). Kết quả tiêu thụ là:","options":[{"id":"lms-ch5-q042-A","text":"40 triệu đồng"},{"id":"lms-ch5-q042-B","text":"60 triệu đồng"},{"id":"lms-ch5-q042-C","text":"120 triệu đồng"},{"id":"lms-ch5-q042-D","text":"200 triệu đồng"}],"correctOptionId":"lms-ch5-q042-B","explanation":"Kết quả = 500 - 300 - 80 - 60 = 60 triệu đồng (lãi). C = 500-300-80 (bỏ CPQLDN) sai; D là lợi nhuận gộp.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 72–73","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u043","context":"<p>Tại Công ty An Bình, trong tháng N có số liệu sau (ĐVT: triệu đồng):<\/p><ul><li>Chi phí sản xuất dở dang đầu kỳ: 120<\/li><li>Chi phí NVL trực tiếp: 500<\/li><li>Chi phí nhân công trực tiếp: 180<\/li><li>Chi phí sản xuất chung: 220<\/li><li>Phế liệu thu hồi nhập kho: 20<\/li><li>Chi phí sản xuất dở dang cuối kỳ: 150<\/li><\/ul><p>Toàn bộ sản phẩm hoàn thành trong kỳ được nhập kho.<\/p>","questions":[{"id":"lms-ch5-q043","num":"Câu 44","type":"mcq","text":"Toàn bộ sản phẩm hoàn thành trong kỳ được nhập kho. Số tiền ghi <b>Nợ TK 155/Có TK 154<\/b> là:","options":[{"id":"lms-ch5-q043-A","text":"830 triệu đồng"},{"id":"lms-ch5-q043-B","text":"850 triệu đồng"},{"id":"lms-ch5-q043-C","text":"870 triệu đồng"},{"id":"lms-ch5-q043-D","text":"900 triệu đồng"}],"correctOptionId":"lms-ch5-q043-B","explanation":"Chi phí phát sinh = 500 + 180 + 220 = 900. Z = 120 + 900 - 150 - 20 = 850 triệu đồng. Bút toán nhập kho: Nợ TK 155 / Có TK 154: 850 (phế liệu thu hồi nhập kho Nợ 152 / Có 154: 20 được trừ khỏi giá thành). Kiểm tra TK 154: Nợ 120 + 900 = 1.020; Có 20 + 850 = 870; dư Nợ 150 = SPDD cuối kỳ.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 60–62","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u044","context":"<p>Tại Công ty Minh Phát, cuối kỳ có số liệu (ĐVT: triệu đồng):<\/p><ul><li>Doanh thu thuần: 1.200<\/li><li>Giá vốn hàng bán: 700<\/li><li>Chi phí bán hàng: 120<\/li><li>Chi phí quản lý doanh nghiệp: 180<\/li><\/ul>","questions":[{"id":"lms-ch5-q044","num":"Câu 45","type":"mcq","text":"Sau khi kết chuyển doanh thu và các chi phí để xác định kết quả tiêu thụ, kế toán ghi nhận kết quả như thế nào?","options":[{"id":"lms-ch5-q044-A","text":"Nợ TK 421/Có TK 911: 200"},{"id":"lms-ch5-q044-B","text":"Nợ TK 911/Có TK 421: 300"},{"id":"lms-ch5-q044-C","text":"Nợ TK 911/Có TK 421: 200"},{"id":"lms-ch5-q044-D","text":"Nợ TK 911/Có TK 421: 380"}],"correctOptionId":"lms-ch5-q044-C","explanation":"Kết quả = 1.200 - 700 - 120 - 180 = 200 triệu đồng (lãi). Kết chuyển lãi: Nợ TK 911 / Có TK 421: 200. A ghi ngược chiều (đó là bút toán kết chuyển lỗ); B (300) và D (380) sai số tiền. Lưu ý: TK 421 (lợi nhuận sau thuế chưa phân phối) không có trong slide; bỏ qua thuế TNDN vì đề không cho.","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911), slide 72–73; TT200 (TK 421 - lợi nhuận sau thuế chưa phân phối, không có trong slide)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u045","context":"<p>Công ty An Phúc kê khai thuế GTGT theo phương pháp khấu trừ. Trong tháng N, công ty mua một máy móc sử dụng tại phân xưởng sản xuất, tổng giá thanh toán 770 triệu đồng, trong đó thuế GTGT 70 triệu đồng, chưa thanh toán cho người bán.<\/p><p>Chi phí vận chuyển, lắp đặt và chạy thử máy đã thanh toán bằng chuyển khoản 22 triệu đồng, trong đó thuế GTGT 2 triệu đồng.<\/p><p>Máy có thời gian sử dụng 6 năm, khấu hao theo phương pháp đường thẳng.<\/p>","questions":[{"id":"lms-ch5-q045","num":"Bài 1 - Yêu cầu 1","type":"essay","text":"Xác định nguyên giá TSCĐ.","answer":"<p>Thuế GTGT đầu vào được khấu trừ nên không tính vào nguyên giá.<\/p><p>Nguyên giá = (770 - 70) + (22 - 2) = 700 + 20 = <b>720 triệu đồng<\/b>.<\/p>","explanation":"","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), ví dụ 1 (slide 9–10), slide 12–14","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q046","num":"Bài 1 - Yêu cầu 2","type":"essay","text":"Định khoản nghiệp vụ mua và chi phí liên quan.","answer":"<p>Mua máy (chưa trả tiền người bán):<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 700<\/div><div>Nợ TK 133 &nbsp; 70<\/div><div class=\"cr\">Có TK 331 &nbsp; 770<\/div><\/div><p>Chi phí vận chuyển, lắp đặt, chạy thử (chuyển khoản) - tính vào nguyên giá:<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 20<\/div><div>Nợ TK 133 &nbsp; 2<\/div><div class=\"cr\">Có TK 112 &nbsp; 22<\/div><\/div><p>Tổng TK 211 = 720 (khớp yêu cầu 1); TK 133 = 72.<\/p>","explanation":"","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), ví dụ 1 (slide 9–10), slide 12–14","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q047","num":"Bài 1 - Yêu cầu 3","type":"essay","text":"Tính mức khấu hao bình quân tháng và định khoản khấu hao tháng đầu tiên.","answer":"<p>Khấu hao đường thẳng: mức KH năm = 720 / 6 = 120; mức KH bình quân tháng = 720 / (6 x 12) = <b>10 triệu đồng<\/b>.<\/p><p>Máy dùng ở phân xưởng nên tính vào chi phí sản xuất chung (giả định trích đủ tháng đầu tiên vì đề không cho ngày đưa vào sử dụng):<\/p><div class=\"je\"><div>Nợ TK 627 &nbsp; 10<\/div><div class=\"cr\">Có TK 214 &nbsp; 10<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), ví dụ 1 (slide 9–10), slide 12–14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u046","context":"<p>Công ty Đông Việt kê khai thuế GTGT theo phương pháp khấu trừ. Mua nguyên liệu chính nhập kho, tổng giá thanh toán 330 triệu đồng, trong đó thuế GTGT 30 triệu đồng, chưa thanh toán người bán.<\/p><p>Chi phí vận chuyển lô nguyên liệu thanh toán bằng chuyển khoản 5,5 triệu đồng, trong đó thuế GTGT 0,5 triệu đồng.<\/p><p>Xuất kho nguyên liệu chính dùng trực tiếp sản xuất sản phẩm 180 triệu đồng; xuất nhiên liệu dùng chung tại phân xưởng 20 triệu đồng.<\/p><p>Xuất kho một CCDC trị giá 12 triệu đồng dùng tại phân xưởng, thuộc loại phân bổ một lần.<\/p>","questions":[{"id":"lms-ch5-q048","num":"Bài 2 - Yêu cầu 1","type":"essay","text":"Xác định giá thực tế nguyên liệu nhập kho.","answer":"<p>Giá thực tế = (330 - 30) + (5,5 - 0,5) = 300 + 5 = <b>305 triệu đồng<\/b> (thuế GTGT được khấu trừ nên không tính vào giá gốc).<\/p>","explanation":"","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), ví dụ slide 28–32","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q049","num":"Bài 2 - Yêu cầu 2","type":"essay","text":"Định khoản các nghiệp vụ kinh tế phát sinh.","answer":"<p>1) Mua nguyên liệu chính nhập kho:<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 300<\/div><div>Nợ TK 133 &nbsp; 30<\/div><div class=\"cr\">Có TK 331 &nbsp; 330<\/div><\/div><p>2) Chi phí vận chuyển bằng chuyển khoản:<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 5<\/div><div>Nợ TK 133 &nbsp; 0,5<\/div><div class=\"cr\">Có TK 112 &nbsp; 5,5<\/div><\/div><p>3) Xuất nguyên liệu chính trực tiếp sản xuất 180 và nhiên liệu dùng chung ở phân xưởng 20:<\/p><div class=\"je\"><div>Nợ TK 621 &nbsp; 180<\/div><div>Nợ TK 627 &nbsp; 20<\/div><div class=\"cr\">Có TK 152 &nbsp; 200<\/div><\/div><p>4) Xuất CCDC phân bổ một lần cho phân xưởng:<\/p><div class=\"je\"><div>Nợ TK 627 &nbsp; 12<\/div><div class=\"cr\">Có TK 153 &nbsp; 12<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), ví dụ slide 28–32","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u047","context":"<p>Công ty Việt An có tiền lương phải trả trong tháng (triệu đồng): công nhân trực tiếp sản xuất 240; nhân viên quản lý phân xưởng 30; nhân viên bán hàng 60; nhân viên quản lý doanh nghiệp 120.<\/p><p>Giả định phần doanh nghiệp chịu các khoản trích theo lương là 23,5% trên tiền lương làm căn cứ trích. Phần người lao động chịu là 10,5%.<\/p><p>Sau khi khấu trừ phần người lao động phải đóng, doanh nghiệp chuyển khoản thanh toán toàn bộ tiền lương còn lại.<\/p>","questions":[{"id":"lms-ch5-q050","num":"Bài 3 - Yêu cầu 1","type":"essay","text":"Định khoản tiền lương phải trả.","answer":"<p>Tổng tiền lương = 240 + 30 + 60 + 120 = 450 triệu đồng.<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 240<\/div><div>Nợ TK 627 &nbsp; 30<\/div><div>Nợ TK 641 &nbsp; 60<\/div><div>Nợ TK 642 &nbsp; 120<\/div><div class=\"cr\">Có TK 334 &nbsp; 450<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), ví dụ slide 45–47","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q051","num":"Bài 3 - Yêu cầu 2","type":"essay","text":"Tính và định khoản phần doanh nghiệp chịu.","answer":"<p>Phần DN chịu = 23,5% x lương: 622 = 240 x 23,5% = 56,4; 627 = 30 x 23,5% = 7,05; 641 = 60 x 23,5% = 14,1; 642 = 120 x 23,5% = 28,2. Tổng = 105,75 (= 450 x 23,5%).<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 56,4<\/div><div>Nợ TK 627 &nbsp; 7,05<\/div><div>Nợ TK 641 &nbsp; 14,1<\/div><div>Nợ TK 642 &nbsp; 28,2<\/div><div class=\"cr\">Có TK 338 &nbsp; 105,75<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), ví dụ slide 45–47","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q052","num":"Bài 3 - Yêu cầu 3","type":"essay","text":"Tính và định khoản phần khấu trừ vào lương người lao động.","answer":"<p>Phần NLĐ chịu = 450 x 10,5% = 47,25 triệu đồng.<\/p><div class=\"je\"><div>Nợ TK 334 &nbsp; 47,25<\/div><div class=\"cr\">Có TK 338 &nbsp; 47,25<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), ví dụ slide 45–47","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q053","num":"Bài 3 - Yêu cầu 4","type":"essay","text":"Định khoản thanh toán lương.","answer":"<p>Lương thực trả = 450 - 47,25 = 402,75 triệu đồng (chuyển khoản).<\/p><div class=\"je\"><div>Nợ TK 334 &nbsp; 402,75<\/div><div class=\"cr\">Có TK 112 &nbsp; 402,75<\/div><\/div><p>Kiểm tra: TK 334 có 450 - 47,25 - 402,75 = 0. TK 338 có 105,75 + 47,25 = 153.<\/p>","explanation":"","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), ví dụ slide 45–47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u048","context":"<p>Tại Công ty Minh Sơn, CPSX dở dang đầu kỳ là 80 triệu đồng. Trong kỳ phát sinh: chi phí NVL trực tiếp 400 triệu đồng; chi phí nhân công trực tiếp 160 triệu đồng; chi phí sản xuất chung 120 triệu đồng.<\/p><p>Cuối kỳ, CPSX dở dang là 60 triệu đồng; phế liệu thu hồi nhập kho 10 triệu đồng. Trong kỳ hoàn thành và nhập kho 500 sản phẩm.<\/p>","questions":[{"id":"lms-ch5-q054","num":"Bài 4 - Yêu cầu 1","type":"essay","text":"Kết chuyển các khoản chi phí vào TK 154.","answer":"<p>Tổng CPSX phát sinh = 400 + 160 + 120 = 680 triệu đồng.<\/p><div class=\"je\"><div>Nợ TK 154 &nbsp; 680<\/div><div class=\"cr\">Có TK 621 &nbsp; 400<\/div><div class=\"cr\">Có TK 622 &nbsp; 160<\/div><div class=\"cr\">Có TK 627 &nbsp; 120<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 50–64","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q055","num":"Bài 4 - Yêu cầu 2","type":"essay","text":"Tính tổng giá thành sản phẩm hoàn thành và giá thành đơn vị.","answer":"<p>Tổng giá thành = 80 + 680 - 60 - 10 = <b>690 triệu đồng<\/b>.<\/p><p>Giá thành đơn vị = 690 / 500 = <b>1,38 triệu đồng/sản phẩm<\/b>.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 50–64","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q056","num":"Bài 4 - Yêu cầu 3","type":"essay","text":"Định khoản các nghiệp vụ kinh tế phát sinh.","answer":"<p>1) Kết chuyển chi phí:<\/p><div class=\"je\"><div>Nợ TK 154 &nbsp; 680<\/div><div class=\"cr\">Có TK 621 &nbsp; 400<\/div><div class=\"cr\">Có TK 622 &nbsp; 160<\/div><div class=\"cr\">Có TK 627 &nbsp; 120<\/div><\/div><p>2) Phế liệu thu hồi nhập kho:<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 10<\/div><div class=\"cr\">Có TK 154 &nbsp; 10<\/div><\/div><p>3) Nhập kho sản phẩm hoàn thành theo giá thành thực tế:<\/p><div class=\"je\"><div>Nợ TK 155 &nbsp; 690<\/div><div class=\"cr\">Có TK 154 &nbsp; 690<\/div><\/div><p>Kiểm tra TK 154: Nợ 80 + 680 = 760; Có 10 + 690 = 700; dư Nợ 60 = SPDD cuối kỳ.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 50–64","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u049","context":"<p>Công ty Hưng Thịnh sản xuất một loại sản phẩm. Trong tháng phát sinh: xuất NVL trực tiếp 300 triệu đồng; xuất vật liệu phụ dùng chung tại phân xưởng 15 triệu đồng; tiền lương công nhân trực tiếp 200 triệu đồng; tiền lương nhân viên phân xưởng 40 triệu đồng.<\/p><p>Giả định các khoản trích theo lương do doanh nghiệp chịu bằng 23,5% tiền lương làm căn cứ trích. Khấu hao TSCĐ tại phân xưởng 30 triệu đồng. Dịch vụ mua ngoài phục vụ phân xưởng có giá chưa thuế 20 triệu đồng, thuế GTGT 10%, chưa thanh toán.<\/p><p>CPSX dở dang đầu kỳ 70 triệu đồng, cuối kỳ 50 triệu đồng. Hoàn thành 400 sản phẩm.<\/p>","questions":[{"id":"lms-ch5-q057","num":"Bài 5 - Yêu cầu 1","type":"essay","text":"Định khoản các nghiệp vụ kinh tế phát sinh.","answer":"<p>1) Xuất NVL trực tiếp và vật liệu phụ dùng chung:<\/p><div class=\"je\"><div>Nợ TK 621 &nbsp; 300<\/div><div>Nợ TK 627 &nbsp; 15<\/div><div class=\"cr\">Có TK 152 &nbsp; 315<\/div><\/div><p>2) Tiền lương phải trả:<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 200<\/div><div>Nợ TK 627 &nbsp; 40<\/div><div class=\"cr\">Có TK 334 &nbsp; 240<\/div><\/div><p>3) Trích theo lương phần DN chịu 23,5%: 622 = 200 x 23,5% = 47; 627 = 40 x 23,5% = 9,4:<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 47<\/div><div>Nợ TK 627 &nbsp; 9,4<\/div><div class=\"cr\">Có TK 338 &nbsp; 56,4<\/div><\/div><p>4) Khấu hao TSCĐ ở phân xưởng:<\/p><div class=\"je\"><div>Nợ TK 627 &nbsp; 30<\/div><div class=\"cr\">Có TK 214 &nbsp; 30<\/div><\/div><p>5) Dịch vụ mua ngoài (thuế 10% x 20 = 2):<\/p><div class=\"je\"><div>Nợ TK 627 &nbsp; 20<\/div><div>Nợ TK 133 &nbsp; 2<\/div><div class=\"cr\">Có TK 331 &nbsp; 22<\/div><\/div><p>6) Kết chuyển chi phí sang TK 154:<\/p><div class=\"je\"><div>Nợ TK 154 &nbsp; 661,4<\/div><div class=\"cr\">Có TK 621 &nbsp; 300<\/div><div class=\"cr\">Có TK 622 &nbsp; 247<\/div><div class=\"cr\">Có TK 627 &nbsp; 114,4<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q058","num":"Bài 5 - Yêu cầu 2","type":"essay","text":"Xác định chi phí trên TK 621, 622, 627.","answer":"<ul><li>TK 621 = 300<\/li><li>TK 622 = 200 + 47 = <b>247<\/b><\/li><li>TK 627 = 15 + 40 + 9,4 + 30 + 20 = <b>114,4<\/b><\/li><\/ul><p>Tổng CPSX phát sinh = 300 + 247 + 114,4 = 661,4 triệu đồng.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q059","num":"Bài 5 - Yêu cầu 3","type":"essay","text":"Tính tổng giá thành và giá thành đơn vị sản phẩm.","answer":"<p>Tổng giá thành = 70 + 661,4 - 50 = <b>681,4 triệu đồng<\/b> (đề không có phế liệu thu hồi).<\/p><p>Giá thành đơn vị = 681,4 / 400 = <b>1,7035 triệu đồng/sản phẩm<\/b>.<\/p><div class=\"je\"><div>Nợ TK 155 &nbsp; 681,4<\/div><div class=\"cr\">Có TK 154 &nbsp; 681,4<\/div><\/div><p>Kiểm tra TK 154: Nợ 70 + 661,4 = 731,4; Có 681,4; dư Nợ 50.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u050","context":"<p>Công ty Thành Công có CPSX dở dang đầu kỳ 60 triệu đồng. Trong tháng, chi phí được tập hợp: TK 621 = 300; TK 622 = 150; TK 627 = 90 (triệu đồng). CPSX dở dang cuối kỳ 50 triệu đồng. Trong kỳ hoàn thành 400 sản phẩm nhập kho.<\/p><p>Công ty xuất bán 250 sản phẩm, giá bán chưa thuế GTGT 2,4 triệu đồng/sản phẩm, thuế suất GTGT 10%, khách hàng chưa thanh toán. Chi phí bán hàng 40 triệu đồng; chi phí quản lý doanh nghiệp 50 triệu đồng.<\/p>","questions":[{"id":"lms-ch5-q060","num":"Bài 6 - Yêu cầu 1","type":"essay","text":"Tính tổng giá thành và giá thành đơn vị.","answer":"<p>CPSX phát sinh = 300 + 150 + 90 = 540.<\/p><p>Tổng giá thành = 60 + 540 - 50 = <b>550 triệu đồng<\/b>.<\/p><p>Giá thành đơn vị = 550 / 400 = <b>1,375 triệu đồng/sản phẩm<\/b>.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q061","num":"Bài 6 - Yêu cầu 2","type":"essay","text":"Định khoản nhập kho sản phẩm hoàn thành.","answer":"<p>Kết chuyển chi phí (nếu chưa thực hiện):<\/p><div class=\"je\"><div>Nợ TK 154 &nbsp; 540<\/div><div class=\"cr\">Có TK 621 &nbsp; 300<\/div><div class=\"cr\">Có TK 622 &nbsp; 150<\/div><div class=\"cr\">Có TK 627 &nbsp; 90<\/div><\/div><p>Nhập kho thành phẩm:<\/p><div class=\"je\"><div>Nợ TK 155 &nbsp; 550<\/div><div class=\"cr\">Có TK 154 &nbsp; 550<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q062","num":"Bài 6 - Yêu cầu 3","type":"essay","text":"Định khoản doanh thu và giá vốn khi bán 250 sản phẩm.","answer":"<p>Doanh thu = 250 x 2,4 = 600; thuế GTGT = 60; phải thu = 660.<\/p><div class=\"je\"><div>Nợ TK 131 &nbsp; 660<\/div><div class=\"cr\">Có TK 511 &nbsp; 600<\/div><div class=\"cr\">Có TK 3331 &nbsp; 60<\/div><\/div><p>Giá vốn = 250 x 1,375 = 343,75 (giả định sản phẩm xuất bán tính theo giá thành đơn vị của lô vừa hoàn thành, không có thành phẩm tồn đầu kỳ).<\/p><div class=\"je\"><div>Nợ TK 632 &nbsp; 343,75<\/div><div class=\"cr\">Có TK 155 &nbsp; 343,75<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q063","num":"Bài 6 - Yêu cầu 4","type":"essay","text":"Thực hiện kết chuyển và xác định kết quả tiêu thụ.","answer":"<p>Kết chuyển doanh thu thuần (không có giảm trừ):<\/p><div class=\"je\"><div>Nợ TK 511 &nbsp; 600<\/div><div class=\"cr\">Có TK 911 &nbsp; 600<\/div><\/div><p>Kết chuyển giá vốn, CPBH, CPQLDN = 343,75 + 40 + 50 = 433,75:<\/p><div class=\"je\"><div>Nợ TK 911 &nbsp; 433,75<\/div><div class=\"cr\">Có TK 632 &nbsp; 343,75<\/div><div class=\"cr\">Có TK 641 &nbsp; 40<\/div><div class=\"cr\">Có TK 642 &nbsp; 50<\/div><\/div><p>Kết quả tiêu thụ = 600 - 343,75 - 40 - 50 = <b>166,25 triệu đồng (lãi)<\/b>.<\/p><div class=\"je\"><div>Nợ TK 911 &nbsp; 166,25<\/div><div class=\"cr\">Có TK 421 &nbsp; 166,25<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u051","context":"<p>Công ty thương mại Phú Gia kê khai thuế GTGT theo phương pháp khấu trừ, hạch toán hàng tồn kho theo phương pháp kê khai thường xuyên và tính giá xuất kho theo FIFO. ĐVT: 1.000 đồng.<\/p><p>Tồn đầu kỳ: 100 đơn vị hàng hóa X, đơn giá 500.<\/p><p>Mua 100 đơn vị X, đơn giá chưa thuế 550, thuế GTGT 10%, thanh toán bằng chuyển khoản. Chi phí vận chuyển lô hàng có tổng giá thanh toán 5.500, trong đó thuế GTGT 500, trả bằng tiền mặt.<\/p><p>Xuất bán 120 đơn vị X, giá bán chưa thuế 800/đơn vị, thuế GTGT 10%, khách hàng chưa thanh toán.<\/p>","questions":[{"id":"lms-ch5-q064","num":"Bài 7 - Yêu cầu 1","type":"essay","text":"Xác định giá gốc lô hàng mua và đơn giá thực tế của lô hàng.","answer":"<p>Giá mua chưa thuế = 100 x 550 = 55.000; chi phí vận chuyển chưa thuế = 5.500 - 500 = 5.000.<\/p><p>Giá gốc lô hàng = 55.000 + 5.000 = <b>60.000<\/b> (nghìn đồng).<\/p><p>Đơn giá thực tế = 60.000 / 100 = <b>600<\/b> (nghìn đồng/đơn vị).<\/p>","explanation":"","source":"Slide Chương 5, slide 74 (DNTM tương tự DNSX, khác chi phí thu mua), slide 66–69; TT200 (TK 156, 133, 511, 632); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q065","num":"Bài 7 - Yêu cầu 2","type":"essay","text":"Định khoản mua hàng và chi phí vận chuyển.","answer":"<p>Mua hàng (thuế GTGT 10% x 55.000 = 5.500; thanh toán 60.500):<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 55.000<\/div><div>Nợ TK 133 &nbsp; 5.500<\/div><div class=\"cr\">Có TK 112 &nbsp; 60.500<\/div><\/div><p>Chi phí vận chuyển trả tiền mặt:<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 5.000<\/div><div>Nợ TK 133 &nbsp; 500<\/div><div class=\"cr\">Có TK 111 &nbsp; 5.500<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 74 (DNTM tương tự DNSX, khác chi phí thu mua), slide 66–69; TT200 (TK 156, 133, 511, 632); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q066","num":"Bài 7 - Yêu cầu 3","type":"essay","text":"Tính giá vốn 120 đơn vị xuất bán theo FIFO.","answer":"<p>FIFO: xuất hết 100 đơn vị tồn đầu kỳ (đơn giá 500), rồi 20 đơn vị từ lô mua trong kỳ (đơn giá 600).<\/p><p>Giá vốn = 100 x 500 + 20 x 600 = 50.000 + 12.000 = <b>62.000<\/b> (nghìn đồng).<\/p><p>Kiểm tra: tồn cuối kỳ = 80 x 600 = 48.000; (50.000 + 60.000) - 62.000 = 48.000.<\/p>","explanation":"","source":"Slide Chương 5, slide 74 (DNTM tương tự DNSX, khác chi phí thu mua), slide 66–69; TT200 (TK 156, 133, 511, 632); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q067","num":"Bài 7 - Yêu cầu 4","type":"essay","text":"Định khoản các nghiệp vụ kinh tế phát sinh.","answer":"<p>1) Mua hàng:<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 55.000<\/div><div>Nợ TK 133 &nbsp; 5.500<\/div><div class=\"cr\">Có TK 112 &nbsp; 60.500<\/div><\/div><p>2) Chi phí vận chuyển:<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 5.000<\/div><div>Nợ TK 133 &nbsp; 500<\/div><div class=\"cr\">Có TK 111 &nbsp; 5.500<\/div><\/div><p>3) Doanh thu bán hàng (120 x 800 = 96.000; thuế 9.600):<\/p><div class=\"je\"><div>Nợ TK 131 &nbsp; 105.600<\/div><div class=\"cr\">Có TK 511 &nbsp; 96.000<\/div><div class=\"cr\">Có TK 3331 &nbsp; 9.600<\/div><\/div><p>4) Giá vốn hàng bán:<\/p><div class=\"je\"><div>Nợ TK 632 &nbsp; 62.000<\/div><div class=\"cr\">Có TK 156 &nbsp; 62.000<\/div><\/div><p>Lãi gộp = 96.000 - 62.000 = 34.000 (nghìn đồng).<\/p>","explanation":"","source":"Slide Chương 5, slide 74 (DNTM tương tự DNSX, khác chi phí thu mua), slide 66–69; TT200 (TK 156, 133, 511, 632); Chương 4 (FIFO)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u052","context":"<p>Công ty thương mại Bình An trong tháng có doanh thu bán hàng chưa thuế 500 triệu đồng, thuế GTGT đầu ra 50 triệu đồng; giá vốn hàng bán ban đầu 300 triệu đồng.<\/p><p>Trong tháng, khách hàng trả lại một phần hàng: giá bán chưa thuế 50 triệu đồng, thuế GTGT 5 triệu đồng; giá vốn của hàng trả lại 30 triệu đồng. Khoản phải thu khách hàng được giảm tương ứng.<\/p><p>Chi phí bán hàng trong tháng 50 triệu đồng; chi phí quản lý doanh nghiệp 40 triệu đồng.<\/p>","questions":[{"id":"lms-ch5-q068","num":"Bài 8 - Yêu cầu 1","type":"essay","text":"Định khoản hàng bán bị trả lại và nhập lại hàng.","answer":"<p>Ghi giảm doanh thu và thuế GTGT đầu ra, giảm phải thu khách hàng:<\/p><div class=\"je\"><div>Nợ TK 521 &nbsp; 50<\/div><div>Nợ TK 3331 &nbsp; 5<\/div><div class=\"cr\">Có TK 131 &nbsp; 55<\/div><\/div><p>Nhập lại kho hàng bị trả lại theo giá vốn, ghi giảm giá vốn:<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 30<\/div><div class=\"cr\">Có TK 632 &nbsp; 30<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); TT200 (TK 521, 156)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q069","num":"Bài 8 - Yêu cầu 2","type":"essay","text":"Kết chuyển khoản giảm trừ doanh thu.","answer":"<p>Cuối kỳ kết chuyển hàng bán bị trả lại để trừ vào doanh thu:<\/p><div class=\"je\"><div>Nợ TK 511 &nbsp; 50<\/div><div class=\"cr\">Có TK 521 &nbsp; 50<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); TT200 (TK 521, 156)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q070","num":"Bài 8 - Yêu cầu 3","type":"essay","text":"Xác định doanh thu thuần, giá vốn sau điều chỉnh và kết quả tiêu thụ.","answer":"<ul><li>Doanh thu thuần = 500 - 50 = <b>450<\/b><\/li><li>Giá vốn sau điều chỉnh = 300 - 30 = <b>270<\/b><\/li><li>Kết quả tiêu thụ = 450 - 270 - 50 - 40 = <b>90 triệu đồng (lãi)<\/b><\/li><\/ul>","explanation":"","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); TT200 (TK 521, 156)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q071","num":"Bài 8 - Yêu cầu 4","type":"essay","text":"Định khoản kết chuyển doanh thu, giá vốn và chi phí.","answer":"<p>Kết chuyển doanh thu thuần (TK 511 còn 500 - 50 = 450):<\/p><div class=\"je\"><div>Nợ TK 511 &nbsp; 450<\/div><div class=\"cr\">Có TK 911 &nbsp; 450<\/div><\/div><p>Kết chuyển giá vốn (đã điều chỉnh), CPBH, CPQLDN = 270 + 50 + 40 = 360:<\/p><div class=\"je\"><div>Nợ TK 911 &nbsp; 360<\/div><div class=\"cr\">Có TK 632 &nbsp; 270<\/div><div class=\"cr\">Có TK 641 &nbsp; 50<\/div><div class=\"cr\">Có TK 642 &nbsp; 40<\/div><\/div><p>Kết chuyển lãi 450 - 360 = 90:<\/p><div class=\"je\"><div>Nợ TK 911 &nbsp; 90<\/div><div class=\"cr\">Có TK 421 &nbsp; 90<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); TT200 (TK 521, 156)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u053","context":"<p>Công ty Đại Phúc trong tháng có các nghiệp vụ (triệu đồng): xuất NVL trực tiếp 500; xuất vật liệu dùng chung phân xưởng 40; tiền lương công nhân trực tiếp 200; lương nhân viên phân xưởng 40; lương nhân viên bán hàng 60; lương nhân viên quản lý doanh nghiệp 100.<\/p><p>Giả định các khoản trích theo lương do doanh nghiệp chịu bằng 23,5% tiền lương làm căn cứ trích. Khấu hao TSCĐ: phân xưởng 30; bán hàng 12; quản lý doanh nghiệp 18.<\/p><p>CPSX dở dang đầu kỳ 80; cuối kỳ 60. Hoàn thành 500 sản phẩm nhập kho. Xuất bán 300 sản phẩm với giá bán chưa thuế GTGT 3 triệu đồng/sản phẩm, thuế GTGT 10%, khách hàng chấp nhận thanh toán.<\/p>","questions":[{"id":"lms-ch5-q072","num":"Bài 9 - Yêu cầu 1","type":"essay","text":"Định khoản các nghiệp vụ chi phí sản xuất, bán hàng và quản lý doanh nghiệp.","answer":"<p>1) Xuất vật liệu:<\/p><div class=\"je\"><div>Nợ TK 621 &nbsp; 500<\/div><div>Nợ TK 627 &nbsp; 40<\/div><div class=\"cr\">Có TK 152 &nbsp; 540<\/div><\/div><p>2) Tiền lương phải trả (200 + 40 + 60 + 100 = 400):<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 200<\/div><div>Nợ TK 627 &nbsp; 40<\/div><div>Nợ TK 641 &nbsp; 60<\/div><div>Nợ TK 642 &nbsp; 100<\/div><div class=\"cr\">Có TK 334 &nbsp; 400<\/div><\/div><p>3) Trích theo lương phần DN chịu 23,5%: 622 = 47; 627 = 9,4; 641 = 14,1; 642 = 23,5 (tổng 94):<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; 47<\/div><div>Nợ TK 627 &nbsp; 9,4<\/div><div>Nợ TK 641 &nbsp; 14,1<\/div><div>Nợ TK 642 &nbsp; 23,5<\/div><div class=\"cr\">Có TK 338 &nbsp; 94<\/div><\/div><p>4) Khấu hao TSCĐ:<\/p><div class=\"je\"><div>Nợ TK 627 &nbsp; 30<\/div><div>Nợ TK 641 &nbsp; 12<\/div><div>Nợ TK 642 &nbsp; 18<\/div><div class=\"cr\">Có TK 214 &nbsp; 60<\/div><\/div><p>5) Kết chuyển chi phí sản xuất: 621 = 500; 622 = 247; 627 = 40 + 40 + 9,4 + 30 = 119,4; tổng 866,4.<\/p><div class=\"je\"><div>Nợ TK 154 &nbsp; 866,4<\/div><div class=\"cr\">Có TK 621 &nbsp; 500<\/div><div class=\"cr\">Có TK 622 &nbsp; 247<\/div><div class=\"cr\">Có TK 627 &nbsp; 119,4<\/div><\/div><p>CPBH = 60 + 14,1 + 12 = 86,1; CPQLDN = 100 + 23,5 + 18 = 141,5.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q073","num":"Bài 9 - Yêu cầu 2","type":"essay","text":"Tính tổng giá thành, giá thành đơn vị và giá vốn 300 sản phẩm bán ra.","answer":"<p>Tổng giá thành = 80 + 866,4 - 60 = <b>886,4 triệu đồng<\/b>.<\/p><p>Giá thành đơn vị = 886,4 / 500 = <b>1,7728 triệu đồng/sản phẩm<\/b>.<\/p><p>Giá vốn 300 sản phẩm = 300 x 1,7728 = <b>531,84 triệu đồng<\/b> (giả định không có thành phẩm tồn đầu kỳ, xuất bán theo giá thành đơn vị của lô hoàn thành).<\/p><div class=\"je\"><div>Nợ TK 155 &nbsp; 886,4<\/div><div class=\"cr\">Có TK 154 &nbsp; 886,4<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q074","num":"Bài 9 - Yêu cầu 3","type":"essay","text":"Định khoản doanh thu và giá vốn.","answer":"<p>Doanh thu = 300 x 3 = 900; thuế GTGT = 90; phải thu = 990.<\/p><div class=\"je\"><div>Nợ TK 131 &nbsp; 990<\/div><div class=\"cr\">Có TK 511 &nbsp; 900<\/div><div class=\"cr\">Có TK 3331 &nbsp; 90<\/div><\/div><div class=\"je\"><div>Nợ TK 632 &nbsp; 531,84<\/div><div class=\"cr\">Có TK 155 &nbsp; 531,84<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q075","num":"Bài 9 - Yêu cầu 4","type":"essay","text":"Xác định kết quả tiêu thụ trong tháng.","answer":"<p>Kết quả = 900 - 531,84 - 86,1 - 141,5 = <b>140,56 triệu đồng (lãi)<\/b>.<\/p><div class=\"je\"><div>Nợ TK 511 &nbsp; 900<\/div><div class=\"cr\">Có TK 911 &nbsp; 900<\/div><\/div><div class=\"je\"><div>Nợ TK 911 &nbsp; 759,44<\/div><div class=\"cr\">Có TK 632 &nbsp; 531,84<\/div><div class=\"cr\">Có TK 641 &nbsp; 86,1<\/div><div class=\"cr\">Có TK 642 &nbsp; 141,5<\/div><\/div><div class=\"je\"><div>Nợ TK 911 &nbsp; 140,56<\/div><div class=\"cr\">Có TK 421 &nbsp; 140,56<\/div><\/div><p>Kiểm tra: 531,84 + 86,1 + 141,5 = 759,44; 900 - 759,44 = 140,56.<\/p>","explanation":"","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627); Slide Chương 5, slide 65–73 (tiêu thụ, xác định kết quả); TT200 (TK 511, 632, 641, 642, 911); Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338) (slide 47)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u054","context":"<p>Công ty thương mại Gia Minh hạch toán hàng tồn kho theo phương pháp kê khai thường xuyên, tính giá xuất kho theo FIFO, kê khai thuế GTGT theo phương pháp khấu trừ. ĐVT: 1.000 đồng.<\/p><p>Tồn đầu kỳ 200 đơn vị hàng hóa A, đơn giá 400. Mua 300 đơn vị A, đơn giá chưa thuế 450, thuế GTGT 10%, chưa thanh toán. Chi phí vận chuyển lô hàng có tổng giá thanh toán 11.000, trong đó thuế GTGT 1.000, trả bằng chuyển khoản.<\/p><p>Xuất bán 350 đơn vị A, giá bán chưa thuế 800/đơn vị, thuế GTGT 10%, khách hàng chưa thanh toán.<\/p><p>Tiền lương phải trả: bộ phận bán hàng 20.000; quản lý doanh nghiệp 30.000. Giả định các khoản trích theo lương do doanh nghiệp chịu 23,5%. Khấu hao TSCĐ: bán hàng 5.000; quản lý doanh nghiệp 8.000. Tiền điện bộ phận bán hàng tổng thanh toán 11.000 (thuế GTGT 1.000), bộ phận quản lý doanh nghiệp tổng thanh toán 6.600 (thuế GTGT 600), đều đã chuyển khoản.<\/p>","questions":[{"id":"lms-ch5-q076","num":"Bài 10 - Yêu cầu 1","type":"essay","text":"Định khoản các nghiệp vụ mua, bán và chi phí.","answer":"<p>1) Mua hàng (300 x 450 = 135.000; thuế 13.500):<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 135.000<\/div><div>Nợ TK 133 &nbsp; 13.500<\/div><div class=\"cr\">Có TK 331 &nbsp; 148.500<\/div><\/div><p>2) Chi phí vận chuyển:<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 10.000<\/div><div>Nợ TK 133 &nbsp; 1.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 11.000<\/div><\/div><p>3) Bán hàng (350 x 800 = 280.000; thuế 28.000):<\/p><div class=\"je\"><div>Nợ TK 131 &nbsp; 308.000<\/div><div class=\"cr\">Có TK 511 &nbsp; 280.000<\/div><div class=\"cr\">Có TK 3331 &nbsp; 28.000<\/div><\/div><p>4) Giá vốn (xem yêu cầu 2):<\/p><div class=\"je\"><div>Nợ TK 632 &nbsp; 152.500<\/div><div class=\"cr\">Có TK 156 &nbsp; 152.500<\/div><\/div><p>5) Tiền lương:<\/p><div class=\"je\"><div>Nợ TK 641 &nbsp; 20.000<\/div><div>Nợ TK 642 &nbsp; 30.000<\/div><div class=\"cr\">Có TK 334 &nbsp; 50.000<\/div><\/div><p>6) Trích theo lương DN chịu 23,5% (641 = 4.700; 642 = 7.050):<\/p><div class=\"je\"><div>Nợ TK 641 &nbsp; 4.700<\/div><div>Nợ TK 642 &nbsp; 7.050<\/div><div class=\"cr\">Có TK 338 &nbsp; 11.750<\/div><\/div><p>7) Khấu hao TSCĐ:<\/p><div class=\"je\"><div>Nợ TK 641 &nbsp; 5.000<\/div><div>Nợ TK 642 &nbsp; 8.000<\/div><div class=\"cr\">Có TK 214 &nbsp; 13.000<\/div><\/div><p>8) Tiền điện:<\/p><div class=\"je\"><div>Nợ TK 641 &nbsp; 10.000<\/div><div>Nợ TK 133 &nbsp; 1.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 11.000<\/div><\/div><div class=\"je\"><div>Nợ TK 642 &nbsp; 6.000<\/div><div>Nợ TK 133 &nbsp; 600<\/div><div class=\"cr\">Có TK 112 &nbsp; 6.600<\/div><\/div>","explanation":"","source":"Slide Chương 5, slide 66–74; TT200 (TK 156, 133, 511, 632, 641, 642, 911); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q077","num":"Bài 10 - Yêu cầu 2","type":"essay","text":"Tính giá vốn hàng bán theo FIFO.","answer":"<p>Giá gốc lô mua = 135.000 + 10.000 = 145.000; đơn giá = 145.000 / 300 = 483,33.<\/p><p>FIFO: xuất 200 đơn vị tồn đầu (đơn giá 400) rồi 150 đơn vị lô mua.<\/p><p>Giá vốn = 200 x 400 + 150 x (145.000 / 300) = 80.000 + 72.500 = <b>152.500<\/b> (nghìn đồng).<\/p><p>Kiểm tra: tồn cuối = 150 đơn vị x 483,33 = 72.500; (80.000 + 145.000) - 152.500 = 72.500.<\/p>","explanation":"","source":"Slide Chương 5, slide 66–74; TT200 (TK 156, 133, 511, 632, 641, 642, 911); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q078","num":"Bài 10 - Yêu cầu 3","type":"essay","text":"Tính chi phí bán hàng, chi phí quản lý doanh nghiệp.","answer":"<ul><li>CPBH = 20.000 + 4.700 + 5.000 + 10.000 = <b>39.700<\/b><\/li><li>CPQLDN = 30.000 + 7.050 + 8.000 + 6.000 = <b>51.050<\/b><\/li><\/ul><p>Thuế GTGT tiền điện (1.000 và 600) vào TK 133, không tính vào chi phí.<\/p>","explanation":"","source":"Slide Chương 5, slide 66–74; TT200 (TK 156, 133, 511, 632, 641, 642, 911); Chương 4 (FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch5-q079","num":"Bài 10 - Yêu cầu 4","type":"essay","text":"Xác định và định khoản kết quả tiêu thụ.","answer":"<p>Kết quả = 280.000 - 152.500 - 39.700 - 51.050 = <b>36.750 nghìn đồng (lãi)<\/b>.<\/p><div class=\"je\"><div>Nợ TK 511 &nbsp; 280.000<\/div><div class=\"cr\">Có TK 911 &nbsp; 280.000<\/div><\/div><div class=\"je\"><div>Nợ TK 911 &nbsp; 243.250<\/div><div class=\"cr\">Có TK 632 &nbsp; 152.500<\/div><div class=\"cr\">Có TK 641 &nbsp; 39.700<\/div><div class=\"cr\">Có TK 642 &nbsp; 51.050<\/div><\/div><div class=\"je\"><div>Nợ TK 911 &nbsp; 36.750<\/div><div class=\"cr\">Có TK 421 &nbsp; 36.750<\/div><\/div><p>Kiểm tra: 152.500 + 39.700 + 51.050 = 243.250; 280.000 - 243.250 = 36.750.<\/p>","explanation":"","source":"Slide Chương 5, slide 66–74; TT200 (TK 156, 133, 511, 632, 641, 642, 911); Chương 4 (FIFO)","status":"ok","answerBasis":"self"}]}]},{"key":"ch6","title":"Chương 6 – Kiểm kê, tổ chức công tác kế toán","units":[{"id":"lms-ch6-u001","context":null,"questions":[{"id":"lms-ch6-q001","num":"Câu 1.","type":"mcq","text":"Kiểm kê trong kế toán được hiểu là?","options":[{"id":"lms-ch6-q001-A","text":"Kiểm tra việc ghi sổ kế toán hàng ngày"},{"id":"lms-ch6-q001-B","text":"Kiểm tra, xác định thực tế tài sản và đối chiếu với số liệu kế toán tại thời điểm kiểm kê"},{"id":"lms-ch6-q001-C","text":"Kiểm tra nội dung báo cáo tài chính cuối năm tài chính"},{"id":"lms-ch6-q001-D","text":"Kiểm tra phê duyệt chứng từ kế toán trước khi ghi sổ"}],"correctOptionId":"lms-ch6-q001-B","explanation":"Kiểm kê là việc kiểm tra các loại tài sản hiện có để xác định số thực có trên thực tế, phát hiện chênh lệch so với số liệu ghi trên sổ kế toán tại thời điểm kiểm kê (Điều 40 Luật Kế toán 2015). A, C, D là kiểm tra sổ, kiểm tra BCTC, kiểm soát chứng từ - không phải kiểm kê.","source":"Slide Chương 6, slide 6 (6.1.1 Khái niệm); Luật Kế toán 2015, Điều 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u002","context":null,"questions":[{"id":"lms-ch6-q002","num":"Câu 2.","type":"mcq","text":"Trường hợp nào sau đây phải thực hiện kiểm kê?","options":[{"id":"lms-ch6-q002-A","text":"Khi thay đổi mẫu chứng từ kế toán"},{"id":"lms-ch6-q002-B","text":"Khi lập báo cáo tài chính theo quy định"},{"id":"lms-ch6-q002-C","text":"Khi tăng lương cho nhân viên"},{"id":"lms-ch6-q002-D","text":"Khi thay đổi phần mềm kế toán"}],"correctOptionId":"lms-ch6-q002-B","explanation":"Các trường hợp phải kiểm kê gồm: cuối kỳ kế toán năm, trước khi lập BCTC; chia, tách, hợp nhất, sáp nhập, giải thể, bán, cho thuê DN; chuyển đổi hình thức sở hữu; đánh giá lại tài sản do hỏa hoạn, lũ lụt...; các trường hợp khác theo yêu cầu Nhà nước. Thay đổi mẫu chứng từ, tăng lương, đổi phần mềm không thuộc các trường hợp này.","source":"Slide Chương 6, slide 7","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u003","context":null,"questions":[{"id":"lms-ch6-q003","num":"Câu 3.","type":"mcq","text":"Tác dụng của kiểm kê?","options":[{"id":"lms-ch6-q003-A","text":"Tăng doanh thu bán hàng"},{"id":"lms-ch6-q003-B","text":"Đảm bảo số liệu trên sổ kế toán phù hợp với thực tế"},{"id":"lms-ch6-q003-C","text":"Giảm thuế phải nộp"},{"id":"lms-ch6-q003-D","text":"Thay thế hoàn toàn công tác ghi sổ kế toán"}],"correctOptionId":"lms-ch6-q003-B","explanation":"Kiểm kê giúp cập nhật số liệu sổ sách đúng với thực tế, bảo vệ tài sản, ngăn ngừa tham ô lãng phí, nâng cao trách nhiệm người quản lý tài sản. Kiểm kê không trực tiếp tăng doanh thu, không nhằm giảm thuế và không thể thay thế việc ghi sổ.","source":"Slide Chương 6, slide 8 (6.1.2 Ý nghĩa)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u004","context":null,"questions":[{"id":"lms-ch6-q004","num":"Câu 4.","type":"mcq","text":"Kiểm kê định kỳ là kiểm kê được thực hiện?","options":[{"id":"lms-ch6-q004-A","text":"Bất cứ khi nào xảy ra mất mát tài sản"},{"id":"lms-ch6-q004-B","text":"Theo thời hạn được quy định trước"},{"id":"lms-ch6-q004-C","text":"Khi có thay đổi nhân sự kế toán"},{"id":"lms-ch6-q004-D","text":"Có sự kiện bất khả kháng xảy ra như thiên tai, hỏa hoạn,…"}],"correctOptionId":"lms-ch6-q004-B","explanation":"Kiểm kê định kỳ là kiểm kê theo thời hạn quy định trước (ví dụ cuối tháng với hàng hóa, cuối năm với toàn bộ tài sản). A, C, D là các tình huống của kiểm kê bất thường (đột xuất, ngoài thời hạn quy định).","source":"Slide Chương 6, slide 11 (6.1.3)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u005","context":null,"questions":[{"id":"lms-ch6-q005","num":"Câu 5.","type":"mcq","text":"Khi tiến hành kiểm kê, phương pháp kiểm kê hiện vật áp dụng đối với?","options":[{"id":"lms-ch6-q005-A","text":"Tiền gửi không kỳ hạn"},{"id":"lms-ch6-q005-B","text":"Các khoản phải trả nhà cung cấp"},{"id":"lms-ch6-q005-C","text":"Hàng tồn kho"},{"id":"lms-ch6-q005-D","text":"Hàng mua đi đường"}],"correctOptionId":"lms-ch6-q005-C","explanation":"Kiểm kê hiện vật (cân, đo, đong, đếm) áp dụng cho tài sản hiện có tại đơn vị như hàng hóa, TSCĐ, tiền mặt, CCDC - tức hàng tồn kho. Tiền gửi ngân hàng, công nợ phải trả, hàng mua đi đường (chưa về đơn vị) không hiện diện tại đơn vị nên dùng kiểm kê đối chiếu.","source":"Slide Chương 6, slide 12 (6.1.4)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u006","context":null,"questions":[{"id":"lms-ch6-q006","num":"Câu 6.","type":"mcq","text":"Công việc cần chuẩn bị trước khi tiến hành kiểm kê tài sản?","options":[{"id":"lms-ch6-q006-A","text":"Xử lý kết quả kiểm kê"},{"id":"lms-ch6-q006-B","text":"Khóa sổ kế toán, xác định giá trị tài sản trên sổ sách"},{"id":"lms-ch6-q006-C","text":"Thu thập, tổng hợp số liệu kiểm kê"},{"id":"lms-ch6-q006-D","text":"Đối chiếu số liệu kiểm kê với sổ sách kế toán"}],"correctOptionId":"lms-ch6-q006-B","explanation":"Trước kiểm kê, kế toán viên khóa sổ kế toán và xác định giá trị tài sản trên sổ sách; nhân viên quản lý tài sản sắp xếp, phân loại tài sản. Các việc A, C, D thuộc giai đoạn thực hiện kiểm kê hoặc xử lý kết quả (sau kiểm kê).","source":"Slide Chương 6, slide 14-15 (6.1.5)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u007","context":null,"questions":[{"id":"lms-ch6-q007","num":"Câu 7.","type":"mcq","text":"Biên bản kiểm kê được lập khi?","options":[{"id":"lms-ch6-q007-A","text":"Xin phê duyệt kế hoạch kiểm kê"},{"id":"lms-ch6-q007-B","text":"Ghi nhận kết quả kiểm kê và biện pháp xử lý thích hợp khi tài sản bị thừa, thiếu"},{"id":"lms-ch6-q007-C","text":"Chỉ được lập khi phát hiện thiếu tài sản"},{"id":"lms-ch6-q007-D","text":"Chỉ được lập khi phát hiện thừa tài sản"}],"correctOptionId":"lms-ch6-q007-B","explanation":"Biên bản kiểm kê ghi nhận kết quả kiểm kê và đề xuất giải pháp xử lý thích hợp khi tài sản thừa, thiếu. C, D (chỉ khi thiếu / chỉ khi thừa) sai vì biên bản lập cho cả hai trường hợp; A không phải mục đích của biên bản kiểm kê.","source":"Slide Chương 6, slide 15 (Xử lý kết quả kiểm kê)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u008","context":null,"questions":[{"id":"lms-ch6-q008","num":"Câu 8.","type":"mcq","text":"Nội dung tổ chức công tác kế toán bao gồm?","options":[{"id":"lms-ch6-q008-A","text":"Tổ chức hệ thống chứng từ kế toán"},{"id":"lms-ch6-q008-B","text":"Tổ chức hệ thống sổ kế toán"},{"id":"lms-ch6-q008-C","text":"Tổ chức hệ thống báo cáo kế toán"},{"id":"lms-ch6-q008-D","text":"Tất cả các nội dung trên","pinned":true}],"correctOptionId":"lms-ch6-q008-D","explanation":"Nội dung tổ chức công tác kế toán gồm: hệ thống chứng từ, hệ thống tài khoản, vận dụng phương pháp tính giá, hệ thống sổ, chế độ báo cáo kế toán, hình thức tổ chức công tác kế toán, kiểm tra kế toán, phân tích hoạt động kinh doanh. A, B, C đều là nội dung nên chọn D.","source":"Slide Chương 6, slide 20 (6.2.3)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u009","context":null,"questions":[{"id":"lms-ch6-q009","num":"Câu 9.","type":"mcq","text":"Nội dung nào dưới đây không phải là nội dung của tổ chức hệ thống chứng từ kế toán?","options":[{"id":"lms-ch6-q009-A","text":"Quy định người chịu trách nhiệm ghi nhận thông tin vào các chứng từ kế toán"},{"id":"lms-ch6-q009-B","text":"Không cần quy trình luân chuyển chứng từ"},{"id":"lms-ch6-q009-C","text":"Quy định mẫu chứng từ cho phù hợp với loại nghiệp vụ và yêu cầu quản lý của đơn vị"},{"id":"lms-ch6-q009-D","text":"Xây dựng hệ thống danh mục chứng từ."}],"correctOptionId":"lms-ch6-q009-B","explanation":"Theo slide, tổ chức hệ thống chứng từ gồm: xây dựng danh mục chứng từ, quy định mẫu chứng từ phù hợp, tổ chức luân chuyển, xử lý, lưu trữ, bảo quản chứng từ và quy định người chịu trách nhiệm ghi nhận thông tin vào chứng từ. Do đó \"Không cần quy trình luân chuyển chứng từ\" trái với nội dung này nên không phải nội dung của tổ chức chứng từ.","source":"Slide Chương 6, slide 21 (Tổ chức hệ thống chứng từ kế toán)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u010","context":null,"questions":[{"id":"lms-ch6-q010","num":"Câu 10.","type":"mcq","text":"Hình thức tổ chức công tác kế toán tập trung là?","options":[{"id":"lms-ch6-q010-A","text":"Mỗi phòng ban/bộ phận thực hiện ghi sổ và lập báo cáo hoạt động của phòng ban/bộ phận"},{"id":"lms-ch6-q010-B","text":"Công tác kế toán chủ yếu thực hiện tại phòng kế toán trung tâm của đơn vị kế toán"},{"id":"lms-ch6-q010-C","text":"Bộ phận kế toán chỉ được thực hiện tại các đơn vị phụ thuộc"},{"id":"lms-ch6-q010-D","text":"Không cần phân công kế toán viên"}],"correctOptionId":"lms-ch6-q010-B","explanation":"Bộ máy kế toán tập trung gồm một phòng kế toán trung tâm và các nhân viên kinh tế ở đơn vị phụ thuộc; công tác kế toán chủ yếu thực hiện tại phòng kế toán trung tâm. A mô tả ghi sổ phân tán theo bộ phận, C sai (kế toán không chỉ ở đơn vị phụ thuộc), D sai vì vẫn phải phân công kế toán viên.","source":"Slide Chương 6, slide 26 (Hình thức tổ chức công tác kế toán)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u011","context":null,"questions":[{"id":"lms-ch6-q011","num":"Câu 11.","type":"mcq","text":"Hình thức tổ chức công tác kế toán phân tán là?","options":[{"id":"lms-ch6-q011-A","text":"Chỉ có một kế toán trưởng làm tất cả nghiệp vụ"},{"id":"lms-ch6-q011-B","text":"Các đơn vị/bộ phận phụ thuộc có thể tổ chức kế toán tại chỗ và định kỳ tổng hợp/báo cáo về trung tâm"},{"id":"lms-ch6-q011-C","text":"Không cần quy trình luân chuyển chứng từ"},{"id":"lms-ch6-q011-D","text":"Chỉ áp dụng cho doanh nghiệp có quy mô rất nhỏ"}],"correctOptionId":"lms-ch6-q011-B","explanation":"Bộ máy kế toán phân tán được tổ chức ở cả đơn vị chính (phòng kế toán trung tâm) và các đơn vị phụ thuộc; đơn vị phụ thuộc kế toán tại chỗ và định kỳ tổng hợp, báo cáo về trung tâm. A sai, C sai (vẫn cần luân chuyển chứng từ), D sai (thường phù hợp đơn vị quy mô lớn, nhiều đơn vị phụ thuộc).","source":"Slide Chương 6, slide 26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch6-u012","context":null,"questions":[{"id":"lms-ch6-q012","num":"Câu 12.","type":"mcq","text":"Tổ chức thực hiện chế độ báo cáo kế toán là?","options":[{"id":"lms-ch6-q012-A","text":"Lập báo cáo tài chính khi kết quả hoạt động kinh doanh có lãi"},{"id":"lms-ch6-q012-B","text":"Lập Báo cáo tài chính cuối kỳ kế toán năm theo quy định"},{"id":"lms-ch6-q012-C","text":"Chỉ gửi báo cáo cho phòng nhân sự"},{"id":"lms-ch6-q012-D","text":"Chỉ in báo cáo để lưu, không cần ký duyệt"}],"correctOptionId":"lms-ch6-q012-B","explanation":"Tổ chức chế độ báo cáo kế toán là tổ chức lập Báo cáo tài chính (báo cáo tình hình tài chính, kết quả HĐKD, lưu chuyển tiền tệ, thuyết minh) và báo cáo quản trị theo quy định, cuối kỳ kế toán năm. Không phụ thuộc lãi/lỗ (A sai); không chỉ gửi phòng nhân sự (C sai); báo cáo phải được ký duyệt, không chỉ in lưu (D sai).","source":"Slide Chương 6, slide 25 (Tổ chức thực hiện chế độ báo cáo kế toán)","status":"ok","answerBasis":"self"}]}]}],"other":[{"key":"de1","title":"ĐỀ 1","units":[{"id":"other-de1-u001","context":null,"questions":[{"id":"other-de1-q001","num":"Câu 1","type":"mcq","text":"<p>Kế toán sẽ ghi Nợ tài khoản Nguyên vật liệu khi:<\/p>","options":[{"id":"other-de1-q001-A","text":"Doanh nghiệp nhập kho nguyên vật liệu"},{"id":"other-de1-q001-B","text":"Doanh nghiệp xuất kho nguyên vật liệu"},{"id":"other-de1-q001-C","text":"Doanh nghiệp mua nguyên vật liệu dùng ngay"},{"id":"other-de1-q001-D","text":"Doanh nghiệp phát hiện thiếu nguyên vật liệu"}],"correctOptionId":"other-de1-q001-A","answerBasis":"given","explanation":"<p>Nợ TK 152 (Nguyên liệu, vật liệu) tăng khi vật liệu được nhập kho (Nợ 152 / Có 111, 112, 331...).<\/p><p>B sai: xuất kho là ghi Có TK 152. D sai: phát hiện thiếu vật liệu là ghi Có TK 152 (đối ứng Nợ 1381 hoặc 632...). C: mua dùng ngay không qua kho nên không ghi Nợ TK 152 mà ghi thẳng vào chi phí (TK 621...).<\/p>","source":"Slide Chương 5 (kế toán nguyên liệu, vật liệu); TT200 (TK 152)","status":"ok"}]},{"id":"other-de1-u002","context":null,"questions":[{"id":"other-de1-q002","num":"Câu 2","type":"mcq","text":"<p>Nhận định nào đúng trong những nhận định sau về hóa đơn GTGT<\/p>","options":[{"id":"other-de1-q002-A","text":"Hóa đơn GTGT do người bán lập"},{"id":"other-de1-q002-B","text":"Hóa đơn GTGT do người mua lập"},{"id":"other-de1-q002-C","text":"Hóa đơn GTGT sử dụng khi đơn vị tính thuế GTGT theo phương pháp trực tiếp"},{"id":"other-de1-q002-D","text":"Số hiệu chứng từ trên hóa đơn GTGT là yếu tố bổ sung"}],"correctOptionId":"other-de1-q002-A","answerBasis":"given","explanation":"<p>Hóa đơn GTGT do người bán lập khi bán hàng, cung cấp dịch vụ (là chứng từ bên ngoài đối với bên mua).<\/p><p>B sai: không phải người mua lập. C sai: hóa đơn GTGT dùng cho đơn vị tính thuế theo phương pháp khấu trừ; phương pháp trực tiếp dùng hóa đơn bán hàng. D sai: số hiệu chứng từ là yếu tố bắt buộc, không phải yếu tố bổ sung.<\/p>","source":"Slide Chương 3, slide 11, 14 (phân loại, nội dung chứng từ); Luật Kế toán","status":"ok"}]},{"id":"other-de1-u003","context":null,"questions":[{"id":"other-de1-q003","num":"Câu 3","type":"mcq","text":"<p>Chứng từ kế toán là:<\/p>","options":[{"id":"other-de1-q003-A","text":"Là các giấy tờ phản ánh các hoạt động kinh tế tài chính đã phát sinh và thưc sự hoàn thành, là cơ sở để ghi chép và sổ sách của đơn vị."},{"id":"other-de1-q003-B","text":"Là các giấy tờ và vật mang tin phản ánh các hoạt động kinh tế tài chính đã phát sinh và thưc sự hoàn thành, là cơ sở để ghi chép và sổ sách của đơn vị."},{"id":"other-de1-q003-C","text":"Là các giấy tờ và vật mang tin phản ánh các hoạt động kinh tế tài chính đã phát sinh, là cơ sở để ghi chép và sổ sách của đơn vị."},{"id":"other-de1-q003-D","text":"Là vật mang tin phản ánh các hoạt động kinh tế tài chính đã phát sinh và thưc sự hoàn thành, là cơ sở để ghi chép và sổ sách của đơn vị."}],"correctOptionId":"other-de1-q003-B","answerBasis":"given","explanation":"<p>Theo Điều 4 Luật Kế toán (slide): chứng từ kế toán là những giấy tờ <b>và vật mang tin<\/b> phản ánh nghiệp vụ kinh tế phát sinh <b>và đã thực sự hoàn thành<\/b>, làm căn cứ ghi sổ. Chỉ B đủ cả hai ý.<\/p><p>A thiếu \"vật mang tin\". C thiếu \"đã thực sự hoàn thành\". D thiếu \"giấy tờ\".<\/p>","source":"Slide Chương 3, slide 5 (Điều 4 Luật Kế toán)","status":"ok"}]},{"id":"other-de1-u004","context":null,"questions":[{"id":"other-de1-q004","num":"Câu 4","type":"mcq","text":"<p>Nhận định nào đúng trong những nhận định sau về phiếu chi<\/p>","options":[{"id":"other-de1-q004-A","text":"Phiếu chi do người bán lập"},{"id":"other-de1-q004-B","text":"Phiếu chi phát sinh khi đơn vị chuyển khoản thanh toán cho người bán"},{"id":"other-de1-q004-C","text":"Phiếu chi chỉ được lập 1 liên để đảm bảo thông tin khách hàng"},{"id":"other-de1-q004-D","text":"Thông tin người nhận tiền trên phiếu chi là yếu tố bắt buộc"}],"correctOptionId":"other-de1-q004-D","answerBasis":"given","explanation":"<p>Phiếu chi do đơn vị chi tiền lập (thủ quỹ chi tiền mặt); thông tin người nhận tiền là yếu tố bắt buộc trên phiếu chi.<\/p><p>A sai: không do người bán lập. B sai: chuyển khoản dùng ủy nhiệm chi/giấy báo Nợ, phiếu chi dùng cho chi tiền mặt. C sai: phiếu chi lập nhiều liên (lưu, giao người nhận...).<\/p>","source":"Slide Chương 3, slide 14, 16, 21 (chứng từ tiền tệ, nội dung chứng từ)","status":"ok"}]},{"id":"other-de1-u005","context":null,"questions":[{"id":"other-de1-q005","num":"Câu 5","type":"mcq","text":"<p>Nhận định nào đúng trong những nhận định sau về phiếu thu:<\/p>","options":[{"id":"other-de1-q005-A","text":"Là cơ sở để ghi sổ nghiệp vụ chi tiền mặt thanh toán"},{"id":"other-de1-q005-B","text":"Là căn cứ kiểm tra tính hợp lý và hợp pháp của nghiệp vụ chi tiền mặt thanh toán"},{"id":"other-de1-q005-C","text":"Là cơ sở để xác định cá nhân và bộ phận chịu trách nhiệm vật chất về nghiệp vụ kinh tế phát sinh"},{"id":"other-de1-q005-D","text":"Không dùng để giải quyết tranh chấp, khiếu nại về kinh tế tài chính (nếu phát sinh)"}],"correctOptionId":"other-de1-q005-C","answerBasis":"given","explanation":"<p>Phiếu thu là chứng từ chứng minh nghiệp vụ thu tiền đã hoàn thành; nó là cơ sở xác định cá nhân, bộ phận chịu trách nhiệm vật chất về nghiệp vụ phát sinh.<\/p><p>A, B sai vì nói về nghiệp vụ chi (đó là phiếu chi). D sai: chứng từ vẫn dùng để giải quyết tranh chấp, khiếu nại.<\/p>","source":"Slide Chương 3, slide 16 (chứng từ chấp hành), slide 5","status":"ok"}]},{"id":"other-de1-u006","context":null,"questions":[{"id":"other-de1-q006","num":"Câu 6","type":"mcq","text":"<p>Kết cấu của tài khoản doanh thu là:<\/p>","options":[{"id":"other-de1-q006-A","text":"Phát sinh tăng bên Nợ, phát sinh giảm bên Có, số dư bên Nợ"},{"id":"other-de1-q006-B","text":"Phát sinh tăng bên Có, phát sinh giảm bên Nợ, số dư bên Có"},{"id":"other-de1-q006-C","text":"Phát sinh tăng bên Nợ, phát sinh giảm bên Có, không có số dư"},{"id":"other-de1-q006-D","text":"Phát sinh tăng bên Có, phát sinh giảm bên Nợ, không có số dư"}],"correctOptionId":"other-de1-q006-D","answerBasis":"given","explanation":"<p>TK doanh thu (loại 5, 7) phản ánh doanh thu tăng bên Có, giảm/kết chuyển bên Nợ; cuối kỳ kết chuyển sang TK 911 nên không có số dư.<\/p><p>A, B, C sai: ghi ngược bên hoặc có số dư.<\/p>","source":"Slide Chương 3 (kết cấu tài khoản, slide 37–38); Slide Chương 5, slide 66 (TK 511)","status":"ok"}]},{"id":"other-de1-u007","context":null,"questions":[{"id":"other-de1-q007","num":"Câu 7","type":"mcq","text":"<p>Nhận định nào đúng trong những nhận định sau:<\/p>","options":[{"id":"other-de1-q007-A","text":"Phiếu xuất kho là chứng từ gốc"},{"id":"other-de1-q007-B","text":"Lệnh chi tiền là chứng từ chấp hành"},{"id":"other-de1-q007-C","text":"Phiếu chi là chứng từ mệnh lệnh"},{"id":"other-de1-q007-D","text":"Tất cả những nhận định đều đúng","pinned":true}],"correctOptionId":"other-de1-q007-A","answerBasis":"given","explanation":"<p>Phiếu xuất kho là chứng từ gốc (ví dụ trong slide: \"Hóa đơn, phiếu xuất vật tư, phiếu thu chi tiền mặt\").<\/p><p>B sai: lệnh chi tiền là chứng từ mệnh lệnh. C sai: phiếu chi là chứng từ chấp hành. D sai vì B, C sai.<\/p>","source":"Slide Chương 3, slide 8, 15, 16","status":"ok"}]},{"id":"other-de1-u008","context":null,"questions":[{"id":"other-de1-q008","num":"Câu 8","type":"mcq","text":"<p>Công ty cổ phần ABC kê khai thuế giá trị gia tăng (GTGT) theo phương pháp khấu trừ. 20/4/N công ty mua dây chuyền sản xuất T, giá mua chưa có thuế GTGT: 11.500.000.000 đồng, thuế suất thuế GTGT 10%, thanh toán ngay bằng chuyển khoản (Ngân hàng đã báo Nợ). Chi phí vận chuyển dây chuyền sản xuất chưa có thuế GTGT: 12.000.000 đồng, thuế suất thuế GTGT 10% đã trả bằng tiền mặt. Công ty ABC cần những chứng từ gì để làm căn cứ ghi sổ kế toán:<\/p>","options":[{"id":"other-de1-q008-A","text":"Phiếu nhập kho, hóa đơn GTGT, phiếu chi"},{"id":"other-de1-q008-B","text":"Biên bản giao nhận tài sản, hóa đơn GTGT, phiếu chi, giấy báo Nợ"},{"id":"other-de1-q008-C","text":"Biên bản giao nhận tài sản, hóa đơn GTGT, phiếu thu"},{"id":"other-de1-q008-D","text":"Phiếu nhập kho, hóa đơn GTGT, giấy báo Nợ"}],"correctOptionId":"other-de1-q008-B","answerBasis":"given","explanation":"<p>Mua dây chuyền sản xuất là mua TSCĐ nên cần Biên bản giao nhận TSCĐ (không phải phiếu nhập kho, vốn dùng cho vật tư, hàng hóa). Cần hóa đơn GTGT; chi vận chuyển bằng tiền mặt cần phiếu chi; thanh toán chuyển khoản cần giấy báo Nợ.<\/p><p>A, D sai do dùng phiếu nhập kho. C sai do dùng phiếu thu (là thu tiền) và thiếu chứng từ thanh toán chuyển khoản.<\/p>","source":"Slide Chương 3, slide 14 (chứng từ TSCĐ, tiền tệ); Slide Chương 5, slide 7","status":"ok"}]},{"id":"other-de1-u009","context":null,"questions":[{"id":"other-de1-q009","num":"Câu 9","type":"mcq","text":"<p>Nội dung bổ sung trong chứng từ là:<\/p>","options":[{"id":"other-de1-q009-A","text":"Chữ ký các bên liên quan"},{"id":"other-de1-q009-B","text":"Nội dung nghiệp vụ"},{"id":"other-de1-q009-C","text":"Tên và số hiệu chứng từ"},{"id":"other-de1-q009-D","text":"Hình thức thanh toán"}],"correctOptionId":"other-de1-q009-D","answerBasis":"given","explanation":"<p>Yếu tố bổ sung của chứng từ (tùy từng loại) gồm hình thức thanh toán, thời hạn, tỷ giá... Các yếu tố bắt buộc gồm tên, số hiệu, ngày lập, nội dung nghiệp vụ, chữ ký các bên.<\/p><p>A, B, C là yếu tố bắt buộc.<\/p>","source":"Slide Chương 3, slide 21–23 (nội dung bổ sung)","status":"ok"}]},{"id":"other-de1-u010","context":null,"questions":[{"id":"other-de1-q010","num":"Câu 10","type":"mcq","text":"<p>Nhận định nào đúng trong những nhận định sau về ghi sổ kép:<\/p>","options":[{"id":"other-de1-q010-A","text":"Là phương pháp kế toán phản ánh các nghiệp vụ kinh tế tài chính phát sinh"},{"id":"other-de1-q010-B","text":"Liên quan đến tối thiểu 3 tài khoản tổng hợp"},{"id":"other-de1-q010-C","text":"Bao gồm định khoản giản đơn và không giản đơn"},{"id":"other-de1-q010-D","text":"Số tiền ghi Nợ, ghi Có có thể chênh lệch nếu phát sinh liên quan đến nhiều đối tượng"}],"correctOptionId":"other-de1-q010-A","answerBasis":"given","explanation":"<p>Theo slide, ghi sổ kép là phương pháp kế toán phản ánh các nghiệp vụ kinh tế tài chính phát sinh vào ít nhất hai tài khoản, một ghi Nợ một ghi Có, với số tiền bằng nhau.<\/p><p>B sai: tối thiểu 2 tài khoản. D sai: tổng ghi Nợ luôn bằng tổng ghi Có. C là nhận định đúng về định khoản (giản đơn, phức tạp) nhưng không phải định nghĩa trong slide.<\/p>","source":"Slide Chương 3, slide 63–66 (ghi sổ kép)","status":"needs_review","reviewNote":"Đáp án đã cho là A (đúng nguyên văn định nghĩa trong slide). Lưu ý phương án C \"Bao gồm định khoản giản đơn và không giản đơn\" cũng là nhận định đúng về định khoản kế toán; câu có hai phương án đều hợp lý, nên cần xác nhận lại với giảng viên."}]},{"id":"other-de1-u011","context":null,"questions":[{"id":"other-de1-q011","num":"Câu 11","type":"mcq","text":"<p>Trước khi tiến hành kiểm kê tài sản, kế toán viên cần phải:<\/p>","options":[{"id":"other-de1-q011-A","text":"Thực hiện kiểm kê theo trình tự"},{"id":"other-de1-q011-B","text":"Khóa sổ kế toán"},{"id":"other-de1-q011-C","text":"Đối chiếu số liệu sổ sách kế toán"},{"id":"other-de1-q011-D","text":"Điều chỉnh số liệu khi phát sinh chênh lệch"}],"correctOptionId":"other-de1-q011-B","answerBasis":"given","explanation":"<p>Trước khi kiểm kê, kế toán viên khóa sổ kế toán và xác định giá trị tài sản trên sổ sách. Các việc A, C, D diễn ra trong/sau khi kiểm kê.<\/p>","source":"Slide Chương 6, slide 14 (tổ chức công tác kiểm kê); Slide Chương 1, slide 55 (khóa sổ)","status":"ok"}]},{"id":"other-de1-u012","context":null,"questions":[{"id":"other-de1-q012","num":"Câu 12","type":"mcq","text":"<p>Định khoản Nợ TK 341 - Vay và nợ thuê tài chính / Có TK 112 - Tiền gửi NH có ý nghĩa là:<\/p>","options":[{"id":"other-de1-q012-A","text":"Chuyển khoản thanh toán khoản vay của đơn vị"},{"id":"other-de1-q012-B","text":"Chuyển khoản thanh toán khoản nợ phải trả người bán của đơn vị."},{"id":"other-de1-q012-C","text":"Đơn vị vay và nhận tiền qua ngân hàng"},{"id":"other-de1-q012-D","text":"Đơn vị có một khoản vay tăng lên và tiền trong ngân hàng giảm xuống"}],"correctOptionId":"other-de1-q012-A","answerBasis":"given","explanation":"<p>Nợ TK 341 (nợ vay giảm) / Có TK 112 (tiền gửi giảm): chuyển khoản trả nợ vay.<\/p><p>B sai: nợ người bán là TK 331. C sai: vay nhận tiền là Nợ 112 / Có 341. D sai: vay tăng nên ghi Có 341, ở đây TK 341 ghi Nợ nên vay giảm.<\/p>","source":"Slide Chương 3, slide 65 (quan hệ đối ứng); TT200 (TK 341, 112)","status":"ok"}]},{"id":"other-de1-u013","context":null,"questions":[{"id":"other-de1-q013","num":"Câu 13","type":"mcq","text":"<p>Định khoản Nợ TK 138 - Phải thu khác / Có TK 111 - Tiền mặt có ý nghĩa là:<\/p>","options":[{"id":"other-de1-q013-A","text":"Đơn vị kiểm kê tiền tại quỹ phát hiện thừa"},{"id":"other-de1-q013-B","text":"Đơn vị kiểm kê tiền tại quỹ phát hiện thiếu"},{"id":"other-de1-q013-C","text":"Đơn vị tăng một khoản phải thu bằng tiền mặt."},{"id":"other-de1-q013-D","text":"Đơn vị giảm một khoản thu bằng tiền mặt."}],"correctOptionId":"other-de1-q013-B","answerBasis":"given","explanation":"<p>Nợ TK 138 / Có TK 111: tiền mặt giảm, ghi nhận khoản phải thu khác (tiền thiếu quỹ chờ xử lý, ghi Nợ 1381). Đó là kiểm kê quỹ phát hiện thiếu.<\/p><p>A sai: thừa quỹ ghi Nợ 111 / Có 3381. C, D mô tả không đúng bản chất nghiệp vụ.<\/p>","source":"Slide Chương 5, slide 33 (TK 138); Slide Chương 6 (kiểm kê); TT200 (TK 1381)","status":"ok"}]},{"id":"other-de1-u014","context":null,"questions":[{"id":"other-de1-q014","num":"Câu 14","type":"mcq","text":"<p>Định khoản Nợ TK 121 - Chứng khoán kinh doanh / Có TK 112 - Tiền gửi NH có ý nghĩa là:<\/p>","options":[{"id":"other-de1-q014-A","text":"Đơn vị bán cổ phiếu và thu về tiền gửi Ngân hàng"},{"id":"other-de1-q014-B","text":"Đơn vị ghi giảm một khoản đầu tư"},{"id":"other-de1-q014-C","text":"Đơn vị dùng tiền gửi Ngân hàng để mua cổ phiếu đầu tư"},{"id":"other-de1-q014-D","text":"Đơn vị có một khoản đầu tư dài hạn bằng tiền gửi ngân hàng."}],"correctOptionId":"other-de1-q014-C","answerBasis":"given","explanation":"<p>Nợ TK 121 / Có TK 112: tiền gửi ngân hàng giảm, chứng khoán kinh doanh tăng: dùng tiền gửi mua cổ phiếu để kinh doanh.<\/p><p>A, B sai: bán chứng khoán thì ghi Có TK 121. D sai: TK 121 là đầu tư ngắn hạn (chứng khoán kinh doanh), không phải dài hạn.<\/p>","source":"Slide Chương 4, slide 41–42 (chứng khoán kinh doanh); Slide Chương 1, slide 26; TT200 (TK 121)","status":"ok"}]},{"id":"other-de1-u015","context":null,"questions":[{"id":"other-de1-q015","num":"Câu 15","type":"mcq","text":"<p>Nhận góp vốn liên doanh bằng một TSCĐ, giá đánh giá của hội đồng giao nhận là 150 triệu:<\/p>","options":[{"id":"other-de1-q015-A","text":"Định khoản Nợ TK 411 - Vốn đầu tư của Chủ sở hữu/ Có TK TK 211 - Tài sản cố định"},{"id":"other-de1-q015-B","text":"Tổng tài sản và tổng nguồn vốn cùng tăng thêm 150 triệu"},{"id":"other-de1-q015-C","text":"Định khoản Nợ TK 211 - Tài sản cố định/ Có TK 411 - Vốn đầu tư của Chủ sở hữu"},{"id":"other-de1-q015-D","text":"B và C đúng","pinned":true}],"correctOptionId":"other-de1-q015-D","answerBasis":"given","explanation":"<p>Nhận vốn góp bằng TSCĐ: Nợ TK 211 150 triệu / Có TK 411 150 triệu (C đúng). TSCĐ tăng (tài sản) và vốn chủ sở hữu tăng (nguồn vốn) cùng 150 triệu nên tổng tài sản và tổng nguồn vốn cùng tăng (B đúng). Vậy D \"B và C đúng\" đúng.<\/p><p>A sai vì ghi ngược bên.<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 150.000.000<\/div><div class=\"cr\">Có TK 411 &nbsp; 150.000.000<\/div><\/div>","source":"Slide Chương 3 (quan hệ đối ứng, slide 65); Slide Chương 5 (TSCĐ, góp vốn); TT200 (TK 211, 411)","status":"ok"}]},{"id":"other-de1-u016","context":null,"questions":[{"id":"other-de1-q016","num":"Câu 16","type":"mcq","text":"<p>Giá trị thuần có thể thực hiện được?<\/p>","options":[{"id":"other-de1-q016-A","text":"Được sử dụng để định giá cho ghi nhận ban đầu giá trị của tài sản ngay khi phát sinh nghiệp vụ mua sắm tài sản."},{"id":"other-de1-q016-B","text":"Được sử dụng để ghi nhận giá xuất kho của hàng tồn kho."},{"id":"other-de1-q016-C","text":"Được sử dụng để định giá sau ghi nhận ban đầu giá trị của tài sản (trước khi lập báo cáo tài chính do sự thay đổi giá trị)"},{"id":"other-de1-q016-D","text":"Được xác định bằng hiện giá của các dòng tiền thuần từ việc sử dụng tài sản."}],"correctOptionId":"other-de1-q016-C","answerBasis":"given","explanation":"<p>Giá trị thuần có thể thực hiện được (NRV) là giá bán ước tính trừ chi phí ước tính để hoàn thành và bán; dùng để đánh giá sau ghi nhận ban đầu (cơ sở lập dự phòng giảm giá hàng tồn kho khi lập BCTC).<\/p><p>A sai: ghi nhận ban đầu dùng giá gốc. B sai: giá xuất kho tính theo FIFO, bình quân... D sai: đó là giá trị sử dụng/hiện giá dòng tiền.<\/p>","source":"Slide Chương 4, slide 10, 13 (giá trị thuần có thể thực hiện được), slide 40","status":"ok"}]},{"id":"other-de1-u017","context":null,"questions":[{"id":"other-de1-q017","num":"Câu 17","type":"mcq","text":"<p>Nguyên tắc kế toán ảnh hưởng đến tính giá?<\/p>","options":[{"id":"other-de1-q017-A","text":"Nguyên tắc hoạt động liên tục, nguyên tắc khách quan"},{"id":"other-de1-q017-B","text":"Nguyên tắc thận trọng, nguyên tắc hoạt động liên tục"},{"id":"other-de1-q017-C","text":"Nguyên tắc nhất quán, nguyên tắc hoạt động liên tục, nguyên tắc thận trọng"},{"id":"other-de1-q017-D","text":"Nguyên tắc nhất quán, nguyên tắc khách quan, nguyên tắc hoạt động liên tục, nguyên tắc thận trọng"}],"correctOptionId":"other-de1-q017-C","answerBasis":"given","explanation":"<p>Theo đáp án đề: các nguyên tắc ảnh hưởng đến tính giá gồm nhất quán (áp dụng thống nhất phương pháp tính giá), hoạt động liên tục và thận trọng (không đánh giá cao hơn tài sản, thu nhập). Phương án C.<\/p><p>A, B thiếu nhất quán; D thêm nguyên tắc khách quan.<\/p>","source":"Slide Chương 4, slide 8–9; Slide Chương 1, slide 59–70 (nguyên tắc kế toán)","status":"needs_review","reviewNote":"Đáp án đề cho là C. Tuy nhiên slide Chương 4 (slide 8) nêu \"nguyên tắc khách quan và thận trọng ảnh hưởng rõ nét đến xác định giá trị\", slide 9 nêu tính nhất quán;

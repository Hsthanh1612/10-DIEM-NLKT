 vốn chủ sở hữu tăng.<\/p><div class=\"je\"><div>Nợ TK 111 &nbsp; 1.000.000.000<\/div><div class=\"cr\">Có TK 411 &nbsp; 1.000.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q073","num":"Tài khoản – Bài 4 – Nghiệp vụ 3","type":"essay","text":"Định khoản nghiệp vụ 3: Nhập kho 500kg vật liệu A đơn giá nhập là: 10.000đ/kg thanh toán bằng tiền gửi không kỳ hạn.","answer":"<p>Giá trị vật liệu = 500 x 10.000 = 5.000.000 (đề không nêu thuế GTGT nên không tách thuế). Vật liệu tăng, tiền gửi không kỳ hạn giảm.<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 5.000.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 5.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q074","num":"Tài khoản – Bài 4 – Nghiệp vụ 4","type":"essay","text":"Định khoản nghiệp vụ 4: Rút tiền gửi ngân hàng về nhập quỹ tiền mặt là: 350.000.000.","answer":"<p>Tài sản này tăng (tiền mặt), tài sản khác giảm (tiền gửi).<\/p><div class=\"je\"><div>Nợ TK 111 &nbsp; 350.000.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 350.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q075","num":"Tài khoản – Bài 4 – Nghiệp vụ 5","type":"essay","text":"Định khoản nghiệp vụ 5: Trả nợ cho người bán M bằng tiền gửi ngân hàng số tiền: 500.000.000.","answer":"<p>Nợ phải trả người bán giảm, tiền gửi giảm.<\/p><div class=\"je\"><div>Nợ TK 331 (người bán M) &nbsp; 500.000.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 500.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q076","num":"Tài khoản – Bài 4 – Nghiệp vụ 6","type":"essay","text":"Định khoản nghiệp vụ 6: Ứng trước cho người bán K bằng tiền mặt 15.000.000.","answer":"<p>Trả trước cho người bán làm khoản phải thu người bán tăng (tài sản), ghi Nợ TK 331 chi tiết người bán K (TK 331 là tài khoản hỗn hợp); tiền mặt giảm.<\/p><div class=\"je\"><div>Nợ TK 331 (người bán K) &nbsp; 15.000.000<\/div><div class=\"cr\">Có TK 111 &nbsp; 15.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q077","num":"Tài khoản – Bài 4 – Nghiệp vụ 7","type":"essay","text":"Định khoản nghiệp vụ 7: Trả lương kỳ 1 cho người lao động bằng tiền mặt 650.000.000.","answer":"<p>Thanh toán khoản phải trả người lao động (giả định đã ghi nhận nợ lương trước đó): TK 334 giảm, tiền mặt giảm.<\/p><div class=\"je\"><div>Nợ TK 334 &nbsp; 650.000.000<\/div><div class=\"cr\">Có TK 111 &nbsp; 650.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q078","num":"Tài khoản – Bài 4 – Nghiệp vụ 8","type":"essay","text":"Định khoản nghiệp vụ 8: Trích lợi nhuận sau thuế bổ sung quỹ đầu tư phát triển: 500.000.000.","answer":"<p>Cả hai tài khoản đều thuộc vốn chủ sở hữu: lợi nhuận sau thuế chưa phân phối giảm, quỹ đầu tư phát triển tăng.<\/p><div class=\"je\"><div>Nợ TK 421 &nbsp; 500.000.000<\/div><div class=\"cr\">Có TK 414 &nbsp; 500.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q079","num":"Tài khoản – Bài 4 – Nghiệp vụ 9","type":"essay","text":"Định khoản nghiệp vụ 9: Nhận ký quỹ ngắn hạn bằng tiền mặt trị giá: 30.000.000.","answer":"<p>Tiền mặt tăng, đồng thời phát sinh khoản nợ phải trả nhận ký quỹ, ký cược ngắn hạn.<\/p><div class=\"je\"><div>Nợ TK 111 &nbsp; 30.000.000<\/div><div class=\"cr\">Có TK 344 &nbsp; 30.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q080","num":"Tài khoản – Bài 4 – Nghiệp vụ 10","type":"essay","text":"Định khoản nghiệp vụ 10: Vay ngắn hạn trả nợ cho người bán H số tiền: 300.000.000.","answer":"<p>Khoản nợ người bán giảm, khoản vay ngắn hạn tăng (một nợ phải trả chuyển thành nợ phải trả khác; ngân hàng trả thẳng cho người bán).<\/p><div class=\"je\"><div>Nợ TK 331 (người bán H) &nbsp; 300.000.000<\/div><div class=\"cr\">Có TK 341 &nbsp; 300.000.000<\/div><\/div>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u066","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q081","num":"Ghi sổ – Câu 1","type":"mcq","text":"Căn cứ chủ yếu để kế toán thực hiện việc ghi sổ kế toán là:","options":[{"id":"lms-ch3-q081-A","text":"Hợp đồng kinh tế đã ký"},{"id":"lms-ch3-q081-B","text":"Chứng từ kế toán đã được kiểm tra và đáp ứng yêu cầu theo quy định"},{"id":"lms-ch3-q081-C","text":"Kế hoạch sản xuất kinh doanh"},{"id":"lms-ch3-q081-D","text":"Yêu cầu bằng lời của người quản lý"}],"correctOptionId":"lms-ch3-q081-B","explanation":"Căn cứ ghi sổ kế toán là các chứng từ kế toán đã được kiểm tra, hoàn chỉnh. Hợp đồng, kế hoạch, yêu cầu bằng lời chưa chứng minh nghiệp vụ đã hoàn thành.","source":"Slide Chương 3, slide 6, 24–29, 75","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u067","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q082","num":"Ghi sổ – Câu 2","type":"mcq","text":"Khi ghi sổ kế toán, thông tin về nghiệp vụ kinh tế, tài chính phải:","options":[{"id":"lms-ch3-q082-A","text":"Được ghi đầy đủ, kịp thời, rõ ràng và chính xác"},{"id":"lms-ch3-q082-B","text":"Chỉ cần ghi vào cuối tháng"},{"id":"lms-ch3-q082-C","text":"Chỉ ghi những nghiệp vụ liên quan đến tiền"},{"id":"lms-ch3-q082-D","text":"Có thể ghi theo số liệu ước tính nếu chưa có chứng từ"}],"correctOptionId":"lms-ch3-q082-A","explanation":"Sổ kế toán ghi chép, hệ thống hóa toàn bộ nghiệp vụ đã phát sinh trên cơ sở chứng từ; yêu cầu đầy đủ, kịp thời, rõ ràng, chính xác. Không ghi ước tính khi chưa có chứng từ, không chỉ ghi nghiệp vụ liên quan tiền.","source":"Slide Chương 3, slide 6, 75–76, 92","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u068","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q083","num":"Ghi sổ – Câu 3","type":"mcq","text":"Khi phát hiện sai sót trong quá trình ghi sổ kế toán, kế toán:","options":[{"id":"lms-ch3-q083-A","text":"Có thể tẩy xóa trực tiếp số liệu sai"},{"id":"lms-ch3-q083-B","text":"Xóa bỏ trang sổ và ghi lại trang mới"},{"id":"lms-ch3-q083-C","text":"Phải sửa chữa theo phương pháp phù hợp và bảo đảm có thể kiểm soát được nội dung sửa chữa"},{"id":"lms-ch3-q083-D","text":"Có thể bỏ qua nếu số tiền sai không lớn"}],"correctOptionId":"lms-ch3-q083-C","explanation":"Không được tẩy xóa làm mất dấu vết thông tin, số liệu sai mà phải sửa theo một trong ba phương pháp: cải chính, ghi số âm, ghi điều chỉnh (kèm chữ ký kế toán trưởng).","source":"Slide Chương 3, slide 89–90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u069","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q084","num":"Ghi sổ – Câu 4","type":"mcq","text":"Trong trường hợp ghi sổ kế toán thủ công, kế toán ghi sai số tiền nhưng phát hiện ngay khi chưa cộng sổ. Nếu áp dụng phương pháp cải chính, cách xử lý phù hợp là:","options":[{"id":"lms-ch3-q084-A","text":"Tẩy số tiền sai và viết số đúng vào vị trí cũ"},{"id":"lms-ch3-q084-B","text":"Gạch một đường trên số liệu sai để vẫn nhận biết được nội dung cũ, sau đó ghi số đúng và thực hiện thủ tục sửa chữa theo quy định"},{"id":"lms-ch3-q084-C","text":"Xé bỏ trang sổ có sai sót"},{"id":"lms-ch3-q084-D","text":"Ghi thêm một nghiệp vụ mới vào cuối tháng"}],"correctOptionId":"lms-ch3-q084-B","explanation":"Cải chính: gạch một đường thẳng vào chỗ sai, ghi số hoặc chữ đúng ở phía trên và có chữ ký của kế toán trưởng bên cạnh. Tẩy xóa, xé trang đều làm mất dấu vết.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u070","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q085","num":"Ghi sổ – Câu 5","type":"mcq","text":"Phương pháp ghi số âm thường được sử dụng khi:","options":[{"id":"lms-ch3-q085-A","text":"Cần điều chỉnh giảm hoặc xóa bút toán đã ghi sai theo phương pháp sửa sổ phù hợp"},{"id":"lms-ch3-q085-B","text":"Chứng từ chưa được người lập ký"},{"id":"lms-ch3-q085-C","text":"Doanh nghiệp chưa xác định được số tiền"},{"id":"lms-ch3-q085-D","text":"Chưa mở sổ kế toán chi tiết"}],"correctOptionId":"lms-ch3-q085-A","explanation":"Ghi số âm (ghi lại số sai bằng mực đỏ hoặc trong ngoặc đơn, rồi ghi lại số đúng) dùng để xóa bút toán sai (sai quan hệ đối ứng, sai số tiền lớn hơn, ghi trùng). Các tình huống B, C, D không liên quan tới sửa sổ.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u071","context":"<p>Doanh nghiệp mua nguyên vật liệu nhập kho trị giá 35 triệu đồng, thanh toán bằng tiền mặt. Chứng từ ghi đúng 35 triệu đồng nhưng kế toán lại ghi sổ:<\/p><div class=\"je\"><div>Nợ TK 152: 53 triệu đồng<\/div><div class=\"cr\">Có TK 111: 53 triệu đồng<\/div><\/div>","section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q086","num":"Ghi sổ – Câu 6","type":"mcq","text":"Sai sót trên thuộc trường hợp:","options":[{"id":"lms-ch3-q086-A","text":"Ghi sai quan hệ đối ứng tài khoản"},{"id":"lms-ch3-q086-B","text":"Ghi sai số tiền lớn hơn số tiền đúng"},{"id":"lms-ch3-q086-C","text":"Bỏ sót nghiệp vụ"},{"id":"lms-ch3-q086-D","text":"Ghi trùng nghiệp vụ"}],"correctOptionId":"lms-ch3-q086-B","explanation":"Quan hệ đối ứng (Nợ 152/Có 111) vẫn đúng, nhưng số tiền ghi sổ 53 lớn hơn số tiền đúng 35 (chênh 18). Không phải bỏ sót hay ghi trùng nghiệp vụ.","source":"Slide Chương 3, slide 90, 96","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q087","num":"Ghi sổ – Câu 7","type":"mcq","text":"Với tình huống ở Câu 6, nếu áp dụng phương pháp ghi số âm, kế toán có thể:","options":[{"id":"lms-ch3-q087-A","text":"Ghi âm bút toán sai 53 triệu đồng, sau đó ghi lại bút toán đúng 35 triệu đồng"},{"id":"lms-ch3-q087-B","text":"Ghi thêm 18 triệu đồng vào TK 152 và TK 111"},{"id":"lms-ch3-q087-C","text":"Ghi thêm 35 triệu đồng lần thứ hai"},{"id":"lms-ch3-q087-D","text":"Không cần điều chỉnh vì tài khoản đối ứng đã đúng"}],"correctOptionId":"lms-ch3-q087-A","explanation":"Ghi số âm: ghi lại số sai bằng mực đỏ/trong ngoặc đơn (Nợ 152/Có 111: (53)), rồi ghi lại số đúng (Nợ 152/Có 111: 35). B không phải ghi âm (ghi thêm số dương sẽ làm sai thêm); C làm sai càng nhiều; D vẫn sai số tiền.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u072","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q088","num":"Ghi sổ – Câu 8","type":"mcq","text":"Doanh nghiệp mua công cụ dụng cụ nhập kho 40 triệu đồng, chưa thanh toán. Kế toán đã ghi:<br>Nợ TK 153: 40 triệu đồng<br>Có TK 111: 40 triệu đồng.<br>Trong khi bút toán đúng phải là:<br>Nợ TK 153: 40 triệu đồng<br>Có TK 331: 40 triệu đồng.<br>Sai sót chủ yếu là:","options":[{"id":"lms-ch3-q088-A","text":"Ghi sai số tiền"},{"id":"lms-ch3-q088-B","text":"Ghi sai tài khoản đối ứng"},{"id":"lms-ch3-q088-C","text":"Ghi thiếu số tiền"},{"id":"lms-ch3-q088-D","text":"Ghi trùng nghiệp vụ"}],"correctOptionId":"lms-ch3-q088-B","explanation":"Số tiền đúng (40 triệu) nhưng tài khoản đối ứng sai (Có 111 thay vì Có 331). Đây là sai quan hệ đối ứng tài khoản; Bảng cân đối tài khoản không phát hiện được lỗi này vì Nợ vẫn bằng Có.","source":"Slide Chương 3, slide 90, 96","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u073","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q089","num":"Ghi sổ – Câu 9","type":"mcq","text":"Trường hợp số tiền trên chứng từ là 90 triệu đồng, kế toán đã ghi đúng quan hệ đối ứng nhưng chỉ ghi 60 triệu đồng. Nếu sử dụng phương pháp ghi bổ sung, số tiền cần ghi thêm là:","options":[{"id":"lms-ch3-q089-A","text":"30 triệu đồng"},{"id":"lms-ch3-q089-B","text":"60 triệu đồng"},{"id":"lms-ch3-q089-C","text":"90 triệu đồng"},{"id":"lms-ch3-q089-D","text":"150 triệu đồng"}],"correctOptionId":"lms-ch3-q089-A","explanation":"Ghi bổ sung (ghi điều chỉnh): ghi thêm số chênh lệch cho đúng = 90 – 60 = 30 triệu đồng.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u074","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q090","num":"Ghi sổ – Câu 10","type":"mcq","text":"Phương pháp ghi bổ sung phù hợp nhất khi:","options":[{"id":"lms-ch3-q090-A","text":"Định khoản sai hoàn toàn tài khoản"},{"id":"lms-ch3-q090-B","text":"Nghiệp vụ đã ghi đúng quan hệ đối ứng nhưng số tiền ghi sổ nhỏ hơn số tiền đúng"},{"id":"lms-ch3-q090-C","text":"Số tiền ghi sổ lớn hơn số tiền đúng"},{"id":"lms-ch3-q090-D","text":"Nghiệp vụ đã bị ghi hai lần"}],"correctOptionId":"lms-ch3-q090-B","explanation":"Ghi bổ sung (ghi điều chỉnh bằng chứng từ điều chỉnh) thêm số chênh lệch, nên phù hợp khi đúng quan hệ đối ứng nhưng số tiền ghi nhỏ hơn đúng. Các trường hợp A, C, D cần ghi số âm hoặc điều chỉnh giảm.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u075","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q091","num":"Ghi sổ – Câu 11","type":"mcq","text":"Doanh nghiệp thanh toán nợ cho nhà cung cấp bằng chuyển khoản 70 triệu đồng. Bút toán đúng:<br>Nợ TK 331: 70 triệu đồng<br>Có TK 112: 70 triệu đồng.<br>Kế toán đã ghi đúng tài khoản nhưng chỉ ghi 50 triệu đồng. Bút toán bổ sung phù hợp là:","options":[{"id":"lms-ch3-q091-A","text":"Nợ TK 331: 20/Có TK 112: 20"},{"id":"lms-ch3-q091-B","text":"Nợ TK 112: 20/Có TK 331: 20"},{"id":"lms-ch3-q091-C","text":"Nợ TK 331: 50/Có TK 112: 50"},{"id":"lms-ch3-q091-D","text":"Nợ TK 331: 70/Có TK 112: 70"}],"correctOptionId":"lms-ch3-q091-A","explanation":"Chênh lệch = 70 – 50 = 20, ghi thêm cùng chiều với bút toán đúng: Nợ TK 331: 20 / Có TK 112: 20. B ghi ngược chiều; C lặp lại bút toán đã ghi; D ghi trùng toàn bộ.","source":"Slide Chương 3, slide 90","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u076","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q092","num":"Ghi sổ – Câu 12","type":"mcq","text":"Doanh nghiệp mua hàng hóa chưa thanh toán trị giá 120 triệu đồng. Do nhầm lẫn, kế toán ghi cùng một nghiệp vụ hai lần:<br>Nợ TK 156: 120 triệu đồng<br>Có TK 331: 120 triệu đồng.<br>Nếu sử dụng phương pháp ghi số âm để sửa nghiệp vụ ghi trùng, kế toán cần:","options":[{"id":"lms-ch3-q092-A","text":"Ghi thêm Nợ TK 156/Có TK 331: 120 triệu đồng"},{"id":"lms-ch3-q092-B","text":"Ghi âm một lần Nợ TK 156/Có TK 331: 120 triệu đồng"},{"id":"lms-ch3-q092-C","text":"Ghi Nợ TK 331/Có TK 156: 240 triệu đồng"},{"id":"lms-ch3-q092-D","text":"Không cần điều chỉnh"}],"correctOptionId":"lms-ch3-q092-B","explanation":"Ghi trùng thì chỉ cần ghi âm (xóa) một lần bút toán trùng: (Nợ TK 156/Có TK 331: 120), để còn lại đúng một bút toán. A làm sai thêm; C ghi ngược chiều 240 làm hàng và nợ về âm; D để nguyên sai.","source":"Slide Chương 3, slide 90, 96","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u077","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q093","num":"Ghi sổ – Câu 13","type":"mcq","text":"Doanh nghiệp rút 30 triệu đồng tiền gửi ngân hàng về nhập quỹ tiền mặt. Bút toán đúng là:<br>Nợ TK 111: 30 triệu đồng<br>Có TK 112: 30 triệu đồng.<br>Kế toán lại ghi:<br>Nợ TK 112: 30 triệu đồng<br>Có TK 111: 30 triệu đồng.<br>Để sửa sai theo phương pháp ghi số âm, cách xử lý phù hợp là:","options":[{"id":"lms-ch3-q093-A","text":"Ghi âm bút toán sai, sau đó ghi lại bút toán đúng"},{"id":"lms-ch3-q093-B","text":"Chỉ ghi thêm Nợ TK 111: 30 triệu đồng"},{"id":"lms-ch3-q093-C","text":"Chỉ ghi thêm Có TK 112: 30 triệu đồng"},{"id":"lms-ch3-q093-D","text":"Giữ nguyên vì tổng Nợ vẫn bằng tổng Có"}],"correctOptionId":"lms-ch3-q093-A","explanation":"Sai quan hệ đối ứng (ghi ngược chiều) phải xóa bút toán sai bằng ghi số âm rồi ghi lại bút toán đúng. B, C chỉ sửa một vế nên làm mất cân đối Nợ/Có; D để nguyên sai dù tổng Nợ bằng tổng Có.","source":"Slide Chương 3, slide 90, 96","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u078","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q094","num":"Ghi sổ – Câu 14","type":"mcq","text":"Khi sửa sai trên sổ kế toán bằng phương tiện điện tử, yêu cầu quan trọng là:","options":[{"id":"lms-ch3-q094-A","text":"Xóa hoàn toàn dữ liệu cũ để không còn dấu vết"},{"id":"lms-ch3-q094-B","text":"Sửa trực tiếp số liệu đã khóa sổ mà không cần lưu thông tin điều chỉnh"},{"id":"lms-ch3-q094-C","text":"Thực hiện theo phương thức phù hợp của hệ thống nhưng phải bảo đảm khả năng kiểm soát, truy vết thông tin điều chỉnh theo quy định"},{"id":"lms-ch3-q094-D","text":"In sổ ra giấy rồi dùng bút sửa"}],"correctOptionId":"lms-ch3-q094-C","explanation":"Sửa sổ điện tử vẫn không được làm mất dấu vết: phải ghi điều chỉnh bằng chứng từ điều chỉnh (ghi thêm số chênh lệch) và có thể kiểm soát, truy vết thông tin điều chỉnh.","source":"Slide Chương 3, slide 89–91","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u079","context":null,"section":"Ghi sổ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q095","num":"Ghi sổ – Câu 15","type":"mcq","text":"Doanh nghiệp mua TSCĐ trị giá 200 triệu đồng, chưa thanh toán cho người bán. Kế toán bỏ sót hoàn toàn nghiệp vụ và phát hiện trước khi lập báo cáo cuối kỳ. Cách xử lý phù hợp nhất là:","options":[{"id":"lms-ch3-q095-A","text":"Không ghi vì nghiệp vụ thuộc kỳ trước"},{"id":"lms-ch3-q095-B","text":"Ghi bổ sung nghiệp vụ vào sổ kế toán với bút toán đúng và căn cứ chứng từ hợp lệ"},{"id":"lms-ch3-q095-C","text":"Chỉ ghi tăng TSCĐ 200 triệu đồng"},{"id":"lms-ch3-q095-D","text":"Chỉ ghi tăng khoản phải trả người bán 200 triệu đồng"}],"correctOptionId":"lms-ch3-q095-B","explanation":"Bỏ sót nghiệp vụ thì ghi bổ sung đầy đủ bút toán (Nợ TK 211/Có TK 331: 200 triệu, chưa tính thuế vì đề không nêu) dựa trên chứng từ hợp lệ. C, D chỉ ghi một vế làm mất cân đối ghi sổ kép; Bảng cân đối tài khoản không phát hiện được lỗi bỏ sót này.","source":"Slide Chương 3, slide 64, 90, 96","status":"ok","answerBasis":"self"}]}]},{"key":"ch4","title":"Chương 4 – Tính giá","units":[{"id":"lms-ch4-u001","context":null,"questions":[{"id":"lms-ch4-q001","num":"Câu 1","type":"mcq","text":"Giá gốc của tài sản được xác định dựa trên:","options":[{"id":"lms-ch4-q001-A","text":"Giá thị trường của tài sản tại thời điểm lập BCTC"},{"id":"lms-ch4-q001-B","text":"Chi phí thực tế đã chi hoặc sẽ phải chi để có tài sản ở trạng thái sẵn sàng sử dụng"},{"id":"lms-ch4-q001-C","text":"Giá bán ước tính của tài sản"},{"id":"lms-ch4-q001-D","text":"Giá trị hợp lý của tài sản tại cuối kỳ"}],"correctOptionId":"lms-ch4-q001-B","explanation":"<p>Giá gốc gồm chi phí mua, bốc xếp, vận chuyển, lắp ráp, chế biến và các chi phí liên quan trực tiếp đến khi tài sản sẵn sàng sử dụng, tính theo số tiền đã trả hoặc phải trả. Các phương án A, C, D là giá thị trường / giá bán / giá trị hợp lý, không phải giá gốc.<\/p>","source":"Slide Chương 4, slide 11 (Giá gốc – Luật Kế toán 2015, VAS 01)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u002","context":null,"questions":[{"id":"lms-ch4-q002","num":"Câu 2","type":"mcq","text":"Đặc điểm nào sau đây đúng về giá gốc?","options":[{"id":"lms-ch4-q002-A","text":"Luôn thay đổi theo giá thị trường"},{"id":"lms-ch4-q002-B","text":"Chỉ được xác định vào cuối kỳ kế toán"},{"id":"lms-ch4-q002-C","text":"Thường không thay đổi trên sổ kế toán khi giá thị trường biến động"},{"id":"lms-ch4-q002-D","text":"Chỉ được sử dụng đối với tài sản ngắn hạn"}],"correctOptionId":"lms-ch4-q002-C","explanation":"<p>VAS 01: giá gốc của tài sản không được thay đổi trừ khi chuẩn mực cụ thể có quy định khác. Giá gốc được ghi nhận ngay lúc ban đầu (không phải cuối kỳ) và áp dụng cho cả tài sản dài hạn lẫn ngắn hạn.<\/p>","source":"Slide Chương 4, slide 11 (Giá gốc – Luật Kế toán 2015, VAS 01)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u003","context":null,"questions":[{"id":"lms-ch4-q003","num":"Câu 3","type":"mcq","text":"Ưu điểm nổi bật của giá gốc là:","options":[{"id":"lms-ch4-q003-A","text":"Phản ánh chính xác giá trị tài sản theo giá thị trường"},{"id":"lms-ch4-q003-B","text":"Có tính đáng tin cậy cao vì dựa trên chi phí thực tế và chứng từ kế toán"},{"id":"lms-ch4-q003-C","text":"Luôn phản ánh giá trị hiện tại của tài sản"},{"id":"lms-ch4-q003-D","text":"Không cần căn cứ vào chứng từ kế toán"}],"correctOptionId":"lms-ch4-q003-B","explanation":"<p>Giá gốc dựa trên chi phí thực tế phát sinh và có chứng từ chứng minh nên khách quan, đáng tin cậy (nhược điểm là không phản ánh giá thị trường hiện tại). Các phương án A, C, D sai.<\/p>","source":"Slide Chương 4, slide 11 (Giá gốc – Luật Kế toán 2015, VAS 01); slide 8 (đặc điểm đáng tin cậy)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u004","context":null,"questions":[{"id":"lms-ch4-q004","num":"Câu 4","type":"mcq","text":"Khi doanh nghiệp là bên mua, giá thị trường của tài sản được hiểu là:","options":[{"id":"lms-ch4-q004-A","text":"Giá bán"},{"id":"lms-ch4-q004-B","text":"Giá trị còn lại"},{"id":"lms-ch4-q004-C","text":"Giá thay thế"},{"id":"lms-ch4-q004-D","text":"Giá hạch toán"}],"correctOptionId":"lms-ch4-q004-C","explanation":"<p>Đứng ở góc độ bên mua, giá thị trường là giá phải trả để mua sắm lại tài sản tương tự hiện tại, tức giá thay thế. Giá bán là góc độ của bên bán; giá trị còn lại và giá hạch toán không phải giá thị trường.<\/p>","source":"Kiến thức bổ sung về các loại giá (slide 10 liệt kê nhóm giá; text slide không nêu giá thay thế)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u005","context":null,"questions":[{"id":"lms-ch4-q005","num":"Câu 5","type":"mcq","text":"Khi doanh nghiệp là bên bán, giá thị trường của hàng hóa được hiểu là:","options":[{"id":"lms-ch4-q005-A","text":"Giá thay thế"},{"id":"lms-ch4-q005-B","text":"Giá bán"},{"id":"lms-ch4-q005-C","text":"Giá gốc"},{"id":"lms-ch4-q005-D","text":"Giá hạch toán"}],"correctOptionId":"lms-ch4-q005-B","explanation":"<p>Bên bán nhìn giá thị trường là mức giá có thể bán hàng ra thị trường (giá bán). Giá thay thế là góc độ bên mua; giá gốc và giá hạch toán không phải giá thị trường.<\/p>","source":"Kiến thức bổ sung về các loại giá (đối ứng Câu 4)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u006","context":null,"questions":[{"id":"lms-ch4-q006","num":"Câu 6","type":"mcq","text":"Giá hạch toán có đặc điểm nào sau đây?","options":[{"id":"lms-ch4-q006-A","text":"Là giá được sử dụng để trình bày tài sản trên BCTC"},{"id":"lms-ch4-q006-B","text":"Là giá do Nhà nước quy định thống nhất cho mọi doanh nghiệp"},{"id":"lms-ch4-q006-C","text":"Là giá tương đối ổn định do đơn vị xây dựng và sử dụng tạm thời trong kỳ"},{"id":"lms-ch4-q006-D","text":"Luôn bằng giá gốc của tài sản"}],"correctOptionId":"lms-ch4-q006-C","explanation":"<p>Giá hạch toán do doanh nghiệp tự xây dựng, tương đối ổn định, dùng để ghi sổ tạm thời trong kỳ cho thuận tiện; cuối kỳ phải điều chỉnh về giá gốc để lập BCTC. Do đó A, B, D sai.<\/p>","source":"Kiến thức bổ sung (giá hạch toán; slide Chương 4 không có nội dung này)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u007","context":null,"questions":[{"id":"lms-ch4-q007","num":"Câu 7","type":"mcq","text":"Cuối kỳ kế toán, khi xác định được giá gốc thực tế, kế toán phải:","options":[{"id":"lms-ch4-q007-A","text":"Giữ nguyên giá hạch toán đã ghi sổ"},{"id":"lms-ch4-q007-B","text":"Điều chỉnh giá hạch toán về giá gốc"},{"id":"lms-ch4-q007-C","text":"Điều chỉnh giá gốc về giá hạch toán"},{"id":"lms-ch4-q007-D","text":"Xóa toàn bộ giá trị đã ghi nhận trong kỳ"}],"correctOptionId":"lms-ch4-q007-B","explanation":"<p>BCTC phải trình bày theo giá gốc nên cuối kỳ phải điều chỉnh giá hạch toán về giá gốc (qua hệ số chênh lệch giá). Không được giữ nguyên giá hạch toán hay làm ngược lại.<\/p>","source":"Kiến thức bổ sung (giá hạch toán); slide 11 (tài sản trình bày theo giá gốc)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u008","context":null,"questions":[{"id":"lms-ch4-q008","num":"Câu 8","type":"mcq","text":"Giá trị thuần có thể thực hiện được xác định bằng:","options":[{"id":"lms-ch4-q008-A","text":"Giá bán ước tính + chi phí ước tính để hoàn thành và tiêu thụ"},{"id":"lms-ch4-q008-B","text":"Giá gốc - chi phí bán hàng"},{"id":"lms-ch4-q008-C","text":"Giá bán ước tính − chi phí ước tính để hoàn thành và tiêu thụ"},{"id":"lms-ch4-q008-D","text":"Giá thị trường − giá hạch toán"}],"correctOptionId":"lms-ch4-q008-C","explanation":"<p>VAS 02: giá trị thuần có thể thực hiện được = giá bán ước tính trong kỳ SXKD bình thường trừ chi phí ước tính để hoàn thành sản phẩm và chi phí ước tính cần thiết cho việc tiêu thụ. Là cơ sở lập dự phòng giảm giá hàng tồn kho.<\/p>","source":"Slide Chương 4, slide 13 (VAS 02)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u009","context":null,"questions":[{"id":"lms-ch4-q009","num":"Câu 9","type":"mcq","text":"Giá trị hợp lý là giá trị:","options":[{"id":"lms-ch4-q009-A","text":"Được xác định hoàn toàn theo giá gốc"},{"id":"lms-ch4-q009-B","text":"Có thể trao đổi hoặc thanh toán một cách tự nguyện giữa các bên có đầy đủ hiểu biết trong trao đổi ngang giá"},{"id":"lms-ch4-q009-C","text":"Do doanh nghiệp tự quy định và sử dụng nội bộ"},{"id":"lms-ch4-q009-D","text":"Chỉ được xác định khi doanh nghiệp giải thể"}],"correctOptionId":"lms-ch4-q009-B","explanation":"<p>Giá trị hợp lý là giá trị tài sản có thể được trao đổi giữa các bên có đầy đủ hiểu biết trong sự trao đổi ngang giá (VAS 03), phù hợp giá thị trường (Luật Kế toán 2015). C là mô tả giá hạch toán.<\/p>","source":"Slide Chương 4, slide 12","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u010","context":null,"questions":[{"id":"lms-ch4-q010","num":"Câu 10","type":"mcq","text":"Theo nguyên tắc sử dụng giá trị hợp lý, sau ghi nhận ban đầu, một số tài sản hoặc nợ phải trả có giá trị biến động thường xuyên theo thị trường và có thể xác định đáng tin cậy sẽ được:","options":[{"id":"lms-ch4-q010-A","text":"Giữ nguyên theo giá gốc trong mọi trường hợp"},{"id":"lms-ch4-q010-B","text":"Ghi nhận theo giá hạch toán"},{"id":"lms-ch4-q010-C","text":"Ghi nhận theo giá trị hợp lý tại thời điểm cuối kỳ lập BCTC"},{"id":"lms-ch4-q010-D","text":"Ghi nhận theo giá nhập kho ban đầu"}],"correctOptionId":"lms-ch4-q010-C","explanation":"<p>Luật Kế toán 2015: ban đầu ghi theo giá gốc; sau đó, tài sản/nợ phải trả biến động thường xuyên theo thị trường và xác định lại được đáng tin cậy thì ghi theo giá trị hợp lý tại thời điểm cuối kỳ lập BCTC.<\/p>","source":"Slide Chương 4, slide 12","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u011","context":"<p>Tại công ty BHIC tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT của hàng hóa, dịch vụ 10% đã chuyển khoản mua một số NVL chính, giá mua 165.000.000 đồng (đã có thuế GTGT). Các chi phí vận chuyển theo giá thanh toán 880.000 đồng.<\/p>","questions":[{"id":"lms-ch4-q011","num":"Câu 11.1","type":"mcq","text":"Giá gốc của lô hàng là:","options":[{"id":"lms-ch4-q011-A","text":"165.880.000 đồng"},{"id":"lms-ch4-q011-B","text":"1.045.000.000 đồng"},{"id":"lms-ch4-q011-C","text":"150.880.000 đồng"},{"id":"lms-ch4-q011-D","text":"150.800.000 đồng"}],"correctOptionId":"lms-ch4-q011-D","explanation":"<p>Công ty tính thuế GTGT khấu trừ nên thuế GTGT đầu vào được khấu trừ, không tính vào giá gốc.<\/p><p>Giá mua chưa thuế = 165.000.000 / 1,1 = 150.000.000. Chi phí vận chuyển chưa thuế = 880.000 / 1,1 = 800.000 (đề nói \"giá thanh toán\", hiểu là đã gồm GTGT 10%).<\/p><p>Giá gốc = 150.000.000 + 800.000 = <b>150.800.000 đồng<\/b>.<\/p><p>A cộng cả thuế; B sai số; C = 150.000.000 + 880.000 (không tách thuế chi phí vận chuyển).<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho)","status":"needs_review","answerBasis":"self","reviewNote":"Đề ghi 'giá thanh toán' 880.000; đáp án 150.800.000 chỉ hợp lý khi hiểu 880.000 đã gồm GTGT 10%."},{"id":"lms-ch4-q012","num":"Câu 11.2","type":"mcq","text":"Trong trường hợp giá cả đang trên đà giảm xuống thì phương pháp nào sau đây sẽ cho giá trị hàng tồn kho cao nhất:","options":[{"id":"lms-ch4-q012-A","text":"FIFO"},{"id":"lms-ch4-q012-B","text":"Bình quân liên hoàn"},{"id":"lms-ch4-q012-C","text":"Bình quân cuối kỳ"},{"id":"lms-ch4-q012-D","text":"a, b, c đều đúng","pinned":true}],"correctOptionId":"lms-ch4-q012-C","explanation":"<p>Khi giá giảm: FIFO xuất hàng giá cũ (cao) trước nên tồn kho cuối kỳ là hàng nhập mới giá thấp nhất, cho giá trị tồn kho THẤP nhất (giá vốn cao nhất). Hai phương pháp bình quân nằm giữa. Bình quân cuối kỳ dùng đơn giá bình quân của cả kỳ (gồm cả giá cao đầu kỳ) để định giá tồn cuối kỳ nên thường cao hơn bình quân liên hoàn (đơn giá cập nhật dần về giá thấp mới). Vậy đáp án dự kiến: bình quân cuối kỳ.<\/p>","source":"Slide Chương 4, slides 37–39 (các phương pháp tính giá xuất kho)","status":"needs_review","answerBasis":"self","reviewNote":"Đề không có đáp án; kết quả giữa hai phương pháp bình quân phụ thuộc thứ tự nhập–xuất cụ thể (nếu nhập hết trước khi xuất thì bằng nhau). Chọn C theo xu hướng chung; cần đối chiếu với đáp án giảng viên."},{"id":"lms-ch4-q013","num":"Câu 11.3","type":"mcq","text":"Khi doanh nghiệp kê khai thuế GTGT theo phương pháp khấu trừ, giá gốc của lô hàng nhập khẩu sẽ được tính bằng:","options":[{"id":"lms-ch4-q013-A","text":"Giá nhập khẩu"},{"id":"lms-ch4-q013-B","text":"Giá nhập khẩu + thuế nhập khẩu"},{"id":"lms-ch4-q013-C","text":"Giá nhập khẩu + thuế nhập khẩu + thuế GTGT hàng nhập khẩu"},{"id":"lms-ch4-q013-D","text":"a, b, c đều sai","pinned":true}],"correctOptionId":"lms-ch4-q013-B","explanation":"<p>Giá thực tế nhập kho = giá mua − chiết khấu/giảm giá + các khoản thuế KHÔNG được hoàn lại + chi phí khác. Thuế nhập khẩu (và TTĐB nếu có) không được hoàn lại nên tính vào giá gốc; thuế GTGT hàng nhập khẩu được khấu trừ nên không tính. Giá gốc = giá nhập khẩu + thuế nhập khẩu (+ TTĐB + chi phí liên quan).<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q014","num":"Câu 11.4","type":"mcq","text":"Khi doanh nghiệp kê khai thuế GTGT theo phương pháp trực tiếp, giá gốc của lô hàng nhập khẩu sẽ được tính bằng:","options":[{"id":"lms-ch4-q014-A","text":"Giá nhập khẩu"},{"id":"lms-ch4-q014-B","text":"Giá nhập khẩu + thuế nhập khẩu"},{"id":"lms-ch4-q014-C","text":"Giá nhập khẩu + thuế nhập khẩu + thuế GTGT hàng nhập khẩu"},{"id":"lms-ch4-q014-D","text":"a, b, c đều sai","pinned":true}],"correctOptionId":"lms-ch4-q014-C","explanation":"<p>Theo phương pháp trực tiếp, thuế GTGT đầu vào không được khấu trừ nên là khoản thuế không được hoàn lại, tính vào giá gốc: giá nhập khẩu + thuế nhập khẩu + thuế GTGT hàng nhập khẩu (+ TTĐB, chi phí khác nếu có).<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q015","num":"Câu 11.5","type":"mcq","text":"Khấu hao lũy kế của TSCĐ hữu hình chính là:","options":[{"id":"lms-ch4-q015-A","text":"Giá trị thị trường của TSCĐ hữu hình"},{"id":"lms-ch4-q015-B","text":"Giá trị còn lại của TSCĐ hữu hình"},{"id":"lms-ch4-q015-C","text":"Giá trị của TSCĐ hữu hình đã được phân bổ vào trong giá phí sản xuất kinh doanh"},{"id":"lms-ch4-q015-D","text":"b, c đều đúng","pinned":true}],"correctOptionId":"lms-ch4-q015-C","explanation":"<p>Khấu hao lũy kế là tổng số khấu hao đã trích vào chi phí SXKD qua các kỳ đến thời điểm báo cáo. Giá trị còn lại = nguyên giá − khấu hao lũy kế nên B sai, do đó D sai.<\/p>","source":"Slide Chương 4, slides 23, 25","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q016","num":"Câu 11.6","type":"mcq","text":"Khi doanh nghiệp sử dụng phương pháp kê khai thường xuyên, công tác tính giá xuất kho vật tư, hàng hóa được thực hiện:","options":[{"id":"lms-ch4-q016-A","text":"Ngay thời điểm xuất kho vật tư, hàng hóa"},{"id":"lms-ch4-q016-B","text":"Chỉ thực hiện vào cuối kỳ kế toán"},{"id":"lms-ch4-q016-C","text":"a, b đều đúng","pinned":true},{"id":"lms-ch4-q016-D","text":"a, c, b đều sai","pinned":true}],"correctOptionId":"lms-ch4-q016-A","explanation":"<p>Kê khai thường xuyên theo dõi liên tục nhập – xuất – tồn trên sổ nên giá xuất kho được xác định ngay khi xuất (riêng bình quân cuối kỳ thì tính cuối kỳ, nhưng đáp án tổng quát của đề là a).<\/p>","source":"Slide Chương 4, slide 35","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q017","num":"Câu 11.7","type":"mcq","text":"Khi doanh nghiệp sử dụng phương pháp kiểm kê định kỳ, công tác tính giá xuất kho vật tư, hàng hóa được thực hiện:","options":[{"id":"lms-ch4-q017-A","text":"Ngay tại thời điểm xuất kho vật tư, hàng hóa"},{"id":"lms-ch4-q017-B","text":"Chỉ thực hiện vào cuối kỳ kế toán"},{"id":"lms-ch4-q017-C","text":"a, b đều đúng","pinned":true},{"id":"lms-ch4-q017-D","text":"a, b, c đều sai","pinned":true}],"correctOptionId":"lms-ch4-q017-B","explanation":"<p>Kiểm kê định kỳ căn cứ kết quả kiểm kê cuối kỳ để xác định giá trị tồn kho, từ đó suy ra giá trị hàng đã xuất trong kỳ, nên chỉ tính giá xuất vào cuối kỳ.<\/p>","source":"Slide Chương 4, slide 35","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u012","context":"<p>Doanh nghiệp Kim Tín tính thuế giá trị gia tăng theo phương pháp khấu trừ, thuế suất thuế giá trị gia tăng là 10%, kế toán hàng tồn kho theo phương pháp kê khai thường xuyên và tính giá xuất kho theo phương pháp nhập trước xuất trước. (Đơn vị tính: đồng)<\/p><p>Đầu tháng 10/N có số dư như sau:<br>Tài khoản 152 – Nguyên liệu, vật liệu: 32.000.000 (Chi tiết 2.500 kg vật liệu B)<br>Các tài khoản khác có số dư hợp lý.<\/p><p>Trong tháng 10/N, trích một số nghiệp vụ kinh tế phát sinh như sau:<\/p><p>Ngày 6/10: Mua và nhập kho 4.000 kg vật liệu B, giá mua chưa bao gồm thuế giá trị gia tăng 16.000 đồng/kg, thanh toán sau 30 ngày; chi phí vận chuyển vật liệu B về kho là 8.800.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tiền mặt.<\/p><p>Ngày 13/10: Xuất kho 5.000 kg vật liệu B phục vụ sản xuất sản phẩm K.<\/p><p>Ngày 18/10: Mua và nhập kho 6.000 kg vật liệu B, giá mua đã bao gồm thuế giá trị gia tăng 19.800 đồng/kg. Công ty mua hàng với số lượng lớn nên được hưởng chiết khấu thương mại 10%, thời hạn thanh toán sau 30 ngày; chi phí vận chuyển vật liệu B về kho là 4.400.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tạm ứng.<\/p>","questions":[{"id":"lms-ch4-q018","num":"Câu 12.1","type":"mcq","text":"Tổng giá thực tế nhập kho của vật liệu B ngày 06/10 là:","options":[{"id":"lms-ch4-q018-A","text":"52.000.000 đồng"},{"id":"lms-ch4-q018-B","text":"57.200.000 đồng"},{"id":"lms-ch4-q018-C","text":"72.000.000 đồng"},{"id":"lms-ch4-q018-D","text":"79.200.000 đồng"}],"correctOptionId":"lms-ch4-q018-C","explanation":"<p>Giá mua = 4.000 x 16.000 = 64.000.000. Chi phí vận chuyển chưa thuế = 8.800.000 / 1,1 = 8.000.000. Tổng giá nhập kho = 64.000.000 + 8.000.000 = <b>72.000.000 đồng<\/b> (thuế GTGT được khấu trừ, không tính vào giá).<\/p>","source":"Slide Chương 4, slides 36, 39 (giá nhập kho; FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q019","num":"Câu 12.2","type":"mcq","text":"Đơn giá thực tế nhập kho của vật liệu B ngày 06/10 là:","options":[{"id":"lms-ch4-q019-A","text":"15.000 đồng/kg"},{"id":"lms-ch4-q019-B","text":"16.000 đồng/kg"},{"id":"lms-ch4-q019-C","text":"17.000 đồng/kg"},{"id":"lms-ch4-q019-D","text":"18.000 đồng/kg"}],"correctOptionId":"lms-ch4-q019-D","explanation":"<p>Đơn giá = 72.000.000 / 4.000 = <b>18.000 đồng/kg<\/b>.<\/p>","source":"Slide Chương 4, slides 36, 39 (giá nhập kho; FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q020","num":"Câu 12.3","type":"mcq","text":"Tổng giá thực tế xuất kho của vật liệu A ngày 13/10 là:","options":[{"id":"lms-ch4-q020-A","text":"72.000.000 đồng"},{"id":"lms-ch4-q020-B","text":"77.000.000 đồng"},{"id":"lms-ch4-q020-C","text":"80.000.000 đồng"},{"id":"lms-ch4-q020-D","text":"82.000.000 đồng"}],"correctOptionId":"lms-ch4-q020-B","explanation":"<p>(Đề ghi \"vật liệu A\" nhưng theo ngữ cảnh là vật liệu B.) FIFO: tồn đầu 2.500 kg, đơn giá 32.000.000 / 2.500 = 12.800 đồng/kg; xuất 5.000 kg gồm: 2.500 kg x 12.800 = 32.000.000 và 2.500 kg lấy từ lô 06/10 x 18.000 = 45.000.000. Tổng = <b>77.000.000 đồng<\/b>.<\/p>","source":"Slide Chương 4, slides 36, 39 (giá nhập kho; FIFO)","status":"needs_review","answerBasis":"self","reviewNote":"Đề ghi 'vật liệu A' (lỗi đánh máy, là vật liệu B)."},{"id":"lms-ch4-q021","num":"Câu 12.4","type":"mcq","text":"Sau khi xuất kho 5.000 kg vật liệu B ngày 13/10, số lượng vật liệu B còn lại trong kho là:","options":[{"id":"lms-ch4-q021-A","text":"500 kg"},{"id":"lms-ch4-q021-B","text":"1.000 kg"},{"id":"lms-ch4-q021-C","text":"1.500 kg"},{"id":"lms-ch4-q021-D","text":"2.000 kg"}],"correctOptionId":"lms-ch4-q021-C","explanation":"<p>Tồn = 2.500 + 4.000 − 5.000 = <b>1.500 kg<\/b> (thuộc lô 06/10, đơn giá 18.000, trị giá 27.000.000).<\/p>","source":"Slide Chương 4, slides 36, 39 (giá nhập kho; FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q022","num":"Câu 12.5","type":"mcq","text":"Tổng giá thực tế nhập kho của vật liệu A tại ngày 18/10 là","options":[{"id":"lms-ch4-q022-A","text":"97.200.000 đồng"},{"id":"lms-ch4-q022-B","text":"101.200.000 đồng"},{"id":"lms-ch4-q022-C","text":"106.920.000 đồng"},{"id":"lms-ch4-q022-D","text":"112.000.000 đồng"}],"correctOptionId":"lms-ch4-q022-B","explanation":"<p>(Đề ghi \"vật liệu A\", theo ngữ cảnh là vật liệu B.) Giá mua đã thuế = 6.000 x 19.800 = 118.800.000; trừ chiết khấu thương mại 10% = 106.920.000 (đã thuế); chưa thuế = 106.920.000 / 1,1 = 97.200.000. Chi phí vận chuyển chưa thuế = 4.400.000 / 1,1 = 4.000.000. Tổng giá nhập kho = 97.200.000 + 4.000.000 = <b>101.200.000 đồng<\/b> (đơn giá 16.866,67 đ/kg).<\/p>","source":"Slide Chương 4, slides 36, 39 (giá nhập kho; FIFO)","status":"needs_review","answerBasis":"self","reviewNote":"Đề ghi 'vật liệu A' (lỗi đánh máy, là vật liệu B)."}]},{"id":"lms-ch4-u013","context":"<p>Doanh nghiệp Hòa An tính thuế giá trị gia tăng theo phương pháp khấu trừ, thuế suất thuế giá trị gia tăng là 10%, kế toán hàng tồn kho theo phương pháp kê khai thường xuyên và tính giá xuất kho theo phương pháp nhập trước xuất trước. (Đơn vị tính: đồng)<\/p><p>Đầu tháng 10/N có số dư như sau:<br>Tài khoản 152 – Nguyên liệu, vật liệu: 32.000.000 (Chi tiết 2.000 kg vật liệu A)<br>Các tài khoản khác có số dư hợp lý.<\/p><p>Trong tháng 10/N, trích một số nghiệp vụ kinh tế phát sinh như sau:<\/p><ul><li>Ngày 5/10: Mua và nhập kho 3.500 kg vật liệu A, giá mua chưa bao gồm thuế giá trị gia tăng 16.000 đồng/kg, thanh toán sau 30 ngày; chi phí vận chuyển vật liệu A về kho là 7.700.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tiền mặt.<\/li><li>Ngày 9/10: Xuất kho 2.800 kg vật liệu A phục vụ sản xuất sản phẩm H.<\/li><li>Ngày 13/10: Mua và nhập kho 4.000 kg vật liệu A, giá mua chưa bao gồm thuế giá trị gia tăng 18.000 đồng/kg, thanh toán sau 30 ngày; chi phí vận chuyển vật liệu A về kho là 4.400.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tiền mặt.<\/li><li>Ngày 17/10: Xuất kho 3.200 kg vật liệu A phục vụ sản xuất sản phẩm H.<\/li><li>Ngày 21/10: Mua và nhập kho 6.000 kg vật liệu A, giá mua đã bao gồm thuế giá trị gia tăng là 19.800 đồng/kg. Công ty mua hàng với số lượng lớn nên được hưởng chiết khấu thương mại 10%, thời hạn thanh toán sau 30 ngày; chi phí vận chuyển vật liệu A về kho là 6.600.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tạm ứng.<\/li><li>Ngày 25/10: Xuất kho 4.500 kg vật liệu A phục vụ sản xuất sản phẩm H.<\/li><li>Ngày 28/10: Mua và nhập kho 2.500 kg vật liệu A, giá mua chưa bao gồm thuế giá trị gia tăng 17.000 đồng/kg, thanh toán bằng chuyển khoản; chi phí vận chuyển vật liệu A về kho là 3.300.000 (đã bao gồm thuế giá trị gia tăng) thanh toán bằng tiền mặt.<\/li><\/ul>","questions":[{"id":"lms-ch4-q023","num":"Bài 1 – a","type":"essay","text":"<p>Tính giá thực tế nhập kho của từng lô vật liệu A trong tháng 10/N.<\/p>","answer":"<p><b>Công thức:<\/b> Giá thực tế nhập kho = giá mua (chưa thuế GTGT, sau chiết khấu thương mại) + chi phí vận chuyển chưa thuế. Thuế GTGT đầu vào được khấu trừ (TK 133) nên không tính vào giá. Chi phí vận chuyển chưa thuế = giá thanh toán / 1,1.<\/p><table class='t'><thead><tr><th>Ngày<\/th><th>Số lượng (kg)<\/th><th>Giá mua chưa thuế<\/th><th>Chi phí vận chuyển chưa thuế<\/th><th>Giá thực tế nhập kho<\/th><th>Đơn giá (đ/kg)<\/th><\/tr><\/thead><tbody><tr><td>05/10<\/td><td class='num'>3.500<\/td><td class='num'>56.000.000<\/td><td class='num'>7.000.000<\/td><td class='num'>63.000.000<\/td><td class='num'>18.000<\/td><\/tr><tr><td>13/10<\/td><td class='num'>4.000<\/td><td class='num'>72.000.000<\/td><td class='num'>4.000.000<\/td><td class='num'>76.000.000<\/td><td class='num'>19.000<\/td><\/tr><tr><td>21/10<\/td><td class='num'>6.000<\/td><td class='num'>97.200.000<\/td><td class='num'>6.000.000<\/td><td class='num'>103.200.000<\/td><td class='num'>17.200<\/td><\/tr><tr><td>28/10<\/td><td class='num'>2.500<\/td><td class='num'>42.500.000<\/td><td class='num'>3.000.000<\/td><td class='num'>45.500.000<\/td><td class='num'>18.200<\/td><\/tr><\/tbody><\/table><p><b>Chi tiết lô 21/10:<\/b> 6.000 x 19.800 = 118.800.000 (đã thuế); trừ CKTM 10% = 106.920.000; chia 1,1 = 97.200.000 chưa thuế. Cộng vận chuyển 6.600.000 / 1,1 = 6.000.000 thì ra 103.200.000.<\/p><p>Giả định: chiết khấu thương mại 10% tính trên giá mua đã có thuế (tương đương giảm 10% giá chưa thuế); các đơn giá đều chia hết, không phải làm tròn.<\/p><p>Bút toán ví dụ (05/10):<\/p><div class='je'><div>Nợ TK 152 &nbsp; 56.000.000<\/div><div>Nợ TK 133 &nbsp; 5.600.000<\/div><div class='cr'>Có TK 331 &nbsp; 61.600.000<\/div><\/div><div class='je'><div>Nợ TK 152 &nbsp; 7.000.000<\/div><div>Nợ TK 133 &nbsp; 700.000<\/div><div class='cr'>Có TK 111 &nbsp; 7.700.000<\/div><\/div>","source":"Slide Chương 4, slides 36, 37, 39 (giá nhập kho, FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q024","num":"Bài 1 – b","type":"essay","text":"<p>Tính giá trị vật liệu A xuất kho trong từng lần xuất kho theo phương pháp nhập trước – xuất trước (FIFO).<\/p>","answer":"<p>Tồn đầu: 2.000 kg, đơn giá 32.000.000 / 2.000 = 16.000 đ/kg. Xuất theo thứ tự lô nhập cũ trước.<\/p><ul><li><b>09/10 xuất 2.800 kg:<\/b> 2.000 x 16.000 = 32.000.000; 800 x 18.000 (lô 05/10) = 14.400.000. Cộng = <b>46.400.000<\/b>. Lô 05/10 còn 2.700 kg.<\/li><li><b>17/10 xuất 3.200 kg:<\/b> 2.700 x 18.000 = 48.600.000; 500 x 19.000 (lô 13/10) = 9.500.000. Cộng = <b>58.100.000<\/b>. Lô 13/10 còn 3.500 kg.<\/li><li><b>25/10 xuất 4.500 kg:<\/b> 3.500 x 19.000 = 66.500.000; 1.000 x 17.200 (lô 21/10) = 17.200.000. Cộng = <b>83.700.000<\/b>. Lô 21/10 còn 5.000 kg.<\/li><\/ul><p>Tổng giá trị xuất kho tháng = 46.400.000 + 58.100.000 + 83.700.000 = <b>188.200.000<\/b> (10.500 kg).<\/p><div class='je'><div>Nợ TK 621 &nbsp; 46.400.000 (ngày 09/10)<\/div><div class='cr'>Có TK 152 &nbsp; 46.400.000<\/div><\/div>","source":"Slide Chương 4, slides 36, 37, 39 (giá nhập kho, FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q025","num":"Bài 1 – c","type":"essay","text":"<p>Tính giá trị và số lượng vật liệu A tồn kho cuối tháng 10/N.<\/p>","answer":"<p>Số lượng: 2.000 + 3.500 + 4.000 + 6.000 + 2.500 − (2.800 + 3.200 + 4.500) = 18.000 − 10.500 = <b>7.500 kg<\/b>.<\/p><p>Giá trị tồn gồm: lô 21/10 còn 5.000 kg x 17.200 = 86.000.000; lô 28/10 2.500 kg x 18.200 = 45.500.000. Cộng = <b>131.500.000 đồng<\/b>.<\/p><p>Kiểm tra: tổng giá trị có = 32.000.000 + 63.000.000 + 76.000.000 + 103.200.000 + 45.500.000 = 319.700.000; trừ xuất 188.200.000 = 131.500.000. Khớp.<\/p>","source":"Slide Chương 4, slides 36, 37, 39 (giá nhập kho, FIFO)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u014","context":"<p>Công ty ABC, tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT của TSCĐ, hàng hóa, dịch vụ 10%, trong năm N mua các loại tài sản sau:<\/p><p>1. Ngày 08/6: Nhập khẩu 6 dây chuyền máy Q phục vụ sản xuất: giá nhập khẩu CIF/HCM 12.000 USD/máy; thuế suất thuế nhập khẩu 20%, thuế GTGT hàng nhập khẩu 10%. Các khoản chi phí phát sinh trong quá trình mua tài sản cố định (đã bao gồm thuế GTGT): Chi phí lưu kho tại cảng 13.200.000 đồng. Chi phí vận chuyển, chạy thử máy bao gồm cả thuế GTGT theo hóa đơn là 8.800.000 đồng. Tỷ giá giao dịch USD do ngân hàng M niêm yết: 24.100 đồng/USD.<\/p><p>2. Ngày 22/8: Mua một ôtô vận tải, giá mua chưa bao gồm thuế GTGT: 750.000.000 đồng, thuế suất thuế trước bạ 2%. Các chi phí vận chuyển, bốc dỡ, chạy thử 13.200.000 đồng (đã có thuế GTGT).<\/p>","questions":[{"id":"lms-ch4-q026","num":"Bài 2 – 1","type":"essay","text":"<p>Tính số tiền thuế từng loại mà công ty phải nộp và tổng nguyên giá của TSCĐ tại ngày 08/6/N?<\/p>","answer":"<p><b>Công thức:<\/b> Giá tính thuế NK = giá CIF x tỷ giá. Thuế NK = giá tính thuế x 20%. Thuế GTGT hàng NK = (giá CIF + thuế NK) x 10% (không có TTĐB). Nguyên giá = giá CIF + thuế NK + chi phí chưa thuế (thuế GTGT hàng NK được khấu trừ nên không tính vào nguyên giá).<\/p><ul><li>Giá CIF = 6 x 12.000 x 24.100 = 1.735.200.000<\/li><li>Thuế nhập khẩu = 1.735.200.000 x 20% = <b>347.040.000<\/b><\/li><li>Thuế GTGT hàng NK = (1.735.200.000 + 347.040.000) x 10% = <b>208.224.000<\/b> (nộp khi nhập khẩu, được khấu trừ, ghi Nợ TK 133)<\/li><li>Chi phí lưu kho tại cảng = 13.200.000 / 1,1 = 12.000.000<\/li><li>Chi phí vận chuyển, chạy thử = 8.800.000 / 1,1 = 8.000.000<\/li><\/ul><p><b>Nguyên giá<\/b> = 1.735.200.000 + 347.040.000 + 12.000.000 + 8.000.000 = <b>2.102.240.000 đồng<\/b>.<\/p><div class='je'><div>Nợ TK 211 &nbsp; 2.082.240.000<\/div><div class='cr'>Có TK 331 &nbsp; 1.735.200.000<\/div><div class='cr'>Có TK 3333 &nbsp; 347.040.000<\/div><\/div><div class='je'><div>Nợ TK 133 &nbsp; 208.224.000<\/div><div class='cr'>Có TK 33312 &nbsp; 208.224.000<\/div><\/div><p>Chi phí lưu kho tại cảng và vận chuyển, chạy thử (12.000.000 + 8.000.000, thuế GTGT 2.000.000 vào TK 133) ghi Nợ TK 211 phần chưa thuế.<\/p><p>Giả định: coi chi phí lưu kho tại cảng là chi phí phát sinh trong quá trình mua (đề nêu như vậy) nên tính vào nguyên giá.<\/p>","source":"Slide Chương 4, slides 17–18 (nguyên giá TSCĐ mua sắm = giá mua + thuế không hoàn lại + chi phí trước khi sử dụng)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q027","num":"Bài 2 – 2","type":"essay","text":"<p>Tính số tiền thuế từng loại mà công ty phải nộp và nguyên giá của chiếc ô tô vận tải mua vào tại ngày 22/8/N?<\/p>","answer":"<p>Mua trong nước: thuế GTGT đầu vào 10% được khấu trừ; lệ phí trước bạ không được hoàn lại nên tính vào nguyên giá.<\/p><ul><li>Thuế GTGT đầu vào = 750.000.000 x 10% = <b>75.000.000<\/b> (khấu trừ, trả cho người bán)<\/li><li>Lệ phí trước bạ = 750.000.000 x 2% = <b>15.000.000<\/b> (nộp cho nhà nước)<\/li><li>Chi phí vận chuyển, bốc dỡ, chạy thử chưa thuế = 13.200.000 / 1,1 = 12.000.000 (thuế GTGT 1.200.000 được khấu trừ)<\/li><\/ul><p><b>Nguyên giá<\/b> = 750.000.000 + 15.000.000 + 12.000.000 = <b>777.000.000 đồng<\/b>.<\/p><div class='je'><div>Nợ TK 211 &nbsp; 777.000.000<\/div><div>Nợ TK 133 &nbsp; 76.200.000<\/div><div class='cr'>Có TK 331, 111, 3339... &nbsp; 853.200.000<\/div><\/div><p>Thuế GTGT đầu vào được khấu trừ tổng cộng = 75.000.000 + 1.200.000 = 76.200.000.<\/p>","source":"Slide Chương 4, slides 17–18 (nguyên giá TSCĐ mua sắm = giá mua + thuế không hoàn lại + chi phí trước khi sử dụng)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch4-u015","context":"<p>Doanh nghiệp An Bình tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT 10%, kỳ kế toán là tháng. Trong tháng 7/N có các tài liệu sau liên quan đến việc mua hàng hóa P: (Đơn vị tính: Đồng)<\/p><ul><li>Số tiền ghi trên hóa đơn (đã bao gồm thuế GTGT) đã thanh toán bằng chuyển khoản: 275.000.000<\/li><li>Chi phí vận chuyển, bốc dỡ hàng hóa (đã có thuế GTGT) thanh toán bằng tiền mặt: 8.800.000<\/li><li>Chi phí thuê kho: 5.500.000 đồng/tháng (đã có thuế GTGT).<\/li><li>Khối lượng hàng hóa mua theo hóa đơn: 8.000 kg<\/li><li>Định mức hao hụt: 0,6%<\/li><\/ul><p>Yêu cầu: Tính tổng giá và đơn giá thực tế nhập kho hàng hóa P mua trong tháng 7/N trong các trường hợp sau:<\/p>","questions":[{"id":"lms-ch4-q028","num":"Bài 3 – Trường hợp 1","type":"essay","text":"<p>Khối lượng hàng hóa P thực nhập 8.000 kg.<\/p>","answer":"<p>Giá mua chưa thuế = 275.000.000 / 1,1 = 250.000.000. Chi phí vận chuyển, bốc dỡ chưa thuế = 8.800.000 / 1,1 = 8.000.000. Chi phí thuê kho 5.500.000/tháng (5.000.000 chưa thuế) là chi phí bảo quản hàng tồn kho sau khi mua, không thuộc chi phí mua nên không tính vào giá nhập kho (ghi vào chi phí bán hàng/quản lý).<\/p><p><b>Tổng giá thực tế nhập kho<\/b> = 250.000.000 + 8.000.000 = <b>258.000.000 đồng<\/b>.<\/p><p>Nhập đủ 8.000 kg nên <b>đơn giá<\/b> = 258.000.000 / 8.000 = <b>32.250 đồng/kg<\/b>.<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho); VAS 02 (chi phí lưu kho không tính vào giá gốc, trừ khi cần thiết cho quá trình mua/sản xuất tiếp theo)","status":"needs_review","answerBasis":"self","reviewNote":"Giả định chi phí thuê kho (5,5 triệu) không tính vào giá nhập; nếu giáo trình tính cả thì tổng = 263.000.000, đơn giá 32.875."},{"id":"lms-ch4-q029","num":"Bài 3 – Trường hợp 2","type":"essay","text":"<p>Khối lượng hàng hóa P thực nhập 7.940 kg.<\/p>","answer":"<p>Hao hụt định mức = 8.000 x 0,6% = 48 kg. Thiếu thực tế = 8.000 − 7.940 = 60 kg. Thiếu trong định mức 48 kg: tính vào giá gốc hàng nhập kho (làm tăng đơn giá). Thiếu ngoài định mức 12 kg: không tính vào giá gốc, theo dõi chờ xử lý (TK 1381; bồi thường hoặc tính vào giá vốn/chi phí khác tùy quyết định xử lý).<\/p><p>Tổng chi phí mua (chưa thuế) = 250.000.000 + 8.000.000 = 258.000.000, bình quân 258.000.000 / 8.000 = 32.250 đ/kg.<\/p><p>Giá trị 12 kg thiếu ngoài định mức = 12 x 32.250 = 387.000.<\/p><p><b>Tổng giá thực tế nhập kho<\/b> = 258.000.000 − 387.000 = <b>257.613.000 đồng<\/b>.<\/p><p><b>Đơn giá<\/b> = 257.613.000 / 7.940 = <b>32.445,59 đồng/kg<\/b> (làm tròn 2 chữ số thập phân).<\/p><div class='je'><div>Nợ TK 156 &nbsp; 257.613.000<\/div><div>Nợ TK 1381 &nbsp; 387.000<\/div><div>Nợ TK 133 &nbsp; 25.800.000<\/div><div class='cr'>Có TK 112, 111 &nbsp; 283.800.000<\/div><\/div><p>Phương án đơn giản (nếu đề coi toàn bộ phần thiếu là hao hụt trong định mức): tổng giá = 258.000.000, đơn giá = 258.000.000 / 7.940 = 32.493,70 đ/kg.<\/p>","source":"Slide Chương 4, slide 36 (giá thực tế nhập kho); VAS 02 (chi phí lưu kho không tính vào giá gốc, trừ khi cần thiết cho quá trình mua/sản xuất tiếp theo)","status":"needs_review","answerBasis":"self","reviewNote":"Đề không nói rõ xử lý phần thiếu ngoài định mức (12 kg) và thuê kho; đáp án chính giả định 12 kg ngoài định mức tách riêng, thuê kho loại trừ. Cần đối chiếu đáp án giảng viên (phương án đơn giản: 258.000.000 và 32.493,70)."}]},{"id":"lms-ch4-u016","context":"<p>Doanh nghiệp Kiến Tường tính thuế GTGT theo phương pháp khấu trừ, thuế suất thuế GTGT 10%, kỳ kế toán là tháng. Trong tháng 8/N có các tài liệu sau liên quan đến việc mua hàng như sau: (Đơn vị tính: Đồng)<\/p><p>1. Ngày 07/08: Công ty Y mua và nhập kho 4.000 kg hàng hóa P, giá trị hàng hóa P ghi trên hóa đơn (đã bao gồm thuế GTGT) đã thanh toán bằng chuyển khoản: 220.000.000; chi phí vận chuyển (đã có thuế GTGT) thanh toán bằng tiền mặt: 6.600.000; chi phí bốc dỡ, bảo quản trong quá trình mua thanh toán bằng tiền tạm ứng: 1.200.000.<\/p><p>2. Ngày 21/08: Nhập khẩu 6 tấn vật liệu P từ Nhật Bản, giá nhập khẩu (Giá CIF/HCM): 18.000 USD/tấn. Tỷ giá giao dịch USD do ngân hàng M niêm yết: 24.150 đồng/USD. Thuế suất thuế nhập khẩu: 10%, thuế suất thuế tiêu thụ đặc biệt: 25%, chi phí vận chuyển vật liệu về nhập kho: 24.200.000 đồng (đã bao gồm 10% thuế GTGT), chi phí thuê kho chứa nguyên liệu: 6.600.000 (đã bao gồm 10% thuế GTGT).<\/p>","questions":[{"id":"lms-ch4-q030","num":"Bài 4 – 1","type":"essay","text":"<p>Tính tổng giá và đơn giá thực tế nhập kho khi mua hàng hóa tại ngày 07/08/N?<\/p>","answer":"<p>Giá mua chưa thuế = 220.000.000 / 1,1 = 200.000.000. Chi phí vận chuyển chưa thuế = 6.600.000 / 1,1 = 6.000.000. Chi phí bốc dỡ, bảo quản trong quá trình mua = 1.200.000 (đề không nêu thuế GTGT nên tính nguyên số tiền).<\/p><p><b>Tổng giá thực tế nhập kho<\/b> = 200.000.000 + 6.000.000 + 1.200.000 = <b>207.200.000 đồng<\/b>.<\/p><p><b>Đơn giá<\/b> = 207.200.000 / 4.000 = <b>51.800 đồng/kg<\/b>.<\/p><div class='je'><div>Nợ TK 156 &nbsp; 200.000.000<\/div><div>Nợ TK 133 &nbsp; 20.000.000<\/div><div class='cr'>Có TK 112 &nbsp; 220.000.000<\/div><\/div>","source":"Slide Chương 4, slide 36 (giá nhập kho = giá mua + thuế không hoàn lại + chi phí khác); Luật thuế TTĐB, thuế GTGT hàng nhập khẩu","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q031","num":"Bài 4 – 2","type":"essay","text":"<p>Tính số tiền thuế từng loại mà công ty phải nộp, tổng giá và đơn giá thực tế nhập kho khi mua NVL tại ngày 21/08/N?<\/p>","answer":"<p><b>Công thức hàng nhập khẩu có TTĐB:<\/b><\/p><ul><li>Giá tính thuế NK = CIF x tỷ giá<\/li><li>Thuế NK = giá tính thuế NK x 10%<\/li><li>Thuế TTĐB = (giá tính thuế NK + thuế NK) x 25%<\/li><li>Thuế GTGT hàng NK = (giá tính thuế NK + thuế NK + thuế TTĐB) x 10%<\/li><\/ul><p><b>Tính:<\/b><\/p><ul><li>Giá CIF = 6 x 18.000 x 24.150 = 2.608.200.000<\/li><li>Thuế nhập khẩu = 2.608.200.000 x 10% = <b>260.820.000<\/b><\/li><li>Thuế TTĐB = (2.608.200.000 + 260.820.000) x 25% = <b>717.255.000<\/b><\/li><li>Thuế GTGT hàng NK = (2.608.200.000 + 260.820.000 + 717.255.000) x 10% = <b>358.627.500<\/b> (được khấu trừ, không tính vào giá)<\/li><li>Chi phí vận chuyển chưa thuế = 24.200.000 / 1,1 = 22.000.000<\/li><\/ul><p><b>Tổng giá thực tế nhập kho<\/b> = 2.608.200.000 + 260.820.000 + 717.255.000 + 22.000.000 = <b>3.608.275.000 đồng<\/b>.<\/p><p><b>Đơn giá<\/b> = 3.608.275.000 / 6 = <b>601.379.166,67 đồng/tấn<\/b> (làm tròn 2 chữ số thập phân).<\/p><p>Chi phí thuê kho chứa nguyên liệu 6.600.000 (6.000.000 chưa thuế) là chi phí bảo quản, không thuộc chi phí mua nên loại khỏi giá nhập kho; thuế GTGT của nó (600.000) vẫn được khấu trừ.<\/p><div class='je'><div>Nợ TK 152 &nbsp; 3.586.275.000<\/div><div class='cr'>Có TK 331 &nbsp; 2.608.200.000<\/div><div class='cr'>Có TK 3333 &nbsp; 260.820.000<\/div><div class='cr'>Có TK 3332 &nbsp; 717.255.000<\/div><\/div><div class='je'><div>Nợ TK 133 &nbsp; 358.627.500<\/div><div class='cr'>Có TK 33312 &nbsp; 358.627.500<\/div><\/div><p>Tổng thuế phải nộp tại khâu nhập khẩu: 260.820.000 + 717.255.000 + 358.627.500 = 1.336.702.500.<\/p>","source":"Slide Chương 4, slide 36 (giá nhập kho = giá mua + thuế không hoàn lại + chi phí khác); Luật thuế TTĐB, thuế GTGT hàng nhập khẩu","status":"needs_review","answerBasis":"self","reviewNote":"Giả định chi phí thuê kho chứa nguyên liệu không tính vào giá nhập kho (nếu tính: tổng 3.614.275.000, đơn giá 602.379.166,67)."}]},{"id":"lms-ch4-u017","context":"<p>Tính giá XK theo PP FIFO và bình quân gia quyền cuối kỳ<\/p><p>Tại DN Hoàng Nam trong tháng 6 năm N có tình hình về vật liệu chính (VLC K) như sau: (đơn vị áp dụng phương pháp kê khai thường xuyên)<\/p><p>Tồn kho đầu tháng: 1.000 kg, tổng giá trị 15.000.000 đồng.<\/p><p>Các nghiệp vụ phát sinh trong tháng:<\/p><ul><li>Ngày 04/6: Xuất kho 250 kg vật liệu để sản xuất sản phẩm (Phiếu xuất kho số PXK601).<\/li><li>Ngày 08/6: Mua 500 kg vật liệu nhập kho với đơn giá 16.000 đồng/kg. Chi phí vận chuyển trả bằng tiền mặt là 120.000 đồng (Phiếu nhập kho số PNK601).<\/li><li>Ngày 15/6: Xuất kho 600 kg vật liệu để sản xuất sản phẩm (Phiếu xuất kho số PXK602).<\/li><li>Ngày 21/6: Mua 1.200 kg vật liệu nhập kho với đơn giá 15.800 đồng/kg. Chi phí vận chuyển là 250.000 đồng (Phiếu nhập kho số PNK602).<\/li><li>Ngày 23/6: Xuất kho 400 kg vật liệu để sản xuất sản phẩm (Phiếu xuất kho số PXK603).<\/li><li>Ngày 25/6: Mua 700 kg vật liệu nhập kho với đơn giá 16.200 đồng/kg. Chi phí vận chuyển trả bằng tiền mặt là 150.000 đồng (Phiếu nhập kho số PNK603).<\/li><li>Ngày 27/6: Xuất kho 750 kg vật liệu để sản xuất sản phẩm (Phiếu xuất kho số PXK604).<\/li><li>Ngày 28/6: Mua 900 kg vật liệu nhập kho với đơn giá 15.600 đồng/kg. Chi phí vận chuyển là 180.000 đồng (Phiếu nhập kho số PNK604).<\/li><li>Ngày 29/6: Xuất kho 500 kg vật liệu để sản xuất sản phẩm (Phiếu xuất kho số PXK605).<\/li><li>Ngày 30/6: Mua 600 kg vật liệu nhập kho với đơn giá 16.500 đồng/kg. Chi phí vận chuyển trả bằng tiền mặt là 100.000 đồng (Phiếu nhập kho số PNK605).<\/li><\/ul>","questions":[{"id":"lms-ch4-q032","num":"Bài 5 – 1","type":"essay","text":"<p>Mở sổ chi tiết vật liệu K, theo dõi tình hình nhập, xuất, tồn trong tháng 6/N<\/p>","answer":"<p><b>Giá nhập kho từng lần<\/b> = tiền hàng + chi phí vận chuyển (VD PNK601: 500 x 16.000 + 120.000 = 8.120.000):<\/p><table class='t'><thead><tr><th>Ngày<\/th><th>Phiếu<\/th><th>Số lượng (kg)<\/th><th>Tiền hàng<\/th><th>Chi phí vận chuyển<\/th><th>Giá nhập kho<\/th><th>Đơn giá (đ/kg)<\/th><\/tr><\/thead><tbody><tr><td>08/6<\/td><td>PNK601<\/td><td class='num'>500<\/td><td class='num'>8.000.000<\/td><td class='num'>120.000<\/td><td class='num'>8.120.000<\/td><td class='num'>16.240<\/td><\/tr><tr><td>21/6<\/td><td>PNK602<\/td><td class='num'>1.200<\/td><td class='num'>18.960.000<\/td><td class='num'>250.000<\/td><td class='num'>19.210.000<\/td><td class='num'>16.008,33<\/td><\/tr><tr><td>25/6<\/td><td>PNK603<\/td><td class='num'>700<\/td><td class='num'>11.340.000<\/td><td class='num'>150.000<\/td><td class='num'>11.490.000<\/td><td class='num'>16.414,29<\/td><\/tr><tr><td>28/6<\/td><td>PNK604<\/td><td class='num'>900<\/td><td class='num'>14.040.000<\/td><td class='num'>180.000<\/td><td class='num'>14.220.000<\/td><td class='num'>15.800<\/td><\/tr><tr><td>30/6<\/td><td>PNK605<\/td><td class='num'>600<\/td><td class='num'>9.900.000<\/td><td class='num'>100.000<\/td><td class='num'>10.000.000<\/td><td class='num'>16.666,67<\/td><\/tr><\/tbody><\/table><p>Tổng nhập = 3.900 kg, 63.040.000. Cùng tồn đầu: 4.900 kg, 78.040.000.<\/p><p><b>Sổ chi tiết (xuất tính theo FIFO, tồn tính tiếp sau mỗi lần nhập/xuất):<\/b><\/p><table class='t'><thead><tr><th>Ngày<\/th><th>Chứng từ<\/th><th>Nhập SL<\/th><th>Nhập giá trị<\/th><th><\/th><th>Xuất SL<\/th><th>Xuất giá trị<\/th><th><\/th><th>Tồn SL<\/th><th>Tồn giá trị<\/th><\/tr><\/thead><tbody><tr><td>01/6<\/td><td>Tồn đầu<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>1.000<\/td><td class='num'>15.000.000<\/td><\/tr><tr><td>04/6<\/td><td>PXK601<\/td><td><\/td><td><\/td><td><\/td><td class='num'>250<\/td><td class='num'>3.750.000<\/td><td><\/td><td class='num'>750<\/td><td class='num'>11.250.000<\/td><\/tr><tr><td>08/6<\/td><td>PNK601<\/td><td class='num'>500<\/td><td class='num'>8.120.000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>1.250<\/td><td class='num'>19.370.000<\/td><\/tr><tr><td>15/6<\/td><td>PXK602<\/td><td><\/td><td><\/td><td><\/td><td class='num'>600<\/td><td class='num'>9.000.000<\/td><td><\/td><td class='num'>650<\/td><td class='num'>10.370.000<\/td><\/tr><tr><td>21/6<\/td><td>PNK602<\/td><td class='num'>1.200<\/td><td class='num'>19.210.000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>1.850<\/td><td class='num'>29.580.000<\/td><\/tr><tr><td>23/6<\/td><td>PXK603<\/td><td><\/td><td><\/td><td><\/td><td class='num'>400<\/td><td class='num'>6.310.000<\/td><td><\/td><td class='num'>1.450<\/td><td class='num'>23.270.000<\/td><\/tr><tr><td>25/6<\/td><td>PNK603<\/td><td class='num'>700<\/td><td class='num'>11.490.000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>2.150<\/td><td class='num'>34.760.000<\/td><\/tr><tr><td>27/6<\/td><td>PXK604<\/td><td><\/td><td><\/td><td><\/td><td class='num'>750<\/td><td class='num'>12.064.167<\/td><td><\/td><td class='num'>1.400<\/td><td class='num'>22.695.833<\/td><\/tr><tr><td>28/6<\/td><td>PNK604<\/td><td class='num'>900<\/td><td class='num'>14.220.000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>2.300<\/td><td class='num'>36.915.833<\/td><\/tr><tr><td>29/6<\/td><td>PXK605<\/td><td><\/td><td><\/td><td><\/td><td class='num'>500<\/td><td class='num'>8.004.166<\/td><td><\/td><td class='num'>1.800<\/td><td class='num'>28.911.667<\/td><\/tr><tr><td>30/6<\/td><td>PNK605<\/td><td class='num'>600<\/td><td class='num'>10.000.000<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td class='num'>2.400<\/td><td class='num'>38.911.667<\/td><\/tr><tr><td><\/td><td><b>Cộng<\/b><\/td><td class='num'>3.900<\/td><td class='num'>63.040.000<\/td><td><\/td><td class='num'>2.500<\/td><td class='num'>39.128.333<\/td><td><\/td><td class='num'>2.400<\/td><td class='num'>38.911.667<\/td><\/tr><\/tbody><\/table><p>Giả định: đề không nêu thuế GTGT nên các số tiền coi là chưa thuế; làm tròn đến 1 đồng, dòng cuối được điều chỉnh để tổng khớp. Cách tính giá xuất xem Yêu cầu 2; với bình quân gia quyền cuối kỳ cột xuất chỉ ghi số lượng trong kỳ, giá trị xuất tính ở cuối tháng (Yêu cầu 3).<\/p>","source":"Slide Chương 4, slides 36, 38, 39 (giá nhập kho, bình quân gia quyền cuối kỳ, FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q033","num":"Bài 5 – 2","type":"essay","text":"<p>Tính giá trị vật liệu K xuất kho theo phương pháp FIFO<\/p>","answer":"<p>Tồn đầu: 1.000 kg x 15.000 = 15.000.000.<\/p><ul><li><b>PXK601 (04/6) 250 kg:<\/b> 250 x 15.000 = <b>3.750.000<\/b>. Tồn đầu còn 750 kg.<\/li><li><b>PXK602 (15/6) 600 kg:<\/b> 600 x 15.000 = <b>9.000.000<\/b>. Tồn đầu còn 150 kg.<\/li><li><b>PXK603 (23/6) 400 kg:<\/b> 150 x 15.000 + 250 x 16.240 (PNK601) = 2.250.000 + 4.060.000 = <b>6.310.000<\/b>. PNK601 còn 250 kg.<\/li><li><b>PXK604 (27/6) 750 kg:<\/b> 250 x 16.240 + 500 x 16.008,33 (PNK602) = 4.060.000 + 8.004.166,67 = <b>12.064.167<\/b>. PNK602 còn 700 kg.<\/li><li><b>PXK605 (29/6) 500 kg:<\/b> 500 x 16.008,33 = 8.004.166,67 = <b>8.004.166<\/b> (điều chỉnh làm tròn). PNK602 còn 200 kg.<\/li><\/ul><p>Tổng giá trị xuất theo FIFO = 3.750.000 + 9.000.000 + 6.310.000 + 12.064.167 + 8.004.166 = <b>39.128.333 đồng<\/b> (2.500 kg).<\/p><p>Giả định: đề không nêu thuế GTGT nên các số tiền coi là chưa thuế; làm tròn đến 1 đồng, dòng cuối được điều chỉnh để tổng khớp.<\/p>","source":"Slide Chương 4, slides 36, 38, 39 (giá nhập kho, bình quân gia quyền cuối kỳ, FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q034","num":"Bài 5 – 3","type":"essay","text":"<p>Tính giá trị vật liệu K xuất kho theo phương pháp bình quân gia quyền cuối kỳ<\/p>","answer":"<p><b>Công thức:<\/b> Đơn giá bình quân = (giá trị tồn đầu + giá trị nhập trong kỳ) / (số lượng tồn đầu + số lượng nhập trong kỳ); Giá xuất = số lượng xuất x đơn giá bình quân.<\/p><p>Đơn giá bình quân = (15.000.000 + 63.040.000) / (1.000 + 3.900) = 78.040.000 / 4.900 = <b>15.926,53 đồng/kg<\/b> (15.926,5306...).<\/p><ul><li><b>PXK601 (04/6) 250 kg:<\/b> 250 x 15.926,53 = <b>3.981.633<\/b><\/li><li><b>PXK602 (15/6) 600 kg:<\/b> 600 x 15.926,53 = <b>9.555.918<\/b><\/li><li><b>PXK603 (23/6) 400 kg:<\/b> 400 x 15.926,53 = <b>6.370.612<\/b><\/li><li><b>PXK604 (27/6) 750 kg:<\/b> 750 x 15.926,53 = <b>11.944.898<\/b><\/li><li><b>PXK605 (29/6) 500 kg:<\/b> 500 x 15.926,53 = <b>7.963.266<\/b><\/li><\/ul><p>Tổng xuất = 2.500 x 15.926,5306 = <b>39.816.327 đồng<\/b> (làm tròn 1 đồng; các dòng cộng lại có thể lệch 1 đồng nên dòng cuối được điều chỉnh).<\/p>","source":"Slide Chương 4, slides 36, 38, 39 (giá nhập kho, bình quân gia quyền cuối kỳ, FIFO)","status":"ok","answerBasis":"self"},{"id":"lms-ch4-q035","num":"Bài 5 – 4","type":"essay","text":"<p>Xác định giá trị vật liệu K tồn kho cuối tháng 6/N theo từng phương pháp<\/p>","answer":"<p>Số lượng tồn cuối tháng = 1.000 + 3.900 − 2.500 = <b>2.400 kg<\/b>.<\/p><p><b>FIFO:<\/b> tồn gồm PNK602 còn 200 kg x 16.008,33 = 3.201.667; PNK603 700 kg x 16.414,29 = 11.490.000; PNK604 900 kg x 15.800 = 14.220.000; PNK605 600 kg x 16.666,67 = 10.000.000. Cộng = <b>38.911.667 đồng<\/b>. Kiểm tra: 78.040.000 − 39.128.333 = 38.911.667.<\/p><p><b>Bình quân gia quyền cuối kỳ:<\/b> 2.400 x 15.926,5306 = 38.223.673; kiểm tra: 78.040.000 − 39.816.327 = <b>38.223.673 đồng<\/b>.<\/p><p>Chênh lệch giữa hai phương pháp = 38.911.667 − 38.223.673 = 687.994 đồng. (Trong tháng giá tăng giảm xen kẽ nhưng giá nhập cuối kỳ cao hơn bình quân nên FIFO cho tồn kho cao hơn.)<\/p>","source":"Slide Chương 4, slides 36, 38, 39 (giá nhập kho, bình quân gia quyền cuối kỳ, FIFO)","status":"ok","answerBasis":"self"}]}]},{"key":"ch5","title":"Chương 5 – Kế toán các nghiệp vụ chủ yếu","units":[{"id":"lms-ch5-u001","context":null,"questions":[{"id":"lms-ch5-q001","num":"Câu 1","type":"mcq","text":"Doanh nghiệp kê khai thuế GTGT theo phương pháp khấu trừ mua một máy móc có tổng giá thanh toán 550 triệu đồng, trong đó thuế GTGT 50 triệu đồng. Chi phí vận chuyển thanh toán bằng chuyển khoản 11 triệu đồng, trong đó thuế GTGT 1 triệu đồng. Nguyên giá TSCĐ là:","options":[{"id":"lms-ch5-q001-A","text":"500 triệu đồng"},{"id":"lms-ch5-q001-B","text":"510 triệu đồng"},{"id":"lms-ch5-q001-C","text":"550 triệu đồng"},{"id":"lms-ch5-q001-D","text":"561 triệu đồng"}],"correctOptionId":"lms-ch5-q001-B","explanation":"Thuế GTGT đầu vào được khấu trừ (TK 133) nên không tính vào nguyên giá. Nguyên giá = (550 - 50) + (11 - 1) = 500 + 10 = 510 triệu đồng. A thiếu chi phí vận chuyển; C, D tính cả thuế GTGT.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), ví dụ 1 (slide 9–10)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u002","context":null,"questions":[{"id":"lms-ch5-q002","num":"Câu 2","type":"mcq","text":"Khi trích khấu hao TSCĐ sử dụng tại bộ phận bán hàng, kế toán ghi:","options":[{"id":"lms-ch5-q002-A","text":"Nợ TK 641 / Có TK 214"},{"id":"lms-ch5-q002-B","text":"Nợ TK 642 / Có TK 214"},{"id":"lms-ch5-q002-C","text":"Nợ TK 627 / Có TK 211"},{"id":"lms-ch5-q002-D","text":"Nợ TK 214 / Có TK 641"}],"correctOptionId":"lms-ch5-q002-A","explanation":"Khấu hao TSCĐ ở bộ phận bán hàng tính vào chi phí bán hàng (TK 641), ghi Có TK 214 - Hao mòn TSCĐ. B là của bộ phận quản lý DN, C sai TK Có (211) và là của phân xưởng, D ghi ngược.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), slide 14–15","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u003","context":null,"questions":[{"id":"lms-ch5-q003","num":"Câu 3","type":"mcq","text":"Chi phí sửa chữa thường xuyên TSCĐ tại bộ phận bán hàng thuê ngoài là 22 triệu đồng, trong đó thuế GTGT 2 triệu đồng, chưa thanh toán. Bút toán phù hợp là:","options":[{"id":"lms-ch5-q003-A","text":"Nợ 211: 20; Nợ 133: 2 / Có 331: 22"},{"id":"lms-ch5-q003-B","text":"Nợ 641: 20; Nợ 133: 2 / Có 331: 22"},{"id":"lms-ch5-q003-C","text":"Nợ 642: 22 / Có 331: 22"},{"id":"lms-ch5-q003-D","text":"Nợ 214: 20; Nợ 133: 2 / Có 331: 22"}],"correctOptionId":"lms-ch5-q003-B","explanation":"Sửa chữa thường xuyên tính thẳng vào chi phí của bộ phận sử dụng (bán hàng - TK 641) theo giá chưa thuế 20, thuế GTGT 2 vào TK 133, phải trả người bán 22. A, D làm tăng/giảm TSCĐ, hao mòn - sai bản chất; C sai bộ phận và tính cả thuế vào chi phí.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), slide 16–18","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u004","context":null,"questions":[{"id":"lms-ch5-q004","num":"Câu 4","type":"mcq","text":"Tài khoản phản ánh giá trị hao mòn lũy kế của TSCĐ là:","options":[{"id":"lms-ch5-q004-A","text":"TK 211"},{"id":"lms-ch5-q004-B","text":"TK 214"},{"id":"lms-ch5-q004-C","text":"TK 242"},{"id":"lms-ch5-q004-D","text":"TK 627"}],"correctOptionId":"lms-ch5-q004-B","explanation":"TK 214 - Hao mòn TSCĐ phản ánh giá trị hao mòn lũy kế. TK 211 phản ánh nguyên giá TSCĐ hữu hình, TK 242 chi phí trả trước, TK 627 chi phí sản xuất chung.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), slide 13","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u005","context":null,"questions":[{"id":"lms-ch5-q005","num":"Câu 5","type":"mcq","text":"Đặc điểm nào sau đây phù hợp với TSCĐ hữu hình?","options":[{"id":"lms-ch5-q005-A","text":"Chỉ tham gia một chu kỳ sản xuất"},{"id":"lms-ch5-q005-B","text":"Giá trị được chuyển toàn bộ một lần vào chi phí"},{"id":"lms-ch5-q005-C","text":"Tham gia nhiều chu kỳ sản xuất và giá trị chuyển dần vào chi phí"},{"id":"lms-ch5-q005-D","text":"Không có hình thái vật chất"}],"correctOptionId":"lms-ch5-q005-C","explanation":"TSCĐ hữu hình tham gia nhiều chu kỳ sản xuất kinh doanh, hình thái vật chất không đổi, giá trị chuyển dần vào chi phí (khấu hao). A, B là đặc điểm của nguyên vật liệu; D là đặc điểm của TSCĐ vô hình.","source":"Slide Chương 5, slide 6","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u006","context":null,"questions":[{"id":"lms-ch5-q006","num":"Câu 6","type":"mcq","text":"TSCĐ mua về sử dụng ngay tại phân xưởng sản xuất được trích khấu hao định kỳ vào:","options":[{"id":"lms-ch5-q006-A","text":"TK 621"},{"id":"lms-ch5-q006-B","text":"TK 622"},{"id":"lms-ch5-q006-C","text":"TK 627"},{"id":"lms-ch5-q006-D","text":"TK 641"}],"correctOptionId":"lms-ch5-q006-C","explanation":"Khấu hao TSCĐ dùng ở phân xưởng là chi phí sản xuất chung - Nợ TK 627. TK 621 là NVL trực tiếp, 622 nhân công trực tiếp, 641 chi phí bán hàng.","source":"Slide Chương 5, slide 6–15 (kế toán TSCĐ); TT200 (TK 211, 214), slide 14; slide 57–58","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u007","context":null,"questions":[{"id":"lms-ch5-q007","num":"Câu 7","type":"mcq","text":"Mua nguyên liệu nhập kho, tổng giá thanh toán 220 triệu đồng, trong đó thuế GTGT 20 triệu đồng. Chi phí vận chuyển 5,5 triệu đồng, trong đó thuế GTGT 0,5 triệu đồng. Giá thực tế nguyên liệu nhập kho là:","options":[{"id":"lms-ch5-q007-A","text":"200 triệu đồng"},{"id":"lms-ch5-q007-B","text":"205 triệu đồng"},{"id":"lms-ch5-q007-C","text":"220 triệu đồng"},{"id":"lms-ch5-q007-D","text":"225,5 triệu đồng"}],"correctOptionId":"lms-ch5-q007-B","explanation":"Giá thực tế nhập kho (thuế GTGT khấu trừ) = (220 - 20) + (5,5 - 0,5) = 200 + 5 = 205 triệu đồng. A thiếu chi phí vận chuyển; C, D tính cả thuế GTGT.","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), ví dụ slide 28","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u008","context":null,"questions":[{"id":"lms-ch5-q008","num":"Câu 8","type":"mcq","text":"Xuất kho nguyên liệu chính dùng trực tiếp để sản xuất sản phẩm, kế toán ghi Nợ:","options":[{"id":"lms-ch5-q008-A","text":"TK 621"},{"id":"lms-ch5-q008-B","text":"TK 627"},{"id":"lms-ch5-q008-C","text":"TK 641"},{"id":"lms-ch5-q008-D","text":"TK 642"}],"correctOptionId":"lms-ch5-q008-A","explanation":"Nguyên liệu chính xuất trực tiếp cho sản xuất sản phẩm là chi phí NVL trực tiếp - Nợ TK 621, Có TK 152. TK 627 dành cho vật liệu dùng chung ở phân xưởng; 641, 642 cho bán hàng và quản lý DN.","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 29–30","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u009","context":null,"questions":[{"id":"lms-ch5-q009","num":"Câu 9","type":"mcq","text":"Xuất kho nhiên liệu dùng để vận hành máy móc tại phân xưởng, kế toán ghi Nợ:","options":[{"id":"lms-ch5-q009-A","text":"TK 621"},{"id":"lms-ch5-q009-B","text":"TK 627"},{"id":"lms-ch5-q009-C","text":"TK 641"},{"id":"lms-ch5-q009-D","text":"TK 642"}],"correctOptionId":"lms-ch5-q009-B","explanation":"Nhiên liệu chạy máy tại phân xưởng là chi phí sản xuất chung - Nợ TK 627, Có TK 152 (đúng như ví dụ slide 30).","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 30","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u010","context":null,"questions":[{"id":"lms-ch5-q010","num":"Câu 10","type":"mcq","text":"CCDC có giá trị thấp, thời gian sử dụng ngắn và được phân bổ một lần khi xuất dùng ở phân xưởng, bút toán là:","options":[{"id":"lms-ch5-q010-A","text":"Nợ 627 / Có 153"},{"id":"lms-ch5-q010-B","text":"Nợ 242 / Có 153"},{"id":"lms-ch5-q010-C","text":"Nợ 153 / Có 627"},{"id":"lms-ch5-q010-D","text":"Nợ 621 / Có 153"}],"correctOptionId":"lms-ch5-q010-A","explanation":"CCDC phân bổ một lần được tính hết vào chi phí của bộ phận sử dụng: Nợ TK 627, Có TK 153. B (TK 242) dùng cho phân bổ nhiều lần; C ghi ngược; D sai khoản mục chi phí.","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 31–33","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u011","context":null,"questions":[{"id":"lms-ch5-q011","num":"Câu 11","type":"mcq","text":"Xuất CCDC phân bổ một lần dùng cho phân xưởng, bút toán là:","options":[{"id":"lms-ch5-q011-A","text":"Nợ 627 / Có 153"},{"id":"lms-ch5-q011-B","text":"Nợ 153 / Có 627"},{"id":"lms-ch5-q011-C","text":"Nợ 242 / Có 627"},{"id":"lms-ch5-q011-D","text":"Nợ 621 / Có 153"}],"correctOptionId":"lms-ch5-q011-A","explanation":"Nợ TK 627 - Chi phí sản xuất chung, Có TK 153 - Công cụ, dụng cụ (ví dụ slide 32). B ghi ngược; C sai tài khoản; D sai khoản mục chi phí.","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 31–32","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u012","context":null,"questions":[{"id":"lms-ch5-q012","num":"Câu 12","type":"mcq","text":"TK 152 – Nguyên liệu, vật liệu thông thường có số dư cuối kỳ ở bên:","options":[{"id":"lms-ch5-q012-A","text":"Nợ"},{"id":"lms-ch5-q012-B","text":"Có"},{"id":"lms-ch5-q012-C","text":"Có thể Nợ hoặc Có"},{"id":"lms-ch5-q012-D","text":"Không có số dư"}],"correctOptionId":"lms-ch5-q012-A","explanation":"TK 152 là tài khoản tài sản, số dư cuối kỳ bên Nợ phản ánh giá trị NVL tồn kho cuối kỳ (SDCK = SDĐK + nhập - xuất).","source":"Slide Chương 5, slide 19–33 (NVL, CCDC); TT200 (TK 152, 153, 621, 627), slide 24","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u013","context":null,"questions":[{"id":"lms-ch5-q013","num":"Câu 13","type":"mcq","text":"Tiền lương phải trả cho công nhân trực tiếp sản xuất sản phẩm được ghi:","options":[{"id":"lms-ch5-q013-A","text":"Nợ 621 / Có 334"},{"id":"lms-ch5-q013-B","text":"Nợ 622 / Có 334"},{"id":"lms-ch5-q013-C","text":"Nợ 627 / Có 334"},{"id":"lms-ch5-q013-D","text":"Nợ 642 / Có 334"}],"correctOptionId":"lms-ch5-q013-B","explanation":"Lương công nhân trực tiếp sản xuất là chi phí nhân công trực tiếp - Nợ TK 622, Có TK 334.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u014","context":null,"questions":[{"id":"lms-ch5-q014","num":"Câu 14","type":"mcq","text":"Tiền lương phải trả cho nhân viên quản lý phân xưởng được ghi:","options":[{"id":"lms-ch5-q014-A","text":"Nợ 622 / Có 334"},{"id":"lms-ch5-q014-B","text":"Nợ 627 / Có 334"},{"id":"lms-ch5-q014-C","text":"Nợ 641 / Có 334"},{"id":"lms-ch5-q014-D","text":"Nợ 642 / Có 334"}],"correctOptionId":"lms-ch5-q014-B","explanation":"Lương nhân viên quản lý phân xưởng là chi phí sản xuất chung - Nợ TK 627, Có TK 334.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u015","context":null,"questions":[{"id":"lms-ch5-q015","num":"Câu 15","type":"mcq","text":"Tiền lương phải trả cho nhân viên bán hàng được ghi:","options":[{"id":"lms-ch5-q015-A","text":"Nợ 627 / Có 334"},{"id":"lms-ch5-q015-B","text":"Nợ 641 / Có 334"},{"id":"lms-ch5-q015-C","text":"Nợ 642 / Có 334"},{"id":"lms-ch5-q015-D","text":"Nợ 334 / Có 641"}],"correctOptionId":"lms-ch5-q015-B","explanation":"Lương nhân viên bán hàng là chi phí bán hàng - Nợ TK 641, Có TK 334. D ghi ngược chiều.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u016","context":null,"questions":[{"id":"lms-ch5-q016","num":"Câu 16","type":"mcq","text":"Tiền lương phải trả cho nhân viên quản lý doanh nghiệp được ghi:","options":[{"id":"lms-ch5-q016-A","text":"Nợ 627 / Có 334"},{"id":"lms-ch5-q016-B","text":"Nợ 641 / Có 334"},{"id":"lms-ch5-q016-C","text":"Nợ 642 / Có 334"},{"id":"lms-ch5-q016-D","text":"Nợ 334 / Có 642"}],"correctOptionId":"lms-ch5-q016-C","explanation":"Lương nhân viên quản lý doanh nghiệp là chi phí quản lý doanh nghiệp - Nợ TK 642, Có TK 334. D ghi ngược chiều.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u017","context":null,"questions":[{"id":"lms-ch5-q017","num":"Câu 17","type":"mcq","text":"Khấu trừ phần BHXH, BHYT, BHTN do người lao động chịu vào lương, kế toán ghi:","options":[{"id":"lms-ch5-q017-A","text":"Nợ 334 / Có 338"},{"id":"lms-ch5-q017-B","text":"Nợ 622 / Có 338"},{"id":"lms-ch5-q017-C","text":"Nợ 338 / Có 334"},{"id":"lms-ch5-q017-D","text":"Nợ 641 / Có 338"}],"correctOptionId":"lms-ch5-q017-A","explanation":"Phần NLĐ chịu không phải chi phí của DN mà trừ vào lương phải trả: Nợ TK 334, Có TK 338 (3383, 3384, 3386). B, D tính vào chi phí (phần DN chịu); C ghi ngược.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 44, 47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u018","context":null,"questions":[{"id":"lms-ch5-q018","num":"Câu 18","type":"mcq","text":"Phần các khoản trích theo lương do doanh nghiệp chịu được ghi nhận:","options":[{"id":"lms-ch5-q018-A","text":"Chỉ ghi giảm TK 334"},{"id":"lms-ch5-q018-B","text":"Tính vào chi phí theo bộ phận sử dụng lao động và ghi Có các TK 338 liên quan"},{"id":"lms-ch5-q018-C","text":"Ghi tăng nguyên giá TSCĐ"},{"id":"lms-ch5-q018-D","text":"Ghi trực tiếp vào TK 911"}],"correctOptionId":"lms-ch5-q018-B","explanation":"Phần DN chịu tính vào chi phí theo bộ phận sử dụng lao động (622, 627, 641, 642) và ghi Có TK 338. A là phần NLĐ chịu; C, D không đúng bản chất.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 44, 47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u019","context":null,"questions":[{"id":"lms-ch5-q019","num":"Câu 19","type":"mcq","text":"Khi chuyển khoản thanh toán tiền lương còn phải trả cho người lao động, kế toán ghi:","options":[{"id":"lms-ch5-q019-A","text":"Nợ 334 / Có 112"},{"id":"lms-ch5-q019-B","text":"Nợ 112 / Có 334"},{"id":"lms-ch5-q019-C","text":"Nợ 641 / Có 112"},{"id":"lms-ch5-q019-D","text":"Nợ 642 / Có 112"}],"correctOptionId":"lms-ch5-q019-A","explanation":"Thanh toán lương làm giảm nợ phải trả NLĐ và giảm tiền gửi: Nợ TK 334, Có TK 112. Chi phí đã được ghi nhận khi tính lương, không ghi lại khi trả.","source":"Slide Chương 5, slide 34–47 (tiền lương, các khoản trích theo lương); TT200 (TK 334, 338), slide 38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u020","context":null,"questions":[{"id":"lms-ch5-q020","num":"Câu 20","type":"mcq","text":"Chi phí nguyên vật liệu trực tiếp được phản ánh chủ yếu trên:","options":[{"id":"lms-ch5-q020-A","text":"TK 621"},{"id":"lms-ch5-q020-B","text":"TK 622"},{"id":"lms-ch5-q020-C","text":"TK 627"},{"id":"lms-ch5-q020-D","text":"TK 632"}],"correctOptionId":"lms-ch5-q020-A","explanation":"TK 621 - Chi phí nguyên vật liệu trực tiếp.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 50–52","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u021","context":null,"questions":[{"id":"lms-ch5-q021","num":"Câu 21","type":"mcq","text":"Chi phí nhân công trực tiếp được phản ánh chủ yếu trên:","options":[{"id":"lms-ch5-q021-A","text":"TK 621"},{"id":"lms-ch5-q021-B","text":"TK 622"},{"id":"lms-ch5-q021-C","text":"TK 627"},{"id":"lms-ch5-q021-D","text":"TK 641"}],"correctOptionId":"lms-ch5-q021-B","explanation":"TK 622 - Chi phí nhân công trực tiếp.","source":"Slide Chương 5, slide 48–64 (chi phí sản xuất, giá thành); TT200 (TK 154, 621, 622, 627), slide 53–55","status":"ok","answerBasis":"self"}]},{"id":"lms-ch5-u022","context":null,"questions":[{"id":"lms-ch5-q022","num":"Câu 22","type":"mcq","text":"Chi phí sản xuất chung được phản ánh chủ yếu trên:","options":[{"id":"lms-ch5-q022-A","text":"TK 621"},{"id"

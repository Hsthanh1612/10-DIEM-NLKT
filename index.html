h) là tài sản ngắn hạn.<\/p>","source":"Slide Chương 1, slide 26","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q066","num":"Câu 3.6.3","type":"mcq","text":"Khoản “tài sản thừa chờ xử lý” được phân loại là gì?","options":[{"id":"lms-ch1-q066-A","text":"Tài sản."},{"id":"lms-ch1-q066-B","text":"Nguồn vốn."},{"id":"lms-ch1-q066-C","text":"Không thuộc tài sản hoặc nguồn vốn."},{"id":"lms-ch1-q066-D","text":"Tất cả các phương án trên đều sai.","pinned":true}],"correctOptionId":"lms-ch1-q066-B","explanation":"<p>Theo ví dụ phân loại của slide giảng viên (slide 37–38), tài sản thừa chờ xử lý được xếp vào bên nguồn vốn (khoản chờ xử lý, doanh nghiệp phải giải quyết với bên liên quan), còn tài sản thiếu chờ xử lý xếp vào tài sản.<\/p>","source":"Slide Chương 1, slide 37–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q067","num":"Câu 3.6.4","type":"mcq","text":"Khoản “hàng gửi đi bán” được phân loại là gì?","options":[{"id":"lms-ch1-q067-A","text":"Tài sản."},{"id":"lms-ch1-q067-B","text":"Nguồn vốn."},{"id":"lms-ch1-q067-C","text":"Không thuộc tài sản hoặc nguồn vốn."},{"id":"lms-ch1-q067-D","text":"Tất cả các phương án trên đều sai.","pinned":true}],"correctOptionId":"lms-ch1-q067-A","explanation":"<p>Hàng gửi đi bán vẫn thuộc quyền kiểm soát của doanh nghiệp (chưa chuyển giao quyền kiểm soát/chưa ghi nhận doanh thu) nên là tài sản.<\/p>","source":"Slide Chương 1, slide 37–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q068","num":"Câu 3.6.5","type":"mcq","text":"Giá trị lợi nhuận sau thuế chưa phân phối (X) là bao nhiêu?","options":[{"id":"lms-ch1-q068-A","text":"1.175 triệu đồng."},{"id":"lms-ch1-q068-B","text":"935 triệu đồng."},{"id":"lms-ch1-q068-C","text":"1.135 triệu đồng."},{"id":"lms-ch1-q068-D","text":"Các phương án trên đều sai."}],"correctOptionId":"lms-ch1-q068-C","explanation":"<p>Tổng tài sản = 9.530. Nguồn vốn đã biết = 850 + 3.200 + 305 + 3.500 + 460 + 60 + 20 = 8.395. X = 9.530 - 8.395 = 1.135 triệu đồng.<\/p>","source":"Slide Chương 1, slide 36–38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u047","context":"<p>Hai người dự định thành lập Công ty thời trang \"New Fashion\" và góp vốn bằng nhau. Khi thành lập, công ty thực hiện các giao dịch sau:<\/p><ul><li>Mua một cửa hàng trị giá 4.800 triệu đồng; thanh toán ngay 40%, phần còn lại trả dần trong 2 năm và bắt đầu trả sau 1 năm kể từ ngày khai trương.<\/li><li>Mua quần áo để kinh doanh trị giá 600 triệu đồng; thanh toán ngay 80%, phần còn lại trả sau 3 tháng.<\/li><li>Mua một ô tô vận tải nhỏ trị giá 720 triệu đồng và thanh toán ngay khi nhận xe.<\/li><li>Mua dụng cụ kinh doanh trị giá 150 triệu đồng và thanh toán ngay.<\/li><li>Duy trì 200 triệu đồng tiền mặt để đáp ứng nhu cầu chi tiêu hằng ngày.<\/li><li>Vay Ngân hàng ABC 400 triệu đồng để bổ sung vốn kinh doanh.<\/li><\/ul>","questions":[{"id":"lms-ch1-q069","num":"CÂU 3.7","type":"essay","text":"Xác định tổng tài sản, tổng nợ phải trả, tổng vốn chủ sở hữu và số vốn ban đầu mà mỗi người phải góp.","answer":"<p><b>Tài sản:<\/b> cửa hàng 4.800 + quần áo 600 + ô tô 720 + dụng cụ 150 + tiền mặt 200 = <b>6.470<\/b> triệu đồng.<\/p><p><b>Nợ phải trả:<\/b> nợ người bán cửa hàng = 60% × 4.800 = 2.880; nợ người bán quần áo = 20% × 600 = 120; vay Ngân hàng ABC = 400. Tổng = <b>3.400<\/b> triệu đồng.<\/p><p><b>Vốn chủ sở hữu<\/b> = Tài sản - Nợ phải trả = 6.470 - 3.400 = <b>3.070<\/b> triệu đồng.<\/p><p><b>Vốn mỗi người góp<\/b> = 3.070 ÷ 2 = <b>1.535<\/b> triệu đồng.<\/p><p>Kiểm tra dòng tiền: tiền chi ngay = 1.920 + 480 + 720 + 150 = 3.270, cộng tiền giữ lại 200 = 3.470 = vốn góp 3.070 + vay 400.<\/p>","explanation":"<p><b>Tài sản:<\/b> cửa hàng 4.800 + quần áo 600 + ô tô 720 + dụng cụ 150 + tiền mặt 200 = <b>6.470<\/b> triệu đồng.<\/p><p><b>Nợ phải trả:<\/b> nợ người bán cửa hàng = 60% × 4.800 = 2.880; nợ người bán quần áo = 20% × 600 = 120; vay Ngân hàng ABC = 400. Tổng = <b>3.400<\/b> triệu đồng.<\/p><p><b>Vốn chủ sở hữu<\/b> = Tài sản - Nợ phải trả = 6.470 - 3.400 = <b>3.070<\/b> triệu đồng.<\/p><p><b>Vốn mỗi người góp<\/b> = 3.070 ÷ 2 = <b>1.535<\/b> triệu đồng.<\/p><p>Kiểm tra dòng tiền: tiền chi ngay = 1.920 + 480 + 720 + 150 = 3.270, cộng tiền giữ lại 200 = 3.470 = vốn góp 3.070 + vay 400.<\/p>","source":"Slide Chương 1, slide 24–29, 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q070","num":"Câu 3.7.1","type":"mcq","text":"Tài sản của công ty tại thời điểm thành lập bao gồm những khoản mục nào?","options":[{"id":"lms-ch1-q070-A","text":"Ô tô, tiền mặt, dụng cụ kinh doanh và khoản vay ngân hàng."},{"id":"lms-ch1-q070-B","text":"Phải trả người bán, cửa hàng, dụng cụ kinh doanh và tiền mặt."},{"id":"lms-ch1-q070-C","text":"Tiền mặt, dụng cụ kinh doanh, ô tô và vốn chủ sở hữu."},{"id":"lms-ch1-q070-D","text":"Cửa hàng, quần áo, ô tô, dụng cụ kinh doanh và tiền mặt."}],"correctOptionId":"lms-ch1-q070-D","explanation":"<p>Tài sản lúc thành lập: cửa hàng, quần áo, ô tô, dụng cụ kinh doanh và tiền mặt. Khoản vay, phải trả người bán và vốn chủ sở hữu là nguồn vốn.<\/p>","source":"Slide Chương 1, slide 24–28","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q071","num":"Câu 3.7.2","type":"mcq","text":"Công ty phải huy động thêm vốn từ những nguồn bên ngoài nào?","options":[{"id":"lms-ch1-q071-A","text":"Người bán cửa hàng."},{"id":"lms-ch1-q071-B","text":"Người bán quần áo."},{"id":"lms-ch1-q071-C","text":"Ngân hàng."},{"id":"lms-ch1-q071-D","text":"Tất cả các nguồn trên.","pinned":true}],"correctOptionId":"lms-ch1-q071-D","explanation":"<p>Công ty phải huy động từ bên ngoài: người bán cửa hàng (nợ trả dần), người bán quần áo (nợ 20%) và Ngân hàng ABC (vay); cả ba đều đúng.<\/p>","source":"Slide Chương 1, slide 28–29","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q072","num":"Câu 3.7.3","type":"mcq","text":"Tổng tài sản của công ty tại thời điểm thành lập là bao nhiêu?","options":[{"id":"lms-ch1-q072-A","text":"3.400 triệu đồng."},{"id":"lms-ch1-q072-B","text":"6.470 triệu đồng."},{"id":"lms-ch1-q072-C","text":"3.070 triệu đồng."},{"id":"lms-ch1-q072-D","text":"1.535 triệu đồng."}],"correctOptionId":"lms-ch1-q072-B","explanation":"<p>Tổng tài sản = 4.800 + 600 + 720 + 150 + 200 = 6.470 triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q073","num":"Câu 3.7.4","type":"mcq","text":"Số vốn ban đầu mỗi người phải góp là bao nhiêu?","options":[{"id":"lms-ch1-q073-A","text":"3.400 triệu đồng."},{"id":"lms-ch1-q073-B","text":"6.470 triệu đồng."},{"id":"lms-ch1-q073-C","text":"3.070 triệu đồng."},{"id":"lms-ch1-q073-D","text":"1.535 triệu đồng."}],"correctOptionId":"lms-ch1-q073-D","explanation":"<p>Nợ phải trả = 2.880 + 120 + 400 = 3.400; vốn chủ sở hữu = 6.470 - 3.400 = 3.070; mỗi người góp 3.070 ÷ 2 = 1.535 triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q074","num":"Câu 3.7.5","type":"mcq","text":"Tổng nợ phải trả của công ty tại thời điểm thành lập là bao nhiêu?","options":[{"id":"lms-ch1-q074-A","text":"3.400 triệu đồng."},{"id":"lms-ch1-q074-B","text":"6.470 triệu đồng."},{"id":"lms-ch1-q074-C","text":"3.070 triệu đồng."},{"id":"lms-ch1-q074-D","text":"1.535 triệu đồng."}],"correctOptionId":"lms-ch1-q074-A","explanation":"<p>Nợ phải trả = 60% × 4.800 + 20% × 600 + 400 = 2.880 + 120 + 400 = 3.400 triệu đồng.<\/p>","source":"Slide Chương 1, slide 29, 36","status":"ok","answerBasis":"self"}]}]},{"key":"ch2","title":"Chương 2 – Báo cáo tài chính","units":[{"id":"lms-ch2-u001","context":null,"questions":[{"id":"lms-ch2-q001","num":"Câu 1","type":"mcq","text":"Theo khoản 1 Điều 3 luật kế toán năm 2015 thì báo cáo tài chính của doanh nghiệp là:","options":[{"id":"lms-ch2-q001-A","text":"Hệ thống thông tin kinh tế, tài chính của đơn vị kế toán được trình bày theo biểu mẫu quy định tại chuẩn mực kế toán và chế độ kế toán"},{"id":"lms-ch2-q001-B","text":"Hệ thống thông tin kinh tế, tài chính của đơn vị kế toán được trình bày theo biểu mẫu quy định tại chế độ kế toán"},{"id":"lms-ch2-q001-C","text":"Hệ thống thông tin kinh tế, tài chính của đơn vị kế toán được trình bày theo biểu mẫu quy định tại luật kế toán"},{"id":"lms-ch2-q001-D","text":"Tất cả các phương án trên đều sai","pinned":true}],"correctOptionId":"lms-ch2-q001-A","explanation":"<p>Theo Điều 3 Luật Kế toán 2015, BCTC là hệ thống thông tin kinh tế, tài chính của đơn vị kế toán được trình bày theo biểu mẫu quy định tại <b>chuẩn mực kế toán và chế độ kế toán<\/b>. Phương án B và C thiếu/sai căn cứ quy định biểu mẫu; D sai vì A đúng.<\/p>","source":"Slide Chương 2, slide 6; Luật Kế toán 2015 (Điều 3)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u002","context":null,"questions":[{"id":"lms-ch2-q002","num":"Câu 2","type":"mcq","text":"Báo cáo tài chính phải cung cấp thông tin của một doanh nghiệp về:","options":[{"id":"lms-ch2-q002-A","text":"Tài sản, nợ phải trả, vốn chủ sở hữu"},{"id":"lms-ch2-q002-B","text":"Doanh thu, thu nhập khác, chi phí sản xuất kinh doanh và chi phí khác, lãi, lỗ và phân chia kết quả kinh doanh"},{"id":"lms-ch2-q002-C","text":"Các luồng tiền"},{"id":"lms-ch2-q002-D","text":"Tất cả các phương án trên","pinned":true}],"correctOptionId":"lms-ch2-q002-D","explanation":"<p>BCTC phải cung cấp thông tin về: tài sản; nợ phải trả; vốn chủ sở hữu; doanh thu, thu nhập khác, chi phí SXKD và chi phí khác; lãi, lỗ và phân chia kết quả kinh doanh; các luồng tiền. Cả A, B, C đều đúng nên chọn D.<\/p>","source":"Slide Chương 2, slide 6","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u003","context":null,"questions":[{"id":"lms-ch2-q003","num":"Câu 3","type":"mcq","text":"Trong điều kiện hoạt động kinh doanh bình thường, báo cáo tài chính của doanh nghiệp phải được lập dựa trên nguyên tắc?","options":[{"id":"lms-ch2-q003-A","text":"Thận trọng"},{"id":"lms-ch2-q003-B","text":"Hoạt động liên tục"},{"id":"lms-ch2-q003-C","text":"Phù hợp"},{"id":"lms-ch2-q003-D","text":"Nhất quán"}],"correctOptionId":"lms-ch2-q003-B","explanation":"<p>Theo VAS 21 và chế độ kế toán, BCTC phải được lập trên cơ sở giả định doanh nghiệp đang hoạt động liên tục và sẽ tiếp tục hoạt động bình thường trong tương lai gần. Thận trọng, phù hợp, nhất quán là các nguyên tắc/yêu cầu khác, không gắn với điều kiện &quot;hoạt động kinh doanh bình thường&quot;.<\/p>","source":"Slide Chương 2, slide 10 (VAS 21 - Trình bày BCTC); TT200 (nguyên tắc hoạt động liên tục)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u004","context":null,"questions":[{"id":"lms-ch2-q004","num":"Câu 4","type":"mcq","text":"Khi lập báo cáo tài chính: Tài sản không được ghi nhận cao hơn giá trị có thể thu hồi; Nợ phải trả không được ghi nhận thấp hơn nghĩa vụ phải thanh toán là tuân thủ nguyên tắc:","options":[{"id":"lms-ch2-q004-A","text":"Hoạt động liên tục"},{"id":"lms-ch2-q004-B","text":"Phù hợp"},{"id":"lms-ch2-q004-C","text":"Thận trọng"},{"id":"lms-ch2-q004-D","text":"Cơ sở dồn tích"}],"correctOptionId":"lms-ch2-q004-C","explanation":"<p>Đây là nội dung nguyên tắc <b>thận trọng<\/b> (tài sản và thu nhập không được ghi tăng; nợ phải trả và chi phí không được ghi giảm). Slide 12 nêu nguyên tắc này khi lập BCTC.<\/p>","source":"Slide Chương 2, slide 12","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u005","context":null,"questions":[{"id":"lms-ch2-q005","num":"Câu 5","type":"mcq","text":"BCTC lập để:","options":[{"id":"lms-ch2-q005-A","text":"Chỉ cung cấp cho nhà quản lý doanh nghiệp phục vụ mục đích ra quyết định"},{"id":"lms-ch2-q005-B","text":"Cung cấp cho Nhà nước để kiểm tra nghĩa vụ thuế của doanh nghiệp có được thực hiện hay không."},{"id":"lms-ch2-q005-C","text":"Cung cấp thông tin về tình hình tài chính, kinh doanh của đơn vị cho những đối tượng cần sử dụng thông tin trong việc đưa ra các quyết định kinh tế."},{"id":"lms-ch2-q005-D","text":"Tất cả các phương án trên đều sai","pinned":true},{"id":"lms-ch2-q005-E","text":"Có thể a hoặc b","pinned":true}],"correctOptionId":"lms-ch2-q005-C","explanation":"<p>Mục đích BCTC: cung cấp thông tin về tình hình tài chính, kinh doanh và các luồng tiền, đáp ứng yêu cầu của chủ DN, cơ quan nhà nước và những người sử dụng khác khi ra quyết định kinh tế. A và B chỉ nêu một đối tượng nên không đầy đủ; D, E sai.<\/p><p><i>Lưu ý: phương án &quot;Có thể a hoặc b&quot; trong nguồn có định dạng danh sách khác, được xem là phương án thứ 5.<\/i><\/p>","source":"Slide Chương 2, slide 7","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u006","context":null,"questions":[{"id":"lms-ch2-q006","num":"Câu 6","type":"mcq","text":"Kỳ kế toán năm của một đơn vị kế toán được xác định là?","options":[{"id":"lms-ch2-q006-A","text":"Năm dương lịch"},{"id":"lms-ch2-q006-B","text":"Năm hoạt động"},{"id":"lms-ch2-q006-C","text":"Năm âm lịch"},{"id":"lms-ch2-q006-D","text":"Cả hai đáp án a và b đều đúng","pinned":true}],"correctOptionId":"lms-ch2-q006-D","explanation":"<p>Theo Luật Kế toán 2015 (Điều 12), kỳ kế toán năm là 12 tháng, tính từ 01/01 đến hết 31/12 năm dương lịch; đơn vị có đặc thù được chọn kỳ kế toán năm là 12 tháng tròn sau khi thông báo cho cơ quan thuế (năm hoạt động). Năm âm lịch không được dùng. Vậy A và B đều đúng.<\/p>","source":"Slide Chương 2, slide 25; Luật Kế toán 2015 (Điều 12)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u007","context":null,"questions":[{"id":"lms-ch2-q007","num":"Câu 7","type":"mcq","text":"Bảng cân đối kế toán (báo cáo tình hình tài chính) cung cấp thông tin về:","options":[{"id":"lms-ch2-q007-A","text":"Các chi phí phát sinh trong doanh nghiệp"},{"id":"lms-ch2-q007-B","text":"Tình hình tài sản, nợ phải trả, vốn chủ sở hữu của doanh nghiệp tại một thời điểm xác định"},{"id":"lms-ch2-q007-C","text":"Sự biến động tài sản và nguồn vốn"},{"id":"lms-ch2-q007-D","text":"Cả 3 câu trên đều đúng","pinned":true}],"correctOptionId":"lms-ch2-q007-B","explanation":"<p>Báo cáo tình hình tài chính phản ánh giá trị tài sản và nguồn hình thành tài sản tại một thời điểm nhất định. A sai (chi phí thuộc Báo cáo KQHĐKD); C sai (là báo cáo tĩnh, không phản ánh biến động trong kỳ); D sai vì A, C sai.<\/p>","source":"Slide Chương 2, slide 31","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u008","context":null,"questions":[{"id":"lms-ch2-q008","num":"Câu 8","type":"mcq","text":"Bảng cân đối kế toán của doanh nghiệp không phản ánh thông tin nào sau đây:","options":[{"id":"lms-ch2-q008-A","text":"Khả năng thanh toán"},{"id":"lms-ch2-q008-B","text":"Cơ cấu tài sản"},{"id":"lms-ch2-q008-C","text":"Kết quả hoạt động kinh doanh trong kỳ"},{"id":"lms-ch2-q008-D","text":"Cơ cấu tài chính"}],"correctOptionId":"lms-ch2-q008-C","explanation":"<p>Kết quả hoạt động kinh doanh trong kỳ do Báo cáo kết quả hoạt động kinh doanh phản ánh. Bảng cân đối kế toán cho biết cơ cấu tài sản, cơ cấu nguồn vốn (cơ cấu tài chính) và khả năng thanh toán tại một thời điểm.<\/p>","source":"Slide Chương 2, slides 31, 35, 41","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u009","context":null,"questions":[{"id":"lms-ch2-q009","num":"Câu 9","type":"mcq","text":"Số liệu trên báo cáo tình hình tài chính phản ánh số liệu:","options":[{"id":"lms-ch2-q009-A","text":"Trong một năm hoặc một quý"},{"id":"lms-ch2-q009-B","text":"Tại một thời điểm cụ thể"},{"id":"lms-ch2-q009-C","text":"Trong một năm"},{"id":"lms-ch2-q009-D","text":"Trong một quý"}],"correctOptionId":"lms-ch2-q009-B","explanation":"<p>Báo cáo tình hình tài chính phản ánh tại <b>một thời điểm<\/b> nhất định (cuối kỳ); số liệu &quot;trong kỳ&quot; là đặc điểm của Báo cáo KQHĐKD và lưu chuyển tiền tệ.<\/p>","source":"Slide Chương 2, slide 31","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u010","context":null,"questions":[{"id":"lms-ch2-q010","num":"Câu 10","type":"mcq","text":"Nhận định nào đúng về báo cáo tình hình tài chính:","options":[{"id":"lms-ch2-q010-A","text":"Phản ánh tình hình tài sản và nguồn vốn trong một kỳ"},{"id":"lms-ch2-q010-B","text":"Phản ánh tình hình doanh thu chi phí trong một kỳ"},{"id":"lms-ch2-q010-C","text":"Phản ánh tình hình thu và chi tiền trong một kỳ"},{"id":"lms-ch2-q010-D","text":"Phản ánh tình hình tài sản và nguồn vốn tại một thời điểm"}],"correctOptionId":"lms-ch2-q010-D","explanation":"<p>Báo cáo tình hình tài chính phản ánh tài sản và nguồn vốn tại một thời điểm. B là Báo cáo KQHĐKD, C là Báo cáo lưu chuyển tiền tệ, A sai vì không phải &quot;trong một kỳ&quot;.<\/p>","source":"Slide Chương 2, slide 31","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u011","context":null,"questions":[{"id":"lms-ch2-q011","num":"Câu 11","type":"mcq","text":"Các khoản mục tài sản trong bảng cân đối kế toán được sắp xếp:","options":[{"id":"lms-ch2-q011-A","text":"Theo tính thanh khoản tăng dần"},{"id":"lms-ch2-q011-B","text":"Theo tính thanh khoản giảm dần"},{"id":"lms-ch2-q011-C","text":"Cả hai phương án a và b đều đúng","pinned":true},{"id":"lms-ch2-q011-D","text":"Cả hai phương án a và b đều sai","pinned":true}],"correctOptionId":"lms-ch2-q011-B","explanation":"<p>Tài sản được sắp xếp theo tính thanh khoản <b>giảm dần<\/b> (tiền ở đầu, tài sản dài hạn ở sau). Vậy chỉ B đúng.<\/p>","source":"Slide Chương 2, slides 13, 32, 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u012","context":null,"questions":[{"id":"lms-ch2-q012","num":"Câu 12","type":"mcq","text":"Nợ phải trả trong bảng cân đối kế toán được sắp xếp:","options":[{"id":"lms-ch2-q012-A","text":"Theo thứ tự ưu tiên chi trả giảm dần"},{"id":"lms-ch2-q012-B","text":"Theo thứ tự ưu tiền chi trả tăng dần"},{"id":"lms-ch2-q012-C","text":"Cả hai phương án a và b đều đúng","pinned":true},{"id":"lms-ch2-q012-D","text":"Cả hai phương án a và b đều sai","pinned":true}],"correctOptionId":"lms-ch2-q012-A","explanation":"<p>Nợ phải trả sắp xếp theo thứ tự ưu tiên chi trả giảm dần (nợ ngắn hạn trước, nợ dài hạn sau).<\/p>","source":"Slide Chương 2, slides 32, 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u013","context":null,"questions":[{"id":"lms-ch2-q013","num":"Câu 13","type":"mcq","text":"Phương trình cân đối nào sau đây không thuộc Bảng cân đối kế toán - báo cáo tình hình tài chính:","options":[{"id":"lms-ch2-q013-A","text":"Tài sản ngắn hạn + tài sản dài hạn = Tổng nguồn vốn"},{"id":"lms-ch2-q013-B","text":"Lợi nhuận = Doanh thu – Chi phí"},{"id":"lms-ch2-q013-C","text":"Tổng tài sản = Nợ phải trả + vốn đầu tư chủ sở hữu"},{"id":"lms-ch2-q013-D","text":"Tài sản ngắn hạn + Tài sản dài hạn = Nợ phải trả + Vốn đầu tư chủ sở hữu"}],"correctOptionId":"lms-ch2-q013-B","explanation":"<p>&quot;Lợi nhuận = Doanh thu – Chi phí&quot; là công thức của Báo cáo kết quả hoạt động kinh doanh. Các phương án còn lại đều biểu diễn cân đối Tài sản = Nguồn vốn.<\/p>","source":"Slide Chương 2, slides 33, 45-47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u014","context":null,"questions":[{"id":"lms-ch2-q014","num":"Câu 14","type":"mcq","text":"Câu phát biểu nào sau đây sai:","options":[{"id":"lms-ch2-q014-A","text":"Vốn chủ sở hữu là tiền mặt của chủ sở hữu có trong dn"},{"id":"lms-ch2-q014-B","text":"Tài sản + nợ phải trả luôn cân bằng với vốn chủ sở hữu"},{"id":"lms-ch2-q014-C","text":"Chủ sở hữu là chủ nợ của dn"},{"id":"lms-ch2-q014-D","text":"Tất cả câu trên đều sai","pinned":true}],"correctOptionId":"lms-ch2-q014-D","explanation":"<p>A sai: vốn chủ sở hữu là nguồn vốn hình thành tài sản, không phải &quot;tiền mặt&quot;. B sai: đẳng thức đúng là Tài sản = Nợ phải trả + Vốn chủ sở hữu. C sai: chủ sở hữu góp vốn, không phải chủ nợ. Cả A, B, C đều sai nên chọn D.<\/p>","source":"Slide Chương 2, slides 31-33","status":"needs_review","answerBasis":"self","reviewNote":"Câu hỏi hỏi \"phát biểu sai\" nhưng cả A, B, C đều sai; đáp án D (\"Tất cả câu trên đều sai\") được suy luận là ý đồ của đề, cần giảng viên xác nhận."}]},{"id":"lms-ch2-u015","context":null,"questions":[{"id":"lms-ch2-q015","num":"Câu 15","type":"mcq","text":"Trên Bảng cân đối kế toán, Chứng khoán có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng được ghi nhận vào:","options":[{"id":"lms-ch2-q015-A","text":"Đầu tư khác"},{"id":"lms-ch2-q015-B","text":"Các khoản tương đương tiền"},{"id":"lms-ch2-q015-C","text":"Tiền"},{"id":"lms-ch2-q015-D","text":"Đầu tư tài chính ngắn hạn"}],"correctOptionId":"lms-ch2-q015-B","explanation":"<p>Chứng khoán có thời hạn thu hồi hoặc đáo hạn không quá 3 tháng được coi là &quot;Các khoản tương đương tiền&quot;.<\/p>","source":"Slide Chương 2, slide 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u016","context":null,"questions":[{"id":"lms-ch2-q016","num":"Câu 16","type":"mcq","text":"Hàng hóa nào sau đây sẽ không được tính vào khi xác định giá trị hàng tồn kho của công ty","options":[{"id":"lms-ch2-q016-A","text":"Hàng hóa giữ hộ công ty khác"},{"id":"lms-ch2-q016-B","text":"Hàng hóa đã mua đang vận chuyển về kho, điều kiện giao hàng FOB điểm đi"},{"id":"lms-ch2-q016-C","text":"Hàng hóa được vận chuyển khi ký gửi cho một công ty khác"},{"id":"lms-ch2-q016-D","text":"Không có câu nào đúng","pinned":true}],"correctOptionId":"lms-ch2-q016-A","explanation":"<p>Hàng tồn kho chỉ gồm hàng thuộc quyền sở hữu của doanh nghiệp. Hàng giữ hộ công ty khác không thuộc quyền sở hữu nên không tính. Hàng mua FOB điểm đi: quyền sở hữu chuyển cho bên mua khi hàng giao lên phương tiện vận chuyển nên vẫn tính vào HTK của bên mua (hàng đang đi đường). Hàng gửi đi ký gửi vẫn thuộc sở hữu của doanh nghiệp nên vẫn tính.<\/p>","source":"Kiến thức hàng tồn kho (VAS 02; TT200); Slide Chương 2 (khoản mục hàng tồn kho)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u017","context":null,"questions":[{"id":"lms-ch2-q017","num":"Câu 17","type":"mcq","text":"DN đang xây nhà kho, công trình xây dựng dở dang này là:","options":[{"id":"lms-ch2-q017-A","text":"Nguồn hình thành nên tài sản của dn"},{"id":"lms-ch2-q017-B","text":"Tài sản của doanh nghiệp"},{"id":"lms-ch2-q017-C","text":"Tùy thuộc quan điểm của từng thành viên kế toán"},{"id":"lms-ch2-q017-D","text":"Phụ thuộc vào quy định của doanh nghiệp"}],"correctOptionId":"lms-ch2-q017-B","explanation":"<p>Công trình xây dựng cơ bản dở dang (TK 241) là tài sản của doanh nghiệp (tài sản dài hạn), không phải nguồn vốn.<\/p>","source":"Slide Chương 2, slides 31-34; TT200 (TK 241)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u018","context":null,"questions":[{"id":"lms-ch2-q018","num":"Câu 18","type":"mcq","text":"Tài khoản 221 – Đầu tư góp vốn vào công ty con là tài khoản gì?","options":[{"id":"lms-ch2-q018-A","text":"Tài khoản phản ánh nguồn vốn"},{"id":"lms-ch2-q018-B","text":"Tài khoản phản ánh tài sản"},{"id":"lms-ch2-q018-C","text":"Tài khoản điều chỉnh tăng nguồn vốn"},{"id":"lms-ch2-q018-D","text":"Tài khoản điều chỉnh giảm tài sản"}],"correctOptionId":"lms-ch2-q018-B","explanation":"<p>TK 221 &quot;Đầu tư vào công ty con&quot; là tài khoản loại 2, phản ánh tài sản (đầu tư tài chính dài hạn), số dư Nợ.<\/p>","source":"Slide Chương 2, slide 38; TT200 (TK 221)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u019","context":null,"questions":[{"id":"lms-ch2-q019","num":"Câu 19","type":"mcq","text":"Nợ phải trả phát sinh do","options":[{"id":"lms-ch2-q019-A","text":"Lập hóa đơn và dịch vụ đã thực hiện cho KH"},{"id":"lms-ch2-q019-B","text":"Mua thiết bị bằng tiền"},{"id":"lms-ch2-q019-C","text":"Trả tiền cho người bán về vật dụng đã mua"},{"id":"lms-ch2-q019-D","text":"Mua hàng hóa chưa thanh toán"}],"correctOptionId":"lms-ch2-q019-D","explanation":"<p>Mua hàng chưa thanh toán làm phát sinh nghĩa vụ phải trả người bán. A làm phát sinh khoản phải thu; B là tài sản này tăng, tài sản kia giảm; C làm giảm nợ phải trả.<\/p>","source":"Kiến thức nợ phải trả (TT200 TK 331); Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u020","context":null,"questions":[{"id":"lms-ch2-q020","num":"Câu 20","type":"mcq","text":"Nghiệp vụ nộp tiền mặt vào ngân hàng thuộc quan hệ đối ứng:","options":[{"id":"lms-ch2-q020-A","text":"Nguốn vốn tăng – nguồn vốn giảm"},{"id":"lms-ch2-q020-B","text":"Tài sản tăng – nguồn vốn tăng"},{"id":"lms-ch2-q020-C","text":"Tài sản giảm – nguồn vốn giảm"},{"id":"lms-ch2-q020-D","text":"Tài sản tăng – tài sản giảm"}],"correctOptionId":"lms-ch2-q020-D","explanation":"<p>Nợ TK 112 / Có TK 111: tiền gửi ngân hàng tăng, tiền mặt giảm cùng giá trị, tổng tài sản không đổi (loại 1 của slide 40).<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u021","context":null,"questions":[{"id":"lms-ch2-q021","num":"Câu 21","type":"mcq","text":"Nghiệp vụ: Mua nguyên vật liệu chưa thanh toán cho người bán thuộc quan hệ đối ứng tài khoản:","options":[{"id":"lms-ch2-q021-A","text":"Nguốn vốn tăng – nguồn vốn giảm"},{"id":"lms-ch2-q021-B","text":"Tài sản tăng – nguồn vốn tăng (nợ phải trả tăng)"},{"id":"lms-ch2-q021-C","text":"Tài sản giảm – nguồn vốn giảm"},{"id":"lms-ch2-q021-D","text":"Tài sản tăng – tài sản giảm"}],"correctOptionId":"lms-ch2-q021-B","explanation":"<p>Nợ TK 152 / Có TK 331: nguyên vật liệu (tài sản) tăng, phải trả người bán (nguồn vốn) tăng cùng giá trị (loại 3 của slide 40).<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u022","context":null,"questions":[{"id":"lms-ch2-q022","num":"Câu 22","type":"mcq","text":"Nghiệp vụ: Chủ sở hữu góp thêm vốn vào doanh nghiệp chuyển khoản qua nh thuộc quan hệ đối ứng:","options":[{"id":"lms-ch2-q022-A","text":"Nguốn vốn tăng – nguồn vốn giảm"},{"id":"lms-ch2-q022-B","text":"Tài sản tăng – nguồn vốn tăng (VCSH tăng)"},{"id":"lms-ch2-q022-C","text":"Tài sản giảm – nguồn vốn giảm"},{"id":"lms-ch2-q022-D","text":"Tài sản tăng – tài sản giảm"}],"correctOptionId":"lms-ch2-q022-B","explanation":"<p>Nợ TK 112 / Có TK 411: tiền gửi ngân hàng (tài sản) tăng, vốn đầu tư của chủ sở hữu tăng.<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u023","context":null,"questions":[{"id":"lms-ch2-q023","num":"Câu 23","type":"mcq","text":"Nghiệp vụ: Chuyển khoản trả nợ khoản vay ngắn hạn thuộc quan hệ đối ứng tài khoản","options":[{"id":"lms-ch2-q023-A","text":"Nguốn vốn tăng – nguồn vốn giảm"},{"id":"lms-ch2-q023-B","text":"Tài sản tăng – nguồn vốn tăng"},{"id":"lms-ch2-q023-C","text":"Tài sản giảm – nguồn vốn giảm"},{"id":"lms-ch2-q023-D","text":"Tài sản tăng – tài sản giảm"}],"correctOptionId":"lms-ch2-q023-C","explanation":"<p>Nợ TK 341 / Có TK 112: vay ngắn hạn (nguồn vốn) giảm, tiền gửi ngân hàng (tài sản) giảm cùng giá trị (loại 4 của slide 40).<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u024","context":null,"questions":[{"id":"lms-ch2-q024","num":"Câu 24","type":"mcq","text":"Nghiệp vụ “Đơn vị mua tài sản cố định trị giá 600 triệu đồng, chưa thanh toán tiền hàng cho người bán” làm giá trị bảng cân đối kế toán thay đổi như thế nào?","options":[{"id":"lms-ch2-q024-A","text":"Tài sản cố định tăng 600, nợ phải trả tăng 600, tổng tài sản tăng 1.200"},{"id":"lms-ch2-q024-B","text":"Tài sản cố định tăng 600, nợ phải trả tăng 600, tổng tài sản tăng 600"},{"id":"lms-ch2-q024-C","text":"Tài sản cố định tăng 600, nợ phải trả giảm 600, tổng tài sản không đổi"},{"id":"lms-ch2-q024-D","text":"Tài sản cố định tăng 600, tiền mặt giảm 65, tổng tài sản không đổi"}],"correctOptionId":"lms-ch2-q024-B","explanation":"<p>Nợ TK 211 600 / Có TK 331 600 (bỏ qua thuế GTGT): TSCĐ +600, nợ phải trả +600, tổng tài sản và tổng nguồn vốn cùng tăng 600.<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u025","context":null,"questions":[{"id":"lms-ch2-q025","num":"Câu 25","type":"mcq","text":"Công ty ABC mua một lô hàng hóa trị giá 300 triệu VNĐ, đã thanh toán 50% bằng chuyển khoản. Nghiệp vụ này làm cho","options":[{"id":"lms-ch2-q025-A","text":"Tổng Tài sản của công ty không thay đổi."},{"id":"lms-ch2-q025-B","text":"Tổng Tài sản của công ty tăng thêm 300."},{"id":"lms-ch2-q025-C","text":"Tổng Tài sản của công ty giảm đi 150."},{"id":"lms-ch2-q025-D","text":"Tổng Tài sản của công ty tăng thêm 150"}],"correctOptionId":"lms-ch2-q025-D","explanation":"<p>Hàng hóa +300; tiền gửi ngân hàng -150; phải trả người bán +150. Tổng tài sản thay đổi: +300 - 150 = <b>+150<\/b> (tổng nguồn vốn cũng +150).<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u026","context":null,"questions":[{"id":"lms-ch2-q026","num":"Câu 26","type":"mcq","text":"Nghiệp vụ “Doanh nghiệp vay ngân hàng 500 triệu đồng để thanh toán tiền mua nguyên vật liệu kì trước còn nợ người bán” sẽ làm Bảng báo cáo tình hình tài chính của doanh nghiệp thay đổi như thế nào?","options":[{"id":"lms-ch2-q026-A","text":"Tổng cộng nguồn vốn của đơn vị không đổi, tỷ trọng của các khoản mục thay đổi"},{"id":"lms-ch2-q026-B","text":"Tổng cộng tài sản của đơn vị và tỷ trọng của các khoản mục thay đổi"},{"id":"lms-ch2-q026-C","text":"Tổng cộng nguồn vốn của đơn vị và tỷ trọng của các khoản mục không đổi"},{"id":"lms-ch2-q026-D","text":"Tổng nguồn vốn của đơn vị giảm"}],"correctOptionId":"lms-ch2-q026-A","explanation":"<p>Nợ TK 331 / Có TK 341: phải trả người bán giảm 500, vay ngắn hạn tăng 500, một loại nguồn vốn tăng và một loại nguồn vốn giảm cùng giá trị. Tổng nguồn vốn (và tổng tài sản) không đổi, nhưng tỷ trọng các khoản mục thay đổi (loại 2 của slide 40).<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u027","context":null,"questions":[{"id":"lms-ch2-q027","num":"Câu 27","type":"mcq","text":"Khi lập báo cáo, kế toán ghi nhầm khoản mục “Hao mòn tài sản cố định” là: 200 sang phần nguồn vốn, sai sót này sẽ làm ảnh hưởng đến mối quan hệ giữa tổng tài sản và tổng nguồn vốn trên bảng cân đối kế toán","options":[{"id":"lms-ch2-q027-A","text":"Tài sản và Nguồn vốn vẫn cân bằng."},{"id":"lms-ch2-q027-B","text":"Tài sản nhỏ hơn Nguồn vốn 400."},{"id":"lms-ch2-q027-C","text":"Tài sản nhỏ hơn Nguồn vốn: 200."},{"id":"lms-ch2-q027-D","text":"Tài sản lớn hơn Nguồn vốn: 40"}],"correctOptionId":"lms-ch2-q027-A","explanation":"<p>Đúng ra hao mòn TSCĐ ghi âm (-200) ở phần tài sản nên Tổng TS = T - 200 = Tổng NV. Nếu bỏ ghi âm ở tài sản (TS = T) và ghi nhầm +200 vào nguồn vốn (NV = T - 200 + 200 = T) thì hai bên vẫn bằng nhau (cùng thêm 200). Do đó vẫn cân bằng, nhưng cả tổng tài sản và tổng nguồn vốn đều bị phản ánh cao hơn thực tế 200.<\/p>","source":"Slide Chương 2, slides 38-39 (TK 214 ghi âm phần tài sản)","status":"needs_review","answerBasis":"self","reviewNote":"Đáp án phụ thuộc cách hiểu \"ghi nhầm sang nguồn vốn\" (ghi dương 200 vào NV => vẫn cân; nếu ghi âm 200 vào NV thì TS lớn hơn NV 400, không có trong phương án). Chọn A theo cách hiểu thứ nhất; cần xác nhận."}]},{"id":"lms-ch2-u028","context":null,"questions":[{"id":"lms-ch2-q028","num":"Câu 28","type":"mcq","text":"Khi lập báo cáo tình hình tài chính, kế toán sẽ căn cứ vào:","options":[{"id":"lms-ch2-q028-A","text":"Số dư của các tài khoản từ loại 1 đến loại 4 trên sổ cái và sổ chi tiết"},{"id":"lms-ch2-q028-B","text":"Số dư của các tài khoản từ loại 5 đến loại 9 trên sổ cái và sổ chi tiết"},{"id":"lms-ch2-q028-C","text":"Số dư của các tài khoản từ loại 1 đến loại 9 trên sổ cái và sổ chi tiết"},{"id":"lms-ch2-q028-D","text":"Các câu trên đều sai","pinned":true}],"correctOptionId":"lms-ch2-q028-A","explanation":"<p>Báo cáo tình hình tài chính lập từ số dư cuối kỳ của các tài khoản tổng hợp và chi tiết loại 1, 2, 3, 4 (tài sản, nợ phải trả, vốn chủ sở hữu). Tài khoản loại 5-9 dùng lập Báo cáo KQHĐKD.<\/p>","source":"Slide Chương 2, slides 37, 44","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u029","context":null,"questions":[{"id":"lms-ch2-q029","num":"Câu 29","type":"mcq","text":"Nếu có các số liệu về tài sản, nguồn vốn như sau (đơn vị tính:triệu đồng): tiền mặt: 40, hàng hóa: 60, tài sản cố định hữu hình: 100, hao mòn tài sản cố định: 30, vay ngân hàng: 40, vốn đầu tư của chủ sở hữu: 110 thì lợi nhuận sau thuế chưa phân phối là:","options":[{"id":"lms-ch2-q029-A","text":"80"},{"id":"lms-ch2-q029-B","text":"20"},{"id":"lms-ch2-q029-C","text":"40"},{"id":"lms-ch2-q029-D","text":"60"}],"correctOptionId":"lms-ch2-q029-B","explanation":"<p>Tổng tài sản = 40 + 60 + 100 - 30 = 170. Nguồn vốn = Vay 40 + Vốn đầu tư 110 + LNST chưa phân phối = 170, suy ra LNST chưa phân phối = 170 - 150 = <b>20<\/b>.<\/p>","source":"Slide Chương 2, slides 33, 38-39","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u030","context":null,"questions":[{"id":"lms-ch2-q030","num":"Câu 30","type":"mcq","text":"Bảng Cân đối kế toán của công ty X ngày 01/01/N gồm (đơn vị tính: triệu đồng): tiền mặt: 300, nợ người bán 800. Tài sản cố định 1.400 và vốn chủ sở hữu. Sau nghiệp vụ kinh tế “vay ngắn hạn ngân hàng để thanh toán tiền mua nguyên vật liệu, trị giá 500, số nguyên vật liệu đã được nhập kho” phát sinh thì Tổng tài sản và Vốn chủ sở hữu sẽ là:","options":[{"id":"lms-ch2-q030-A","text":"1.700 và 900"},{"id":"lms-ch2-q030-B","text":"2.200 và 900"},{"id":"lms-ch2-q030-C","text":"2.200 và 1.300"},{"id":"lms-ch2-q030-D","text":"1.700 và 2.200"}],"correctOptionId":"lms-ch2-q030-B","explanation":"<p>Ban đầu: Tài sản = 300 + 1.400 = 1.700; VCSH = 1.700 - 800 = 900. Nghiệp vụ: Nợ TK 152 500 / Có TK 341 500 (NVL tăng 500, vay ngắn hạn tăng 500) nên Tổng tài sản = 1.700 + 500 = 2.200; VCSH không đổi = 900.<\/p><p>Kiểm tra: 800 + 500 + 900 = 2.200.<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u031","context":null,"questions":[{"id":"lms-ch2-q031","num":"Câu 31","type":"mcq","text":"Báo cáo kết quả hoạt động kinh doanh là báo cáo tài chính tổng hợp phản ánh tình hình và kết quả hoạt động kinh doanh:","options":[{"id":"lms-ch2-q031-A","text":"Tại thời điểm báo cáo"},{"id":"lms-ch2-q031-B","text":"Trong kỳ kế toán của đơn vị"},{"id":"lms-ch2-q031-C","text":"Trong hoạt động bán hàng"},{"id":"lms-ch2-q031-D","text":"Trong nghĩa vụ phải thực hiện với ngân sách Nhà nước"}],"correctOptionId":"lms-ch2-q031-B","explanation":"<p>Báo cáo KQHĐKD phản ánh kết quả kinh doanh trong một khoảng thời gian nhất định (một kỳ kế toán).<\/p>","source":"Slide Chương 2, slide 41","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u032","context":null,"questions":[{"id":"lms-ch2-q032","num":"Câu 32","type":"mcq","text":"Thông tin trên Báo cáo kết quả kinh doanh:","options":[{"id":"lms-ch2-q032-A","text":"Phản ánh kết quả kinh doanh và chỉ rõ nguyên nhân về khả năng sinh lời của doanh nghiệp, tình hình thực hiện trách nhiệm, nghĩa vụ của DN đối với Nhà nước về khoản thuế và các khoản phải nộp khác."},{"id":"lms-ch2-q032-B","text":"Tình hình tài sản và nợ phải trả trong kỳ"},{"id":"lms-ch2-q032-C","text":"Tình hình bán hàng và cung cấp dịch vụ tại thời điểm cuối kỳ kế toán"},{"id":"lms-ch2-q032-D","text":"Tất cả các phương án trên đều sai.","pinned":true}],"correctOptionId":"lms-ch2-q032-A","explanation":"<p>Báo cáo KQHĐKD cung cấp thông tin về kết quả kinh doanh, cơ cấu thu nhập, khả năng sinh lời và tình hình thực hiện nghĩa vụ với Nhà nước. B là nội dung của báo cáo tình hình tài chính; C sai vì báo cáo phản ánh trong kỳ.<\/p>","source":"Slide Chương 2, slides 42-43","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u033","context":null,"questions":[{"id":"lms-ch2-q033","num":"Câu 33","type":"mcq","text":"Doanh nghiệp X có tình hình doanh thu, thu nhập và chi phí như sau:<br>Giá vốn hàng bán: 1.800, doanh thu hoạt động tài chính: 200, doanh thu bán hàng và cung cấp dịch vụ: 2.800, chi phí tài chính: 300, chi phí khác: 200, chi phí quản lý doanh nghiệp: 400, chi phí bán hàng: 300, thu nhập khác: 100. Giả định thuế suất thuế thu nhập doanh nghiệp là 20%. Lợi nhuận sau thuế của doanh nghiệp X sẽ là:","options":[{"id":"lms-ch2-q033-A","text":"150"},{"id":"lms-ch2-q033-B","text":"50"},{"id":"lms-ch2-q033-C","text":"200"},{"id":"lms-ch2-q033-D","text":"Số khác: 80"}],"correctOptionId":"lms-ch2-q033-D","explanation":"<p>Lợi nhuận gộp = 2.800 - 1.800 = 1.000. LN thuần từ HĐKD = 1.000 + 200 - 300 - 300 - 400 = 200. LN khác = 100 - 200 = -100. LN trước thuế = 200 - 100 = 100. Thuế TNDN = 100 x 20% = 20. LN sau thuế = 100 - 20 = <b>80<\/b>.<\/p>","source":"Slide Chương 2, slides 45-47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u034","context":null,"questions":[{"id":"lms-ch2-q034","num":"Câu 35","type":"mcq","text":"Số dư bên Nợ của tài khoản Phải trả người bán (331) được:","options":[{"id":"lms-ch2-q034-A","text":"Ghi bình thường bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"lms-ch2-q034-B","text":"Ghi âm bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"lms-ch2-q034-C","text":"Ghi bình thường bên phần Nguồn vốn của Báo cáo tình hình tài chính"},{"id":"lms-ch2-q034-D","text":"Ghi số âm bên phần Nguồn vốn của Báo cáo tình hình tài chính"}],"correctOptionId":"lms-ch2-q034-A","explanation":"<p>TK 331 là tài khoản hỗn hợp, không được bù trừ. Số dư Nợ (ứng trước cho người bán) là một khoản phải thu, ghi dương ở phần Tài sản; số dư Có ghi dương ở phần Nguồn vốn.<\/p>","source":"Slide Chương 2, slides 38-39","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u035","context":null,"questions":[{"id":"lms-ch2-q035","num":"Câu 36","type":"mcq","text":"Nợ phải trả là nghĩa vụ hiện tại của doanh nghiệp phát sinh từ:","options":[{"id":"lms-ch2-q035-A","text":"Các giao dịch và sự kiện đang phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"lms-ch2-q035-B","text":"Các giao dịch và sự kiện sẽ phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"lms-ch2-q035-C","text":"Các giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"lms-ch2-q035-D","text":"Các giao dịch và sự kiện đã và sẽ phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."}],"correctOptionId":"lms-ch2-q035-C","explanation":"<p>Theo VAS 01, nợ phải trả là nghĩa vụ hiện tại của doanh nghiệp phát sinh từ các giao dịch và sự kiện <b>đã qua<\/b>, mà doanh nghiệp phải thanh toán bằng các nguồn lực của mình. Giao dịch sẽ phát sinh chưa tạo nghĩa vụ hiện tại.<\/p>","source":"VAS 01 - Chuẩn mực chung; Slide Chương 2, slide 6","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u036","context":null,"questions":[{"id":"lms-ch2-q036","num":"Câu 37","type":"mcq","text":"Doanh nghiệp phải trình bày các luồng tiền trên Báo cáo lưu chuyển tiền tệ theo ba loại hoạt động nào?","options":[{"id":"lms-ch2-q036-A","text":"Hoạt động kinh doanh, hoạt động đầu tư, hoạt động khác."},{"id":"lms-ch2-q036-B","text":"Hoạt động kinh doanh, hoạt động đầu tư, hoạt động tài chính."},{"id":"lms-ch2-q036-C","text":"Hoạt động kinh doanh, hoạt động tài chính, hoạt động dịch vụ."},{"id":"lms-ch2-q036-D","text":"Hoạt động kinh doanh, hoạt động thương mại, hoạt động dịch vụ."}],"correctOptionId":"lms-ch2-q036-B","explanation":"<p>Báo cáo lưu chuyển tiền tệ gồm lưu chuyển tiền từ hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính.<\/p>","source":"Slide Chương 2, slide 50","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u037","context":null,"questions":[{"id":"lms-ch2-q037","num":"Câu 38","type":"mcq","text":"Thông tin mà BCTC của doanh nghiệp không cần phải cung cấp là:","options":[{"id":"lms-ch2-q037-A","text":"Tài sản"},{"id":"lms-ch2-q037-B","text":"Nợ phải trả"},{"id":"lms-ch2-q037-C","text":"Vốn chủ sở hữu."},{"id":"lms-ch2-q037-D","text":"Định phí"}],"correctOptionId":"lms-ch2-q037-D","explanation":"<p>BCTC cung cấp thông tin về tài sản, nợ phải trả, vốn chủ sở hữu, doanh thu, chi phí, lãi lỗ, luồng tiền. Việc phân loại chi phí thành định phí/biến phí thuộc kế toán quản trị, không bắt buộc trên BCTC.<\/p>","source":"Slide Chương 2, slide 6","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u038","context":null,"questions":[{"id":"lms-ch2-q038","num":"Câu 39","type":"mcq","text":"Báo tài chính phản ánh tình hình và kết quả hoạt động kinh doanh của doanh nghiệp là:","options":[{"id":"lms-ch2-q038-A","text":"Báo cáo tình hình tài chính"},{"id":"lms-ch2-q038-B","text":"Báo cáo lưu chuyển tiền tệ"},{"id":"lms-ch2-q038-C","text":"Báo cáo kết quả hoạt động kinh doanh."},{"id":"lms-ch2-q038-D","text":"Thuyết minh báo cáo tài chính."}],"correctOptionId":"lms-ch2-q038-C","explanation":"<p>Báo cáo kết quả hoạt động kinh doanh (Mẫu B 02 - DN) phản ánh tình hình và kết quả kinh doanh trong kỳ.<\/p>","source":"Slide Chương 2, slides 29, 41","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u039","context":null,"questions":[{"id":"lms-ch2-q039","num":"Câu 40","type":"mcq","text":"Có kết quả về một số chỉ tiêu trên Báo cáo kết quả hoạt động kinh doanh của công ty A trong kỳ như sau: Doanh thu bán hàng và cung cấp dịch vụ: 11.231 triệu đồng; Các khoản giảm trừ doanh thu: 2.596 triệu đồng. Vậy doanh thu thuần về bán hàng và cung cấp dịch vụ của công ty A trong kỳ là:","options":[{"id":"lms-ch2-q039-A","text":"8.635 triệu đồng"},{"id":"lms-ch2-q039-B","text":"11.231 triệu đồng"},{"id":"lms-ch2-q039-C","text":"13.827 triệu đồng"},{"id":"lms-ch2-q039-D","text":"9.431 triệu đồng"}],"correctOptionId":"lms-ch2-q039-A","explanation":"<p>Doanh thu thuần = Doanh thu bán hàng và cung cấp dịch vụ - Các khoản giảm trừ = 11.231 - 2.596 = <b>8.635<\/b> triệu đồng.<\/p>","source":"Slide Chương 2, slide 46","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u040","context":null,"questions":[{"id":"lms-ch2-q040","num":"Câu 41","type":"mcq","text":"Trên Báo cáo kết quả hoạt động kinh doanh của doanh nghiệp, lợi nhuận thuần từ hoạt động kinh doanh được tính như thế nào ?","options":[{"id":"lms-ch2-q040-A","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Lợi nhuận từ hoạt động tài chính + Kết quả từ hoạt động khác."},{"id":"lms-ch2-q040-B","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Doanh thu từ hoạt động tài chính – Chi phí từ hoạt động tài chính."},{"id":"lms-ch2-q040-C","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ – Chi phí bán hàng – Chi phí quản lý doanh nghiệp."},{"id":"lms-ch2-q040-D","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Doanh thu từ hoạt động tài chính – Chi phí từ hoạt động tài chính – Chi phí bán hàng – Chi phí quản lý doanh nghiệp."}],"correctOptionId":"lms-ch2-q040-D","explanation":"<p>LN thuần từ HĐKD = DT thuần về BH&amp;CCDV + DT hoạt động tài chính - Chi phí HĐKD (giá vốn + chi phí tài chính + chi phí bán hàng + chi phí QLDN) = LN gộp + DTTC - CPTC - CPBH - CPQLDN. A sai vì cộng cả kết quả hoạt động khác (LN khác tính sau); B và C thiếu khoản mục.<\/p>","source":"Slide Chương 2, slides 46-47","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u041","context":null,"questions":[{"id":"lms-ch2-q041","num":"Câu 50","type":"mcq","text":"Trên Báo cáo tình hình tài chính, khoản Quỹ khen thưởng, phúc lợi của doanh nghiệp được xếp vào nhóm nào?","options":[{"id":"lms-ch2-q041-A","text":"Tài sản ngắn hạn"},{"id":"lms-ch2-q041-B","text":"Nợ phải trả"},{"id":"lms-ch2-q041-C","text":"Vốn chủ sở hữu"},{"id":"lms-ch2-q041-D","text":"Doanh thu chưa thực hiện"}],"correctOptionId":"lms-ch2-q041-B","explanation":"<p>Theo TT200, Quỹ khen thưởng, phúc lợi (TK 353) trình bày ở phần Nợ phải trả (nợ ngắn hạn, mã số 322). Không phải tài sản; không phải vốn chủ sở hữu theo TT200; doanh thu chưa thực hiện là khoản mục khác.<\/p>","source":"TT200 (TK 353, Mẫu B01-DN); Slide Chương 2, slide 33","status":"needs_review","answerBasis":"self","reviewNote":"Slide giảng viên không nêu; theo TT200 là Nợ phải trả. Một số giáo trình xếp quỹ khen thưởng phúc lợi vào nguồn vốn/VCSH (phương án C), cần đối chiếu giáo trình."}]},{"id":"lms-ch2-u042","context":null,"questions":[{"id":"lms-ch2-q042","num":"Câu 51","type":"mcq","text":"Doanh nghiệp có chu kỳ kinh doanh bình thường là 12 tháng. Một khoản phải thu dự kiến được thu hồi sau 8 tháng kể từ ngày lập báo cáo được phân loại là:","options":[{"id":"lms-ch2-q042-A","text":"Tài sản ngắn hạn"},{"id":"lms-ch2-q042-B","text":"Tài sản dài hạn"},{"id":"lms-ch2-q042-C","text":"Nợ phải trả ngắn hạn"},{"id":"lms-ch2-q042-D","text":"Vốn chủ sở hữu"}],"correctOptionId":"lms-ch2-q042-A","explanation":"<p>Tài sản dự kiến thu hồi trong thời hạn từ 12 tháng trở xuống kể từ ngày kết thúc kỳ kế toán (hoặc trong một chu kỳ kinh doanh thông thường) được phân loại là tài sản ngắn hạn. 8 tháng &le; 12 tháng nên là tài sản ngắn hạn.<\/p>","source":"Slide Chương 2, slides 13-14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u043","context":null,"questions":[{"id":"lms-ch2-q043","num":"Câu 52","type":"mcq","text":"Một khoản vay của doanh nghiệp dự kiến phải thanh toán sau 18 tháng kể từ ngày lập Báo cáo tình hình tài chính được phân loại là:","options":[{"id":"lms-ch2-q043-A","text":"Tài sản dài hạn"},{"id":"lms-ch2-q043-B","text":"Nợ phải trả ngắn hạn"},{"id":"lms-ch2-q043-C","text":"Nợ phải trả dài hạn"},{"id":"lms-ch2-q043-D","text":"Vốn chủ sở hữu"}],"correctOptionId":"lms-ch2-q043-C","explanation":"<p>Khoản vay đến hạn thanh toán sau hơn 12 tháng kể từ ngày kết thúc kỳ kế toán không thuộc nợ ngắn hạn nên là nợ phải trả dài hạn.<\/p>","source":"Slide Chương 2, slides 15-17","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u044","context":null,"questions":[{"id":"lms-ch2-q044","num":"Câu 53","type":"mcq","text":"Khoản chi phí đã phát sinh nhưng được phân bổ cho nhiều kỳ kế toán tiếp theo thường được trình bày trên Báo cáo tình hình tài chính thuộc nhóm:","options":[{"id":"lms-ch2-q044-A","text":"Tài sản"},{"id":"lms-ch2-q044-B","text":"Nợ phải trả"},{"id":"lms-ch2-q044-C","text":"Vốn chủ sở hữu"},{"id":"lms-ch2-q044-D","text":"Doanh thu"}],"correctOptionId":"lms-ch2-q044-A","explanation":"<p>Chi phí trả trước (chờ phân bổ) cho nhiều kỳ là tài sản (TK 242, tài sản ngắn hạn hoặc dài hạn tùy thời gian phân bổ), vì sẽ đem lại lợi ích kinh tế ở các kỳ sau.<\/p>","source":"TT200 (TK 242); Slide Chương 2, slides 13-14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u045","context":null,"questions":[{"id":"lms-ch2-q045","num":"Câu 54","type":"mcq","text":"Doanh nghiệp trích lập dự phòng giảm giá cho một số hàng tồn kho bị giảm giá trị. Khoản dự phòng này được trình bày liên quan đến nhóm:","options":[{"id":"lms-ch2-q045-A","text":"Tài sản ngắn hạn"},{"id":"lms-ch2-q045-B","text":"Tài sản dài hạn"},{"id":"lms-ch2-q045-C","text":"Nợ phải trả"},{"id":"lms-ch2-q045-D","text":"Vốn chủ sở hữu"}],"correctOptionId":"lms-ch2-q045-A","explanation":"<p>Dự phòng giảm giá hàng tồn kho (TK 229) là tài khoản điều chỉnh giảm tài sản, số dư Có ghi số âm ở phần tài sản; hàng tồn kho thuộc tài sản ngắn hạn nên khoản dự phòng liên quan nhóm tài sản ngắn hạn.<\/p>","source":"Slide Chương 2, slides 38-39 (TK 229)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u046","context":null,"questions":[{"id":"lms-ch2-q046","num":"Câu 55","type":"mcq","text":"Chi phí của sản phẩm đang trong quá trình chế biến, chưa hoàn thành tại thời điểm cuối kỳ được kế toán phản ánh là:","options":[{"id":"lms-ch2-q046-A","text":"Chi phí bán hàng"},{"id":"lms-ch2-q046-B","text":"Chi phí sản xuất kinh doanh dở dang và thuộc tài sản"},{"id":"lms-ch2-q046-C","text":"Nợ phải trả"},{"id":"lms-ch2-q046-D","text":"Chi phí quản lý doanh nghiệp"}],"correctOptionId":"lms-ch2-q046-B","explanation":"<p>Sản phẩm dở dang cuối kỳ được phản ánh trên TK 154 &quot;Chi phí sản xuất, kinh doanh dở dang&quot;, là hàng tồn kho thuộc tài sản.<\/p>","source":"TT200 (TK 154); Slide Chương 2, slides 33-34","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u047","context":null,"questions":[{"id":"lms-ch2-q047","num":"Câu 56","type":"mcq","text":"Một doanh nghiệp sản xuất đồ gỗ mua một máy khoan cầm tay có giá trị nhỏ, thời gian sử dụng nhiều kỳ nhưng không đủ điều kiện ghi nhận là TSCĐ. Khoản này thường được phân loại là:","options":[{"id":"lms-ch2-q047-A","text":"Nguyên vật liệu"},{"id":"lms-ch2-q047-B","text":"Công cụ, dụng cụ"},{"id":"lms-ch2-q047-C","text":"Thành phẩm"},{"id":"lms-ch2-q047-D","text":"Hàng hóa"}],"correctOptionId":"lms-ch2-q047-B","explanation":"<p>Tư liệu lao động giá trị nhỏ, sử dụng nhiều kỳ nhưng không đủ tiêu chuẩn TSCĐ được ghi nhận là công cụ, dụng cụ (TK 153).<\/p>","source":"TT200 (TK 153); Slide Chương 2","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u048","context":null,"questions":[{"id":"lms-ch2-q048","num":"Câu 57","type":"mcq","text":"Doanh nghiệp sản xuất nước giải khát mua đường và hương liệu để đưa vào quá trình sản xuất. Các khoản này được phân loại là:","options":[{"id":"lms-ch2-q048-A","text":"Thành phẩm"},{"id":"lms-ch2-q048-B","text":"Hàng hóa"},{"id":"lms-ch2-q048-C","text":"Nguyên vật liệu"},{"id":"lms-ch2-q048-D","text":"Công cụ, dụng cụ"}],"correctOptionId":"lms-ch2-q048-C","explanation":"<p>Đường, hương liệu cấu thành thực thể sản phẩm là nguyên vật liệu (TK 152).<\/p>","source":"TT200 (TK 152); Slide Chương 2","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u049","context":null,"questions":[{"id":"lms-ch2-q049","num":"Câu 58","type":"mcq","text":"Khoản Quỹ đầu tư phát triển được hình thành từ kết quả hoạt động của doanh nghiệp và được trình bày thuộc:","options":[{"id":"lms-ch2-q049-A","text":"Tài sản"},{"id":"lms-ch2-q049-B","text":"Nợ phải trả"},{"id":"lms-ch2-q049-C","text":"Vốn chủ sở hữu"},{"id":"lms-ch2-q049-D","text":"Chi phí hoạt động"}],"correctOptionId":"lms-ch2-q049-C","explanation":"<p>Quỹ đầu tư phát triển (TK 414) hình thành từ lợi nhuận sau thuế, là một khoản mục thuộc vốn chủ sở hữu.<\/p>","source":"TT200 (TK 414); Slide Chương 2, slides 33-34","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u050","context":null,"questions":[{"id":"lms-ch2-q050","num":"Câu 59","type":"mcq","text":"Khoản Thuế và các khoản phải nộp Nhà nước nhưng doanh nghiệp chưa thực hiện nghĩa vụ thanh toán tại thời điểm lập báo cáo được phân loại là:","options":[{"id":"lms-ch2-q050-A","text":"Tài sản ngắn hạn"},{"id":"lms-ch2-q050-B","text":"Nợ phải trả"},{"id":"lms-ch2-q050-C","text":"Vốn chủ sở hữu"},{"id":"lms-ch2-q050-D","text":"Chi phí trả trước"}],"correctOptionId":"lms-ch2-q050-B","explanation":"<p>Thuế và các khoản phải nộp Nhà nước (TK 333) là nghĩa vụ phải thanh toán nên thuộc nợ phải trả.<\/p>","source":"TT200 (TK 333); Slide Chương 2, slides 15-16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u051","context":null,"questions":[{"id":"lms-ch2-q051","num":"Câu 60","type":"mcq","text":"Báo cáo nào phản ánh các khoản tiền thu vào và chi ra của doanh nghiệp trong một kỳ kế toán?","options":[{"id":"lms-ch2-q051-A","text":"Báo cáo tình hình tài chính"},{"id":"lms-ch2-q051-B","text":"Báo cáo kết quả hoạt động kinh doanh"},{"id":"lms-ch2-q051-C","text":"Báo cáo lưu chuyển tiền tệ"},{"id":"lms-ch2-q051-D","text":"Thuyết minh báo cáo tài chính"}],"correctOptionId":"lms-ch2-q051-C","explanation":"<p>Báo cáo lưu chuyển tiền tệ phản ánh việc hình thành và sử dụng lượng tiền phát sinh trong kỳ báo cáo.<\/p>","source":"Slide Chương 2, slide 48","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u052","context":null,"questions":[{"id":"lms-ch2-q052","num":"Câu 61","type":"mcq","text":"Trên Báo cáo lưu chuyển tiền tệ, các dòng tiền thường được phân chia theo ba nhóm hoạt động:","options":[{"id":"lms-ch2-q052-A","text":"Sản xuất, bán hàng và quản lý"},{"id":"lms-ch2-q052-B","text":"Kinh doanh, đầu tư và tài chính"},{"id":"lms-ch2-q052-C","text":"Ngắn hạn, dài hạn và vốn chủ sở hữu"},{"id":"lms-ch2-q052-D","text":"Thu tiền, chi tiền và kết chuyển"}],"correctOptionId":"lms-ch2-q052-B","explanation":"<p>Ba nhóm hoạt động: kinh doanh, đầu tư và tài chính.<\/p>","source":"Slide Chương 2, slide 50","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u053","context":null,"questions":[{"id":"lms-ch2-q053","num":"Câu 62","type":"mcq","text":"Doanh nghiệp dùng tiền mua một thiết bị có thời gian sử dụng dài hạn. Trên Báo cáo lưu chuyển tiền tệ, khoản chi này thường gắn với nhóm hoạt động nào?","options":[{"id":"lms-ch2-q053-A","text":"Hoạt động kinh doanh"},{"id":"lms-ch2-q053-B","text":"Hoạt động đầu tư"},{"id":"lms-ch2-q053-C","text":"Hoạt động tài chính"},{"id":"lms-ch2-q053-D","text":"Không phản ánh trên báo cáo lưu chuyển tiền tệ"}],"correctOptionId":"lms-ch2-q053-B","explanation":"<p>Chi mua sắm TSCĐ và tài sản dài hạn khác là dòng tiền từ hoạt động đầu tư.<\/p>","source":"Slide Chương 2, slide 50; VAS 24 / TT200 (BC LCTT)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u054","context":null,"questions":[{"id":"lms-ch2-q054","num":"Câu 63","type":"mcq","text":"Doanh nghiệp nhận tiền từ một khoản vay ngân hàng. Xét theo việc phân loại dòng tiền, nghiệp vụ này thuộc:","options":[{"id":"lms-ch2-q054-A","text":"Hoạt động kinh doanh"},{"id":"lms-ch2-q054-B","text":"Hoạt động đầu tư"},{"id":"lms-ch2-q054-C","text":"Hoạt động tài chính"},{"id":"lms-ch2-q054-D","text":"Hoạt động khác"}],"correctOptionId":"lms-ch2-q054-C","explanation":"<p>Tiền thu từ đi vay là dòng tiền từ hoạt động tài chính (thay đổi quy mô và kết cấu vốn góp và vốn vay).<\/p>","source":"Slide Chương 2, slide 50; VAS 24 / TT200 (BC LCTT)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u055","context":null,"questions":[{"id":"lms-ch2-q055","num":"Câu 64","type":"mcq","text":"Phát biểu nào sau đây là đúng?","options":[{"id":"lms-ch2-q055-A","text":"Mọi khoản mục thuộc tài sản đều là tài sản dài hạn"},{"id":"lms-ch2-q055-B","text":"Công cụ dụng cụ luôn được ghi nhận là TSCĐ"},{"id":"lms-ch2-q055-C","text":"Hàng tồn kho thường được trình bày trong khoản mục tài sản ngắn hạn"},{"id":"lms-ch2-q055-D","text":"Thuế phải nộp Nhà nước thuộc vốn chủ sở hữu"}],"correctOptionId":"lms-ch2-q055-C","explanation":"<p>Hàng tồn kho dự kiến bán/sử dụng trong chu kỳ kinh doanh thông thường nên thường thuộc tài sản ngắn hạn. A sai (có tài sản ngắn hạn); B sai (công cụ dụng cụ là hàng tồn kho, không phải TSCĐ); D sai (thuộc nợ phải trả).<\/p>","source":"Slide Chương 2, slides 13-14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u056","context":null,"questions":[{"id":"lms-ch2-q056","num":"Câu 65","type":"mcq","text":"Cuối kỳ, doanh nghiệp có các khoản: nguyên vật liệu 200 triệu đồng, sản phẩm dở dang 80 triệu đồng, thành phẩm 150 triệu đồng và công cụ dụng cụ 40 triệu đồng. Nếu chỉ xét các khoản trên, tổng giá trị các khoản thuộc tài sản là:","options":[{"id":"lms-ch2-q056-A","text":"350 triệu đồng"},{"id":"lms-ch2-q056-B","text":"390 triệu đồng"},{"id":"lms-ch2-q056-C","text":"430 triệu đồng"},{"id":"lms-ch2-q056-D","text":"470 triệu đồng"}],"correctOptionId":"lms-ch2-q056-D","explanation":"<p>Cả bốn khoản đều là hàng tồn kho (tài sản): 200 + 80 + 150 + 40 = <b>470<\/b> triệu đồng.<\/p>","source":"Slide Chương 2, slides 13-14; TT200 (nhóm hàng tồn kho)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u057","context":"<p>Lập Bảng cân đối kế toán của Công ty A vào ngày 31/01/N (dạng đơn giản) dựa vào thông tin về số dư một số tài khoản tổng hợp như sau: (Đơn vị tính: triệu đồng). Tính X? Hãy cho ví dụ thể hiện sự thay đổi của Báo cáo tình hình tài chính (các quan hệ đối ứng kế toán cơ bản). Nhận xét về sự thay đổi đó.<\/p><table class=\"t\"><thead><tr><th>STT<\/th><th>CHỈ TIÊU<\/th><th>SỐ TIỀN<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Phải thu của khách hàng (số dư Nợ)<\/td><td class=\"num\">620<\/td><\/tr><tr><td>2<\/td><td>Hàng hóa<\/td><td class=\"num\">750<\/td><\/tr><tr><td>3<\/td><td>Tài sản cố định hữu hình<\/td><td class=\"num\">1.350<\/td><\/tr><tr><td>4<\/td><td>Tạm ứng<\/td><td class=\"num\">120<\/td><\/tr><tr><td>5<\/td><td>Nguyên liệu, vật liệu<\/td><td class=\"num\">480<\/td><\/tr><tr><td>6<\/td><td>Phải trả người bán (số dư Có)<\/td><td class=\"num\">630<\/td><\/tr><tr><td>7<\/td><td>Tiền mặt<\/td><td class=\"num\">420<\/td><\/tr><tr><td>8<\/td><td>Tiền gửi không kỳ hạn<\/td><td class=\"num\">610<\/td><\/tr><tr><td>9<\/td><td>Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">X<\/td><\/tr><tr><td>10<\/td><td>Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">2.300<\/td><\/tr><tr><td>11<\/td><td>Vay và nợ thuê tài chính<\/td><td class=\"num\">320<\/td><\/tr><tr><td>12<\/td><td>Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">140<\/td><\/tr><tr><td>13<\/td><td>Quỹ đầu tư phát triển<\/td><td class=\"num\">180<\/td><\/tr><tr><td>14<\/td><td>Phải trả người lao động<\/td><td class=\"num\">500<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch2-q057","num":"Bài 1 (yêu cầu 1)","type":"essay","text":"<p>Tính X và lập Bảng cân đối kế toán của Công ty A vào ngày 31/01/N (dạng đơn giản).<\/p>","answer":"<p><b>Bước 1 - Phân loại số dư theo slide 38-39<\/b> (TK tài sản dư Nợ ghi vào Tài sản; TK nguồn vốn dư Có ghi vào Nguồn vốn):<\/p><ul><li>Tài sản: tiền mặt 420 + tiền gửi 610 + phải thu khách hàng 620 + tạm ứng 120 + hàng hóa 750 + NVL 480 + TSCĐ 1.350 = <b>4.350<\/b>.<\/li><li>Nợ phải trả: phải trả người bán 630 + vay 320 + phải trả người lao động 500 + quỹ khen thưởng, phúc lợi 140 (theo TT200 là nợ phải trả) = 1.590.<\/li><li>Vốn chủ sở hữu (chưa kể X): 2.300 + 180 = 2.480.<\/li><\/ul><p><b>Bước 2 - Tính X<\/b> theo Tổng tài sản = Tổng nguồn vốn: X = 4.350 - 1.590 - 2.480 = <b>280<\/b> triệu đồng (lợi nhuận sau thuế chưa phân phối, số dư Có).<\/p><p><b>Bước 3 - Bảng cân đối kế toán 31/01/N<\/b> (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td><b>A. TÀI SẢN NGẮN HẠN<\/b><\/td><td class=\"num\"><b>3.000<\/b><\/td><td><b>A. NỢ PHẢI TRẢ<\/b><\/td><td class=\"num\"><b>1.590<\/b><\/td><\/tr><tr><td>I. Tiền và các khoản tương đương tiền<\/td><td class=\"num\">1.030<\/td><td>- Phải trả người bán<\/td><td class=\"num\">630<\/td><\/tr><tr><td>- Tiền mặt<\/td><td class=\"num\">420<\/td><td>- Vay và nợ thuê tài chính<\/td><td class=\"num\">320<\/td><\/tr><tr><td>- Tiền gửi không kỳ hạn<\/td><td class=\"num\">610<\/td><td>- Phải trả người lao động<\/td><td class=\"num\">500<\/td><\/tr><tr><td>II. Phải thu ngắn hạn của khách hàng<\/td><td class=\"num\">620<\/td><td>- Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">140<\/td><\/tr><tr><td>III. Hàng tồn kho<\/td><td class=\"num\">1.230<\/td><td><b>B. VỐN CHỦ SỞ HỮU<\/b><\/td><td class=\"num\"><b>2.760<\/b><\/td><\/tr><tr><td>- Hàng hóa<\/td><td class=\"num\">750<\/td><td>- Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">2.300<\/td><\/tr><tr><td>- Nguyên liệu, vật liệu<\/td><td class=\"num\">480<\/td><td>- Quỹ đầu tư phát triển<\/td><td class=\"num\">180<\/td><\/tr><tr><td>IV. Tài sản ngắn hạn khác (Tạm ứng)<\/td><td class=\"num\">120<\/td><td>- Lợi nhuận sau thuế chưa phân phối (X)<\/td><td class=\"num\">280<\/td><\/tr><tr><td><b>B. TÀI SẢN DÀI HẠN<\/b><\/td><td class=\"num\"><b>1.350<\/b><\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>Tài sản cố định hữu hình<\/td><td class=\"num\">1.350<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>4.350<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>4.350<\/b><\/td><\/tr><\/tbody><\/table><p>Kiểm tra bằng phương pháp thứ hai: Tổng nguồn vốn = 1.590 + 2.480 + 280 = 4.350 = Tổng tài sản.<\/p><p><i>Lưu ý: X không phụ thuộc cách xếp quỹ khen thưởng, phúc lợi (nợ phải trả hay nguồn vốn) vì chỉ phụ thuộc tổng nguồn vốn; chỉ cách trình bày khác.<\/i><\/p>","source":"Slide Chương 2, slides 33-39 (lập báo cáo tình hình tài chính), slide 40; TT200 (Mẫu B01-DN)","status":"ok","answerBasis":"self"},{"id":"lms-ch2-q058","num":"Bài 1 (yêu cầu 2)","type":"essay","text":"<p>Hãy cho ví dụ thể hiện sự thay đổi của Báo cáo tình hình tài chính (các quan hệ đối ứng kế toán cơ bản). Nhận xét về sự thay đổi đó.<\/p>","answer":"<p>Lấy BCĐKT 31/01/N ở trên (Tổng TS = Tổng NV = 4.350). Bốn quan hệ đối ứng cơ bản (slide 40):<\/p>\n<p><b>(1) Một loại tài sản tăng, một loại tài sản giảm<\/b> - Rút tiền gửi không kỳ hạn 100 về nhập quỹ tiền mặt.<\/p><div class=\"je\"><div>Nợ TK 111 &nbsp; 100<\/div><div class=\"cr\">Có TK 112 &nbsp; 100<\/div><\/div><p>Tiền mặt 420 -> 520; tiền gửi 610 -> 510. Tổng TS = 4.350 (không đổi), Tổng NV = 4.350.<\/p>\n<p><b>(2) Một loại nguồn vốn tăng, một loại nguồn vốn giảm<\/b> - Vay ngắn hạn ngân hàng 150 để trả nợ người bán.<\/p><div class=\"je\"><div>Nợ TK 331 &nbsp; 150<\/div><div class=\"cr\">Có TK 341 &nbsp; 150<\/div><\/div><p>Phải trả người bán 630 -> 480; vay 320 -> 470. Tổng NV = 4.350 (không đổi), Tổng TS = 4.350.<\/p>\n<p><b>(3) Tài sản tăng, nguồn vốn tăng cùng giá trị<\/b> - Mua nguyên vật liệu 80 nhập kho chưa trả tiền người bán (bỏ qua thuế GTGT).<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 80<\/div><div class=\"cr\">Có TK 331 &nbsp; 80<\/div><\/div><p>NVL 480 -> 560; phải trả người bán 630 -> 710. Tổng TS = Tổng NV = 4.430 (cùng tăng 80).<\/p>\n<p><b>(4) Tài sản giảm, nguồn vốn giảm cùng giá trị<\/b> - Chuyển khoản trả nợ người bán 130.<\/p><div class=\"je\"><div>Nợ TK 331 &nbsp; 130<\/div><div class=\"cr\">Có TK 112 &nbsp; 130<\/div><\/div><p>Tiền gửi 610 -> 480; phải trả người bán 630 -> 500. Tổng TS = Tổng NV = 4.220 (cùng giảm 130).<\/p>\n<p><b>Nhận xét:<\/b> Mọi nghiệp vụ kinh tế phát sinh chỉ làm thay đổi từng khoản mục theo 4 dạng trên; ở dạng (1) và (2) tổng TS và tổng NV không đổi (chỉ đổi cơ cấu); ở dạng (3) và (4) tổng TS và tổng NV cùng tăng hoặc cùng giảm một lượng bằng nhau. Trong mọi trường hợp đẳng thức <b>Tổng tài sản = Tổng nguồn vốn<\/b> luôn được duy trì.<\/p>","source":"Slide Chương 2, slide 40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u058","context":"<p>Cho số liệu về tình hình tài sản, nguồn vốn tại thời điểm 31/12/N của một đơn vị như sau (đơn vị tính: triệu đồng)<\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Số tiền<\/th><th>Khoản mục<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Phải trả công nhân viên<\/td><td class=\"num\">820<\/td><td>Hàng hóa<\/td><td class=\"num\">6.200<\/td><\/tr><tr><td>Vay dài hạn<\/td><td class=\"num\">4.800<\/td><td>Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">13.000<\/td><\/tr><tr><td>Thành phẩm<\/td><td class=\"num\">6.900<\/td><td>Phải thu của khách hàng<\/td><td class=\"num\">8.100<\/td><\/tr><tr><td>Vay ngắn hạn<\/td><td class=\"num\">2.500<\/td><td>Tiền gửi ngân hàng không kỳ hạn<\/td><td class=\"num\">3.600<\/td><\/tr><tr><td>Thuế và các khoản phải nộp Nhà nước<\/td><td class=\"num\">720<\/td><td>Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">350<\/td><\/tr><tr><td>Quỹ đầu tư phát triển<\/td><td class=\"num\">650<\/td><td>TSCĐ hữu hình – nguyên giá<\/td><td class=\"num\">12.400<\/td><\/tr><tr><td>Tiền mặt<\/td><td class=\"num\">1.700<\/td><td>Phải trả người bán<\/td><td class=\"num\">1.350<\/td><\/tr><tr><td>Công cụ, dụng cụ<\/td><td class=\"num\">900<\/td><td>Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">X<\/td><\/tr><tr><td>Hao mòn lũy kế TSCĐ hữu hình<\/td><td class=\"num\">1.700<\/td><td>Nguyên vật liệu<\/td><td class=\"num\">1.200<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch2-q059","num":"Bài 2","type":"essay","text":"<p>Hãy lập bảng Báo cáo tình hình tài chính (Bảng cân đối kế toán) của đơn vị tại thời điểm 31/12/N (tính cả giá trị X).<\/p>","answer":"<p><b>Tổng tài sản:<\/b> Tiền 1.700 + 3.600 = 5.300; phải thu khách hàng 8.100; hàng tồn kho 6.200 + 6.900 + 1.200 + 900 = 15.200; tài sản ngắn hạn = <b>28.600<\/b>. TSCĐ hữu hình: nguyên giá 12.400 trừ hao mòn lũy kế 1.700 (TK 214 dư Có ghi âm bên Tài sản) = 10.700. Tổng tài sản = 28.600 + 10.700 = <b>39.300<\/b>.<\/p><p><b>Nợ phải trả:<\/b> ngắn hạn = 1.350 + 720 + 820 + 2.500 + 350 = 5.740; dài hạn (vay dài hạn) = 4.800; tổng = <b>10.540<\/b>.<\/p><p><b>Tính X:<\/b> Vốn chủ sở hữu = Tổng TS - Nợ phải trả = 39.300 - 10.540 = 28.760. Do đó X = 28.760 - 13.000 - 650 = <b>15.110<\/b>.<\/p><p>Báo cáo tình hình tài chính ngày 31/12/N (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td><b>A. TÀI SẢN NGẮN HẠN<\/b><\/td><td class=\"num\"><b>28.600<\/b><\/td><td><b>A. NỢ PHẢI TRẢ<\/b><\/td><td class=\"num\"><b>10.540<\/b><\/td><\/tr><tr><td>I. Tiền và tương đương tiền<\/td><td class=\"num\">5.300<\/td><td>I. Nợ ngắn hạn<\/td><td class=\"num\">5.740<\/td><\/tr><tr><td>- Tiền mặt<\/td><td class=\"num\">1.700<\/td><td>- Phải trả người bán<\/td><td class=\"num\">1.350<\/td><\/tr><tr><td>- Tiền gửi ngân hàng không kỳ hạn<\/td><td class=\"num\">3.600<\/td><td>- Thuế và các khoản phải nộp Nhà nước<\/td><td class=\"num\">720<\/td><\/tr><tr><td>II. Phải thu ngắn hạn của khách hàng<\/td><td class=\"num\">8.100<\/td><td>- Phải trả người lao động<\/td><td class=\"num\">820<\/td><\/tr><tr><td>III. Hàng tồn kho<\/td><td class=\"num\">15.200<\/td><td>- Vay ngắn hạn<\/td><td class=\"num\">2.500<\/td><\/tr><tr><td>- Hàng hóa<\/td><td class=\"num\">6.200<\/td><td>- Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">350<\/td><\/tr><tr><td>- Thành phẩm<\/td><td class=\"num\">6.900<\/td><td>II. Nợ dài hạn<\/td><td class=\"num\">4.800<\/td><\/tr><tr><td>- Nguyên vật liệu<\/td><td class=\"num\">1.200<\/td><td>- Vay dài hạn<\/td><td class=\"num\">4.800<\/td><\/tr><tr><td>- Công cụ, dụng cụ<\/td><td class=\"num\">900<\/td><td><b>B. VỐN CHỦ SỞ HỮU<\/b><\/td><td class=\"num\"><b>28.760<\/b><\/td><\/tr><tr><td><b>B. TÀI SẢN DÀI HẠN<\/b><\/td><td class=\"num\"><b>10.700<\/b><\/td><td>- Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">13.000<\/td><\/tr><tr><td>TSCĐ hữu hình<\/td><td class=\"num\">10.700<\/td><td>- Quỹ đầu tư phát triển<\/td><td class=\"num\">650<\/td><\/tr><tr><td>- Nguyên giá<\/td><td class=\"num\">12.400<\/td><td>- Lợi nhuận sau thuế chưa phân phối (X)<\/td><td class=\"num\">15.110<\/td><\/tr><tr><td>- Giá trị hao mòn lũy kế<\/td><td class=\"num\">(1.700)<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>39.300<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>39.300<\/b><\/td><\/tr><\/tbody><\/table><p>Kiểm tra: Nợ phải trả 10.540 + Vốn chủ sở hữu 28.760 (13.000 + 650 + 15.110) = 39.300 = Tổng tài sản.<\/p><p><i>Lưu ý: Quỹ khen thưởng, phúc lợi trình bày ở nợ phải trả theo TT200; X không phụ thuộc cách xếp này.<\/i><\/p>","source":"Slide Chương 2, slides 33-39 (lập báo cáo tình hình tài chính), slide 40; TT200 (Mẫu B01-DN)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u059","context":"<p>Vào ngày 1/1/N, một doanh nghiệp được thành lập với số vốn ban đầu như sau: (ĐVT: triệu đồng)<\/p><ol><li>Tài sản cố định hữu hình do cổ đông góp là 1.200<\/li><li>Tiền do cổ đông góp: 500 nộp vào quỹ tiền mặt và 300 đã chuyển vào tài khoản tiền gửi ngân hàng của doanh nghiệp.<\/li><\/ol><p>Trong tháng 1/N có các nghiệp vụ kinh tế sau phát sinh:<\/p><ol><li>Doanh nghiệp mua và nhập kho nguyên vật liệu trị giá 80, đã thanh toán cho người bán bằng chuyển khoản (Ngân hàng đã báo Nợ).<\/li><li>Doanh nghiệp mua và nhập kho công cụ dụng cụ trị giá 25, chưa trả tiền cho người bán, thời gian thanh toán: 60 ngày.<\/li><li>Rút tiền mặt trả nợ người bán công cụ, dụng cụ 15.<\/li><li>Doanh nghiệp vay ngân hàng ngắn hạn để mua thêm tài sản cố định trị giá 100.<\/li><li>Doanh nghiệp rút tiền gửi ngân hàng về quỹ tiền mặt 50.<\/li><\/ol>","questions":[{"id":"lms-ch2-q060","num":"Bài 3","type":"essay","text":"<p>Hãy lập Báo cáo tình hình tài chính (dạng đơn giản) của doanh nghiệp vào ngày 1/1/N và ngày 31/1/N.<\/p>","answer":"<p>Định khoản các nghiệp vụ (bỏ qua thuế GTGT, vì đề không nêu):<\/p>\n<div class=\"je\"><div>Nợ TK 152 &nbsp; 80<\/div><div class=\"cr\">Có TK 112 &nbsp; 80<\/div><\/div>\n<div class=\"je\"><div>Nợ TK 153 &nbsp; 25<\/div><div class=\"cr\">Có TK 331 &nbsp; 25<\/div><\/div>\n<div class=\"je\"><div>Nợ TK 331 &nbsp; 15<\/div><div class=\"cr\">Có TK 111 &nbsp; 15<\/div><\/div>\n<div class=\"je\"><div>Nợ TK 211 &nbsp; 100<\/div><div class=\"cr\">Có TK 341 &nbsp; 100<\/div><\/div>\n<div class=\"je\"><div>Nợ TK 111 &nbsp; 50<\/div><div class=\"cr\">Có TK 112 &nbsp; 50<\/div><\/div>\n<p><b>Số dư ngày 31/1/N:<\/b> Tiền mặt = 500 - 15 + 50 = 535; tiền gửi ngân hàng = 300 - 80 - 50 = 170; NVL = 80; CCDC = 25; TSCĐ = 1.200 + 100 = 1.300; phải trả người bán = 25 - 15 = 10; vay ngắn hạn = 100; vốn đầu tư của chủ sở hữu = 2.000.<\/p>\n<p><b>Báo cáo tình hình tài chính ngày 1/1/N<\/b> (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt<\/td><td class=\"num\">500<\/td><td>Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">2.000<\/td><\/tr><tr><td>Tiền gửi ngân hàng<\/td><td class=\"num\">300<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>Tài sản cố định hữu hình<\/td><td class=\"num\">1.200<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>2.000<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>2.000<\/b><\/td><\/tr><\/tbody><\/table>\n<p><b>Báo cáo tình hình tài chính ngày 31/1/N<\/b> (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt<\/td><td class=\"num\">535<\/td><td>Phải trả người bán<\/td><td class=\"num\">10<\/td><\/tr><tr><td>Tiền gửi ngân hàng<\/td><td class=\"num\">170<\/td><td>Vay ngắn hạn<\/td><td class=\"num\">100<\/td><\/tr><tr><td>Nguyên vật liệu<\/td><td class=\"num\">80<\/td><td>Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">2.000<\/td><\/tr><tr><td>Công cụ, dụng cụ<\/td><td class=\"num\">25<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>Tài sản cố định hữu hình<\/td><td class=\"num\">1.300<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>2.110<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>2.110<\/b><\/td><\/tr><\/tbody><\/table>\n<p>Kiểm tra: Tổng TS = 535 + 170 + 80 + 25 + 1.300 = 2.110; Tổng NV = 10 + 100 + 2.000 = 2.110. Chênh lệch so với 1/1/N: tổng tài sản tăng 110 = nợ phải trả mới 10 + 100.<\/p><p><i>Giả định: nghiệp vụ 3 \"rút tiền mặt trả nợ\" được hiểu là dùng tiền mặt trả nợ người bán 15.<\/i><\/p>","source":"Slide Chương 2, slides 33-39 (lập báo cáo tình hình tài chính), slide 40; TT200 (Mẫu B01-DN)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch2-u060","context":"<p>Tại Doanh nghiệp tư nhân ABC vào cuối ngày 31/05/N có số liệu như sau: (ĐVT: Triệu đồng)<\/p><table class=\"t\"><thead><tr><th>STT<\/th><th>Tài khoản<\/th><th>Số dư<\/th><th>STT<\/th><th>Tài khoản<\/th><th>Số dư<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td>Đầu tư vào công ty liên doanh liên kết<\/td><td class=\"num\">1.400<\/td><td>10<\/td><td>Hàng hóa<\/td><td class=\"num\">1.200<\/td><\/tr><tr><td>2<\/td><td>Tiền mặt<\/td><td class=\"num\">500<\/td><td>11<\/td><td>Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">10.000<\/td><\/tr><tr><td>3<\/td><td>Thuế và các khoản phải nộp NN<\/td><td class=\"num\">150<\/td><td>12<\/td><td>Dự phòng phải thu khó đòi<\/td><td class=\"num\">50<\/td><\/tr><tr><td>4<\/td><td>Tài sản cố định hữu hình<\/td><td class=\"num\">5.500<\/td><td>13<\/td><td>Tài sản thừa chờ xử lý<\/td><td class=\"num\">40<\/td><\/tr><tr><td>5<\/td><td>Hao mòn TSCĐ hữu hình<\/td><td class=\"num\">1.200<\/td><td>14<\/td><td>Thuế GTGT được khấu trừ<\/td><td class=\"num\">20<\/td><\/tr><tr><td>6<\/td><td>Phải trả công nhân viên<\/td><td class=\"num\">350<\/td><td>15<\/td><td>Phải trả người bán<\/td><td class=\"num\">700<\/td><\/tr><tr><td>7<\/td><td>Phải thu của khách hàng: - Phải thu<\/td><td class=\"num\">3.200<\/td><td>16<\/td><td>Quỹ khen thưởng phúc lợi<\/td><td class=\"num\">150<\/td><\/tr><tr><td><\/td><td>- Khách hàng ứng trước<\/td><td class=\"num\">120<\/td><td>17<\/td><td>Vật liệu<\/td><td class=\"num\">130<\/td><\/tr><tr><td>8<\/td><td>Vay ngắn hạn<\/td><td class=\"num\">850<\/td><td>18<\/td><td>Nhận ký quỹ dài hạn<\/td><td class=\"num\">170<\/td><\/tr><tr><td>9<\/td><td>Tiền gửi không kỳ hạn<\/td><td class=\"num\">2.100<\/td><td>19<\/td><td>Chi phí chờ phân bổ dài hạn<\/td><td class=\"num\">120<\/td><\/tr><tr><td><\/td><td><\/td><td><\/td><td>20<\/td><td>Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">X<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch2-q061","num":"Bài 4","type":"essay","text":"<p>Yêu cầu: Tính lợi nhuận chưa phân phối (X) và lập Bảng cân đối kế toán (dạng đơn giản) của ABC ngày 31/5/N.<\/p>","answer":"<p><b>Nguyên tắc (slide 38-39):<\/b> Phải thu khách hàng (dư Nợ 3.200) ghi bên Tài sản, khoản khách hàng ứng trước (dư Có 120) ghi bên Nguồn vốn, không bù trừ. Hao mòn TSCĐ và dự phòng phải thu khó đòi (dư Có) ghi số âm bên Tài sản. Tài sản thừa chờ xử lý (TK 3381, dư Có) ghi bên Nợ phải trả.<\/p>\n<p><b>Tài sản:<\/b> Tiền 500 + 2.100 = 2.600; phải thu 3.200; dự phòng -50; thuế GTGT được khấu trừ 20; hàng tồn kho 1.200 + 130 = 1.330; TS ngắn hạn = <b>7.100<\/b>. TS dài hạn: đầu tư LDLK 1.400 + TSCĐ thuần (5.500 - 1.200 = 4.300) + chi phí chờ phân bổ dài hạn 120 = <b>5.820<\/b>. Tổng tài sản = <b>12.920<\/b>.<\/p>\n<p><b>Nợ phải trả:<\/b> ngắn hạn = 150 + 350 + 850 + 700 + 150 + 120 + 40 = 2.360; dài hạn (nhận ký quỹ) = 170; tổng = <b>2.530<\/b>.<\/p>\n<p><b>Tính X:<\/b> X = Tổng TS - Nợ phải trả - Vốn đầu tư = 12.920 - 2.530 - 10.000 = <b>390<\/b> triệu đồng.<\/p>\n<p>Bảng cân đối kế toán ngày 31/5/N (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td><b>A. TÀI SẢN NGẮN HẠN<\/b><\/td><td class=\"num\"><b>7.100<\/b><\/td><td><b>A. NỢ PHẢI TRẢ<\/b><\/td><td class=\"num\"><b>2.530<\/b><\/td><\/tr><tr><td>I. Tiền<\/td><td class=\"num\">2.600<\/td><td>I. Nợ ngắn hạn<\/td><td class=\"num\">2.360<\/td><\/tr><tr><td>- Tiền mặt<\/td><td class=\"num\">500<\/td><td>- Phải trả người bán<\/td><td class=\"num\">700<\/td><\/tr><tr><td>- Tiền gửi không kỳ hạn<\/td><td class=\"num\">2.100<\/td><td>- Người mua trả tiền trước<\/td><td class=\"num\">120<\/td><\/tr><tr><td>II. Phải thu ngắn hạn của khách hàng<\/td><td class=\"num\">3.200<\/td><td>- Thuế và các khoản phải nộp NN<\/td><td class=\"num\">150<\/td><\/tr><tr><td>III. Dự phòng phải thu ngắn hạn khó đòi<\/td><td class=\"num\">(50)<\/td><td>- Phải trả người lao động<\/td><td class=\"num\">350<\/td><\/tr><tr><td>IV. Hàng tồn kho<\/td><td class=\"num\">1.330<\/td><td>- Phải trả khác (tài sản thừa chờ xử lý)<\/td><td class=\"num\">40<\/td><\/tr><tr><td>- Hàng hóa<\/td><td class=\"num\">1.200<\/td><td>- Vay ngắn hạn<\/td><td class=\"num\">850<\/td><\/tr><tr><td>- Vật liệu<\/td><td class=\"num\">130<\/td><td>- Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">150<\/td><\/tr><tr><td>V. Thuế GTGT được khấu trừ<\/td><td class=\"num\">20<\/td><td>II. Nợ dài hạn<\/td><td class=\"num\">170<\/td><\/tr><tr><td><b>B. TÀI SẢN DÀI HẠN<\/b><\/td><td class=\"num\"><b>5.820<\/b><\/td><td>- Nhận ký quỹ, ký cược dài hạn<\/td><td class=\"num\">170<\/td><\/tr><tr><td>I. Đầu tư vào công ty liên doanh, liên kết<\/td><td class=\"num\">1.400<\/td><td><b>B. VỐN CHỦ SỞ HỮU<\/b><\/td><td class=\"num\"><b>10.390<\/b><\/td><\/tr><tr><td>II. TSCĐ hữu hình<\/td><td class=\"num\">4.300<\/td><td>- Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">10.000<\/td><\/tr><tr><td>- Nguyên giá<\/td><td class=\"num\">5.500<\/td><td>- Lợi nhuận sau thuế chưa phân phối (X)<\/td><td class=\"num\">390<\/td><\/tr><tr><td>- Hao mòn lũy kế<\/td><td class=\"num\">(1.200)<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>III. Chi phí trả trước dài hạn<\/td><td class=\"num\">120<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>12.920<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>12.920<\/b><\/td><\/tr><\/tbody><\/table><p>Kiểm tra: Nợ phải trả 2.530 + Vốn chủ sở hữu 10.390 = 12.920 = Tổng tài sản.<\/p>","source":"Slide Chương 2, slides 33-39 (lập báo cáo tình hình tài chính), slide 40; TT200 (Mẫu B01-DN)","status":"needs_review","answerBasis":"self","reviewNote":"Khoản \"Tài sản thừa chờ xử lý\" 40 được xếp vào Nợ phải trả (TK 3381 dư Có theo TT200); nếu giáo trình xem là tài sản thì X = 470 (không phải 390). Cần giảng viên xác nhận."}]},{"id":"lms-ch2-u061","context":"<p>Cho số dư một số tài khoản tổng hợp và chi tiết của đơn vị kế toán A vào ngày 28/02/N như sau: (Đơn vị tính: Triệu đồng)<\/p><table class=\"t\"><thead><tr><th>Tài khoản<\/th><th>Số dư<\/th><th>Tài khoản<\/th><th>Số dư<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt<\/td><td class=\"num\">620<\/td><td>Quỹ đầu tư phát triển<\/td><td class=\"num\">400<\/td><\/tr><tr><td>Hao mòn TSCĐ<\/td><td class=\"num\">220<\/td><td>Đầu tư ngắn hạn khác<\/td><td class=\"num\">90<\/td><\/tr><tr><td>Tiền gửi không kỳ hạn<\/td><td class=\"num\">1.100<\/td><td>TSCĐ hữu hình<\/td><td class=\"num\">1.900<\/td><\/tr><tr><td>Phải trả người bán: Ứng tiền trước cho NB<\/td><td class=\"num\">80<\/td><td>Nợ dài hạn đến hạn trả<\/td><td class=\"num\">570<\/td><\/tr><tr><td>Phải trả người bán<\/td><td class=\"num\">480<\/td><td>Lợi nhuận sau thuế chưa phân phối (dư Có)<\/td><td class=\"num\">550<\/td><\/tr><tr><td>Phải thu khách hàng (dư Nợ)<\/td><td class=\"num\">720<\/td><td>Đầu tư vào công ty liên doanh, liên kết<\/td><td class=\"num\">650<\/td><\/tr><tr><td>Vay ngắn hạn<\/td><td class=\"num\">560<\/td><td>Chi phí phải trả<\/td><td class=\"num\">110<\/td><\/tr><tr><td>Dự phòng phải thu khó đòi<\/td><td class=\"num\">90<\/td><td>Phải thu khác<\/td><td class=\"num\">20<\/td><\/tr><tr><td>Phải trả Nhà nước<\/td><td class=\"num\">600<\/td><td>Thuế và các khoản phải nộp Nhà nước<\/td><td class=\"num\">300<\/td><\/tr><tr><td>Nguyên liệu, vật liệu<\/td><td class=\"num\">640<\/td><td>Phải trả, phải nộp khác<\/td><td class=\"num\">420<\/td><\/tr><tr><td>Vốn đầu tư của chủ sở hữu<\/td><td>X<\/td><td>Cầm cố, ký quỹ, ký cược ngắn hạn<\/td><td class=\"num\">260<\/td><\/tr><tr><td>Công cụ, dụng cụ<\/td><td class=\"num\">70<\/td><td>Chứng khoán kinh doanh<\/td><td class=\"num\">550<\/td><\/tr><tr><td>Đầu tư dài hạn khác<\/td><td class=\"num\">450<\/td><td>Nhận ký quỹ, ký cược dài hạn<\/td><td class=\"num\">220<\/td><\/tr><tr><td>Chi phí SXKD dở dang<\/td><td class=\"num\">220<\/td><td>Vay dài hạn<\/td><td class=\"num\">820<\/td><\/tr><tr><td>Nợ dài hạn<\/td><td class=\"num\">920<\/td><td>Sản phẩm<\/td><td class=\"num\">760<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch2-q062","num":"Bài 5","type":"essay","text":"<p>Yêu cầu: Lập Báo cáo tình hình tài chính của đơn vị kế toán A ngày 28/2/N (tính cả giá trị X).<\/p>","answer":"<p><b>Tài sản:<\/b> Tiền 620 + 1.100 = 1.720; đầu tư tài chính ngắn hạn 550 + 90 = 640; phải thu 720 + 80 (ứng trước cho người bán, dư Nợ TK 331 ghi bên Tài sản) + 20 - 90 (dự phòng) = 730; hàng tồn kho 640 + 70 + 220 + 760 = 1.690; tài sản ngắn hạn khác (ký quỹ ngắn hạn) 260. Tài sản ngắn hạn = <b>5.040<\/b>. Tài sản dài hạn: TSCĐ thuần 1.900 - 220 = 1.680; đầu tư LDLK 650; đầu tư dài hạn khác 450; cộng = <b>2.780<\/b>. Tổng tài sản = <b>7.820<\/b>.<\/p>\n<p><b>Nợ phải trả:<\/b> ngắn hạn = 480 + 560 + 600 + 300 + 110 + 420 + 570 = 3.040; dài hạn = 220 + 820 + 920 = 1.960; tổng = <b>5.000<\/b>.<\/p>\n<p><b>Tính X (vốn đầu tư của chủ sở hữu):<\/b> VCSH = 7.820 - 5.000 = 2.820; X = 2.820 - 400 - 550 = <b>1.870<\/b> triệu đồng.<\/p>\n<p>Báo cáo tình hình tài chính ngày 28/2/N (triệu đồng):<\/p><table class=\"t\"><thead><tr><th>TÀI SẢN<\/th><th>Số tiền<\/th><th>NGUỒN VỐN<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td><b>A. TÀI SẢN NGẮN HẠN<\/b><\/td><td class=\"num\"><b>5.040<\/b><\/td><td><b>A. NỢ PHẢI TRẢ<\/b><\/td><td class=\"num\"><b>5.000<\/b><\/td><\/tr><tr><td>I. Tiền<\/td><td class=\"num\">1.720<\/td><td>I. Nợ ngắn hạn<\/td><td class=\"num\">3.040<\/td><\/tr><tr><td>- Tiền mặt<\/td><td class=\"num\">620<\/td><td>- Phải trả người bán<\/td><td class=\"num\">480<\/td><\/tr><tr><td>- Tiền gửi không kỳ hạn<\/td><td class=\"num\">1.100<\/td><td>- Vay ngắn hạn<\/td><td class=\"num\">560<\/td><\/tr><tr><td>II. Đầu tư tài chính ngắn hạn<\/td><td class=\"num\">640<\/td><td>- Phải trả Nhà nước<\/td><td class=\"num\">600<\/td><\/tr><tr><td>- Chứng khoán kinh doanh<\/td><td class=\"num\">550<\/td><td>- Thuế và các khoản phải nộp Nhà nước<\/td><td class=\"num\">300<\/td><\/tr><tr><td>- Đầu tư ngắn hạn khác<\/td><td

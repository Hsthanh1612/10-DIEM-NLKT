<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nguyên lý kế toán – Luyện tập</title>
<style>
/* =====================================================================
   HỆ THỐNG THIẾT KẾ (lấy cảm hứng từ Apple HIG)
   - Chữ: font hệ thống, độ đậm 400/500/600/700, không letter-spacing
   - Khoảng cách: bội số của 4 (--s1…--s12)
   - Vùng đọc lý thuyết 720px; bảng/công thức được mở rộng tới 900px
   ===================================================================== */
:root{
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  /* cỡ chữ & line-height */
  --fs-page:32px; --lh-page:1.25;
  --fs-chapter:26px; --lh-chapter:1.3;
  --fs-topic:20px; --lh-topic:1.35;
  --fs-sub:17px; --lh-sub:1.35;
  --fs-body:16px; --lh-body:1.5;
  --fs-small:14px; --lh-small:1.5;
  --fs-cap:13px; --lh-cap:1.45;
  /* spacing (bội số 4) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  --read:720px; --wide:900px;
  /* màu – sáng */
  --bg:#f5f5f7; --surface:#ffffff; --surface2:#f2f2f5; --text:#1d1d1f; --muted:#5f6368; --line:#d2d2d7; --hair:#e5e5ea;
  --accent:#0066cc; --accent-soft:#e5f0fb; --accent-ink:#ffffff;
  --ok:#1b6e34; --ok-soft:#e3f3e8; --bad:#b3173a; --bad-soft:#fbe9ed; --warn:#7a4e00; --warn-soft:#fff3d4;
  --radius:12px; --radius-s:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --surface:#1c1c1e; --surface2:#2c2c2e; --text:#f5f5f7; --muted:#a1a1a6; --line:#3a3a3c; --hair:#2c2c2e;
    --accent:#2997ff; --accent-soft:#0d2a47; --accent-ink:#000000;
    --ok:#5fd38a; --ok-soft:#12301c; --bad:#ff8aa5; --bad-soft:#40161f; --warn:#f0c36a; --warn-soft:#3a2c0c;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 var(--fs-body)/var(--lh-body) var(--font);letter-spacing:normal;text-align:left}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:normal}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:var(--wide);margin:0 auto;padding:var(--s6) var(--s4) 120px}
p{margin:0 0 var(--s3)}
b,strong{font-weight:600}

/* ---------- nút ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;border:1px solid var(--line);background:var(--surface);padding:var(--s2) var(--s4);border-radius:var(--radius-s);font-size:var(--fs-small);font-weight:500;line-height:1.3;transition:background .15s,border-color .15s}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{background:var(--accent);filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface2);color:var(--text)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- trang chủ & danh sách ---------- */
.hero{padding:var(--s8) 0 var(--s2)}
.hero h1,.pagetitle{margin:0 0 var(--s2);font-size:var(--fs-page);line-height:var(--lh-page);font-weight:600}
.hero p{margin:0;color:var(--muted);font-size:var(--fs-body)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4);margin-top:var(--s8)}
.card{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s6);text-align:left;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h2{margin:0 0 var(--s2);font-size:var(--fs-topic);line-height:var(--lh-topic);font-weight:600}
.card .sub{color:var(--muted);font-size:var(--fs-small)}
.card .big{font-size:var(--fs-small);margin-top:var(--s4);color:var(--muted)}
.bar{height:4px;border-radius:99px;background:var(--hair);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .25s}
.crumb{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s6)}
.crumb h1{margin:0;font-size:var(--fs-chapter);line-height:var(--lh-chapter);font-weight:600}
.list{display:grid;gap:var(--s2);margin-top:var(--s2)}
.row{display:flex;align-items:center;gap:var(--s4);background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s4) var(--s6);text-align:left;width:100%;min-height:64px;transition:border-color .15s}
.row:hover{border-color:var(--accent)}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{font-size:var(--fs-small);color:var(--muted)}
.row .pg{width:120px}
.row .pg small{display:block;text-align:right;font-size:var(--fs-cap);color:var(--muted);margin-bottom:var(--s1)}
.row.all{background:var(--accent-soft);border-color:transparent}
.row.theory{border-left:3px solid var(--accent)}
.sech{margin:var(--s12) 0 var(--s2);font-size:var(--fs-sub);line-height:var(--lh-sub);font-weight:600}
.foot{margin-top:var(--s8);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--muted)}

/* ---------- khu luyện tập: thanh trên ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:var(--s3) 0;margin:0;border-bottom:1px solid var(--hair)}
.topline{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
.topline .title{font-weight:600;font-size:var(--fs-sub);flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stats{font-size:var(--fs-cap);color:var(--muted);white-space:nowrap}
.progline{margin-top:var(--s3)}
.tools{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3);align-items:center}
.tools .sp{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--surface)}
.seg{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{white-space:nowrap;border:0;background:transparent;padding:var(--s2) var(--s3);min-height:34px;font-size:var(--fs-small);font-weight:500;color:var(--muted)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.more{position:relative}
.more>summary{list-style:none;cursor:pointer}
.more>summary::-webkit-details-marker{display:none}
.more .menu{position:absolute;right:0;top:calc(100% + var(--s1));z-index:40;min-width:220px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:var(--s2);display:flex;flex-direction:column;gap:var(--s1);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.more .menu .btn{justify-content:flex-start;border-color:transparent;background:transparent;width:100%}
.more .menu .btn:hover{background:var(--surface2)}

/* ---------- câu hỏi ---------- */
.stage{margin-top:var(--s6);animation:fade .15s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.stage,.sol{animation:none}}
.ctxbox{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--accent);border-radius:var(--radius);padding:var(--s4) var(--s6);margin-bottom:var(--s4)}
.ctxbox .lbl{font-size:var(--fs-small);font-weight:600;color:var(--accent);margin-bottom:var(--s2);display:flex;justify-content:space-between;gap:var(--s3)}
.ctxbox.collapsed .body{display:none}
.ctxbox .tg{border:0;background:none;color:var(--muted);font-size:var(--fs-cap);font-weight:500;padding:0}
.qcard{background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s6)}
.qhead{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3);flex-wrap:wrap}
.qnum{font-weight:600;color:var(--accent)}
.chip{font-size:var(--fs-cap);font-weight:500;padding:2px var(--s2);border-radius:99px;background:var(--surface2);color:var(--muted)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.sec{background:var(--accent-soft);color:var(--accent)}
.flag{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:var(--s1) var(--s3);min-height:32px;font-size:var(--fs-small);font-weight:500;color:var(--muted)}
.flag.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.qtext{font-size:17px;line-height:1.55}
.qtext p,.ctxbox p{margin:0 0 var(--s3)}
.qtext>*:last-child,.ctxbox .body>*:last-child{margin-bottom:0}
.opts{display:grid;gap:var(--s3);margin-top:var(--s6)}
.opt{display:flex;gap:var(--s3);align-items:flex-start;width:100%;min-height:48px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:var(--s3) var(--s4);transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:var(--accent-soft)}
.opt .k{flex:none;width:28px;height:28px;border-radius:var(--radius-s);background:var(--surface2);display:grid;place-items:center;font-weight:600;font-size:var(--fs-small);color:var(--muted)}
.opt .tx{flex:1;min-width:0;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:var(--ok-soft)}
.opt.right::after{content:"✓ Đúng";flex:none;align-self:center;color:var(--ok);font-size:var(--fs-small);font-weight:600}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--bad-soft)}
.opt.wrong::after{content:"✗ Bạn chọn";flex:none;align-self:center;color:var(--bad);font-size:var(--fs-small);font-weight:600}
.opt[disabled]{cursor:default}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s6);align-items:center}
.hint{font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--muted)}
.sol{margin-top:var(--s6);border-top:1px solid var(--hair);padding-top:var(--s4);animation:fade .15s ease}
.sol h4{margin:0 0 var(--s2);font-size:var(--fs-sub);line-height:var(--lh-sub);font-weight:600}
.sol .verdict{font-size:var(--fs-sub);font-weight:600;margin-bottom:var(--s3)}
.sol .verdict.ok{color:var(--ok)} .sol .verdict.bad{color:var(--bad)}
.sol p{margin:0 0 var(--s3)}
.src{margin-top:var(--s4);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--muted);border-top:1px solid var(--hair);padding-top:var(--s3)}
.note{margin-top:var(--s4);font-size:var(--fs-small);background:var(--warn-soft);color:var(--warn);padding:var(--s3) var(--s4);border-radius:var(--radius-s)}

/* ---------- bảng, bút toán, công thức ---------- */
table.t{border-collapse:collapse;margin:var(--s3) 0 var(--s4);font-size:var(--fs-small);line-height:1.5;display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t th,table.t td{border-bottom:1px solid var(--hair);padding:var(--s3) var(--s4);text-align:left;vertical-align:top;min-width:96px}
table.t th{background:var(--surface2);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.je{font:400 var(--fs-small)/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);border-radius:var(--radius-s);padding:var(--s2) var(--s4);margin:var(--s2) 0;display:block;width:max-content;min-width:260px;max-width:100%;overflow-x:auto}
.opt .je{background:var(--surface)}
.je .cr{padding-left:2.2em}
ul,ol{margin:0 0 var(--s3);padding-left:24px}
li{margin-bottom:var(--s1)}

/* ---------- phân loại (kéo thả) ---------- */
.cls{margin-top:var(--s6)}
.pool,.zone{border:1.5px dashed var(--line);border-radius:var(--radius);padding:var(--s3);min-height:60px;display:flex;flex-wrap:wrap;gap:var(--s2);align-content:flex-start}
.pool{background:var(--surface2)}
.zones{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s4);margin-top:var(--s4)}
.zone h5{width:100%;margin:0 0 var(--s1);font-size:var(--fs-small);font-weight:600;color:var(--accent)}
.zone.over,.pool.over{border-color:var(--accent);background:var(--accent-soft)}
.zonewrap{display:flex;flex-direction:column;gap:var(--s2)}
.item{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-s);padding:var(--s2) var(--s3);min-height:36px;font-size:var(--fs-small);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.item.pick{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent-soft)}
.item.drag{opacity:.4}
.cls .lbl2{font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--muted);margin:0 0 var(--s2)}
.ans-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:var(--s4);margin-top:var(--s2)}
.ans-col{border-top:2px solid var(--accent);padding-top:var(--s2)}
.ans-col h5{margin:0 0 var(--s2);color:var(--accent);font-size:var(--fs-small);font-weight:600}
.ans-col ul{padding-left:20px}
.ans-col li{margin-bottom:var(--s3);font-size:var(--fs-small)}
.ans-col li small{display:block;color:var(--muted);font-size:var(--fs-cap);line-height:var(--lh-cap)}

/* ---------- thanh điều hướng dưới & danh sách câu ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--hair);padding:var(--s3) var(--s4) calc(var(--s3) + env(safe-area-inset-bottom))}
.nav .in{max-width:var(--wide);margin:0 auto;display:flex;align-items:center;gap:var(--s3)}
.nav .mid{flex:1;text-align:center;font-size:var(--fs-small);color:var(--muted)}
.nav .mid b{color:var(--text);font-weight:600}
.nav .btn{min-width:132px;min-height:44px;white-space:nowrap}
.navigator{margin-top:var(--s3);background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s3);display:flex;flex-wrap:wrap;gap:var(--s2);max-height:240px;overflow:auto}
.navigator button{position:relative;min-width:40px;height:36px;border-radius:var(--radius-s);border:1px solid var(--line);background:var(--surface);font-size:var(--fs-cap);font-weight:500;padding:0 var(--s2)}
.navigator button.done{background:var(--accent-soft);color:var(--accent)}
.navigator button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.navigator button.ok::before{content:"✓ "}
.navigator button.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.navigator button.no::before{content:"✗ "}
.navigator button.cur{outline:2px solid var(--accent);outline-offset:1px;font-weight:700}
.navigator button.fl::after{content:"";position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--warn)}
.empty{text-align:center;color:var(--muted);padding:var(--s12) var(--s4)}
.kbd{font:500 var(--fs-cap)/1 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:var(--surface)}

/* ---------- ôn tập lý thuyết: vùng đọc ---------- */
.pagetitle.ch{font-size:var(--fs-chapter);line-height:var(--lh-chapter);margin:var(--s6) 0 var(--s2)}
.toc{display:flex;flex-wrap:wrap;gap:var(--s2);margin:var(--s4) 0 var(--s2);max-width:var(--read)}
.toc button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:var(--s1) var(--s3);min-height:32px;font-size:var(--fs-small);font-weight:500;color:var(--text);text-align:left}
.toc button:hover{border-color:var(--accent);color:var(--accent)}
.topic{border-top:1px solid var(--hair);margin-top:var(--s8);padding-top:var(--s2);scroll-margin-top:96px}
.topic>.th{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;border:0;background:transparent;padding:var(--s3) 0;font-weight:600;font-size:var(--fs-topic);line-height:var(--lh-topic);max-width:var(--read)}
.topic>.th .cv{margin-left:auto;color:var(--muted);transition:transform .15s}
.topic.closed>.th .cv{transform:rotate(-90deg)}
.topic.closed{margin-top:0;padding-top:0}
.topic.closed+.topic:not(.closed){margin-top:var(--s8)}
.topic .tb{padding:0 0 var(--s2)}
.topic.closed .tb{display:none}
.tsec{margin-top:var(--s6)}
.tsec>.lb{display:block;font-size:var(--fs-sub);line-height:var(--lh-sub);font-weight:600;margin-bottom:var(--s3);padding-left:var(--s3);border-left:3px solid var(--accent);color:var(--text)}
.tsec>.lb.b{border-left-color:var(--ok)}
.tsec>.lb.c{border-left-color:var(--warn)}
.tsec>p,.tsec>ul,.tsec>ol,.tsec>.tsrc{max-width:var(--read)}
.tsec p{margin:0 0 var(--s3)}
.formula{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--ok);border-radius:var(--radius-s);padding:var(--s4) var(--s6);margin:var(--s4) 0;font-size:var(--fs-sub);line-height:1.6;font-weight:600;font-variant-numeric:tabular-nums;overflow-x:auto;max-width:var(--wide)}
.tag{font-size:12px;font-weight:600;padding:1px var(--s2);border-radius:99px;background:var(--surface2);color:var(--muted);vertical-align:1px;white-space:nowrap}
.tag.ext{background:var(--warn-soft);color:var(--warn)}
.tsrc{margin-top:var(--s4);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--muted)}
.theory-notes{max-width:var(--read);margin-top:var(--s8)}

/* ---------- công thức ---------- */
.fx{border-top:1px solid var(--hair);margin-top:var(--s8);padding-top:var(--s6);scroll-margin-top:96px}
.fx h3{margin:0 0 var(--s3);font-size:var(--fs-sub);line-height:var(--lh-sub);font-weight:600;max-width:var(--read)}
.fx h3 .qnum{margin-right:var(--s2)}
.fx .parts{max-width:var(--read)}
.fx .parts ul{margin:0 0 var(--s3)}
.fx-ex{max-width:var(--read);background:var(--surface2);border-radius:var(--radius-s);padding:var(--s3) var(--s4);font-size:var(--fs-small);margin-top:var(--s3)}
.fx-ex p{margin:0}
.fx-ex::before{content:"Ví dụ";display:block;font-size:var(--fs-cap);font-weight:600;color:var(--muted);margin-bottom:var(--s1)}
.fxnote{max-width:var(--read);margin-top:var(--s6);color:var(--muted)}

/* ---------- flashcard ---------- */
.fc{margin-top:var(--s6)}
.fcard{position:relative;min-height:300px;background:var(--surface);border:1px solid var(--hair);border-radius:var(--radius);padding:var(--s8) var(--s6);display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:center;width:100%;transition:background .15s,border-color .15s}
.fcard:hover{border-color:var(--accent)}
.fcard .side{font-size:var(--fs-cap);font-weight:600;color:var(--accent);margin-bottom:var(--s4)}
.fcard.back{background:var(--accent-soft);border-color:var(--accent)}
.fcard .ct{font-size:20px;line-height:1.5;font-weight:500}
.fcard .ct p{margin:0 0 var(--s2)}
.fcard .ct table.t,.fcard .ct .je{text-align:left;margin-left:auto;margin-right:auto}
.fcard .tp{margin-top:var(--s6);font-size:var(--fs-cap);color:var(--muted)}

/* ---------- bảng hệ thống tài khoản ---------- */
:root{--acctw:min(420px,38vw)}
.acct{position:fixed;top:0;right:0;bottom:0;width:var(--acctw);z-index:45;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:var(--s4) var(--s4) 0}
.acct[hidden]{display:none}
.acct-h{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.acct-h b{font-size:var(--fs-sub);font-weight:600}
.acct-h .hint{flex:1;min-width:120px}

<script id="bank-data" type="application/json">{"lms":[{"key":"ch1","title":"Chương 1 – Tổng quan về kế toán","units":[{"id":"lms-ch1-u001","context":null,"questions":[{"id":"lms-ch1-q001","num":"Câu 2.1","type":"mcq","text":"Lựa chọn nào sau đây không phải là công việc của kế toán?","options":[{"id":"lms-ch1-q001-A","text":"Ghi chép dữ liệu."},{"id":"lms-ch1-q001-B","text":"Phân loại, sắp xếp dữ liệu."},{"id":"lms-ch1-q001-C","text":"Quyết định phương án đầu tư."},{"id":"lms-ch1-q001-D","text":"Cung cấp thông tin."}],"correctOptionId":"lms-ch1-q001-C","explanation":"<p>Quyết định phương án đầu tư là việc của nhà quản trị; kế toán chỉ ghi chép, phân loại, xử lý và cung cấp thông tin để hỗ trợ quyết định. Các phương án a, b, d đều là công việc của kế toán.<\/p>","source":"Slide Chương 1, slide 12, 17–18","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u002","context":null,"questions":[{"id":"lms-ch1-q002","num":"Câu 2.2","type":"mcq","text":"Kế toán thực hiện những công việc nào sau đây?","options":[{"id":"lms-ch1-q002-A","text":"Thu thập thông tin."},{"id":"lms-ch1-q002-B","text":"Xử lý, kiểm tra và phân tích thông tin."},{"id":"lms-ch1-q002-C","text":"Cung cấp thông tin kinh tế, tài chính."},{"id":"lms-ch1-q002-D","text":"Tất cả các công việc trên.","pinned":true}],"correctOptionId":"lms-ch1-q002-D","explanation":"<p>Kế toán thu thập, xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế, tài chính; cả ba công việc a, b, c đều đúng nên chọn \"Tất cả các công việc trên\".<\/p>","source":"Slide Chương 1, slide 11–12; Luật Kế toán 88/2015/QH13","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u003","context":null,"questions":[{"id":"lms-ch1-q003","num":"Câu 2.3","type":"mcq","text":"Theo Luật Kế toán Việt Nam năm 2015, kế toán là gì?","options":[{"id":"lms-ch1-q003-A","text":"Là việc sử dụng số liệu quá khứ để dự báo các sự kiện trong tương lai."},{"id":"lms-ch1-q003-B","text":"Là việc tính toán và ghi chép bằng tiền mọi hoạt động của doanh nghiệp."},{"id":"lms-ch1-q003-C","text":"Là việc thu thập, xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế, tài chính dưới hình thức giá trị, hiện vật và thời gian lao động."},{"id":"lms-ch1-q003-D","text":"Là việc ghi nhận quá trình hình thành và phát triển của tổ chức kinh doanh."}],"correctOptionId":"lms-ch1-q003-C","explanation":"<p>Luật Kế toán 2015: kế toán là việc thu thập, xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế, tài chính dưới hình thức giá trị, hiện vật và thời gian lao động. Các phương án còn lại không phải định nghĩa theo luật.<\/p>","source":"Slide Chương 1, slide 11; Luật Kế toán 88/2015/QH13","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u004","context":null,"questions":[{"id":"lms-ch1-q004","num":"Câu 2.4","type":"mcq","text":"Kế toán sử dụng những loại thước đo nào?","options":[{"id":"lms-ch1-q004-A","text":"Thước đo giá trị."},{"id":"lms-ch1-q004-B","text":"Thước đo hiện vật."},{"id":"lms-ch1-q004-C","text":"Thước đo thời gian lao động."},{"id":"lms-ch1-q004-D","text":"Cả ba loại thước đo trên.","pinned":true}],"correctOptionId":"lms-ch1-q004-D","explanation":"<p>Kế toán dùng cả ba loại thước đo: giá trị (tiền tệ), hiện vật và thời gian lao động; thước đo tiền tệ là thước đo thống nhất.<\/p>","source":"Slide Chương 1, slide 11, 54","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u005","context":null,"questions":[{"id":"lms-ch1-q005","num":"Câu 2.5","type":"mcq","text":"Chức năng cơ bản của kế toán là gì?","options":[{"id":"lms-ch1-q005-A","text":"Cung cấp thông tin kinh tế, tài chính cho các đối tượng sử dụng."},{"id":"lms-ch1-q005-B","text":"Trực tiếp điều hành mọi hoạt động sản xuất, kinh doanh của doanh nghiệp."},{"id":"lms-ch1-q005-C","text":"Giám sát, kiểm tra các hoạt động kinh tế, tài chính của đơn vị."},{"id":"lms-ch1-q005-D","text":"Cả a và c.","pinned":true}],"correctOptionId":"lms-ch1-q005-D","explanation":"<p>Kế toán có hai chức năng cơ bản: cung cấp thông tin và kiểm tra, giám sát (a và c). Kế toán không trực tiếp điều hành hoạt động sản xuất, kinh doanh (b sai).<\/p>","source":"Slide Chương 1, slide 17","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u006","context":null,"questions":[{"id":"lms-ch1-q006","num":"Câu 2.6","type":"mcq","text":"Kế toán tài chính chủ yếu cung cấp thông tin thông qua phương tiện nào?","options":[{"id":"lms-ch1-q006-A","text":"Sổ kế toán chi tiết."},{"id":"lms-ch1-q006-B","text":"Báo cáo tài chính."},{"id":"lms-ch1-q006-C","text":"Kế hoạch sản xuất nội bộ."},{"id":"lms-ch1-q006-D","text":"Báo cáo dự toán của từng bộ phận."}],"correctOptionId":"lms-ch1-q006-B","explanation":"<p>Kế toán tài chính cung cấp thông tin chủ yếu cho đối tượng bên ngoài và bên trong thông qua báo cáo tài chính. Kế hoạch nội bộ, dự toán bộ phận thuộc kế toán quản trị.<\/p>","source":"Slide Chương 1, slide 14–15","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u007","context":null,"questions":[{"id":"lms-ch1-q007","num":"Câu 2.7","type":"mcq","text":"Đặc điểm nào sau đây thuộc kế toán tài chính?","options":[{"id":"lms-ch1-q007-A","text":"Thông tin chủ yếu phản ánh các sự kiện đã xảy ra."},{"id":"lms-ch1-q007-B","text":"Thông tin liên quan đến toàn doanh nghiệp."},{"id":"lms-ch1-q007-C","text":"Việc lập và trình bày thông tin phải tuân thủ các quy định kế toán."},{"id":"lms-ch1-q007-D","text":"Tất cả các đặc điểm trên.","pinned":true}],"correctOptionId":"lms-ch1-q007-D","explanation":"<p>Kế toán tài chính phản ánh sự kiện đã xảy ra, liên quan toàn doanh nghiệp và phải tuân thủ chuẩn mực, chế độ kế toán; cả ba đặc điểm đều đúng.<\/p>","source":"Slide Chương 1, slide 15","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u008","context":null,"questions":[{"id":"lms-ch1-q008","num":"Câu 2.8","type":"mcq","text":"Kế toán quản trị chủ yếu cung cấp thông tin cho đối tượng nào?","options":[{"id":"lms-ch1-q008-A","text":"Cơ quan thuế."},{"id":"lms-ch1-q008-B","text":"Nhà quản trị trong doanh nghiệp."},{"id":"lms-ch1-q008-C","text":"Nhà đầu tư bên ngoài."},{"id":"lms-ch1-q008-D","text":"Ngân hàng và chủ nợ."}],"correctOptionId":"lms-ch1-q008-B","explanation":"<p>Kế toán quản trị phục vụ chủ yếu nhà quản trị trong doanh nghiệp. Cơ quan thuế, nhà đầu tư bên ngoài, ngân hàng là đối tượng dùng thông tin của kế toán tài chính.<\/p>","source":"Slide Chương 1, slide 14–15","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u009","context":null,"questions":[{"id":"lms-ch1-q009","num":"Câu 2.9","type":"mcq","text":"Đối tượng của kế toán trong doanh nghiệp bao gồm nội dung nào?","options":[{"id":"lms-ch1-q009-A","text":"Tình hình thị trường và đối thủ cạnh tranh."},{"id":"lms-ch1-q009-B","text":"Tài sản, nguồn hình thành tài sản và sự vận động của chúng."},{"id":"lms-ch1-q009-C","text":"Tình hình chấp hành kỷ luật lao động."},{"id":"lms-ch1-q009-D","text":"Chỉ bao gồm các khoản thu, chi tiền mặt."}],"correctOptionId":"lms-ch1-q009-B","explanation":"<p>Đối tượng của kế toán là tài sản, nguồn hình thành tài sản và sự vận động của chúng trong quá trình sản xuất, kinh doanh. Các phương án khác không phải đối tượng kế toán hoặc quá hẹp.<\/p>","source":"Slide Chương 1, slide 21–22","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u010","context":null,"questions":[{"id":"lms-ch1-q010","num":"Câu 2.10","type":"mcq","text":"Đặc điểm nào sau đây phù hợp với tài sản của doanh nghiệp?","options":[{"id":"lms-ch1-q010-A","text":"Có thể tồn tại dưới hình thức hữu hình hoặc vô hình."},{"id":"lms-ch1-q010-B","text":"Do doanh nghiệp kiểm soát."},{"id":"lms-ch1-q010-C","text":"Có khả năng mang lại lợi ích kinh tế trong tương lai."},{"id":"lms-ch1-q010-D","text":"Tất cả các đặc điểm trên.","pinned":true}],"correctOptionId":"lms-ch1-q010-D","explanation":"<p>Tài sản là nguồn lực kinh tế do đơn vị kiểm soát, hình thành từ giao dịch quá khứ, có khả năng mang lại lợi ích kinh tế tương lai; có thể hữu hình hoặc vô hình. Cả a, b, c đều đúng.<\/p>","source":"Slide Chương 1, slide 24–27","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u011","context":null,"questions":[{"id":"lms-ch1-q011","num":"Câu 2.11","type":"mcq","text":"Khoản phải thu được ghi nhận là tài sản của doanh nghiệp vì lý do nào?","options":[{"id":"lms-ch1-q011-A","text":"Là nguồn lực kinh tế do doanh nghiệp kiểm soát."},{"id":"lms-ch1-q011-B","text":"Có khả năng mang lại lợi ích kinh tế trong tương lai."},{"id":"lms-ch1-q011-C","text":"Được hình thành từ giao dịch đã xảy ra."},{"id":"lms-ch1-q011-D","text":"Cả a, b và c.","pinned":true}],"correctOptionId":"lms-ch1-q011-D","explanation":"<p>Khoản phải thu đáp ứng cả ba điều kiện: là nguồn lực do doanh nghiệp kiểm soát (quyền đòi nợ), có khả năng mang lại lợi ích kinh tế (thu tiền) và hình thành từ giao dịch đã xảy ra.<\/p>","source":"Slide Chương 1, slide 24, 26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u012","context":null,"questions":[{"id":"lms-ch1-q012","num":"Câu 2.12","type":"mcq","text":"Khoản tạm ứng cho nhân viên thực hiện công việc của doanh nghiệp được phân loại là gì?","options":[{"id":"lms-ch1-q012-A","text":"Tài sản của doanh nghiệp."},{"id":"lms-ch1-q012-B","text":"Nợ phải trả của doanh nghiệp."},{"id":"lms-ch1-q012-C","text":"Vốn chủ sở hữu."},{"id":"lms-ch1-q012-D","text":"Doanh thu của doanh nghiệp."}],"correctOptionId":"lms-ch1-q012-A","explanation":"<p>Tạm ứng là khoản doanh nghiệp đã chi cho nhân viên, nhân viên có nghĩa vụ thanh toán lại/chi tiêu cho doanh nghiệp, là quyền của doanh nghiệp nên là tài sản (phải thu), không phải nợ phải trả, vốn chủ sở hữu hay doanh thu.<\/p>","source":"Slide Chương 1, slide 24, 26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u013","context":null,"questions":[{"id":"lms-ch1-q013","num":"Câu 2.13","type":"mcq","text":"Khoản tiền doanh nghiệp ứng trước cho người bán được phân loại là gì?","options":[{"id":"lms-ch1-q013-A","text":"Tài sản của doanh nghiệp."},{"id":"lms-ch1-q013-B","text":"Nợ phải trả của doanh nghiệp."},{"id":"lms-ch1-q013-C","text":"Doanh thu của doanh nghiệp."},{"id":"lms-ch1-q013-D","text":"Chi phí của doanh nghiệp."}],"correctOptionId":"lms-ch1-q013-A","explanation":"<p>Tiền ứng trước cho người bán là khoản phải thu (quyền nhận hàng/lợi ích) nên là tài sản; không phải nợ phải trả, doanh thu hay chi phí.<\/p>","source":"Slide Chương 1, slide 24, 26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u014","context":null,"questions":[{"id":"lms-ch1-q014","num":"Câu 2.14","type":"mcq","text":"Nhận định nào đúng về các khoản nợ phải thu của doanh nghiệp?","options":[{"id":"lms-ch1-q014-A","text":"Không phải là tài sản vì tiền chưa được thu về."},{"id":"lms-ch1-q014-B","text":"Là tài sản, thể hiện quyền của doanh nghiệp được thu tiền hoặc nhận lợi ích kinh tế từ tổ chức, cá nhân khác."},{"id":"lms-ch1-q014-C","text":"Chỉ là tài sản khi tiền đã được thu."},{"id":"lms-ch1-q014-D","text":"Luôn được phân loại là vốn chủ sở hữu."}],"correctOptionId":"lms-ch1-q014-B","explanation":"<p>Nợ phải thu là tài sản vì thể hiện quyền thu tiền hoặc lợi ích kinh tế từ tổ chức, cá nhân khác, hình thành từ giao dịch đã xảy ra. Không cần đợi thu tiền mới là tài sản, và không phải vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 24, 26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u015","context":null,"questions":[{"id":"lms-ch1-q015","num":"Câu 2.15","type":"mcq","text":"Khoản mục nào sau đây được phân loại là tài sản?","options":[{"id":"lms-ch1-q015-A","text":"Quỹ khen thưởng, phúc lợi."},{"id":"lms-ch1-q015-B","text":"Phải trả người bán."},{"id":"lms-ch1-q015-C","text":"Chi phí trả trước."},{"id":"lms-ch1-q015-D","text":"Chi phí phải trả."}],"correctOptionId":"lms-ch1-q015-C","explanation":"<p>Chi phí trả trước là tài sản (đã chi tiền, sẽ mang lại lợi ích nhiều kỳ). Quỹ khen thưởng phúc lợi, phải trả người bán, chi phí phải trả là nợ phải trả (nguồn vốn).<\/p>","source":"Slide Chương 1, slide 24, 31","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u016","context":null,"questions":[{"id":"lms-ch1-q016","num":"Câu 2.16","type":"mcq","text":"Khoản mục nào sau đây là tài sản của doanh nghiệp?","options":[{"id":"lms-ch1-q016-A","text":"Phải thu khách hàng."},{"id":"lms-ch1-q016-B","text":"Phải trả người bán."},{"id":"lms-ch1-q016-C","text":"Lợi nhuận sau thuế chưa phân phối."},{"id":"lms-ch1-q016-D","text":"Quỹ đầu tư phát triển."}],"correctOptionId":"lms-ch1-q016-A","explanation":"<p>Phải thu khách hàng là tài sản. Phải trả người bán là nợ phải trả; lợi nhuận sau thuế chưa phân phối và quỹ đầu tư phát triển là vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 26, 31–32","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u017","context":null,"questions":[{"id":"lms-ch1-q017","num":"Câu 2.17","type":"mcq","text":"Khoản mục nào sau đây được phân loại là tài sản?","options":[{"id":"lms-ch1-q017-A","text":"Đầu tư vào công ty con."},{"id":"lms-ch1-q017-B","text":"Phải trả người bán."},{"id":"lms-ch1-q017-C","text":"Thuế giá trị gia tăng phải nộp."},{"id":"lms-ch1-q017-D","text":"Vốn đầu tư của chủ sở hữu."}],"correctOptionId":"lms-ch1-q017-A","explanation":"<p>Đầu tư vào công ty con là tài sản dài hạn. Phải trả người bán, thuế GTGT phải nộp là nợ phải trả; vốn đầu tư của chủ sở hữu là vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 27, 31–32","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u018","context":null,"questions":[{"id":"lms-ch1-q018","num":"Câu 2.18","type":"mcq","text":"Tổng tài sản của doanh nghiệp được hình thành từ những nguồn nào?","options":[{"id":"lms-ch1-q018-A","text":"Chỉ từ vốn đầu tư của chủ sở hữu."},{"id":"lms-ch1-q018-B","text":"Nợ phải trả và vốn chủ sở hữu."},{"id":"lms-ch1-q018-C","text":"Chỉ từ nợ phải trả."},{"id":"lms-ch1-q018-D","text":"Doanh thu và chi phí."}],"correctOptionId":"lms-ch1-q018-B","explanation":"<p>Tài sản được hình thành từ hai nguồn: nợ phải trả và vốn chủ sở hữu (Tài sản = Nợ phải trả + Vốn CSH). Doanh thu, chi phí thuộc tình hình kinh doanh, không phải nguồn hình thành tài sản.<\/p>","source":"Slide Chương 1, slide 28, 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u019","context":null,"questions":[{"id":"lms-ch1-q019","num":"Câu 2.19","type":"mcq","text":"Nhận định nào sau đây đúng về nợ phải trả của doanh nghiệp?","options":[{"id":"lms-ch1-q019-A","text":"Là nguồn lực kinh tế do doanh nghiệp kiểm soát."},{"id":"lms-ch1-q019-B","text":"Là phần chênh lệch giữa tài sản và vốn chủ sở hữu."},{"id":"lms-ch1-q019-C","text":"Là nghĩa vụ dự kiến phát sinh từ các giao dịch có thể xảy ra trong tương lai."},{"id":"lms-ch1-q019-D","text":"Là nghĩa vụ hiện tại phát sinh từ các giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán bằng các nguồn lực của mình."}],"correctOptionId":"lms-ch1-q019-D","explanation":"<p>Nợ phải trả là nghĩa vụ hiện tại phát sinh từ giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán bằng nguồn lực của mình. (a là định nghĩa tài sản; b là vốn chủ sở hữu; c sai vì nghĩa vụ phải là nghĩa vụ hiện tại từ giao dịch đã xảy ra.)<\/p>","source":"Slide Chương 1, slide 29","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u020","context":null,"questions":[{"id":"lms-ch1-q020","num":"Câu 2.20","type":"mcq","text":"Ngày 31/12/N, Công ty ABC có các khoản mục sau (đơn vị: triệu đồng): tiền mặt 500; tiền gửi ngân hàng 700; phải thu khách hàng 800; nguyên vật liệu 500; hàng hóa 500; tài sản cố định 700; công cụ, dụng cụ 150; tạm ứng 150; phải trả người bán 1.000; vay ngân hàng 800. Tổng tài sản và vốn chủ sở hữu của công ty lần lượt là bao nhiêu?","options":[{"id":"lms-ch1-q020-A","text":"4.000 và 1.800."},{"id":"lms-ch1-q020-B","text":"4.000 và 2.200."},{"id":"lms-ch1-q020-C","text":"4.000 và 2.000."},{"id":"lms-ch1-q020-D","text":"3.000 và 1.200."}],"correctOptionId":"lms-ch1-q020-B","explanation":"<p>Tổng tài sản = 500 + 700 + 800 + 500 + 500 + 700 + 150 + 150 = 4.000 triệu. Nợ phải trả = 1.000 + 800 = 1.800 triệu. Vốn chủ sở hữu = 4.000 - 1.800 = 2.200 triệu.<\/p>","source":"Slide Chương 1, slide 36 (Tài sản = Nợ phải trả + Vốn CSH)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u021","context":null,"questions":[{"id":"lms-ch1-q021","num":"Câu 2.21","type":"mcq","text":"Nội dung nào sau đây là một nguyên tắc kế toán cơ bản?","options":[{"id":"lms-ch1-q021-A","text":"Đầy đủ."},{"id":"lms-ch1-q021-B","text":"Trung thực."},{"id":"lms-ch1-q021-C","text":"Trọng yếu."},{"id":"lms-ch1-q021-D","text":"Khách quan."}],"correctOptionId":"lms-ch1-q021-C","explanation":"<p>Theo Chuẩn mực chung (VAS 01), 7 nguyên tắc kế toán gồm: cơ sở dồn tích, hoạt động liên tục, giá gốc, phù hợp, nhất quán, thận trọng, trọng yếu. Trung thực, khách quan, đầy đủ là các yêu cầu đối với thông tin kế toán, không phải nguyên tắc.<\/p>","source":"Slide Chương 1, slide 57–60","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u022","context":null,"questions":[{"id":"lms-ch1-q022","num":"Câu 2.22","type":"mcq","text":"Nội dung nào sau đây là một nguyên tắc kế toán cơ bản?","options":[{"id":"lms-ch1-q022-A","text":"Hoạt động liên tục."},{"id":"lms-ch1-q022-B","text":"Trung thực."},{"id":"lms-ch1-q022-C","text":"Đầy đủ."},{"id":"lms-ch1-q022-D","text":"Khách quan."}],"correctOptionId":"lms-ch1-q022-A","explanation":"<p>Hoạt động liên tục là một trong 7 nguyên tắc kế toán cơ bản. Trung thực, đầy đủ, khách quan là các yêu cầu đối với công tác kế toán.<\/p>","source":"Slide Chương 1, slide 57–60, 63","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u023","context":null,"questions":[{"id":"lms-ch1-q023","num":"Câu 2.23","type":"mcq","text":"Theo nguyên tắc thận trọng, doanh nghiệp không được thực hiện việc nào sau đây?","options":[{"id":"lms-ch1-q023-A","text":"Lập dự phòng khi có căn cứ phù hợp."},{"id":"lms-ch1-q023-B","text":"Đánh giá cao hơn giá trị của tài sản và thu nhập."},{"id":"lms-ch1-q023-C","text":"Ghi nhận chi phí khi có bằng chứng về khả năng phát sinh."},{"id":"lms-ch1-q023-D","text":"Ghi nhận doanh thu khi có bằng chứng chắc chắn về khả năng thu được lợi ích kinh tế."}],"correctOptionId":"lms-ch1-q023-B","explanation":"<p>Nguyên tắc thận trọng không cho phép đánh giá cao hơn giá trị tài sản và thu nhập. Lập dự phòng có căn cứ, ghi nhận chi phí khi có khả năng phát sinh và ghi nhận doanh thu khi có bằng chứng chắc chắn đều là yêu cầu của nguyên tắc này.<\/p>","source":"Slide Chương 1, slide 69","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u024","context":null,"questions":[{"id":"lms-ch1-q024","num":"Câu 2.24","type":"mcq","text":"Nguyên tắc thận trọng yêu cầu nội dung nào sau đây?","options":[{"id":"lms-ch1-q024-A","text":"Lập dự phòng nhưng không lập quá lớn."},{"id":"lms-ch1-q024-B","text":"Không đánh giá cao hơn giá trị của tài sản và thu nhập."},{"id":"lms-ch1-q024-C","text":"Không đánh giá thấp hơn giá trị của nợ phải trả và chi phí."},{"id":"lms-ch1-q024-D","text":"Tất cả các nội dung trên.","pinned":true}],"correctOptionId":"lms-ch1-q024-D","explanation":"<p>Nguyên tắc thận trọng yêu cầu: lập dự phòng nhưng không quá lớn; không đánh giá cao hơn tài sản và thu nhập; không đánh giá thấp hơn nợ phải trả và chi phí. Cả a, b, c đều đúng.<\/p>","source":"Slide Chương 1, slide 69–70","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u025","context":null,"questions":[{"id":"lms-ch1-q025","num":"Câu 2.25","type":"mcq","text":"Doanh nghiệp mua hai tài sản giống nhau ở hai thời điểm với mức giá khác nhau. Khi ghi nhận ban đầu, giá trị của từng tài sản được xác định như thế nào?","options":[{"id":"lms-ch1-q025-A","text":"Hai tài sản giống nhau phải được ghi nhận cùng một giá."},{"id":"lms-ch1-q025-B","text":"Căn cứ vào chi phí thực tế doanh nghiệp đã bỏ ra để có được từng tài sản."},{"id":"lms-ch1-q025-C","text":"Luôn căn cứ vào giá thị trường tại cuối kỳ."},{"id":"lms-ch1-q025-D","text":"Do doanh nghiệp tự lựa chọn một mức giá thuận tiện."}],"correctOptionId":"lms-ch1-q025-B","explanation":"<p>Theo nguyên tắc giá gốc, tài sản ghi nhận theo số tiền hoặc tương đương tiền đã trả, phải trả hoặc giá trị hợp lý tại thời điểm ghi nhận; hai tài sản giống nhau mua ở thời điểm, giá khác nhau thì ghi theo chi phí thực tế của từng tài sản. Giá gốc không thay đổi theo giá thị trường cuối kỳ.<\/p>","source":"Slide Chương 1, slide 64–65","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u026","context":null,"questions":[{"id":"lms-ch1-q026","num":"Câu 2.26","type":"mcq","text":"Việc ghi nhận một khoản tổn thất khi có bằng chứng cho thấy tổn thất có khả năng xảy ra thể hiện nguyên tắc nào?","options":[{"id":"lms-ch1-q026-A","text":"Trọng yếu."},{"id":"lms-ch1-q026-B","text":"Cơ sở dồn tích."},{"id":"lms-ch1-q026-C","text":"Giá gốc."},{"id":"lms-ch1-q026-D","text":"Thận trọng."}],"correctOptionId":"lms-ch1-q026-D","explanation":"<p>Ghi nhận chi phí/tổn thất khi có bằng chứng về khả năng xảy ra thể hiện nguyên tắc thận trọng (\"chi phí phải được ghi nhận khi nó có khả năng phát sinh\").<\/p>","source":"Slide Chương 1, slide 69","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u027","context":null,"questions":[{"id":"lms-ch1-q027","num":"Câu 2.27","type":"mcq","text":"Nhận định nào sau đây không đúng?","options":[{"id":"lms-ch1-q027-A","text":"Tính trọng yếu phụ thuộc vào độ lớn, tính chất của thông tin hoặc sai sót trong hoàn cảnh cụ thể."},{"id":"lms-ch1-q027-B","text":"Theo cơ sở dồn tích, nghiệp vụ được ghi nhận khi phát sinh, không phụ thuộc thời điểm thu hoặc chi tiền."},{"id":"lms-ch1-q027-C","text":"Nguyên tắc phù hợp yêu cầu không đánh giá cao tài sản, thu nhập và không đánh giá thấp nợ phải trả, chi phí."},{"id":"lms-ch1-q027-D","text":"Giả định hoạt động liên tục cho rằng doanh nghiệp sẽ tiếp tục hoạt động kinh doanh bình thường trong tương lai gần."}],"correctOptionId":"lms-ch1-q027-C","explanation":"<p>Câu c sai: yêu cầu không đánh giá cao tài sản, thu nhập và không đánh giá thấp nợ phải trả, chi phí là nội dung của nguyên tắc thận trọng, không phải nguyên tắc phù hợp (phù hợp: doanh thu nào, chi phí tương ứng đó). Các câu a, b, d đúng.<\/p>","source":"Slide Chương 1, slide 61, 63, 66, 69, 71","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u028","context":null,"questions":[{"id":"lms-ch1-q028","num":"Câu 2.28","type":"mcq","text":"Công ty ABC giao hàng cho khách hàng ngày 15/03/N và cho khách hàng mua chịu trong 30 ngày. Khách hàng thanh toán toàn bộ tiền hàng ngày 15/04/N. Theo nguyên tắc cơ sở dồn tích, doanh thu được ghi nhận vào thời điểm nào?","options":[{"id":"lms-ch1-q028-A","text":"Phân bổ đều cho tháng 3 và tháng 4."},{"id":"lms-ch1-q028-B","text":"Ngày 15/04/N."},{"id":"lms-ch1-q028-C","text":"Ngày 15/03/N."},{"id":"lms-ch1-q028-D","text":"Ngày ký hợp đồng, không phụ thuộc thời điểm giao hàng."}],"correctOptionId":"lms-ch1-q028-C","explanation":"<p>Theo cơ sở dồn tích, doanh thu ghi nhận khi nghiệp vụ bán hàng phát sinh (giao hàng) ngày 15/03/N, không phụ thuộc thời điểm thu tiền 15/04/N.<\/p>","source":"Slide Chương 1, slide 61–62","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u029","context":null,"questions":[{"id":"lms-ch1-q029","num":"Câu 2.29","type":"mcq","text":"Nội dung: “Nghiệp vụ kinh tế, tài chính được ghi sổ vào thời điểm phát sinh, không căn cứ vào thời điểm thực tế thu hoặc chi tiền” thuộc nguyên tắc nào?","options":[{"id":"lms-ch1-q029-A","text":"Hoạt động liên tục."},{"id":"lms-ch1-q029-B","text":"Phù hợp."},{"id":"lms-ch1-q029-C","text":"Cơ sở dồn tích."},{"id":"lms-ch1-q029-D","text":"Nhất quán."}],"correctOptionId":"lms-ch1-q029-C","explanation":"<p>Đây là nội dung của nguyên tắc cơ sở dồn tích: ghi sổ vào thời điểm phát sinh, không căn cứ thời điểm thực thu, thực chi tiền.<\/p>","source":"Slide Chương 1, slide 61","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u030","context":null,"questions":[{"id":"lms-ch1-q030","num":"Câu 2.30","type":"mcq","text":"Tháng 1, Công ty Thịnh Khang chuyển khoản 120 triệu đồng trả tiền thuê văn phòng cho ba tháng đầu năm và ghi nhận toàn bộ số tiền vào chi phí tháng 1. Cách ghi nhận này chủ yếu vi phạm nguyên tắc nào?","options":[{"id":"lms-ch1-q030-A","text":"Giá gốc."},{"id":"lms-ch1-q030-B","text":"Phù hợp."},{"id":"lms-ch1-q030-C","text":"Hoạt động liên tục."},{"id":"lms-ch1-q030-D","text":"Nhất quán."}],"correctOptionId":"lms-ch1-q030-B","explanation":"<p>Khoản thuê văn phòng 120 triệu cho 3 tháng phải phân bổ cho 3 tháng (40 triệu mỗi tháng) để chi phí phù hợp với doanh thu từng kỳ; ghi toàn bộ vào tháng 1 vi phạm nguyên tắc phù hợp (và cũng liên quan cơ sở dồn tích, nhưng phương án này không có). Giá gốc, hoạt động liên tục, nhất quán không bị vi phạm chủ yếu.<\/p>","source":"Slide Chương 1, slide 61, 66","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u031","context":null,"questions":[{"id":"lms-ch1-q031","num":"Câu 2.31","type":"mcq","text":"Theo nguyên tắc phù hợp, nhận định nào sau đây đúng?","options":[{"id":"lms-ch1-q031-A","text":"Khi ghi nhận doanh thu phải ghi nhận chi phí tương ứng liên quan đến việc tạo ra doanh thu đó."},{"id":"lms-ch1-q031-B","text":"Chi phí tương ứng có thể là chi phí phát sinh trong kỳ tạo ra doanh thu."},{"id":"lms-ch1-q031-C","text":"Chi phí tương ứng có thể là chi phí của kỳ trước hoặc chi phí phải trả nhưng liên quan đến doanh thu trong kỳ."},{"id":"lms-ch1-q031-D","text":"Cả a, b và c.","pinned":true}],"correctOptionId":"lms-ch1-q031-D","explanation":"<p>Nguyên tắc phù hợp: ghi nhận doanh thu thì phải ghi nhận chi phí tương ứng; chi phí tương ứng có thể là chi phí phát sinh trong kỳ, chi phí của kỳ trước hoặc chi phí phải trả nhưng liên quan đến doanh thu kỳ này. Cả a, b, c đúng.<\/p>","source":"Slide Chương 1, slide 66–67","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u032","context":null,"questions":[{"id":"lms-ch1-q032","num":"Câu 2.32","type":"mcq","text":"Thông tin kế toán phải đáp ứng đầy đủ những yêu cầu cơ bản nào?","options":[{"id":"lms-ch1-q032-A","text":"Trung thực, khách quan, kịp thời và đầy đủ."},{"id":"lms-ch1-q032-B","text":"Trung thực, khách quan, đầy đủ, kịp thời, dễ hiểu và có thể so sánh."},{"id":"lms-ch1-q032-C","text":"Trung thực, công khai, minh bạch, dễ hiểu và có thể so sánh."},{"id":"lms-ch1-q032-D","text":"Kịp thời, đầy đủ, dễ hiểu và dễ kiểm tra, đối chiếu."}],"correctOptionId":"lms-ch1-q032-B","explanation":"<p>Các yêu cầu cơ bản đối với thông tin kế toán: trung thực, khách quan, đầy đủ, kịp thời, dễ hiểu, có thể so sánh. Các phương án khác thiếu yêu cầu hoặc thêm yếu tố không thuộc danh sách (công khai, minh bạch, dễ kiểm tra).<\/p>","source":"Slide Chương 1, slide 57–59; Luật Kế toán 2015 (Điều 6)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u033","context":null,"questions":[{"id":"lms-ch1-q033","num":"Câu 2.33","type":"mcq","text":"Trong các văn bản sau, văn bản nào có giá trị pháp lý cao nhất?","options":[{"id":"lms-ch1-q033-A","text":"Chế độ kế toán."},{"id":"lms-ch1-q033-B","text":"Luật Kế toán."},{"id":"lms-ch1-q033-C","text":"Chuẩn mực kế toán."},{"id":"lms-ch1-q033-D","text":"Quy định của tổ chức nghề nghiệp."}],"correctOptionId":"lms-ch1-q033-B","explanation":"<p>Luật Kế toán do Quốc hội ban hành, có giá trị pháp lý cao nhất trong hệ thống (Luật &gt; chuẩn mực &gt; chế độ kế toán &gt; quy định nghề nghiệp).<\/p>","source":"Slide Chương 1, slide 73–74","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u034","context":null,"questions":[{"id":"lms-ch1-q034","num":"Câu 2.34","type":"mcq","text":"Khoản mục nào sau đây được phân loại là nợ phải trả?","options":[{"id":"lms-ch1-q034-A","text":"Tiền gửi ngân hàng."},{"id":"lms-ch1-q034-B","text":"Vay ngân hàng."},{"id":"lms-ch1-q034-C","text":"Phải thu khách hàng."},{"id":"lms-ch1-q034-D","text":"Vốn đầu tư của chủ sở hữu."}],"correctOptionId":"lms-ch1-q034-B","explanation":"<p>Vay ngân hàng là nghĩa vụ phải thanh toán nên là nợ phải trả. Tiền gửi ngân hàng và phải thu khách hàng là tài sản; vốn đầu tư của chủ sở hữu là vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 29, 31","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u035","context":null,"questions":[{"id":"lms-ch1-q035","num":"Câu 2.35","type":"mcq","text":"Khoản mục nào sau đây thuộc vốn chủ sở hữu?","options":[{"id":"lms-ch1-q035-A","text":"Phải trả người bán."},{"id":"lms-ch1-q035-B","text":"Vay ngân hàng."},{"id":"lms-ch1-q035-C","text":"Vốn đầu tư của chủ sở hữu."},{"id":"lms-ch1-q035-D","text":"Phải thu khách hàng."}],"correctOptionId":"lms-ch1-q035-C","explanation":"<p>Vốn đầu tư của chủ sở hữu thuộc vốn chủ sở hữu. Phải trả người bán và vay ngân hàng là nợ phải trả; phải thu khách hàng là tài sản.<\/p>","source":"Slide Chương 1, slide 29, 32","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u036","context":null,"questions":[{"id":"lms-ch1-q036","num":"Câu 2.36","type":"mcq","text":"Doanh nghiệp mua một máy móc trị giá 300 triệu đồng, chưa thanh toán cho người bán. Nghiệp vụ này làm thay đổi các đối tượng kế toán như thế nào?","options":[{"id":"lms-ch1-q036-A","text":"Tài sản tăng và nợ phải trả tăng."},{"id":"lms-ch1-q036-B","text":"Tài sản tăng và vốn chủ sở hữu tăng."},{"id":"lms-ch1-q036-C","text":"Tài sản giảm và nợ phải trả giảm."},{"id":"lms-ch1-q036-D","text":"Chỉ làm thay đổi cơ cấu tài sản."}],"correctOptionId":"lms-ch1-q036-A","explanation":"<p>Mua máy móc 300 triệu chưa trả tiền: tài sản (máy móc) tăng 300, nợ phải trả (phải trả người bán) tăng 300; vốn chủ sở hữu không đổi, tổng tài sản và tổng nguồn vốn cùng tăng.<\/p>","source":"Slide Chương 1, slide 36, 48–49","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u037","context":null,"questions":[{"id":"lms-ch1-q037","num":"Câu 2.37","type":"mcq","text":"Doanh nghiệp mua 100 sản phẩm với tổng giá mua 500 triệu đồng và bán 20 sản phẩm trong kỳ. Theo nguyên tắc phù hợp, giá vốn của 20 sản phẩm đã bán là bao nhiêu?","options":[{"id":"lms-ch1-q037-A","text":"20 triệu đồng."},{"id":"lms-ch1-q037-B","text":"80 triệu đồng."},{"id":"lms-ch1-q037-C","text":"100 triệu đồng."},{"id":"lms-ch1-q037-D","text":"500 triệu đồng."}],"correctOptionId":"lms-ch1-q037-C","explanation":"<p>Giá vốn một sản phẩm = 500 ÷ 100 = 5 triệu; giá vốn của 20 sản phẩm đã bán = 20 × 5 = 100 triệu. 80 sản phẩm chưa bán (400 triệu) vẫn là hàng tồn kho.<\/p>","source":"Slide Chương 1, slide 66–67","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u038","context":null,"questions":[{"id":"lms-ch1-q038","num":"Câu 2.38","type":"mcq","text":"Doanh nghiệp đã áp dụng phương pháp bình quân gia quyền để tính giá hàng xuất kho. Việc tiếp tục áp dụng thống nhất phương pháp này trong kỳ kế toán thể hiện nguyên tắc nào?","options":[{"id":"lms-ch1-q038-A","text":"Nhất quán."},{"id":"lms-ch1-q038-B","text":"Trọng yếu."},{"id":"lms-ch1-q038-C","text":"Cơ sở dồn tích."},{"id":"lms-ch1-q038-D","text":"Thận trọng."}],"correctOptionId":"lms-ch1-q038-A","explanation":"<p>Áp dụng thống nhất phương pháp tính giá xuất kho đã chọn trong kỳ kế toán năm là nguyên tắc nhất quán; thay đổi phải giải trình trong thuyết minh BCTC.<\/p>","source":"Slide Chương 1, slide 68","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u039","context":null,"questions":[{"id":"lms-ch1-q039","num":"Câu 2.39","type":"mcq","text":"Doanh nghiệp có tổng tài sản 100 tỷ đồng nhưng bỏ sót khoản vay ngân hàng 5 tỷ đồng. Sai sót này liên quan trực tiếp đến nguyên tắc nào?","options":[{"id":"lms-ch1-q039-A","text":"Giá gốc."},{"id":"lms-ch1-q039-B","text":"Trọng yếu."},{"id":"lms-ch1-q039-C","text":"Phù hợp."},{"id":"lms-ch1-q039-D","text":"Hoạt động liên tục."}],"correctOptionId":"lms-ch1-q039-B","explanation":"<p>Khoản vay 5 tỷ trên tổng tài sản 100 tỷ là thông tin trọng yếu: bỏ sót sẽ làm thay đổi đáng kể đánh giá về tình hình tài chính và khả năng trả nợ; sai sót liên quan nguyên tắc trọng yếu.<\/p>","source":"Slide Chương 1, slide 71–72","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u040","context":null,"questions":[{"id":"lms-ch1-q040","num":"Câu 2.40","type":"mcq","text":"Thông tin và số liệu kế toán phải được ghi chép, báo cáo đúng với thực tế, không bị xuyên tạc hoặc bóp méo. Đây là yêu cầu nào?","options":[{"id":"lms-ch1-q040-A","text":"Đầy đủ."},{"id":"lms-ch1-q040-B","text":"Kịp thời."},{"id":"lms-ch1-q040-C","text":"Khách quan."},{"id":"lms-ch1-q040-D","text":"Có thể so sánh."}],"correctOptionId":"lms-ch1-q040-C","explanation":"<p>Ghi chép, báo cáo đúng thực tế, không xuyên tạc, không bóp méo là yêu cầu khách quan.<\/p>","source":"Slide Chương 1, slide 57","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u041","context":"<p>Đánh dấu \"X\" vào cột phù hợp để phân loại từng khoản mục là tài sản hoặc nguồn vốn của doanh nghiệp.<\/p>","questions":[{"id":"lms-ch1-q041","num":"CÂU 3.1","type":"classify","text":"Phân loại từng khoản mục là tài sản hoặc nguồn vốn của doanh nghiệp.","groups":[{"id":"G1","label":"Tài sản"},{"id":"G2","label":"Nguồn vốn"}],"items":[{"id":"lms-ch1-q041-i01","text":"Tiền gửi không kỳ hạn tại ngân hàng","groupId":"G1","reason":"Là nguồn lực kinh tế doanh nghiệp kiểm soát, có khả năng mang lại lợi ích kinh tế. (tiền)."},{"id":"lms-ch1-q041-i02","text":"Vay và nợ thuê tài chính","groupId":"G2","reason":"Nghĩa vụ phải trả, thuộc nợ phải trả (nguồn vốn)."},{"id":"lms-ch1-q041-i03","text":"Tiền lương phải trả người lao động","groupId":"G2","reason":"Nghĩa vụ phải trả người lao động, thuộc nợ phải trả."},{"id":"lms-ch1-q041-i04","text":"Tiền mặt tại quỹ","groupId":"G1","reason":"Tiền là tài sản."},{"id":"lms-ch1-q041-i05","text":"Máy móc, thiết bị","groupId":"G1","reason":"Tài sản cố định hữu hình."},{"id":"lms-ch1-q041-i06","text":"Công cụ, dụng cụ","groupId":"G1","reason":"Hàng tồn kho, là tài sản ngắn hạn."},{"id":"lms-ch1-q041-i07","text":"Hàng hóa","groupId":"G1","reason":"Hàng tồn kho, là tài sản ngắn hạn."},{"id":"lms-ch1-q041-i08","text":"Khoản phải trả người bán do mua hàng chưa thanh toán","groupId":"G2","reason":"Nợ phải trả người bán."},{"id":"lms-ch1-q041-i09","text":"Vốn chủ sở hữu","groupId":"G2","reason":"Nguồn hình thành tài sản từ chủ sở hữu."},{"id":"lms-ch1-q041-i10","text":"Phải thu khách hàng","groupId":"G1","reason":"Quyền thu tiền từ khách hàng, là tài sản."},{"id":"lms-ch1-q041-i11","text":"Thành phẩm","groupId":"G1","reason":"Hàng tồn kho, là tài sản."},{"id":"lms-ch1-q041-i12","text":"Nhà xưởng","groupId":"G1","reason":"Tài sản cố định hữu hình."}],"explanation":"<p>Tài sản (8 khoản): tiền gửi ngân hàng, tiền mặt, máy móc thiết bị, công cụ dụng cụ, hàng hóa, phải thu khách hàng, thành phẩm, nhà xưởng. Nguồn vốn (4 khoản): vay và nợ thuê tài chính, tiền lương phải trả, phải trả người bán, vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 24–32, 35","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q042","num":"Câu 3.1.1","type":"mcq","text":"Nhóm nào sau đây chỉ bao gồm các khoản mục tài sản của doanh nghiệp?","options":[{"id":"lms-ch1-q042-A","text":"Tiền gửi ngân hàng; phải thu khách hàng; thành phẩm; nhà xưởng; tiền mặt; vốn chủ sở hữu."},{"id":"lms-ch1-q042-B","text":"Máy móc, thiết bị; thành phẩm; nhà xưởng; phải thu khách hàng; công cụ, dụng cụ; tiền lương phải trả người lao động."},{"id":"lms-ch1-q042-C","text":"Tiền mặt; tiền gửi ngân hàng; phải thu khách hàng; công cụ, dụng cụ; thành phẩm; hàng hóa; máy móc, thiết bị; nhà xưởng."},{"id":"lms-ch1-q042-D","text":"Vay và nợ thuê tài chính; tiền lương phải trả người lao động; phải trả người bán; vốn chủ sở hữu."}],"correctOptionId":"lms-ch1-q042-C","explanation":"<p>Nhóm C gồm toàn tài sản: tiền mặt, tiền gửi, phải thu khách hàng, công cụ dụng cụ, thành phẩm, hàng hóa, máy móc thiết bị, nhà xưởng. Các nhóm khác lẫn vốn chủ sở hữu hoặc nợ phải trả (tiền lương phải trả).<\/p>","source":"Slide Chương 1, slide 24–27, 35","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q043","num":"Câu 3.1.2","type":"mcq","text":"Nhóm nào sau đây chỉ bao gồm các khoản mục nguồn vốn của doanh nghiệp?","options":[{"id":"lms-ch1-q043-A","text":"Tiền gửi ngân hàng; phải thu khách hàng; thành phẩm; nhà xưởng; tiền mặt; vốn chủ sở hữu."},{"id":"lms-ch1-q043-B","text":"Máy móc, thiết bị; thành phẩm; nhà xưởng; phải thu khách hàng; công cụ, dụng cụ; tiền lương phải trả người lao động."},{"id":"lms-ch1-q043-C","text":"Tiền mặt; tiền gửi ngân hàng; phải thu khách hàng; công cụ, dụng cụ; thành phẩm; hàng hóa; máy móc, thiết bị; nhà xưởng."},{"id":"lms-ch1-q043-D","text":"Vay và nợ thuê tài chính; tiền lương phải trả người lao động; phải trả người bán; vốn chủ sở hữu."}],"correctOptionId":"lms-ch1-q043-D","explanation":"<p>Vay và nợ thuê tài chính, tiền lương phải trả, phải trả người bán là nợ phải trả; vốn chủ sở hữu; tất cả thuộc nguồn vốn. Các nhóm khác có chứa tài sản.<\/p>","source":"Slide Chương 1, slide 28–32, 35","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u042","context":"<p>Cho các khoản mục sau tại một doanh nghiệp. Hãy phân loại từng khoản mục vào tài sản hoặc nguồn vốn, tính tổng từng bên và xác định giá trị X để phương trình kế toán cân bằng.<\/p><p><i>Đơn vị tính: triệu đồng.<\/i><\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Số tiền<\/th><th>Khoản mục<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>1. Phải trả người lao động<\/td><td class=\"num\">800<\/td><td>8. Tiền gửi ngân hàng không kỳ hạn<\/td><td class=\"num\">2.000<\/td><\/tr><tr><td>2. Hàng hóa<\/td><td class=\"num\">500<\/td><td>9. Thuế phải nộp Nhà nước<\/td><td class=\"num\">550<\/td><\/tr><tr><td>3. Vay dài hạn<\/td><td class=\"num\">2.100<\/td><td>10. Tài sản cố định<\/td><td class=\"num\">7.300<\/td><\/tr><tr><td>4. Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">7.000<\/td><td>11. Tiền mặt<\/td><td class=\"num\">800<\/td><\/tr><tr><td>5. Sản phẩm<\/td><td class=\"num\">3.200<\/td><td>12. Phải trả người bán<\/td><td class=\"num\">900<\/td><\/tr><tr><td>6. Phải thu khách hàng<\/td><td class=\"num\">1.500<\/td><td>13. Công cụ, dụng cụ<\/td><td class=\"num\">200<\/td><\/tr><tr><td>7. Vay ngắn hạn<\/td><td class=\"num\">1.800<\/td><td>14. Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">X<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch1-q044","num":"CÂU 3.2 (phân loại)","type":"classify","text":"Phân loại từng khoản mục vào tài sản hoặc nguồn vốn.","groups":[{"id":"G1","label":"Tài sản"},{"id":"G2","label":"Nguồn vốn"}],"items":[{"id":"lms-ch1-q044-i01","text":"Phải trả người lao động - 800","groupId":"G2","reason":"Nợ phải trả."},{"id":"lms-ch1-q044-i02","text":"Hàng hóa - 500","groupId":"G1","reason":"Hàng tồn kho."},{"id":"lms-ch1-q044-i03","text":"Vay dài hạn - 2.100","groupId":"G2","reason":"Nợ phải trả dài hạn."},{"id":"lms-ch1-q044-i04","text":"Vốn đầu tư của chủ sở hữu - 7.000","groupId":"G2","reason":"Vốn chủ sở hữu."},{"id":"lms-ch1-q044-i05","text":"Sản phẩm - 3.200","groupId":"G1","reason":"Hàng tồn kho."},{"id":"lms-ch1-q044-i06","text":"Phải thu khách hàng - 1.500","groupId":"G1","reason":"Quyền thu tiền."},{"id":"lms-ch1-q044-i07","text":"Vay ngắn hạn - 1.800","groupId":"G2","reason":"Nợ phải trả ngắn hạn."},{"id":"lms-ch1-q044-i08","text":"Tiền gửi ngân hàng không kỳ hạn - 2.000","groupId":"G1","reason":"Tiền."},{"id":"lms-ch1-q044-i09","text":"Thuế phải nộp Nhà nước - 550","groupId":"G2","reason":"Nợ phải trả Nhà nước."},{"id":"lms-ch1-q044-i10","text":"Tài sản cố định - 7.300","groupId":"G1","reason":"Tài sản dài hạn."},{"id":"lms-ch1-q044-i11","text":"Tiền mặt - 800","groupId":"G1","reason":"Tiền."},{"id":"lms-ch1-q044-i12","text":"Phải trả người bán - 900","groupId":"G2","reason":"Nợ phải trả."},{"id":"lms-ch1-q044-i13","text":"Công cụ, dụng cụ - 200","groupId":"G1","reason":"Hàng tồn kho."},{"id":"lms-ch1-q044-i14","text":"Lợi nhuận sau thuế chưa phân phối - X","groupId":"G2","reason":"Vốn chủ sở hữu."}],"explanation":"<p>Tài sản (7 khoản): hàng hóa 500, sản phẩm 3.200, phải thu khách hàng 1.500, tiền gửi ngân hàng 2.000, tài sản cố định 7.300, tiền mặt 800, công cụ dụng cụ 200: tổng 15.500. Nguồn vốn (7 khoản): phải trả người lao động 800, vay dài hạn 2.100, vốn đầu tư của chủ sở hữu 7.000, vay ngắn hạn 1.800, thuế phải nộp 550, phải trả người bán 900 và X.<\/p>","source":"Slide Chương 1, slide 36–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q045","num":"CÂU 3.2 (xác định X)","type":"essay","text":"Tính tổng tài sản, tổng nguồn vốn và xác định giá trị X để phương trình kế toán cân bằng.","answer":"<p>Tổng tài sản = 500 + 3.200 + 1.500 + 2.000 + 7.300 + 800 + 200 = <b>15.500<\/b> triệu đồng.<\/p><p>Nguồn vốn đã biết = 800 + 2.100 + 7.000 + 1.800 + 550 + 900 = <b>13.150<\/b> triệu đồng.<\/p><p>Tổng tài sản = Tổng nguồn vốn nên 15.500 = 13.150 + X, suy ra <b>X = 2.350<\/b> triệu đồng. Kiểm tra: 13.150 + 2.350 = 15.500 (cân đối).<\/p>","explanation":"<p>Tổng tài sản = 500 + 3.200 + 1.500 + 2.000 + 7.300 + 800 + 200 = <b>15.500<\/b> triệu đồng.<\/p><p>Nguồn vốn đã biết = 800 + 2.100 + 7.000 + 1.800 + 550 + 900 = <b>13.150<\/b> triệu đồng.<\/p><p>Tổng tài sản = Tổng nguồn vốn nên 15.500 = 13.150 + X, suy ra <b>X = 2.350<\/b> triệu đồng. Kiểm tra: 13.150 + 2.350 = 15.500 (cân đối).<\/p>","source":"Slide Chương 1, slide 36–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q046","num":"Câu 3.2.1","type":"mcq","text":"Vốn chủ sở hữu được hiểu là gì?","options":[{"id":"lms-ch1-q046-A","text":"Một loại tài sản của doanh nghiệp."},{"id":"lms-ch1-q046-B","text":"Một nguồn hình thành tài sản của doanh nghiệp."},{"id":"lms-ch1-q046-C","text":"Khoản không liên quan đến nguồn hình thành tài sản."},{"id":"lms-ch1-q046-D","text":"Không thể đưa ra kết luận chung."}],"correctOptionId":"lms-ch1-q046-B","explanation":"<p>Vốn chủ sở hữu là một bộ phận của nguồn vốn, tức nguồn hình thành tài sản (cùng với nợ phải trả); Vốn CSH = Tài sản - Nợ phải trả.<\/p>","source":"Slide Chương 1, slide 28–29, 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q047","num":"Câu 3.2.2","type":"mcq","text":"Sản phẩm của doanh nghiệp được phân loại là gì?","options":[{"id":"lms-ch1-q047-A","text":"Tài sản của doanh nghiệp."},{"id":"lms-ch1-q047-B","text":"Khoản vay của doanh nghiệp."},{"id":"lms-ch1-q047-C","text":"Nguồn vốn của doanh nghiệp."},{"id":"lms-ch1-q047-D","text":"Không thuộc tài sản hoặc nguồn vốn."}],"correctOptionId":"lms-ch1-q047-A","explanation":"<p>Sản phẩm (thành phẩm) tồn kho là nguồn lực do doanh nghiệp kiểm soát, sẽ bán để thu lợi ích nên là tài sản (hàng tồn kho).<\/p>","source":"Slide Chương 1, slide 26","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q048","num":"Câu 3.2.3","type":"mcq","text":"Phương trình kế toán cơ bản nào sau đây đúng?","options":[{"id":"lms-ch1-q048-A","text":"Tổng tài sản = Tổng nợ phải trả."},{"id":"lms-ch1-q048-B","text":"Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu."},{"id":"lms-ch1-q048-C","text":"Tổng tài sản ≠ Nợ phải trả + Vốn chủ sở hữu."},{"id":"lms-ch1-q048-D","text":"Vốn chủ sở hữu = Tổng tài sản."}],"correctOptionId":"lms-ch1-q048-B","explanation":"<p>Phương trình kế toán cơ bản: Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q049","num":"Câu 3.2.4","type":"mcq","text":"Nguồn hình thành tài sản của doanh nghiệp bao gồm những bộ phận nào?","options":[{"id":"lms-ch1-q049-A","text":"Chỉ các khoản vay."},{"id":"lms-ch1-q049-B","text":"Chỉ vốn chủ sở hữu."},{"id":"lms-ch1-q049-C","text":"Nợ phải trả và vốn chủ sở hữu."},{"id":"lms-ch1-q049-D","text":"Doanh thu và chi phí."}],"correctOptionId":"lms-ch1-q049-C","explanation":"<p>Nguồn hình thành tài sản gồm nợ phải trả và vốn chủ sở hữu.<\/p>","source":"Slide Chương 1, slide 28","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q050","num":"Câu 3.2.5","type":"mcq","text":"Giá trị của lợi nhuận sau thuế chưa phân phối (X) là bao nhiêu?","options":[{"id":"lms-ch1-q050-A","text":"2.750 triệu đồng."},{"id":"lms-ch1-q050-B","text":"2.350 triệu đồng."},{"id":"lms-ch1-q050-C","text":"13.150 triệu đồng."},{"id":"lms-ch1-q050-D","text":"15.500 triệu đồng."}],"correctOptionId":"lms-ch1-q050-B","explanation":"<p>Tổng tài sản = 500 + 3.200 + 1.500 + 2.000 + 7.300 + 800 + 200 = 15.500; nguồn vốn đã biết = 800 + 2.100 + 7.000 + 1.800 + 550 + 900 = 13.150; X = 15.500 - 13.150 = 2.350 triệu đồng.<\/p>","source":"Slide Chương 1, slide 36–38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u043","context":"<p>Yêu cầu: Dựa vào phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu, hãy tính và điền số còn thiếu vào từng dòng dưới đây.<\/p><p><i>Đơn vị tính: triệu đồng.<\/i><\/p><table class=\"t\"><thead><tr><th>STT<\/th><th>Tài sản<\/th><th>Nợ phải trả<\/th><th>Vốn chủ sở hữu<\/th><\/tr><\/thead><tbody><tr><td>1<\/td><td class=\"num\">1.000<\/td><td class=\"num\">300<\/td><td>...<\/td><\/tr><tr><td>2<\/td><td>...<\/td><td class=\"num\">500<\/td><td class=\"num\">700<\/td><\/tr><tr><td>3<\/td><td class=\"num\">936<\/td><td>...<\/td><td class=\"num\">342<\/td><\/tr><tr><td>4<\/td><td>...<\/td><td class=\"num\">50.000<\/td><td class=\"num\">70.000<\/td><\/tr><tr><td>5<\/td><td class=\"num\">156.000<\/td><td class=\"num\">84.000<\/td><td>...<\/td><\/tr><tr><td>6<\/td><td class=\"num\">292.000<\/td><td>...<\/td><td class=\"num\">192.000<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch1-q051","num":"CÂU 3.3 (Dòng 1)","type":"essay","text":"Tìm số còn thiếu của dòng 1 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Vốn chủ sở hữu = 1.000 - 300 = <b>700<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Vốn chủ sở hữu = 1.000 - 300 = <b>700<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q052","num":"CÂU 3.3 (Dòng 2)","type":"essay","text":"Tìm số còn thiếu của dòng 2 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Tài sản = 500 + 700 = <b>1.200<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Tài sản = 500 + 700 = <b>1.200<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q053","num":"CÂU 3.3 (Dòng 3)","type":"essay","text":"Tìm số còn thiếu của dòng 3 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Nợ phải trả = 936 - 342 = <b>594<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Nợ phải trả = 936 - 342 = <b>594<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q054","num":"CÂU 3.3 (Dòng 4)","type":"essay","text":"Tìm số còn thiếu của dòng 4 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Tài sản = 50.000 + 70.000 = <b>120.000<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Tài sản = 50.000 + 70.000 = <b>120.000<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q055","num":"CÂU 3.3 (Dòng 5)","type":"essay","text":"Tìm số còn thiếu của dòng 5 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Vốn chủ sở hữu = 156.000 - 84.000 = <b>72.000<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Vốn chủ sở hữu = 156.000 - 84.000 = <b>72.000<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q056","num":"CÂU 3.3 (Dòng 6)","type":"essay","text":"Tìm số còn thiếu của dòng 6 theo phương trình Tài sản = Nợ phải trả + Vốn chủ sở hữu.","answer":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Nợ phải trả = 292.000 - 192.000 = <b>100.000<\/b> triệu đồng.<\/p>","explanation":"<p>Áp dụng Tài sản = Nợ phải trả + Vốn CSH. Nợ phải trả = 292.000 - 192.000 = <b>100.000<\/b> triệu đồng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u044","context":"<p>Sử dụng phương trình kế toán để giải các tình huống sau. Trình bày rõ phép tính và đơn vị tính.<\/p>","questions":[{"id":"lms-ch1-q057","num":"3.4.1","type":"essay","text":"Ngày 31/12/N, nợ phải trả của Công ty HC bằng 1/3 tổng tài sản. Vốn chủ sở hữu của công ty là 180.000 triệu đồng. Hãy xác định nợ phải trả tại ngày 31/12/N.","answer":"<p>Nợ phải trả = 1/3 tổng tài sản nên Vốn CSH = 2/3 tổng tài sản = 180.000 triệu.<\/p><p>Tổng tài sản = 180.000 ÷ 2 × 3 = 270.000 triệu đồng.<\/p><p>Nợ phải trả = 270.000 - 180.000 = <b>90.000<\/b> triệu đồng (= 1/3 × 270.000). Kiểm tra: 90.000 + 180.000 = 270.000.<\/p>","explanation":"<p>Nợ phải trả = 1/3 tổng tài sản nên Vốn CSH = 2/3 tổng tài sản = 180.000 triệu.<\/p><p>Tổng tài sản = 180.000 ÷ 2 × 3 = 270.000 triệu đồng.<\/p><p>Nợ phải trả = 270.000 - 180.000 = <b>90.000<\/b> triệu đồng (= 1/3 × 270.000). Kiểm tra: 90.000 + 180.000 = 270.000.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q058","num":"3.4.2","type":"essay","text":"Đầu năm N, Công ty JG có tổng tài sản 310.000 triệu đồng và vốn chủ sở hữu 150.000 triệu đồng. Trong năm, tổng tài sản tăng 45.000 triệu đồng và nợ phải trả giảm 22.500 triệu đồng. Hãy xác định vốn chủ sở hữu tại ngày 31/12/N.","answer":"<p>Đầu năm: nợ phải trả = 310.000 - 150.000 = 160.000 triệu.<\/p><p>Cuối năm: tổng tài sản = 310.000 + 45.000 = 355.000; nợ phải trả = 160.000 - 22.500 = 137.500.<\/p><p>Vốn chủ sở hữu cuối năm = 355.000 - 137.500 = <b>217.500<\/b> triệu đồng. Kiểm tra: vốn CSH tăng = 45.000 + 22.500 = 67.500; 150.000 + 67.500 = 217.500.<\/p>","explanation":"<p>Đầu năm: nợ phải trả = 310.000 - 150.000 = 160.000 triệu.<\/p><p>Cuối năm: tổng tài sản = 310.000 + 45.000 = 355.000; nợ phải trả = 160.000 - 22.500 = 137.500.<\/p><p>Vốn chủ sở hữu cuối năm = 355.000 - 137.500 = <b>217.500<\/b> triệu đồng. Kiểm tra: vốn CSH tăng = 45.000 + 22.500 = 67.500; 150.000 + 67.500 = 217.500.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q059","num":"3.4.3","type":"essay","text":"Đầu năm N, Công ty BC có nợ phải trả 100.000 triệu đồng và vốn chủ sở hữu 96.000 triệu đồng. Trong năm, tổng tài sản tăng 40.000 triệu đồng và nợ phải trả giảm 30.000 triệu đồng. Hãy xác định vốn chủ sở hữu tại ngày 31/12/N.","answer":"<p>Đầu năm: tổng tài sản = 100.000 + 96.000 = 196.000 triệu.<\/p><p>Cuối năm: tổng tài sản = 196.000 + 40.000 = 236.000; nợ phải trả = 100.000 - 30.000 = 70.000.<\/p><p>Vốn chủ sở hữu cuối năm = 236.000 - 70.000 = <b>166.000<\/b> triệu đồng. Kiểm tra: vốn CSH tăng = 40.000 + 30.000 = 70.000; 96.000 + 70.000 = 166.000.<\/p>","explanation":"<p>Đầu năm: tổng tài sản = 100.000 + 96.000 = 196.000 triệu.<\/p><p>Cuối năm: tổng tài sản = 196.000 + 40.000 = 236.000; nợ phải trả = 100.000 - 30.000 = 70.000.<\/p><p>Vốn chủ sở hữu cuối năm = 236.000 - 70.000 = <b>166.000<\/b> triệu đồng. Kiểm tra: vốn CSH tăng = 40.000 + 30.000 = 70.000; 96.000 + 70.000 = 166.000.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u045","context":"<p>Tại ngày 31/12/N, Công ty ABC có các khoản mục dưới đây. Hãy phân loại từng khoản mục vào tài sản hoặc nguồn vốn và tính tổng giá trị của từng nhóm.<\/p><p><i>Đơn vị tính: triệu đồng.<\/i><\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Số tiền<\/th><th>Khoản mục<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>1. Vay ngân hàng<\/td><td class=\"num\">1.040<\/td><td>15. Nhà kho<\/td><td class=\"num\">430<\/td><\/tr><tr><td>2. Máy móc, thiết bị<\/td><td class=\"num\">850<\/td><td>16. Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">100<\/td><\/tr><tr><td>3. Nhà xưởng<\/td><td class=\"num\">2.550<\/td><td>17. Công cụ, dụng cụ<\/td><td class=\"num\">330<\/td><\/tr><tr><td>4. Phương tiện vận tải<\/td><td class=\"num\">600<\/td><td>18. Phải trả người bán vật tư<\/td><td class=\"num\">1.230<\/td><\/tr><tr><td>5. Nhiên liệu<\/td><td class=\"num\">60<\/td><td>19. Tạm ứng<\/td><td class=\"num\">100<\/td><\/tr><tr><td>6. Thuế phải nộp Nhà nước<\/td><td class=\"num\">20<\/td><td>20. Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">3.430<\/td><\/tr><tr><td>7. Máy vi tính<\/td><td class=\"num\">150<\/td><td>21. Chi phí sản xuất, kinh doanh dở dang<\/td><td class=\"num\">340<\/td><\/tr><tr><td>8. Phải thu khách hàng<\/td><td class=\"num\">100<\/td><td>22. Các khoản phải trả khác<\/td><td class=\ h1-q060-i28","text":"Các khoản phải trả khác - 60","groupId":"G2","reason":"Nợ phải trả."}],"explanation":"<p>Tài sản gồm 19 khoản (tiền, phải thu, hàng tồn kho, TSCĐ hữu hình và vô hình...); nguồn vốn gồm 9 khoản (nợ phải trả: vay, thuế, lương, quỹ khen thưởng phúc lợi, phải trả người bán, phải trả khác; vốn chủ sở hữu: vốn đầu tư, quỹ đầu tư phát triển, lợi nhuận chưa phân phối). Tổng mỗi bên 7.410 triệu đồng.<\/p>","source":"Slide Chương 1, slide 24–32, 37–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q061","num":"CÂU 3.5 (tính tổng)","type":"essay","text":"Tính tổng giá trị tài sản và tổng giá trị nguồn vốn.","answer":"<p>Tổng tài sản = 850 + 2.550 + 600 + 60 + 150 + 100 + 160 + 100 + 50 + 430 + 330 + 100 + 340 + 170 + 50 + 600 + 200 + 500 + 70 = <b>7.410<\/b> triệu đồng (19 khoản).<\/p><p>Tổng nguồn vốn = 1.040 + 20 + 170 + 880 + 480 + 100 + 1.230 + 3.430 + 60 = <b>7.410<\/b> triệu đồng (9 khoản: nợ phải trả 2.620, vốn chủ sở hữu 4.790).<\/p><p>Hai bên bằng nhau nên phân loại đúng.<\/p>","explanation":"<p>Tổng tài sản = 850 + 2.550 + 600 + 60 + 150 + 100 + 160 + 100 + 50 + 430 + 330 + 100 + 340 + 170 + 50 + 600 + 200 + 500 + 70 = <b>7.410<\/b> triệu đồng (19 khoản).<\/p><p>Tổng nguồn vốn = 1.040 + 20 + 170 + 880 + 480 + 100 + 1.230 + 3.430 + 60 = <b>7.410<\/b> triệu đồng (9 khoản: nợ phải trả 2.620, vốn chủ sở hữu 4.790).<\/p><p>Hai bên bằng nhau nên phân loại đúng.<\/p>","source":"Slide Chương 1, slide 36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch1-u046","context":"<p>Tại ngày 31/12/N, Công ty ABC có các khoản mục dưới đây. Hãy phân loại tài sản, nguồn vốn; tính tổng từng bên và xác định giá trị lợi nhuận sau thuế chưa phân phối (X).<\/p><p><i>Đơn vị tính: triệu đồng.<\/i><\/p><table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Số tiền<\/th><th>Khoản mục<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>1. Phải thu khách hàng<\/td><td class=\"num\">650<\/td><td>11. Vốn đầu tư của chủ sở hữu<\/td><td class=\"num\">3.500<\/td><\/tr><tr><td>2. Tiền mặt<\/td><td class=\"num\">267<\/td><td>12. Hàng gửi đi bán<\/td><td class=\"num\">510<\/td><\/tr><tr><td>3. Phải trả người bán<\/td><td class=\"num\">850<\/td><td>13. Tiền lương phải trả người lao động<\/td><td class=\"num\">460<\/td><\/tr><tr><td>4. Vay ngân hàng thời hạn 5 năm<\/td><td class=\"num\">3.200<\/td><td>14. Quỹ khen thưởng, phúc lợi<\/td><td class=\"num\">60<\/td><\/tr><tr><td>5. Thuế xuất khẩu phải nộp Nhà nước<\/td><td class=\"num\">305<\/td><td>15. Hàng hóa<\/td><td class=\"num\">930<\/td><\/tr><tr><td>6. Phụ tùng thay thế<\/td><td class=\"num\">53<\/td><td>16. Phương tiện vận tải<\/td><td class=\"num\">1.700<\/td><\/tr><tr><td>7. Cổ phiếu kinh doanh<\/td><td class=\"num\">350<\/td><td>17. Tài sản thừa chờ xử lý<\/td><td class=\"num\">20<\/td><\/tr><tr><td>8. Ngoại tệ gửi ngân hàng không kỳ hạn<\/td><td class=\"num\">300<\/td><td>18. Quyền sử dụng đất<\/td><td class=\"num\">650<\/td><\/tr><tr><td>9. Nhà cửa<\/td><td class=\"num\">3.220<\/td><td>19. Trả trước cho người bán<\/td><td class=\"num\">100<\/td><\/tr><tr><td>10. Tiền gửi ngân hàng bằng VND không kỳ hạn<\/td><td class=\"num\">800<\/td><td>20. Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">X<\/td><\/tr><\/tbody><\/table>","questions":[{"id":"lms-ch1-q062","num":"CÂU 3.6 (phân loại)","type":"classify","text":"Phân loại từng khoản mục vào tài sản hoặc nguồn vốn.","groups":[{"id":"G1","label":"Tài sản"},{"id":"G2","label":"Nguồn vốn"}],"items":[{"id":"lms-ch1-q062-i01","text":"Phải thu khách hàng - 650","groupId":"G1","reason":"Quyền thu tiền."},{"id":"lms-ch1-q062-i02","text":"Tiền mặt - 267","groupId":"G1","reason":"Tiền."},{"id":"lms-ch1-q062-i03","text":"Phụ tùng thay thế - 53","groupId":"G1","reason":"Hàng tồn kho/vật tư."},{"id":"lms-ch1-q062-i04","text":"Cổ phiếu kinh doanh - 350","groupId":"G1","reason":"Chứng khoán kinh doanh."},{"id":"lms-ch1-q062-i05","text":"Ngoại tệ gửi ngân hàng không kỳ hạn - 300","groupId":"G1","reason":"Tiền gửi."},{"id":"lms-ch1-q062-i06","text":"Nhà cửa - 3.220","groupId":"G1","reason":"Tài sản cố định hữu hình."},{"id":"lms-ch1-q062-i07","text":"Tiền gửi ngân hàng bằng VND không kỳ hạn - 800","groupId":"G1","reason":"Tiền gửi."},{"id":"lms-ch1-q062-i08","text":"Hàng gửi đi bán - 510","groupId":"G1","reason":"Vẫn thuộc quyền kiểm soát của doanh nghiệp (theo slide)."},{"id":"lms-ch1-q062-i09","text":"Hàng hóa - 930","groupId":"G1","reason":"Hàng tồn kho."},{"id":"lms-ch1-q062-i10","text":"Phương tiện vận tải - 1.700","groupId":"G1","reason":"Tài sản cố định hữu hình."},{"id":"lms-ch1-q062-i11","text":"Quyền sử dụng đất - 650","groupId":"G1","reason":"Tài sản cố định vô hình."},{"id":"lms-ch1-q062-i12","text":"Trả trước cho người bán - 100","groupId":"G1","reason":"Khoản phải thu."},{"id":"lms-ch1-q062-i13","text":"Phải trả người bán - 850","groupId":"G2","reason":"Nợ phải trả."},{"id":"lms-ch1-q062-i14","text":"Vay ngân hàng thời hạn 5 năm - 3.200","groupId":"G2","reason":"Nợ phải trả dài hạn."},{"id":"lms-ch1-q062-i15","text":"Thuế xuất khẩu phải nộp Nhà nước - 305","groupId":"G2","reason":"Nợ phải trả Nhà nước."},{"id":"lms-ch1-q062-i16","text":"Vốn đầu tư của chủ sở hữu - 3.500","groupId":"G2","reason":"Vốn chủ sở hữu."},{"id":"lms-ch1-q062-i17","text":"Tiền lương phải trả người lao động - 460","groupId":"G2","reason":"Nợ phải trả."},{"id":"lms-ch1-q062-i18","text":"Quỹ khen thưởng, phúc lợi - 60","groupId":"G2","reason":"Nợ phải trả (theo slide)."},{"id":"lms-ch1-q062-i19","text":"Tài sản thừa chờ xử lý - 20","groupId":"G2","reason":"Theo slide, xếp bên nguồn vốn."},{"id":"lms-ch1-q062-i20","text":"Lợi nhuận sau thuế chưa phân phối - X","groupId":"G2","reason":"Vốn chủ sở hữu (ẩn số)."}],"explanation":"<p>Tài sản gồm 12 khoản (tổng 9.530); nguồn vốn gồm 7 khoản đã biết (tổng 8.395) và X. Lưu ý: tài sản thừa chờ xử lý xếp vào nguồn vốn, hàng gửi đi bán và trả trước cho người bán là tài sản (theo slide).<\/p>","source":"Slide Chương 1, slide 24–32, 37–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q063","num":"CÂU 3.6 (xác định X)","type":"essay","text":"Tính tổng tài sản, tổng nguồn vốn và xác định lợi nhuận sau thuế chưa phân phối (X).","answer":"<p>Tổng tài sản = 650 + 267 + 53 + 350 + 300 + 3.220 + 800 + 510 + 930 + 1.700 + 650 + 100 = <b>9.530<\/b> triệu đồng.<\/p><p>Nguồn vốn đã biết = 850 + 3.200 + 305 + 3.500 + 460 + 60 + 20 = <b>8.395<\/b> triệu đồng.<\/p><p>Tổng tài sản = Tổng nguồn vốn nên 9.530 = 8.395 + X, suy ra <b>X = 1.135<\/b> triệu đồng. Kiểm tra: 8.395 + 1.135 = 9.530.<\/p>","explanation":"<p>Tổng tài sản = 650 + 267 + 53 + 350 + 300 + 3.220 + 800 + 510 + 930 + 1.700 + 650 + 100 = <b>9.530<\/b> triệu đồng.<\/p><p>Nguồn vốn đã biết = 850 + 3.200 + 305 + 3.500 + 460 + 60 + 20 = <b>8.395<\/b> triệu đồng.<\/p><p>Tổng tài sản = Tổng nguồn vốn nên 9.530 = 8.395 + X, suy ra <b>X = 1.135<\/b> triệu đồng. Kiểm tra: 8.395 + 1.135 = 9.530.<\/p>","source":"Slide Chương 1, slide 36–38","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q064","num":"Câu 3.6.1","type":"mcq","text":"Khoản “trả trước cho người bán” được phân loại là gì?","options":[{"id":"lms-ch1-q064-A","text":"Tài sản."},{"id":"lms-ch1-q064-B","text":"Nguồn vốn."},{"id":"lms-ch1-q064-C","text":"Không thuộc tài sản hoặc nguồn vốn."},{"id":"lms-ch1-q064-D","text":"Tùy từng trường hợp, không thể kết luận."}],"correctOptionId":"lms-ch1-q064-A","explanation":"<p>Trả trước cho người bán là khoản phải thu (doanh nghiệp có quyền nhận hàng/dịch vụ), nên là tài sản.<\/p>","source":"Slide Chương 1, slide 24, 26","status":"ok","answerBasis":"self"},{"id":"lms-ch1-q065","num":"Câu 3.6.2","type":"mcq","text":"Khoản “cổ phiếu kinh doanh” được phân loại là gì?","options":[{"id":"lms-ch1-q065-A","text":"Tài sản."},{"id":"lms-ch1-q065-B","text":"Nguồn vốn."},{"id":"lms-ch1-q065-C","text":"Không thuộc tài sản hoặc nguồn vốn."},{"id":"lms-ch1-q065-D","text":"Tất cả các phương án trên đều đúng.","pinned":true}],"correctOptionId":"lms-ch1-q065-A","explanation":"<p>Cổ phiếu kinh doanh (chứng khoán kinh doan

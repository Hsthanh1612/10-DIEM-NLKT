 lại là nợ phải trả.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u015","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q015","num":"Ch1 – Câu 15","type":"mcq","text":"Khoản mục nào sau đây không phải là vốn chủ sở hữu của doanh nghiệp?","options":[{"id":"other-cau2-q015-A","text":"Vốn điều lệ"},{"id":"other-cau2-q015-B","text":"Thặng dư vốn cổ phần"},{"id":"other-cau2-q015-C","text":"Quỹ dự phòng tài chính"},{"id":"other-cau2-q015-D","text":"Vay ngân hàng"}],"correctOptionId":"other-cau2-q015-D","explanation":"Vay ngân hàng là nợ phải trả; vốn điều lệ, thặng dư vốn cổ phần, quỹ dự phòng tài chính thuộc vốn chủ sở hữu.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u016","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q016","num":"Ch2 – Câu 1","type":"mcq","text":"Doanh nghiệp phải trình bày các luồng tiền trên Báo cáo lưu chuyển tiền tệ theo ba loại hoạt động nào?","options":[{"id":"other-cau2-q016-A","text":"Hoạt động kinh doanh, hoạt động đầu tư, hoạt động khác."},{"id":"other-cau2-q016-B","text":"Hoạt động kinh doanh, hoạt động đầu tư, hoạt động tài chính."},{"id":"other-cau2-q016-C","text":"Hoạt động kinh doanh, hoạt động tài chính, hoạt động dịch vụ."},{"id":"other-cau2-q016-D","text":"Hoạt động kinh doanh, hoạt động thương mại, hoạt động dịch vụ."}],"correctOptionId":"other-cau2-q016-B","explanation":"Báo cáo lưu chuyển tiền tệ trình bày dòng tiền theo ba hoạt động: kinh doanh, đầu tư và tài chính.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u017","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q017","num":"Ch2 – Câu 2","type":"mcq","text":"Thông tin mà BCTC của doanh nghiệp không cần phải cung cấp là:","options":[{"id":"other-cau2-q017-A","text":"Tài sản"},{"id":"other-cau2-q017-B","text":"Nợ phải trả"},{"id":"other-cau2-q017-C","text":"Vốn chủ sở hữu."},{"id":"other-cau2-q017-D","text":"Định phí"}],"correctOptionId":"other-cau2-q017-D","explanation":"BCTC cung cấp thông tin về tài sản, nợ phải trả, vốn chủ sở hữu, doanh thu, chi phí...; định phí là thông tin kế toán quản trị, BCTC không cần cung cấp.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u018","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q018","num":"Ch2 – Câu 3","type":"mcq","text":"Báo tài chính phản ánh tình hình và kết quả hoạt động kinh doanh của doanh nghiệp là:","options":[{"id":"other-cau2-q018-A","text":"Báo cáo tình hình tài chính"},{"id":"other-cau2-q018-B","text":"Báo cáo lưu chuyển tiền tệ"},{"id":"other-cau2-q018-C","text":"Báo cáo kết quả hoạt động kinh doanh."},{"id":"other-cau2-q018-D","text":"Thuyết minh báo cáo tài chính."}],"correctOptionId":"other-cau2-q018-C","explanation":"Báo cáo kết quả hoạt động kinh doanh phản ánh tình hình và kết quả hoạt động kinh doanh trong kỳ.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u019","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q019","num":"Ch2 – Câu 4","type":"mcq","text":"Có kết quả về một số chỉ tiêu trên Báo cáo kết quả hoạt động kinh doanh của công ty A trong kỳ như sau: Doanh thu bán hàng và cung cấp dịch vụ: 11.231 triệu đồng; Các khoản giảm trừ doanh thu: 2.596 triệu đồng. Vậy doanh thu thuần về bán hàng và cung cấp dịch vụ của công ty A trong kỳ là:","options":[{"id":"other-cau2-q019-A","text":"8.635 triệu đồng"},{"id":"other-cau2-q019-B","text":"11.231 triệu đồng"},{"id":"other-cau2-q019-C","text":"13.827 triệu đồng"},{"id":"other-cau2-q019-D","text":"9.431 triệu đồng"}],"correctOptionId":"other-cau2-q019-A","explanation":"Doanh thu thuần = 11.231 - 2.596 = 8.635 triệu đồng.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u020","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q020","num":"Ch2 – Câu 5","type":"mcq","text":"Trên Báo cáo kết quả hoạt động kinh doanh của doanh nghiệp, lợi nhuận thuần từ hoạt động kinh doanh được tính như thế nào ?","options":[{"id":"other-cau2-q020-A","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Lợi nhuận từ hoạt động tài chính + Kết quả từ hoạt động khác."},{"id":"other-cau2-q020-B","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Doanh thu từ hoạt động tài chính – Chi phí từ hoạt động tài chính."},{"id":"other-cau2-q020-C","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ – Chi phí bán hàng – Chi phí quản lý doanh nghiệp."},{"id":"other-cau2-q020-D","text":"Lợi nhuận thuần từ hoạt động kinh doanh = Lợi nhuận gộp về bán hàng và cung cấp dịch vụ + Doanh thu từ hoạt động tài chính – Chi phí từ hoạt động tài chính – Chi phí bán hàng – Chi phí quản lý doanh nghiệp."}],"correctOptionId":"other-cau2-q020-D","explanation":"Lợi nhuận thuần từ HĐKD = lợi nhuận gộp + doanh thu tài chính - chi phí tài chính - chi phí bán hàng - chi phí quản lý doanh nghiệp.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u021","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q021","num":"Ch2 – Câu 6","type":"mcq","text":"Nợ phải trả là nghĩa vụ hiện tại của doanh nghiệp phát sinh từ:","options":[{"id":"other-cau2-q021-A","text":"Các giao dịch và sự kiện đang phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"other-cau2-q021-B","text":"Các giao dịch và sự kiện sẽ phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"other-cau2-q021-C","text":"Các giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."},{"id":"other-cau2-q021-D","text":"Các giao dịch và sự kiện đã và sẽ phát sinh mà doanh nghiệp phải thanh toán từ các nguồn lực của mình."}],"correctOptionId":"other-cau2-q021-C","explanation":"Nợ phải trả là nghĩa vụ hiện tại phát sinh từ các giao dịch và sự kiện đã qua.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u022","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q022","num":"Ch2 – Câu 7","type":"mcq","text":"Báo cáo tình hình tài chính là báo cáo tài chính tổng hợp, phản ánh tổng quát:","options":[{"id":"other-cau2-q022-A","text":"Toàn bộ giá trị tài sản hiện có và nợ phải trả của doanh nghiệp tại một thời kỳ nhất định."},{"id":"other-cau2-q022-B","text":"Toàn bộ giá trị tài sản hiện có và nợ phải trả của doanh nghiệp tại một thời điểm nhất định."},{"id":"other-cau2-q022-C","text":"Toàn bộ giá trị tài sản hiện có và nguồn hình thành tài sản đó của doanh nghiệp tại một thời điểm nhất định."},{"id":"other-cau2-q022-D","text":"Toàn bộ giá trị tài sản hiện có và nguồn hình thành tài sản đó của doanh nghiệp tại một thời kỳ nhất định."}],"correctOptionId":"other-cau2-q022-C","explanation":"Báo cáo tình hình tài chính phản ánh tổng quát tài sản và nguồn hình thành tài sản tại một thời điểm nhất định (báo cáo tĩnh).","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u023","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q023","num":"Ch2 – Câu 8","type":"mcq","text":"Nghiệp vụ “Mua vật liệu nhập kho, đã thanh toán bằng tiền vay ngắn hạn” sẽ làm cho tài sản và nguồn vốn của DN thay đổi:","options":[{"id":"other-cau2-q023-A","text":"Tài sản tăng, Nguồn vốn chủ sở hữu tăng"},{"id":"other-cau2-q023-B","text":"Tài sản tăng, Nguồn vốn kinh doanh tăng"},{"id":"other-cau2-q023-C","text":"Tài sản không tăng, Nguồn vốn giảm"},{"id":"other-cau2-q023-D","text":"Tài sản tăng, Nợ phải trả tăng"}],"correctOptionId":"other-cau2-q023-D","explanation":"Mua vật liệu bằng tiền vay ngắn hạn: Nợ TK 152 / Có TK 341. Tài sản tăng, nợ phải trả tăng; nguồn vốn kinh doanh/vốn chủ sở hữu không đổi.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u024","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q024","num":"Ch2 – Câu 9","type":"mcq","text":"Số dư bên Nợ của tài khoản Phải trả người bán (331) được:","options":[{"id":"other-cau2-q024-A","text":"Ghi bình thường bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"other-cau2-q024-B","text":"Ghi âm bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"other-cau2-q024-C","text":"Ghi bình thường bên phần Nguồn vốn của Báo cáo tình hình tài chính"},{"id":"other-cau2-q024-D","text":"Ghi số âm bên phần Nguồn vốn của Báo cáo tình hình tài chính"}],"correctOptionId":"other-cau2-q024-A","explanation":"Số dư Nợ của TK 331 (trả trước cho người bán) được ghi bình thường (số dương) ở phần Tài sản của báo cáo tình hình tài chính (khoản Trả trước cho người bán).","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u025","section":"Chương 2: Tổng quan về báo cáo tài chính","context":null,"questions":[{"id":"other-cau2-q025","num":"Ch2 – Câu 10","type":"mcq","text":"Doanh nghiệp vay ngắn hạn ngân hàng 100 triệu VND để thanh toán nợ cho người bán, nghiệp vụ này làm cho:","options":[{"id":"other-cau2-q025-A","text":"Tổng tài sản của doanh nghiệp giảm 100 triệu VND."},{"id":"other-cau2-q025-B","text":"Tổng nợ phải trả của doanh nghiệp giảm 100 triệu VND."},{"id":"other-cau2-q025-C","text":"Tổng nợ phải trả của doanh nghiệp tăng 100 triệu VND."},{"id":"other-cau2-q025-D","text":"Tổng nguồn vốn của doanh nghiệp không thay đổi."}],"correctOptionId":"other-cau2-q025-D","explanation":"Vay ngắn hạn để trả nợ người bán: Nợ TK 331 / Có TK 341, nợ phải trả tổng không đổi, tài sản không đổi, tổng nguồn vốn không thay đổi.","source":"Slide Chương 2 (BCTC); VAS 21/TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u026","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q026","num":"Ch3 – Câu 1","type":"mcq","text":"Nhận định nào sau đây là hợp lý về ý nghĩa của phương pháp Chứng từ?","options":[{"id":"other-cau2-q026-A","text":"Giúp kiểm tra thường xuyên tính hợp lệ, hợp pháp của các nghiệp vụ kinh tế - tài chính"},{"id":"other-cau2-q026-B","text":"Thu nhận thông tin kịp thời, đầy đủ, chính xác về các nghiệp vụ kinh tế - tài chính phát sinh"},{"id":"other-cau2-q026-C","text":"Giúp các bộ phận, cá nhân có liên quan nắm bắt kịp thời và ra quyết định đúng đắn"},{"id":"other-cau2-q026-D","text":"Tất cả các nhận định trên đều hợp lý","pinned":true}],"correctOptionId":"other-cau2-q026-D","explanation":"Phương pháp chứng từ giúp kiểm tra tính hợp pháp, thu nhận thông tin kịp thời, đầy đủ, chính xác và hỗ trợ ra quyết định đúng đắn; nên tất cả đều hợp lý.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u027","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q027","num":"Ch3 – Câu 2","type":"mcq","text":"Đâu không phải là một nội dung bắt buộc cần phải có trong một chứng từ kế toán?","options":[{"id":"other-cau2-q027-A","text":"Tên gọi chứng từ,"},{"id":"other-cau2-q027-B","text":"Ngày lập chứng từ và số hiệu chứng từ,"},{"id":"other-cau2-q027-C","text":"Phương thức thanh toán"},{"id":"other-cau2-q027-D","text":"Các đơn vị đo lường cần thiết"}],"correctOptionId":"other-cau2-q027-C","explanation":"Phương thức thanh toán là yếu tố bổ sung, không bắt buộc; yếu tố bắt buộc gồm tên chứng từ, ngày lập và số hiệu, nội dung nghiệp vụ, đơn vị đo lường, số tiền...","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u028","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q028","num":"Ch3 – Câu 3","type":"mcq","text":"Chứng từ kế toán có thể phân chia thành chứng từ mệnh lệnh và chứng từ chấp hành. Đây là cách phân chia chứng từ:","options":[{"id":"other-cau2-q028-A","text":"Theo công dụng của chứng từ"},{"id":"other-cau2-q028-B","text":"Theo địa điểm lập chứng từ"},{"id":"other-cau2-q028-C","text":"Theo thời gian lập chứng từ và mức độ tài liệu trong chứng từ"},{"id":"other-cau2-q028-D","text":"Theo số lần ghi các nghiệp vụ kinh tế tài chính trên chứng từ"}],"correctOptionId":"other-cau2-q028-A","explanation":"Chia chứng từ thành chứng từ mệnh lệnh và chứng từ chấp hành là phân loại theo công dụng.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u029","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q029","num":"Ch3 – Câu 4","type":"mcq","text":"Theo quy định của Luật kế toán và các thông tư, nghị định liên quan, đối với các chứng từ sử dụng trực tiếp để ghi sổ kế toán và lập Báo cáo tài chính thì doanh nghiệp sẽ phải lưu trong thời gian bao lâu?","options":[{"id":"other-cau2-q029-A","text":"5 năm"},{"id":"other-cau2-q029-B","text":"10 năm"},{"id":"other-cau2-q029-C","text":"20 năm"},{"id":"other-cau2-q029-D","text":"Lưu trữ vĩnh viễn"}],"correctOptionId":"other-cau2-q029-B","explanation":"Theo Luật Kế toán, chứng từ dùng trực tiếp ghi sổ và lập BCTC phải lưu trữ tối thiểu 10 năm.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u030","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q030","num":"Ch3 – Câu 5","type":"mcq","text":"Phương pháp kế toán thực hiện việc cân, đo, đong, đếm số lượng; xác nhận và đánh giá chất lượng, giá trị của tài sản, nguồn vốn hiện có tại thời điểm kiểm kê để kiểm tra, đối chiếu số liệu trong sổ kế toán được gọi là phương pháp gì?","options":[{"id":"other-cau2-q030-A","text":"Phương pháp tài khoản"},{"id":"other-cau2-q030-B","text":"Phương pháp chứng từ"},{"id":"other-cau2-q030-C","text":"Phương pháp kiểm kê"},{"id":"other-cau2-q030-D","text":"Phương pháp ghi sổ kép"}],"correctOptionId":"other-cau2-q030-C","explanation":"Phương pháp kiểm kê: cân, đo, đong, đếm, xác nhận, đánh giá tài sản và nguồn vốn để đối chiếu số liệu sổ sách.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u031","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q031","num":"Ch3 – Câu 6","type":"mcq","text":"Đơn vị bắt buộc phải tiến hành kiểm kê tài sản trong các trường hợp nào sau đây?","options":[{"id":"other-cau2-q031-A","text":"Cuối kỳ kế toán năm, trước khi lập báo cáo tài chính"},{"id":"other-cau2-q031-B","text":"Chia, tách, hợp nhất, sát nhập, giải thể, bán, cho thuê doanh nghiệp"},{"id":"other-cau2-q031-C","text":"Chuyển đổi hình thức sở hữu doanh nghiệp"},{"id":"other-cau2-q031-D","text":"Tất cả các trường hợp trên","pinned":true}],"correctOptionId":"other-cau2-q031-D","explanation":"Phải kiểm kê cuối kỳ kế toán năm trước khi lập BCTC, khi chia, tách, hợp nhất, sáp nhập, giải thể, bán, cho thuê, chuyển đổi hình thức sở hữu doanh nghiệp: nên tất cả đều đúng.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u032","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q032","num":"Ch3 – Câu 7","type":"mcq","text":"Khoản phải thu khách hàng được kiểm kê theo phương thức kiểm kê nào?","options":[{"id":"other-cau2-q032-A","text":"Kiểm kê hiện vật"},{"id":"other-cau2-q032-B","text":"Kiểm kê đối chiếu"},{"id":"other-cau2-q032-C","text":"Kiểm kê từng phần"},{"id":"other-cau2-q032-D","text":"Kiểm kê bất thường"}],"correctOptionId":"other-cau2-q032-B","explanation":"Khoản phải thu khách hàng là tài sản không có hình thái vật chất, kiểm kê bằng cách đối chiếu xác nhận công nợ.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u033","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q033","num":"Ch3 – Câu 8","type":"mcq","text":"Tiền mặt và tiền gửi ngân hàng được kiểm kê theo phương thức kiểm kê nào?","options":[{"id":"other-cau2-q033-A","text":"Tiền mặt và tiền gửi ngân hàng đều được kiểm kê theo phương pháp kiểm kê hiện vật"},{"id":"other-cau2-q033-B","text":"Tiền mặt và tiền gửi ngân hàng đều được kiểm kê theo phương pháp kiểm kê đối chiếu"},{"id":"other-cau2-q033-C","text":"Tiền mặt được kiểm kê theo phương pháp kiểm kê hiện vật và tiền gửi ngân hàng được kiểm kê theo phương pháp kiểm kê đối chiếu"},{"id":"other-cau2-q033-D","text":"Tiền mặt được kiểm kê theo phương pháp kiểm kê đối chiếu và tiền gửi ngân hàng được kiểm kê theo phương pháp kiểm kê hiện vật"}],"correctOptionId":"other-cau2-q033-C","explanation":"Tiền mặt kiểm kê hiện vật (đếm tiền); tiền gửi ngân hàng kiểm kê đối chiếu với sao kê/xác nhận của ngân hàng.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u034","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q034","num":"Ch3 – Câu 9","type":"mcq","text":"Yếu tố bắt buộc trên chứng từ gồm:","options":[{"id":"other-cau2-q034-A","text":"Hình thức thanh toán"},{"id":"other-cau2-q034-B","text":"Tỷ giá ngoại tệ và số tiền quy đổi"},{"id":"other-cau2-q034-C","text":"Bút toán hạch toán kế toán"},{"id":"other-cau2-q034-D","text":"Nội dung nghiệp vụ kinh tế phát sinh"}],"correctOptionId":"other-cau2-q034-D","explanation":"Nội dung nghiệp vụ kinh tế phát sinh là yếu tố bắt buộc của chứng từ; hình thức thanh toán, tỷ giá, bút toán hạch toán là yếu tố bổ sung.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u035","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q035","num":"Ch3 – Câu 10","type":"mcq","text":"Trình tự lập, xử lý và luân chuyển chứng từ là:","options":[{"id":"other-cau2-q035-A","text":"Lập chứng từ, kiểm tra chứng từ, luân chuyển chứng từ, ghi sổ kế toán, lưu trữ chứng từ"},{"id":"other-cau2-q035-B","text":"Lập chứng từ, ghi sổ kế toán, kiểm tra chứng từ, luân chuyển chứng từ, lưu trữ chứng từ"},{"id":"other-cau2-q035-C","text":"Lập chứng từ, luân chuyển chứng từ, ghi sổ kế toán, kiểm tra chứng từ, lưu trữ chứng từ"},{"id":"other-cau2-q035-D","text":"Ghi sổ kế toán, lập chứng từ, kiểm tra chứng từ, luân chuyển chứng từ, lưu trữ chứng từ"}],"correctOptionId":"other-cau2-q035-A","explanation":"Trình tự: lập chứng từ, kiểm tra chứng từ, luân chuyển chứng từ, ghi sổ kế toán, lưu trữ chứng từ.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u036","section":"Chương 3: Phương pháp chứng từ và kiểm kê","context":null,"questions":[{"id":"other-cau2-q036","num":"Ch3 – Câu 11","type":"mcq","text":"Công ty B bán vật liệu chính cho công ty A, số lượng 1.000 kg, đơn giá chưa thuế là 20.000đ/kg, thuế GTGT 10% theo phương pháp khấu trừ. Công ty A đã chuyển khoản thanh toán tiền mua hàng cho công ty B (Ngân hàng đã báo Nợ). Số vật liệu này đã được công ty A kiểm nghiệm và nhập kho đầy đủ. Với nghiệp vụ này, khi bán hàng công ty B (công ty bán hàng) cần phải lập chứng từ:","options":[{"id":"other-cau2-q036-A","text":"Hóa đơn GTGT"},{"id":"other-cau2-q036-B","text":"Phiếu nhập kho"},{"id":"other-cau2-q036-C","text":"Hóa đơn bán hàng thông thường"},{"id":"other-cau2-q036-D","text":"Giấy báo Nợ"}],"correctOptionId":"other-cau2-q036-A","explanation":"Bên bán (công ty B) bán vật liệu chịu thuế GTGT khấu trừ phải lập hóa đơn GTGT; phiếu nhập kho và giấy báo Nợ thuộc bên mua/ngân hàng.","source":"Slide Chương 3 (Chứng từ, Tài khoản, Ghi sổ); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u037","section":"Chương 4: Tài khoản và ghi sổ","context":null,"questions":[{"id":"other-cau2-q037","num":"Ch4 – Câu 1","type":"mcq","text":"Tài khoản chi phí bán hàng","options":[{"id":"other-cau2-q037-A","text":"Luôn có số dư bằng 0"},{"id":"other-cau2-q037-B","text":"Số dư bên Nợ"},{"id":"other-cau2-q037-C","text":"Số dư bên Có"},{"id":"other-cau2-q037-D","text":"Không có số dư"}],"correctOptionId":"other-cau2-q037-D","explanation":"Chi phí bán hàng (TK 641) là tài khoản chi phí, cuối kỳ kết chuyển sang TK 911 nên không có số dư.","source":"Slide Chương 3 (Tài khoản, Ghi sổ) và Chương 5; TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u038","section":"Chương 4: Tài khoản và ghi sổ","context":null,"questions":[{"id":"other-cau2-q038","num":"Ch4 – Câu 2","type":"mcq","text":"Nghiệp vụ kinh tế nào sau đây thuộc mối quan hệ Nguồn vốn tăng - Nguồn vốn giảm:","options":[{"id":"other-cau2-q038-A","text":"Vay dài hạn ngân hàng về nhập quỹ tiền mặt"},{"id":"other-cau2-q038-B","text":"Trả nợ người bán bằng tiền vay ngắn hạn"},{"id":"other-cau2-q038-C","text":"Trả lương cho người lao động bằng tiền gửi ngân hàng"},{"id":"other-cau2-q038-D","text":"Trả nợ người bán bằng tiền gửi ngân hàng."}],"correctOptionId":"other-cau2-q038-B","explanation":"Nguồn vốn tăng - nguồn vốn giảm: trả nợ người bán bằng tiền vay ngắn hạn (Nợ 331 / Có 341). Các phương án khác làm tài sản giảm hoặc tăng cả tài sản.","source":"Slide Chương 3 (Tài khoản, Ghi sổ) và Chương 5; TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u039","section":"Chương 4: Tài khoản và ghi sổ","context":null,"questions":[{"id":"other-cau2-q039","num":"Ch4 – Câu 3","type":"mcq","text":"Nghiệp vụ kinh tế nào sau đây thuộc mối quan hệ Tài sản tăng - Nguồn vốn tăng:","options":[{"id":"other-cau2-q039-A","text":"Mua Nguyên vật liệu thanh toán bằng tiền gửi ngân hàng"},{"id":"other-cau2-q039-B","text":"Trả lương cho người lao động bằng tiền mặt"},{"id":"other-cau2-q039-C","text":"Mua hàng hóa chưa thanh toán cho nhà cung cấp"},{"id":"other-cau2-q039-D","text":"Chuyển khoản nộp thuế xuất khẩu cho nhà nước"}],"correctOptionId":"other-cau2-q039-C","explanation":"Mua hàng hóa chưa thanh toán: Nợ TK 156 / Có TK 331, tài sản tăng và nguồn vốn (nợ phải trả) tăng.","source":"Slide Chương 3 (Tài khoản, Ghi sổ) và Chương 5; TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u040","section":"Chương 4: Tài khoản và ghi sổ  TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u051","section":"Chương 4: Tài khoản và ghi sổ","context":null,"questions":[{"id":"other-cau2-q051","num":"Ch4 – Câu 15","type":"mcq","text":"Chuyển khoản thanh toán tiền mua tài sản cố định hữu hình 50.000.000 (đã bao gồm thuế GTGT), Ngân hàng đã báo Nợ. Công ty tính thuế GTGT theo phương pháp trực tiếp, kế toán ghi?","options":[{"id":"other-cau2-q051-A","text":"Nợ TK 211-TSCĐ: 50.000.000/Có TK 112-Tiền gửi ngân hàng: 50.000.000"},{"id":"other-cau2-q051-B","text":"Nợ TK 112-Tiền gửi ngân hàng: 50.000.000/Có TK 211-TSCĐ: 50.000.000"},{"id":"other-cau2-q051-C","text":"Nợ TK 211-TSCĐ: 50.000.000/Có TK 331-Phải trả người bán: 50.000.000"},{"id":"other-cau2-q051-D","text":"Nợ TK 331- Phải trả người bán: 50.000.000/Có TK 211-TSCĐ: 50.000.000"}],"correctOptionId":"other-cau2-q051-A","explanation":"Thuế GTGT trực tiếp nên giá trị TSCĐ là 50.000.000 gồm thuế: Nợ TK 211 / Có TK 112.","source":"Slide Chương 3 (Tài khoản, Ghi sổ) và Chương 5; TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u052","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q052","num":"Ch5 – Câu 1","type":"mcq","text":"Theo chuẩn mực kế toán Việt Nam (VAS), các nguyên tắc kế toán cần tuân thủ khi tính giá các đối tượng kế toán","options":[{"id":"other-cau2-q052-A","text":"Nguyên tắc khách quan, nguyên tắc thận trọng và nguyên tắc nhất quán"},{"id":"other-cau2-q052-B","text":"Nguyên tắc trọng yếu và nguyên tắc dồn tích"},{"id":"other-cau2-q052-C","text":"Nguyên tắc hoạt động liên tục và nguyên tắc giá gốc"},{"id":"other-cau2-q052-D","text":"a và c","pinned":true}],"correctOptionId":"other-cau2-q052-D","explanation":"Tính giá theo VAS cần tuân thủ nguyên tắc khách quan, thận trọng, nhất quán, hoạt động liên tục và giá gốc: a và c đều đúng.","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2 "text":"Phương pháp nhập trước xuất trước"},{"id":"other-cau2-q055-C","text":"Phương pháp bình quân gia quyền"},{"id":"other-cau2-q055-D","text":"Phương pháp thực tế đích danh"}],"correctOptionId":"other-cau2-q055-A","explanation":"Các phương pháp theo dõi hàng tồn kho là kê khai thường xuyên và kiểm kê định kỳ; b, c, d là phương pháp tính giá xuất kho.","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u056","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q056","num":"Ch5 – Câu 5","type":"mcq","text":"Nguyên giá TSCĐ là","options":[{"id":"other-cau2-q056-A","text":"Giá trị của TSCĐ tại thời điểm bắt đầu được ghi nhận vào sổ kế toán"},{"id":"other-cau2-q056-B","text":"Giá mua tài sản cố định"},{"id":"other-cau2-q056-C","text":"Giá thị trường tại thời điểm ghi tăng TSCĐ"},{"id":"other-cau2-q056-D","text":"Các câu trên đều sai","pinned":true}],"correctOptionId":"other-cau2-q056-A","explanation":"Nguyên giá TSCĐ là giá trị của TSCĐ tại thời điểm bắt đầu ghi nhận vào sổ kế toán.","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u057","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q057","num":"Ch5 – Câu 6","type":"mcq","text":"Theo Thông tư 45/2013/TT-BTC về hướng dẫn chế độ quản lý, sử dụng và trích khấu hao tài sản cố định, điều kiện ghi nhận TSCĐ là:","options":[{"id":"other-cau2-q057-A","text":"Giá trị TSCĐ >= 30tr và thời gian sử dụng >= 5 tháng"},{"id":"other-cau2-q057-B","text":"Giá trị TSCĐ >= 30tr và thời gian sử dụng >= 12 tháng"},{"id":"other-cau2-q057-C","text":"Giá trị TSCĐ >= 30tr và thời gian sử dụng < 12 tháng"},{"id":"other-cau2-q057-D","text":"Các câu trên đều sai","pinned":true}],"correctOptionId":"other-cau2-q057-B","explanation":"Theo TT45/2013: nguyên giá từ 30 triệu đồng trở lên và thời gian sử dụng từ 1 năm (12 tháng) trở lên.","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u058","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q058","num":"Ch5 – Câu 7","type":"mcq","text":"Với giá trị hàng tồn kho đầu kỳ và giá trị hàng nhập kho cho sẵn. Nhận định nào sau đây","options":[{"id":"other-cau2-q058-A","text":"Giá trị hàng tồn kho cuối kỳ càng cao thì giá trị hàng xuất trong kỳ càng thấp"},{"id":"other-cau2-q058-B","text":"Giá trị hàng tồn kho cuối kỳ càng cao thì giá trị hàng xuất trong kỳ càng cao"},{"id":"other-cau2-q058-C","text":"Giá trị hàng tồn kho cuối kỳ càng thấp thì giá trị hàng xuất trong kỳ càng thấp"},{"id":"other-cau2-q058-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q058-A","explanation":"Cuối kỳ = Đầu kỳ + Nhập - Xuất, nên Xuất = Đầu + Nhập - Cuối: tồn cuối càng cao thì giá trị xuất càng thấp.","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u059","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q059","num":"Ch5 – Câu 8","type":"mcq","text":"Công ty thương mại ABC thực hiện kế toán hàng tồn kho theo phương pháp kê khai thường xuyên, tính thuế giá trị gia tăng theo phương pháp khấu trừ, thuế suất thuế giá trị gia tăng của tất cả các mặt hàng là 10%, có các tài liệu sau:<br>- Hàng hóa tồn kho ngày 1/1/N:<br>+ Hàng hóa M: 1.000kg, đơn giá: 3.000đồng/kg.<br>- Tình hình nhập xuất trong tháng 1/N:<br>+ Ngày 12: mua và nhập kho 1.000kg hàng hóa M, đơn giá mua bao gồm thuế giá trị gia tăng ghi trên hóa đơn của hàng hóa M là 2.750 đồng/kg. Chi phí vận chuyển bốc dỡ hàng hoá M chưa có thuế giá trị gia tăng là 104.000 đồng. Đơn giá nhập kho của hàng hoá M là","options":[{"id":"other-cau2-q059-A","text":"2.604 đồng/kg"},{"id":"other-cau2-q059-B","text":"1.130 đồng/kg"},{"id":"other-cau2-q059-C","text":"2.013 đồng/kg"},{"id":"other-cau2-q059-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q059-A","explanation":"Giá nhập kho = giá chưa thuế + chi phí mua chưa thuế = 2.750/1,1 + 104.000/1.000 = 2.500 + 104 = 2.604 đồng/kg (thuế GTGT được khấu trừ nên không tính vào giá gốc).","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u060","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q060","num":"Ch5 – Câu 9","type":"mcq","text":"Trong tháng 3/N, tại DN A trích khấu hao đối với tài sản sử dụng tại phân xưởng phân bổ vào chi phí sản xuất như sau:<br>- Khấu hao của nhà xưởng: có nguyên giá 960 triệu đồng, thời gian sử dụng 4 năm, được khấu hao theo phương pháp đường thẳng. TSCĐ được mua vào tháng 3/N-2. Xác định mức khấu hao phải trích trong tháng 03/N TSCĐ trên đồng thời định khoản nghiệp vụ này.","options":[{"id":"other-cau2-q060-A","text":"240triệu đồng"},{"id":"other-cau2-q060-B","text":"480 triệu đồng"},{"id":"other-cau2-q060-C","text":"720 triệu đồng"},{"id":"other-cau2-q060-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q060-B","explanation":"Khấu hao đường thẳng = 960 / (4 x 12) = 20 triệu đồng/tháng. Các số trong phương án (240, 480, 720) không khớp: 240 là mức một năm, 480 là hai năm. Đáp án file chọn b (480).","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"needs_review","answerBasis":"given","reviewNote":"Mức khấu hao tháng tính được là 960/48 = 20 triệu đồng, không có trong phương án; đáp án file chọn b (480 triệu), có thể sai hoặc thiếu dữ kiện (có thể đúng phương án d 'Tất cả đều sai'). Cần hỏi giảng viên."}]},{"id":"other-cau2-u061","section":"Chương 5: Tính giá các đối tượng kế toán","context":null,"questions":[{"id":"other-cau2-q061","num":"Ch5 – Câu 10","type":"mcq","text":"Trong tháng 3/N, tại DN A trích khấu hao đối với tài sản sử dụng tại phân xưởng phân bổ vào chi phí sản xuất như sau:<br>- Khấu hao của nhà xưởng: có nguyên giá 960, thời gian sử dụng 4 năm, được khấu hao theo phương pháp đường thẳng. TSCĐ được mua vào tháng 3/N-2. Bút toán ghi nhận chi phí khấu hao đối với TSCĐ đề cập là:","options":[{"id":"other-cau2-q061-A","text":"Nợ TK 211- TSCĐHH: 480/ Có TK 112-Tiền gửi ngân hàng: 480"},{"id":"other-cau2-q061-B","text":"Nợ TK 642- CPQLDN: 480/ Có TK 112-Tiền gửi ngân hàng: 480"},{"id":"other-cau2-q061-C","text":"Nợ TK 627- CPSXC: 480/ Có TK 214-Hao mòn luỹ kế TSCĐ: 480"},{"id":"other-cau2-q061-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q061-C","explanation":"Khấu hao nhà xưởng ở phân xưởng: Nợ TK 627 / Có TK 214, nên phương án c đúng về tài khoản. Số tiền 480 trong phương án không khớp mức khấu hao tháng (20 triệu).","source":"Slide Chương 4 (Tính giá); VAS 02, VAS 03; TT45/2013/TT-BTC; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"needs_review","answerBasis":"given","reviewNote":"Về tài khoản (Nợ 627, Có 214) c là đúng, nhưng số tiền 480 không khớp mức khấu hao tháng 20 triệu (nguyên giá 960 không ghi đơn vị). Giữ đáp án c theo file; cần xác nhận."}]},{"id":"other-cau2-u062","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q062","num":"Ch6 – Câu 1","type":"mcq","text":"Chi phí vận chuyển phát sinh khi doanh nghiệp mua tài sản cố định về bàn giao cho phân xưởng sản xuất sử dụng được kế toán ghi nhận vào","options":[{"id":"other-cau2-q062-A","text":"Bên Nợ TK 211 – Nguyên giá TSCĐ"},{"id":"other-cau2-q062-B","text":"Bên Nợ TK 214 – Hao mòn TSCĐ"},{"id":"other-cau2-q062-C","text":"Bên Nợ TK 627 – Chi phí sản xuất chu í vận chuyển nguyên liệu đưa thẳng vào sản xuất trực tiếp được tính vào chi phí nguyên vật liệu trực tiếp (TK 621) theo đáp án file.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u065","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q065","num":"Ch6 – Câu 4","type":"mcq","text":"Giá trị công cụ dụng cụ (thuộc loại phân bổ nhiều kỳ) xuất kho đưa vào phân xưởng sản xuất được kế toán ghi nhận vào","options":[{"id":"other-cau2-q065-A","text":"Bên Nợ TK 153 – Công cụ dụng cụ"},{"id":"other-cau2-q065-B","text":"Bên Nợ TK 242 – Chi phí trả trước"},{"id":"other-cau2-q065-C","text":"Bên Nợ TK 335 – Chi phí phải trả"},{"id":"other-cau2-q065-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q065-B","explanation":"Công cụ dụng cụ phân bổ nhiều kỳ xuất dùng: Nợ TK 242 / Có TK 153, sau đó phân bổ dần vào chi phí.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u066","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q066","num":"Ch6 – Câu 5","type":"mcq","text":"Giá trị nguyên vật liệu dùng để trực tiếp sản xuất sản phẩm sử dụng thừa nhập lại kho sẽ làm","options":[{"id":"other-cau2-q066-A","text":"Tăng chi phí sản xuất kinh doanh dở dang"},{"id":"other-cau2-q066-B","text":"Giảm giá trị nguyên vật liệu"},{"id":"other-cau2-q066-C","text":"Tăng chi phí nguyên vật liệu trực tiếp"},{"id":"other-cau2-q066-D","text":"Giảm chi phí nguyên vật liệu trực tiếp"}],"correctOptionId":"other-cau2-q066-D","explanation":"Nguyên vật liệu dùng thừa nhập lại kho: Nợ TK 152 / Có TK 621, làm giảm chi phí nguyên vật liệu trực tiếp.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u067","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q067","num":"Ch6 – Câu 6","type":"mcq","text":"Kế toán tập hợp các khoản mục chi phí sau để tính giá thành sản xuất","options":[{"id":"other-cau2-q067-A","text":"Chi phí nguyên vật liệu trực tiếp; Chi phí bán hàng; Chi phí sản xuất chung"},{"id":"other-cau2-q067-B","text":"Chi phí nguyên vật liệu trực tiếp; Chi phí nhân công trực tiếp; Chi phí sản xuất chung"},{"id":"other-cau2-q067-C","text":"Chi phí quản lý doanh nghiệp; Chi phí bán hàng; Chi phí sản xuất chung"},{"id":"other-cau2-q067-D","text":"Chi phí nguyên vật liệu trực tiếp; Chi phí nhân công trực tiếp; Chi phí bán hàng; Chi phí sản xuất chung"}],"correctOptionId":"other-cau2-q067-B","explanation":"Giá thành sản xuất gồm chi phí nguyên vật liệu trực tiếp, nhân công trực tiếp và sản xuất chung; chi phí bán hàng, quản lý doanh nghiệp là chi phí thời kỳ.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u068","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q068","num":"Ch6 – Câu 7","type":"mcq","text":"Trích thông tin tập hợp chi phí cuối kỳ của doanh nghiệp sản xuất như sau:<br>- Chi phí sản xuất kinh doanh dở dang đầu kỳ: 100 triệu đồng<br>- Chi phí sản xuất kinh doanh dở dang cuối kỳ: 20 triệu đồng<br>- Chi phí nguyên vật liệu trực tiếp: 900 triệu đồng<br>- Chi phí nhân công trực tiếp trực tiếp: 350 triệu đồng<br>- Chi phí sản xuất chung: 200 triệu đồng<br>- Chi phí bán hàng: 220 triệu đồng<br>- Chi phí quản lý doanh nghiệp: 310 triệu đồng Vậy tổng giá thành của sản phẩm nhập kho là","options":[{"id":"other-cau2-q068-A","text":"1.530 triệu đồng"},{"id":"other-cau2-q068-B","text":"1.570 triệu đồng"},{"id":"other-cau2-q068-C","text":"2.060 triệu đồng"},{"id":"other-cau2-q068-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q068-A","explanation":"Giá thành = DD đầu kỳ + CPNVLTT + CPNCTT + CPSXC - DD cuối kỳ = 100 + 900 + 350 + 200 - 20 = 1.530 triệu đồng. Chi phí bán hàng và QLDN không vào giá thành sản xuất.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u069","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q069","num":"Ch6 – Câu 8","type":"mcq","text":"Tài khoản chi phí bán hàng không dùng để ghi nhận nội dung:","options":[{"id":"other-cau2-q069-A","text":"Tiền lương phải trả của bộ phận bán hàng"},{"id":"other-cau2-q069-B","text":"Chi phí quảng cáo sản phẩm"},{"id":"other-cau2-q069-C","text":"Chi phí đóng gói sản phẩm"},{"id":"other-cau2-q069-D","text":"Tiền phạt do khách hàng trả chậm hoặc vi phạm hợp đồng"}],"correctOptionId":"other-cau2-q069-D","explanation":"Tiền phạt do khách hàng trả chậm hoặc vi phạm hợp đồng là thu nhập khác, không phải chi phí bán hàng.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u070","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q070","num":"Ch6 – Câu 9","type":"mcq","text":"Tiền lương phải trả cho nhân viên quản lý tại phân xưởng sản xuất được ghi vào:","options":[{"id":"other-cau2-q070-A","text":"TK TK 627 - Chi phí sản xuất chung"},{"id":"other-cau2-q070-B","text":"TK 642 - Chi phí quản lý doanh nghiệp"},{"id":"other-cau2-q070-C","text":"TK 622 – Chi phí nhân công trực tiếp"},{"id":"other-cau2-q070-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q070-A","explanation":"Lương nhân viên quản lý phân xưởng: Nợ TK 627 (chi phí sản xuất chung) / Có TK 334.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u071","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q071","num":"Ch6 – Câu 10","type":"mcq","text":"Chi phí sản xuất chung được hiểu là:","options":[{"id":"other-cau2-q071-A","text":"Là chi phí phục vụ cho hoạt động sản xuất và hoạt động khác."},{"id":"other-cau2-q071-B","text":"Là tổng chi phí sản xuất kinh doanh của doanh nghiệp."},{"id":"other-cau2-q071-C","text":"Là chi phí phục vụ cho hoạt động sản xuất, hoạt động tài chính và hoạt động khác."},{"id":"other-cau2-q071-D","text":"Là chi phí phục vụ cho quá trình sản xuất phát sinh ở phân xưởng, bộ phận sản xuất."}],"correctOptionId":"other-cau2-q071-D","explanation":"Chi phí sản xuất chung là chi phí phục vụ sản xuất phát sinh ở phân xưởng, bộ phận sản xuất.","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u072","section":"Chương 6: Kế toán các nghiệp vụ kinh tế chủ yếu trong doanh nghiệp","context":null,"questions":[{"id":"other-cau2-q072","num":"Ch6 – Câu 11","type":"mcq","text":"Doanh nghiệp A áp dụng kế toán hàng tồn kho theo phương pháp kê khai thường xuyên, khi tập hợp chi phí và tính giá thành, kế toán sử dụng tài khoản:","options":[{"id":"other-cau2-q072-A","text":"TK 631"},{"id":"other-cau2-q072-B","text":"TK 632"},{"id":"other-cau2-q072-C","text":"TK 611"},{"id":"other-cau2-q072-D","text":"TK 154"}],"correctOptionId":"other-cau2-q072-D","explanation":"Theo phương pháp kê khai thường xuyên, tập hợp chi phí và tính giá thành dùng TK 154 (TK 631 dùng cho kiểm kê định kỳ).","source":"Slide Chương 5 (Kế toán các nghiệp vụ kinh tế chủ yếu); T ons":[{"id":"other-cau2-q075","num":"Ch7 – Câu 1","type":"mcq","text":"Phương pháp nào dùng để sửa chữa sổ kế toán khi kế toán ghi sai quan hệ đối ứng","options":[{"id":"other-cau2-q075-A","text":"Phương pháp cải chính"},{"id":"other-cau2-q075-B","text":"Phương pháp ghi số âm"},{"id":"other-cau2-q075-C","text":"Phương pháp ghi bổ sung"},{"id":"other-cau2-q075-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-cau2-q075-B","explanation":"Khi ghi sai quan hệ đối ứng tài khoản, sửa sổ bằng phương pháp ghi số âm (bút toán đỏ) rồi ghi lại đúng.","source":"Slide Chương 3 (Ghi sổ) và Chương 6; Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u076","section":"Chương 7: Sổ kế toán và các hình thức kế toán","context":null,"questions":[{"id":"other-cau2-q076","num":"Ch7 – Câu 2","type":"mcq","text":"Phương pháp cải chính được sử dụng trong sửa sai sổ kế toán khi","options":[{"id":"other-cau2-q076-A","text":"Sai sót được phát hiện sớm, ghi sai quan hệ đối ứng tài khoản"},{"id":"other-cau2-q076-B","text":"Sai sót được phát hiện trễ và số ghi sai lớn hơn (>) số ghi đúng"},{"id":"other-cau2-q076-C","text":"Sai sót được phát hiện sớm, ghi số sai, không liên quan đến quan hệ đối ứng tài khoản"},{"id":"other-cau2-q076-D","text":"Ghi thiếu định khoản"}],"correctOptionId":"other-cau2-q076-C","explanation":"Phương pháp cải chính dùng khi phát hiện sai sót sớm (trước khi khóa sổ/báo cáo), sai số tiền, không liên quan quan hệ đối ứng.","source":"Slide Chương 3 (Ghi sổ) và Chương 6; Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u077","section":"Chương 7: Sổ kế toán và các hình thức kế toán","context":null,"questions":[{"id":"other-cau2-q077","num":"Ch7 – Câu 3","type":"mcq","text":"Tổ chức công tác kế toán là một hệ thống các yếu tố cấu thành bao gồm:","options":[{"id":"other-cau2-q077-A","text":"Tổ chức vận dụng các phươn n hệ chặt chẽ với nhau."},{"id":"other-cau2-q079-B","text":"Căn cứ ghi sổ kế toán là các chứng từ kế toán; việc ghi chép trên sổ kế toán không cần tuân theo theo đúng phương pháp kế toán nào cả."},{"id":"other-cau2-q079-C","text":"Sổ kế toán được thiết kế theo mẫu nhất định."},{"id":"other-cau2-q079-D","text":"Sổ kế toán được mở theo kỳ kế toán (tháng, quý, năm)."}],"correctOptionId":"other-cau2-q079-B","explanation":"Câu hỏi chọn câu sai. Việc ghi chép trên sổ kế toán phải tuân theo đúng phương pháp kế toán, nên b sai.","source":"Slide Chương 3 (Ghi sổ) và Chương 6; Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u080","section":"Chương 7: Sổ kế toán và các hình thức kế toán","context":null,"questions":[{"id":"other-cau2-q080","num":"Ch7 – Câu 6","type":"mcq","text":"Câu nào sai khi phát biểu về các căn cứ để ghi sổ kế toán","options":[{"id":"other-cau2-q080-A","text":"Khi ghi sổ kế toán cần căn cứ chứng từ kế toán hợp lệ, hợp lý, hợp pháp"},{"id":"other-cau2-q080-B","text":"Các chứng từ kế toán cần phải ghi sổ kịp thời, rõ ràng, đầy đủ, trung thực, chính xác vào các sổ kế toán liên quan."},{"id":"other-cau2-q080-C","text":"Không được bỏ sót hoặc ghi trùng chứng từ hoặc nghiệp vụ khi ghi sổ kế toán"},{"id":"other-cau2-q080-D","text":"Khi ghi sổ kế toán, phần không có số liệu phải để trống."}],"correctOptionId":"other-cau2-q080-D","explanation":"Câu hỏi chọn câu sai. Phần không có số liệu phải gạch chéo, không để trống.","source":"Slide Chương 3 (Ghi sổ) và Chương 6; Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u081","section":"Chương 7: Sổ kế toán và các hình thức kế toán","context":null,"questions":[{"id":"other-cau2-q081","num":"Ch7 – Câu 7","type":"mcq","text":"Phát biểu nào sau đây là sai khi ghi chép vào sổ kế toán","options":[{"id":"other-cau2-q081-A","text":"Dùng mực tốt, không phai để ghi"},{"id":"other- n","context":null,"questions":[{"id":"other-cau2-q088","num":"Ch8 – Câu 4","type":"mcq","text":"Phát biểu nào ĐÚNG về công tác tổ chức hệ thống sổ kế toán sử dụng trong đơn vị?","options":[{"id":"other-cau2-q088-A","text":"Phải có sổ đảm bảo mối quan hệ ghi sổ theo thời gian và ghi không gian"},{"id":"other-cau2-q088-B","text":"Phải có sổ đảm bảo mối quan hệ ghi sổ tổng hợp và ghi sổ chi tiết"},{"id":"other-cau2-q088-C","text":"Quy định người chịu trách nhiệm ghi nhận thông tin vào các chứng từ kế toán"},{"id":"other-cau2-q088-D","text":"Tổ chức vận dụng các TK cấp 1 được sử dụng ở đơn vị cho phù hợp"}],"correctOptionId":"other-cau2-q088-B","explanation":"Phải có hệ thống sổ đảm bảo quan hệ ghi sổ tổng hợp và chi tiết là phát biểu đúng (theo đáp án file).","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u089","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q089","num":"Ch8 – Câu 5","type":"mcq","text":"Bộ máy kế toán được tổ chức ở cả đơn vị chính (phòng kế toán trung tâm) và các đơn vị phụ thuộc (phòng, ban tổ kế toán phụ thuộc) là hình thức tổ chức bộ máy kế toán?","options":[{"id":"other-cau2-q089-A","text":"Tập trung"},{"id":"other-cau2-q089-B","text":"Phân tán"},{"id":"other-cau2-q089-C","text":"Hợp nhất"},{"id":"other-cau2-q089-D","text":"Vừa tập trung vửa phân tán"}],"correctOptionId":"other-cau2-q089-B","explanation":"Bộ máy kế toán ở cả đơn vị chính và các đơn vị phụ thuộc (có tổ kế toán phụ thuộc) là hình thức phân tán.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u090","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q090","num":"Ch8 – Câu 6","type":"mcq","text":"Đơn vị có thể lựa chọn hình thức tổ chức công tác kế toán nào trong các hình thức sau đây:","options":[{"id":"other-cau2-q090-A","text":"Hình thức tổ chức bộ máy kế toán tập trung"},{"id":"other-cau2-q090-B","text":"Hình thức tổ chức bộ máy kế toán phân tán"},{"id":"other-cau2-q090-C","text":"Hình thức tổ chức bộ máy kế toán vừa tập trung vừa phân tán"},{"id":"other-cau2-q090-D","text":"Một trong ba hình thức ở trên"}],"correctOptionId":"other-cau2-q090-D","explanation":"Đơn vị được chọn một trong ba hình thức: tập trung, phân tán, vừa tập trung vừa phân tán.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u091","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q091","num":"Ch8 – Câu 7","type":"mcq","text":"Công ty XYZ là một tổng công ty xây dựng có 3 công ty con; tại trụ sở chính của công ty có một phòng kế toán, bên cạnh đó mỗi công ty con cũng có phòng kế toán riêng tại nơi đăng ký hoạt động của công ty con đó. Như vậy hình thức tổ chức công tác kế toán của công ty XYZ là:","options":[{"id":"other-cau2-q091-A","text":"Tập trung"},{"id":"other-cau2-q091-B","text":"Phân tán"},{"id":"other-cau2-q091-C","text":"Vừa tập trung vửa phân tán"},{"id":"other-cau2-q091-D","text":"Tất cả các phương án trên đều sai","pinned":true}],"correctOptionId":"other-cau2-q091-B","explanation":"Tổng công ty và các công ty con đều có phòng kế toán riêng: hình thức phân tán.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u092","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q092","num":"Ch8 – Câu 8","type":"mcq","text":"Doanh nghiệp có thể lựa chọn hình thức kế toán phù hợp đối với điều kiện của đơn vị mình trong các hình thức sau:","options":[{"id":"other-cau2-q092-A","text":"Nhật ký sổ cái, Nhật ký chung, Chứng từ ghi sổ, Nhật ký chứng từ, Kế toán trên máy vi tính."},{"id":"other-cau2-q092-B","text":"Nhật ký sổ cái, Nhật ký chung, Chứng từ ghi sổ."},{"id":"other-cau2-q092-C","text":"Nhật ký sổ cái, Nhật ký chung."},{"id":"other-cau2-q092-D","text":"Nhật ký sổ cái, Nhật ký chung, Chứng từ ghi sổ, Nhật ký chứng từ."}],"correctOptionId":"other-cau2-q092-A","explanation":"Các hình thức kế toán: Nhật ký sổ cái, Nhật ký chung, Chứng từ ghi sổ, Nhật ký chứng từ, Kế toán trên máy vi tính.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u093","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q093","num":"Ch8 – Câu 9","type":"mcq","text":"Tổ chức hệ thống sổ kế toán trong đơn vị cần chú ý điều gì:","options":[{"id":"other-cau2-q093-A","text":"Phải có sổ đảm bảo mối quan hệ ghi sổ theo thời gian và ghi theo hệ thống."},{"id":"other-cau2-q093-B","text":"Phải có sổ đảm bảo mối quan hệ ghi sổ tổng hợp và ghi sổ chi tiết."},{"id":"other-cau2-q093-C","text":"Phải đảm bảo quan hệ đối chiếu số liệu giữa các sổ kế toán."},{"id":"other-cau2-q093-D","text":"Tất cả các phương án trên đều đúng","pinned":true}],"correctOptionId":"other-cau2-q093-D","explanation":"Tổ chức hệ thống sổ cần có quan hệ ghi theo thời gian và hệ thống, tổng hợp và chi tiết, đối chiếu số liệu: tất cả đúng.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u094","section":"Chương 8: Tổ chức công tác kế toán","context":null,"questions":[{"id":"other-cau2-q094","num":"Ch8 – Câu 10","type":"mcq","text":"Đâu không phải nội dung kiểm tra kế toán:","options":[{"id":"other-cau2-q094-A","text":"Kiểm tra việc thực hiện các nội dung công tác kế toán."},{"id":"other-cau2-q094-B","text":"Kiểm tra việc tổ chức công tác kế toán và người làm kế toán."},{"id":"other-cau2-q094-C","text":"Kiểm tra việc tổ chức quản lý và hoạt động nghề nghiệp kế toán, việc chấp hành các quy định khác của pháp luật về kế toán."},{"id":"other-cau2-q094-D","text":"Các phương án trên đều đúng","pinned":true}],"correctOptionId":"other-cau2-q094-D","explanation":"Cả a, b, c đều là nội dung kiểm tra kế toán nên không có phương án nào là 'không phải'; phương án d (theo đáp án file) thực chất nói tất cả đều đúng.","source":"Slide Chương 6 (Tổ chức công tác kế toán); Luật Kế toán 2015, TT200; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"needs_review","answerBasis":"given","reviewNote":"Câu hỏi 'Đâu không phải nội dung kiểm tra kế toán' nhưng đáp án file là d 'Các phương án trên đều đúng' (a, b, c đều là nội dung kiểm tra); đề nghịch lý/mâu thuẫn. Giữ đáp án theo file."}]}]},{"key":"mau1","title":"Đề thi mẫu 1","units":[{"id":"other-mau1-u001","context":null,"questions":[{"id":"other-mau1-q001","num":"Câu 1","type":"mcq","text":"Chi phí lắp đặt, chạy thử khi mua TSCĐ được kế toán ghi nhận vào:","source":"Slide Chương 5 (kế toán TSCĐ/tính giá TSCĐ), Chương 4 (Tính giá); TT200 (TK 211)","answerBasis":"self","options":[{"id":"other-mau1-q001-A","text":"Chi phí quản lý doanh nghiệp"},{"id":"other-mau1-q001-B","text":"Chi phí thu mua hàng hóa"},{"id":"other-mau1-q001-C","text":"Chi phí sản xuất chung"},{"id":"other-mau1-q001-D","text":"Nguyên giá TSCĐ"}],"correctOptionId":"other-mau1-q001-D","explanation":"Chi phí lắp đặt, chạy thử là chi phí liên quan trực tiếp để đưa TSCĐ vào trạng thái sẵn sàng sử dụng nên được cộng vào nguyên giá TSCĐ (Nợ TK 211). Các phương án khác sai vì đây không phải chi phí kỳ này (QLDN, SXC) và chi phí thu mua chỉ áp dụng cho hàng tồn kho.","status":"ok"}]},{"id":"other-mau1-u002","context":null,"questions":[{"id":"other-mau1-q002","num":"Câu 2","type":"mcq","text":"Nghiệp vụ kinh tế được định khoản như sau:<br>“ Nợ TK 156 - Hàng hóa<br>Nợ TK 133 - Thuế GTGT được khấu trừ<br>Có TK 111 - Tiền mặt”<br>Hãy cho biết kế toán căn cứ vào chứng từ nào sau đây để định khoản nghiệp vụ này:","source":"Slide Chương 3, slide 15–16 (chứng từ chấp hành: phiếu chi, phiếu nhập); Chương 5","answerBasis":"self","options":[{"id":"other-mau1-q002-A","text":"Hóa đơn GTGT"},{"id":"other-mau1-q002-B","text":"Phiếu nhập kho"},{"id":"other-mau1-q002-C","text":"Phiếu chi"},{"id":"other-mau1-q002-D","text":"Tất cả đáp án trên đều đúng"}],"correctOptionId":"other-mau1-q002-D","explanation":"Định khoản gồm 3 phần: hàng hóa nhập kho (căn cứ phiếu nhập kho), thuế GTGT đầu vào và giá mua (hóa đơn GTGT), chi tiền mặt (phiếu chi). Vậy cả ba chứng từ đều là căn cứ.","status":"ok"}]},{"id":"other-mau1-u003","context":null,"questions":[{"id":"other-mau1-q003","num":"Câu 3","type":"mcq","text":"Kế toán chi tiết cần sử dụng các loại thước đo nào:","source":"Slide Chương 3 (so sánh kế toán tổng hợp và chi tiết: giá trị; giá trị, hiện vật và thời gian lao động)","answerBasis":"self","options":[{"id":"other-mau1-q003-A","text":"Thước đo hiện vật"},{"id":"other-mau1-q003-B","text":"Thước đo lao động"},{"id":"other-mau1-q003-C","text":"Thước đo giá trị"},{"id":"other-mau1-q003-D","text":"Tất cả các thước đo trên","pinned":true}],"correctOptionId":"other-mau1-q003-D","explanation":"Kế toán chi tiết dùng cả ba thước đo: hiện vật (kg, cái...), lao động (giờ công, ngày công) và giá trị (tiền), trong khi kế toán tổng hợp chủ yếu dùng thước đo giá trị.","status":"ok"}]},{"id":"other-mau1-u004","context":null,"questions":[{"id":"other-mau1-q004","num":"Câu 4","type":"mcq","text":"Kỳ kế toán năm của một đơn vị kế toán được xác định là?","source":"Slide Chương 1, slide 55 (kỳ kế toán, thường 12 tháng); Luật Kế toán 2015 (kỳ kế toán năm)","answerBasis":"self","options":[{"id":"other-mau1-q004-A","text":"Năm dương lịch"},{"id":"other-mau1-q004-B","text":"Năm hoạt động"},{"id":"other-mau1-q004-C","text":"Năm âm lịch"},{"id":"other-mau1-q004-D","text":"Cả hai đáp án A và B đều đúng"}],"correctOptionId":"other-mau1-q004-D","explanation":"Kỳ kế toán năm là 12 tháng, thường tính theo năm dương lịch (1/1–31/12) hoặc năm tài chính/năm hoạt động mà đơn vị đăng ký (12 tháng liên tục). Năm âm lịch không được dùng. Vậy A và B đều đúng.","status":"ok"}]},{"id":"other-mau1-u005","context":null,"questions":[{"id":"other-mau1-q005","num":"Câu 5","type":"mcq","text":"Đối tượng kế toán nào sau đây được phân loại là tài sản:","source":"Slide Chương 1 (tài sản, nợ phải trả, vốn chủ sở hữu); Chương 2","answerBasis":"self","options":[{"id":"other-mau1-q005-A","text":"Quỹ khen thưởng phúc lợi"},{"id":"other-mau1-q005-B","text":"Phải trả người bán"},{"id":"other-mau1-q005-C","text":"Chi phí trả trước"},{"id":"other-mau1-q005-D","text":"Chi phí phải trả"}],"correctOptionId":"other-mau1-q005-C","explanation":"Chi phí trả trước là khoản đã chi nhưng đem lại lợi ích nhiều kỳ, là tài sản. Quỹ khen thưởng phúc lợi thuộc vốn chủ sở hữu; phải trả người bán và chi phí phải trả là nợ phải trả.","status":"ok"}]},{"id":"other-mau1-u006","context":null,"questions":[{"id":"other-mau1-q006","num":"Câu 6","type":"mcq","text":"Cuối kỳ, số dư của TK 211 - Tài sản cố định hữu hình được","source":"Slide Chương 2, slide 38–39 (phương pháp lập báo cáo tình hình tài chính)","answerBasis":"self","options":[{"id":"other-mau1-q006-A","text":"Ghi giá trị âm bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"other-mau1-q006-B","text":"Ghi giá trị âm bên phần Nguồn vốn của Báo cáo tình hình tài chính"},{"id":"other-mau1-q006-C","text":"Ghi bình thường bên phần Tài sản của Báo cáo tình hình tài chính"},{"id":"other-mau1-q006-D","text":"Ghi bình thường bên phần Nguồn vốn của Báo cáo tình hình tài chính"}],"correctOptionId":"other-mau1-q006-C","explanation":"TK 211 là tài khoản phản ánh tài sản, số dư Nợ ghi dương bình thường bên phần Tài sản. Chỉ các tài khoản điều chỉnh giảm (214, 229...) mới ghi âm.","status":"ok"}]},{"id":"other-mau1-u007","context":null,"questions":[{"id":"other-mau1-q007","num":"Câu 7","type":"mcq","text":"Nghiệp vụ “Mua và nhập kho vật tư, đã chi tiền mặt thanh toán cho người bán” thuộc quan hệ đối ứng nào sau đây?","source":"Slide Chương 2 (ảnh hưởng nghiệp vụ đến phương trình kế toán); Chương 3 (quan hệ đối ứng)","answerBasis":"self","options":[{"id":"other-mau1-q007-A","text":"Tài sản tăng - Tài sản giảm"},{"id":"other-mau1-q007-B","text":"Tài sản tăng - Nợ phải trả tăng"},{"id":"other-mau1-q007-C","text":"Tài sản tăng - Nguồn vốn chủ sở hữu tăng"},{"id":"other-mau1-q007-D","text":"Tài sản giảm - Nguồn vốn giảm"}],"correctOptionId":"other-mau1-q007-A","explanation":"Nợ TK 152 (vật tư tăng) / Có TK 111 (tiền mặt giảm): một tài sản tăng, một tài sản giảm (loại 1: tổng tài sản không đổi). Đã trả tiền ngay nên không phát sinh nợ phải trả.","status":"ok"}]},{"id":"other-mau1-u008","context":null,"questions":[{"id":"other-mau1-q008","num":"Câu 8","type":"mcq","text":"Số dư bên Nợ tài khoản “Cổ phiếu quỹ - 419” sẽ được trình bày trên Bảng cân đối kế toán bằng cách:","source":"Slide Chương 2, slide 39 (419 Cổ phiếu mua lại của chính mình: số dư Nợ ghi âm phần nguồn vốn)","answerBasis":"self","options":[{"id":"other-mau1-q008-A","text":"Ghi dương bình thường bên Phần Tài sản"},{"id":"other-mau1-q008-B","text":"Ghi dương bình thường bên Phần Nguồn vốn"},{"id":"other-mau1-q008-C","text":"Ghi giá trị âm bên Phần Tài sản"},{"id":"other-mau1-q008-D","text":"Ghi giá trị âm bên Phần Nguồn vốn"}],"correctOptionId":"other-mau1-q008-D","explanation":"TK 419 là tài khoản điều chỉnh giảm vốn chủ sở hữu: số dư Nợ ghi số âm ở phần Nguồn vốn (trong vốn chủ sở hữu).","status":"ok"}]},{"id":"other-mau1-u009","context":null,"questions":[{"id":"other-mau1-q009","num":"Câu 9","type":"mcq","text":"Nhận định nào đúng trong những nhận định sau về Nợ phải trả của doanh nghiệp:","source":"Slide Chương 1 (định nghĩa nợ phải trả)","answerBasis":"self","options":[{"id":"other-mau1-q009-A","text":"Là nguồn lực do đơn vị kiểm soát"},{"id":"other-mau1-q009-B","text":"Được tính bằng số chênh lệch giữa giá trị Tài sản của doanh nghiệp trừ (-) Nợ phải trả"},{"id":"other-mau1-q009-C","text":"Là nghĩa vụ sắp tới của doanh nghiệp phát sinh từ các giao dịch và sự kiện sắp xảy ra mà doanh nghiệp phải thanh toán từ các nguồn lực của mình"},{"id":"other-mau1-q009-D","text":"Là nghĩa vụ hiện tại của doanh nghiệp phát sinh từ các giao dịch và sự kiện đã qua mà doanh nghiệp phải thanh toán từ các nguồn lực của mình"}],"correctOptionId":"other-mau1-q009-D","explanation":"Nợ phải trả là nghĩa vụ hiện tại phát sinh từ giao dịch, sự kiện đã qua. A là định nghĩa tài sản; B là vốn chủ sở hữu; C sai vì nghĩa vụ phải là hiện tại, từ sự kiện đã xảy ra. (Đề gốc: phương án A và B bị dính dòng trong bản trích xuất PDF, tách thành hai phương án riêng theo bản ảnh.)","status":"ok"}]},{"id":"other-mau1-u010","context":null,"questions":[{"id":"other-mau1-q010","num":"Câu 10","type":"mcq","text":"Công ty ABC hoàn tất việc giao hàng theo hợp đồng cho khách hàng vào ngày 15/03/N và cho khách hàng mua chịu với thời hạn thanh toán là 30 ngày. Toàn bộ tiền hàng được khách hàng thanh toán vào ngày 15/04/N. Theo nguyên tắc cơ sở dồn tích, Doanh thu nghiệp vụ trên của công ty ABC sẽ được ghi nhận vào thời điểm nào?","source":"Slide Chương 1 (nguyên tắc cơ sở dồn tích)","answerBasis":"self","options":[{"id":"other-mau1-q010-A","text":"Doanh thu được chia đều cho hai tháng: tháng 3 và tháng 4"},{"id":"other-mau1-q010-B","text":"Doanh thu được ghi nhận vào ngày 15/04/N"},{"id":"other-mau1-q010-C","text":"Doanh thu được ghi nhận vào ngày 15/03/N"},{"id":"other-mau1-q010-D","text":"Tất cả các đáp án trên đều sai"}],"correctOptionId":"other-mau1-q010-C","explanation":"Theo cơ sở dồn tích, doanh thu ghi nhận khi giao dịch phát sinh (đã giao hàng, chuyển giao quyền kiểm soát) là 15/03/N, không phụ thuộc thời điểm thu tiền (15/04/N).","status":"ok"}]},{"id":"other-mau1-u011","context":null,"questions":[{"id":"other-mau1-q011","num":"Câu 11","type":"mcq","text":"Giấy đề nghị tạm ứng được duyệt là:","source":"Slide Chương 3, slide 15–16","answerBasis":"self","options":[{"id":"other-mau1-q011-A","text":"Chứng từ chấp hành"},{"id":"other-mau1-q011-B","text":"Chứng từ mệnh lệnh"},{"id":"other-mau1-q011-C","text":"Chứng từ tổng hợp"},{"id":"other-mau1-q011-D","text":"Chưa được coi là chứng từ"}],"correctOptionId":"other-mau1-q011-B","explanation":"Theo slide, chứng từ mệnh lệnh dùng truyền đạt mệnh lệnh cấp trên xuống cấp dưới, ví dụ lệnh chi tiền, đơn xin tạm ứng...; mới chứng minh xuất xứ nghiệp vụ, chưa chứng minh đã hoàn thành. Chứng từ chấp hành là phiếu thu, phiếu chi...","status":"ok"}]},{"id":"other-mau1-u012","context":null,"questions":[{"id":"other-mau1-q012","num":"Câu 12","type":"mcq","text":"Tiền mặt của đơn vị được kiểm kê định kỳ:","source":"Slide Chương 6, slide 11–12 (kiểm kê định kỳ, kiểm kê hiện vật áp dụng cho tiền mặt); quy định quản lý quỹ tiền mặt","answerBasis":"self","options":[{"id":"other-mau1-q012-A","text":"Một ngày một lần"},{"id":"other-mau1-q012-B","text":"Một tuần một lần"},{"id":"other-mau1-q012-C","text":"Một tháng một lần"},{"id":"other-mau1-q012-D","text":"Một năm một lần"}],"correctOptionId":"other-mau1-q012-A","explanation":"Tiền mặt tại quỹ do thủ quỹ kiểm quỹ và đối chiếu với sổ quỹ hằng ngày (cuối ngày); quy định thường áp dụng là một ngày một lần.","status":"needs_review","reviewNote":"Slide không nêu rõ tần suất kiểm kê tiền mặt; đáp án A (hằng ngày) dựa trên thực hành kiểm quỹ cuối ngày của thủ quỹ. Nên đối chiếu giáo trình."}]},{"id":"other-mau1-u013","context":null,"questions":[{"id":"other-mau1-q013","num":"Câu 13","type":"mcq","text":"Phương pháp được sử dụng để tiến hành kiểm kê tiền gửi ngân hàng là:","source":"Slide Chương 6, slide 12 (kiểm kê đối chiếu)","answerBasis":"self","options":[{"id":"other-mau1-q013-A","text":"Kiểm kê hiện vật"},{"id":"other-mau1-q013-B","text":"Kiểm kê đối chiếu"},{"id":"other-mau1-q013-C","text":"Đếm"},{"id":"other-mau1-q013-D","text":"Cân, đo"}],"correctOptionId":"other-mau1-q013-B","explanation":"Tiền gửi ngân hàng không hiện diện tại đơn vị nên kiểm kê bằng cách đối chiếu số dư sổ kế toán với sổ phụ/xác nhận của ngân hàng.","status":"ok"}]},{"id":"other-mau1-u014","context":null,"questions":[{"id":"other-mau1-q014","num":"Câu 14","type":"mcq","text":"Công ty A mua vật liệu chính của công ty B, số lượng 500 kg, đơn giá chưa thuế là 20.000đ/kg, thuế GTGT 10% theo phương pháp khấu trừ. Công ty A đã chuyển khoản thanh toán tiền mua hàng cho công ty B (Ngân hàng đã báo Nợ). Số vật liệu này đã được kiểm nghiệm và nhập kho đầy đủ. Với nghiệp vụ này, khi bán hàng công ty B (công ty bán hàng) cần phải lập chứng từ:","source":"Slide Chương 3 (chứng từ), Chương 5 (kế toán bán hàng)","answerBasis":"self","options":[{"id":"other-mau1-q014-A","text":"Hóa đơn GTGT"},{"id":"other-mau1-q014-B","text":"Phiếu nhập kho"},{"id":"other-mau1-q014-C","text":"Hóa đơn bán hàng thông thường"},{"id":"other-mau1-q014-D","text":"Giấy báo Nợ"}],"correctOptionId":"other-mau1-q014-A","explanation":"Công ty B bán hàng chịu thuế GTGT khấu trừ nên lập hóa đơn GTGT giao cho bên mua. Phiếu nhập kho là chứng từ bên mua (A); giấy báo Nợ do ngân hàng lập; hóa đơn bán hàng thông thường dùng cho đơn vị tính thuế trực tiếp.","status":"ok"}]},{"id":"other-mau1-u015","context":null,"questions":[{"id":"other-mau1-q015","num":"Câu 15","type":"mcq","text":"Mọi nghiệp vụ kinh tế, tài chính của doanh nghiệp liên quan đến tài sản, nợ phải trả, nguồn vốn chủ sở hữu, doanh thu, chi phí phải được ghi sổ kế toán vào thời điểm phát sinh, không căn cứ vào thời điểm thực tế thu hoặc thực tế chi tiền hoặc tương đương tiền, đây là nội dung của nguyên tắc:","source":"Slide Chương 1 (nguyên tắc kế toán: cơ sở dồn tích)","answerBasis":"self","options":[{"id":"other-mau1-q015-A","text":"Hoạt động liên tục"},{"id":"other-mau1-q015-B","text":"Phù hợp"},{"id":"other-mau1-q015-C","text":"Cơ sở dồn tích"},{"id":"other-mau1-q015-D","text":"Nhất quán"}],"correctOptionId":"other-mau1-q015-C","explanation":"Đây chính là định nghĩa nguyên tắc cơ sở dồn tích: ghi nhận theo thời điểm phát sinh, không theo thời điểm thu/chi tiền.","status":"ok"}]},{"id":"other-mau1-u016","context":null,"questions":[{"id":"other-mau1-q016","num":"Câu 16","type":"mcq","text":"Nghiệp vụ “Đơn vị vay ngân hàng 200 triệu đồng để thanh toán tiền mua TSCĐHH kì trước còn nợ người bán” sẽ làm Bảng báo cáo tình hình tài chính của đơn vị thay đổi như thế nào?","source":"Slide Chương 2 (ảnh hưởng nghiệp vụ lên báo cáo tình hình tài chính)","answerBasis":"self","options":[{"id":"other-mau1-q016-A","text":"Tổng cộng nguồn vốn của đơn vị không đổi, tỷ trọng của các khoản mục thay đổi"},{"id":"other-mau1-q016-B","text":"Tổng cộng tài sản của đơn vị và tỷ trọng của các khoản mục thay đổi"},{"id":"other-mau1-q016-C","text":"Tổng cộng nguồn vốn của đơn vị và tỷ trọng của các khoản mục không đổi"},{"id":"other-mau1-q016-D","text":"Tổng nguồn vốn của đơn vị giảm"}],"correctOptionId":"other-mau1-q016-A","explanation":"Nợ TK 331 / Có TK 341 200 triệu: nợ phải trả giảm ở khoản phải trả người bán và tăng ở vay, một nguồn vốn tăng một nguồn vốn giảm. Tổng nguồn vốn (và tổng tài sản) không đổi nhưng cơ cấu/tỷ trọng thay đổi.","status":"ok"}]},{"id":"other-mau1-u017","context":null,"questions":[{"id":"other-mau1-q017","num":"Câu 17","type":"mcq","text":"Tài khoản Phải thu khách hàng có đặc điểm:","source":"Slide Chương 2, slide 38–39; Chương 3 (tài khoản hỗn hợp)","answerBasis":"self","options":[{"id":"other-mau1-q017-A","text":"Số dư bên Nợ"},{"id":"other-mau1-q017-B","text":"Số dư bên Có"},{"id":"other-mau1-q017-C","text":"Có thể có số dư Nợ hoặc số dư Có"},{"id":"other-mau1-q017-D","text":"Có cả số dư Nợ và số dư Có"}],"correctOptionId":"other-mau1-q017-C","explanation":"TK 131 là tài khoản hỗn hợp (vừa phản ánh tài sản vừa nguồn vốn): có thể dư Nợ (phải thu) hoặc dư Có (khách ứng trước) tại một thời điểm, nhưng ở mỗi tài khoản chi tiết thì ghi riêng. Phương án D sai vì tổng hợp chỉ có số dư một bên sau bù trừ lý thuyết.","status":"ok"}]},{"id":"other-mau1-u018","context":null,"questions":[{"id":"other-mau1-q018","num":"Câu 18","type":"mcq","text":"Đơn vị mua tài sản cố định hữu hình 50 triệu đồng (chưa bao gồm thuế giá trị gia tăng), chưa trả tiền người bán. Thuế suất thuế GTGT là 10%. đơn vị tính thuế GTGT theo phương pháp khấu trừ. Định khoản nghiệp vụ này là (đvt: triệu đồng):","source":"Slide Chương 5 (mua TSCĐ, thuế GTGT khấu trừ)","answerBasis":"self","options":[{"id":"other-mau1-q018-A","text":"Nợ TK 211:50<br>Nợ TK 133: 5<br>Có TK 331:55"},{"id":"other-mau1-q018-B","text":"Nợ TK 211: 55<br>Có TK 133: 5<br>Có TK 331: 50"},{"id":"other-mau1-q018-C","text":"Nợ TK 211: 55<br>Có TK 331: 55"},{"id":"other-mau1-q018-D","text":"Nợ TK 211: 50<br>Nợ TK 133: 5<br>Có TK 111: 55"}],"correctOptionId":"other-mau1-q018-A","explanation":"TSCĐ ghi theo giá chưa thuế 50 (Nợ TK 211), thuế GTGT đầu vào 5 vào Nợ TK 133, chưa trả tiền nên Có TK 331 = 55. B, C sai vì đưa thuế vào nguyên giá/ghi Có 133; D sai vì ghi Có TK 111 trong khi chưa trả tiền.","status":"ok"}]},{"id":"other-mau1-u019","context":null,"questions":[{"id":"other-mau1-q019","num":"Câu 19","type":"mcq","text":"Căn cứ vào kết cấu của tài khoản, Tài khoản 211 - Tài sản cố định hữu hình là loại tài khoản:","source":"Slide Chương 3 (phân loại tài khoản theo công dụng và kết cấu: TK chủ yếu - TK phản ánh tài sản)","answerBasis":"self","options":[{"id":"other-mau1-q019-A","text":"Tài khoản điều chỉnh"},{"id":"other-mau1-q019-B","text":"Tài khoản cơ bản"},{"id":"other-mau1-q019-C","text":"Tài khoản hỗn hợp"},{"id":"other-mau1-q019-D","text":"Tài khoản nghiệp vụ"}],"correctOptionId":"other-mau1-q019-B","explanation":"TK 211 phản ánh trực tiếp tài sản (số dư Nợ), thuộc nhóm tài khoản cơ bản (phản ánh tài sản). TK điều chỉnh như 214; TK hỗn hợp như 131, 331; TK nghiệp vụ như 621, 154.","status":"needs_review","reviewNote":"Đáp án dựa trên phân loại tài khoản cơ bản (chủ yếu); nên đối chiếu giáo trình về thuật ngữ nhóm tài khoản."}]},{"id":"other-mau1-u020","context":null,"questions":[{"id":"other-mau1-q020","num":"Câu 20","type":"mcq","text":"Nghiệp vụ “Đơn vị mua và nhập kho số nguyên vật liệu trị giá 65 triệu đồng, chưa thanh toán tiền hàng cho người bán” làm giá trị bảng cân đối kế toán thay đổi như thế nào?","source":"Slide Chương 2 (tác động nghiệp vụ lên bảng cân đối)","answerBasis":"self","options":[{"id":"other-mau1-q020-A","text":"Nguyên vật liệu tăng 65, nợ phải trả tăng 65, tổng tài sản tăng 130"},{"id":"other-mau1-q020-B","text":"Nguyên vật liệu tăng 65, nợ phải trả tăng 65, tổng tài sản tăng 65"},{"id":"other-mau1-q020-C","text":"Nguyên vật liệu tăng 65, nợ phải trả giảm 65, tổng tài sản không đổi"},{"id":"other-mau1-q020-D","text":"Nguyên vật liệu tăng 65, tiền mặt giảm 65, tổng tài sản không đổi"}],"correctOptionId":"other-mau1-q020-B","explanation":"Nợ TK 152 65 / Có TK 331 65: tài sản (NVL) tăng 65 và nợ phải trả tăng 65; tổng tài sản tăng 65, tổng nguồn vốn cũng tăng 65.","status":"ok"}]},{"id":"other-mau1-u021","context":null,"questions":[{"id":"other-mau1-q021","num":"Câu 21","type":"mcq","text":"Nếu “Tháng 1, công ty Thịnh Khang chuyển khoản 120 triệu đồng trả tiền thuê văn phòng 3 tháng đầu năm và ghi nhận toàn bộ số tiền này vào chi phí tháng 1” thì nguyên tắc kế toán bị vi phạm là:","source":"Slide Chương 1 (nguyên tắc phù hợp)","answerBasis":"self","options":[{"id":"other-mau1-q021-A","text":"Nguyên tắc giá gốc"},{"id":"other-mau1-q021-B","text":"Nguyên tắc phù hợp"},{"id":"other-mau1-q021-C","text":"Nguyên tắc hoạt động liên tục"},{"id":"other-mau1-q021-D","text":"Nguyên tắc nhất quán"}],"correctOptionId":"other-mau1-q021-B","explanation":"Tiền thuê 3 tháng phải phân bổ vào chi phí của 3 tháng (40 triệu/tháng) để phù hợp với doanh thu cùng kỳ; ghi hết vào tháng 1 vi phạm nguyên tắc phù hợp.","status":"ok"}]},{"id":"other-mau1-u022","context":null,"questions":[{"id":"other-mau1-q022","num":"Câu 22","type":"mcq","text":"Phương pháp cải chính được sử dụng trong sửa sai sổ kế toán khi","source":"Slide Chương 3, slide 90 (ba phương pháp sửa sổ); Thông tư hướng dẫn chế độ chứng từ/sổ","answerBasis":"self","options":[{"id":"other-mau1-q022-A","text":"Sai sót được phát hiện sớm, ghi sai quan hệ đối ứng tài khoản"},{"id":"other-mau1-q022-B","text":"Sai sót được phát hiện trễ và số ghi sai lớn hơn (>) số ghi đúng"},{"id":"other-mau1-q022-C","text":"Sai sót được phát hiện sớm, ghi số sai, không liên quan đến quan hệ đối ứng tài khoản"},{"id":"other-mau1-q022-D","text":"Ghi thiếu định khoản"}],"correctOptionId":"other-mau1-q022-C","explanation":"Ghi cải chính (gạch một đường, ghi số đúng bên trên, kế toán trưởng ký) dùng khi phát hiện sớm, sai sót về số liệu/diễn giải không ảnh hưởng quan hệ đối ứng tài khoản. Sai quan hệ đối ứng hoặc phát hiện trễ thì dùng ghi số âm; ghi thiếu thì ghi điều chỉnh.","status":"needs_review","reviewNote":"Slide chỉ liệt kê 3 phương pháp, không nêu điều kiện áp dụng; điều kiện C theo quy định sửa sổ kế toán truyền thống."}]},{"id":"other-mau1-u023","context":null,"questions":[{"id":"other-mau1-q023","num":"Câu 23","type":"mcq","text":"Tổ chức công tác kế toán là một hệ thống các yếu tố cấu thành bao gồm:","source":"Slide Chương 6 (tổ chức công tác kế toán)","answerBasis":"self","options":[{"id":"other-mau1-q023-A","text":"Tổ chức vận dụng các phương pháp kế toán"},{"id":"other-mau1-q023-B","text":"Tổ chức bộ máy kế toán, ứng dụng các phương tiện kỹ thuật tính toán"},{"id":"other-mau1-q023-C","text":"Tổ chức vận dụng các chế độ thể lệ kế toán"},{"id":"other-mau1-q023-D","text":"Tất cả các trên đều đúng"}],"correctOptionId":"other-mau1-q023-D","explanation":"Tổ chức công tác kế toán gồm: tổ chức vận dụng phương pháp kế toán, chế độ thể lệ kế toán, tổ chức bộ máy kế toán và ứng dụng phương tiện kỹ thuật tính toán. Cả ba phương án đều là yếu tố cấu thành.","status":"ok"}]},{"id":"other-mau1-u024","context":null,"questions":[{"id":"other-mau1-q024","num":"Câu 24","type":"mcq","text":"Xuất kho nguyên vật liệu trực tiếp sản xuất sản phẩm, kế toán phản ánh vào bên Nợ TK:","source":"Slide Chương 5 (tập hợp chi phí sản xuất, TK 621)","answerBasis":"self","options":[{"id":"other-mau1-q024-A","text":"TK 627-Chi phí sản xuất chung"},{"id":"other-mau1-q024-B","text":"TK 641-Chi phí bán hàng"},{"id":"other-mau1-q024-C","text":"TK 642 - Chi phí quản lý doanh nghiệp"},{"id":"other-mau1-q024-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q024-D","explanation":"NVL trực tiếp sản xuất sản phẩm ghi Nợ TK 621 - Chi phí nguyên vật liệu trực tiếp (Có TK 152); không có TK 621 trong phương án nên D. TK 627 chỉ dành cho vật liệu phục vụ phân xưởng; 641, 642 cho bán hàng/quản lý.","status":"ok"}]},{"id":"other-mau1-u025","context":null,"questions":[{"id":"other-mau1-q025","num":"Câu 25","type":"mcq","text":"Tiền nước phát sinh tại bộ phận sản xuất ở phân xưởng đã trả bằng tiền mặt: 5.500.000đ (bao gồm thuế GTGT 10%), đơn vị kê khai thuế GTGT theo phương pháp khấu trừ. Kế toán phản ánh vào bên Nợ của:","source":"Slide Chương 5 (chi phí sản xuất chung, thuế GTGT khấu trừ)","answerBasis":"self","options":[{"id":"other-mau1-q025-A","text":"TK 111 – Tiền mặt: 5.500.000"},{"id":"other-mau1-q025-B","text":"TK 627 – Chi phí sản xuất chung: 5.000.000"},{"id":"other-mau1-q025-C","text":"TK 627 – Chi phí sản xuất chung: 5.500.000"},{"id":"other-mau1-q025-D","text":"TK 642 – Chi phí quản lý doanh nghiệp: 5.000.000"}],"correctOptionId":"other-mau1-q025-B","explanation":"Chi phí chưa thuế 5.500.000/1,1 = 5.000.000 ghi Nợ TK 627; thuế GTGT 500.000 ghi Nợ TK 133; Có TK 111 5.500.000. A sai vì 111 ghi bên Có; C ghi cả thuế; D sai bộ phận.","status":"ok"}]},{"id":"other-mau1-u026","context":null,"questions":[{"id":"other-mau1-q026","num":"Câu 26","type":"mcq","text":"Đơn vị A nhập khẩu một tài sản cố định với giá nhập khẩu 300.000 đã thanh toán qua ngân hàng, tiền thuế nhập khẩu 10% và tiền thuế giá trị gia tăng của hàng nhập khẩu 10% đã nộp cho nhà nước bằng chuyển khoản. Chi phí vận chuyển và chạy thử là 11.000 (đã gồm thuế giá trị gia tăng 10%) đã thanh toán cho đơn vị cung cấp bằng tiền mặt. Đơn vị tính thuế giá trị gia tăng theo phương pháp khấu trừ. Nguyên giá của TSCĐ được xác định là (Đvt: 1.000đ)","source":"Slide Chương 4 (tính giá TSCĐ/hàng nhập khẩu: giá + thuế nhập khẩu + chi phí)","answerBasis":"self","options":[{"id":"other-mau1-q026-A","text":"341.000"},{"id":"other-mau1-q026-B","text":"371.000"},{"id":"other-mau1-q026-C","text":"340.000"},{"id":"other-mau1-q026-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q026-C","explanation":"Nguyên giá = giá nhập khẩu 300.000 + thuế nhập khẩu 300.000 x 10% = 30.000 + chi phí vận chuyển, chạy thử chưa thuế 11.000/1,1 = 10.000 = 340.000. Thuế GTGT hàng nhập khẩu (330.000 x 10% = 33.000) và thuế GTGT của chi phí vận chuyển (1.000) được khấu trừ, ghi Nợ TK 133, không tính vào nguyên giá. Phương án A (341.000) cộng nhầm thuế GTGT của chi phí vận chuyển.","status":"ok"}]},{"id":"other-mau1-u027","context":null,"questions":[{"id":"other-mau1-q027","num":"Câu 27","type":"essay","text":"Công ty ABC mua 4.000kg hàng hóa A và 1.800kg hàng hóa B với đơn giá chưa thuế GTGT lần lượt là: 50/kg và 72/kg (NH đã báo Nợ). Chi phí vận chuyển toàn bộ hàng hóa trên theo giá thanh toán trên hoá đơn GTGT là 12.100 đã thanh toán bằng tiền mặt. Số hàng hóa đã nhập kho đầy đủ. Cho biết: Công ty tính thuế GTGT theo phương pháp khấu trừ; thuế suất thuế GTGT của hàng hóa và dịch vụ: 10%. (Đvt: 1.000đ). Giá gốc của lô hàng là bao nhiêu?","source":"Slide Chương 4 (tính giá hàng mua: giá mua + chi phí thu mua); Chương 5 (TK 156, 133)","answerBasis":"self","answer":"<p>Đề gốc không có phương án lựa chọn (câu tính số).<\/p><p>Giá mua hàng A = 4.000 x 50 = 200.000; hàng B = 1.800 x 72 = 129.600; cộng = 329.600.<br>Chi phí vận chuyển chưa thuế = 12.100 / 1,1 = 11.000 (thuế GTGT 1.100 ghi Nợ TK 133).<br><b>Giá gốc lô hàng = 329.600 + 11.000 = 340.600<\/b> (nghìn đồng).<\/p><div class=\"je\"><div>Nợ TK 156 &nbsp; 329.600<\/div><div>Nợ TK 133 &nbsp; 32.960<\/div><div class=\"cr\">Có TK 112 &nbsp; 362.560<\/div><\/div><div class=\"je\"><div>Nợ TK 156 &nbsp; 11.000<\/div><div>Nợ TK 133 &nbsp; 1.100<\/div><div class=\"cr\">Có TK 111 &nbsp; 12.100<\/div><\/div>","status":"ok","explanation":"Đề gốc không có phương án; xem lời giải."}]},{"id":"other-mau1-u028","context":null,"questions":[{"id":"other-mau1-q028","num":"Câu 28","type":"essay","text":"Công ty A chuyển khoản mua một TSCĐ với các thông tin sau: Giá thanh toán bao gồm thuế GTGT là 1.550.000. Phí trước bạ 2% trên giá thanh toán. Chi phí vận chuyển, lắp đặt, chạy thử 24.500 chưa thuế GTGT. Cho biết: Công ty tính thuế GTGT theo phương pháp khấu trừ; thuế suất thuế GTGT của hàng hóa và dịch vụ: 10%. (Đvt: 1.000đ). Vậy Nguyên giá của TSCĐ là bao nhiêu?","source":"Slide Chương 4 (nguyên giá TSCĐ = giá mua chưa thuế + chi phí trước khi sử dụng, gồm lệ phí trước bạ)","answerBasis":"self","answer":"<p>Đề gốc không có phương án lựa chọn (câu tính số).<\/p><p>Giá mua chưa thuế = 1.550.000 / 1,1 = 1.409.090,9 (thuế GTGT = 140.909,1 được khấu trừ).<br>Phí trước bạ = 2% x 1.550.000 = 31.000 (tính trên giá thanh toán theo đề).<br>Chi phí vận chuyển, lắp đặt, chạy thử = 24.500.<br><b>Nguyên giá = 1.409.090,9 + 31.000 + 24.500 = 1.464.590,9 ≈ 1.464.591<\/b> (nghìn đồng).<\/p><p>Lưu ý: số không tròn do 1.550.000 không chia hết cho 1,1; kết quả làm tròn ≈ 1.464.591.<\/p>","status":"ok","explanation":"Đề gốc không có phương án; xem lời giải."}]},{"id":"other-mau1-u029","context":null,"questions":[{"id":"other-mau1-q029","num":"Câu 29","type":"mcq","text":"Công ty ABC mua và nhập kho Nguyên vật liệu phụ, thanh toán ngay bằng tiền mặt. Số vật liệu phụ đã nhập kho đầy đủ. Công ty tính thuế GTGT theo phương pháp khấu trừ. Kế toán hàng tồn kho theo phương pháp kê khai thường xuyên. Nghiệp vụ mua hàng hóa M được định khoản như sau:","source":"Slide Chương 5 (kế toán mua NVL, kê khai thường xuyên)","answerBasis":"self","options":[{"id":"other-mau1-q029-A","text":"Nợ TK

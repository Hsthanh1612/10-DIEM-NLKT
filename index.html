112- Tiền gửi ngân hàng/Có TK 152- NLVL"},{"id":"other-mau1-q029-B","text":"Nợ TK 611-Mua hàng<br>Nợ TK 133- Thuế GTGT được khấu trừ<br>Có TK 112- Tiền gửi ngân hàng"},{"id":"other-mau1-q029-C","text":"Nợ TK 152 - NLVL<br>Có TK 112- Tiền gửi ngân hàng"},{"id":"other-mau1-q029-D","text":"Nợ TK 152 - NLVL<br>Nợ TK 133- Thuế GTGT được khấu trừ<br>Có TK 111 - TM"}],"correctOptionId":"other-mau1-q029-D","explanation":"Mua NVL phụ thanh toán tiền mặt, nhập kho (kê khai thường xuyên, thuế khấu trừ): Nợ TK 152 (giá chưa thuế), Nợ TK 133 (thuế GTGT), Có TK 111. A đảo bên và sai TK; B dùng TK 611 (kiểm kê định kỳ) và TK 112; C thiếu thuế và dùng TK 112 trong khi trả tiền mặt. (Đề ghi 'hàng hóa M' nhưng nội dung là NVL phụ; vẫn chọn D.)","status":"ok"}]},{"id":"other-mau1-u030","context":null,"questions":[{"id":"other-mau1-q030","num":"Câu 30","type":"mcq","text":"Khi trích khấu hao TSCĐ sử dụng cho bộ phận bán hàng, kế toán ghi:","source":"Slide Chương 5 (khấu hao TSCĐ, TK 214, 641)","answerBasis":"self","options":[{"id":"other-mau1-q030-A","text":"Nợ TK 627-Chi phí sản xuất chung/ Có TK 214- Hao mòn TSCĐ"},{"id":"other-mau1-q030-B","text":"Nợ TK 642-Chi phí quản lý doanh nghiệp/ Có TK 211- TSCĐ"},{"id":"other-mau1-q030-C","text":"Nợ TK 641-Chi phí bán hàng/ Có TK 214- Hao mòn TSCĐ"},{"id":"other-mau1-q030-D","text":"Nợ TK 211- TSCĐ/ Có TK 214- Hao mòn TSCĐ"}],"correctOptionId":"other-mau1-q030-C","explanation":"Khấu hao TSCĐ dùng ở bộ phận bán hàng tính vào chi phí bán hàng: Nợ TK 641 / Có TK 214. Khấu hao không ghi giảm trực tiếp TK 211.","status":"ok"}]},{"id":"other-mau1-u031","context":null,"questions":[{"id":"other-mau1-q031","num":"Câu 31","type":"mcq","text":"Cuối kỳ kế toán, để xác định kết quả kinh doanh, các tài khoản giá vốn hàng bán, chi phí bán hàng, chi phí quản lý doanh nghiệp được kết chuyển về:","source":"Slide Chương 5 (xác định kết quả kinh doanh, TK 911)","answerBasis":"self","options":[{"id":"other-mau1-q031-A","text":"Nợ TK 421 “Lợi nhuận chưa phân phối”"},{"id":"other-mau1-q031-B","text":"Nợ TK 911 “Xác định kết quả kinh doanh”"},{"id":"other-mau1-q031-C","text":"Nợ TK 154 “Chi phí sản xuất kinh doanh dở dang”"},{"id":"other-mau1-q031-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q031-B","explanation":"Các khoản chi phí 632, 641, 642 kết chuyển Nợ TK 911 / Có TK 632, 641, 642 để xác định kết quả kinh doanh; sau đó mới kết chuyển lãi/lỗ sang TK 421.","status":"ok"}]},{"id":"other-mau1-u032","context":null,"questions":[{"id":"other-mau1-q032","num":"Câu 32","type":"mcq","text":"Nghiệp vụ “Chuyển khoản trả lương cho nhân viên quản lý sản xuất ở phân xưởng”, kế toán phản ánh:","source":"Slide Chương 5 (chi phí nhân công, TK 627, 334)","answerBasis":"self","options":[{"id":"other-mau1-q032-A","text":"Nợ TK 622-Chi phí nhân công trực tiếp / Có TK 334 – Phải trả người lao động"},{"id":"other-mau1-q032-B","text":"Nợ TK 627-Chi phí sản xuất chung/ Có TK 334 - Phải trả người lao động"},{"id":"other-mau1-q032-C","text":"Nợ TK 642-Chi phí quản lý doanh nghiệp/ Có TK 334 - Phải trả người lao động"},{"id":"other-mau1-q032-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q032-B","explanation":"Lương nhân viên quản lý phân xưởng là chi phí sản xuất chung: Nợ TK 627 / Có TK 334 (khi tính lương). Khi chuyển khoản trả lương thì Nợ TK 334 / Có TK 112; đề dùng cách nói gộp nên chọn B là bút toán phản ánh chi phí lương theo các phương án cho sẵn. 622 là lương công nhân trực tiếp; 642 là lương quản lý doanh nghiệp.","status":"needs_review","reviewNote":"Đề nói 'chuyển khoản trả lương' nhưng các phương án đều là bút toán ghi nhận chi phí lương (Có TK 334); đáp án B là phương án gần đúng nhất, không có phương án Nợ 334/Có 112."}]},{"id":"other-mau1-u033","context":null,"questions":[{"id":"other-mau1-q033","num":"Câu 33","type":"mcq","text":"Đơn vị tính thuế GTGT theo phương pháp khấu trừ. Nghiệp vụ “Chuyển khoản mua dây chuyền sản xuất dùng ở phân xưởng sản xuất, giá mua gồm cả thuế GTGT 10% là 440.000. Chi phí vận chuyển, chạy thử: 3.600 (chưa thuế GTGT) thanh toán bằng tiền mặt”, kế toán phản ánh nguyên giá TSCĐ là (Đvt: 1.000đ)","source":"Slide Chương 4–5 (nguyên giá TSCĐ mua ngoài)","answerBasis":"self","options":[{"id":"other-mau1-q033-A","text":"Nợ TK 627- Chi phí sản xuất chung 403.600"},{"id":"other-mau1-q033-B","text":"Nợ TK 211-Tài sản cố định 403.600"},{"id":"other-mau1-q033-C","text":"Nợ TK 627- Chi phí sản xuất chung 443.600"},{"id":"other-mau1-q033-D","text":"Nợ TK 211-Tài sản cố định 443.600"}],"correctOptionId":"other-mau1-q033-B","explanation":"Giá mua chưa thuế = 440.000/1,1 = 400.000; cộng chi phí vận chuyển, chạy thử 3.600 = 403.600. Ghi Nợ TK 211 (không phải 627 vì là mua TSCĐ), thuế GTGT 40.000 ghi Nợ TK 133.","status":"ok"}]},{"id":"other-mau1-u034","context":null,"questions":[{"id":"other-mau1-q034","num":"Câu 34","type":"mcq","text":"Tại công ty ABC có thông tin sau (đvt: 10.000đ):<br>- Chi phí dở dang đầu kỳ: 25.000; cuối kỳ: 19.000<br>- Chi phí sản xuất phát sinh trong kỳ:<br>+ Nguyên vật liệu để sản xuất sản phẩm: 720.000, để phục vụ sản xuất ở phân xưởng: 48.000.<br>+ Tiền lương Công nhân sản xuất: 250.000, nhân viên quản lý phân xưởng: 70.000.<br>+ Các khoản trích theo lương theo tỷ lệ quy định (DN là 23,5%, NLĐ là 10,5%).<br>+ Khấu hao TSCĐ: 26.000.<br>- Chi phí bán hàng và chi phí quản lý doanh nghiệp tập hợp được trong kỳ lần lượt là: 216.000 và 96.000.<br>Giá thành sản xuất thực tế của sản phẩm hoàn thành trong kỳ là:","source":"Slide Chương 5 (tập hợp CPSX, tính giá thành: Z = DDĐK + CPSX PS - DDCK; trích BHXH, BHYT, BHTN, KPCĐ 23,5% DN chịu)","answerBasis":"self","options":[{"id":"other-mau1-q034-A","text":"1.214.200"},{"id":"other-mau1-q034-B","text":"1.189.200"},{"id":"other-mau1-q034-C","text":"1.195.200"},{"id":"other-mau1-q034-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q034-C","explanation":"<p>Phần trích theo lương do DN chịu (23,5%) tính trên tổng lương công nhân SX và nhân viên QL phân xưởng: 23,5% x (250.000 + 70.000) = 75.200. Phần NLĐ chịu 10,5% trừ vào lương, không phải chi phí DN.<\/p><p>Chi phí SX phát sinh = 720.000 (NVL TT) + 250.000 (NC TT) + 48.000 + 70.000 + 75.200 + 26.000 (SXC) = 1.189.200.<br>Z = 25.000 + 1.189.200 - 19.000 = <b>1.195.200<\/b>. Chi phí bán hàng, QLDN không tính vào giá thành.<\/p>","status":"ok"}]},{"id":"other-mau1-u035","context":null,"questions":[{"id":"other-mau1-q035","num":"Câu 35","type":"mcq","text":"Tại công ty ABC có thông tin sau (đvt: 1.000đ):<br>- Chi phí dở dang đầu kỳ: 47.000; cuối kỳ: 94.000<br>- Chi phí sản xuất phát sinh trong kỳ:<br>+ Nguyên vật liệu để sản xuất sản phẩm: 820.000<br>+ Tiền lương Công nhân sản xuất: 320.000, nhân viên quản lý phân xưởng: 110.000, nhân viên bán hàng 125.000, nhân viên quản lý doanh nghiệp 83.000<br>+ Các khoản trích theo lương theo tỷ lệ quy định (DN là 23,5%, NLĐ là 10,5%).<br>+ Khấu hao TSCĐ dùng cho phân xưởng 35.000, dùng cho văn phòng 41.000<br>Phế liệu thu hồi: 3.400<br>Giá thành sản xuất thực tế của sản phẩm hoàn thành là:","source":"Slide Chương 5 (tập hợp CPSX và tính giá thành sản phẩm, phế liệu thu hồi giảm giá thành)","answerBasis":"self","options":[{"id":"other-mau1-q035-A","text":"1.335.650"},{"id":"other-mau1-q035-B","text":"1.339.050"},{"id":"other-mau1-q035-C","text":"1.543.650"},{"id":"other-mau1-q035-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q035-A","explanation":"<p>Chỉ tính lương công nhân SX (320.000) và nhân viên QL phân xưởng (110.000). Trích theo lương DN chịu = 23,5% x 430.000 = 101.050. Khấu hao phân xưởng 35.000 (khấu hao văn phòng 41.000, lương bán hàng, QLDN không vào giá thành).<\/p><p>CPSX = 820.000 + 320.000 + 110.000 + 101.050 + 35.000 = 1.386.050.<br>Z = 47.000 + 1.386.050 - 94.000 - 3.400 (phế liệu thu hồi) = <b>1.335.650<\/b>.<\/p>","status":"ok"}]},{"id":"other-mau1-u036","context":"<p>Tại công ty MBC tính thuế GTGT theo phương pháp khấu trừ, thuế suất 10%. Kế toán hàng tồn kho theo phương pháp kê khai thường xuyên. Tính giá hàng hóa xuất kho theo phương pháp FIFO.<\/p><p><i>Lô vật liệu X tồn kho đầu tháng là 500kg, đơn giá 120/kg (ĐVT: 1.000đ)<\/i><\/p><ul><li>Ngày 05/09: Mua 500kg VL-X, đơn giá thanh toán đã bao gồm thuế GTGT ghi trên hóa đơn là 165/kg chưa trả cho người bán K. Chi phí vận chuyển, bốc dỡ lô vật liệu trên theo giá chưa thuế GTGT 3.000 đã trả bằng tiền mặt.<\/li><li>Ngày 15/09: Xuất kho 700kg VL-X để sản xuất sản phẩm.<\/li><li>Ngày 23/09: Nhập khẩu 300kg VL-X, giá CIF: 6 USD/kg, tỷ giá: 23 VND/USD; Thuế suất thuế nhập khẩu: 20%; Thuế suất thuế GTGT hàng nhập khẩu: 10%.<\/li><li>Ngày 29/09: Xuất kho 400kg VL- X để sản xuất sản phẩm.<\/li><\/ul>","questions":[{"id":"other-mau1-q036","num":"Câu 36","type":"mcq","text":"Đơn giá nhập kho ngày 05/09 là:","source":"Slide Chương 4 (tính giá nhập kho, phương pháp FIFO), Chương 5 (kế toán NVL)","answerBasis":"self","options":[{"id":"other-mau1-q036-A","text":"165"},{"id":"other-mau1-q036-B","text":"150"},{"id":"other-mau1-q036-C","text":"156"},{"id":"other-mau1-q036-D","text":"171"}],"correctOptionId":"other-mau1-q036-C","explanation":"Giá chưa thuế = 165/1,1 = 150/kg; chi phí vận chuyển 3.000/500 = 6/kg. Đơn giá nhập kho = 150 + 6 = 156.","status":"ok"},{"id":"other-mau1-q037","num":"Câu 37","type":"mcq","text":"Giá xuất kho vật tư ngày 15/09 là:","source":"Slide Chương 4 (tính giá nhập kho, phương pháp FIFO), Chương 5 (kế toán NVL)","answerBasis":"self","options":[{"id":"other-mau1-q037-A","text":"93.000"},{"id":"other-mau1-q037-B","text":"91.200"},{"id":"other-mau1-q037-C","text":"90.000"},{"id":"other-mau1-q037-D","text":"94.200"}],"correctOptionId":"other-mau1-q037-B","explanation":"FIFO: xuất trước lô tồn đầu kỳ 500kg x 120 = 60.000, sau đó 200kg của lô 05/09 x 156 = 31.200. Tổng = 91.200. Tồn còn 300kg x 156 = 46.800.","status":"ok"},{"id":"other-mau1-q038","num":"Câu 38","type":"mcq","text":"Đơn giá nhập kho ngày 23/09 là:","source":"Slide Chương 4 (tính giá nhập kho, phương pháp FIFO), Chương 5 (kế toán NVL)","answerBasis":"self","options":[{"id":"other-mau1-q038-A","text":"165,6"},{"id":"other-mau1-q038-B","text":"182,16"},{"id":"other-mau1-q038-C","text":"151,8"},{"id":"other-mau1-q038-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q038-A","explanation":"Giá CIF = 6 x 23 = 138/kg; thuế nhập khẩu 20% = 27,6/kg. Đơn giá nhập kho = 138 + 27,6 = 165,6 (thuế GTGT hàng nhập khẩu 10% được khấu trừ, không tính vào giá). 182,16 là sai vì cộng cả thuế GTGT (138+27,6=165,6; x1,1 = 182,16).","status":"ok"},{"id":"other-mau1-q039","num":"Câu 39","type":"mcq","text":"Giá xuất kho vật tư ngày 29/09 là:","source":"Slide Chương 4 (tính giá nhập kho, phương pháp FIFO), Chương 5 (kế toán NVL)","answerBasis":"self","options":[{"id":"other-mau1-q039-A","text":"66.060"},{"id":"other-mau1-q039-B","text":"61.560"},{"id":"other-mau1-q039-C","text":"63.360"},{"id":"other-mau1-q039-D","text":"67.860"}],"correctOptionId":"other-mau1-q039-C","explanation":"FIFO: xuất hết 300kg lô 05/09 x 156 = 46.800, rồi 100kg lô 23/09 x 165,6 = 16.560. Tổng = 63.360.","status":"ok"},{"id":"other-mau1-q040","num":"Câu 40","type":"mcq","text":"Giá trị hàng tồn kho cuối kỳ là:","source":"Slide Chương 4 (tính giá nhập kho, phương pháp FIFO), Chương 5 (kế toán NVL)","answerBasis":"self","options":[{"id":"other-mau1-q040-A","text":"36.432"},{"id":"other-mau1-q040-B","text":"30.360"},{"id":"other-mau1-q040-C","text":"33.120"},{"id":"other-mau1-q040-D","text":"Tất cả đều sai"}],"correctOptionId":"other-mau1-q040-C","explanation":"Tồn cuối kỳ = 200kg (lô 23/09) x 165,6 = 33.120. Kiểm tra: Tổng giá trị có: 60.000 + 500x156 (78.000) + 300x165,6 (49.680) = 187.680; trừ xuất 91.200 + 63.360 = 154.560; còn 33.120.","status":"ok"}]}]}],"theory":{"ch1":{"chapter":"ch1","title":"Chương 1 – Tổng quan về kế toán","topics":[{"id":"ch1-t01","title":"Lịch sử hình thành và phát triển kế toán","core":"<ul>\n<li><b>Sơ khai<\/b> (~8.000 năm TCN, Lưỡng Hà): thẻ đất sét ghi lương thực, gia súc, hàng hóa; ~3.300–3.000 TCN có chữ viết, số học ghi hàng thu/xuất và nghĩa vụ thanh toán.<\/li>\n<li><b>Ghi sổ đơn<\/b>: mỗi nghiệp vụ chỉ ghi <b>một lần<\/b> (tiền, hàng thu/chi, phải thu, phải trả). <b>Ghi sổ kép<\/b>: ghi hai mặt Nợ – Có, giúp <b>kiểm tra tính cân đối<\/b> và phản ánh đầy đủ biến động tài sản, nguồn vốn.<\/li>\n<li><b>Luca Pacioli<\/b> (1494, Ý): hệ thống hóa và phổ biến ghi sổ kép (Nợ/Có, sổ nhật ký, sổ cái, kiểm tra cân đối); <b>không phải người phát minh<\/b> nhưng được gọi là “cha đẻ của kế toán hiện đại”.<\/li>\n<li><b>Công nghiệp hóa<\/b> (XVIII–XIX): tách thành kế toán tài chính, kế toán chi phí (giá thành), kế toán quản trị; hình thành nghề kế toán, kiểm toán.<\/li>\n<li><b>Hiện đại<\/b>: chuẩn hóa (IASC 1973; IASB 2001 – IFRS), số hóa (ERP, hóa đơn/sổ điện tử, đám mây, AI), báo cáo bền vững – ESG.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 3–9"},{"id":"ch1-t02","title":"Khái niệm kế toán và công việc của kế toán","core":"<p><b>Luật Kế toán 88/2015/QH13<\/b>: kế toán là việc <b>thu thập, xử lý, kiểm tra, phân tích và cung cấp<\/b> thông tin kinh tế, tài chính dưới hình thức <b>giá trị, hiện vật và thời gian lao động<\/b>.<\/p>\n<p>Kế toán là hệ thống thông tin phục vụ quản lý kinh tế, tài chính. <b>5 công việc<\/b>: (1) ghi chép nghiệp vụ phát sinh; (2) phân loại, sắp xếp bằng phương pháp kế toán; (3) kiểm tra số liệu; (4) tổng hợp, phân tích chỉ tiêu; (5) cung cấp thông tin qua báo cáo kế toán.<\/p>\n<ul><li>Kế toán dùng <b>3 thước đo<\/b>: giá trị (tiền tệ – thước đo thống nhất), hiện vật, thời gian lao động.<\/li>\n<li>Kế toán <b>không<\/b> ra quyết định đầu tư hay trực tiếp điều hành SXKD: chỉ cung cấp thông tin để nhà quản trị quyết định.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 10–12, 17–18"},{"id":"ch1-t03","title":"Phân loại kế toán; Kế toán tài chính và kế toán quản trị","core":"<ul><li>Theo <b>đối tượng sử dụng thông tin<\/b>: kế toán tài chính, kế toán quản trị, kế toán thuế.<\/li>\n<li>Theo <b>lĩnh vực hoạt động<\/b>: kế toán doanh nghiệp, kế toán công, kế toán lĩnh vực đặc thù.<\/li>\n<li>Theo <b>mức độ khái quát<\/b>: kế toán tổng hợp, kế toán chi tiết.<\/li><\/ul>\n<p><b>Giống nhau<\/b>: cùng dùng dữ liệu kế toán của doanh nghiệp; cùng phục vụ quản lý và ra quyết định.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Kế toán tài chính<\/th><th>Kế toán quản trị<\/th><\/tr><\/thead><tbody>\n<tr><td>Người sử dụng<\/td><td>Chủ yếu <b>bên ngoài<\/b><\/td><td><b>Bên trong<\/b> doanh nghiệp (nhà quản trị)<\/td><\/tr>\n<tr><td>Mục đích<\/td><td>Cung cấp thông tin tài chính<\/td><td>Hỗ trợ quản lý, ra quyết định<\/td><\/tr>\n<tr><td>Quy định<\/td><td><b>Phải tuân thủ<\/b> chuẩn mực, chế độ<\/td><td><b>Linh hoạt<\/b> theo nhu cầu<\/td><\/tr>\n<tr><td>Thời gian<\/td><td>Chủ yếu <b>quá khứ<\/b><\/td><td>Quá khứ và <b>dự báo tương lai<\/b><\/td><\/tr>\n<tr><td>Phạm vi<\/td><td>Toàn doanh nghiệp<\/td><td>Từng bộ phận hoặc toàn DN<\/td><\/tr>\n<tr><td>Đặc điểm thông tin<\/td><td>Tổng hợp, chính xác, kiểm tra được<\/td><td>Chi tiết, kịp thời, có thể dùng số ước tính<\/td><\/tr>\n<tr><td>Báo cáo<\/td><td>Theo <b>kỳ quy định<\/b> (BCTC)<\/td><td>Khi nhà quản trị yêu cầu<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 1, slide 13–15"},{"id":"ch1-t04","title":"Vai trò và chức năng của kế toán","core":"<p><b>Vai trò<\/b>: công cụ cung cấp thông tin kinh tế, tài chính đầy đủ, trung thực, kịp thời, minh bạch; công cụ quản lý, giám sát hoạt động kinh tế – tài chính; hỗ trợ Nhà nước, doanh nghiệp, tổ chức, cá nhân quản lý, điều hành và ra quyết định.<\/p>\n<p><b>Hai chức năng cơ bản<\/b>:<\/p>\n<ul><li><b>Cung cấp thông tin<\/b>: về tình hình tài chính, kết quả hoạt động… → hỗ trợ quản lý và ra quyết định kinh tế.<\/li>\n<li><b>Kiểm tra, giám sát<\/b>: tính trung thực, hợp lý của thông tin và việc chấp hành chính sách, chế độ kế toán → đánh giá kết quả hoạt động, <b>bảo vệ tài sản<\/b> đơn vị.<\/li><\/ul>\n<p>Luồng hệ thống: hoạt động kinh doanh → ghi chép (dữ liệu) → phân loại, xử lý → báo cáo, truyền tin (thông tin) → người sử dụng.<\/p>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 16–19"},{"id":"ch1-t05","title":"Đối tượng kế toán và tài sản","core":"<p><b>Đối tượng kế toán<\/b>: quá trình sản xuất kinh doanh thông qua sự <b>hình thành và vận động của tài sản<\/b> trong một đơn vị cụ thể, nhằm quản lý và sử dụng hiệu quả tài sản. Gồm: <b>tài sản, nguồn hình thành tài sản (nguồn vốn), tình hình kinh doanh (doanh thu – chi phí – kết quả)<\/b> và sự vận động của chúng.<\/p>\n<p>Phân loại theo lĩnh vực (Điều 8 Luật KT 2015): (1) thu chi NSNN, hành chính sự nghiệp, đơn vị dùng kinh phí NSNN; (2) đơn vị không dùng kinh phí NSNN; (3) hoạt động kinh doanh; (4) ngân hàng, tín dụng, bảo lãnh, chứng khoán, đầu tư tài chính.<\/p>\n<p><b>Tài sản<\/b> = nguồn lực kinh tế thỏa 3 điều kiện: <b>do đơn vị kiểm soát<\/b>; <b>hình thành từ giao dịch quá khứ<\/b>; <b>có khả năng mang lại lợi ích kinh tế tương lai<\/b>. Trả lời: “doanh nghiệp <b>có gì<\/b>?”<\/p>\n<ul><li><b>Tài sản ngắn hạn<\/b>: dự kiến thu hồi, bán, sử dụng trong 1 chu kỳ kinh doanh bình thường hoặc ≤ 12 tháng kể từ ngày kết thúc kỳ kế toán. VD: tiền mặt, tiền gửi không kỳ hạn, chứng khoán kinh doanh, phải thu khách hàng, nguyên vật liệu, công cụ dụng cụ, sản phẩm, hàng hóa, chi phí SXKD dở dang.<\/li>\n<li><b>Tài sản dài hạn<\/b>: tài sản không phải ngắn hạn. VD: TSCĐ hữu hình/vô hình/thuê tài chính, bất động sản đầu tư, đầu tư vào công ty con/liên kết, XDCB dở dang, phải thu dài hạn, ký quỹ ký cược dài hạn.<\/li><\/ul>\n<p>Khoản <b>phải thu<\/b> (kể cả tạm ứng, trả trước cho người bán, chi phí trả trước), <b>hàng gửi đi bán<\/b> đều là <b>tài sản<\/b>.<\/p>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 20–27"},{"id":"ch1-t06","title":"Nguồn vốn: nợ phải trả và vốn chủ sở hữu","core":"<p><b>Nguồn vốn<\/b> = nguồn hình thành tài sản, cho biết tài sản được tài trợ <b>từ đâu<\/b>; gồm <b>nợ phải trả + vốn chủ sở hữu<\/b>.<\/p>\n<ul><li><b>Nợ phải trả<\/b>: nghĩa vụ hiện tại phát sinh từ giao dịch quá khứ, doanh nghiệp phải dùng nguồn lực để thanh toán. <b>Nợ ngắn hạn<\/b>: thanh toán trong chu kỳ kinh doanh thông thường hoặc ≤ 12 tháng; <b>nợ dài hạn<\/b>: còn lại. VD: phải trả người bán, phải trả người lao động, thuế phải nộp, chi phí phải trả, vay và nợ thuê tài chính, nhận ký quỹ ký cược, quỹ khen thưởng phúc lợi.<\/li>\n<li><b>Vốn chủ sở hữu<\/b>: giá trị còn lại của tài sản sau khi trừ nợ phải trả; doanh nghiệp <b>không cam kết thanh toán<\/b>. Gồm: vốn đầu tư của CSH, lợi nhuận sau thuế chưa phân phối, chênh lệch đánh giá lại tài sản, chênh lệch tỷ giá, quỹ đầu tư phát triển, các quỹ khác thuộc VCSH.<\/li><\/ul>\n<p>VD: ô tô 800 tr = CSH góp 500 + vay ngân hàng 300 → tài sản 800; nguồn vốn = VCSH 500 + nợ 300.<\/p>\n<p>Ví dụ trong slide: <b>tài sản thừa chờ xử lý<\/b> xếp vào <b>nguồn vốn<\/b>; <b>tài sản thiếu chờ xử lý<\/b> xếp vào <b>tài sản<\/b>.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Tài sản<\/th><th>Nguồn vốn<\/th><\/tr><\/thead><tbody>\n<tr><td>Trả lời<\/td><td>Doanh nghiệp <b>có gì<\/b>?<\/td><td>Hình thành <b>từ đâu<\/b>?<\/td><\/tr>\n<tr><td>Gồm<\/td><td>Tài sản ngắn hạn, dài hạn<\/td><td>Nợ phải trả, vốn CSH<\/td><\/tr>\n<tr><td>Bản chất<\/td><td>Nguồn lực kiểm soát, mang lợi ích tương lai<\/td><td>Nghĩa vụ trả nợ hoặc vốn của chủ sở hữu<\/td><\/tr>\n<tr><td>Ví dụ<\/td><td>Tiền, phải thu, hàng tồn kho, TSCĐ<\/td><td>Vay, phải trả người bán, vốn góp, LNST chưa phân phối<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Nợ phải trả<\/th><th>Vốn chủ sở hữu<\/th><\/tr><\/thead><tbody>\n<tr><td>Bản chất<\/td><td>Nghĩa vụ hiện tại phải thanh toán<\/td><td>Phần còn lại sau khi trừ nợ (Tài sản − Nợ)<\/td><\/tr>\n<tr><td>Thanh toán<\/td><td><b>Có<\/b> cam kết, có thời hạn (ngắn/dài hạn)<\/td><td><b>Không<\/b> cam kết thanh toán<\/td><\/tr>\n<tr><td>Nguồn gốc<\/td><td>Giao dịch quá khứ với chủ nợ<\/td><td>Vốn góp của CSH, lợi nhuận giữ lại, chênh lệch đánh giá, quỹ<\/td><\/tr>\n<tr><td>Ví dụ<\/td><td>Vay NH, phải trả người bán, thuế phải nộp<\/td><td>Vốn góp, LNST chưa phân phối, quỹ ĐTPT<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Dễ nhầm<\/th><th>Phân loại<\/th><\/tr><\/thead><tbody>\n<tr><td>Nợ phải thu (khách nợ DN; tạm ứng; trả trước người bán)<\/td><td><b>Tài sản<\/b><\/td><\/tr>\n<tr><td>Nợ phải trả (DN nợ người khác; phải trả người bán)<\/td><td><b>Nguồn vốn<\/b> (nợ phải trả)<\/td><\/tr>\n<tr><td>Quỹ khen thưởng phúc lợi; chi phí phải trả<\/td><td>Nợ phải trả<\/td><\/tr>\n<tr><td>Chi phí trả trước; hàng gửi đi bán<\/td><td>Tài sản<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 1, slide 28–35, 37–38"},{"id":"ch1-t07","title":"Phương trình kế toán và sự vận động của tài sản","core":"<p>Tài sản và nguồn vốn là <b>hai mặt<\/b> của cùng một lượng giá trị nên luôn <b>bằng nhau<\/b>. Sau mỗi nghiệp vụ, phương trình vẫn cân bằng.<\/p>\n<p>Mỗi nghiệp vụ chỉ rơi vào các dạng ảnh hưởng: (1) tài sản này tăng – tài sản khác giảm (tổng TS không đổi); (2) nguồn vốn này tăng – nguồn vốn khác giảm (tổng không đổi); (3) tài sản và nguồn vốn <b>cùng tăng<\/b>; (4) tài sản và nguồn vốn <b>cùng giảm<\/b>.<\/p>\n<p>Vận động của tài sản: sản xuất <b>T–H…SX…H’–T’<\/b>; thương mại <b>T–H–T’<\/b>; tài chính <b>T–T’<\/b>. Tài sản vận động liên tục qua các giai đoạn nhưng tính cân đối ∑TS = ∑NV không đổi.<\/p>","formulas":"<div class=\"formula\">∑Tài sản = ∑Nguồn vốn = Nợ phải trả + Vốn CSH<\/div>\n<div class=\"formula\">Vốn CSH = ∑Tài sản − Nợ phải trả<\/div>\n<div class=\"formula\">Nợ phải trả = ∑Tài sản − Vốn CSH<\/div>\n<p>Dùng để tìm số còn thiếu (một trong ba đại lượng) và kiểm tra bảng cân đối. Khi biết tỷ lệ (vd nợ = 1/3 tài sản) thì VCSH = 2/3 tài sản. Tài sản cuối kỳ = đầu kỳ + biến động.<\/p>\n<p>VD: mua máy 300 chưa trả tiền → TS +300, nợ phải trả +300, VCSH không đổi; bán chịu 45, giá vốn 30 → phải thu +45, hàng −30, VCSH (lợi nhuận) +15.<\/p>","compare":null,"source":"Slide Chương 1, slide 36, 44–49; bài tập LMS chương 1"},{"id":"ch1-t08","title":"Tình hình kinh doanh: doanh thu, thu nhập khác, chi phí","core":"<ul><li><b>Doanh thu và thu nhập khác<\/b>: lợi ích kinh tế thu được trong kỳ, làm <b>tăng vốn CSH<\/b> (không gồm vốn góp của chủ sở hữu).<ul>\n<li><b>Doanh thu<\/b>: từ hoạt động kinh doanh thông thường – bán hàng, cung cấp dịch vụ, hoạt động tài chính (lãi, bản quyền, cổ tức).<\/li>\n<li><b>Thu nhập khác<\/b>: từ hoạt động ngoài hoạt động tạo ra doanh thu – thanh lý, nhượng bán TSCĐ, phạt khách hàng vi phạm hợp đồng.<\/li><\/ul><\/li>\n<li><b>Chi phí<\/b>: các khoản làm giảm lợi ích kinh tế trong kỳ (chi tiền, khấu trừ tài sản, phát sinh nợ), làm <b>giảm vốn CSH<\/b> (không gồm phân phối cho chủ sở hữu). Gồm chi phí hoạt động thông thường (giá vốn, bán hàng, quản lý DN, lãi vay…) và <b>chi phí khác<\/b> (thanh lý, nhượng bán TSCĐ, bị phạt vi phạm hợp đồng).<\/li><\/ul>","formulas":"<div class=\"formula\">Kết quả kinh doanh = Doanh thu và thu nhập khác − Chi phí<\/div>\n<p>Lãi làm tăng, lỗ làm giảm vốn chủ sở hữu.<\/p>","compare":null,"source":"Slide Chương 1, slide 39–43"},{"id":"ch1-t09","title":"Đặc điểm đối tượng kế toán và quy trình (phương pháp) kế toán","core":"<p><b>Đặc điểm đối tượng kế toán<\/b>: có <b>tính hai mặt<\/b> (tài sản – nguồn vốn), độc lập và cân bằng về giá trị; vận động theo quá trình và chu kỳ hoạt động; đa dạng về nội dung, hình thái; gắn liền với lợi ích kinh tế, quyền và nghĩa vụ của các chủ thể.<\/p>\n<p><b>Các phương pháp kế toán<\/b> (liên hệ chặt chẽ): <b>chứng từ kế toán<\/b>, <b>kiểm kê<\/b>, <b>tính giá<\/b>, <b>tài khoản kế toán<\/b>, <b>ghi sổ kép<\/b>, <b>tổng hợp và cân đối kế toán<\/b> (lập báo cáo).<\/p>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 50–52"},{"id":"ch1-t10","title":"Quy định về công tác kế toán: đơn vị kế toán, đơn vị tính, kỳ kế toán","core":"<ul><li><b>Đơn vị kế toán<\/b>: tổ chức <b>độc lập với chủ sở hữu<\/b> và tổ chức khác; tự chủ, tự chịu trách nhiệm về tài sản, nguồn vốn, kết quả kinh doanh, nghĩa vụ tài chính; là nơi kiểm soát tài sản và lập BCTC. Khái niệm căn bản nhất vì xác định <b>ranh giới<\/b> kế toán: chỉ ghi nhận nghiệp vụ của đơn vị, <b>không ghi<\/b> giao dịch riêng của chủ sở hữu hay đơn vị khác.<\/li>\n<li><b>Đơn vị tính<\/b>: tiền tệ là <b>Đồng Việt Nam<\/b> (đ, VND) – thước đo thống nhất giúp tổng hợp, so sánh giữa các kỳ và doanh nghiệp. BCTC lập bằng ngoại tệ khi chuyển sang VND theo TT 99/2025/TT-BTC. Đơn vị khác: hiện vật (kg, tấn, m²…), thời gian lao động (giờ công, ngày công).<\/li>\n<li><b>Kỳ kế toán<\/b>: khoảng thời gian từ khi bắt đầu ghi sổ đến khi khóa sổ để lập BCTC; phải ngắn hơn thời gian tồn tại của tổ chức; thường <b>12 tháng<\/b> = niên độ kế toán.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 53–55"},{"id":"ch1-t11","title":"Yêu cầu đối với thông tin kế toán","core":"<p><b>6 yêu cầu<\/b> (thông tin, số liệu kế toán):<\/p>\n<ul><li><b>Trung thực<\/b>: dựa trên bằng chứng đầy đủ, khách quan, đúng hiện trạng, bản chất và giá trị nghiệp vụ.<\/li>\n<li><b>Khách quan<\/b>: ghi chép, báo cáo đúng thực tế, <b>không xuyên tạc, bóp méo<\/b>.<\/li>\n<li><b>Đầy đủ<\/b>: mọi nghiệp vụ của kỳ kế toán đều được ghi chép, báo cáo, <b>không bỏ sót<\/b>.<\/li>\n<li><b>Kịp thời<\/b>: ghi chép, báo cáo đúng hoặc trước thời hạn, không chậm trễ.<\/li>\n<li><b>Dễ hiểu<\/b>: trình bày trong BCTC rõ ràng, dễ hiểu với người dùng.<\/li>\n<li><b>Có thể so sánh<\/b>: giữa các kỳ và giữa các doanh nghiệp khi tính toán và trình bày <b>nhất quán<\/b>.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 56–59; bài tập LMS chương 1"},{"id":"ch1-t12","title":"Các nguyên tắc kế toán cơ bản (VAS 01)","core":"<p><b>7 nguyên tắc<\/b>: cơ sở dồn tích, hoạt động liên tục, giá gốc, phù hợp, nhất quán, thận trọng, trọng yếu.<\/p>\n<ul><li><b>Cơ sở dồn tích<\/b>: ghi sổ tài sản, nợ phải trả, VCSH, doanh thu, chi phí <b>vào thời điểm phát sinh<\/b>, không căn cứ lúc thu/chi tiền. VD: giao hàng ngày 15/3, thu tiền 15/4 → doanh thu ghi nhận 15/3.<\/li>\n<li><b>Hoạt động liên tục<\/b>: BCTC lập với giả định DN đang và sẽ tiếp tục hoạt động bình thường trong tương lai gần; ảnh hưởng định giá tài sản, là cơ sở tính khấu hao TSCĐ.<\/li>\n<li><b>Giá gốc<\/b>: tài sản ghi theo số tiền/tương đương tiền đã trả, phải trả hoặc giá trị hợp lý tại thời điểm ghi nhận; không thay đổi trừ khi chuẩn mực quy định. Giá gốc = giá mua thực tế + chi phí trực tiếp đưa tài sản đến trạng thái sẵn sàng sử dụng (bảo hiểm 1 năm, nhiên liệu tháng đầu không tính).<\/li>\n<li><b>Phù hợp<\/b>: ghi nhận doanh thu thì ghi nhận chi phí tương ứng tạo ra doanh thu đó cùng kỳ; cơ sở xác định đúng lợi nhuận. VD: mua 100 SP giá 500 tr, bán 20 → giá vốn 100 tr; 80 SP còn lại 400 tr là hàng tồn kho. Chi phí trả trước nhiều kỳ phải phân bổ.<\/li>\n<li><b>Nhất quán<\/b>: chính sách, phương pháp đã chọn áp dụng thống nhất <b>ít nhất một kỳ kế toán năm<\/b>; thay đổi phải giải trình lý do và ảnh hưởng trong thuyết minh BCTC.<\/li>\n<li><b>Thận trọng<\/b>: lập dự phòng nhưng không quá lớn; <b>không đánh giá cao<\/b> hơn tài sản và thu nhập; <b>không đánh giá thấp<\/b> hơn nợ phải trả và chi phí; doanh thu, thu nhập chỉ ghi khi có bằng chứng chắc chắn; chi phí ghi khi có khả năng phát sinh.<\/li>\n<li><b>Trọng yếu<\/b>: thông tin mà thiếu hoặc sai có thể ảnh hưởng đáng kể đến quyết định của người dùng; phụ thuộc <b>độ lớn và tính chất<\/b> trong hoàn cảnh cụ thể, không có mức tiền cố định chung. VD: bỏ sót khoản vay 5 tỷ trên tổng tài sản 100 tỷ là trọng yếu.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Yêu cầu kế toán<\/th><th>Nguyên tắc kế toán<\/th><\/tr><\/thead><tbody>\n<tr><td>Số lượng<\/td><td>6: trung thực, khách quan, đầy đủ, kịp thời, dễ hiểu, có thể so sánh<\/td><td>7: dồn tích, hoạt động liên tục, giá gốc, phù hợp, nhất quán, thận trọng, trọng yếu<\/td><\/tr>\n<tr><td>Nội dung<\/td><td>Chất lượng mà thông tin phải đạt<\/td><td>Cách ghi nhận, đo lường, trình bày<\/td><\/tr>\n<tr><td>Nhầm lẫn thường gặp<\/td><td>Trung thực, khách quan, đầy đủ <b>không<\/b> phải nguyên tắc<\/td><td>Thận trọng, trọng yếu, nhất quán <b>không<\/b> phải yêu cầu<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Dễ nhầm<\/th><th>Khác nhau<\/th><\/tr><\/thead><tbody>\n<tr><td>Phù hợp vs Dồn tích<\/td><td>Dồn tích: <b>khi nào<\/b> ghi nhận (lúc phát sinh); Phù hợp: <b>chi phí đi cùng doanh thu<\/b> cùng kỳ<\/td><\/tr>\n<tr><td>Thận trọng vs Trọng yếu<\/td><td>Thận trọng: không phóng đại tài sản/thu nhập, không giảm nợ/chi phí; Trọng yếu: thông tin ảnh hưởng quyết định người dùng<\/td><\/tr>\n<tr><td>Nhất quán (nguyên tắc) vs So sánh được (yêu cầu)<\/td><td>Nhất quán: DN giữ nguyên phương pháp; So sánh được: là kết quả/yêu cầu của thông tin<\/td><\/tr>\n<tr><td>Trung thực vs Khách quan<\/td><td>Trung thực: có bằng chứng, đúng bản chất; Khách quan: không xuyên tạc, bóp méo<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 1, slide 60–72; bài tập LMS chương 1"},{"id":"ch1-t13","title":"Môi trường pháp lý kế toán Việt Nam","core":"<p>Gồm: <b>Luật Kế toán<\/b>, <b>hệ thống chuẩn mực kế toán<\/b>, <b>chế độ kế toán<\/b>, <b>đạo đức nghề nghiệp<\/b>.<\/p>\n<ul><li>Luật Kế toán số <b>88/2015/QH13<\/b> – do Quốc hội ban hành, giá trị pháp lý <b>cao nhất<\/b>.<\/li>\n<li>Chuẩn mực kế toán Việt Nam (VAS): <b>26<\/b> chuẩn mực.<\/li>\n<li>Chế độ kế toán (slide nêu): TT 99/2025/TT-BTC (27/10/2025), TT 133/2016/TT-BTC, TT 45/2018, TT 48/2019…<\/li><\/ul>\n<p>Thứ bậc: Luật &gt; chuẩn mực &gt; chế độ kế toán &gt; quy định nghề nghiệp.<\/p>","formulas":null,"compare":null,"source":"Slide Chương 1, slide 73–74; bài tập LMS chương 1"}],"flashcards":[{"id":"ch1-f01","topic":"ch1-t01","front":"Ai là “cha đẻ của kế toán hiện đại”? Ông có phát minh ra kế toán kép không?","back":"Luca Pacioli (1494). Không phát minh, nhưng đã mô tả, hệ thống hóa và phổ biến ghi sổ kép."},{"id":"ch1-f02","topic":"ch1-t01","front":"Ghi sổ đơn khác ghi sổ kép thế nào?","back":"Đơn: mỗi nghiệp vụ ghi một lần. Kép: ghi hai mặt Nợ – Có, kiểm tra được tính cân đối."},{"id":"ch1-f03","topic":"ch1-t01","front":"Cách mạng công nghiệp làm kế toán tách thành những nhánh nào?","back":"Kế toán tài chính, kế toán chi phí (giá thành), kế toán quản trị."},{"id":"ch1-f04","topic":"ch1-t02","front":"Định nghĩa kế toán theo Luật Kế toán 2015?","back":"Thu thập, xử lý, kiểm tra, phân tích và cung cấp thông tin kinh tế, tài chính dưới hình thức giá trị, hiện vật và thời gian lao động."},{"id":"ch1-f05","topic":"ch1-t02","front":"Kế toán dùng những thước đo nào? Thước đo thống nhất?","back":"Giá trị (tiền tệ), hiện vật, thời gian lao động. Thống nhất: tiền tệ."},{"id":"ch1-f06","topic":"ch1-t02","front":"Việc nào KHÔNG thuộc công việc của kế toán?","back":"Quyết định phương án đầu tư, trực tiếp điều hành SXKD (việc của nhà quản trị)."},{"id":"ch1-f07","topic":"ch1-t03","front":"Kế toán tài chính phục vụ ai, kế toán quản trị phục vụ ai?","back":"KTTC: chủ yếu bên ngoài, qua BCTC. KTQT: nhà quản trị nội bộ."},{"id":"ch1-f08","topic":"ch1-t03","front":"KTTC hay KTQT: phản ánh chủ yếu quá khứ, bắt buộc tuân thủ chuẩn mực?","back":"KTTC. KTQT linh hoạt, gồm cả dự báo tương lai, dùng số ước tính."},{"id":"ch1-f09","topic":"ch1-t03","front":"Ba cách phân loại kế toán trong slide?","back":"Theo đối tượng sử dụng (tài chính, quản trị, thuế); theo lĩnh vực (DN, công, đặc thù); theo mức độ khái quát (tổng hợp, chi tiết)."},{"id":"ch1-f10","topic":"ch1-t04","front":"Hai chức năng cơ bản của kế toán?","back":"Cung cấp thông tin; kiểm tra, giám sát."},{"id":"ch1-f11","topic":"ch1-t05","front":"Đối tượng của kế toán là gì?","back":"Quá trình SXKD thông qua sự hình thành và vận động của tài sản trong đơn vị (tài sản, nguồn vốn, tình hình kinh doanh)."},{"id":"ch1-f12","topic":"ch1-t05","front":"3 điều kiện để là tài sản?","back":"Do đơn vị kiểm soát; hình thành từ giao dịch quá khứ; có khả năng mang lại lợi ích kinh tế tương lai."},{"id":"ch1-f13","topic":"ch1-t05","front":"Tài sản ngắn hạn là gì?","back":"Dự kiến thu hồi, bán, sử dụng trong 1 chu kỳ kinh doanh bình thường hoặc ≤ 12 tháng kể từ ngày kết thúc kỳ kế toán."},{"id":"ch1-f14","topic":"ch1-t05","front":"Tạm ứng, trả trước cho người bán, chi phí trả trước, hàng gửi đi bán thuộc loại nào?","back":"Đều là tài sản (quyền nhận lợi ích, vẫn thuộc kiểm soát của DN)."},{"id":"ch1-f15","topic":"ch1-t06","front":"Nợ phải trả là gì?","back":"Nghĩa vụ hiện tại từ giao dịch quá khứ mà DN phải dùng nguồn lực để thanh toán."},{"id":"ch1-f16","topic":"ch1-t06","front":"Vốn chủ sở hữu là gì, có phải cam kết thanh toán không?","back":"Giá trị còn lại của tài sản sau khi trừ nợ phải trả; DN không cam kết thanh toán."},{"id":"ch1-f17","topic":"ch1-t06","front":"Tài sản trả lời câu hỏi gì? Nguồn vốn trả lời câu hỏi gì?","back":"Tài sản: DN có gì. Nguồn vốn: tài sản hình thành từ đâu."},{"id":"ch1-f18","topic":"ch1-t06","front":"Phải thu khách hàng; phải trả người bán; vay ngân hàng; vốn góp: loại nào?","back":"Phải thu KH: tài sản. Phải trả người bán, vay NH: nợ phải trả. Vốn góp: vốn CSH."},{"id":"ch1-f19","topic":"ch1-t06","front":"Theo slide, tài sản thừa chờ xử lý và tài sản thiếu chờ xử lý xếp ở đâu?","back":"Thừa chờ xử lý: nguồn vốn. Thiếu chờ xử lý: tài sản."},{"id":"ch1-f20","topic":"ch1-t06","front":"Vốn chủ sở hữu gồm những khoản nào?","back":"Vốn đầu tư của CSH, LNST chưa phân phối, chênh lệch đánh giá lại tài sản, chênh lệch tỷ giá, quỹ đầu tư phát triển, các quỹ khác."},{"id":"ch1-f21","topic":"ch1-t07","front":"Phương trình kế toán cơ bản?","back":"Tài sản = Nợ phải trả + Vốn chủ sở hữu."},{"id":"ch1-f22","topic":"ch1-t07","front":"Công thức tính vốn chủ sở hữu?","back":"Vốn CSH = Tài sản − Nợ phải trả."},{"id":"ch1-f23","topic":"ch1-t07","front":"Mua máy 300 tr chưa trả tiền: ảnh hưởng thế nào?","back":"Tài sản +300, nợ phải trả +300; VCSH không đổi; tổng TS và NV cùng tăng 300."},{"id":"ch1-f24","topic":"ch1-t07","front":"Các dạng ảnh hưởng của nghiệp vụ đến phương trình kế toán?","back":"TS tăng–TS giảm; NV tăng–NV giảm; TS và NV cùng tăng; TS và NV cùng giảm. Luôn cân bằng."},{"id":"ch1-f25","topic":"ch1-t07","front":"Chu kỳ vận động của tài sản trong sản xuất, thương mại, tài chính?","back":"Sản xuất: T–H…SX…H’–T’; thương mại: T–H–T’; tài chính: T–T’."},{"id":"ch1-f26","topic":"ch1-t08","front":"Công thức kết quả hoạt động kinh doanh?","back":"Doanh thu và thu nhập khác − Chi phí."},{"id":"ch1-f27","topic":"ch1-t08","front":"Doanh thu khác thu nhập khác ở điểm nào?","back":"Doanh thu: hoạt động kinh doanh thông thường (bán hàng, dịch vụ, tài chính). Thu nhập khác: ngoài hoạt động tạo ra doanh thu (thanh lý TSCĐ, thu phạt)."},{"id":"ch1-f28","topic":"ch1-t08","front":"Doanh thu, chi phí tác động đến vốn CSH thế nào?","back":"Doanh thu, thu nhập làm tăng VCSH; chi phí làm giảm VCSH (không tính vốn góp và phân phối cho CSH)."},{"id":"ch1-f29","topic":"ch1-t09","front":"Các phương pháp kế toán?","back":"Chứng từ, kiểm kê, tính giá, tài khoản, ghi sổ kép, tổng hợp và cân đối kế toán."},{"id":"ch1-f30","topic":"ch1-t09","front":"Bốn đặc điểm của đối tượng kế toán?","back":"Hai mặt, độc lập, cân bằng giá trị; vận động theo chu kỳ; đa dạng nội dung, hình thái; gắn với lợi ích, quyền và nghĩa vụ."},{"id":"ch1-f31","topic":"ch1-t10","front":"Vì sao đơn vị kế toán là khái niệm căn bản nhất?","back":"Xác định ranh giới kế toán: chỉ ghi nghiệp vụ của đơn vị, không ghi giao dịch riêng của chủ sở hữu hay đơn vị khác."},{"id":"ch1-f32","topic":"ch1-t10","front":"Đơn vị tiền tệ dùng trong kế toán? Kỳ kế toán thường bao lâu?","back":"Đồng Việt Nam (VND). Kỳ kế toán thường 12 tháng (niên độ), phải ngắn hơn thời gian tồn tại của tổ chức."},{"id":"ch1-f33","topic":"ch1-t11","front":"Sáu yêu cầu đối với thông tin kế toán?","back":"Trung thực, khách quan, đầy đủ, kịp thời, dễ hiểu, có thể so sánh."},{"id":"ch1-f34","topic":"ch1-t11","front":"Ghi chép đúng thực tế, không xuyên tạc, bóp méo là yêu cầu nào?","back":"Khách quan."},{"id":"ch1-f35","topic":"ch1-t12","front":"Bảy nguyên tắc kế toán (VAS 01)?","back":"Dồn tích, hoạt động liên tục, giá gốc, phù hợp, nhất quán, thận trọng, trọng yếu."},{"id":"ch1-f36","topic":"ch1-t12","front":"Nguyên tắc cơ sở dồn tích?","back":"Ghi sổ khi nghiệp vụ phát sinh, không căn cứ thời điểm thực thu, thực chi tiền."},{"id":"ch1-f37","topic":"ch1-t12","front":"Giá gốc của tài sản gồm gì?","back":"Giá mua thực tế + chi phí trực tiếp đưa tài sản đến trạng thái sẵn sàng sử dụng; không đổi trừ khi chuẩn mực quy định."},{"id":"ch1-f38","topic":"ch1-t12","front":"Nguyên tắc phù hợp là gì? Giá vốn 20 SP bán trong 100 SP mua giá 500 tr?","back":"Ghi nhận doanh thu thì ghi chi phí tương ứng cùng kỳ. Giá vốn = 20 × 5 = 100 tr; 80 SP còn lại (400 tr) là hàng tồn kho."},{"id":"ch1-f39","topic":"ch1-t12","front":"Nội dung nguyên tắc thận trọng?","back":"Lập dự phòng không quá lớn; không đánh giá cao TS và thu nhập; không đánh giá thấp nợ phải trả và chi phí."},{"id":"ch1-f40","topic":"ch1-t12","front":"Nguyên tắc nhất quán?","back":"Áp dụng thống nhất chính sách, phương pháp đã chọn ít nhất một kỳ kế toán năm; thay đổi phải giải trình trong thuyết minh BCTC."},{"id":"ch1-f41","topic":"ch1-t12","front":"Thông tin như thế nào là trọng yếu?","back":"Thiếu hoặc sai có thể làm sai lệch đáng kể quyết định của người dùng; phụ thuộc độ lớn và tính chất, không có mức tiền cố định."},{"id":"ch1-f42","topic":"ch1-t12","front":"Trung thực, khách quan, đầy đủ là nguyên tắc hay yêu cầu?","back":"Là yêu cầu (6 yêu cầu), không thuộc 7 nguyên tắc."},{"id":"ch1-f43","topic":"ch1-t13","front":"Văn bản pháp lý nào cao nhất trong kế toán VN? Số chuẩn mực VAS?","back":"Luật Kế toán 88/2015/QH13; VAS có 26 chuẩn mực."}],"notes":"<ul><li>Slide ghi nhận <b>7 nguyên tắc<\/b> theo VAS 01 và <b>6 yêu cầu<\/b>; một số giáo trình khác chia khác (vd thêm “yêu cầu: thận trọng/trọng yếu”). Ưu tiên theo slide.<\/li>\n<li>Slide xếp <b>tài sản thừa chờ xử lý<\/b> vào nguồn vốn, <b>tài sản thiếu chờ xử lý<\/b> vào tài sản (chỉ theo ví dụ slide 37–38).<\/li>\n<li>Slide nêu “VAS: 26 chuẩn mực” và TT 99/2025/TT-BTC làm chế độ kế toán; hiệu lực áp dụng và quan hệ với TT 200/2014, TT 133/2016 cần hỏi giảng viên nếu đề kiểm tra hỏi cụ thể.<\/li>\n<li>Chương 1 không có công thức tài chính ngoài phương trình kế toán và kết quả kinh doanh.<\/li><\/ul>","fx":{"items":[{"id":"ch1-f-01","name":"Phương trình kế toán cơ bản","topic":"ch1-t07","formula":"<div class=\"formula\">Tổng tài sản = Tổng nguồn vốn<\/div><div class=\"formula\">Tổng nguồn vốn = Nợ phải trả + Vốn chủ sở hữu<\/div><div class=\"formula\">Tổng tài sản = Nợ phải trả + Vốn chủ sở hữu<\/div>","parts":"<ul><li><b>Tài sản<\/b>: nguồn lực đơn vị kiểm soát (đv: tiền)<\/li><li><b>Nợ phải trả<\/b>: nghĩa vụ phải thanh toán<\/li><li><b>Vốn chủ sở hữu (VCSH)<\/b>: phần còn lại của chủ sở hữu<\/li><\/ul>","example":"<p>VD: Nợ phải trả 200, VCSH 300 thì Tổng tài sản = 200 + 300 = 500 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 36"},{"id":"ch1-f-02","name":"Vốn chủ sở hữu","topic":"ch1-t06","formula":"<div class=\"formula\">Vốn CSH = Tổng tài sản − Nợ phải trả<\/div>","parts":"<ul><li><b>Tổng tài sản<\/b>: tổng giá trị tài sản<\/li><li><b>Nợ phải trả<\/b>: tổng nợ<\/li><li><b>Vốn CSH<\/b>: giá trị tài sản ròng của chủ sở hữu<\/li><\/ul>","example":"<p>VD: Tổng tài sản 500, Nợ phải trả 200 thì Vốn CSH = 500 − 200 = 300 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 36"},{"id":"ch1-f-03","name":"Nợ phải trả (suy từ phương trình)","topic":"ch1-t07","formula":"<div class=\"formula\">Nợ phải trả = Tổng tài sản − Vốn CSH<\/div>","parts":"<ul><li><b>Tổng tài sản<\/b>, <b>Vốn CSH<\/b>: như trên<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span> Biến đổi từ phương trình kế toán.<\/p>","example":"<p>VD: Tổng tài sản 500, Vốn CSH 300 thì Nợ phải trả = 500 − 300 = 200 (triệu đồng).<\/p>","source":"Bổ sung: biến đổi từ slide 36"},{"id":"ch1-f-04","name":"Kết quả hoạt động kinh doanh","topic":"ch1-t08","formula":"<div class=\"formula\">Kết quả HĐKD (lãi/lỗ) = Doanh thu và thu nhập khác − Chi phí<\/div>","parts":"<ul><li><b>Doanh thu và thu nhập khác<\/b>: lợi ích kinh tế thu được trong kỳ, làm tăng VCSH (đv: tiền)<\/li><li><b>Chi phí<\/b>: các khoản làm giảm lợi ích kinh tế trong kỳ, làm giảm VCSH<\/li><li>Kết quả dương là lãi, âm là lỗ<\/li><\/ul>","example":"<p>VD: Doanh thu và thu nhập khác 900, chi phí 750 thì lãi = 900 − 750 = 150 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 39"},{"id":"ch1-f-05","name":"Biến động của phương trình sau nghiệp vụ","topic":"ch1-t07","formula":"<div class=\"formula\">ΔTổng tài sản = ΔNợ phải trả + ΔVốn CSH<\/div>","parts":"<ul><li>Nghiệp vụ chỉ đổi chỗ giữa các tài sản (hoặc giữa các nguồn vốn): tổng không đổi<\/li><li>Tài sản và nguồn vốn cùng tăng hoặc cùng giảm một giá trị<\/li><li>Δ: lượng thay đổi (tăng +, giảm −); phương trình luôn cân bằng<\/li><\/ul>","example":"<p>VD: Bán chịu 45, giá vốn 30: ΔTS = +45 − 30 = +15 = ΔVCSH (lợi nhuận) +15 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 48–49"},{"id":"ch1-f-06","name":"Vốn CSH cuối kỳ (mở rộng)","topic":"ch1-t08","formula":"<div class=\"formula\">Vốn CSH cuối kỳ = Vốn CSH đầu kỳ + Vốn góp thêm + Lợi nhuận kỳ − Phân phối cho chủ sở hữu<\/div>","parts":"<ul><li><b>Lợi nhuận kỳ<\/b> = Doanh thu và thu nhập khác − Chi phí<\/li><li><b>Vốn góp thêm<\/b>, <b>Phân phối<\/b>: không tính vào doanh thu/chi phí (slide 40, 42)<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span><\/p>","example":"<p>VD: VCSH đầu kỳ 300, góp thêm 100, lợi nhuận 50, chia cho chủ sở hữu 20 thì VCSH cuối kỳ = 300 + 100 + 50 − 20 = 430 (triệu đồng).<\/p>","source":"Bổ sung: suy ra từ slide 39–42"},{"id":"ch1-f-07","name":"Nguyên tắc giá gốc","topic":"ch1-t12","formula":"<div class=\"formula\">Giá gốc = Giá mua thực tế + Chi phí trực tiếp để đưa tài sản đến trạng thái sẵn sàng sử dụng<\/div>","parts":"<ul><li><b>Giá mua thực tế<\/b>: giá thực trả (đv: tiền)<\/li><li><b>Chi phí trực tiếp<\/b>: vận chuyển, lắp đặt, chạy thử…; không gồm chi phí phát sinh trong quá trình sử dụng<\/li><\/ul>","example":"<p>VD: Giá mua 800, vận chuyển 20, lắp đặt 5 thì giá gốc = 800 + 20 + 5 = 825 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 65"},{"id":"ch1-f-08","name":"Giá vốn đơn vị và nguyên tắc phù hợp","topic":"ch1-t12","formula":"<div class=\"formula\">Giá vốn đơn vị = Tổng giá vốn ÷ Số lượng<\/div><div class=\"formula\">Giá vốn hàng bán = Giá vốn đơn vị × Số lượng bán<\/div><div class=\"formula\">Lợi nhuận gộp = Doanh thu − Giá vốn hàng bán<\/div>","parts":"<ul><li>Doanh thu nào phải ghi nhận chi phí (giá vốn) tương ứng với doanh thu đó<\/li><li>Phần chưa bán vẫn là hàng tồn kho = Giá vốn đơn vị × Số lượng còn lại<\/li><\/ul>","example":"<p>VD: Mua 100 sản phẩm giá 500: giá vốn đơn vị = 5; bán 20 sản phẩm thì giá vốn = 20 × 5 = 100; doanh thu 180 thì lãi gộp = 180 − 100 = 80; tồn kho = 80 × 5 = 400 (triệu đồng).<\/p>","source":"Slide Chương 1, slide 66–67"}],"note":null}},"ch2":{"chapter":"ch2","title":"Chương 2 – Tổng quan về báo cáo tài chính","topics":[{"id":"ch2-t01","title":"Khái niệm, mục đích và yêu cầu thông tin của BCTC","core":"<ul>\n<li><b>BCTC<\/b> là hệ thống thông tin kinh tế, tài chính của đơn vị kế toán, trình bày theo <b>biểu mẫu quy định tại chuẩn mực kế toán và chế độ kế toán<\/b> (Điều 3 Luật Kế toán 2015). <span class=\"tag\">Slide<\/span><\/li>\n<li>BCTC cung cấp thông tin về: <b>tài sản; nợ phải trả; vốn chủ sở hữu; doanh thu, thu nhập khác, chi phí; lãi, lỗ và phân chia kết quả kinh doanh; các luồng tiền<\/b>.<\/li>\n<li><b>Mục đích<\/b>: cung cấp thông tin về tình hình tài chính, tình hình kinh doanh và các luồng tiền, đáp ứng yêu cầu quản lý của chủ DN, cơ quan nhà nước và người sử dụng khác để ra quyết định kinh tế.<\/li>\n<li><b>Yêu cầu thông tin<\/b>: trung thực, hợp lý, đầy đủ, khách quan, không sai sót; thích hợp (giúp dự đoán, phân tích); đầy đủ mọi khía cạnh <b>trọng yếu<\/b>; <b>kiểm chứng được, kịp thời, dễ hiểu<\/b>; <b>nhất quán, có thể so sánh<\/b> giữa các kỳ và giữa các DN.<\/li>\n<li>Không thuộc BCTC: phân loại chi phí thành định phí/biến phí (kế toán quản trị). <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":null,"compare":null,"source":"Slide Chương 2, slide 6–9; bank lms-ch2 Câu 1, 2, 5, 38"},{"id":"ch2-t02","title":"Nguyên tắc lập và trình bày BCTC","core":"<ul>\n<li>Tuân thủ <b>VAS 21 – Trình bày BCTC<\/b> và các chuẩn mực liên quan; thông tin trọng yếu phải được giải trình. Được <b>bổ sung<\/b> chỉ tiêu cho phù hợp; nếu cần sửa/không thể bổ sung → báo cáo Bộ Tài chính.<\/li>\n<li><b>Bản chất hơn hình thức<\/b>: phản ánh đúng bản chất kinh tế của giao dịch, không chỉ hình thức pháp lý.<\/li>\n<li><b>Thận trọng<\/b>: tài sản <b>không ghi cao hơn<\/b> giá trị có thể thu hồi; nợ phải trả <b>không ghi thấp hơn<\/b> nghĩa vụ phải thanh toán.<\/li>\n<li>Tài sản và nợ phải trả <b>trình bày riêng biệt, không bù trừ<\/b>; chỉ bù trừ khi cùng một đối tượng, vòng quay nhanh, đáo hạn ngắn, giao dịch cùng loại.<\/li>\n<li><b>Phù hợp<\/b>: doanh thu, thu nhập và chi phí liên quan trực tiếp phải trình bày tương ứng; phát hiện sai sót trọng yếu kỳ trước → <b>điều chỉnh hồi tố<\/b>.<\/li>\n<li>DN có đơn vị trực thuộc: <b>tổng hợp<\/b> số liệu trụ sở và đơn vị trực thuộc, <b>loại trừ<\/b> số dư, doanh thu, chi phí, lãi lỗ nội bộ.<\/li>\n<li>Lập trên cơ sở <b>hoạt động liên tục<\/b> (giả định DN tiếp tục hoạt động bình thường); cơ sở <b>dồn tích<\/b>. <span class=\"tag ext\">Bổ sung<\/span> (VAS 21, VAS 01)<\/li>\n<li>Chính sách kế toán đã chọn phải áp dụng <b>nhất quán<\/b> ít nhất một kỳ kế toán năm; thay đổi phải giải trình. <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":null,"compare":null,"source":"Slide Chương 2, slide 10–12, 22–24; (kiến thức bổ sung: VAS 21, VAS 01, TT200); bank lms-ch2 Câu 3, 4; other-de1 Câu 35"},{"id":"ch2-t03","title":"Phân loại ngắn hạn – dài hạn","core":"<ul>\n<li>Tài sản và nợ phải trả phải trình bày riêng thành <b>ngắn hạn<\/b> và <b>dài hạn<\/b>; <b>tài sản<\/b> xếp theo <b>tính thanh khoản giảm dần<\/b>, <b>nợ phải trả<\/b> xếp theo <b>thứ tự ưu tiên chi trả giảm dần<\/b>.<\/li>\n<li><b>Mốc phân loại<\/b>: thu hồi/thanh toán trong <b>≤ 12 tháng<\/b> kể từ ngày kết thúc kỳ kế toán, hoặc trong <b>một chu kỳ kinh doanh thông thường<\/b> → <b>ngắn hạn<\/b>; còn lại → <b>dài hạn<\/b>.<\/li>\n<li><b>Tài sản ngắn hạn<\/b> khi: dự kiến thu hồi/bán/sử dụng trong chu kỳ kinh doanh thông thường; nắm giữ chủ yếu cho mục đích thương mại; dự kiến thu hồi ≤ 12 tháng; hoặc là tiền/tương đương tiền (trừ khi bị hạn chế sử dụng &gt; 12 tháng).<\/li>\n<li><b>Nợ ngắn hạn<\/b> khi: dự kiến thanh toán trong chu kỳ kinh doanh thông thường; nắm giữ vì mục đích kinh doanh; đến hạn ≤ 12 tháng; hoặc DN không có quyền từ chối thanh toán trong ≤ 12 tháng.<\/li>\n<li>Nợ thuộc vốn lưu động (phải trả người bán, chi phí phải trả...) → <b>luôn ngắn hạn<\/b> dù hạn trả &gt; 12 tháng.<\/li>\n<li>Chu kỳ kinh doanh không xác định rõ → coi là <b>12 tháng<\/b>. Cuối kỳ phải <b>tái phân loại<\/b> dài hạn kỳ trước thành ngắn hạn nếu đã thỏa điều kiện ngắn hạn.<\/li>\n<li>Sự kiện sau ngày kết thúc kỳ kế toán (gia hạn nợ ngắn thành dài hạn, khắc phục vi phạm...) <b>không điều chỉnh<\/b> báo cáo nhưng phải <b>thuyết minh<\/b>.<\/li>\n<li>Chứng khoán đáo hạn/thu hồi <b>không quá 3 tháng<\/b> → <b>tương đương tiền<\/b>.<\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Ví dụ (chu kỳ 12 tháng)<\/th><th>Phân loại<\/th><\/tr><\/thead><tbody>\n<tr><td>Khoản phải thu thu hồi sau 8 tháng<\/td><td>Tài sản <b>ngắn hạn<\/b><\/td><\/tr>\n<tr><td>Khoản vay phải trả sau 18 tháng<\/td><td>Nợ phải trả <b>dài hạn<\/b><\/td><\/tr>\n<tr><td>Hàng tồn kho (NVL, CCDC, SPDD, thành phẩm, hàng hóa)<\/td><td>Tài sản ngắn hạn<\/td><\/tr>\n<tr><td>TSCĐ hữu hình/vô hình/thuê tài chính, đầu tư tài chính dài hạn<\/td><td>Tài sản dài hạn<\/td><\/tr>\n<tr><td>Chi phí trả trước (TK 242)<\/td><td>Ngắn hạn hoặc dài hạn tùy thời gian phân bổ<\/td><\/tr>\n<tr><td>Chứng khoán đáo hạn ≤ 3 tháng<\/td><td>Tương đương tiền (TS ngắn hạn)<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 2, slide 13–21, 36; bank lms-ch2 Câu 15, 51–54, 64; other-de1 Câu 32–33"},{"id":"ch2-t04","title":"Kỳ lập, thời hạn nộp và hệ thống BCTC","core":"<ul>\n<li><b>Kỳ lập<\/b>: BCTC <b>năm<\/b> (bắt buộc); BCTC <b>giữa niên độ<\/b> gồm BCTC quý (kể cả quý IV) và bán niên (6 tháng); kỳ khác.<\/li>\n<li><b>Kỳ kế toán năm<\/b>: 12 tháng, từ 01/01 đến 31/12 dương lịch (đơn vị đặc thù được chọn 12 tháng tròn sau khi thông báo cơ quan thuế). <span class=\"tag ext\">Bổ sung<\/span> (Luật KT 2015, Điều 12)<\/li>\n<li><b>Thời hạn nộp BCTC năm<\/b>: chậm nhất <b>90 ngày<\/b> kể từ ngày kết thúc kỳ kế toán năm. Công ty mẹ/tổng công ty quy định hạn nộp của đơn vị con/trực thuộc.<\/li>\n<li><b>Nơi nhận<\/b>: DN Nhà nước (quý, năm) và DN có vốn đầu tư nước ngoài (năm): cơ quan tài chính, thuế, thống kê, DN cấp trên, đăng ký kinh doanh (theo bảng slide 27); các DN khác (năm): không có DN cấp trên.<\/li>\n<li><b>BCTC năm gồm 4 báo cáo<\/b>: <ul>\n<li><b>B 01 – DN<\/b>: Báo cáo tình hình tài chính<\/li>\n<li><b>B 02 – DN<\/b>: Báo cáo kết quả hoạt động kinh doanh<\/li>\n<li><b>B 03 – DN<\/b>: Báo cáo lưu chuyển tiền tệ<\/li>\n<li><b>B 09 – DN<\/b>: Bản thuyết minh BCTC<\/li><\/ul><\/li>\n<li>BCTC giữa niên độ: dạng <b>đầy đủ<\/b> hoặc <b>tóm lược<\/b>.<\/li>\n<li><b>Chuẩn bị trước khi lập<\/b>: kiểm tra và hoàn tất ghi sổ; <b>kiểm kê<\/b> tài sản theo chế độ; chuẩn bị mẫu biểu.<\/li>\n<\/ul>","formulas":null,"compare":null,"source":"Slide Chương 2, slide 25–27, 29–30; (bổ sung: Luật Kế toán 2015 Điều 12); bank lms-ch2 Câu 6"},{"id":"ch2-t05","title":"Báo cáo tình hình tài chính (BCĐKT) – nội dung, kết cấu, nguyên tắc","core":"<ul>\n<li>Mẫu <b>B 01 – DN<\/b>: BCTC tổng hợp phản ánh <b>giá trị tài sản<\/b> và <b>nguồn hình thành tài sản<\/b> tại <b>một thời điểm<\/b> nhất định (báo cáo <b>tĩnh<\/b>).<\/li>\n<li><b>Nội dung<\/b>: Tài sản và Nguồn vốn (Nợ phải trả + Vốn chủ sở hữu). <b>Kết cấu<\/b>: ngang (2 bên) hoặc dọc (1 bên); có cột Mã số, Thuyết minh, Số cuối năm, Số đầu năm.<\/li>\n<li><b>Ý nghĩa<\/b>: cung cấp thông tin tổng hợp về tài sản, nguồn vốn (cơ cấu tài sản, cơ cấu nguồn vốn, khả năng thanh toán); kiểm tra số liệu kế toán; phân tích hiệu quả SXKD; đánh giá năng lực nhà quản trị.<\/li>\n<li><b>Không<\/b> phản ánh kết quả kinh doanh trong kỳ (thuộc B 02).<\/li>\n<li><b>Nguyên tắc lập<\/b>: không bù trừ phải thu – phải trả; tài sản/nợ trình bày riêng ngắn hạn – dài hạn; tài sản xếp theo thanh khoản giảm dần, nợ xếp theo ưu tiên chi trả giảm dần.<\/li>\n<li><b>Căn cứ<\/b>: báo cáo kỳ trước; sổ kế toán tổng hợp (<b>TK loại 1, 2, 3, 4<\/b>); sổ, thẻ chi tiết, bảng tổng hợp chi tiết.<\/li>\n<li><b>Cột số đầu năm<\/b> = cột <b>số cuối năm<\/b> của báo cáo kỳ trước; <b>cột số cuối kỳ<\/b> = số dư cuối kỳ của TK tổng hợp và TK chi tiết.<\/li>\n<\/ul>","formulas":"<div class=\"formula\">Tổng Tài sản = Tổng Nguồn vốn<\/div>\n<div class=\"formula\">Tài sản = Nợ phải trả + Vốn chủ sở hữu &nbsp;(TS ngắn hạn + TS dài hạn = Nợ phải trả + VCSH)<\/div>\n<p>Vốn chủ sở hữu (hoặc LNST chưa phân phối) chưa biết = Tổng tài sản − Nợ phải trả − các khoản VCSH đã biết. Tài sản ngắn hạn = Tổng tài sản − Tài sản dài hạn.<\/p>","compare":null,"source":"Slide Chương 2, slide 31–37; bank lms-ch2 Câu 7–14, 28–30; other-de1 Câu 26, 28"},{"id":"ch2-t06","title":"Cách ghi số dư tài khoản lên Báo cáo tình hình tài chính","core":"<ul>\n<li>Báo cáo tình hình tài chính lập từ <b>số dư cuối kỳ<\/b> các TK loại 1–4; TK loại 5–9 dùng cho B 02.<\/li>\n<li>TK phản ánh <b>tài sản<\/b>: số dư Nợ → ghi <b>dương<\/b> ở phần Tài sản. TK phản ánh <b>nguồn vốn<\/b>: số dư Có → ghi <b>dương<\/b> ở phần Nguồn vốn.<\/li>\n<li><b>TK điều chỉnh giảm tài sản<\/b> (số dư Có) → ghi <b>âm<\/b> ở phần Tài sản: <b>214<\/b> Hao mòn TSCĐ; <b>229<\/b> Dự phòng tổn thất tài sản (gồm dự phòng giảm giá hàng tồn kho).<\/li>\n<li><b>TK điều chỉnh giảm nguồn vốn<\/b> (số dư Nợ) → ghi <b>âm<\/b> ở phần Nguồn vốn: <b>419<\/b> Cổ phiếu mua lại của chính mình (cổ phiếu quỹ).<\/li>\n<li>TK <b>421, 412, 413<\/b> (lưỡng tính/LNCPP) có số dư <b>Nợ<\/b> → ghi <b>âm<\/b> ở phần Nguồn vốn.<\/li>\n<li><b>TK hỗn hợp 131, 331: không bù trừ<\/b> — tách theo từng số dư (xem bảng).<\/li>\n<li>Ghi sai chiều (vd. hao mòn TSCĐ 200 ghi dương sang nguồn vốn) làm sai chỉ tiêu; cần ghi <b>âm 200 ở phần tài sản<\/b>.<\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tài khoản<\/th><th>Số dư Nợ<\/th><th>Số dư Có<\/th><\/tr><\/thead><tbody>\n<tr><td>Tài sản (111, 112, 152, 156, 211, 241...)<\/td><td>Tài sản, <b>+<\/b><\/td><td>—<\/td><\/tr>\n<tr><td>214, 229 (điều chỉnh giảm TS)<\/td><td>—<\/td><td>Tài sản, <b>âm (−)<\/b><\/td><\/tr>\n<tr><td>Nguồn vốn (311, 341, 411, 414...)<\/td><td>—<\/td><td>Nguồn vốn, <b>+<\/b><\/td><\/tr>\n<tr><td>419, 421, 412, 413<\/td><td>Nguồn vốn, <b>âm (−)<\/b><\/td><td>Nguồn vốn, <b>+<\/b><\/td><\/tr>\n<tr><td><b>131<\/b> Phải thu khách hàng<\/td><td>Phần <b>Tài sản<\/b> (+)<\/td><td>Phần <b>Nguồn vốn<\/b> (+) — như khoản người mua ứng trước<\/td><\/tr>\n<tr><td><b>331<\/b> Phải trả người bán<\/td><td>Phần <b>Tài sản<\/b> (+) — ứng trước cho người bán<\/td><td>Phần <b>Nguồn vốn<\/b> (+)<\/td><\/tr>\n<\/tbody><\/table>\n<p>Ví dụ: <b>333<\/b> Thuế phải nộp, <b>353<\/b> Quỹ khen thưởng phúc lợi → Nợ phải trả; <b>414<\/b> Quỹ đầu tư phát triển → VCSH; <b>242<\/b> Chi phí trả trước, <b>241<\/b> XDCB dở dang → tài sản; <b>221<\/b> Đầu tư vào công ty con → tài sản dài hạn.<\/p>","source":"Slide Chương 2, slide 38–39; (bổ sung: TT200 – TK 353, 414, 242); bank lms-ch2 Câu 17, 18, 27, 35, 50, 53–59; other-mau1 Câu 8"},{"id":"ch2-t07","title":"Sự thay đổi của Báo cáo tình hình tài chính","core":"<p>Mọi nghiệp vụ kinh tế làm thay đổi báo cáo theo <b>4 loại quan hệ đối ứng<\/b>, <b>luôn giữ Tổng TS = Tổng NV<\/b>:<\/p>\n<ol>\n<li>1 loại TS tăng, 1 loại TS giảm cùng giá trị → Σ TS, Σ NV <b>không đổi<\/b>.<\/li>\n<li>1 loại NV tăng, 1 loại NV giảm cùng giá trị → Σ TS, Σ NV <b>không đổi<\/b>.<\/li>\n<li>1 loại TS tăng, 1 loại NV tăng cùng giá trị → Σ TS và Σ NV <b>cùng tăng<\/b>.<\/li>\n<li>1 loại TS giảm, 1 loại NV giảm cùng giá trị → Σ TS và Σ NV <b>cùng giảm<\/b>.<\/li>\n<\/ol>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Loại<\/th><th>Nghiệp vụ mẫu<\/th><th>Định khoản<\/th><\/tr><\/thead><tbody>\n<tr><td>1 (TS↑, TS↓)<\/td><td>Nộp tiền mặt vào ngân hàng<\/td><td>Nợ 112 / Có 111<\/td><\/tr>\n<tr><td>2 (NV↑, NV↓)<\/td><td>Vay ngắn hạn trả nợ người bán; trích LNCPP lập quỹ ĐTPT<\/td><td>Nợ 331 / Có 341; Nợ 421 / Có 414<\/td><\/tr>\n<tr><td>3 (TS↑, NV↑)<\/td><td>Mua NVL/TSCĐ chưa trả tiền; chủ sở hữu góp vốn bằng chuyển khoản; vay mua vật liệu<\/td><td>Nợ 152 / Có 331; Nợ 112 / Có 411; Nợ 152 / Có 341<\/td><\/tr>\n<tr><td>4 (TS↓, NV↓)<\/td><td>Chuyển khoản trả nợ vay ngắn hạn<\/td><td>Nợ 341 / Có 112<\/td><\/tr>\n<\/tbody><\/table>\n<p>Mua hàng 300 trả 50% bằng chuyển khoản: hàng +300, TGNH −150, phải trả +150 → Σ TS tăng 150 (loại 3 kết hợp loại 1).<\/p>","source":"Slide Chương 2, slide 40; bank lms-ch2 Câu 19–26; other-cau2 Ch2 Câu 8, 10; other-mau1 Câu 16, 20"},{"id":"ch2-t08","title":"Báo cáo kết quả hoạt động kinh doanh (B 02 – DN)","core":"<ul>\n<li>BCTC tổng hợp phản ánh <b>tình hình và kết quả hoạt động kinh doanh<\/b> trong <b>một kỳ kế toán<\/b>, chi tiết theo hoạt động chính và hoạt động khác (báo cáo <b>động<\/b>).<\/li>\n<li><b>Kết cấu 3 phần<\/b>: (1) Lãi, lỗ; (2) Tình hình thực hiện nghĩa vụ với Nhà nước; (3) Thuế GTGT được khấu trừ, hoàn lại, giảm, thuế GTGT bán hàng nội địa.<\/li>\n<li><b>Nội dung<\/b>: hoạt động chức năng (HĐ sản xuất kinh doanh: SX/tiêu thụ/dịch vụ hoặc mua bán hàng hóa; <b>hoạt động tài chính<\/b>) và <b>hoạt động khác<\/b>.<\/li>\n<li><b>Ý nghĩa<\/b>: cung cấp thông tin kết quả kinh doanh; nhận biết cơ cấu thu nhập, hiệu quả từng mặt hoạt động; tình hình nghĩa vụ với cơ quan thuế.<\/li>\n<li><b>Căn cứ lập<\/b>: báo cáo năm trước; sổ tổng hợp và chi tiết <b>TK loại 5, 6, 7, 8, 9<\/b>.<\/li>\n<li>Doanh thu theo nguyên tắc <b>phù hợp<\/b>: chỉ ghi giá vốn của hàng <b>đã bán<\/b> (vd. sản xuất 10, bán 8 thì giá vốn tính cho 8). Chi phí SXC, giá thành chưa bán không vào công thức lợi nhuận.<\/li>\n<\/ul>","formulas":"<div class=\"formula\">Doanh thu thuần = Doanh thu bán hàng &amp; CCDV − Các khoản giảm trừ doanh thu<\/div>\n<p>Các khoản giảm trừ = <b>chiết khấu thương mại + giảm giá hàng bán + hàng bán bị trả lại<\/b>.<\/p>\n<div class=\"formula\">Lợi nhuận gộp = Doanh thu thuần − Giá vốn hàng bán<\/div>\n<div class=\"formula\">LN thuần từ HĐKD = LN gộp + Doanh thu hoạt động tài chính − Chi phí tài chính − Chi phí bán hàng − Chi phí QLDN<\/div>\n<p>Tương đương: DT thuần + DT tài chính − <b>Chi phí HĐKD<\/b> (giá vốn + CP tài chính + CP bán hàng + CP QLDN).<\/p>\n<div class=\"formula\">Lợi nhuận khác = Thu nhập khác − Chi phí khác<\/div>\n<div class=\"formula\">Tổng LN kế toán trước thuế = LN thuần từ HĐKD + Lợi nhuận khác<\/div>\n<div class=\"formula\">LN sau thuế TNDN = Tổng LN trước thuế − Chi phí thuế TNDN<\/div>\n<p>Thuế TNDN hiện hành = LN trước thuế × thuế suất (vd. 20%). Ví dụ: DTT 2.800, GVHB 1.800 → LN gộp 1.000; LN thuần = 1.000 + 200 − 300 − 300 − 400 = 200; LN khác = 100 − 200 = −100; LN trước thuế = 100; thuế 20% = 20; LNST = 80.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Khoản<\/th><th>Cách xử lý trên B 02<\/th><\/tr><\/thead><tbody>\n<tr><td>Chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại<\/td><td><b>Giảm trừ doanh thu<\/b> → tính DT thuần<\/td><\/tr>\n<tr><td>Chiết khấu thanh toán<\/td><td><b>Chi phí tài chính<\/b>, không giảm trừ doanh thu<\/td><\/tr>\n<tr><td>Giá vốn, CP bán hàng, CP QLDN<\/td><td>Chi phí HĐKD (trừ vào LN thuần)<\/td><\/tr>\n<tr><td>Doanh thu / chi phí tài chính<\/td><td>Thuộc hoạt động tài chính, tính vào LN thuần từ HĐKD<\/td><\/tr>\n<tr><td>Thu nhập khác / chi phí khác<\/td><td>Hoạt động khác → LN khác, cộng vào LN trước thuế<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 2, slide 41–47; (bổ sung: chiết khấu thanh toán = chi phí tài chính theo TT200); bank lms-ch2 Câu 31–33, 39–41, Bài 6; other-deon1 Câu 12, 13, 39, 43, 49; other-de1 Câu 23, 24; other-cau2 Ch2 Câu 3–5"},{"id":"ch2-t09","title":"Báo cáo lưu chuyển tiền tệ (B 03 – DN)","core":"<ul>\n<li>BCTC tổng hợp phản ánh việc <b>hình thành và sử dụng lượng tiền<\/b> phát sinh trong kỳ báo cáo. Lượng tiền gồm <b>vốn bằng tiền<\/b> và <b>các khoản tương đương tiền<\/b>.<\/li>\n<li><b>Ba nhóm hoạt động<\/b>: lưu chuyển tiền từ hoạt động <b>kinh doanh<\/b>, <b>đầu tư<\/b>, <b>tài chính<\/b>.<\/li>\n<li><b>Ý nghĩa<\/b>: thông tin về tình hình và sự vận động của tiền trong kỳ; đánh giá khả năng tạo tiền và khả năng thanh toán; cơ sở lập kế hoạch thu chi tiền kỳ tới.<\/li>\n<li><b>Căn cứ lập<\/b>: Báo cáo tình hình tài chính; B 02; Thuyết minh BCTC; sổ kế toán tổng hợp, chi tiết các TK liên quan; bảng tính và phân bổ khấu hao TSCĐ.<\/li>\n<li>Lập theo phương pháp <b>trực tiếp<\/b> hoặc <b>gián tiếp<\/b> (DN được chọn). <span class=\"tag ext\">Bổ sung<\/span><\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Nhóm dòng tiền<\/th><th>Ví dụ<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Kinh doanh<\/b><\/td><td>Thu từ bán hàng, chi trả người bán, trả lương, nộp thuế <span class=\"tag ext\">Bổ sung<\/span><\/td><\/tr>\n<tr><td><b>Đầu tư<\/b><\/td><td>Chi mua sắm TSCĐ, tài sản dài hạn khác<\/td><\/tr>\n<tr><td><b>Tài chính<\/b><\/td><td>Tiền thu từ đi vay; thay đổi quy mô và kết cấu vốn góp, vốn vay<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 2, slide 48–52; (bổ sung: phương pháp trực tiếp/gián tiếp); bank lms-ch2 Câu 37, 60–63; other-de1 Câu 27"},{"id":"ch2-t10","title":"Thuyết minh BCTC (B 09 – DN) và so sánh các báo cáo","core":"<ul>\n<li><b>Thuyết minh BCTC<\/b>: giải trình và bổ sung thông tin về hoạt động SXKD, tình hình tài chính mà các báo cáo khác <b>không thể trình bày rõ ràng, chi tiết<\/b>.<\/li>\n<li><b>Căn cứ<\/b>: B 01, B 02, B 03 kỳ báo cáo; sổ kế toán tổng hợp, chi tiết; Thuyết minh kỳ trước.<\/li>\n<li><b>Nội dung<\/b>: đặc điểm hoạt động DN; kỳ kế toán, đơn vị tiền tệ; chuẩn mực, chế độ, chính sách kế toán áp dụng; thông tin bổ sung cho các khoản mục trên B 01, B 02, B 03; thông tin khác.<\/li>\n<li><b>Ý nghĩa<\/b>: cung cấp thông tin chi tiết hơn; giúp người dùng đánh giá chính xác hoạt động của đơn vị.<\/li>\n<\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Báo cáo<\/th><th>Mẫu<\/th><th>Phản ánh<\/th><th>Thời gian<\/th><th>Căn cứ chính<\/th><\/tr><\/thead><tbody>\n<tr><td>Tình hình tài chính (BCĐKT)<\/td><td>B 01<\/td><td>Tài sản và nguồn hình thành tài sản<\/td><td><b>Thời điểm<\/b><\/td><td>TK loại 1–4<\/td><\/tr>\n<tr><td>Kết quả HĐKD<\/td><td>B 02<\/td><td>Doanh thu, chi phí, lãi/lỗ; nghĩa vụ với NN<\/td><td><b>Một kỳ<\/b><\/td><td>TK loại 5–9<\/td><\/tr>\n<tr><td>Lưu chuyển tiền tệ<\/td><td>B 03<\/td><td>Hình thành và sử dụng tiền (3 hoạt động)<\/td><td><b>Một kỳ<\/b><\/td><td>B 01, B 02, Thuyết minh, sổ KT<\/td><\/tr>\n<tr><td>Thuyết minh BCTC<\/td><td>B 09<\/td><td>Giải trình, bổ sung chi tiết<\/td><td>Kỳ báo cáo<\/td><td>B 01, B 02, B 03, sổ KT<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 2, slide 29, 53–54; bank lms-ch2 Câu 7–10, 31, 39, 60"}],"flashcards":[{"id":"ch2-f01","topic":"ch2-t01","front":"BCTC là gì (Luật Kế toán 2015)?","back":"Hệ thống thông tin kinh tế, tài chính của đơn vị kế toán, trình bày theo biểu mẫu quy định tại <b>chuẩn mực kế toán và chế độ kế toán<\/b>."},{"id":"ch2-f02","topic":"ch2-t01","front":"BCTC cung cấp thông tin về những gì?","back":"Tài sản; nợ phải trả; VCSH; doanh thu, thu nhập, chi phí; lãi, lỗ; các luồng tiền."},{"id":"ch2-f03","topic":"ch2-t01","front":"Mục đích của BCTC?","back":"Cung cấp thông tin về tình hình tài chính, kinh doanh, luồng tiền để chủ DN, cơ quan nhà nước và người dùng khác ra quyết định kinh tế."},{"id":"ch2-f04","topic":"ch2-t01","front":"Thông tin nào KHÔNG bắt buộc có trên BCTC?","back":"Phân loại chi phí thành định phí/biến phí (kế toán quản trị)."},{"id":"ch2-f05","topic":"ch2-t02","front":"Nguyên tắc 'tài sản không ghi cao hơn giá trị thu hồi, nợ không ghi thấp hơn nghĩa vụ' là nguyên tắc nào?","back":"<b>Thận trọng<\/b>."},{"id":"ch2-f06","topic":"ch2-t02","front":"BCTC lập trong điều kiện bình thường dựa trên giả định gì?","back":"<b>Hoạt động liên tục<\/b> (và cơ sở dồn tích)."},{"id":"ch2-f07","topic":"ch2-t02","front":"Khi nào được bù trừ tài sản và nợ phải trả?","back":"Chỉ khi cùng một đối tượng, vòng quay nhanh, đáo hạn ngắn, giao dịch cùng loại. Nguyên tắc chung: <b>trình bày riêng, không bù trừ<\/b>."},{"id":"ch2-f08","topic":"ch2-t02","front":"Phát hiện sai sót trọng yếu của kỳ trước thì xử lý thế nào?","back":"Điều chỉnh <b>hồi tố<\/b>."},{"id":"ch2-f09","topic":"ch2-t02","front":"'Tôn trọng bản chất hơn hình thức' nghĩa là gì?","back":"Phản ánh đúng bản chất kinh tế của giao dịch, không chỉ hình thức pháp lý."},{"id":"ch2-f10","topic":"ch2-t03","front":"Mốc thời gian phân loại ngắn hạn – dài hạn?","back":"Thu hồi/thanh toán trong <b>≤ 12 tháng<\/b> kể từ ngày kết thúc kỳ kế toán (hoặc trong 1 chu kỳ kinh doanh thông thường) = ngắn hạn; còn lại = dài hạn."},{"id":"ch2-f11","topic":"ch2-t03","front":"Phải thu thu hồi sau 8 tháng; khoản vay trả sau 18 tháng thuộc loại nào?","back":"Phải thu: <b>tài sản ngắn hạn<\/b>. Vay: <b>nợ dài hạn<\/b>."},{"id":"ch2-f12","topic":"ch2-t03","front":"Chu kỳ kinh doanh không xác định rõ được coi là bao lâu?","back":"<b>12 tháng<\/b>."},{"id":"ch2-f13","topic":"ch2-t03","front":"Chứng khoán đáo hạn không quá 3 tháng được xếp vào đâu?","back":"<b>Các khoản tương đương tiền<\/b>."},{"id":"ch2-f14","topic":"ch2-t03","front":"Tài sản được sắp xếp theo thứ tự nào? Nợ phải trả thì sao?","back":"TS: <b>tính thanh khoản giảm dần<\/b>. Nợ: <b>ưu tiên chi trả giảm dần<\/b>."},{"id":"ch2-f15","topic":"ch2-t03","front":"Nợ phải trả thuộc vốn lưu động (phải trả người bán...) hạn trên 12 tháng thì phân loại gì?","back":"Vẫn là <b>nợ ngắn hạn<\/b>."},{"id":"ch2-f16","topic":"ch2-t04","front":"Thời hạn nộp BCTC năm?","back":"Chậm nhất <b>90 ngày<\/b> kể từ ngày kết thúc kỳ kế toán năm."},{"id":"ch2-f17","topic":"ch2-t04","front":"Kỳ kế toán năm thông thường?","back":"12 tháng, từ 01/01 đến 31/12 dương lịch."},{"id":"ch2-f18","topic":"ch2-t04","front":"BCTC năm gồm những báo cáo nào, mẫu số?","back":"B 01 Tình hình tài chính; B 02 Kết quả HĐKD; B 03 Lưu chuyển tiền tệ; B 09 Thuyết minh."},{"id":"ch2-f19","topic":"ch2-t04","front":"BCTC giữa niên độ gồm gì?","back":"BCTC quý (kể cả quý IV) và bán niên (6 tháng); dạng đầy đủ hoặc tóm lược."},{"id":"ch2-f20","topic":"ch2-t04","front":"Công việc chuẩn bị trước khi lập BCTC?","back":"Kiểm tra và hoàn tất ghi sổ; kiểm kê tài sản; chuẩn bị mẫu biểu."},{"id":"ch2-f21","topic":"ch2-t05","front":"Báo cáo tình hình tài chính phản ánh gì, ở thời điểm hay thời kỳ?","back":"Giá trị <b>tài sản và nguồn hình thành tài sản<\/b> tại <b>một thời điểm<\/b> (báo cáo tĩnh)."},{"id":"ch2-f22","topic":"ch2-t05","front":"Đẳng thức cơ bản của báo cáo tình hình tài chính?","back":"<b>Tài sản = Nợ phải trả + Vốn chủ sở hữu<\/b> (Σ TS = Σ NV)."},{"id":"ch2-f23","topic":"ch2-t05","front":"Báo cáo tình hình tài chính lập căn cứ vào đâu?","back":"Số dư cuối kỳ các TK <b>loại 1, 2, 3, 4<\/b> (tổng hợp và chi tiết) và báo cáo kỳ trước."},{"id":"ch2-f24","topic":"ch2-t05","front":"Cột 'số đầu năm' lấy từ đâu?","back":"Từ cột <b>số cuối năm<\/b> của báo cáo kỳ trước."},{"id":"ch2-f25","topic":"ch2-t05","front":"Tài sản ngắn hạn = ? khi biết tổng nguồn vốn và tài sản dài hạn","back":"Tổng nguồn vốn − Tài sản dài hạn (vd. 7 + 2 − 5 = 4 tỷ)."},{"id":"ch2-f26","topic":"ch2-t06","front":"TK 214, 229 dư Có ghi lên báo cáo thế nào?","back":"Ghi <b>âm<\/b> ở phần <b>Tài sản<\/b> (TK điều chỉnh giảm tài sản)."},{"id":"ch2-f27","topic":"ch2-t06","front":"TK 419 (cổ phiếu quỹ) dư Nợ ghi thế nào?","back":"Ghi <b>âm<\/b> ở phần <b>Nguồn vốn<\/b> (trong VCSH)."},{"id":"ch2-f28","topic":"ch2-t06","front":"TK 421, 412, 413 dư Nợ ghi thế nào?","back":"Ghi <b>âm<\/b> ở phần <b>Nguồn vốn<\/b>."},{"id":"ch2-f29","topic":"ch2-t06","front":"TK 131 và 331 có số dư bên Nợ/bên Có ghi vào đâu?","back":"131 và 331: <b>dư Nợ → Tài sản<\/b>; <b>dư Có → Nguồn vốn<\/b>. Không bù trừ."},{"id":"ch2-f30","topic":"ch2-t06","front":"Quỹ khen thưởng phúc lợi; Quỹ đầu tư phát triển; Thuế phải nộp NN thuộc nhóm nào?","back":"Quỹ KT-PL (353): <b>nợ phải trả<\/b>. Quỹ ĐTPT (414): <b>VCSH<\/b>. Thuế phải nộp (333): <b>nợ phải trả<\/b>."},{"id":"ch2-f31","topic":"ch2-t06","front":"Chi phí trả trước nhiều kỳ trình bày ở đâu?","back":"<b>Tài sản<\/b> (TK 242), ngắn hạn hoặc dài hạn tùy thời gian phân bổ."},{"id":"ch2-f32","topic":"ch2-t07","front":"Có mấy loại thay đổi của báo cáo tình hình tài chính? Nêu.","back":"4 loại: (1) TS↑ TS↓; (2) NV↑ NV↓; (3) TS↑ NV↑; (4) TS↓ NV↓ — cùng giá trị, vẫn Σ TS = Σ NV."},{"id":"ch2-f33","topic":"ch2-t07","front":"Nộp tiền mặt vào ngân hàng thuộc loại nào?","back":"Loại 1 (TS↑ TS↓): Nợ 112 / Có 111; Σ TS không đổi."},{"id":"ch2-f34","topic":"ch2-t07","front":"Vay ngắn hạn trả nợ người bán thay đổi báo cáo thế nào?","back":"Nợ 331 / Có 341: loại 2 (NV↑ NV↓); Σ TS, Σ NV không đổi."},{"id":"ch2-f35","topic":"ch2-t07","front":"Mua NVL chưa trả tiền: ảnh hưởng gì?","back":"Nợ 152 / Có 331: loại 3; tổng tài sản và tổng nguồn vốn cùng <b>tăng<\/b>."},{"id":"ch2-f36","topic":"ch2-t08","front":"Báo cáo KQHĐKD phản ánh gì? Thời điểm hay kỳ?","back":"Tình hình và kết quả kinh doanh trong <b>một kỳ<\/b> (B 02)."},{"id":"ch2-f37","topic":"ch2-t08","front":"Công thức doanh thu thuần?","back":"<div class='formula'>DT thuần = DT bán hàng &amp; CCDV − Các khoản giảm trừ<\/div>"},{"id":"ch2-f38","topic":"ch2-t08","front":"Các khoản giảm trừ doanh thu gồm?","back":"Chiết khấu thương mại + giảm giá hàng bán + hàng bán bị trả lại. (Chiết khấu thanh toán là chi phí tài chính.)"},{"id":"ch2-f39","topic":"ch2-t08","front":"Công thức lợi nhuận gộp?","back":"<div class='formula'>LN gộp = DT thuần − Giá vốn hàng bán<\/div>"},{"id":"ch2-f40","topic":"ch2-t08","front":"Công thức LN thuần từ HĐKD?","back":"<div class='formula'>LN gộp + DT tài chính − CP tài chính − CP bán hàng − CP QLDN<\/div>"},{"id":"ch2-f41","topic":"ch2-t08","front":"Công thức lợi nhuận trước thuế và sau thuế?","back":"LN khác = Thu nhập khác − CP khác. <b>LN trước thuế = LN thuần HĐKD + LN khác<\/b>. <b>LN sau thuế = LN trước thuế − Thuế TNDN<\/b>."},{"id":"ch2-f42","topic":"ch2-t08","front":"Báo cáo KQHĐKD lập căn cứ vào TK loại nào? Kết cấu mấy phần?","back":"TK loại <b>5, 6, 7, 8, 9<\/b>. 3 phần: lãi/lỗ; nghĩa vụ với Nhà nước; thuế GTGT."},{"id":"ch2-f43","topic":"ch2-t09","front":"Báo cáo lưu chuyển tiền tệ gồm 3 hoạt động nào?","back":"Kinh doanh, đầu tư, tài chính."},{"id":"ch2-f44","topic":"ch2-t09","front":"Mua thiết bị dài hạn bằng tiền; nhận tiền vay ngân hàng thuộc dòng tiền nào?","back":"Mua thiết bị: <b>đầu tư<\/b>. Nhận tiền vay: <b>tài chính<\/b>."},{"id":"ch2-f45","topic":"ch2-t09","front":"'Lượng tiền' trong báo cáo LCTT gồm gì?","back":"Vốn bằng tiền và các khoản tương đương tiền."},{"id":"ch2-f46","topic":"ch2-t10","front":"Thuyết minh BCTC để làm gì?","back":"Giải trình, bổ sung thông tin mà các báo cáo khác không trình bày rõ và chi tiết được (B 09)."},{"id":"ch2-f47","topic":"ch2-t10","front":"Nội dung chính của Thuyết minh BCTC?","back":"Đặc điểm hoạt động; kỳ kế toán, đơn vị tiền tệ; chính sách kế toán; thông tin bổ sung cho B 01, B 02, B 03; thông tin khác."},{"id":"ch2-f48","topic":"ch2-t10","front":"Phân biệt báo cáo tĩnh và báo cáo động?","back":"Tĩnh: tình hình tài chính (<b>thời điểm<\/b>). Động (theo kỳ): KQHĐKD và lưu chuyển tiền tệ."}],"notes":"<ul>\n<li>Slide chương 2 dùng thuật ngữ 'Báo cáo tình hình tài chính' còn đề/bài tập cũ dùng 'Bảng cân đối kế toán'; hai tên chỉ cùng một báo cáo B 01.<\/li>\n<li>Slide 39 ghi TK 229 'Dự phòng tổn thất tài sản' (khớp tên TT200), bài tập coi là điều chỉnh giảm tài sản.<\/li>\n<li>Slide 51–52 (mẫu lưu chuyển tiền tệ) là hình, không có text; chi tiết chỉ tiêu và phương pháp trực tiếp/gián tiếp lấy từ kiến thức bổ sung.<\/li>\n<li>Chiết khấu thanh toán = chi phí tài chính: lấy từ lời giải của đề, không có trong slide.<\/li>\n<li>Quỹ khen thưởng phúc lợi xếp vào nợ phải trả theo TT200 (ghi trong lời giải LMS); nên xác nhận giảng viên chấp nhận cách xếp này.<\/li>\n<\/ul>","fx":{"items":[{"id":"ch2-f-01","name":"Tổng tài sản","topic":"ch2-t05","formula":"<div class=\"formula\">Tổng tài sản = Tài sản ngắn hạn + Tài sản dài hạn<\/div>","parts":"<ul><li><b>TS ngắn hạn<\/b>: thu hồi/sử dụng trong ≤ 12 tháng hoặc 1 chu kỳ kinh doanh<\/li><li><b>TS dài hạn<\/b>: tài sản không thuộc ngắn hạn<\/li><\/ul>","example":"<p>VD: TS ngắn hạn 600, TS dài hạn 400 thì Tổng tài sản = 600 + 400 = 1.000 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 13–14, 32–34"},{"id":"ch2-f-02","name":"Tổng nguồn vốn","topic":"ch2-t05","formula":"<div class=\"formula\">Tổng nguồn vốn = Nợ phải trả + Vốn chủ sở hữu<\/div><div class=\"formula\">Nợ phải trả = Nợ ngắn hạn + Nợ dài hạn<\/div>","parts":"<ul><li><b>Nợ ngắn hạn<\/b>: đến hạn trả ≤ 12 tháng<\/li><li><b>Nợ dài hạn<\/b>: phần còn lại<\/li><li><b>Vốn CSH<\/b>: vốn đầu tư của chủ sở hữu, lợi nhuận chưa phân phối…<\/li><\/ul>","example":"<p>VD: Nợ ngắn hạn 300, nợ dài hạn 200, VCSH 500 thì Nợ phải trả = 500; Tổng nguồn vốn = 500 + 500 = 1.000 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 15–17, 32–34"},{"id":"ch2-f-03","name":"Cân đối của Báo cáo tình hình tài chính","topic":"ch2-t05","formula":"<div class=\"formula\">Tổng cộng tài sản (mã 270) = Tổng cộng nguồn vốn (mã 440)<\/div>","parts":"<ul><li>Hai bên luôn bằng nhau; nếu lệch là báo cáo hoặc số liệu ghi sổ có sai sót<\/li><li>Dùng kiểm tra tính chính xác của số liệu kế toán<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span> Mã số 270/440 theo mẫu B 01 – DN.<\/p>","example":"<p>VD: Tổng tài sản 1.000 = Tổng nguồn vốn 1.000 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 33–35"},{"id":"ch2-f-04","name":"Tài sản từ số dư tài khoản điều chỉnh giảm","topic":"ch2-t06","formula":"<div class=\"formula\">Chỉ tiêu TS (giá trị còn lại) = Số dư Nợ TK phản ánh tài sản − Số dư Có TK điều chỉnh giảm (214, 229)<\/div>","parts":"<ul><li><b>TK tài sản<\/b> (vd 211): số dư Nợ ghi dương<\/li><li><b>TK 214, 229<\/b>: số dư Có ghi âm trong phần tài sản<\/li><\/ul>","example":"<p>VD: TK 211 dư Nợ 1.000, TK 214 dư Có 300 thì giá trị còn lại TSCĐ = 1.000 − 300 = 700 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 38–39"},{"id":"ch2-f-05","name":"Phải thu khách hàng và Phải trả người bán (TK hỗn hợp)","topic":"ch2-t06","formula":"<div class=\"formula\">Phải thu KH = Σ số dư Nợ chi tiết TK 131<\/div><div class=\"formula\">Người mua trả tiền trước = Σ số dư Có chi tiết TK 131<\/div><div class=\"formula\">Phải trả người bán = Σ số dư Có chi tiết TK 331; Người bán ứng trước = Σ số dư Nợ chi tiết TK 331<\/div>","parts":"<ul><li>Không bù trừ nợ phải thu với nợ phải trả; lấy số dư theo từng đối tượng chi tiết<\/li><li>Dư Nợ ghi phần tài sản, dư Có ghi phần nguồn vốn<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span> Tên chỉ tiêu theo mẫu B 01.<\/p>","example":"<p>VD: TK 131: khách A dư Nợ 80, khách B dư Có 20 thì Phải thu KH = 80 và Người mua trả tiền trước = 20, không ghi 60 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 38–39"},{"id":"ch2-f-06","name":"Nguồn vốn từ số dư tài khoản","topic":"ch2-t06","formula":"<div class=\"formula\">Chỉ tiêu NV = Số dư Có TK nguồn vốn; số dư Nợ của TK 419, 421, 412, 413 ghi âm<\/div>","parts":"<ul><li><b>TK nguồn vốn<\/b>: số dư Có ghi dương<\/li><li><b>TK 419<\/b> (cổ phiếu mua lại): dư Nợ ghi âm<\/li><li><b>TK 421, 412, 413<\/b>: nếu dư Nợ thì ghi âm trong phần nguồn vốn<\/li><\/ul>","example":"<p>VD: TK 421 dư Nợ 30 thì chỉ tiêu LNST chưa phân phối = −30 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 38–39"},{"id":"ch2-f-07","name":"Hàng tồn kho trên báo cáo","topic":"ch2-t06","formula":"<div class=\"formula\">Hàng tồn kho = Σ số dư Nợ các TK hàng tồn kho (151, 152, 153, 154, 155, 156, 157) − Dự phòng giảm giá hàng tồn kho<\/div>","parts":"<ul><li><b>Hàng gửi đi bán (157)<\/b> vẫn là hàng tồn kho<\/li><li><b>Dự phòng giảm giá<\/b>: số dư Có ghi âm<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span><\/p>","example":"<p>VD: Nguyên vật liệu 100, hàng hóa 200, hàng gửi bán 40, dự phòng 20 thì HTK = 100 + 200 + 40 − 20 = 320 (triệu đồng).<\/p>","source":"Bổ sung: kiến thức TT200; slide 38–39"},{"id":"ch2-f-08","name":"Doanh thu thuần về bán hàng và cung cấp dịch vụ","topic":"ch2-t08","formula":"<div class=\"formula\">DT thuần = Doanh thu bán hàng và cung cấp dịch vụ − Các khoản giảm trừ doanh thu<\/div>","parts":"<ul><li><b>Doanh thu BH và CCDV<\/b>: tổng doanh thu (đv: tiền)<\/li><li><b>Các khoản giảm trừ<\/b>: xem công thức kế tiếp<\/li><\/ul>","example":"<p>VD: Doanh thu 1.000, giảm trừ 100 thì DT thuần = 1.000 − 100 = 900 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 45–46"},{"id":"ch2-f-09","name":"Các khoản giảm trừ doanh thu","topic":"ch2-t08","formula":"<div class=\"formula\">Các khoản giảm trừ = Chiết khấu thương mại + Giảm giá hàng bán + Hàng bán bị trả lại<\/div>","parts":"<ul><li><b>Chiết khấu thương mại<\/b>: giảm giá cho khách mua nhiều<\/li><li><b>Giảm giá hàng bán<\/b>: giảm do hàng kém chất lượng…<\/li><li><b>Hàng bán bị trả lại<\/b>: giá trị hàng khách trả<\/li><\/ul>","example":"<p>VD: 30 + 50 + 20 = 100 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 46"},{"id":"ch2-f-10","name":"Lợi nhuận gộp","topic":"ch2-t08","formula":"<div class=\"formula\">Lợi nhuận gộp = DT thuần về BH và CCDV − Giá vốn hàng bán<\/div>","parts":"<ul><li><b>Giá vốn hàng bán<\/b>: giá gốc của hàng đã bán trong kỳ<\/li><\/ul>","example":"<p>VD: DT thuần 900, giá vốn 600 thì lợi nhuận gộp = 900 − 600 = 300 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 45–46"},{"id":"ch2-f-11","name":"Lợi nhuận thuần từ hoạt động kinh doanh","topic":"ch2-t08","formula":"<div class=\"formula\">LN thuần từ HĐKD = DT thuần về BH và CCDV + DT hoạt động tài chính − Chi phí HĐKD<\/div><div class=\"formula\">Chi phí HĐKD = Giá vốn hàng bán + Chi phí tài chính + Chi phí bán hàng + Chi phí QLDN<\/div>","parts":"<ul><li><b>DT hoạt động tài chính<\/b>: lãi tiền gửi, cổ tức…<\/li><li><b>Chi phí tài chính<\/b>: lãi vay…<\/li><li><b>Chi phí bán hàng, QLDN<\/b>: chi phí ngoài giá vốn<\/li><\/ul>","example":"<p>VD: DT thuần 900, DT tài chính 20, chi phí HĐKD = 600 + 20 + 100 + 80 = 800 thì LN thuần = 900 + 20 − 800 = 120 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 46"},{"id":"ch2-f-12","name":"Lợi nhuận khác","topic":"ch2-t08","formula":"<div class=\"formula\">Lợi nhuận khác = Thu nhập khác − Chi phí khác<\/div>","parts":"<ul><li><b>Thu nhập khác<\/b>: thanh lý TSCĐ, tiền phạt thu được…<\/li><li><b>Chi phí khác<\/b>: chi phí thanh lý, tiền bị phạt…<\/li><\/ul>","example":"<p>VD: Thu nhập khác 30, chi phí khác 10 thì lợi nhuận khác = 30 − 10 = 20 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 47"},{"id":"ch2-f-13","name":"Tổng lợi nhuận kế toán trước thuế","topic":"ch2-t08","formula":"<div class=\"formula\">Tổng LN kế toán trước thuế = LN thuần từ HĐKD + Lợi nhuận khác<\/div>","parts":"<ul><li>Lợi nhuận khác có thể âm (lỗ khác)<\/li><\/ul>","example":"<p>VD: LN thuần 120, lợi nhuận khác 20 thì LN trước thuế = 120 + 20 = 140 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 47"},{"id":"ch2-f-14","name":"Lợi nhuận sau thuế TNDN","topic":"ch2-t08","formula":"<div class=\"formula\">LN sau thuế TNDN = Tổng LN kế toán trước thuế − Chi phí thuế TNDN<\/div>","parts":"<ul><li><b>Chi phí thuế TNDN<\/b>: thuế thu nhập doanh nghiệp tính trên lợi nhuận<\/li><\/ul>","example":"<p>VD: LN trước thuế 140, thuế 28 thì LN sau thuế = 140 − 28 = 112 (triệu đồng).<\/p>","source":"Slide Chương 2, slide 47"},{"id":"ch2-f-15","name":"Chi phí thuế TNDN (tính nhanh)","topic":"ch2-t08","formula":"<div class=\"formula\">Chi phí thuế TNDN = Lợi nhuận chịu thuế × Thuế suất<\/div>","parts":"<ul><li><b>Lợi nhuận chịu thuế<\/b>: giả định bằng LN kế toán trước thuế nếu đề không điều chỉnh<\/li><li><b>Thuế suất<\/b>: phổ biến 20% (theo đề bài)<\/li><\/ul><p><span class=\"tag ext\">Bổ sung<\/span><\/p>","example":"<p>VD: LN trước thuế 50, thuế suất 20% thì thuế = 50 × 20% = 10; LN sau thuế = 50 − 10 = 40 (triệu đồng).<\/p>","source":"Bổ sung: kiến thức thuế TNDN; không có trong slide"}],"note":null}},"ch3":{"chapter":"ch3","title":"Chương 3 – Chứng từ kế toán, Tài khoản kế toán và Ghi sổ","topics":[{"id":"ch3-t01","title":"Chứng từ kế toán: khái niệm và ý nghĩa","core":"<p><b>Chứng từ kế toán<\/b> = giấy tờ và vật mang tin phản ánh <b>nghiệp vụ kinh tế phát sinh và đã hoàn thành<\/b>, làm <b>căn cứ ghi sổ<\/b> (Luật Kế toán, Điều 4).<\/p>\n<ul><li>Mọi nghiệp vụ đều phải lập chứng từ <b>đúng thời gian, địa điểm phát sinh<\/b> (không lập cuối tháng/khi có yêu cầu).<\/li>\n<li>Ý nghĩa: phản ánh chính xác, đầy đủ, kịp thời; căn cứ <b>duy nhất<\/b> để ghi sổ, đảm bảo <b>tính pháp lý<\/b>; phương tiện truyền mệnh lệnh; cơ sở giải quyết tranh chấp, kiểm tra chế độ; bảo vệ tài sản.<\/li>\n<li>Chỉ nghiệp vụ <b>đã phát sinh và hoàn thành<\/b>, làm thay đổi tài sản/nguồn vốn mới được ghi sổ (đơn đặt hàng, hợp đồng nguyên tắc, báo giá, kế hoạch chưa ghi sổ).<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 3, slide 5–7"},{"id":"ch3-t02","title":"Phân loại chứng từ (trọng tâm)","core":"<p>Một chứng từ có thể xếp vào nhiều nhóm tuỳ <b>tiêu chí phân loại<\/b>:<\/p>\n<ul><li><b>Trình tự lập<\/b>: chứng từ ban đầu (gốc) / chứng từ tổng hợp (ghi sổ).<\/li>\n<li><b>Địa điểm lập<\/b>: nội bộ / bên ngoài.<\/li>\n<li><b>Hình thức<\/b>: giấy / điện tử (dữ liệu mã hoá, không bị đổi nội dung khi truyền).<\/li>\n<li><b>Nội dung nghiệp vụ<\/b>: lao động–tiền lương, hàng tồn kho, bán hàng, tiền tệ, TSCĐ.<\/li>\n<li><b>Công dụng<\/b>: mệnh lệnh / chấp hành / thủ tục kế toán / liên hợ

class=\"num\">90<\/td><td>- Chi phí phải trả<\/td><td class=\"num\">110<\/td><\/tr><tr><td>III. Các khoản phải thu ngắn hạn<\/td><td class=\"num\">730<\/td><td>- Phải trả, phải nộp khác<\/td><td class=\"num\">420<\/td><\/tr><tr><td>- Phải thu của khách hàng<\/td><td class=\"num\">720<\/td><td>- Nợ dài hạn đến hạn trả<\/td><td class=\"num\">570<\/td><\/tr><tr><td>- Trả trước cho người bán (ứng trước)<\/td><td class=\"num\">80<\/td><td>II. Nợ dài hạn<\/td><td class=\"num\">1.960<\/td><\/tr><tr><td>- Phải thu khác<\/td><td class=\"num\">20<\/td><td>- Nhận ký quỹ, ký cược dài hạn<\/td><td class=\"num\">220<\/td><\/tr><tr><td>- Dự phòng phải thu khó đòi<\/td><td class=\"num\">(90)<\/td><td>- Vay dài hạn<\/td><td class=\"num\">820<\/td><\/tr><tr><td>IV. Hàng tồn kho<\/td><td class=\"num\">1.690<\/td><td>- Nợ dài hạn<\/td><td class=\"num\">920<\/td><\/tr><tr><td>- Nguyên liệu, vật liệu<\/td><td class=\"num\">640<\/td><td><b>B. VỐN CHỦ SỞ HỮU<\/b><\/td><td class=\"num\"><b>2.820<\/b><\/td><\/tr><tr><td>- Công cụ, dụng cụ<\/td><td class=\"num\">70<\/td><td>- Vốn đầu tư của chủ sở hữu (X)<\/td><td class=\"num\">1.870<\/td><\/tr><tr><td>- Chi phí SXKD dở dang<\/td><td class=\"num\">220<\/td><td>- Quỹ đầu tư phát triển<\/td><td class=\"num\">400<\/td><\/tr><tr><td>- Sản phẩm (thành phẩm)<\/td><td class=\"num\">760<\/td><td>- Lợi nhuận sau thuế chưa phân phối<\/td><td class=\"num\">550<\/td><\/tr><tr><td>V. Tài sản ngắn hạn khác (cầm cố, ký quỹ, ký cược ngắn hạn)<\/td><td class=\"num\">260<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>B. TÀI SẢN DÀI HẠN<\/b><\/td><td class=\"num\"><b>2.780<\/b><\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>I. TSCĐ hữu hình<\/td><td class=\"num\">1.680<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>- Nguyên giá<\/td><td class=\"num\">1.900<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>- Hao mòn lũy kế<\/td><td class=\"num\">(220)<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>II. Đầu tư vào công ty liên doanh, liên kết<\/td><td class=\"num\">650<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td>III. Đầu tư dài hạn khác<\/td><td class=\"num\">450<\/td><td><\/td><td class=\"num\"><\/td><\/tr><tr><td><b>TỔNG CỘNG TÀI SẢN<\/b><\/td><td class=\"num\"><b>7.820<\/b><\/td><td><b>TỔNG CỘNG NGUỒN VỐN<\/b><\/td><td class=\"num\"><b>7.820<\/b><\/td><\/tr><\/tbody><\/table><p>Kiểm tra: Nợ phải trả 5.000 + VCSH 2.820 (1.870 + 400 + 550) = 7.820 = Tổng tài sản.<\/p>","source":"Slide Chương 2, slides 33-39 (lập báo cáo tình hình tài chính), slide 40; TT200 (Mẫu B01-DN)","status":"needs_review","answerBasis":"self","reviewNote":"Đề có nhiều khoản gần trùng nhau (\"Phải trả Nhà nước\" 600 và \"Thuế và các khoản phải nộp Nhà nước\" 300; \"Nợ dài hạn\" 920 và \"Vay dài hạn\" 820); đã tính cả hai khoản vào nợ phải trả. Nếu đề coi là trùng lặp thì X thay đổi. \"Ứng tiền trước cho NB\" 80 ghi bên Tài sản theo slide 38-39. Cần xác nhận."}]},{"id":"lms-ch2-u062","context":"<p>Cho số liệu các tài khoản doanh nghiệp ABC năm N như sau: (đơn vị tính: triệu đồng)<\/p><ul><li>Doanh thu hoạt động tài chính: 600<\/li><li>Chi phí bán hàng: 700<\/li><li>Doanh thu bán hàng và cung cấp dịch vụ: 15.000<\/li><li>Chi phí quản lý doanh nghiệp: 800<\/li><li>Chi phí khác: 100<\/li><li>Giá vốn hàng bán: 9.000<\/li><li>Thu nhập khác: 400<\/li><li>Chi phí tài chính: 600<\/li><\/ul><p>Yêu cầu:<\/p><ol><li>Tính thuế thu nhập doanh nghiệp hiện hành (biết rằng thuế suất thuế TNDN là 20%).<\/li><li>Lập bảng báo cáo kết quả hoạt động kinh doanh của doanh nghiệp ABC năm N<\/li><\/ol>","questions":[{"id":"lms-ch2-q063","num":"Bài 6 (yêu cầu 1)","type":"essay","text":"<p>Tính thuế thu nhập doanh nghiệp hiện hành (biết rằng thuế suất thuế TNDN là 20%).<\/p>","answer":"<p>Giả định không có điều chỉnh tăng/giảm thu nhập chịu thuế (thu nhập chịu thuế = lợi nhuận kế toán trước thuế).<\/p><p>Lợi nhuận gộp = 15.000 - 9.000 = 6.000. LN thuần từ HĐKD = 6.000 + 600 - 600 - 700 - 800 = 4.500. LN khác = 400 - 100 = 300. Tổng lợi nhuận kế toán trước thuế = 4.500 + 300 = <b>4.800<\/b>.<\/p><p>Thuế TNDN hiện hành = 4.800 x 20% = <b>960<\/b> triệu đồng.<\/p><div class=\"je\"><div>Nợ TK 8211 &nbsp; 960<\/div><div class=\"cr\">Có TK 3334 &nbsp; 960<\/div><\/div>","source":"Slide Chương 2, slides 45-47","status":"ok","answerBasis":"self"},{"id":"lms-ch2-q064","num":"Bài 6 (yêu cầu 2)","type":"essay","text":"<p>Lập bảng báo cáo kết quả hoạt động kinh doanh của doanh nghiệp ABC năm N.<\/p>","answer":"<p>Lập theo thứ tự (slide 45-47): DT thuần -> LN gộp -> LN thuần từ HĐKD -> LN khác -> LN trước thuế -> thuế TNDN -> LN sau thuế (triệu đồng).<\/p><table class=\"t\"><thead><tr><th>Chỉ tiêu<\/th><th>Mã số<\/th><th>Năm N<\/th><\/tr><\/thead><tbody><tr><td>1. Doanh thu bán hàng và cung cấp dịch vụ<\/td><td>01<\/td><td class=\"num\">15.000<\/td><\/tr><tr><td>2. Các khoản giảm trừ doanh thu<\/td><td>02<\/td><td class=\"num\">0<\/td><\/tr><tr><td>3. Doanh thu thuần về bán hàng và cung cấp dịch vụ (10 = 01 - 02)<\/td><td>10<\/td><td class=\"num\">15.000<\/td><\/tr><tr><td>4. Giá vốn hàng bán<\/td><td>11<\/td><td class=\"num\">9.000<\/td><\/tr><tr><td>5. Lợi nhuận gộp về bán hàng và cung cấp dịch vụ (20 = 10 - 11)<\/td><td>20<\/td><td class=\"num\">6.000<\/td><\/tr><tr><td>6. Doanh thu hoạt động tài chính<\/td><td>21<\/td><td class=\"num\">600<\/td><\/tr><tr><td>7. Chi phí tài chính<\/td><td>22<\/td><td class=\"num\">600<\/td><\/tr><tr><td>8. Chi phí bán hàng<\/td><td>25<\/td><td class=\"num\">700<\/td><\/tr><tr><td>9. Chi phí quản lý doanh nghiệp<\/td><td>26<\/td><td class=\"num\">800<\/td><\/tr><tr><td>10. Lợi nhuận thuần từ hoạt động kinh doanh (30 = 20 + 21 - 22 - 25 - 26)<\/td><td>30<\/td><td class=\"num\">4.500<\/td><\/tr><tr><td>11. Thu nhập khác<\/td><td>31<\/td><td class=\"num\">400<\/td><\/tr><tr><td>12. Chi phí khác<\/td><td>32<\/td><td class=\"num\">100<\/td><\/tr><tr><td>13. Lợi nhuận khác (40 = 31 - 32)<\/td><td>40<\/td><td class=\"num\">300<\/td><\/tr><tr><td>14. Tổng lợi nhuận kế toán trước thuế (50 = 30 + 40)<\/td><td>50<\/td><td class=\"num\">4.800<\/td><\/tr><tr><td>15. Chi phí thuế TNDN hiện hành (20%)<\/td><td>51<\/td><td class=\"num\">960<\/td><\/tr><tr><td>16. Lợi nhuận sau thuế thu nhập doanh nghiệp (60 = 50 - 51)<\/td><td>60<\/td><td class=\"num\">3.840<\/td><\/tr><\/tbody><\/table><p>Kiểm tra bằng cách khác: Tổng thu nhập = 15.000 + 600 + 400 = 16.000; Tổng chi phí = 9.000 + 700 + 800 + 600 + 100 = 11.200; LNTT = 16.000 - 11.200 = 4.800 (khớp); LNST = 4.800 - 960 = 3.840.<\/p>","source":"Slide Chương 2, slides 41-47; TT200 (Mẫu B02-DN)","status":"ok","answerBasis":"self"}]}]},{"key":"ch3","title":"Chương 3 – Chứng từ, tài khoản, ghi sổ","units":[{"id":"lms-ch3-u001","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q001","num":"Chứng từ – Lý thuyết – Câu 1","type":"mcq","text":"Nội dung nào mô tả đầy đủ nhất về phương pháp chứng từ kế toán?","options":[{"id":"lms-ch3-q001-A","text":"Phương pháp dùng để xác định số dư của các tài khoản kế toán."},{"id":"lms-ch3-q001-B","text":"Phương pháp thu nhận và kiểm tra thông tin về các nghiệp vụ kinh tế, tài chính phát sinh và đã hoàn thành thông qua việc lập và sử dụng chứng từ kế toán."},{"id":"lms-ch3-q001-C","text":"Phương pháp tổng hợp số liệu kế toán vào cuối kỳ."},{"id":"lms-ch3-q001-D","text":"Phương pháp dùng để xác định kết quả kinh doanh của doanh nghiệp."}],"correctOptionId":"lms-ch3-q001-B","explanation":"Chứng từ kế toán là giấy tờ, vật mang tin phản ánh nghiệp vụ kinh tế phát sinh và đã hoàn thành, làm căn cứ ghi sổ; phương pháp chứng từ thu nhận và kiểm tra thông tin ban đầu về nghiệp vụ. A là chức năng của tài khoản; C là tổng hợp, cân đối; D là xác định kết quả kinh doanh, không phải phương pháp chứng từ.","source":"Slide Chương 3, slide 5–7 (Luật Kế toán, Điều 4)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u002","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q002","num":"Chứng từ – Lý thuyết – Câu 2","type":"mcq","text":"Khi phát sinh nghiệp vụ kinh tế, tài chính liên quan đến hoạt động của đơn vị, chứng từ kế toán phải được lập vào thời điểm nào?","options":[{"id":"lms-ch3-q002-A","text":"Khi lập báo cáo tài chính."},{"id":"lms-ch3-q002-B","text":"Khi kết thúc tháng kế toán."},{"id":"lms-ch3-q002-C","text":"Khi nghiệp vụ kinh tế, tài chính phát sinh theo quy định."},{"id":"lms-ch3-q002-D","text":"Khi có yêu cầu của giám đốc doanh nghiệp."}],"correctOptionId":"lms-ch3-q002-C","explanation":"Mọi nghiệp vụ kinh tế đều phải lập chứng từ kế toán theo đúng thời gian và địa điểm phát sinh nghiệp vụ. Lập vào cuối tháng, khi lập báo cáo hay chờ yêu cầu của giám đốc đều làm mất tính kịp thời.","source":"Slide Chương 3, slide 25","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u003","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q003","num":"Chứng từ – Lý thuyết – Câu 3","type":"mcq","text":"Trong điều kiện ứng dụng công nghệ thông tin, chứng từ kế toán có thể được lập dưới hình thức nào?","options":[{"id":"lms-ch3-q003-A","text":"Chỉ bằng giấy."},{"id":"lms-ch3-q003-B","text":"Chỉ bằng dữ liệu điện tử."},{"id":"lms-ch3-q003-C","text":"Bằng giấy hoặc dưới dạng chứng từ điện tử theo quy định."},{"id":"lms-ch3-q003-D","text":"Chỉ bằng biểu mẫu do doanh nghiệp tự thiết kế."}],"correctOptionId":"lms-ch3-q003-C","explanation":"Xét theo hình thức, chứng từ gồm chứng từ giấy và chứng từ điện tử (dữ liệu điện tử đã mã hóa, không bị thay đổi nội dung khi truyền). Hai hình thức cùng tồn tại nên 'chỉ giấy' hay 'chỉ điện tử' đều sai.","source":"Slide Chương 3, slide 12","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u004","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q004","num":"Chứng từ – Lý thuyết – Câu 4","type":"mcq","text":"Doanh nghiệp mua hàng hóa nhập kho và nhận được hóa đơn điện tử hợp pháp từ người bán. Chứng từ nào là căn cứ quan trọng để xác định giá mua và thuế GTGT đầu vào?","options":[{"id":"lms-ch3-q004-A","text":"Hóa đơn GTGT."},{"id":"lms-ch3-q004-B","text":"Đơn đặt hàng."},{"id":"lms-ch3-q004-C","text":"Báo giá của nhà cung cấp."},{"id":"lms-ch3-q004-D","text":"Hợp đồng nguyên tắc."}],"correctOptionId":"lms-ch3-q004-A","explanation":"Hóa đơn GTGT là chứng từ bán hàng bên ngoài, ghi giá mua và thuế GTGT, là căn cứ ghi sổ. Đơn đặt hàng, báo giá, hợp đồng nguyên tắc chỉ là tài liệu/ chứng từ mang tính mệnh lệnh, thỏa thuận, chưa chứng minh nghiệp vụ đã hoàn thành.","source":"Slide Chương 3, slide 11, 14–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u005","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q005","num":"Chứng từ – Lý thuyết – Câu 5","type":"mcq","text":"Vai trò chủ yếu của phương pháp chứng từ kế toán là:","options":[{"id":"lms-ch3-q005-A","text":"Cung cấp thông tin ban đầu về nghiệp vụ kinh tế, tài chính."},{"id":"lms-ch3-q005-B","text":"Hỗ trợ kiểm tra tính hợp pháp, hợp lý của nghiệp vụ."},{"id":"lms-ch3-q005-C","text":"Là cơ sở để ghi nhận thông tin vào hệ thống kế toán."},{"id":"lms-ch3-q005-D","text":"Tất cả các nội dung trên.","pinned":true}],"correctOptionId":"lms-ch3-q005-D","explanation":"Cả ba ý đều đúng: chứng từ thu nhận thông tin kịp thời, đầy đủ, chính xác; giúp kiểm tra thường xuyên tính hợp lệ, hợp pháp; và là căn cứ để ghi sổ kế toán.","source":"Slide Chương 3, slide 6–7","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u006","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q006","num":"Chứng từ – Lý thuyết – Câu 6","type":"mcq","text":"Đặc điểm cơ bản của chứng từ gốc là:","options":[{"id":"lms-ch3-q006-A","text":"Được lập nhằm tổng hợp số liệu của nhiều chứng từ khác."},{"id":"lms-ch3-q006-B","text":"Được lập trực tiếp khi nghiệp vụ kinh tế, tài chính phát sinh và hoàn thành theo quy định."},{"id":"lms-ch3-q006-C","text":"Chỉ được lập vào cuối tháng."},{"id":"lms-ch3-q006-D","text":"Chỉ được sử dụng trong nội bộ doanh nghiệp."}],"correctOptionId":"lms-ch3-q006-B","explanation":"Chứng từ ban đầu (chứng từ gốc) được lập trực tiếp ngay khi nghiệp vụ vừa phát sinh hoặc hoàn thành, phản ánh trực tiếp đối tượng kế toán, có giá trị pháp lý quan trọng nhất. A là đặc điểm của chứng từ tổng hợp; C sai thời điểm; D sai vì còn có chứng từ bên ngoài (hóa đơn...).","source":"Slide Chương 3, slide 8–9, 11","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u007","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q007","num":"Chứng từ – Lý thuyết – Câu 7","type":"mcq","text":"Doanh nghiệp nhận 200 đơn vị hàng hóa từ nhà cung cấp và đưa vào kho. Phiếu nhập kho được sử dụng chủ yếu để:","options":[{"id":"lms-ch3-q007-A","text":"Xác nhận số lượng hàng hóa thực tế nhập kho."},{"id":"lms-ch3-q007-B","text":"Làm căn cứ theo dõi tình hình nhập kho."},{"id":"lms-ch3-q007-C","text":"Xác định trách nhiệm của những người có liên quan đến việc giao, nhận hàng."},{"id":"lms-ch3-q007-D","text":"Tất cả các nội dung trên.","pinned":true}],"correctOptionId":"lms-ch3-q007-D","explanation":"Phiếu nhập kho là chứng từ chấp hành thuộc nhóm chứng từ hàng tồn kho: xác nhận số lượng thực nhập, là căn cứ theo dõi nhập kho và ghi sổ, đồng thời xác định trách nhiệm của người giao, người nhận. Cả A, B, C đều đúng.","source":"Slide Chương 3, slide 13, 16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u008","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q008","num":"Chứng từ – Lý thuyết – Câu 8","type":"mcq","text":"Trường hợp nào dưới đây có thể làm chứng từ kế toán không đáp ứng yêu cầu hợp lệ?","options":[{"id":"lms-ch3-q008-A","text":"Thiếu chữ ký bắt buộc theo quy định."},{"id":"lms-ch3-q008-B","text":"Không ghi ngày lập chứng từ."},{"id":"lms-ch3-q008-C","text":"Nội dung và số liệu trên chứng từ có sự mâu thuẫn."},{"id":"lms-ch3-q008-D","text":"Tất cả các trường hợp trên.","pinned":true}],"correctOptionId":"lms-ch3-q008-D","explanation":"Chứng từ phải được kiểm tra tính rõ ràng, đầy đủ, chính xác, trung thực của các chỉ tiêu; thiếu yếu tố bắt buộc (chữ ký, ngày lập) hoặc số liệu mâu thuẫn đều khiến chứng từ không hợp lệ.","source":"Slide Chương 3, slide 21, 25–26","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u009","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q009","num":"Chứng từ – Lý thuyết – Câu 9","type":"mcq","text":"Chứng từ nào sau đây mang tính chất tổng hợp thông tin từ nhiều nghiệp vụ/chứng từ có cùng nội dung?","options":[{"id":"lms-ch3-q009-A","text":"Phiếu thu."},{"id":"lms-ch3-q009-B","text":"Phiếu chi."},{"id":"lms-ch3-q009-C","text":"Bảng tổng hợp chứng từ kế toán cùng loại."},{"id":"lms-ch3-q009-D","text":"Hóa đơn GTGT."}],"correctOptionId":"lms-ch3-q009-C","explanation":"Chứng từ tổng hợp dùng để tổng hợp số liệu các chứng từ gốc cùng loại, cùng nghiệp vụ (ví dụ bảng tổng hợp chứng từ gốc, bảng kê nộp séc). Phiếu thu, phiếu chi, hóa đơn GTGT là chứng từ gốc lập cho từng nghiệp vụ.","source":"Slide Chương 3, slide 9","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u010","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q010","num":"Chứng từ – Lý thuyết – Câu 10","type":"mcq","text":"Xét theo mức độ khái quát thông tin, chứng từ được lập trên cơ sở tổng hợp số liệu từ nhiều chứng từ gốc cùng loại được gọi là:","options":[{"id":"lms-ch3-q010-A","text":"Chứng từ mệnh lệnh."},{"id":"lms-ch3-q010-B","text":"Chứng từ tổng hợp."},{"id":"lms-ch3-q010-C","text":"Chứng từ chấp hành."},{"id":"lms-ch3-q010-D","text":"Chứng từ ban đầu."}],"correctOptionId":"lms-ch3-q010-B","explanation":"Phân loại theo trình tự lập: chứng từ ban đầu và chứng từ tổng hợp. Chứng từ lập trên cơ sở tổng hợp nhiều chứng từ gốc cùng loại là chứng từ tổng hợp (chứng từ ghi sổ). Mệnh lệnh và chấp hành là cách phân loại theo công dụng.","source":"Slide Chương 3, slide 8–9, 15–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u011","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q011","num":"Chứng từ – Lý thuyết – Câu 11","type":"mcq","text":"Trưởng phòng đề nghị mua một số thiết bị văn phòng và đề nghị này đã được Giám đốc phê duyệt nhưng doanh nghiệp chưa thực hiện mua hàng. Xét theo công dụng, văn bản đã được phê duyệt này chủ yếu mang tính:","options":[{"id":"lms-ch3-q011-A","text":"Chấp hành."},{"id":"lms-ch3-q011-B","text":"Mệnh lệnh."},{"id":"lms-ch3-q011-C","text":"Tổng hợp."},{"id":"lms-ch3-q011-D","text":"Ghi sổ."}],"correctOptionId":"lms-ch3-q011-B","explanation":"Chứng từ mệnh lệnh truyền đạt mệnh lệnh, chỉ thị (lệnh chi tiền, lệnh xuất kho, đơn xin tạm ứng...), mới chứng minh xuất xứ của nghiệp vụ, chưa nói lên mức độ hoàn thành nên chưa là căn cứ ghi sổ. Chưa mua hàng nên chưa phải chứng từ chấp hành.","source":"Slide Chương 3, slide 15–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u012","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q012","num":"Chứng từ – Lý thuyết – Câu 12","type":"mcq","text":"Việc lập bảng tổng hợp chứng từ kế toán cùng loại có tác dụng chủ yếu là:","options":[{"id":"lms-ch3-q012-A","text":"Hủy bỏ các chứng từ gốc đã lập."},{"id":"lms-ch3-q012-B","text":"Giảm khối lượng và số lần ghi sổ đối với các nghiệp vụ cùng loại."},{"id":"lms-ch3-q012-C","text":"Thay thế hoàn toàn việc kiểm tra chứng từ."},{"id":"lms-ch3-q012-D","text":"Truyền đạt quyết định của người quản lý."}],"correctOptionId":"lms-ch3-q012-B","explanation":"Chứng từ tổng hợp dùng để tổng hợp số liệu các chứng từ gốc cùng loại nhằm giảm bớt khối lượng ghi chép; nó chỉ có giá trị pháp lý khi đính kèm chứng từ gốc nên không hủy/thay thế chứng từ gốc. Truyền đạt quyết định là vai trò của chứng từ mệnh lệnh.","source":"Slide Chương 3, slide 9, 17","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u013","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q013","num":"Chứng từ – Lý thuyết – Câu 13","type":"mcq","text":"Nội dung nào sau đây không phù hợp với yêu cầu lập và quản lý chứng từ kế toán?","options":[{"id":"lms-ch3-q013-A","text":"Mỗi nghiệp vụ kinh tế, tài chính chỉ lập chứng từ kế toán một lần theo quy định."},{"id":"lms-ch3-q013-B","text":"Nội dung trên chứng từ phải rõ ràng, đầy đủ và chính xác."},{"id":"lms-ch3-q013-C","text":"Chứng từ có thể tiêu hủy ngay sau khi số liệu đã được ghi vào sổ kế toán."},{"id":"lms-ch3-q013-D","text":"Nghiệp vụ kinh tế, tài chính phát sinh liên quan đến đơn vị phải được lập chứng từ kế toán theo quy định."}],"correctOptionId":"lms-ch3-q013-C","explanation":"Chứng từ kế toán phải được bảo quản, lưu trữ theo thời hạn quy định (5 năm, 10 năm hoặc vĩnh viễn tùy loại; Nghị định 174/2016/NĐ-CP), không được tiêu hủy ngay sau khi ghi sổ. A, B, D đúng với yêu cầu lập chứng từ.","source":"Slide Chương 3, slide 25, 30","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u014","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q014","num":"Chứng từ – Lý thuyết – Câu 14","type":"mcq","text":"Nội dung nào sau đây thường không thuộc yếu tố bắt buộc chung của mọi chứng từ kế toán?","options":[{"id":"lms-ch3-q014-A","text":"Tên và số hiệu chứng từ."},{"id":"lms-ch3-q014-B","text":"Ngày, tháng, năm lập chứng từ."},{"id":"lms-ch3-q014-C","text":"Định khoản Nợ – Có của nghiệp vụ."},{"id":"lms-ch3-q014-D","text":"Nội dung nghiệp vụ kinh tế, tài chính phát sinh."}],"correctOptionId":"lms-ch3-q014-C","explanation":"Định khoản là nội dung bổ sung (không bắt buộc) của chứng từ, cùng với hình thức thanh toán, thời gian thanh toán, hạn mức công nợ. Tên, số hiệu, ngày lập, nội dung nghiệp vụ là các yếu tố chủ yếu bắt buộc.","source":"Slide Chương 3, slide 21–23","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u015","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q015","num":"Chứng từ – Lý thuyết – Câu 15","type":"mcq","text":"Nhóm thông tin nào dưới đây thuộc các nội dung cơ bản cần có trên chứng từ kế toán?","options":[{"id":"lms-ch3-q015-A","text":"Tên chứng từ và ngày lập chứng từ."},{"id":"lms-ch3-q015-B","text":"Nội dung nghiệp vụ kinh tế, tài chính."},{"id":"lms-ch3-q015-C","text":"Số lượng, đơn giá và số tiền của nghiệp vụ khi phù hợp."},{"id":"lms-ch3-q015-D","text":"Tất cả các nội dung trên.","pinned":true}],"correctOptionId":"lms-ch3-q015-D","explanation":"Các yếu tố chủ yếu gồm tên, thời điểm lập, nội dung nghiệp vụ, quy mô (số lượng, đơn giá, số tiền), bên lập/nhận chứng từ. Cả A, B, C đều đúng.","source":"Slide Chương 3, slide 21–22","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u016","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q016","num":"Chứng từ – Lý thuyết – Câu 16","type":"mcq","text":"Chứng từ được thiết kế để theo dõi nhiều nghiệp vụ cùng loại phát sinh liên tiếp trong một khoảng thời gian nhất định có ưu điểm chủ yếu là:","options":[{"id":"lms-ch3-q016-A","text":"Hạn chế việc phải lập nhiều chứng từ riêng lẻ cho các nghiệp vụ lặp lại."},{"id":"lms-ch3-q016-B","text":"Chỉ sử dụng cho các nghiệp vụ thu tiền."},{"id":"lms-ch3-q016-C","text":"Chỉ sử dụng vào cuối năm tài chính."},{"id":"lms-ch3-q016-D","text":"Không cần có chữ ký của người có liên quan."}],"correctOptionId":"lms-ch3-q016-A","explanation":"Đây là chứng từ nhiều lần (phân loại theo số lần ghi nghiệp vụ trên chứng từ), giúp giảm số chứng từ phải lập cho các nghiệp vụ lặp lại. Các phương án còn lại giới hạn sai phạm vi hoặc bỏ yêu cầu chữ ký.","source":"Slide Chương 3, slide 20","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u017","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q017","num":"Chứng từ – Lý thuyết – Câu 17","type":"mcq","text":"Nhân viên B được duyệt tạm ứng 8.000.000 đồng để đi công tác. Doanh nghiệp đã xuất quỹ tiền mặt và giao tiền cho nhân viên B. Chứng từ nào là căn cứ trực tiếp để kế toán ghi giảm tiền mặt?","options":[{"id":"lms-ch3-q017-A","text":"Giấy đề nghị tạm ứng chưa được duyệt."},{"id":"lms-ch3-q017-B","text":"Quyết định cử nhân viên đi công tác."},{"id":"lms-ch3-q017-C","text":"Phiếu chi đã được lập và ký đầy đủ theo quy định."},{"id":"lms-ch3-q017-D","text":"Báo giá chi phí khách sạn."}],"correctOptionId":"lms-ch3-q017-C","explanation":"Phiếu chi là chứng từ chấp hành chứng minh tiền đã thực chi, là căn cứ ghi giảm tiền mặt. Giấy đề nghị tạm ứng và quyết định cử đi công tác là chứng từ mệnh lệnh; báo giá không phản ánh nghiệp vụ đã hoàn thành.","source":"Slide Chương 3, slide 14–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u018","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q018","num":"Chứng từ – Lý thuyết – Câu 18","type":"mcq","text":"Công ty X bán 300 sản phẩm cho Công ty Y, đơn giá chưa thuế GTGT là 50.000 đồng/sản phẩm, thuế suất GTGT 10%. Công ty Y thanh toán bằng chuyển khoản. Khi thực hiện bán hàng, chứng từ do Công ty X lập để ghi nhận giao dịch bán hàng và thuế GTGT đầu ra là:","options":[{"id":"lms-ch3-q018-A","text":"Phiếu nhập kho."},{"id":"lms-ch3-q018-B","text":"Hóa đơn GTGT."},{"id":"lms-ch3-q018-C","text":"Giấy báo Có do Công ty X lập."},{"id":"lms-ch3-q018-D","text":"Ủy nhiệm chi."}],"correctOptionId":"lms-ch3-q018-B","explanation":"Bên bán lập hóa đơn GTGT để ghi nhận doanh thu và thuế GTGT đầu ra (chứng từ bán hàng). Phiếu nhập kho là chứng từ hàng tồn kho của bên mua; giấy báo Có do ngân hàng lập; ủy nhiệm chi do bên trả tiền lập.","source":"Slide Chương 3, slide 13–14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u019","context":null,"section":"Chứng từ kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q019","num":"Chứng từ – Lý thuyết – Câu 19","type":"mcq","text":"Doanh nghiệp mua nguyên vật liệu nhập kho, giá chưa thuế GTGT là 30.000.000 đồng, thuế GTGT được khấu trừ 3.000.000 đồng và đã thanh toán bằng tiền mặt. Kế toán ghi:<br>Nợ TK 152 – Nguyên liệu, vật liệu: 30.000.000 đồng<br>Nợ TK 133 – Thuế GTGT được khấu trừ: 3.000.000 đồng<br>Có TK 111 – Tiền mặt: 33.000.000 đồng<br>Bộ chứng từ nào phù hợp nhất để làm căn cứ ghi nhận đầy đủ nghiệp vụ trên?","options":[{"id":"lms-ch3-q019-A","text":"Hóa đơn GTGT, phiếu nhập kho và phiếu chi."},{"id":"lms-ch3-q019-B","text":"Phiếu thu, hóa đơn GTGT và giấy báo Có."},{"id":"lms-ch3-q019-C","text":"Phiếu xuất kho, phiếu thu và ủy nhiệm chi."},{"id":"lms-ch3-q019-D","text":"Đơn đặt hàng, báo giá và hợp đồng mua hàng."}],"correctOptionId":"lms-ch3-q019-A","explanation":"Hóa đơn GTGT chứng minh giá mua và thuế GTGT; phiếu nhập kho chứng minh vật liệu đã nhập kho (Nợ 152); phiếu chi chứng minh chi tiền mặt (Có 111). B, C dùng chứng từ thu/xuất không đúng chiều; D chỉ là chứng từ mệnh lệnh, chưa hoàn thành nghiệp vụ.","source":"Slide Chương 3, slide 13–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u020","context":"<b>Câu 1.<\/b> Công ty An Phát mua 500 kg nguyên vật liệu của Công ty Minh Long, đơn giá chưa thuế GTGT là 40.000 đồng/kg, thuế GTGT 10%. Nguyên vật liệu đã được kiểm nhận và nhập kho đầy đủ, doanh nghiệp chưa thanh toán tiền cho người bán.","section":"Chứng từ kế toán – Trắc nghiệm tình huống","questions":[{"id":"lms-ch3-q020","num":"Chứng từ – Tình huống – Câu 1","type":"mcq","text":"Bộ chứng từ phù hợp để làm căn cứ ghi nhận nghiệp vụ mua và nhập kho nguyên vật liệu là:","options":[{"id":"lms-ch3-q020-A","text":"Hóa đơn GTGT và Phiếu nhập kho"},{"id":"lms-ch3-q020-B","text":"Phiếu xuất kho và Phiếu chi"},{"id":"lms-ch3-q020-C","text":"Phiếu thu và Giấy báo Có"},{"id":"lms-ch3-q020-D","text":"Ủy nhiệm chi và Giấy báo Nợ"}],"correctOptionId":"lms-ch3-q020-A","explanation":"Mua chịu và nhập kho: cần hóa đơn GTGT (giá mua, thuế) và phiếu nhập kho (xác nhận nhập kho). Chưa thanh toán nên chưa có phiếu chi, ủy nhiệm chi, giấy báo Nợ; phiếu xuất kho và phiếu thu không liên quan.","source":"Slide Chương 3, slide 13–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u021","context":"<b>Câu 2.<\/b> Công ty Hoàng Gia xuất 200 kg nguyên vật liệu từ kho để sử dụng trực tiếp cho sản xuất sản phẩm. Thủ kho đã giao đủ vật liệu cho bộ phận sản xuất.","section":"Chứng từ kế toán – Trắc nghiệm tình huống","questions":[{"id":"lms-ch3-q021","num":"Chứng từ – Tình huống – Câu 2","type":"mcq","text":"Chứng từ chủ yếu được sử dụng để xác nhận số lượng nguyên vật liệu xuất kho là:","options":[{"id":"lms-ch3-q021-A","text":"Phiếu nhập kho"},{"id":"lms-ch3-q021-B","text":"Phiếu xuất kho"},{"id":"lms-ch3-q021-C","text":"Hóa đơn GTGT"},{"id":"lms-ch3-q021-D","text":"Phiếu thu"}],"correctOptionId":"lms-ch3-q021-B","explanation":"Phiếu xuất kho (chứng từ hàng tồn kho, chứng từ nội bộ) xác nhận số lượng vật liệu đã xuất cho bộ phận sản xuất. Phiếu nhập kho dùng khi nhập; hóa đơn GTGT dùng khi mua/bán; phiếu thu dùng khi thu tiền.","source":"Slide Chương 3, slide 11, 13, 16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u022","context":"<b>Câu 3.<\/b> Công ty Thành Công còn nợ nhà cung cấp 80 triệu đồng tiền mua hàng. Đến hạn thanh toán, doanh nghiệp lập ủy nhiệm chi yêu cầu ngân hàng chuyển 80 triệu đồng từ tài khoản của công ty cho nhà cung cấp. Sau khi giao dịch hoàn tất, ngân hàng thông báo tài khoản của doanh nghiệp đã bị trích tiền.","section":"Chứng từ kế toán – Trắc nghiệm tình huống","questions":[{"id":"lms-ch3-q022","num":"Chứng từ – Tình huống – Câu 3","type":"mcq","text":"Chứng từ/thông tin ngân hàng xác nhận tiền gửi của doanh nghiệp thực tế đã giảm là:","options":[{"id":"lms-ch3-q022-A","text":"Phiếu chi"},{"id":"lms-ch3-q022-B","text":"Phiếu thu"},{"id":"lms-ch3-q022-C","text":"Giấy báo Nợ của ngân hàng"},{"id":"lms-ch3-q022-D","text":"Giấy báo Có của ngân hàng"}],"correctOptionId":"lms-ch3-q022-C","explanation":"Khi tài khoản tiền gửi của doanh nghiệp bị trích tiền, ngân hàng gửi giấy báo Nợ (tiền gửi giảm), là chứng từ bên ngoài, căn cứ ghi Có TK 112. Giấy báo Có báo tiền vào tài khoản; phiếu chi, phiếu thu dùng cho tiền mặt.","source":"Slide Chương 3, slide 11, 14","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u023","context":"<b>Câu 4.<\/b> Công ty Phú Hưng bán một lô hàng hóa cho khách hàng với tổng giá thanh toán 33 triệu đồng, khách hàng thanh toán ngay bằng tiền mặt. Doanh nghiệp đã giao hàng và lập hóa đơn theo quy định.","section":"Chứng từ kế toán – Trắc nghiệm tình huống","questions":[{"id":"lms-ch3-q023","num":"Chứng từ – Tình huống – Câu 4","type":"mcq","text":"Để phản ánh việc thu tiền mặt từ khách hàng, chứng từ kế toán cần lập là:","options":[{"id":"lms-ch3-q023-A","text":"Phiếu nhập kho"},{"id":"lms-ch3-q023-B","text":"Phiếu chi"},{"id":"lms-ch3-q023-C","text":"Phiếu thu"},{"id":"lms-ch3-q023-D","text":"Ủy nhiệm chi"}],"correctOptionId":"lms-ch3-q023-C","explanation":"Thu tiền mặt từ khách hàng phải lập phiếu thu (chứng từ tiền tệ) làm căn cứ ghi tăng tiền mặt. Phiếu chi dùng khi chi tiền; phiếu nhập kho dùng cho hàng tồn kho; ủy nhiệm chi dùng để chuyển khoản.","source":"Slide Chương 3, slide 14, 16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u024","context":"<b>Câu 5.<\/b> Công ty Đại Nam mua công cụ, dụng cụ dùng cho hoạt động kinh doanh, giá chưa thuế GTGT 20 triệu đồng, thuế GTGT 10%. Công cụ dụng cụ đã nhập kho và doanh nghiệp thanh toán ngay cho người bán bằng tiền mặt.","section":"Chứng từ kế toán – Trắc nghiệm tình huống","questions":[{"id":"lms-ch3-q024","num":"Chứng từ – Tình huống – Câu 5","type":"mcq","text":"Bộ chứng từ nào sau đây phù hợp nhất để làm căn cứ ghi nhận mua, nhập kho và thanh toán?","options":[{"id":"lms-ch3-q024-A","text":"Hóa đơn GTGT, Phiếu nhập kho và Phiếu chi"},{"id":"lms-ch3-q024-B","text":"Hóa đơn GTGT, Phiếu xuất kho và Phiếu thu"},{"id":"lms-ch3-q024-C","text":"Phiếu nhập kho, Giấy báo Có và Phiếu thu"},{"id":"lms-ch3-q024-D","text":"Hóa đơn GTGT, Ủy nhiệm chi và Giấy báo Nợ"}],"correctOptionId":"lms-ch3-q024-A","explanation":"Hóa đơn GTGT (giá mua, thuế), phiếu nhập kho (nhập kho CCDC), phiếu chi (thanh toán tiền mặt). B, C có phiếu xuất kho/phiếu thu/giấy báo Có sai chiều; D dùng ủy nhiệm chi và giấy báo Nợ là chứng từ chuyển khoản, trong khi đề thanh toán bằng tiền mặt.","source":"Slide Chương 3, slide 13–16","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u025","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q025","num":"Tài khoản – Lý thuyết – Câu 1","type":"mcq","text":"Trong quá trình doanh nghiệp tiến hành hoạt động sản xuất, kinh doanh, các loại tài sản thường:","options":[{"id":"lms-ch3-q025-A","text":"Giữ nguyên cả về giá trị và hình thái"},{"id":"lms-ch3-q025-B","text":"Thường xuyên có sự biến động"},{"id":"lms-ch3-q025-C","text":"Chỉ có xu hướng tăng lên"},{"id":"lms-ch3-q025-D","text":"Chỉ giảm khi doanh nghiệp bị lỗ"}],"correctOptionId":"lms-ch3-q025-B","explanation":"Tài sản, nguồn vốn luôn vận động theo hai hướng đối lập (tăng/giảm) khi có nghiệp vụ phát sinh, nên cần tài khoản để theo dõi biến động.","source":"Slide Chương 3, slide 33, 39","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u026","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q026","num":"Tài khoản – Lý thuyết – Câu 2","type":"mcq","text":"Nội dung nào mô tả đầy đủ nhất về phương pháp tài khoản kế toán?","options":[{"id":"lms-ch3-q026-A","text":"Phương pháp chỉ dùng để xác định tài sản hiện có tại cuối kỳ"},{"id":"lms-ch3-q026-B","text":"Phương pháp theo dõi thường xuyên, liên tục và có hệ thống tình hình hiện có và biến động của từng đối tượng kế toán"},{"id":"lms-ch3-q026-C","text":"Phương pháp dùng để lập chứng từ khi nghiệp vụ phát sinh"},{"id":"lms-ch3-q026-D","text":"Phương pháp dùng để xác định kết quả kinh doanh vào cuối năm"}],"correctOptionId":"lms-ch3-q026-B","explanation":"Tài khoản kế toán là phương pháp theo dõi một cách thường xuyên, liên tục và có hệ thống tình hình hiện có và sự biến động của từng đối tượng kế toán cụ thể. A thiếu phần biến động; C là chứng từ; D là xác định kết quả kinh doanh.","source":"Slide Chương 3, slide 35–36","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u027","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q027","num":"Tài khoản – Lý thuyết – Câu 3","type":"mcq","text":"Xét về bản chất, tài khoản kế toán được sử dụng nhằm:","options":[{"id":"lms-ch3-q027-A","text":"Theo dõi riêng từng đối tượng kế toán"},{"id":"lms-ch3-q027-B","text":"Phản ánh tình hình tăng, giảm của đối tượng kế toán"},{"id":"lms-ch3-q027-C","text":"Hệ thống hóa thông tin kế toán một cách thường xuyên và liên tục"},{"id":"lms-ch3-q027-D","text":"Tất cả các nội dung trên","pinned":true}],"correctOptionId":"lms-ch3-q027-D","explanation":"Tài khoản vừa theo dõi riêng từng đối tượng, vừa phản ánh tăng/giảm, vừa hệ thống hóa thông tin liên tục nên cả A, B, C đều đúng.","source":"Slide Chương 3, slide 33, 36–37","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u028","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q028","num":"Tài khoản – Lý thuyết – Câu 4","type":"mcq","text":"Việc sử dụng hệ thống tài khoản kế toán giúp doanh nghiệp:","options":[{"id":"lms-ch3-q028-A","text":"Hệ thống hóa thông tin phục vụ lập báo cáo tài chính"},{"id":"lms-ch3-q028-B","text":"Cung cấp thông tin chi tiết phục vụ quản trị và kiểm soát tài sản"},{"id":"lms-ch3-q028-C","text":"Thực hiện cả hai mục đích trên","pinned":true},{"id":"lms-ch3-q028-D","text":"Chỉ phục vụ cơ quan thuế"}],"correctOptionId":"lms-ch3-q028-C","explanation":"Thông tin trên tài khoản là căn cứ lập BCTC và đồng thời cung cấp thông tin chi tiết cho quản trị, bảo vệ tài sản; không chỉ phục vụ cơ quan thuế.","source":"Slide Chương 3, slide 33–34","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u029","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q029","num":"Tài khoản – Lý thuyết – Câu 5","type":"mcq","text":"Thông tin nào được phản ánh thông qua tài khoản kế toán?","options":[{"id":"lms-ch3-q029-A","text":"Tình hình hiện có của đối tượng kế toán"},{"id":"lms-ch3-q029-B","text":"Sự tăng, giảm của đối tượng kế toán trong kỳ"},{"id":"lms-ch3-q029-C","text":"Cả tình hình hiện có và sự biến động của đối tượng kế toán"},{"id":"lms-ch3-q029-D","text":"Chỉ các nghiệp vụ làm phát sinh tiền"}],"correctOptionId":"lms-ch3-q029-C","explanation":"Tài khoản phản ánh số dư (tình hình hiện có đầu kỳ, cuối kỳ) và số phát sinh (biến động tăng, giảm trong kỳ), với mọi đối tượng kế toán, không chỉ tiền.","source":"Slide Chương 3, slide 33, 38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u030","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q030","num":"Tài khoản – Lý thuyết – Câu 6","type":"mcq","text":"Hai bên Nợ và Có của một tài khoản được thiết kế để:","options":[{"id":"lms-ch3-q030-A","text":"Phản ánh hai mặt biến động của đối tượng kế toán"},{"id":"lms-ch3-q030-B","text":"Phân biệt kế toán tài chính và kế toán quản trị"},{"id":"lms-ch3-q030-C","text":"Phân biệt nghiệp vụ hợp pháp và không hợp pháp"},{"id":"lms-ch3-q030-D","text":"Phân biệt nghiệp vụ bằng tiền và không bằng tiền"}],"correctOptionId":"lms-ch3-q030-A","explanation":"Đối tượng kế toán vận động theo hai hướng đối lập (tăng/giảm) nên tài khoản chia hai bên, bên trái quy ước là Nợ, bên phải là Có; Nợ/Có chỉ là quy ước, không có ý nghĩa kinh tế.","source":"Slide Chương 3, slide 39–40","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u031","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q031","num":"Tài khoản – Lý thuyết – Câu 7","type":"mcq","text":"Tổng số phát sinh Nợ hoặc Có của một tài khoản trong kỳ phản ánh:","options":[{"id":"lms-ch3-q031-A","text":"Giá trị hiện có của đối tượng tại một thời điểm"},{"id":"lms-ch3-q031-B","text":"Tổng biến động tăng hoặc giảm của đối tượng trong kỳ"},{"id":"lms-ch3-q031-C","text":"Giá trị tài sản tại ngày thành lập doanh nghiệp"},{"id":"lms-ch3-q031-D","text":"Số dư cuối kỳ của tài khoản"}],"correctOptionId":"lms-ch3-q031-B","explanation":"Số phát sinh phản ánh sự biến động của đối tượng trong kỳ; còn giá trị hiện có tại một thời điểm là số dư (SDCK = SDĐK + PS tăng – PS giảm).","source":"Slide Chương 3, slide 38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u032","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q032","num":"Tài khoản – Lý thuyết – Câu 8","type":"mcq","text":"Số dư cuối kỳ của một tài khoản cho biết:","options":[{"id":"lms-ch3-q032-A","text":"Giá trị hiện có của đối tượng kế toán tại thời điểm cuối kỳ"},{"id":"lms-ch3-q032-B","text":"Tổng giá trị nghiệp vụ phát sinh trong kỳ"},{"id":"lms-ch3-q032-C","text":"Tổng doanh thu của doanh nghiệp"},{"id":"lms-ch3-q032-D","text":"Tổng số tiền thu và chi trong kỳ"}],"correctOptionId":"lms-ch3-q032-A","explanation":"Số dư phản ánh tình hình hiện có của đối tượng kế toán tại một thời điểm (đầu kỳ, cuối kỳ).","source":"Slide Chương 3, slide 38","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u033","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q033","num":"Tài khoản – Lý thuyết – Câu 9","type":"mcq","text":"Nếu phân loại theo nội dung kinh tế chủ yếu, hệ thống tài khoản có thể bao gồm các tài khoản phản ánh:","options":[{"id":"lms-ch3-q033-A","text":"Tài sản, nguồn vốn và quá trình kinh doanh"},{"id":"lms-ch3-q033-B","text":"Chỉ tài sản và tiền"},{"id":"lms-ch3-q033-C","text":"Chỉ doanh thu và chi phí"},{"id":"lms-ch3-q033-D","text":"Chỉ tài sản dài hạn và vốn chủ sở hữu"}],"correctOptionId":"lms-ch3-q033-A","explanation":"Theo nội dung kinh tế, tài khoản gồm tài khoản phản ánh tài sản, nguồn vốn và quá trình kinh doanh (chi phí, doanh thu, xác định kết quả).","source":"Slide Chương 3, slide 43","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u034","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q034","num":"Tài khoản – Lý thuyết – Câu 10","type":"mcq","text":"Trong số hiệu của tài khoản kế toán, chữ số đầu tiên thường được sử dụng để nhận biết:","options":[{"id":"lms-ch3-q034-A","text":"Tài khoản chi tiết"},{"id":"lms-ch3-q034-B","text":"Loại tài khoản"},{"id":"lms-ch3-q034-C","text":"Thứ tự nghiệp vụ phát sinh"},{"id":"lms-ch3-q034-D","text":"Năm tài chính"}],"correctOptionId":"lms-ch3-q034-B","explanation":"Hệ thống tài khoản chia thành các loại (loại 1, 2: tài sản; loại 3: nợ phải trả; loại 4: vốn chủ sở hữu; loại 5, 6...: doanh thu, chi phí...); chữ số đầu là số hiệu loại tài khoản.","source":"Slide Chương 3, slide 62; TT200/2014/TT-BTC (hệ thống tài khoản)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u035","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q035","num":"Tài khoản – Lý thuyết – Câu 11","type":"mcq","text":"Chữ số thứ hai trong số hiệu tài khoản thường có ý nghĩa xác định:","options":[{"id":"lms-ch3-q035-A","text":"Nhóm tài khoản trong loại tài khoản"},{"id":"lms-ch3-q035-B","text":"Thứ tự chứng từ"},{"id":"lms-ch3-q035-C","text":"Loại hình doanh nghiệp"},{"id":"lms-ch3-q035-D","text":"Tháng phát sinh nghiệp vụ"}],"correctOptionId":"lms-ch3-q035-A","explanation":"Chữ số thứ hai xác định nhóm tài khoản trong loại (ví dụ 11x: tiền, 15x: hàng tồn kho).","source":"Slide Chương 3, slide 62; TT200/2014/TT-BTC (hệ thống tài khoản)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u036","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q036","num":"Tài khoản – Lý thuyết – Câu 12","type":"mcq","text":"Trong cấu trúc tài khoản ba chữ số, chữ số thứ ba thường dùng để:","options":[{"id":"lms-ch3-q036-A","text":"Xác định loại tài khoản"},{"id":"lms-ch3-q036-B","text":"Xác định số thứ tự của tài khoản trong nhóm"},{"id":"lms-ch3-q036-C","text":"Xác định năm sử dụng tài khoản"},{"id":"lms-ch3-q036-D","text":"Xác định tài khoản thuộc tài sản hay nguồn vốn"}],"correctOptionId":"lms-ch3-q036-B","explanation":"Chữ số thứ ba là số thứ tự của tài khoản trong nhóm (ví dụ 111, 112, 113 cùng nhóm 11). Loại tài khoản do chữ số đầu xác định.","source":"Slide Chương 3, slide 62; TT200/2014/TT-BTC (hệ thống tài khoản)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u037","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q037","num":"Tài khoản – Lý thuyết – Câu 13","type":"mcq","text":"Đối với tài khoản phản ánh tài sản, nguyên tắc ghi chép thông thường là:","options":[{"id":"lms-ch3-q037-A","text":"Tăng bên Nợ, giảm bên Có và thường có số dư Nợ"},{"id":"lms-ch3-q037-B","text":"Tăng bên Có, giảm bên Nợ và thường có số dư Có"},{"id":"lms-ch3-q037-C","text":"Tăng và giảm đều ghi bên Nợ"},{"id":"lms-ch3-q037-D","text":"Tăng và giảm đều ghi bên Có"}],"correctOptionId":"lms-ch3-q037-A","explanation":"Tài khoản tài sản: SDĐK và số phát sinh tăng ghi bên Nợ, số phát sinh giảm ghi bên Có, số dư cuối kỳ bên Nợ. B là kết cấu của tài khoản nguồn vốn.","source":"Slide Chương 3, slide 44","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u038","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q038","num":"Tài khoản – Lý thuyết – Câu 14","type":"mcq","text":"TK 211 – Tài sản cố định hữu hình được sử dụng trực tiếp để phản ánh giá trị hiện có và biến động của TSCĐ hữu hình. Xét theo kết cấu, đây là:","options":[{"id":"lms-ch3-q038-A","text":"Tài khoản điều chỉnh"},{"id":"lms-ch3-q038-B","text":"Tài khoản cơ bản"},{"id":"lms-ch3-q038-C","text":"Tài khoản phân phối"},{"id":"lms-ch3-q038-D","text":"Tài khoản doanh thu"}],"correctOptionId":"lms-ch3-q038-B","explanation":"TK 211 phản ánh trực tiếp đối tượng tài sản nên là tài khoản chủ yếu (cơ bản). Tài khoản điều chỉnh đi kèm tài khoản chủ yếu (như TK 214); doanh thu thuộc nhóm quá trình kinh doanh. Phân loại 'tài khoản phân phối' không có trong slide.","source":"Slide Chương 3, slide 43–44, 56","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u039","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q039","num":"Tài khoản – Lý thuyết – Câu 15","type":"mcq","text":"TK 131 – Phải thu của khách hàng có thể:","options":[{"id":"lms-ch3-q039-A","text":"Chỉ có số dư Nợ"},{"id":"lms-ch3-q039-B","text":"Chỉ có số dư Có"},{"id":"lms-ch3-q039-C","text":"Có số dư Nợ hoặc số dư Có tùy từng đối tượng và tình huống"},{"id":"lms-ch3-q039-D","text":"Không có số dư cuối kỳ"}],"correctOptionId":"lms-ch3-q039-C","explanation":"TK 131 là tài khoản hỗn hợp (vừa tài sản, vừa nguồn vốn): dư Nợ là phải thu, dư Có là khách hàng trả trước; mở chi tiết từng khách hàng, không bù trừ khi lập báo cáo.","source":"Slide Chương 3, slide 52–55","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u040","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q040","num":"Tài khoản – Lý thuyết – Câu 16","type":"mcq","text":"Tài khoản phản ánh nợ phải trả và vốn chủ sở hữu thông thường có nguyên tắc:","options":[{"id":"lms-ch3-q040-A","text":"Tăng bên Nợ, giảm bên Có, dư Nợ"},{"id":"lms-ch3-q040-B","text":"Tăng bên Có, giảm bên Nợ, thường dư Có"},{"id":"lms-ch3-q040-C","text":"Tăng và giảm đều bên Có"},{"id":"lms-ch3-q040-D","text":"Không có số dư"}],"correctOptionId":"lms-ch3-q040-B","explanation":"Tài khoản nguồn vốn: số phát sinh tăng và số dư ghi bên Có; số phát sinh giảm ghi bên Nợ.","source":"Slide Chương 3, slide 49","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u041","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q041","num":"Tài khoản – Lý thuyết – Câu 17","type":"mcq","text":"TK 214 – Hao mòn tài sản cố định thuộc loại:","options":[{"id":"lms-ch3-q041-A","text":"Tài khoản tài sản thông thường"},{"id":"lms-ch3-q041-B","text":"Tài khoản điều chỉnh giảm tài sản"},{"id":"lms-ch3-q041-C","text":"Tài khoản doanh thu"},{"id":"lms-ch3-q041-D","text":"Tài khoản chi phí"}],"correctOptionId":"lms-ch3-q041-B","explanation":"TK 214 luôn đi kèm TK 211 và điều chỉnh giảm giá trị TSCĐ để phản ánh giá trị thực tế còn lại (nguyên giá trừ hao mòn lũy kế).","source":"Slide Chương 3, slide 56–57, 59","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u042","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q042","num":"Tài khoản – Lý thuyết – Câu 18","type":"mcq","text":"Đối với tài khoản điều chỉnh giảm tài sản, kết cấu thông thường là:","options":[{"id":"lms-ch3-q042-A","text":"Tăng bên Có, giảm bên Nợ và thường có số dư Có"},{"id":"lms-ch3-q042-B","text":"Tăng bên Nợ, giảm bên Có và có số dư Nợ"},{"id":"lms-ch3-q042-C","text":"Tăng và giảm đều ghi bên Nợ"},{"id":"lms-ch3-q042-D","text":"Không bao giờ có số dư cuối kỳ"}],"correctOptionId":"lms-ch3-q042-A","explanation":"Kết cấu của tài khoản điều chỉnh giảm tài sản ngược với tài khoản tài sản mà nó điều chỉnh: tăng bên Có, giảm bên Nợ, số dư bên Có.","source":"Slide Chương 3, slide 57, 59","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u043","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q043","num":"Tài khoản – Lý thuyết – Câu 19","type":"mcq","text":"Trong kỳ, doanh nghiệp trích khấu hao TSCĐ 20 triệu đồng. Đối với TK 214 – Hao mòn TSCĐ, khoản hao mòn tăng thêm được ghi:","options":[{"id":"lms-ch3-q043-A","text":"Bên Nợ TK 214"},{"id":"lms-ch3-q043-B","text":"Bên Có TK 214"},{"id":"lms-ch3-q043-C","text":"Đồng thời hai bên TK 214"},{"id":"lms-ch3-q043-D","text":"Không ghi vào TK 214"}],"correctOptionId":"lms-ch3-q043-B","explanation":"Trích khấu hao làm hao mòn lũy kế tăng, ghi Có TK 214 (đối ứng Nợ TK chi phí). Bên Nợ TK 214 chỉ ghi khi hao mòn giảm (thanh lý, nhượng bán).","source":"Slide Chương 3, slide 57, 59","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u044","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q044","num":"Tài khoản – Lý thuyết – Câu 20","type":"mcq","text":"Trường hợp nào dưới đây làm phát sinh nghiệp vụ cần ghi nhận vào sổ kế toán?","options":[{"id":"lms-ch3-q044-A","text":"Doanh nghiệp ký biên bản ghi nhớ về việc mua máy móc trong năm sau"},{"id":"lms-ch3-q044-B","text":"Doanh nghiệp nhận báo giá từ nhà cung cấp"},{"id":"lms-ch3-q044-C","text":"Doanh nghiệp nhận máy móc trị giá 180 triệu đồng và chưa thanh toán"},{"id":"lms-ch3-q044-D","text":"Giám đốc dự kiến tuyển thêm nhân viên"}],"correctOptionId":"lms-ch3-q044-C","explanation":"Chỉ nghiệp vụ kinh tế đã phát sinh và hoàn thành, làm thay đổi tài sản/nguồn vốn mới được ghi sổ. Nhận máy móc chưa trả tiền làm TSCĐ tăng và phải trả người bán tăng. Biên bản ghi nhớ, báo giá, dự kiến là chứng từ mệnh lệnh/kế hoạch, chưa hoàn thành.","source":"Slide Chương 3, slide 5, 15","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u045","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q045","num":"Tài khoản – Lý thuyết – Câu 21","type":"mcq","text":"Sự kiện nào dưới đây làm thay đổi tài sản hoặc nguồn vốn của doanh nghiệp và được kế toán ghi nhận?","options":[{"id":"lms-ch3-q045-A","text":"Khách hàng chuyển khoản thanh toán khoản nợ 70 triệu đồng"},{"id":"lms-ch3-q045-B","text":"Phòng nhân sự phỏng vấn ứng viên"},{"id":"lms-ch3-q045-C","text":"Giám đốc dự kiến mở thêm chi nhánh"},{"id":"lms-ch3-q045-D","text":"Nhân viên lập kế hoạch bán hàng tháng sau"}],"correctOptionId":"lms-ch3-q045-A","explanation":"Khách hàng trả nợ làm tiền gửi ngân hàng tăng và phải thu khách hàng giảm (Nợ 112/Có 131). Các sự kiện còn lại chưa làm thay đổi tài sản, nguồn vốn.","source":"Slide Chương 3, slide 5, 65","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u046","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q046","num":"Tài khoản – Lý thuyết – Câu 22","type":"mcq","text":"Doanh nghiệp mua hàng hóa trị giá 90 triệu đồng, hàng đã nhập kho nhưng chưa thanh toán. Nghiệp vụ này làm:","options":[{"id":"lms-ch3-q046-A","text":"Hàng hóa tăng và phải trả người bán tăng"},{"id":"lms-ch3-q046-B","text":"Hàng hóa tăng và tiền mặt giảm"},{"id":"lms-ch3-q046-C","text":"Tiền gửi ngân hàng tăng và hàng hóa giảm"},{"id":"lms-ch3-q046-D","text":"Phải thu khách hàng tăng và hàng hóa tăng"}],"correctOptionId":"lms-ch3-q046-A","explanation":"Nợ TK 156 / Có TK 331: 90 triệu: tài sản (hàng hóa) tăng, nguồn vốn (nợ phải trả người bán) tăng. Chưa thanh toán nên tiền không giảm.","source":"Slide Chương 3, slide 66","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u047","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q047","num":"Tài khoản – Lý thuyết – Câu 23","type":"mcq","text":"Nguyên tắc cơ bản của ghi sổ kép yêu cầu:","options":[{"id":"lms-ch3-q047-A","text":"Tổng số tiền ghi Nợ của một nghiệp vụ phải bằng tổng số tiền ghi Có"},{"id":"lms-ch3-q047-B","text":"Mọi tài khoản đều phải có số dư Nợ"},{"id":"lms-ch3-q047-C","text":"Mỗi nghiệp vụ chỉ được ghi vào một tài khoản"},{"id":"lms-ch3-q047-D","text":"Mọi nghiệp vụ đều phải liên quan đến tiền"}],"correctOptionId":"lms-ch3-q047-A","explanation":"Ghi sổ kép phản ánh mỗi nghiệp vụ vào ít nhất hai tài khoản, một ghi Nợ, một ghi Có, với số tiền bằng nhau; do đó tổng phát sinh Nợ = tổng phát sinh Có.","source":"Slide Chương 3, slide 64, 70","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u048","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q048","num":"Tài khoản – Lý thuyết – Câu 24","type":"mcq","text":"Doanh nghiệp mua nguyên vật liệu và thanh toán ngay bằng tiền gửi ngân hàng. Xét theo phương trình kế toán, nghiệp vụ thuộc loại:","options":[{"id":"lms-ch3-q048-A","text":"Tài sản tăng – Tài sản giảm"},{"id":"lms-ch3-q048-B","text":"Tài sản tăng – Nợ phải trả tăng"},{"id":"lms-ch3-q048-C","text":"Tài sản giảm – Nợ phải trả giảm"},{"id":"lms-ch3-q048-D","text":"Tài sản tăng – Vốn chủ sở hữu tăng"}],"correctOptionId":"lms-ch3-q048-A","explanation":"Nợ TK 152 / Có TK 112: nguyên vật liệu (tài sản) tăng, tiền gửi (tài sản) giảm, tổng tài sản không đổi.","source":"Slide Chương 3, slide 65","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u049","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q049","num":"Tài khoản – Lý thuyết – Câu 25","type":"mcq","text":"Doanh nghiệp xuất quỹ tiền mặt tạm ứng cho nhân viên C số tiền 12 triệu đồng. Định khoản phù hợp là:","options":[{"id":"lms-ch3-q049-A","text":"Nợ TK 111/Có TK 141"},{"id":"lms-ch3-q049-B","text":"Nợ TK 141/Có TK 111"},{"id":"lms-ch3-q049-C","text":"Nợ TK 334/Có TK 111"},{"id":"lms-ch3-q049-D","text":"Nợ TK 111/Có TK 334"}],"correctOptionId":"lms-ch3-q049-B","explanation":"Tạm ứng làm khoản tạm ứng (TK 141) tăng ghi Nợ, tiền mặt giảm ghi Có TK 111. A ngược chiều; C, D liên quan phải trả người lao động, không đúng bản chất.","source":"Slide Chương 3, slide 65, 69","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u050","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q050","num":"Tài khoản – Lý thuyết – Câu 26","type":"mcq","text":"Khách hàng chuyển khoản ứng trước cho doanh nghiệp 40 triệu đồng để mua hàng trong tháng sau. Ngân hàng đã báo Có. Kế toán ghi:","options":[{"id":"lms-ch3-q050-A","text":"Nợ TK 112/Có TK 131"},{"id":"lms-ch3-q050-B","text":"Nợ TK 131/Có TK 112"},{"id":"lms-ch3-q050-C","text":"Nợ TK 111/Có TK 131"},{"id":"lms-ch3-q050-D","text":"Nợ TK 112/Có TK 511"}],"correctOptionId":"lms-ch3-q050-A","explanation":"Tiền gửi tăng: Nợ TK 112; khách hàng trả trước làm nghĩa vụ phải trả tăng: Có TK 131 (slide: KH-Y trả trước tiền là Có TK PTKH). Không ghi Có 511 vì chưa giao hàng nên chưa có doanh thu; không ghi Nợ 111 vì nhận bằng chuyển khoản.","source":"Slide Chương 3, slide 52–53","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u051","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q051","num":"Tài khoản – Lý thuyết – Câu 27","type":"mcq","text":"Doanh nghiệp mua một TSCĐ hữu hình có giá chưa thuế GTGT là 600 triệu đồng, thuế GTGT 10%, chưa thanh toán. Doanh nghiệp áp dụng phương pháp khấu trừ thuế. Định khoản đúng là:","options":[{"id":"lms-ch3-q051-A","text":"Nợ TK 211: 600; Nợ TK 133: 60/Có TK 331: 660"},{"id":"lms-ch3-q051-B","text":"Nợ TK 211: 660/Có TK 331: 660"},{"id":"lms-ch3-q051-C","text":"Nợ TK 211: 600/Có TK 331: 600"},{"id":"lms-ch3-q051-D","text":"Nợ TK 211: 660/Có TK 133: 60; Có TK 331: 600"}],"correctOptionId":"lms-ch3-q051-A","explanation":"Thuế GTGT đầu vào = 600 x 10% = 60. Nguyên giá TSCĐ = 600 (thuế được khấu trừ ghi riêng Nợ TK 133), phải trả người bán = 660. Kiểm tra: Nợ 600 + 60 = Có 660. B, C tính sai giá trị/bỏ thuế; D ghi Có 133 sai bản chất.","source":"Slide Chương 3, slide 61, 69; TT200 (TK 211, 133)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u052","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q052","num":"Tài khoản – Lý thuyết – Câu 28","type":"mcq","text":"Doanh nghiệp mua hàng hóa có giá chưa thuế 200 triệu đồng, thuế GTGT 10%, chưa thanh toán cho nhà cung cấp. Doanh nghiệp áp dụng phương pháp khấu trừ. Định khoản đúng là:","options":[{"id":"lms-ch3-q052-A","text":"Nợ TK 156: 200; Nợ TK 133: 20/Có TK 331: 220"},{"id":"lms-ch3-q052-B","text":"Nợ TK 156: 220/Có TK 331: 220"},{"id":"lms-ch3-q052-C","text":"Nợ TK 156: 200/Có TK 111: 200"},{"id":"lms-ch3-q052-D","text":"Nợ TK 156: 200/Có TK 3331: 20; Có TK 331: 180"}],"correctOptionId":"lms-ch3-q052-A","explanation":"Thuế GTGT đầu vào = 20 ghi Nợ TK 133; hàng hóa 200 ghi Nợ TK 156; phải trả người bán 220 ghi Có TK 331. Nợ 220 = Có 220. B gộp thuế vào giá hàng (không phải phương pháp khấu trừ); C chưa thanh toán nên không Có 111; D sai tài khoản và số tiền.","source":"Slide Chương 3, slide 61, 69; TT200 (TK 156, 133, 331)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u053","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q053","num":"Tài khoản – Lý thuyết – Câu 29","type":"mcq","text":"Doanh nghiệp vay ngân hàng 300 triệu đồng, thời hạn vay 8 tháng. Ngân hàng chuyển toàn bộ số tiền vào tài khoản thanh toán của doanh nghiệp. Kế toán ghi:","options":[{"id":"lms-ch3-q053-A","text":"Nợ TK 341/Có TK 112: 300"},{"id":"lms-ch3-q053-B","text":"Nợ TK 112/Có TK 341: 300"},{"id":"lms-ch3-q053-C","text":"Nợ TK 111/Có TK 411: 300"},{"id":"lms-ch3-q053-D","text":"Nợ TK 112/Có TK 411: 300"}],"correctOptionId":"lms-ch3-q053-B","explanation":"Tiền gửi ngân hàng tăng ghi Nợ TK 112, khoản vay ngắn hạn (8 tháng) tăng ghi Có TK 341. A ngược chiều (là trả nợ vay); C, D ghi Có 411 (vốn chủ sở hữu) là sai bản chất.","source":"Slide Chương 3, slide 65–66, 50","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u054","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q054","num":"Tài khoản – Lý thuyết – Câu 30","type":"mcq","text":"Doanh nghiệp mua nguyên vật liệu nhập kho, giá chưa thuế GTGT 50 triệu đồng, thuế GTGT 10%, đã thanh toán bằng tiền mặt. Doanh nghiệp áp dụng phương pháp khấu trừ. Bút toán đúng là:","options":[{"id":"lms-ch3-q054-A","text":"Nợ TK 152: 50; Nợ TK 133: 5/Có TK 111: 55"},{"id":"lms-ch3-q054-B","text":"Nợ TK 152: 55/Có TK 111: 55"},{"id":"lms-ch3-q054-C","text":"Nợ TK 152: 50/Có TK 331: 50"},{"id":"lms-ch3-q054-D","text":"Nợ TK 152: 55/Có TK 133: 5; Có TK 111: 50"}],"correctOptionId":"lms-ch3-q054-A","explanation":"Thuế GTGT = 50 x 10% = 5; Nợ TK 152: 50, Nợ TK 133: 5; Có TK 111: 55 (cân đối 55 = 55). B không tách thuế; C ghi Có 331 trong khi đã trả tiền mặt; D ghi sai bên của TK 133.","source":"Slide Chương 3, slide 61, 69; TT200 (TK 152, 133)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u055","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q055","num":"Tài khoản – Lý thuyết – Câu 31","type":"mcq","text":"Cuối kỳ, để kiểm tra sự phù hợp giữa số liệu chi tiết của từng đối tượng và tài khoản tổng hợp tương ứng, kế toán thường lập:","options":[{"id":"lms-ch3-q055-A","text":"Báo cáo kết quả hoạt động kinh doanh"},{"id":"lms-ch3-q055-B","text":"Bảng tổng hợp chi tiết"},{"id":"lms-ch3-q055-C","text":"Báo cáo lưu chuyển tiền tệ"},{"id":"lms-ch3-q055-D","text":"Phiếu kế toán"}],"correctOptionId":"lms-ch3-q055-B","explanation":"Bảng tổng hợp chi tiết kê số liệu ở các tài khoản cấp 2, sổ thẻ chi tiết theo từng tài khoản tổng hợp, sau đó đối chiếu với số liệu trên tài khoản tổng hợp. Các báo cáo tài chính không dùng cho mục đích đối chiếu này.","source":"Slide Chương 3, slide 93, 98","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u056","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q056","num":"Tài khoản – Lý thuyết – Câu 32","type":"mcq","text":"Nhận định nào đúng về mối quan hệ giữa tài khoản tổng hợp và tài khoản chi tiết?","options":[{"id":"lms-ch3-q056-A","text":"Số liệu chi tiết không liên quan đến tài khoản tổng hợp"},{"id":"lms-ch3-q056-B","text":"Tổng số dư của các tài khoản chi tiết phải phù hợp với số dư của tài khoản tổng hợp tương ứng"},{"id":"lms-ch3-q056-C","text":"Tài khoản chi tiết chỉ phản ánh số lượng, không phản ánh giá trị"},{"id":"lms-ch3-q056-D","text":"Tài khoản tổng hợp chỉ được lập vào cuối năm"}],"correctOptionId":"lms-ch3-q056-B","explanation":"Tài khoản chi tiết mở cho tài khoản tổng hợp, số dư và số phát sinh của các tài khoản chi tiết cộng lại phải bằng tài khoản tổng hợp tương ứng. Kế toán chi tiết dùng thước đo giá trị, hiện vật và thời gian lao động.","source":"Slide Chương 3, slide 72–73","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u057","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q057","num":"Tài khoản – Lý thuyết – Câu 33","type":"mcq","text":"Công cụ thường được sử dụng để kiểm tra tính cân đối của việc ghi sổ kép giữa các tài khoản là:","options":[{"id":"lms-ch3-q057-A","text":"Bảng cân đối tài khoản"},{"id":"lms-ch3-q057-B","text":"Phiếu nhập kho"},{"id":"lms-ch3-q057-C","text":"Sổ quỹ tiền mặt"},{"id":"lms-ch3-q057-D","text":"Hóa đơn GTGT"}],"correctOptionId":"lms-ch3-q057-A","explanation":"Bảng cân đối tài khoản kê SDĐK, số phát sinh, SDCK của các tài khoản tổng hợp và kiểm tra: tổng PS Nợ = tổng PS Có, tổng dư Nợ = tổng dư Có. Phiếu nhập kho, hóa đơn là chứng từ; sổ quỹ chỉ theo dõi tiền mặt.","source":"Slide Chương 3, slide 93–94","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u058","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q058","num":"Tài khoản – Lý thuyết – Câu 34","type":"mcq","text":"Phát biểu nào đúng về Bảng cân đối tài khoản?","options":[{"id":"lms-ch3-q058-A","text":"Là Báo cáo tình hình tài chính của doanh nghiệp"},{"id":"lms-ch3-q058-B","text":"Là Báo cáo kết quả hoạt động kinh doanh"},{"id":"lms-ch3-q058-C","text":"Là bảng tổng hợp số dư đầu kỳ, số phát sinh và số dư cuối kỳ của các tài khoản"},{"id":"lms-ch3-q058-D","text":"Là chứng từ kế toán dùng để ghi nhận từng nghiệp vụ kinh tế"}],"correctOptionId":"lms-ch3-q058-C","explanation":"Bảng cân đối tài khoản là bảng kê tất cả SDĐK, số phát sinh trong kỳ và SDCK của các tài khoản tổng hợp, dùng để đối chiếu, kiểm tra; không phải báo cáo tài chính cũng không phải chứng từ.","source":"Slide Chương 3, slide 94","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u059","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q059","num":"Tài khoản – Lý thuyết – Câu 35","type":"mcq","text":"Cuối kỳ, TK 211 – Tài sản cố định hữu hình có số dư Nợ 2 tỷ đồng. Trên Báo cáo tình hình tài chính, số liệu liên quan đến TSCĐ hữu hình được trình bày:","options":[{"id":"lms-ch3-q059-A","text":"Trong phần tài sản"},{"id":"lms-ch3-q059-B","text":"Trong phần nợ phải trả"},{"id":"lms-ch3-q059-C","text":"Trong phần vốn chủ sở hữu"},{"id":"lms-ch3-q059-D","text":"Trong phần doanh thu"}],"correctOptionId":"lms-ch3-q059-A","explanation":"TK 211 là tài khoản tài sản, dư Nợ, nên được trình bày ở phần tài sản (tài sản dài hạn). Số liệu tài khoản là căn cứ lập báo cáo tài chính.","source":"Slide Chương 3, slide 34, 44","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u060","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q060","num":"Tài khoản – Lý thuyết – Câu 36","type":"mcq","text":"Một khoản mục có bản chất là khoản điều chỉnh giảm vốn chủ sở hữu và có số dư Nợ cuối kỳ, khi trình bày trên Báo cáo tình hình tài chính sẽ:","options":[{"id":"lms-ch3-q060-A","text":"Ghi tăng phần tài sản"},{"id":"lms-ch3-q060-B","text":"Ghi giảm phần vốn chủ sở hữu theo quy định trình bày"},{"id":"lms-ch3-q060-C","text":"Ghi tăng nợ phải trả"},{"id":"lms-ch3-q060-D","text":"Ghi tăng doanh thu"}],"correctOptionId":"lms-ch3-q060-B","explanation":"Tài khoản điều chỉnh giảm vốn chủ sở hữu (như cổ phiếu mua lại của chính mình) có dư Nợ, trình bày là khoản âm (ghi giảm) trong phần vốn chủ sở hữu.","source":"Slide Chương 3, slide 57, 60","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u061","context":null,"section":"Tài khoản kế toán – Trắc nghiệm lý thuyết","questions":[{"id":"lms-ch3-q061","num":"Tài khoản – Lý thuyết – Câu 37","type":"mcq","text":"Nếu TK 421 – Lợi nhuận sau thuế chưa phân phối có số dư Nợ tại ngày cuối năm, khoản này phản ánh doanh nghiệp đang có lỗ lũy kế và được trình bày:","options":[{"id":"lms-ch3-q061-A","text":"Số dương trong phần tài sản"},{"id":"lms-ch3-q061-B","text":"Số âm trong phần tài sản"},{"id":"lms-ch3-q061-C","text":"Số dương trong phần vốn chủ sở hữu"},{"id":"lms-ch3-q061-D","text":"Số âm trong phần vốn chủ sở hữu"}],"correctOptionId":"lms-ch3-q061-D","explanation":"TK 421 thuộc vốn chủ sở hữu, bình thường dư Có (lãi chưa phân phối). Dư Nợ nghĩa là lỗ lũy kế, làm giảm vốn chủ sở hữu nên trình bày số âm trong phần vốn chủ sở hữu.","source":"Slide Chương 3, TT200 (TK 421); slide 49, 57","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u062","context":"<p><b>Bài 1:<\/b> Ngày 1/12/X, công ty Y tồn quỹ tiền mặt 200 triệu đồng.<br>Các khoản thu chi phát sinh trong tháng như sau:<\/p><ol><li>Phiếu chi số 12 ngày 12/12: Trả lương cho CNV 150 triệu đồng.<\/li><li>Phiếu thu số 10 ngày 13/12: Nhận ký quỹ ngắn hạn 190 triệu đồng.<\/li><li>Phiếu thu số 11 ngày 15/12: Rút TGNH về nhập quỹ 180 triệu đồng.<\/li><li>Phiếu chi số 13 ngày 18/12: Chi mua NVL 190 triệu đồng<\/li><\/ol><p>YÊU CẦU: - Phản ánh thông tin trên vào tài khoản Tiền mặt (dạng chữ T, dạng sổ)<br>- Xác định số tiền tồn vào ngày 31/12/N.<\/p>","section":"Tài khoản kế toán – Bài tập tình huống","questions":[{"id":"lms-ch3-q062","num":"Tài khoản – Bài 1 – Yêu cầu 1","type":"essay","text":"Phản ánh thông tin trên vào tài khoản Tiền mặt (dạng chữ T, dạng sổ).","answer":"<p>Tiền mặt là tài khoản tài sản (TK 111): tăng ghi Nợ, giảm ghi Có, số dư bên Nợ. Xác định TK đối ứng: lương CNV (TK 334), nhận ký quỹ ngắn hạn (TK 344), rút TGNH (TK 112), mua NVL (TK 152; đề không nêu thuế GTGT nên bỏ qua).<\/p><p><b>Dạng chữ T – TK 111 (triệu đồng):<\/b><\/p><table class=\"t\"><thead><tr><th>Nợ TK 111<\/th><th>Có TK 111<\/th><\/tr><\/thead><tbody><tr><td>SDĐK: 200<\/td><td><\/td><\/tr><tr><td>(2) 190 (ký quỹ ngắn hạn – TK 344)<\/td><td>(1) 150 (trả lương – TK 334)<\/td><\/tr><tr><td>(3) 180 (rút TGNH – TK 112)<\/td><td>(4) 190 (mua NVL – TK 152)<\/td><\/tr><tr><td><b>Cộng PS: 370<\/b><\/td><td><b>Cộng PS: 340<\/b><\/td><\/tr><tr><td colspan=\"2\"><b>SDCK: 230 (Nợ)<\/b><\/td><\/tr><\/tbody><\/table><p><b>Dạng sổ (Sổ cái TK 111, ĐVT: triệu đồng):<\/b><\/p><table class=\"t\"><thead><tr><th>Ngày ghi sổ<\/th><th>Chứng từ<\/th><th>Diễn giải<\/th><th>TK đối ứng<\/th><th>Nợ<\/th><th>Có<\/th><\/tr><\/thead><tbody><tr><td>1/12<\/td><td><\/td><td>Số dư đầu kỳ<\/td><td><\/td><td class=\"num\">200<\/td><td><\/td><\/tr><tr><td>12/12<\/td><td>PC12<\/td><td>Trả lương cho CNV<\/td><td>334<\/td><td><\/td><td class=\"num\">150<\/td><\/tr><tr><td>13/12<\/td><td>PT10<\/td><td>Nhận ký quỹ ngắn hạn<\/td><td>344<\/td><td class=\"num\">190<\/td><td><\/td><\/tr><tr><td>15/12<\/td><td>PT11<\/td><td>Rút TGNH về nhập quỹ<\/td><td>112<\/td><td class=\"num\">180<\/td><td><\/td><\/tr><tr><td>18/12<\/td><td>PC13<\/td><td>Chi mua NVL<\/td><td>152<\/td><td><\/td><td class=\"num\">190<\/td><\/tr><tr><td><\/td><td><\/td><td><b>Cộng số phát sinh<\/b><\/td><td><\/td><td class=\"num\">370<\/td><td class=\"num\">340<\/td><\/tr><tr><td><\/td><td><\/td><td><b>Số dư cuối kỳ<\/b><\/td><td><\/td><td class=\"num\">230<\/td><td><\/td><\/tr><\/tbody><\/table><p>Kiểm tra: SDCK = SDĐK + PS tăng – PS giảm = 200 + 370 – 340 = 230.<\/p>","source":"Slide Chương 3, slide 44–48 (Ví dụ 1); TT200 (TK 111, 334, 344, 112, 152)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q063","num":"Tài khoản – Bài 1 – Yêu cầu 2","type":"essay","text":"Xác định số tiền tồn vào ngày 31/12/N.","answer":"<p>SDCK = SDĐK + tổng PS Nợ – tổng PS Có.<\/p><p>PS Nợ = 190 + 180 = 370; PS Có = 150 + 190 = 340.<\/p><p>SDCK = 200 + 370 – 340 = <b>230 triệu đồng<\/b> (dư Nợ). Kiểm tra bằng cách cộng từng bước: 200 – 150 = 50; 50 + 190 = 240; 240 + 180 = 420; 420 – 190 = 230.<\/p><p>Vậy số tiền mặt tồn quỹ ngày 31/12 là 230 triệu đồng.<\/p>","source":"Slide Chương 3, slide 38, 44–48","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u063","context":"<p><b>Bài 2:<\/b> Vào ngày 1/8/N, số tiền mà đơn vị vay ngân hàng (NH) là 300 triệu đồng.<br>Trong tháng, có các NVPS liên quan đến các khoản đi vay:<\/p><ol><li>Đơn vị dùng TGNH 150 triệu đồng để trả nợ vay ngắn hạn.<\/li><li>Doanh nghiệp vay Ngân hàng 300 triệu đồng để trả nợ người bán.<\/li><li>Dùng TM 100 triệu đồng để thanh toán khoản nợ vay ngắn hạn đến hạn.<\/li><\/ol><p><u>YÊU CẦU<\/u>:<br>- Phản ánh thông tin trên vào TK “Vay và nợ Thuê TC”<br>- Xác định số dư TK này vào ngày 31/8/N.<\/p>","section":"Tài khoản kế toán – Bài tập tình huống","questions":[{"id":"lms-ch3-q064","num":"Tài khoản – Bài 2 – Yêu cầu 1","type":"essay","text":"Phản ánh thông tin trên vào TK “Vay và nợ Thuê TC”.","answer":"<p>TK “Vay và nợ thuê tài chính” (TK 341) là tài khoản nguồn vốn: tăng ghi Có, giảm ghi Nợ, dư Có. Hiểu số tiền vay 300 tại ngày 1/8 là số dư đầu kỳ (dư Có), tương tự Ví dụ 2 trong slide.<\/p><p>Định khoản các nghiệp vụ:<\/p><div class=\"je\"><div>(1) Nợ TK 341 &nbsp; 150<\/div><div class=\"cr\">Có TK 112 &nbsp; 150<\/div><\/div><div class=\"je\"><div>(2) Nợ TK 331 &nbsp; 300<\/div><div class=\"cr\">Có TK 341 &nbsp; 300<\/div><\/div><div class=\"je\"><div>(3) Nợ TK 341 &nbsp; 100<\/div><div class=\"cr\">Có TK 111 &nbsp; 100<\/div><\/div><p><b>Dạng chữ T – TK 341 (triệu đồng):<\/b><\/p><table class=\"t\"><thead><tr><th>Nợ TK 341<\/th><th>Có TK 341<\/th><\/tr><\/thead><tbody><tr><td><\/td><td>SDĐK: 300<\/td><\/tr><tr><td>(1) 150 (trả bằng TGNH – TK 112)<\/td><td>(2) 300 (vay trả nợ người bán – TK 331)<\/td><\/tr><tr><td>(3) 100 (trả bằng TM – TK 111)<\/td><td><\/td><\/tr><tr><td><b>Cộng PS: 250<\/b><\/td><td><b>Cộng PS: 300<\/b><\/td><\/tr><tr><td colspan=\"2\"><b>SDCK: 350 (Có)<\/b><\/td><\/tr><\/tbody><\/table><p><b>Dạng sổ (Sổ cái TK 341, ĐVT: triệu đồng):<\/b><\/p><table class=\"t\"><thead><tr><th>Diễn giải<\/th><th>TK đối ứng<\/th><th>Nợ<\/th><th>Có<\/th><\/tr><\/thead><tbody><tr><td>Số dư đầu kỳ (1/8)<\/td><td><\/td><td><\/td><td class=\"num\">300<\/td><\/tr><tr><td>Dùng TGNH trả nợ vay ngắn hạn<\/td><td>112<\/td><td class=\"num\">150<\/td><td><\/td><\/tr><tr><td>Vay NH để trả nợ người bán<\/td><td>331<\/td><td><\/td><td class=\"num\">300<\/td><\/tr><tr><td>Dùng TM trả nợ vay đến hạn<\/td><td>111<\/td><td class=\"num\">100<\/td><td><\/td><\/tr><tr><td><b>Cộng số phát sinh<\/b><\/td><td><\/td><td class=\"num\">250<\/td><td class=\"num\">300<\/td><\/tr><tr><td><b>Số dư cuối kỳ (31/8)<\/b><\/td><td><\/td><td><\/td><td class=\"num\">350<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 3, slide 49–50 (Ví dụ 2), 66; TT200 (TK 341)","status":"needs_review","answerBasis":"self","reviewNote":"Đề viết 'số tiền mà đơn vị vay ngân hàng là 300 triệu' ngày 1/8 - mơ hồ giữa số dư đầu kỳ (theo mẫu Ví dụ 2 slide, đáp án SDCK Có 350) và khoản vay phát sinh trong kỳ. Đã chọn số dư đầu kỳ Có 300."},{"id":"lms-ch3-q065","num":"Tài khoản – Bài 2 – Yêu cầu 2","type":"essay","text":"Xác định số dư TK này vào ngày 31/8/N.","answer":"<p>Tài khoản nguồn vốn: SDCK = SDĐK + PS Có – PS Nợ = 300 + 300 – (150 + 100) = <b>350 triệu đồng (dư Có)<\/b>.<\/p><p>Kiểm tra: 300 – 150 = 150; 150 + 300 = 450; 450 – 100 = 350.<\/p><p>Lưu ý: nếu hiểu 300 triệu là khoản vay phát sinh ngày 1/8 (chưa có số dư đầu kỳ) thì kết quả sẽ khác; cách hiểu trong lời giải là số dư đầu kỳ.<\/p>","source":"Slide Chương 3, slide 38, 49–50","status":"needs_review","answerBasis":"self","reviewNote":"Đề viết 'số tiền mà đơn vị vay ngân hàng là 300 triệu' ngày 1/8 - mơ hồ giữa số dư đầu kỳ (theo mẫu Ví dụ 2 slide, đáp án SDCK Có 350) và khoản vay phát sinh trong kỳ. Đã chọn số dư đầu kỳ Có 300."}]},{"id":"lms-ch3-u064","context":"<p><b>Bài 3:<\/b> Ngày 01/03/N, Công ty Minh Phát được thành lập với số vốn góp ban đầu của các cổ đông như sau (ĐVT: triệu đồng):<\/p><ul><li>Nhà xưởng và thiết bị sản xuất được góp vốn, trị giá 1.500.<\/li><li>Tiền góp vốn bằng tiền mặt nhập quỹ: 400.<\/li><li>Tiền góp vốn đã chuyển vào tài khoản tiền gửi ngân hàng của doanh nghiệp: 600.<\/li><\/ul><p>Trong tháng 03/N, doanh nghiệp phát sinh các nghiệp vụ kinh tế sau:<\/p><ol><li>Doanh nghiệp mua nguyên vật liệu nhập kho với giá trị 120, đã thanh toán cho nhà cung cấp bằng tiền gửi ngân hàng.<\/li><li>Doanh nghiệp mua một lô công cụ, dụng cụ phục vụ hoạt động sản xuất trị giá 40, hàng đã nhập kho nhưng chưa thanh toán cho nhà cung cấp.<\/li><li>Doanh nghiệp dùng tiền gửi ngân hàng thanh toán 25 khoản nợ nhà cung cấp phát sinh ở nghiệp vụ 2.<\/li><li>Doanh nghiệp vay ngân hàng ngắn hạn 150 để mua một thiết bị sản xuất mới. Thiết bị đã được bàn giao và đưa vào sử dụng, toàn bộ tiền vay được ngân hàng thanh toán trực tiếp cho nhà cung cấp thiết bị.<\/li><li>Doanh nghiệp rút 70 từ tài khoản tiền gửi ngân hàng về nhập quỹ tiền mặt để phục vụ các khoản chi thường xuyên.<\/li><\/ol><p>Giả định: Bài tập chưa xét thuế GTGT và các khoản chi phí phát sinh liên quan đến việc mua tài sản.<\/p>","section":"Tài khoản kế toán – Bài tập tình huống","questions":[{"id":"lms-ch3-q066","num":"Tài khoản – Bài 3 – Yêu cầu 1","type":"essay","text":"Xác định tài sản, nợ phải trả và vốn chủ sở hữu của doanh nghiệp tại ngày 01/03/N.","answer":"<p>Tài sản gồm: nhà xưởng, thiết bị (TK 211) 1.500; tiền mặt (TK 111) 400; tiền gửi ngân hàng (TK 112) 600. Tổng tài sản = 1.500 + 400 + 600 = <b>2.500<\/b>.<\/p><p>Nợ phải trả = <b>0<\/b> (chưa phát sinh khoản nợ nào). Vốn chủ sở hữu (vốn góp, TK 411) = <b>2.500<\/b>.<\/p><p>Kiểm tra phương trình kế toán: TS 2.500 = NPT 0 + VCSH 2.500.<\/p>","source":"Slide Chương 3, slide 38, 44–50, 64–66, 69, 94; TT200 (TK 111, 112, 152, 153, 211, 331, 341, 411)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q067","num":"Tài khoản – Bài 3 – Yêu cầu 2","type":"essay","text":"Định khoản các nghiệp vụ kinh tế phát sinh trong tháng 03/N.","answer":"<p>Định khoản (triệu đồng):<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 1.500<\/div><div>Nợ TK 111 &nbsp; 400<\/div><div>Nợ TK 112 &nbsp; 600<\/div><div class=\"cr\">Có TK 411 &nbsp; 2.500<\/div><\/div><p>(bút toán nhận vốn góp ngày 01/03, để phản ánh số dư đầu kỳ)<\/p><p>1. Mua NVL nhập kho, trả bằng TGNH:<\/p><div class=\"je\"><div>Nợ TK 152 &nbsp; 120<\/div><div class=\"cr\">Có TK 112 &nbsp; 120<\/div><\/div><p>2. Mua CCDC nhập kho, chưa trả tiền:<\/p><div class=\"je\"><div>Nợ TK 153 &nbsp; 40<\/div><div class=\"cr\">Có TK 331 &nbsp; 40<\/div><\/div><p>3. Trả nợ nhà cung cấp bằng TGNH:<\/p><div class=\"je\"><div>Nợ TK 331 &nbsp; 25<\/div><div class=\"cr\">Có TK 112 &nbsp; 25<\/div><\/div><p>4. Vay ngắn hạn mua thiết bị (ngân hàng trả thẳng cho nhà cung cấp):<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 150<\/div><div class=\"cr\">Có TK 341 &nbsp; 150<\/div><\/div><p>5. Rút TGNH nhập quỹ tiền mặt:<\/p><div class=\"je\"><div>Nợ TK 111 &nbsp; 70<\/div><div class=\"cr\">Có TK 112 &nbsp; 70<\/div><\/div><p>Mỗi bút toán có tổng Nợ = tổng Có; chỉ liên quan đến tài sản và nợ phải trả, chưa phát sinh doanh thu, chi phí.<\/p>","source":"Slide Chương 3, slide 38, 44–50, 64–66, 69, 94; TT200 (TK 111, 112, 152, 153, 211, 331, 341, 411)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q068","num":"Tài khoản – Bài 3 – Yêu cầu 3","type":"essay","text":"Phản ánh số dư đầu kỳ và các nghiệp vụ kinh tế phát sinh vào sơ đồ chữ T của các tài khoản có liên quan.","answer":"<p>Sơ đồ chữ T các tài khoản liên quan (triệu đồng; số trong ngoặc là số thứ tự nghiệp vụ):<\/p><table class=\"t\"><thead><tr><th>Tài khoản<\/th><th>Nợ (SDĐK + PS Nợ)<\/th><th>Có (PS Có)<\/th><th>Số dư cuối kỳ<\/th><\/tr><\/thead><tbody><tr><td>TK 111 – Tiền mặt<\/td><td>SDĐK 400; (5) 70<\/td><td><\/td><td class=\"num\">Nợ 470<\/td><\/tr><tr><td>TK 112 – Tiền gửi ngân hàng<\/td><td>SDĐK 600<\/td><td>(1) 120; (3) 25; (5) 70<\/td><td class=\"num\">Nợ 385<\/td><\/tr><tr><td>TK 152 – Nguyên vật liệu<\/td><td>(1) 120<\/td><td><\/td><td class=\"num\">Nợ 120<\/td><\/tr><tr><td>TK 153 – Công cụ, dụng cụ<\/td><td>(2) 40<\/td><td><\/td><td class=\"num\">Nợ 40<\/td><\/tr><tr><td>TK 211 – TSCĐ hữu hình<\/td><td>SDĐK 1.500; (4) 150<\/td><td><\/td><td class=\"num\">Nợ 1.650<\/td><\/tr><tr><td>TK 331 – Phải trả người bán<\/td><td>(3) 25<\/td><td>(2) 40<\/td><td class=\"num\">Có 15<\/td><\/tr><tr><td>TK 341 – Vay ngắn hạn<\/td><td><\/td><td>(4) 150<\/td><td class=\"num\">Có 150<\/td><\/tr><tr><td>TK 411 – Vốn đầu tư của chủ sở hữu<\/td><td><\/td><td>SDĐK 2.500<\/td><td class=\"num\">Có 2.500<\/td><\/tr><\/tbody><\/table><p>Số dư đầu kỳ ngày 01/03 gồm: TK 211 Nợ 1.500, TK 111 Nợ 400, TK 112 Nợ 600, TK 411 Có 2.500.<\/p>","source":"Slide Chương 3, slide 38, 44–50, 64–66, 69, 94; TT200 (TK 111, 112, 152, 153, 211, 331, 341, 411)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q069","num":"Tài khoản – Bài 3 – Yêu cầu 4","type":"essay","text":"Xác định số dư cuối kỳ của từng tài khoản tại ngày 31/03/N.","answer":"<p>Số dư cuối kỳ = SDĐK + PS tăng – PS giảm:<\/p><ul><li>TK 111: 400 + 70 = <b>470<\/b> (Nợ)<\/li><li>TK 112: 600 – 120 – 25 – 70 = <b>385<\/b> (Nợ)<\/li><li>TK 152: <b>120<\/b> (Nợ)<\/li><li>TK 153: <b>40<\/b> (Nợ)<\/li><li>TK 211: 1.500 + 150 = <b>1.650<\/b> (Nợ)<\/li><li>TK 331: 40 – 25 = <b>15<\/b> (Có)<\/li><li>TK 341: <b>150<\/b> (Có)<\/li><li>TK 411: <b>2.500<\/b> (Có)<\/li><\/ul><p>Kiểm tra: tổng dư Nợ = 470 + 385 + 120 + 40 + 1.650 = 2.665; tổng dư Có = 15 + 150 + 2.500 = 2.665. Cân đối. Tổng phát sinh Nợ = tổng phát sinh Có = 2.500 + 120 + 40 + 25 + 150 + 70 = 2.905 (tính cả bút toán nhận vốn góp).<\/p>","source":"Slide Chương 3, slide 38, 44–50, 64–66, 69, 94; TT200 (TK 111, 112, 152, 153, 211, 331, 341, 411)","status":"ok","answerBasis":"self"},{"id":"lms-ch3-q070","num":"Tài khoản – Bài 3 – Yêu cầu 5","type":"essay","text":"Lập Báo cáo tình hình tài chính dạng đơn giản tại: a) Ngày 01/03/N; b) Ngày 31/03/N.","answer":"<p>Báo cáo tình hình tài chính dạng đơn giản (triệu đồng):<\/p><p><b>Ngày 01/03/N<\/b><\/p><table class=\"t\"><thead><tr><th>Tài sản<\/th><th>Số tiền<\/th><th>Nguồn vốn<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt (111)<\/td><td class=\"num\">400<\/td><td>Nợ phải trả<\/td><td class=\"num\">0<\/td><\/tr><tr><td>Tiền gửi ngân hàng (112)<\/td><td class=\"num\">600<\/td><td>Vốn chủ sở hữu (411)<\/td><td class=\"num\">2.500<\/td><\/tr><tr><td>TSCĐ hữu hình (211)<\/td><td class=\"num\">1.500<\/td><td><\/td><td><\/td><\/tr><tr><td><b>Tổng tài sản<\/b><\/td><td class=\"num\"><b>2.500<\/b><\/td><td><b>Tổng nguồn vốn<\/b><\/td><td class=\"num\"><b>2.500<\/b><\/td><\/tr><\/tbody><\/table><p><b>Ngày 31/03/N<\/b><\/p><table class=\"t\"><thead><tr><th>Tài sản<\/th><th>Số tiền<\/th><th>Nguồn vốn<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt (111)<\/td><td class=\"num\">470<\/td><td>Phải trả người bán (331)<\/td><td class=\"num\">15<\/td><\/tr><tr><td>Tiền gửi ngân hàng (112)<\/td><td class=\"num\">385<\/td><td>Vay ngắn hạn (341)<\/td><td class=\"num\">150<\/td><\/tr><tr><td>Nguyên vật liệu (152)<\/td><td class=\"num\">120<\/td><td><b>Cộng nợ phải trả<\/b><\/td><td class=\"num\"><b>165<\/b><\/td><\/tr><tr><td>Công cụ, dụng cụ (153)<\/td><td class=\"num\">40<\/td><td>Vốn chủ sở hữu (411)<\/td><td class=\"num\">2.500<\/td><\/tr><tr><td>TSCĐ hữu hình (211)<\/td><td class=\"num\">1.650<\/td><td><\/td><td><\/td><\/tr><tr><td><b>Tổng tài sản<\/b><\/td><td class=\"num\"><b>2.665<\/b><\/td><td><b>Tổng nguồn vốn<\/b><\/td><td class=\"num\"><b>2.665<\/b><\/td><\/tr><\/tbody><\/table><p>Kiểm tra: 2.665 = 165 + 2.500. Tổng tài sản tăng 165 so với đầu kỳ, đúng bằng nợ phải trả phát sinh (vay 150 + nợ người bán còn lại 15).<\/p>","source":"Slide Chương 3, slide 38, 44–50, 64–66, 69, 94; TT200 (TK 111, 112, 152, 153, 211, 331, 341, 411)","status":"ok","answerBasis":"self"}]},{"id":"lms-ch3-u065","context":"<p><b>Bài 4:<\/b> Doanh Nghiệp A có các nghiệp vụ kinh tế phát sinh như sau: (đvt: đồng)<\/p><ol><li>Mua tài sản cố định hữu hình 200.000.000 (chưa bao gồm thuế giá trị gia tăng), chưa trả tiền người bán, chi phí lắp đặt chạy thử đã trả bằng tiền gửi ngân hàng bao gồm cả thuế GTGT 10% là 1.320.000.<\/li><li>Nhận vốn góp bằng tiền mặt là 1.000.000.000.<\/li><li>Nhập kho 500kg vật liệu A đơn giá nhập là: 10.000đ/kg thanh toán bằng tiền gửi không kỳ hạn.<\/li><li>Rút tiền gửi ngân hàng về nhập quỹ tiền mặt là: 350.000.000.<\/li><li>Trả nợ cho người bán M bằng tiền gửi ngân hàng số tiền: 500.000.000.<\/li><li>Ứng trước cho người bán K bằng tiền mặt 15.000.000.<\/li><li>Trả lương kỳ 1 cho người lao động bằng tiền mặt 650.000.000.<\/li><li>Trích lợi nhuận sau thuế bổ sung quỹ đầu tư phát triển: 500.000.000.<\/li><li>Nhận ký quỹ ngắn hạn bằng tiền mặt trị giá: 30.000.000.<\/li><li>Vay ngắn hạn trả nợ cho người bán H số tiền: 300.000.000.<\/li><\/ol><p>Yêu cầu: Định khoản các nghiệp vụ kinh tế phát sinh.<\/p>","section":"Tài khoản kế toán – Bài tập tình huống","questions":[{"id":"lms-ch3-q071","num":"Tài khoản – Bài 4 – Nghiệp vụ 1","type":"essay","text":"Định khoản nghiệp vụ 1: Mua TSCĐ hữu hình 200.000.000 (chưa bao gồm thuế GTGT), chưa trả tiền người bán, chi phí lắp đặt chạy thử đã trả bằng tiền gửi ngân hàng bao gồm cả thuế GTGT 10% là 1.320.000.","answer":"<p>Thuế GTGT 10% của TSCĐ = 200.000.000 x 10% = 20.000.000; phải trả người bán = 220.000.000. Chi phí lắp đặt chạy thử có thuế 1.320.000: chưa thuế = 1.320.000 / 1.1 = 1.200.000, thuế = 120.000; chi phí này được tính vào nguyên giá TSCĐ.<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 200.000.000<\/div><div>Nợ TK 133 &nbsp; 20.000.000<\/div><div class=\"cr\">Có TK 331 &nbsp; 220.000.000<\/div><\/div><div class=\"je\"><div>Nợ TK 211 &nbsp; 1.200.000<\/div><div>Nợ TK 133 &nbsp; 120.000<\/div><div class=\"cr\">Có TK 112 &nbsp; 1.320.000<\/div><\/div><p>Nguyên giá TSCĐ = 200.000.000 + 1.200.000 = 201.200.000. Kiểm tra Nợ = Có ở từng bút toán (220.000.000 và 1.320.000).<\/p>","source":"Slide Chương 3, slide 65–69; TT200 (TK tương ứng)","status":"needs_review","answerBasis":"self","reviewNote":"Đề chỉ nêu thuế suất 10% ở phần chi phí lắp đặt; đã giả định thuế GTGT 10% cũng áp dụng cho TSCĐ 200.000.000 (thuế 20.000.000) theo phương pháp khấu trừ. Nếu đề muốn bỏ qua thuế của TSCĐ thì Có TK 331 = 200.000.000 và không có Nợ 133 20.000.000."},{"id":"lms-ch3-q072","num":"Tài khoản – Bài 4 – Nghiệp vụ 2","type":"essay","text":"Định khoản nghiệp vụ 2: Nhận vốn góp bằng tiền mặt là 1.000.000.000.","answer":"<p>Tiền mặt tăng (tài sản),

toán và ảnh hưởng của nghiệp vụ)","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u056","context":null,"questions":[{"id":"other-deon1-q060","num":"Câu 60","type":"mcq","text":"Tính chất của tài khoản “phải trả người bán” là:","options":[{"id":"other-deon1-q060-A","text":"Tài khoản tài sản"},{"id":"other-deon1-q060-B","text":"Tài khoản nguồn vốn"},{"id":"other-deon1-q060-C","text":"Tài khoản trung gian"},{"id":"other-deon1-q060-D","text":"Tài khoản hỗn hợp"}],"correctOptionId":"other-deon1-q060-D","explanation":"<p>Theo slide, TK phải thu khách hàng và TK phải trả người bán là tài khoản hỗn hợp (vừa phản ánh tài sản vừa phản ánh nguồn vốn): có thể dư Nợ (ứng trước cho người bán) hoặc dư Có (nợ người bán). Chọn D.<\/p>","source":"Slide Chương 3, slide 52, 55; Slide Chương 2, slide 38–39","status":"ok","answerBasis":"given"}]},{"id":"other-deon1-u057","context":null,"questions":[{"id":"other-deon1-q061","num":"Phần II – Câu 1","type":"essay","text":"Vật liệu thiếu trong kiểm kê là 2 triệu chưa xác định được nguyên nhân, kế toán phản ánh như thế nào?","answer":"<p>Vật liệu thiếu chưa rõ nguyên nhân: ghi giảm kho và chuyển thành tài sản thiếu chờ xử lý (TK 1381).<\/p><div class=\"je\"><div>Nợ TK 1381 – Tài sản thiếu chờ xử lý &nbsp; 2.000.000<\/div><div class=\"cr\">Có TK 152 – Nguyên liệu, vật liệu &nbsp; 2.000.000<\/div><\/div><p>Khi có quyết định xử lý: nếu cá nhân bồi thường thì Nợ TK 111/334/1388, nếu tính vào chi phí (hao hụt trong định mức) thì Nợ TK 632, phần ngoài định mức không rõ nguyên nhân ghi Nợ TK 811 / Có TK 1381 (theo TT200).<\/p>","source":"Slide Chương 6 (kiểm kê, xử lý thiếu thừa, slide 6–8); Slide Chương 1, slide 37; TT200 (TK 1381)","status":"ok","answerBasis":"self"}]},{"id":"other-deon1-u058","context":null,"questions":[{"id":"other-deon1-q062","num":"Phần II – Câu 2","type":"essay","text":"Việc báo cáo tài chính tổng hợp phản ánh tổng quát tình hình và kết quả họat động kinh doanh trong một kỳ kế toán của doanh nghiệp, chi tiết theo họat động kinh doanh chính và các hoạt động khác được gọi là gì ?","answer":"<p>Đó là <b>Báo cáo kết quả hoạt động kinh doanh<\/b>: phản ánh tổng quát doanh thu, chi phí và lợi nhuận của kỳ báo cáo, chi tiết theo hoạt động kinh doanh chính và các hoạt động khác (tài chính, khác).<\/p>","source":"Slide Chương 2, slide 41 (Báo cáo kết quả hoạt động kinh doanh); TT200","status":"ok","answerBasis":"self"}]},{"id":"other-deon1-u059","context":null,"questions":[{"id":"other-deon1-q063","num":"Phần II – Câu 3","type":"essay","text":"Định khoản nghiệp vụ: Khấu hao TSCĐ dùng trong phân xưởng sản xuất?","answer":"<p>Trích khấu hao TSCĐ dùng ở phân xưởng là chi phí sản xuất chung, làm giảm giá trị TSCĐ qua TK điều chỉnh 214 (đề không cho số tiền, gọi là X):<\/p><div class=\"je\"><div>Nợ TK 627 – Chi phí sản xuất chung &nbsp; X<\/div><div class=\"cr\">Có TK 214 – Hao mòn TSCĐ &nbsp; X<\/div><\/div><p>Chi phí này sau đó được tập hợp, phân bổ và kết chuyển vào giá thành sản phẩm (TK 154).<\/p>","source":"Slide Chương 5, slide 12–14 (kế toán khấu hao TSCĐ); TT200","status":"ok","answerBasis":"self"}]},{"id":"other-deon1-u060","context":null,"questions":[{"id":"other-deon1-q064","num":"Phần II – Câu 4","type":"essay","text":"Các phương pháp tính giá là?","answer":"<p>Tính giá là phương pháp kế toán xác định giá trị ghi sổ của tài sản, nợ phải trả, chi phí. Các nội dung chủ yếu:<\/p><ul><li>Tính giá tài sản mua vào theo giá gốc (giá mua + chi phí thu mua, thuế GTGT được khấu trừ không tính vào).<\/li><li>Tính giá thành sản phẩm (tập hợp chi phí sản xuất theo khoản mục).<\/li><li>Tính giá hàng tồn kho xuất kho: phương pháp thực tế đích danh, nhập trước xuất trước (FIFO), bình quân gia quyền (sau mỗi lần nhập hoặc cuối kỳ); nhập sau xuất trước (LIFO) chỉ dùng cho mục đích học thuật và không được VAS 02 chấp nhận.<\/li><\/ul>","source":"Slide Chương 4, slide 11, 37–39; Slide Chương 1, slide 52","status":"ok","answerBasis":"self"}]},{"id":"other-deon1-u061","context":null,"questions":[{"id":"other-deon1-q065","num":"Phần II – Câu 5","type":"essay","text":"Theo Viện kế toán công chứng Hoa Kỳ, 1941: “Kế toán là … ghi chép, phân loại, tổng hợp một cách có ý nghĩa và dưới hình thức tiền tệ các nghiệp vụ kinh tế phát sinh, các sự kiện liên quan tình hình tài chính và giải thích kết quả của sự ghi chếp này”. Điền vào dấu (…)","answer":"<p>Điền: <b>nghệ thuật<\/b>. Định nghĩa của AICPA (1941): 'Kế toán là nghệ thuật ghi chép, phân loại và tổng hợp một cách có ý nghĩa, dưới hình thức tiền tệ, ...'.<\/p>","source":"Slide Chương 1, slide 10","status":"ok","answerBasis":"self"}]}]},{"key":"deon2","title":"Đề ôn có đáp án 2","units":[{"id":"other-deon2-u001","context":null,"questions":[{"id":"other-deon2-q001","num":"Câu 1","type":"mcq","text":"Có bao nhiêu phương pháp kế toán","options":[{"id":"other-deon2-q001-A","text":"3"},{"id":"other-deon2-q001-B","text":"6"},{"id":"other-deon2-q001-C","text":"5"},{"id":"other-deon2-q001-D","text":"8"}],"correctOptionId":"other-deon2-q001-B","explanation":"Quy trình kế toán gồm 6 phương pháp: Chứng từ, Kiểm kê, Tài khoản, Ghi sổ kép, Tính giá, Tổng hợp và cân đối kế toán. Các con số 3, 5, 8 không khớp.","source":"Slide Chương 1, slide 52 (Quy trình kế toán – mối quan hệ giữa các phương pháp kế toán)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u002","context":"<p>Dùng dữ liệu sau cho câu 2, 3<\/p><p>Vật liệu tồn kho đầu tháng: 600 kg, đơn giá 20 đồng/kg.<br>Tình hình nhập xuất trong tháng.<br>Ngày 01: mua nhập kho 1.200 kg, đơn giá nhập 18 đồng/kg.<br>Ngày 04: xuất 1.600kg để sản xuất sản phẩm.<br>Ngày 10: mua nhập kho 600kg, đơn giá 21đồng/kg.<br>Ngày 20: xuất 500 kg để sản xuất sản phẩm.<\/p>","questions":[{"id":"other-deon2-q002","num":"Câu 2","type":"mcq","text":"Trị giá vật liệu xuất sử dụng ngày 04 của tháng theo phương pháp LIFO là:","options":[{"id":"other-deon2-q002-A","text":"29.600"},{"id":"other-deon2-q002-B","text":"30.600"},{"id":"other-deon2-q002-C","text":"33.600"},{"id":"other-deon2-q002-D","text":"31.400"}],"correctOptionId":"other-deon2-q002-A","explanation":"LIFO: xuất lô nhập sau cùng trước. Ngày 04 tồn gồm 600 kg x 20 (đầu kỳ) và 1.200 kg x 18 (nhập ngày 01); lô ngày 10 chưa nhập. Xuất 1.600 kg = 1.200 x 18 + 400 x 20 = 21.600 + 8.000 = 29.600. Các phương án khác sai cách lấy lô (vd. FIFO: 600x20 + 1.000x18 = 30.000).","source":"Slide Chương 4, slide 39 (FIFO) và phần các phương pháp tính giá xuất kho (slide 37–39)","answerBasis":"given","status":"ok"},{"id":"other-deon2-q003","num":"Câu 3","type":"mcq","text":"Đơn giá tính theo phương pháp bình quân gia quyền là","options":[{"id":"other-deon2-q003-A","text":"19"},{"id":"other-deon2-q003-B","text":"19,25"},{"id":"other-deon2-q003-C","text":"19,667"},{"id":"other-deon2-q003-D","text":"19,5"}],"correctOptionId":"other-deon2-q003-B","explanation":"Bình quân gia quyền cuối kỳ = (600x20 + 1.200x18 + 600x21) / (600 + 1.200 + 600) = (12.000 + 21.600 + 12.600) / 2.400 = 46.200 / 2.400 = 19,25 đồng/kg.","source":"Slide Chương 4, slide 37–38 (Bình quân gia quyền cuối kỳ)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u003","context":null,"questions":[{"id":"other-deon2-q004","num":"Câu 4","type":"mcq","text":"Trình tự xử lí chứng từ kế toán","options":[{"id":"other-deon2-q004-A","text":"Kiểm tra, hoàn chỉnh, luân chuyển và lưu trữ"},{"id":"other-deon2-q004-B","text":"Luân chuyển, hoàn chỉnh, kiểm tra và lưu trữ"},{"id":"other-deon2-q004-C","text":"Luân chuyển, kiểm tra, hoàn chỉnhvà lưu trữ"},{"id":"other-deon2-q004-D","text":"Hoàn chỉnh, kiểm tra, luân chuyển và lưu trữ"}],"correctOptionId":"other-deon2-q004-A","explanation":"Trình tự xử lý và luân chuyển chứng từ: lập chứng từ -> kiểm tra -> hoàn chỉnh -> luân chuyển -> bảo quản, lưu trữ. Vậy đúng là: Kiểm tra, hoàn chỉnh, luân chuyển và lưu trữ.","source":"Slide Chương 3, slide 18 và 25–26 (Trình tự xử lý và luân chuyển chứng từ)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u004","context":null,"questions":[{"id":"other-deon2-q005","num":"Câu 5","type":"mcq","text":"Chọn câu phát biểu đúng:","options":[{"id":"other-deon2-q005-A","text":"Nguyên tắc phản ánh trên tài khoản tài sản và tài khoản nguồn vốn là giống nhau."},{"id":"other-deon2-q005-B","text":"Bên Nợ của các tài khoản trung gian là các khoản làm giảm chi phí, làm tăng doanh thu và thu nhập cũng như các khoản được kết chuyển vào cuối kỳ."},{"id":"other-deon2-q005-C","text":"Các tài khoản trung gian luôn có số dư."},{"id":"other-deon2-q005-D","text":"Loại tài khoản chủ yếu là loại phản ánh tình hình và sự biến động của các đối tượng kế toán."}],"correctOptionId":"other-deon2-q005-D","explanation":"D đúng: tài khoản chủ yếu (TS, NV, hỗn hợp) phản ánh tình hình và biến động của đối tượng kế toán. A sai: TK tài sản và nguồn vốn ghi theo nguyên tắc ngược nhau. B sai: bên Nợ TK trung gian là chi phí tăng, giảm doanh thu/thu nhập và kết chuyển doanh thu (không phải làm tăng doanh thu). C sai: TK trung gian không có số dư cuối kỳ.","source":"Slide Chương 3, slide 43 (phân loại tài khoản: chủ yếu, trung gian)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u005","context":null,"questions":[{"id":"other-deon2-q006","num":"Câu 6","type":"mcq","text":"Số dư đầu tháng của các tài khoản như sau: TK 111: 3.000, TK 214: 4.000, TK 411: 66.000, TK 152: X, TK 311: 6.000, TK 112: 3.000, TK 211: Y. Các TK còn lại từ loại 1 đến loại 4 có số dư bằng 0. Xác định X, Y biết rằng tài sản ngắn hạn bằng ½ tài sản cố định","options":[{"id":"other-deon2-q006-A","text":"X=18.000, Y=52.000"},{"id":"other-deon2-q006-B","text":"X=17.000, Y=49.111"},{"id":"other-deon2-q006-C","text":"X=16.000, Y=46.222"},{"id":"other-deon2-q006-D","text":"X=20.000, Y=57.778"}],"correctOptionId":"other-deon2-q006-A","explanation":"Nguồn vốn = 311 + 411 = 6.000 + 66.000 = 72.000 = Tổng tài sản. Tài sản ngắn hạn = 111 + 112 + 152 = 6.000 + X; TSCĐ (ròng) = Y - 4.000 (TK 214 ghi giảm). Có SNH = ½ TSCĐ nên Tổng TS = 1,5 x TSCĐ = 72.000 => TSCĐ = 48.000 => Y = 52.000; SNH = 24.000 => X = 18.000. Kiểm tra: 6.000 + 18.000 + 48.000 = 72.000.","source":"Slide Chương 1, slide 49–50 (phương trình kế toán); Slide Chương 2, slide 31–34 (kết cấu báo cáo tình hình tài chính)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u006","context":null,"questions":[{"id":"other-deon2-q007","num":"Câu 7","type":"mcq","text":"Nhập kho 1.200 sản phẩm, tổng giá thành 14.400. Xuất bán 800 sản phẩm, giá chưa thuế 19 đồng/sp. Thuế GTGT 10%. Chi phí bán hàng 0,5 đồng/sp. Chi phí quản lí doanh nghiệp bằng ½ chi phí bán hàng. Vậy kết quả kinh doanh sẽ là","options":[{"id":"other-deon2-q007-A","text":"Lãi 5000"},{"id":"other-deon2-q007-B","text":"Lãi 5600"},{"id":"other-deon2-q007-C","text":"Lãi 6520"},{"id":"other-deon2-q007-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-deon2-q007-A","explanation":"Giá thành đơn vị = 14.400 / 1.200 = 12. Doanh thu = 800 x 19 = 15.200 (không tính thuế GTGT). Giá vốn = 800 x 12 = 9.600. CPBH = 800 x 0,5 = 400; CPQLDN = 200. Lãi = 15.200 - 9.600 - 400 - 200 = 5.000.","source":"Slide Chương 5 (kế toán bán hàng, xác định kết quả kinh doanh); Slide Chương 2 (kết cấu báo cáo kết quả kinh doanh)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u007","context":null,"questions":[{"id":"other-deon2-q008","num":"Câu 8","type":"mcq","text":"Số dư tài khoản cấp 1 bằng:","options":[{"id":"other-deon2-q008-A","text":"Số dư của tất cả TK cấp 2"},{"id":"other-deon2-q008-B","text":"Số dư của tất cả TK cấp 3"},{"id":"other-deon2-q008-C","text":"Số dư của tất cả sổ chi tiết"},{"id":"other-deon2-q008-D","text":"Cả A,B,C đều đúng","pinned":true}],"correctOptionId":"other-deon2-q008-A","explanation":"Theo khoá đáp án gốc là A. Tài khoản cấp 1 là tài khoản tổng hợp, số dư của nó bằng tổng số dư các tài khoản chi tiết (cấp 2, cấp 3) và các sổ chi tiết của nó; vì vậy về mặt lý thuyết phương án D (cả A, B, C đều đúng) cũng hợp lý. Đây là điểm khoá gốc cần lưu ý.","source":"Slide Chương 3, slide 61 và 72–73 (tài khoản tổng hợp cấp 1, tài khoản chi tiết cấp 2 và sổ chi tiết)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn A (TK cấp 2) nhưng D (A, B, C đều đúng) cũng đúng về lý thuyết vì số dư TK cấp 1 bằng tổng số dư TK cấp 2, cấp 3 (nếu có) và sổ chi tiết. Giữ khoá gốc."}]},{"id":"other-deon2-u008","context":null,"questions":[{"id":"other-deon2-q009","num":"Câu 9","type":"mcq","text":"Hai người thành lập DN, họ cần có Tiền mặt 60triệu, thiết bị 90triệu. Họ dự định mua thiết bị trả trước 30triệu, còn lại nợ người bán. Ngân hàng cho vay 50triệu để thành lập doanh nghiệp. Họ phải góp bao nhiêu tiền:","options":[{"id":"other-deon2-q009-A","text":"70"},{"id":"other-deon2-q009-B","text":"20"},{"id":"other-deon2-q009-C","text":"40"},{"id":"other-deon2-q009-D","text":"50"}],"correctOptionId":"other-deon2-q009-C","explanation":"Tổng tài sản cần có = 60 + 90 = 150. Nguồn hình thành từ bên ngoài: nợ người bán = 90 - 30 = 60; vay ngân hàng = 50 => nợ phải trả = 110. Vốn góp = 150 - 110 = 40 (triệu).","source":"Slide Chương 1, slide 49–50 (phương trình kế toán: Tài sản = Nợ phải trả + Vốn chủ sở hữu)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u009","context":null,"questions":[{"id":"other-deon2-q010","num":"Câu 10","type":"mcq","text":"Báo cáo tài chính lập trên cơ sở dồn tích phản ánh tình hình tài chính của doanh nghiệp trong:","options":[{"id":"other-deon2-q010-A","text":"Hiện tại"},{"id":"other-deon2-q010-B","text":"Quá khứ và hiện tại"},{"id":"other-deon2-q010-C","text":"Quá khứ"},{"id":"other-deon2-q010-D","text":"Quá khứ, hiện tại và tương lai"}],"correctOptionId":"other-deon2-q010-D","explanation":"Cơ sở dồn tích ghi nhận nghiệp vụ khi phát sinh, không chờ thu/chi tiền, nên BCTC phản ánh cả nghiệp vụ đã xảy ra (quá khứ), các khoản đang thu/trả (hiện tại) và nghĩa vụ/quyền lợi sẽ thu, chi trong tương lai (khoản phải thu, phải trả...). Theo khoá gốc chọn D.","source":"Slide Chương 1, slide 61–62 (Cơ sở dồn tích)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u010","context":null,"questions":[{"id":"other-deon2-q011","num":"Câu 11","type":"mcq","text":"Trong kỳ, khi hạch toán một nghiệp vụ kinh tế phát sinh, kế toán ghi Nợ mà quên ghi Có hoặc ngược lại sẽ dẫn đến sự mất cân đối của bảng cân đối tài khoản đối với:","options":[{"id":"other-deon2-q011-A","text":"SD đầu kỳ và SD cuối kỳ"},{"id":"other-deon2-q011-B","text":"SD cuối kỳ và SPS trong kỳ."},{"id":"other-deon2-q011-C","text":"SD đầu kỳ và SPS trong kỳ."},{"id":"other-deon2-q011-D","text":"SD đầukỳ, SPS trong kỳ và SD cuối kỳ."}],"correctOptionId":"other-deon2-q011-B","explanation":"Ghi thiếu một vế làm tổng phát sinh Nợ khác tổng phát sinh Có, kéo theo số dư cuối kỳ mất cân đối. Số dư đầu kỳ là số kết chuyển từ kỳ trước nên không bị ảnh hưởng.","source":"Slide Chương 3, slide 63–70 (Ghi sổ kép, ý nghĩa); bảng cân đối tài khoản","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u011","context":null,"questions":[{"id":"other-deon2-q012","num":"Câu 12","type":"mcq","text":"Đối tượng nào sau đây có thể tổ chức lập chứng từ kế toán:","options":[{"id":"other-deon2-q012-A","text":"Bất kỳ ai có kiến thức về kế toán đều có thể lập"},{"id":"other-deon2-q012-B","text":"Trưởng kho nguyên vật liệu"},{"id":"other-deon2-q012-C","text":"Kế toán trưởng doanh nghiệp"},{"id":"other-deon2-q012-D","text":"Tất cả các câu trên","pinned":true}],"correctOptionId":"other-deon2-q012-D","explanation":"Chứng từ kế toán do người có liên quan đến nghiệp vụ lập (thủ kho lập phiếu nhập/xuất, kế toán lập phiếu thu/chi...), nên các đối tượng ở B, C đều có thể lập; khoá gốc chọn D (tất cả các câu trên). Phương án A diễn đạt rộng nên có thể gây tranh cãi.","source":"Slide Chương 3, slide 25 (Lập chứng từ kế toán)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn D nhưng phương án A (bất kỳ ai có kiến thức kế toán) không chặt chẽ về mặt quy định (người lập phải có trách nhiệm liên quan và ký tên). Giữ khoá gốc."}]},{"id":"other-deon2-u012","context":null,"questions":[{"id":"other-deon2-q013","num":"Câu 13","type":"mcq","text":"Giá trị ban đầu của Tài sản cố định được gọi là:","options":[{"id":"other-deon2-q013-A","text":"Giá gốc."},{"id":"other-deon2-q013-B","text":"Nguyên giá."},{"id":"other-deon2-q013-C","text":"Giá mua"},{"id":"other-deon2-q013-D","text":"Giá phí hợp lý"}],"correctOptionId":"other-deon2-q013-B","explanation":"Giá gốc của TSCĐ hữu hình được gọi là nguyên giá. Giá gốc là khái niệm chung cho mọi tài sản; với TSCĐ thì gọi là nguyên giá.","source":"Slide Chương 4, slide 17 (TSCĐ HH tính theo giá gốc, giá gốc của TSCĐ HH gọi là nguyên giá)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u013","context":null,"questions":[{"id":"other-deon2-q014","num":"Câu 14","type":"mcq","text":"Nhận thấy các loại hàng mà doanh nghiệp kinh doanh là loại quý hiếm, kế toán quyết định sử dụng phương pháp tính giá nào trong niên độ mới?","options":[{"id":"other-deon2-q014-A","text":"Nhập trước, xuất trước."},{"id":"other-deon2-q014-B","text":"Nhập sau, xuất trước."},{"id":"other-deon2-q014-C","text":"Thực tế đích danh."},{"id":"other-deon2-q014-D","text":"Bình quân gia quyền."}],"correctOptionId":"other-deon2-q014-C","explanation":"Hàng quý hiếm, có giá trị cao, nhận diện được từng lô/chiếc nên áp dụng phương pháp thực tế đích danh để phản ánh đúng giá vốn từng mặt hàng.","source":"Slide Chương 4, slide 37 (Thực tế đích danh)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u014","context":null,"questions":[{"id":"other-deon2-q015","num":"Câu 15","type":"mcq","text":"Chọn cách đánh giá tài sản mà giá trị TS của doanh nghiệp ở mức thấp nhất, là vấn đề thuộc nguyên tắc:","options":[{"id":"other-deon2-q015-A","text":"Trọng yếu."},{"id":"other-deon2-q015-B","text":"Phù hợp."},{"id":"other-deon2-q015-C","text":"Thận trọng."},{"id":"other-deon2-q015-D","text":"Khách quan."}],"correctOptionId":"other-deon2-q015-C","explanation":"Nguyên tắc thận trọng: không đánh giá cao hơn giá trị tài sản và thu nhập, không đánh giá thấp hơn nợ phải trả và chi phí; khi có nhiều cách thì chọn cách làm giá trị tài sản thấp nhất.","source":"Slide Chương 1, slide 69–70 (Thận trọng)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u015","context":null,"questions":[{"id":"other-deon2-q016","num":"Câu 16","type":"mcq","text":"Khi bán hàng thì sẽ làm cho các nhân tố sau ảnh hưởng như thế nào?","options":[{"id":"other-deon2-q016-A","text":"Giá vốn hàng bán: Tăng; Doanh thu: Tăng; Tài sản: Tăng"},{"id":"other-deon2-q016-B","text":"Giá vốn hàng bán: Tăng; Doanh thu: Tăng; Tài sản: Giảm"},{"id":"other-deon2-q016-C","text":"Giá vốn hàng bán: Giảm; Doanh thu: Tăng; Tài sản: Tăng"},{"id":"other-deon2-q016-D","text":"Giá vốn hàng bán: Giảm; Doanh thu: Giảm; Tài sản: Giảm"}],"correctOptionId":"other-deon2-q016-A","explanation":"Bán hàng: ghi nhận doanh thu (tăng) và đồng thời kết chuyển giá vốn hàng bán (tăng) theo nguyên tắc phù hợp. Tiền/phải thu tăng bằng giá bán, hàng tồn kho giảm bằng giá vốn; do giá bán lớn hơn giá vốn nên tổng tài sản tăng (bằng lãi gộp). Vậy đáp án A.","source":"Slide Chương 1, slide 66 (Phù hợp); Slide Chương 5 (kế toán bán hàng)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u016","context":null,"questions":[{"id":"other-deon2-q017","num":"Câu 17","type":"mcq","text":"Các tài khoản sau: 129, 229, 159, 1381, 413, 214.Tài khoản nào là khác nhất so với các tài khoản còn lại?","options":[{"id":"other-deon2-q017-A","text":"TK 413 và TK 1381"},{"id":"other-deon2-q017-B","text":"TK 214 và TK 229"},{"id":"other-deon2-q017-C","text":"TK 413"},{"id":"other-deon2-q017-D","text":"TK 1381"}],"correctOptionId":"other-deon2-q017-A","explanation":"TK 129, 229, 159, 214 là các tài khoản điều chỉnh giảm tài sản (dự phòng, hao mòn) có số dư bên Có. TK 1381 (tài sản thiếu chờ xử lý) là tài khoản tài sản số dư Nợ; TK 413 (chênh lệch tỷ giá) là tài khoản nguồn vốn/số dư Có tùy trường hợp. Hai tài khoản này khác nhóm còn lại nên chọn A.","source":"Slide Chương 3, slide 43 (phân loại tài khoản); TT200 (TK 129, 159, 214, 229, 413, 1381)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u017","context":"<p>Dùng dữ liệu sau đây trả lời các câu 18 và câu 19<\/p><p>Cho doanh thu bán hàng và cung cấp dịch vụ là 468.800.000đ, các khoản chiết khấu thương mại là 800.000đ, giá vốn hàng bán là 320.000.000đ<\/p>","questions":[{"id":"other-deon2-q018","num":"Câu 18","type":"mcq","text":"Doanh thu thuần về bán hàng và cung cấp dịch vụ là:","options":[{"id":"other-deon2-q018-A","text":"468.000.000đ"},{"id":"other-deon2-q018-B","text":"450.000.000đ"},{"id":"other-deon2-q018-C","text":"500.000.000đ"},{"id":"other-deon2-q018-D","text":"568.000.000đ"}],"correctOptionId":"other-deon2-q018-A","explanation":"Doanh thu thuần = Doanh thu bán hàng và cung cấp dịch vụ - Các khoản giảm trừ doanh thu (chiết khấu thương mại) = 468.800.000 - 800.000 = 468.000.000đ.","source":"Slide Chương 2, slide 41–46 (Báo cáo kết quả hoạt động kinh doanh); TT200 (Mẫu B02-DN)","answerBasis":"given","status":"ok"},{"id":"other-deon2-q019","num":"Câu 19","type":"mcq","text":"Lợi nhuận gộp về bán hàng và cung cấp dịch vụ là:","options":[{"id":"other-deon2-q019-A","text":"184.000.000đ"},{"id":"other-deon2-q019-B","text":"150.000.000đ"},{"id":"other-deon2-q019-C","text":"148.000.000đ"},{"id":"other-deon2-q019-D","text":"105.000.000đ"}],"correctOptionId":"other-deon2-q019-C","explanation":"Lợi nhuận gộp = Doanh thu thuần - Giá vốn hàng bán = 468.000.000 - 320.000.000 = 148.000.000đ (doanh thu thuần ở câu 18).","source":"Slide Chương 2, slide 41–46 (Báo cáo kết quả hoạt động kinh doanh); TT200 (Mẫu B02-DN)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u018","context":null,"questions":[{"id":"other-deon2-q020","num":"Câu 20","type":"mcq","text":"Theo phương pháp ghi nhận, kế toán có thể phân thành 2 loại:","options":[{"id":"other-deon2-q020-A","text":"Kế toán tài chính và kế toán quản trị."},{"id":"other-deon2-q020-B","text":"Kế toán dựa trên cơ sở tiền và kế toán dồn tích."},{"id":"other-deon2-q020-C","text":"Kế toán doanh nghiệp và kế toán công."},{"id":"other-deon2-q020-D","text":"Kế toán tổng hợp và kế toán chi tiết"}],"correctOptionId":"other-deon2-q020-B","explanation":"Theo phương pháp (cơ sở) ghi nhận: kế toán cơ sở tiền (ghi khi thu/chi tiền) và kế toán dồn tích (ghi khi phát sinh). A là phân loại theo đối tượng sử dụng thông tin, C theo lĩnh vực hoạt động, D theo mức độ phản ánh.","source":"Slide Chương 1, slide 60–62 (Cơ sở dồn tích, cơ sở tiền)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u019","context":null,"questions":[{"id":"other-deon2-q021","num":"Câu 21","type":"mcq","text":"Sổ kế toán tổng hợp của hình thức kế toán Nhật ký chung gồm","options":[{"id":"other-deon2-q021-A","text":"Nhật ký chung, nhật ký chuyên dùng, sổ cái"},{"id":"other-deon2-q021-B","text":"Nhật ký chung, sổ cái, bảng tổng hợp chi tiết"},{"id":"other-deon2-q021-C","text":"Nhật ký chung, sổ cái, bảng cân đối tài khoản"},{"id":"other-deon2-q021-D","text":"Nhật ký chung, nhật ký-sổ cái, sổ chuyên dùng"}],"correctOptionId":"other-deon2-q021-A","explanation":"Hình thức Nhật ký chung có sổ kế toán tổng hợp gồm Nhật ký chung (và các nhật ký chuyên dùng nếu có) và Sổ cái. Bảng tổng hợp chi tiết là sổ chi tiết/tổng hợp chi tiết, bảng cân đối tài khoản là báo cáo, Nhật ký - Sổ cái thuộc hình thức khác.","source":"Slide Chương 3, slide 77–79 (Sổ kế toán tổng hợp, Nhật ký chung)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u020","context":null,"questions":[{"id":"other-deon2-q022","num":"Câu 22","type":"mcq","text":"Khi tập hợp chi phí sản xuất để tính giá thành của thành phẩm thì kế toán sẽ tập hợp khoản mục nào trước tiên?","options":[{"id":"other-deon2-q022-A","text":"Chi phí nguyên vật liệu trực tiếp"},{"id":"other-deon2-q022-B","text":"Chi phí sản xuất chung"},{"id":"other-deon2-q022-C","text":"Chi phí nhân công trực tiếp"},{"id":"other-deon2-q022-D","text":"Tất cả đều đúng","pinned":true}],"correctOptionId":"other-deon2-q022-D","explanation":"Theo khoá gốc chọn D: các khoản mục chi phí (NVL trực tiếp, nhân công trực tiếp, sản xuất chung) đều được tập hợp trong kỳ, không bắt buộc có thứ tự cố định; chi phí trực tiếp được tập hợp thẳng vào TK 621, 622 còn chi phí chung tập hợp ở TK 627 rồi phân bổ.","source":"Slide Chương 5, slide 50–58 (tập hợp chi phí sản xuất: TK 621, 622, 627, kết chuyển TK 154)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn D; câu hỏi mơ hồ (nhiều giáo trình coi chi phí NVL trực tiếp là khoản mục tập hợp đầu tiên). Giữ khoá gốc."}]},{"id":"other-deon2-u021","context":null,"questions":[{"id":"other-deon2-q023","num":"Câu 23","type":"mcq","text":"Nguyên giá của tài sản cố định được mua sắm:","options":[{"id":"other-deon2-q023-A","text":"Giá mua TSCĐ."},{"id":"other-deon2-q023-B","text":"Giá thị trường"},{"id":"other-deon2-q023-C","text":"Giá mua thực tế và chi phí trước khi sử dụng."},{"id":"other-deon2-q023-D","text":"Cả 3 câu đều sai.","pinned":true}],"correctOptionId":"other-deon2-q023-C","explanation":"Nguyên giá TSCĐ mua sắm = giá mua thực tế (đã trừ chiết khấu, giảm giá, không gồm thuế GTGT được khấu trừ) + các chi phí liên quan trực tiếp để đưa TSCĐ vào sử dụng (vận chuyển, lắp đặt, chạy thử...).","source":"Slide Chương 4, slide 17–18 (Nguyên giá TSCĐ HH do mua sắm)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u022","context":null,"questions":[{"id":"other-deon2-q024","num":"Câu 24","type":"mcq","text":"Bảng chấm công là:","options":[{"id":"other-deon2-q024-A","text":"Chứng từ mệnh lệnh"},{"id":"other-deon2-q024-B","text":"Chứng từ ghi sổ"},{"id":"other-deon2-q024-C","text":"Chứng từ gốc"},{"id":"other-deon2-q024-D","text":"Chứng từ chấp hành"}],"correctOptionId":"other-deon2-q024-B","explanation":"Theo khoá gốc chọn B. Lưu ý: bảng chấm công thuộc nhóm chứng từ lao động và tiền lương, là chứng từ ban đầu (chứng từ gốc) ghi nhận số ngày công thực tế, theo công dụng thuộc chứng từ chấp hành. Chứng từ mệnh lệnh chỉ truyền đạt lệnh; chứng từ ghi sổ là chứng từ tổng hợp lập để ghi sổ.","source":"Slide Chương 3, slide 14–17 (phân loại chứng từ; chứng từ lao động tiền lương: bảng chấm công)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn B (Chứng từ ghi sổ) có vẻ sai: bảng chấm công là chứng từ gốc (chứng từ lao động tiền lương), theo công dụng là chứng từ chấp hành (C hoặc D hợp lý hơn). Giữ khoá gốc theo yêu cầu."}]},{"id":"other-deon2-u023","context":null,"questions":[{"id":"other-deon2-q025","num":"Câu 25","type":"mcq","text":"Doanh nghiệp được cấp 1 tài sản cố định hữu hình đã sử dụng, số liệu được cung cấp như sau: <br>Nguyên giá: 30.000.000 đồng - Giá trị hao mòn: 2.000.000 đồng<br>Giá trị còn lại: 28.000.000 đồng - Chi phí vận chuyển: 1.000.000 đồng<br>Nguyên giá của tài sản cố định khi doanh nghiệp nhận về được xác định là:","options":[{"id":"other-deon2-q025-A","text":"28.000.000 đồng"},{"id":"other-deon2-q025-B","text":"29.000.000 đồng"},{"id":"other-deon2-q025-C","text":"30.000.000 đồng"},{"id":"other-deon2-q025-D","text":"31.000.000 đồng"}],"correctOptionId":"other-deon2-q025-B","explanation":"TSCĐ được cấp: nguyên giá = giá trị còn lại trên sổ sách ở đơn vị cấp + chi phí liên quan trực tiếp = 28.000.000 + 1.000.000 = 29.000.000 đồng.","source":"Slide Chương 4, slide 20 (Nguyên giá TSCĐ hữu hình được cấp)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u024","context":null,"questions":[{"id":"other-deon2-q026","num":"Câu 26","type":"mcq","text":"Nghiệp vụ: “Tiền điện dùng cho quản lý phân xưởng sẽ được kế toán hạch toán như thế nào?","options":[{"id":"other-deon2-q026-A","text":"Nợ 627 - Có 111"},{"id":"other-deon2-q026-B","text":"Nợ 627 - Có 331"},{"id":"other-deon2-q026-C","text":"Nợ 627 - Có 338"},{"id":"other-deon2-q026-D","text":"Nợ 621 - Có 331"}],"correctOptionId":"other-deon2-q026-B","explanation":"Tiền điện dùng cho quản lý phân xưởng là chi phí sản xuất chung: Nợ TK 627. Khoản phải trả cho nhà cung cấp điện (chưa trả tiền) ghi Có TK 331. Nợ 621 chỉ dùng cho nguyên vật liệu trực tiếp; Có 338 là phải trả khác, Có 111 chỉ khi trả ngay bằng tiền mặt.","source":"Slide Chương 5, slide 56–58 (Tài khoản 627 – Chi phí sản xuất chung)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u025","context":null,"questions":[{"id":"other-deon2-q027","num":"Câu 27","type":"mcq","text":"Chi phí sản xuất dở dang đầu kì: 10.000.000 đồng;<br>Chi phí sản xuất phát sinh trong kì: chi phí nguyên vật liệu trực tiếp 30.000.000 đồng; chi phí nhân công trực tiếp 24.400.000 đồng; chi phí sản xuất chung 15.600.000 đồng. Cuối kỳ không có sản phẩm dở dang.<br>Giá trị thực tế nhập kho là:","options":[{"id":"other-deon2-q027-A","text":"80.000.000 đồng"},{"id":"other-deon2-q027-B","text":"60.000.000 đồng"},{"id":"other-deon2-q027-C","text":"70.000.000 đồng"},{"id":"other-deon2-q027-D","text":"54.400.000 đồng"}],"correctOptionId":"other-deon2-q027-A","explanation":"Z = CPSXDD đầu kỳ + CPSX phát sinh - CPSXDD cuối kỳ = 10.000.000 + (30.000.000 + 24.400.000 + 15.600.000) - 0 = 10.000.000 + 70.000.000 = 80.000.000 đồng.","source":"Slide Chương 5, slide 50–58 (tập hợp chi phí, kết chuyển TK 154, tính giá thành)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u026","context":null,"questions":[{"id":"other-deon2-q028","num":"Câu 28","type":"mcq","text":"Phát biểu nào sau đây là sai?","options":[{"id":"other-deon2-q028-A","text":"Tất cả các tài khoản tài sản đều có số dư bên Nợ"},{"id":"other-deon2-q028-B","text":"Mỗi đơn vị kế toán chỉ có 1 hệ thống sổ kế toán cho một kỳ kế toán năm"},{"id":"other-deon2-q028-C","text":"Bảng cân đối kế toán phản ánh tình hình tài sản của doanh nghiệp theo 2 mặt kết cấu tài sản và nguồn hình thành"},{"id":"other-deon2-q028-D","text":"Việc sử dụng tài khoản 214 là để đảm bảo nguyên tắc giá gốc"}],"correctOptionId":"other-deon2-q028-A","explanation":"A sai: có tài khoản thuộc tài sản nhưng có số dư bên Có (TK 214 hao mòn TSCĐ, TK 229, 2294 dự phòng...). B, C đúng theo quy định. D đúng: TK 214 giúp giữ nguyên giá (giá gốc) trên TK 211 và theo dõi riêng hao mòn.","source":"Slide Chương 3, slide 43 (phân loại TK); Slide Chương 4, slide 23 (nguyên giá, hao mòn lũy kế); Slide Chương 1, slide 64 (Giá gốc)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u027","context":null,"questions":[{"id":"other-deon2-q029","num":"Câu 29","type":"mcq","text":"Tại doanh nghiệp Thiên Hà có bảng cân đối kế toán ngày 30/06/2010 như sau (Đơn vị tính: 1.000 đồng):<table class=\"t\"><thead><tr><th>Tên Tài sản<\/th><th>Số tiền<\/th><th>Tên Nguồn vốn<\/th><th>Số tiền<\/th><\/tr><\/thead><tbody><tr><td>Tiền mặt<\/td><td class=\"num\">7.000<\/td><td>Vay ngắn hạn<\/td><td class=\"num\">37.000<\/td><\/tr><tr><td>Tiền gửi Ngân hàng<\/td><td class=\"num\">20.000<\/td><td>Phải trả người bán<\/td><td class=\"num\">8.000<\/td><\/tr><tr><td>Phải thu khách hàng<\/td><td class=\"num\">3.000<\/td><td>Nguồn vốn kinh doanh<\/td><td class=\"num\">113.000<\/td><\/tr><tr><td>Nguyên liệu vật liệu<\/td><td class=\"num\">7.000<\/td><td><\/td><td><\/td><\/tr><tr><td>Hàng hóa<\/td><td class=\"num\">36.000<\/td><td><\/td><td><\/td><\/tr><tr><td>Tài sản cố định hữu hình<\/td><td class=\"num\">85.000<\/td><td><\/td><td><\/td><\/tr><tr><td><b>Cộng<\/b><\/td><td class=\"num\"><b>158.000<\/b><\/td><td><b>Cộng<\/b><\/td><td class=\"num\"><b>158.000<\/b><\/td><\/tr><\/tbody><\/table>Các nghiệp vụ kinh tế phát sinh trong tháng 7 như sau:<br>1, Khách hàng A trả nợ 2.000.000 đồng bằng tiền mặt<br>2, Khách hàng B ứng trước cho Doanh nghiệp 8.000.000 đồng bằng tiền gửi Ngân hàng<br>3, Doanh nghiệp xuất tiền mặt trả nợ người bán X 3.000.000 đồng<br>4, Doanh nghiệp xuất tiền mặt ứng trước cho người bán Y 2.000.000 đồng<br>5, Doanh nghiệp được cấp 1 tài sản cố định hữu hình nguyên giá 15.000.000 đồng<br>Như vậy cuối tháng 7/2010 tổng tài sản của doanh nghiệp sẽ là:","options":[{"id":"other-deon2-q029-A","text":"183.000.000 đồng"},{"id":"other-deon2-q029-B","text":"164.000.000 đồng"},{"id":"other-deon2-q029-C","text":"178.000.000 đồng"},{"id":"other-deon2-q029-D","text":"163.000.000 đồng"}],"correctOptionId":"other-deon2-q029-C","explanation":"Tổng tài sản đầu kỳ 158.000 (nghìn đồng). Nghiệp vụ 1: tiền mặt tăng, phải thu giảm: tổng không đổi. NV2: TGNH tăng 8.000, khách hàng ứng trước (nợ) tăng: tổng tài sản +8.000. NV3: trả nợ bằng tiền: -3.000. NV4: tiền giảm, trả trước cho người bán tăng: không đổi. NV5: TSCĐ tăng 15.000 (nguồn vốn kinh doanh tăng): +15.000. Tổng = 158.000 + 8.000 - 3.000 + 15.000 = 178.000 (nghìn đồng) = 178.000.000 đồng. Kiểm tra bên nguồn vốn: 158.000 + 8.000 - 3.000 + 15.000 = 178.000.","source":"Slide Chương 1, slide 49 (ảnh hưởng nghiệp vụ lên tài sản và nguồn vốn); Slide Chương 2, slide 31–36 (Báo cáo tình hình tài chính)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u028","context":null,"questions":[{"id":"other-deon2-q030","num":"Câu 30","type":"mcq","text":"Phế liệu thu hồi nhập lại kho trị giá 200, kế toán ghi nhận:","options":[{"id":"other-deon2-q030-A","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 200<\/div><div class=\"cr\">Có TK 621 &nbsp; 200<\/div><\/div>"},{"id":"other-deon2-q030-B","text":"<div class=\"je\"><div>Nợ TK 154 &nbsp; 200<\/div><div class=\"cr\">Có TK 621 &nbsp; 200<\/div><\/div>"},{"id":"other-deon2-q030-C","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 200<\/div><div class=\"cr\">Có TK 154 &nbsp; 200<\/div><\/div>"},{"id":"other-deon2-q030-D","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 200<\/div><div class=\"cr\">Có TK 627 &nbsp; 200<\/div><\/div>"}],"correctOptionId":"other-deon2-q030-C","explanation":"Phế liệu thu hồi từ quá trình sản xuất nhập kho: Nợ TK 152 (giá trị phế liệu), Có TK 154 (giảm chi phí sản xuất dở dang). Có TK 621/627 không phản ánh đúng nơi tập hợp chi phí cuối cùng; Nợ 154/Có 621 không nhập kho phế liệu.","source":"Slide Chương 5, slide 62 (Phế liệu thu hồi) ; TT200 (TK 152, 154)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u029","context":null,"questions":[{"id":"other-deon2-q031","num":"Câu 31","type":"mcq","text":"Tài khoản chi phí có đặc điểm","options":[{"id":"other-deon2-q031-A","text":"Số dư bên Nợ"},{"id":"other-deon2-q031-B","text":"Số dư bên Có"},{"id":"other-deon2-q031-C","text":"Không có số dư vào thời điểm cuối kì"},{"id":"other-deon2-q031-D","text":"Tùy theo loại chi phí"}],"correctOptionId":"other-deon2-q031-C","explanation":"Tài khoản chi phí là tài khoản trung gian: cuối kỳ được kết chuyển sang tài khoản xác định kết quả kinh doanh nên không có số dư cuối kỳ (riêng các TK tập hợp chi phí sản xuất như 154 là TK tài sản).","source":"Slide Chương 3, slide 43 (tài khoản trung gian)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u030","context":null,"questions":[{"id":"other-deon2-q032","num":"Câu 32","type":"mcq","text":"Doanh nghiệp nộp thuế GTGT theo phương pháp khấu trừ mua một tài sản cố định giá mua 10.000.000đ, thuế GTGT 10%, tiền vận chuyển lắp đặt 1.000.000đ, thuế GTGT 5%. Vậy nguyên giá của tài sản cố định là","options":[{"id":"other-deon2-q032-A","text":"11.000.000đ"},{"id":"other-deon2-q032-B","text":"11.500.000đ"},{"id":"other-deon2-q032-C","text":"12.500.000đ"},{"id":"other-deon2-q032-D","text":"12.550.000đ"}],"correctOptionId":"other-deon2-q032-A","explanation":"DN nộp thuế theo phương pháp khấu trừ: thuế GTGT đầu vào được khấu trừ (Nợ TK 133) nên không tính vào nguyên giá. Nguyên giá = 10.000.000 + 1.000.000 = 11.000.000đ.","source":"Slide Chương 4, slide 18 (Nguyên giá TSCĐ mua sắm); Slide Chương 5, slide 8–10 (TK 133)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u031","context":null,"questions":[{"id":"other-deon2-q033","num":"Câu 33","type":"mcq","text":"Trong phương pháp kê khai thường xuyên, tài khoản dùng để tập hợp các khoản mục chi phí sản xuất là:","options":[{"id":"other-deon2-q033-A","text":"TK 154"},{"id":"other-deon2-q033-B","text":"TK 632"},{"id":"other-deon2-q033-C","text":"TK 627"},{"id":"other-deon2-q033-D","text":"TK 155"}],"correctOptionId":"other-deon2-q033-A","explanation":"Theo phương pháp kê khai thường xuyên, chi phí NVL trực tiếp, nhân công trực tiếp, sản xuất chung được kết chuyển và tập hợp vào TK 154 - Chi phí sản xuất kinh doanh dở dang để tính giá thành. TK 627 chỉ tập hợp chi phí sản xuất chung; TK 632 là giá vốn; TK 155 là thành phẩm.","source":"Slide Chương 5, slide 50–58 (kết chuyển sang TK 154)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u032","context":null,"questions":[{"id":"other-deon2-q034","num":"Câu 34","type":"mcq","text":"Tính chất của tài khoản “phải trả người bán” là:","options":[{"id":"other-deon2-q034-A","text":"Tài khoản tài sản"},{"id":"other-deon2-q034-B","text":"Tài khoản nguồn vốn"},{"id":"other-deon2-q034-C","text":"Tài khoản trung gian"},{"id":"other-deon2-q034-D","text":"Tài khoản hỗn hợp"}],"correctOptionId":"other-deon2-q034-D","explanation":"TK 331 Phải trả người bán là tài khoản hỗn hợp (lưỡng tính): số dư Có là phải trả người bán, số dư Nợ là trả trước cho người bán (tài sản). Khoá gốc chọn D.","source":"Slide Chương 3, slide 52 và 55 (Tài khoản hỗn hợp); Slide Chương 2, slide 38–39 (Phải trả người bán là TK hỗn hợp)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u033","context":null,"questions":[{"id":"other-deon2-q035","num":"Câu 35","type":"mcq","text":"Nguyên tắc ghi chép trên Tài khoản Nguồn vốn:","options":[{"id":"other-deon2-q035-A","text":"Số phát sinh tăng trong kỳ và số dư cuối kỳ ghi Nợ"},{"id":"other-deon2-q035-B","text":"Số dư đầu kỳ và số phát sinh giảm trong kỳ ghi Có."},{"id":"other-deon2-q035-C","text":"Số dư cuối kỳ luôn bằng 0"},{"id":"other-deon2-q035-D","text":"Số phát sinh giảm trong kỳ ghi Nợ"}],"correctOptionId":"other-deon2-q035-D","explanation":"Tài khoản nguồn vốn: số dư đầu kỳ, phát sinh tăng và số dư cuối kỳ ghi bên Có; phát sinh giảm ghi bên Nợ. A sai (ghi Có), B sai (phát sinh giảm ghi Nợ), C sai (chỉ TK trung gian không có số dư).","source":"Slide Chương 3, slide 44–49 (kết cấu tài khoản tài sản và nguồn vốn)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u034","context":null,"questions":[{"id":"other-deon2-q036","num":"Câu 36","type":"mcq","text":"Doanh nghiệp không được phép thay đổi phương pháp tính khấu hao trong một kỳ kế toán nhằm đảm bảo nguyên tắc nào sau đây?","options":[{"id":"other-deon2-q036-A","text":"Hoạt động liên tục"},{"id":"other-deon2-q036-B","text":"Giá gốc"},{"id":"other-deon2-q036-C","text":"Nhất quán"},{"id":"other-deon2-q036-D","text":"Phù hợp"}],"correctOptionId":"other-deon2-q036-C","explanation":"Nguyên tắc nhất quán: chính sách và phương pháp kế toán đã chọn phải áp dụng thống nhất ít nhất trong một kỳ kế toán năm; nếu thay đổi phải giải trình.","source":"Slide Chương 1, slide 68 (Nhất quán)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u035","context":null,"questions":[{"id":"other-deon2-q037","num":"Câu 37","type":"mcq","text":"Nếu đơn vị tính nộp thuế giá trị gia tăng theo phương pháp khấu trừ, khi mua hàng nhập kho không phát sinh khoảng chi phí nào khác thì giá trị ghi sổ của hàng này là:","options":[{"id":"other-deon2-q037-A","text":"Giá vốn của người bán"},{"id":"other-deon2-q037-B","text":"Giá không có VAT"},{"id":"other-deon2-q037-C","text":"Tổng giá thanh toán"},{"id":"other-deon2-q037-D","text":"Không có trường hợp nào"}],"correctOptionId":"other-deon2-q037-B","explanation":"Theo phương pháp khấu trừ, thuế GTGT đầu vào hạch toán riêng vào TK 133 nên giá ghi sổ hàng tồn kho là giá mua không có thuế GTGT (nếu không có chi phí khác).","source":"Slide Chương 4 (giá gốc hàng tồn kho); Slide Chương 5, slide 8–10 (TK 133)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u036","context":null,"questions":[{"id":"other-deon2-q038","num":"Câu 38","type":"mcq","text":"Khoản tiền khách hàng ứng trước cho doanh nghiệp cho một dịch vụ sẽ thực hiện trong tương lai có tính vào doanh thu không? Vì sao?","options":[{"id":"other-deon2-q038-A","text":"Có, theo nguyên tắc cơ sở dồn tích"},{"id":"other-deon2-q038-B","text":"Không, theo nguyên tắc thận trọng"},{"id":"other-deon2-q038-C","text":"Có, theo nguyên tắc phù hợp"},{"id":"other-deon2-q038-D","text":"Không, theo nguyên tắc trọng yếu"}],"correctOptionId":"other-deon2-q038-B","explanation":"Tiền khách hàng ứng trước là khoản nhận trước (nợ phải trả/người mua trả tiền trước), chưa ghi nhận doanh thu vì dịch vụ chưa cung cấp. Câu trả lời ''Không'' đúng; trong các lý do đưa ra, khoá gốc chọn nguyên tắc thận trọng (không ghi nhận doanh thu khi chưa chắc chắn/ chưa hoàn thành). Về bản chất, đây cũng là hệ quả của cơ sở dồn tích (doanh thu ghi nhận khi dịch vụ hoàn thành).","source":"Slide Chương 1, slide 61–62 (Cơ sở dồn tích), 69–70 (Thận trọng)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn B (Không, theo thận trọng); lý do chặt chẽ hơn thường là cơ sở dồn tích/ doanh thu chỉ ghi nhận khi dịch vụ hoàn thành (không có phương án 'Không, theo dồn tích'). Giữ khoá gốc."}]},{"id":"other-deon2-u037","context":null,"questions":[{"id":"other-deon2-q039","num":"Câu 39","type":"mcq","text":"Có các số liệu doanh thu bán hàng 37.500.000, giảm giá hàng bán 3.500.000, chiết khấu thương mại 2.000.000, chiết khấu thanh toán 1.500.000, chỉ tiêu doanh thu thuần là:","options":[{"id":"other-deon2-q039-A","text":"35.500.000"},{"id":"other-deon2-q039-B","text":"34.000.000"},{"id":"other-deon2-q039-C","text":"32.000.000"},{"id":"other-deon2-q039-D","text":"30.500.000"}],"correctOptionId":"other-deon2-q039-C","explanation":"Doanh thu thuần = Doanh thu - giảm giá hàng bán - chiết khấu thương mại = 37.500.000 - 3.500.000 - 2.000.000 = 32.000.000. Chiết khấu thanh toán là chi phí tài chính, không trừ vào doanh thu thuần.","source":"Slide Chương 2, slide 41–46 (Báo cáo kết quả hoạt động kinh doanh)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u038","context":null,"questions":[{"id":"other-deon2-q040","num":"Câu 40","type":"mcq","text":"Giá cả dự kiến trong niên độ mới có chiều hướng gia tăng, kế toán quyết định sử dụng phương pháp tính giá trong niên độ mới để kế toán thuế thu nhập:","options":[{"id":"other-deon2-q040-A","text":"Nhập trước, xuất trước."},{"id":"other-deon2-q040-B","text":"Nhập sau, xuất trước."},{"id":"other-deon2-q040-C","text":"Thực tế đích danh."},{"id":"other-deon2-q040-D","text":"Bình quân gia quyền."}],"correctOptionId":"other-deon2-q040-B","explanation":"Giá tăng: LIFO (nhập sau, xuất trước) tính giá vốn cao hơn, lợi nhuận thấp hơn nên thuế thu nhập phải nộp thấp hơn trong kỳ.","source":"Slide Chương 4, slide 37–39 (Các phương pháp tính giá xuất kho)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u039","context":null,"questions":[{"id":"other-deon2-q041","num":"Câu 41","type":"mcq","text":"Bảng tổng hợp chi tiết:","options":[{"id":"other-deon2-q041-A","text":"Là bảng cân đối kế toán cuối kỳ"},{"id":"other-deon2-q041-B","text":"Dùng để kiểm tra, đối chiếu số liệu ghi chép của kế toán tổng hợp và kế toán chi tiết"},{"id":"other-deon2-q041-C","text":"Dùng để tổng hợp số liệu chứng từ gốc"},{"id":"other-deon2-q041-D","text":"Tất cả đều đúng","pinned":true}],"correctOptionId":"other-deon2-q041-B","explanation":"Bảng tổng hợp chi tiết lập từ các sổ chi tiết, dùng đối chiếu với sổ cái (kế toán tổng hợp) nên B đúng; A, C sai (không phải BCĐKT hay bảng tổng hợp chứng từ gốc).","source":"Slide Chương 3, slide 72–73 (kế toán tổng hợp và chi tiết); slide 77–79","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u040","context":null,"questions":[{"id":"other-deon2-q042","num":"Câu 42","type":"mcq","text":"Chứng từ nào sau đây không thể làm căn cứ để ghi sổ?","options":[{"id":"other-deon2-q042-A","text":"Hóa đơn bán hàng"},{"id":"other-deon2-q042-B","text":"Phiếu xuất kho"},{"id":"other-deon2-q042-C","text":"Lệnh chi tiền"},{"id":"other-deon2-q042-D","text":"Phiếu chi"}],"correctOptionId":"other-deon2-q042-C","explanation":"Lệnh chi tiền là chứng từ mệnh lệnh, mới chứng minh xuất xứ nghiệp vụ, chưa nói lên mức độ hoàn thành nên chưa làm căn cứ ghi sổ. Hóa đơn, phiếu xuất kho, phiếu chi là chứng từ chấp hành làm căn cứ ghi sổ. Đúng thứ tự phương án: A Hóa đơn bán hàng, B Phiếu xuất kho, C Lệnh chi tiền, D Phiếu chi.","source":"Slide Chương 3, slide 15–16 (Chứng từ mệnh lệnh, chứng từ chấp hành)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u041","context":null,"questions":[{"id":"other-deon2-q043","num":"Câu 43","type":"mcq","text":"Đầu kì tại một doanh nghiệp có các tài liệu: Tiền mặt 50, Tiền gửi ngân hàng 150, Tài sản cố định hữu hình 1.200, Hao mòn tài sản cố định 200, Trả trước người bán 200, Khách hàng trả trước 100, và nguồn vốn kinh doanh.<br>Sau đó phát sinh nghiệp vụ kinh tế: phát hành trái phiếu thu bằng tiền mặt 500. Vậy Tài sản và nguồn vốn kinh doanh lúc này là:","options":[{"id":"other-deon2-q043-A","text":"2.200 và 2.000"},{"id":"other-deon2-q043-B","text":"1.900 và 1.800"},{"id":"other-deon2-q043-C","text":"1.900 và 1.300"},{"id":"other-deon2-q043-D","text":"1.800 và 1.100"}],"correctOptionId":"other-deon2-q043-C","explanation":"Đầu kỳ: Tài sản = 50 + 150 + (1.200 - 200) + 200 = 1.400. Nợ phải trả = khách hàng trả trước 100. Nguồn vốn kinh doanh = 1.400 - 100 = 1.300. Phát hành trái phiếu thu tiền: tiền tăng 500 và nợ phải trả (trái phiếu) tăng 500, không làm đổi vốn kinh doanh. Cuối cùng: Tài sản = 1.400 + 500 = 1.900; nguồn vốn kinh doanh = 1.300.","source":"Slide Chương 1, slide 49–50 (phương trình kế toán); Slide Chương 2, slide 31–34","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u042","context":null,"questions":[{"id":"other-deon2-q044","num":"Câu 44","type":"mcq","text":"Ghi sổ kép là","options":[{"id":"other-deon2-q044-A","text":"Một phương pháp của kế toán dùng để ghi một nghiệp vụ kinh tế phát sinh vào ít nhất 2 tài khoản theo đúng nội dung kinh tế và mối quan hệ khách quan của các đối tượng có trong nghiệp vụ kinh tế"},{"id":"other-deon2-q044-B","text":"Một phương pháp của kế toán dùng để phản ánh và kiểm soát một cách thường xuyên, liên tục và có hệ thống từng đối tượng kế toán riêng biệt trong quá trình hoạt động sản xuất kinh doanh của doanh nghiệp"},{"id":"other-deon2-q044-C","text":"Là phương pháp kế toán được thực hiện thông qua việc lập các báo cáo kế toán"},{"id":"other-deon2-q044-D","text":"Tất cả đều đúng","pinned":true}],"correctOptionId":"other-deon2-q044-A","explanation":"A là định nghĩa ghi sổ kép (ghi vào ít nhất 2 tài khoản). B là định nghĩa phương pháp tài khoản kế toán; C là phương pháp tổng hợp và cân đối kế toán.","source":"Slide Chương 3, slide 63–64 (Ghi sổ kép)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u043","context":"<p>Áp dụng giả thuyết sau cho 3 câu 45, 46, 47<\/p><p>Vật liệu tồn kho đầu tháng là 5.000kg đơn giá 43đ/kg. Mua nguyên vật liệu nhập kho 2.500kg đơn giá 45đ/kg, thuế GTGT 10% trả bằng tiền gởi NH. Chi phí vận chuyển vật liệu nhập kho trả bằng tiền mặt là 1.300đ. Vật liệu mua với số lượng lớn nên được hưởng khoản giảm giá là 500đ. Xuất kho vật liệu 3.000kg. Vật liệu xuất kho tính theo phương pháp bình quân gia quyền cố định.<\/p>","questions":[{"id":"other-deon2-q045","num":"Câu 45","type":"mcq","text":"Định khoản nhập kho vật liệu căn cứ theo hóa đơn :","options":[{"id":"other-deon2-q045-A","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 112.500<\/div><div>Nợ TK 133 &nbsp; 11.250<\/div><div class=\"cr\">Có TK 112 &nbsp; 123.750<\/div><\/div>"},{"id":"other-deon2-q045-B","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 112.500<\/div><div class=\"cr\">Có TK 112 &nbsp; 112.500<\/div><\/div>"},{"id":"other-deon2-q045-C","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 112.500<\/div><div>Nợ TK 333 &nbsp; 11.250<\/div><div class=\"cr\">Có TK 112 &nbsp; 123.750<\/div><\/div>"},{"id":"other-deon2-q045-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-deon2-q045-A","explanation":"Giá mua 2.500 x 45 = 112.500; thuế GTGT 10% = 11.250 (khấu trừ, Nợ TK 133); trả bằng tiền gửi ngân hàng 123.750. Bút toán theo hóa đơn: Nợ TK 152 112.500, Nợ TK 133 11.250, Có TK 112 123.750 (phương án A). Chi phí vận chuyển và giảm giá được ghi nhận riêng (câu 46).","source":"Slide Chương 5, slide 8–10, 17–18 (kế toán mua vật liệu, TK 133)","answerBasis":"given","status":"ok"},{"id":"other-deon2-q046","num":"Câu 46","type":"mcq","text":"Đơn giá nhập:","options":[{"id":"other-deon2-q046-A","text":"45đ"},{"id":"other-deon2-q046-B","text":"44,8đ"},{"id":"other-deon2-q046-C","text":"49,5đ"},{"id":"other-deon2-q046-D","text":"45,32đ"}],"correctOptionId":"other-deon2-q046-D","explanation":"Giá gốc nhập = 2.500 x 45 + 1.300 (vận chuyển) - 500 (giảm giá) = 112.500 + 1.300 - 500 = 113.300. Đơn giá nhập = 113.300 / 2.500 = 45,32đ/kg.","source":"Slide Chương 4 (giá gốc hàng tồn kho nhập); Slide Chương 5 (kế toán vật liệu)","answerBasis":"given","status":"ok"},{"id":"other-deon2-q047","num":"Câu 47","type":"mcq","text":"Xuất kho vật liệu, tính đơn giá bình quân","options":[{"id":"other-deon2-q047-A","text":"43,67đ"},{"id":"other-deon2-q047-B","text":"45,17đ"},{"id":"other-deon2-q047-C","text":"43,55đ"},{"id":"other-deon2-q047-D","text":"Đáp án khác"}],"correctOptionId":"other-deon2-q047-D","explanation":"Bình quân gia quyền (cuối kỳ) = (5.000 x 43 + 113.300) / (5.000 + 2.500) = (215.000 + 113.300) / 7.500 = 328.300 / 7.500 = 43,77đ. Giá này không trùng 43,67 (đó là kết quả nếu bỏ chi phí vận chuyển và giảm giá), 45,17 hay 43,55 nên chọn D. Nếu hiểu ''bình quân cố định'' là đơn giá đầu kỳ (43đ) thì cũng không có trong phương án -> D.","source":"Slide Chương 4, slide 37–38 (Bình quân gia quyền)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u044","context":null,"questions":[{"id":"other-deon2-q048","num":"Câu 48","type":"mcq","text":"Mua vật liệu nhập kho, giá mua chưa thuế 1.000.000 đồng, thuế GTGT 10%, chi phí vận chuyển 50.000 đồng, giá gốc vật liệu mua là:","options":[{"id":"other-deon2-q048-A","text":"1.000.000 đồng"},{"id":"other-deon2-q048-B","text":"1.050.000 đồng."},{"id":"other-deon2-q048-C","text":"1.100.000 đồng."},{"id":"other-deon2-q048-D","text":"1.150.000 đồng."}],"correctOptionId":"other-deon2-q048-B","explanation":"Thuế GTGT khấu trừ không tính vào giá gốc. Giá gốc = 1.000.000 + 50.000 = 1.050.000 đồng.","source":"Slide Chương 4 (giá gốc hàng tồn kho); Slide Chương 5, slide 8–10 (TK 133)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u045","context":null,"questions":[{"id":"other-deon2-q049","num":"Câu 49","type":"mcq","text":"Vào cuối kỳ tại một doanh nghiệp có các tài liệu: Tiền mặt 3.000, nguyên vật liệu 4.000, hao mòn tài sản cố định 2.000, vay ngắn hạn 4.000, ứng trước cho người bán 1.000, tài sản cố định hữu hình 30.000 và nguồn vốn kinh doanh x. Vậy x là:","options":[{"id":"other-deon2-q049-A","text":"34.000"},{"id":"other-deon2-q049-B","text":"36.000"},{"id":"other-deon2-q049-C","text":"30.000"},{"id":"other-deon2-q049-D","text":"32.000"}],"correctOptionId":"other-deon2-q049-D","explanation":"Tài sản = 3.000 + 4.000 - 2.000 + 1.000 + 30.000 = 36.000. Nợ phải trả = vay ngắn hạn 4.000. Nguồn vốn kinh doanh x = 36.000 - 4.000 = 32.000.","source":"Slide Chương 1, slide 49–50 (Tài sản = Nợ phải trả + Vốn chủ sở hữu)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u046","context":null,"questions":[{"id":"other-deon2-q050","num":"Câu 50","type":"mcq","text":"Các đối tượng liên quan trong nguyên tắc phù hợp là:","options":[{"id":"other-deon2-q050-A","text":"Giá thành và giá vốn hàng bán"},{"id":"other-deon2-q050-B","text":"Chi phí và lợi nhuận."},{"id":"other-deon2-q050-C","text":"Chi phí và doanh thu."},{"id":"other-deon2-q050-D","text":"Doanh thu và lợi nhuận."}],"correctOptionId":"other-deon2-q050-C","explanation":"Nguyên tắc phù hợp: doanh thu và chi phí phải phù hợp nhau; chi phí tạo ra doanh thu của kỳ nào được ghi nhận cùng kỳ đó.","source":"Slide Chương 1, slide 66 (Phù hợp)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u047","context":null,"questions":[{"id":"other-deon2-q051","num":"Câu 51","type":"mcq","text":"Trong tháng 9/2010, doanh nghiệp thương mại Hòa Phong mua 30 ghế massage với giá 15.000.000 đ/chiếc. Doanh nghiệp đã bán được 25 chiếc với giá 25.000.000 đ/chiếc. Nếu doanh nghiệp thương mại Hòa Phong tiếp tục hoạt động trong năm sau, giá trị của 5 chiếc ghế massage còn lại sẽ được ghi nhận vào hàng tồn kho là:","options":[{"id":"other-deon2-q051-A","text":"75.000.000đ."},{"id":"other-deon2-q051-B","text":"60.000.000đ."},{"id":"other-deon2-q051-C","text":"125.000.000đ."},{"id":"other-deon2-q051-D","text":"A, B, C đều sai.","pinned":true}],"correctOptionId":"other-deon2-q051-A","explanation":"Hàng tồn kho ghi theo giá gốc (giả định hoạt động liên tục): 5 x 15.000.000 = 75.000.000đ, không tính theo giá bán (125.000.000đ).","source":"Slide Chương 1, slide 63–65 (Hoạt động liên tục, Giá gốc)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u048","context":null,"questions":[{"id":"other-deon2-q052","num":"Câu 52","type":"mcq","text":"Nhận thấy giá cả của các loại hàng mà doanh nghiệp kinh doanh không có biến động lớn, kế toán quyết định sử dụng phương pháp tính giá nào trong niên độ mới?","options":[{"id":"other-deon2-q052-A","text":"Nhập trước, xuất trước."},{"id":"other-deon2-q052-B","text":"Nhập sau, xuất trước."},{"id":"other-deon2-q052-C","text":"Thực tế đích danh."},{"id":"other-deon2-q052-D","text":"Bình quân gia quyền."}],"correctOptionId":"other-deon2-q052-D","explanation":"Giá ít biến động thì các phương pháp cho kết quả gần nhau; phương pháp bình quân gia quyền đơn giản, san đều chênh lệch giá nên phù hợp.","source":"Slide Chương 4, slide 37–38 (Bình quân gia quyền)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u049","context":null,"questions":[{"id":"other-deon2-q053","num":"Câu 53","type":"mcq","text":"Kế toán có các chức năng:","options":[{"id":"other-deon2-q053-A","text":"Thông tin và hoạch định."},{"id":"other-deon2-q053-B","text":"Thông tin và kiểm tra."},{"id":"other-deon2-q053-C","text":"Hoạch định và kiểm tra."},{"id":"other-deon2-q053-D","text":"Hoạch định và dự báo"}],"correctOptionId":"other-deon2-q053-B","explanation":"Kế toán có hai chức năng cơ bản: cung cấp thông tin và kiểm tra (kiểm soát).","source":"Slide Chương 1, slide 17–19 (Vai trò và chức năng của kế toán)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u050","context":null,"questions":[{"id":"other-deon2-q054","num":"Câu 54","type":"mcq","text":"Nhập kho 200kg nguyên vật liệu, giá mua 2.000đ/kg, thuế GTGT 10%, chi phí vận chuyển là 50.000đ, tất cả chưa thanh toán. Kế toán sẽ hoạch toán:","options":[{"id":"other-deon2-q054-A","text":"<div class=\"je\"><div>Nợ TK 153 &nbsp; 450.000đ<\/div><div>Nợ TK 133 &nbsp; 40.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 490.000đ<\/div><\/div>"},{"id":"other-deon2-q054-B","text":"<div class=\"je\"><div>Nợ TK 156 &nbsp; 450.000đ<\/div><div>Nợ TK 133 &nbsp; 40.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 490.000đ<\/div><\/div>"},{"id":"other-deon2-q054-C","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 450.000đ<\/div><div>Nợ TK 133 &nbsp; 40.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 490.000đ<\/div><\/div>"},{"id":"other-deon2-q054-D","text":"<div class=\"je\"><div>Nợ TK 152 &nbsp; 490.000đ<\/div><div class=\"cr\">Có TK 331 &nbsp; 490.000đ<\/div><\/div>"}],"correctOptionId":"other-deon2-q054-C","explanation":"Giá mua = 200 x 2.000 = 400.000; cộng vận chuyển 50.000 => giá gốc NVL = 450.000 (Nợ TK 152). Thuế GTGT = 10% x 400.000 = 40.000 (Nợ TK 133). Phải trả = 450.000 + 40.000 = 490.000 (Có TK 331; giả định vận chuyển cũng chưa thanh toán, không có thuế riêng). A sai tài khoản 153 (công cụ), B sai 156 (hàng hóa), D tính thuế vào giá gốc.","source":"Slide Chương 5, slide 8–10, 17–18 (kế toán mua vật liệu); Slide Chương 4 (giá gốc)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u051","context":null,"questions":[{"id":"other-deon2-q055","num":"Câu 55","type":"mcq","text":"Chọn câu sai trong các câu sau?","options":[{"id":"other-deon2-q055-A","text":"Thành phẩm là sản phẩm đã hoàn tất trong quá trình sản xuất."},{"id":"other-deon2-q055-B","text":"Hàng hóa là hàng tồn kho mà doanh nghiệp sản xuất để bán."},{"id":"other-deon2-q055-C","text":"Tạm ứng là khoản tiền mà doanh nghiệp ứng cho cán bộ công nhân viên của doanh nghiệp."},{"id":"other-deon2-q055-D","text":"Chi phí trả trước là khoản chi phí thực tế phát sinh ở 1 kì nhưng có liên quan tới nhiều kì và được phân bổ dần vào chi phí sản xuất kinh doanh trong nhiều kì."}],"correctOptionId":"other-deon2-q055-B","explanation":"B sai: hàng hóa là hàng doanh nghiệp mua vào để bán (không phải tự sản xuất); sản phẩm tự sản xuất để bán là thành phẩm. A, C, D đúng.","source":"Slide Chương 5 (kế toán hàng tồn kho, tạm ứng, chi phí trả trước); TT200 (TK 155, 156, 141, 242)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u052","context":null,"questions":[{"id":"other-deon2-q056","num":"Câu 56","type":"mcq","text":"Những người được cung cấp thông tin của kế toán quản trị bao gồm:","options":[{"id":"other-deon2-q056-A","text":"Các nhà quản trị doanh nghiệp."},{"id":"other-deon2-q056-B","text":"Chủ nợ"},{"id":"other-deon2-q056-C","text":"Các nhà đầu tư, cơ quan quản lý chức năng."},{"id":"other-deon2-q056-D","text":"Cả a và b đều đúng","pinned":true}],"correctOptionId":"other-deon2-q056-A","explanation":"Kế toán quản trị cung cấp thông tin cho nội bộ (các nhà quản trị doanh nghiệp). Chủ nợ, nhà đầu tư, cơ quan chức năng là đối tượng ngoài doanh nghiệp, sử dụng thông tin kế toán tài chính.","source":"Slide Chương 1, slide 8 và 13–15 (Kế toán quản trị)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u053","context":null,"questions":[{"id":"other-deon2-q057","num":"Câu 57","type":"mcq","text":"Tài khoản là:","options":[{"id":"other-deon2-q057-A","text":"Chứng từ kế toán"},{"id":"other-deon2-q057-B","text":"Báo cáo kế toán"},{"id":"other-deon2-q057-C","text":"Sổ kế toán tổng hợp"},{"id":"other-deon2-q057-D","text":"Phương pháp ghi chép và phản ánh"}],"correctOptionId":"other-deon2-q057-C","explanation":"Theo khoá gốc chọn C. Lưu ý: theo slide, tài khoản kế toán là phương pháp kế toán dùng để phân loại, hệ thống hóa, theo dõi thường xuyên tình hình và biến động của từng đối tượng kế toán, tức gần với phương án D. Tuy nhiên tài khoản cấp 1 cũng là hình thức của sổ kế toán tổng hợp (sổ cái ghi theo từng tài khoản).","source":"Slide Chương 3, slide 35–36 (Tài khoản kế toán là phương pháp kế toán...)","answerBasis":"given","status":"needs_review","reviewNote":"Khoá gốc chọn C (Sổ kế toán tổng hợp) mâu thuẫn với slide: tài khoản là phương pháp phân loại, ghi chép và phản ánh (D). Giữ khoá gốc."}]},{"id":"other-deon2-u054","context":null,"questions":[{"id":"other-deon2-q058","num":"Câu 58","type":"mcq","text":"Vật liệu tồn kho đầu tháng là 10kg, đơn giá x. Mua nhập kho 10kg giá chưa thuế 10.000đ/kg, thuế GTGT là 10%, chi phí vận chuyển 500đ/kg. Xuất kho 15kg theo phương pháp FIFO là 152.500đ. Giá trị x sẽ là:","options":[{"id":"other-deon2-q058-A","text":"10.000"},{"id":"other-deon2-q058-B","text":"10.500"},{"id":"other-deon2-q058-C","text":"10.800"},{"id":"other-deon2-q058-D","text":"9.850"}],"correctOptionId":"other-deon2-q058-A","explanation":"Đơn giá nhập (không gồm thuế GTGT khấu trừ) = 10.000 + 500 = 10.500đ/kg. FIFO xuất 15 kg = 10 kg tồn đầu x + 5 kg lô mua x 10.500. 10x + 52.500 = 152.500 => x = 10.000. Kiểm tra: 100.000 + 52.500 = 152.500.","source":"Slide Chương 4, slide 39 (FIFO)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u055","context":null,"questions":[{"id":"other-deon2-q059","num":"Câu 59","type":"mcq","text":"Trích khấu hao tài sản cố định dùng để trực tiếp sản xuất sản phẩm sẽ được kế toán hạch toán","options":[{"id":"other-deon2-q059-A","text":"<div class=\"je\"><div>Nợ TK 621<\/div><div>Nợ TK 627<\/div><div class=\"cr\">Có TK 214<\/div><\/div>"},{"id":"other-deon2-q059-B","text":"<div class=\"je\"><div>Nợ TK 627<\/div><div class=\"cr\">Có TK 214<\/div><\/div>"},{"id":"other-deon2-q059-C","text":"<div class=\"je\"><div>Nợ TK 621<\/div><div class=\"cr\">Có TK 214<\/div><\/div>"},{"id":"other-deon2-q059-D","text":"Tất cả đều sai","pinned":true}],"correctOptionId":"other-deon2-q059-B","explanation":"Khấu hao TSCĐ ở phân xưởng sản xuất là chi phí sản xuất chung: Nợ TK 627, Có TK 214. TK 621 chỉ phản ánh nguyên vật liệu trực tiếp.","source":"Slide Chương 5, slide 12–14 (Kế toán khấu hao TSCĐ: Nợ TK 627 chi tiết theo phân xưởng)","answerBasis":"given","status":"ok"}]},{"id":"other-deon2-u056","context":null,"questions":[{"id":"other-deon2-q060","num":"Câu 60","type":"mcq","text":"Có bao nhiêu loại định khoản","options":[{"id":"other-deon2-q060-A","text":"2"},{"id":"other-deon2-q060-B","text":"3"},{"id":"other-deon2-q060-C","text":"4"},{"id":"other-deon2-q060-D","text":"Không phân loại"}],"correctOptionId":"other-deon2-q060-A","explanation":"Có 2 loại định khoản: định khoản giản đơn (liên quan 2 tài khoản) và định khoản phức tạp (liên quan từ 3 tài khoản trở lên).","source":"Slide Chương 3, slide 68 (Định khoản giản đơn, định khoản phức tạp)","answerBasis":"given","status":"ok"}]}]},{"key":"cau2","title":"Câu hỏi 2 (kèm đáp án)","units":[{"id":"other-cau2-u001","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q001","num":"Ch1 – Câu 1","type":"mcq","text":"Đâu không phải là công việc của kế toán?","options":[{"id":"other-cau2-q001-A","text":"Ghi chép dữ liệu"},{"id":"other-cau2-q001-B","text":"Phân loại, sắp xếp dữ liệu"},{"id":"other-cau2-q001-C","text":"Quyết định phương án đầu tư"},{"id":"other-cau2-q001-D","text":"Cung cấp thông tin"}],"correctOptionId":"other-cau2-q001-C","explanation":"Kế toán ghi chép, phân loại, tổng hợp và cung cấp thông tin; việc ra quyết định đầu tư là của nhà quản lý/nhà đầu tư, kế toán chỉ cung cấp thông tin để họ quyết định.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u002","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q002","num":"Ch1 – Câu 2","type":"mcq","text":"Đâu là đối tượng của kế toán?","options":[{"id":"other-cau2-q002-A","text":"Tài sản"},{"id":"other-cau2-q002-B","text":"Nguồn hình thành tài sản"},{"id":"other-cau2-q002-C","text":"Quá trình hoạt động của tổ chức"},{"id":"other-cau2-q002-D","text":"Tất cả đều đúng","pinned":true}],"correctOptionId":"other-cau2-q002-D","explanation":"Đối tượng của kế toán gồm tài sản, nguồn hình thành tài sản và quá trình hoạt động (sự vận động) của chúng, nên cả a, b, c đều đúng.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u003","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q003","num":"Ch1 – Câu 3","type":"mcq","text":"Các khoản tương đương tiền thuộc?","options":[{"id":"other-cau2-q003-A","text":"Tài sản ngắn hạn"},{"id":"other-cau2-q003-B","text":"Tài sản dài hạn"},{"id":"other-cau2-q003-C","text":"Nguồn vốn"},{"id":"other-cau2-q003-D","text":"Nợ phải trả"}],"correctOptionId":"other-cau2-q003-A","explanation":"Các khoản tương đương tiền (kỳ hạn gốc không quá 3 tháng) thuộc nhóm tài sản ngắn hạn, cùng với tiền.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u004","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q004","num":"Ch1 – Câu 4","type":"mcq","text":"Tài sản có tính thanh khoản cao nhất?","options":[{"id":"other-cau2-q004-A","text":"Tài sản cố định"},{"id":"other-cau2-q004-B","text":"Tiền mặt"},{"id":"other-cau2-q004-C","text":"Tiền gửi Ngân hàng"},{"id":"other-cau2-q004-D","text":"Đầu tư tài chính ngắn hạn"}],"correctOptionId":"other-cau2-q004-B","explanation":"Tiền mặt có tính thanh khoản cao nhất vì sử dụng ngay để thanh toán, không cần chuyển đổi.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u005","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q005","num":"Ch1 – Câu 5","type":"mcq","text":"Phân loại theo phạm vi cung cấp thông tin, kế toán gồm?","options":[{"id":"other-cau2-q005-A","text":"Kế toán đơn và kế toán kép"},{"id":"other-cau2-q005-B","text":"Kế toán tổng hợp và kế toán chi tiết"},{"id":"other-cau2-q005-C","text":"Kế toán tài chính và kế toán quản trị"},{"id":"other-cau2-q005-D","text":"Kế toán tổng hơp và kế toán đơn"}],"correctOptionId":"other-cau2-q005-C","explanation":"Theo phạm vi thông tin cung cấp, kế toán chia thành kế toán tài chính (cho bên ngoài và bên trong) và kế toán quản trị (cho nội bộ). Phương án a là theo phương pháp ghi, b là theo mức độ chi tiết.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u006","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q006","num":"Ch1 – Câu 6","type":"mcq","text":"Văn bản pháp lý cao nhất điều chỉnh mọi hoạt động của kế toán trong mọi thành phần kinh tế và mọi lĩnh vực hoạt động là?","options":[{"id":"other-cau2-q006-A","text":"Các nghị định thông tư liên quan"},{"id":"other-cau2-q006-B","text":"Chế độ kế toán"},{"id":"other-cau2-q006-C","text":"Chuẩn mực kế toán"},{"id":"other-cau2-q006-D","text":"Luật kế toán"}],"correctOptionId":"other-cau2-q006-D","explanation":"Luật Kế toán là văn bản pháp lý cao nhất; chuẩn mực, chế độ kế toán, nghị định, thông tư ở cấp thấp hơn.","source":"Slide Chương 1 (Tổng quan); Luật Kế toán 2015; đáp án theo file 'Đáp án câu hỏi 2.pdf'","status":"ok","answerBasis":"given"}]},{"id":"other-cau2-u007","section":"Chương 1: Tổng quan về kế toán","context":null,"questions":[{"id":"other-cau2-q007","num":"Ch1 – Câu 7","type":"mcq","text":"Mọi nghiệp vụ kinh tế

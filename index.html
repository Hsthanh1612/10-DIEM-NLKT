 nhận TSCĐ, hóa đơn GTGT, phiếu chi/UNC/giấy báo Nợ; khấu hao: bảng tính khấu hao.<\/p>\n<p><b>1) Mua TSCĐ (khấu trừ)<\/b> – ví dụ slide: giá thanh toán 770 (thuế 70), vận chuyển 22 (thuế 2):<\/p><div class=\"je\"><div>Nợ TK 211 &nbsp; 720 (700 + 20)<\/div><div>Nợ TK 133 &nbsp; 72<\/div><div class=\"cr\">Có TK 331 &nbsp; 770<\/div><div class=\"cr\">Có TK 112 &nbsp; 22<\/div><\/div><p>Mua theo <b>PP trực tiếp<\/b>: không có TK 133, toàn bộ giá thanh toán (cả thuế) vào Nợ 211. Nhận góp vốn/được cấp:<\/p><div class=\"je\"><div>Nợ TK 211, 213<\/div><div class=\"cr\">Có TK 411<\/div><\/div><p><b>2) Khấu hao<\/b> (3 phương pháp theo VBHN 19/2017: đường thẳng; theo sản lượng; số dư giảm dần có điều chỉnh). Khấu hao tính/ngừng tính từ ngày TSCĐ tăng/giảm. Ghi theo <b>nơi sử dụng<\/b>:<\/p><div class=\"je\"><div>Nợ TK 627 / 641 / 642<\/div><div class=\"cr\">Có TK 214<\/div><\/div><p><b>3) Sửa chữa thường xuyên<\/b> (thuê ngoài): tính thẳng vào chi phí bộ phận sử dụng, <b>không<\/b> vào nguyên giá. Ví dụ slide: phải trả 44 (thuế 4), bộ phận bán hàng:<\/p><div class=\"je\"><div>Nợ TK 641 &nbsp; 40<\/div><div>Nợ TK 133 &nbsp; 4<\/div><div class=\"cr\">Có TK 331 &nbsp; 44<\/div><\/div><p>Sửa chữa lớn: chỉ tham khảo (slide không đi sâu).<\/p>","formulas":"<p><b>Nguyên giá TSCĐ mua<\/b> (khấu trừ thuế) = giá mua <b>chưa thuế<\/b> + chi phí vận chuyển, lắp đặt, chạy thử… <b>chưa thuế<\/b> (+ thuế nhập khẩu, phí trước bạ nếu có).<\/p><div class=\"formula\">Nguyên giá = (Giá thanh toán − Thuế GTGT) + (Chi phí liên quan − Thuế GTGT)<\/div><p>Ví dụ: (550 − 50) + (11 − 1) = <b>510<\/b>.<\/p><div class=\"formula\">Khấu hao tháng (đường thẳng) = Nguyên giá ÷ (Số năm sử dụng × 12)<\/div><p>Ví dụ slide: 7.200 ÷ (6 × 12) = <b>100 triệu<\/b>/tháng &rarr; Nợ 641 / Có 214.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>TSCĐ hữu hình<\/th><th>NVL<\/th><th>CCDC<\/th><\/tr><\/thead><tbody>\n<tr><td>Số chu kỳ SX<\/td><td>Nhiều<\/td><td>Một<\/td><td>Nhiều<\/td><\/tr>\n<tr><td>Hình thái vật chất<\/td><td>Không đổi<\/td><td>Bị thay đổi<\/td><td>Không đổi (công cụ lao động)<\/td><\/tr>\n<tr><td>Chuyển giá trị<\/td><td>Dần (khấu hao, TK 214)<\/td><td>Toàn bộ vào sản phẩm<\/td><td>Phân bổ 1 lần hoặc nhiều lần<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Nghiệp vụ<\/th><th>Ghi vào<\/th><th>Không phải<\/th><\/tr><\/thead><tbody>\n<tr><td>Chi phí vận chuyển, lắp đặt, chạy thử khi mua TSCĐ<\/td><td>Nguyên giá (Nợ 211)<\/td><td>Chi phí kỳ<\/td><\/tr>\n<tr><td>Sửa chữa thường xuyên<\/td><td>Chi phí bộ phận sử dụng (627/641/642)<\/td><td>Nguyên giá<\/td><\/tr>\n<tr><td>Khấu hao<\/td><td>Có TK 214<\/td><td>Có TK 211 (không ghi giảm trực tiếp nguyên giá)<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 6–18; (bổ sung: bank – nguyên giá gồm chi phí chạy thử, TT45/2013 tiêu chuẩn TSCĐ)"},{"id":"ch5-t03","title":"Kế toán NVL, CCDC","core":"<p><b>NVL<\/b>: đối tượng lao động; tham gia <b>1 chu kỳ<\/b> SX, chuyển <b>toàn bộ<\/b> giá trị vào sản phẩm, hình thái vật chất <b>bị thay đổi<\/b>. Phân loại theo vai trò: <b>NVL chính<\/b> (cấu tạo thực thể sản phẩm), <b>NVL phụ<\/b> (làm thay đổi màu sắc, mùi vị…), <b>nhiên liệu<\/b> (cung cấp nhiệt lượng).<\/p>\n<p><b>CCDC<\/b>: tư liệu lao động tham gia <b>nhiều chu kỳ<\/b>; giá trị phân bổ <b>một lần hoặc nhiều lần<\/b> vào chi phí.<\/p>\n<p>TK <b>152<\/b> (NVL), <b>153<\/b> (CCDC): tài sản, SDĐK/SDCK bên <b>Nợ<\/b>; Nợ = nhập, Có = xuất. Chứng từ: hóa đơn, phiếu nhập kho, phiếu xuất kho.<\/p>\n<p><b>Nhập kho<\/b> (khấu trừ): ghi theo giá <b>chưa thuế<\/b>; (trực tiếp: ghi theo giá thanh toán):<\/p><div class=\"je\"><div>Nợ TK 152, 153 &nbsp; giá chưa thuế<\/div><div>Nợ TK 133 &nbsp; thuế GTGT<\/div><div class=\"cr\">Có TK 111, 112, 331 &nbsp; giá thanh toán<\/div><\/div><p>Ví dụ slide: mua VL chính 330 (thuế 30), vận chuyển 5,5 (thuế 0,5) &rarr; Nợ 152: <b>300 + 5 = 305<\/b>; Nợ 133: 30,5.<\/p>\n<p><b>Xuất NVL<\/b> (theo bảng phân bổ NVL):<\/p><div class=\"je\"><div>Nợ TK 621 &nbsp; NVL chính trực tiếp SX SP<\/div><div>Nợ TK 627 &nbsp; NVL/nhiên liệu dùng chung ở phân xưởng<\/div><div>Nợ TK 641, 642 &nbsp; bán hàng, quản lý<\/div><div class=\"cr\">Có TK 152<\/div><\/div><p>Ví dụ slide: xuất VL chính 320 SX SP A + nhiên liệu chạy máy phân xưởng 24 &rarr; Nợ 621: 320; Nợ 627: 24; Có 152: 344.<\/p>\n<p><b>Xuất CCDC phân bổ một lần<\/b> (giá trị thấp, dùng ngắn): tính hết vào chi phí bộ phận sử dụng:<\/p><div class=\"je\"><div>Nợ TK 627 / 641 / 642<\/div><div class=\"cr\">Có TK 153<\/div><\/div><p><b>Phân bổ nhiều lần<\/b> (giá trị lớn, dùng dài; tham khảo): xuất kho Nợ 242 / Có 153; định kỳ Nợ 627, 641, 642 / Có 242.<\/p>","formulas":"<p>Giá nhập kho (khấu trừ) = <b>giá mua chưa thuế + chi phí thu mua chưa thuế<\/b> (− chiết khấu, giảm giá nếu có). Thuế GTGT khấu trừ vào TK 133, không tính vào giá.<\/p><div class=\"formula\">Tồn cuối = Tồn đầu + Nhập trong kỳ − Xuất trong kỳ<\/div>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>TK 152 – NVL<\/th><th>TK 153 – CCDC<\/th><\/tr><\/thead><tbody>\n<tr><td>Bản chất<\/td><td>Đối tượng lao động<\/td><td>Tư liệu lao động giá trị nhỏ<\/td><\/tr>\n<tr><td>Chu kỳ SX<\/td><td>1 chu kỳ<\/td><td>Nhiều chu kỳ<\/td><\/tr>\n<tr><td>Chuyển giá trị<\/td><td>Toàn bộ, 1 lần<\/td><td>1 lần hoặc nhiều lần (qua TK 242)<\/td><\/tr>\n<tr><td>Xuất dùng trực tiếp SX SP<\/td><td>Nợ 621<\/td><td>Không vào 621 (vào 627, 641, 642)<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 19–33"},{"id":"ch5-t04","title":"Kế toán tiền lương và các khoản trích theo lương","core":"<p><b>Lương chính<\/b>: trả trong thời gian làm nhiệm vụ chính. <b>Lương phụ<\/b>: trả khi không làm nhiệm vụ chính nhưng được hưởng lương theo chế độ (nghỉ phép, lễ…).<\/p>\n<p><b>Hình thức trả lương<\/b>: theo <b>thời gian<\/b> (căn cứ thời gian làm việc, trình độ); theo <b>sản phẩm<\/b> (số lượng, chất lượng, đơn giá: trực tiếp, gián tiếp, khoán, lũy tiến, có thưởng).<\/p>\n<p><b>Chứng từ<\/b>: bảng chấm công, phiếu xác nhận sản phẩm/khối lượng hoàn thành, bảng tính lương; BHXH: phiếu nghỉ hưởng BHXH, bảng thanh toán BHXH.<\/p>\n<p>TK <b>334<\/b> – Phải trả NLĐ (Có = lương phải trả; Nợ = đã trả, các khoản khấu trừ). TK <b>338<\/b> – Phải trả, phải nộp khác (Có = trích BHXH, BHYT, KPCĐ, BHTN; Nợ = đã nộp).<\/p>\n<p><b>1) Tính lương phải trả<\/b> (theo bộ phận):<\/p><div class=\"je\"><div>Nợ TK 622 &nbsp; công nhân trực tiếp SX<\/div><div>Nợ TK 627 &nbsp; nhân viên quản lý phân xưởng<\/div><div>Nợ TK 641 &nbsp; nhân viên bán hàng<\/div><div>Nợ TK 642 &nbsp; nhân viên quản lý DN<\/div><div class=\"cr\">Có TK 334<\/div><\/div><p><b>2) Trích các khoản theo lương<\/b> – phần <b>DN chịu<\/b> (tính vào chi phí) và phần <b>NLĐ chịu<\/b> (trừ vào lương):<\/p><div class=\"je\"><div>Nợ TK 622, 627, 641, 642 &nbsp; (23,5% lương từng bộ phận)<\/div><div>Nợ TK 334 &nbsp; (10,5% tổng lương)<\/div><div class=\"cr\">Có TK 338<\/div><\/div><p><b>3) Thanh toán và nộp:<\/b><\/p><div class=\"je\"><div>Nợ TK 334<\/div><div class=\"cr\">Có TK 111, 112 &nbsp; (trả lương, thưởng, BHXH)<\/div><\/div><div class=\"je\"><div>Nợ TK 338<\/div><div class=\"cr\">Có TK 111, 112 &nbsp; (nộp BHXH, BHYT, KPCĐ, BHTN)<\/div><\/div><p>Ví dụ slide (Việt An, triệu): lương CN SX 240, QLPX 30, bán hàng 60, QLDN 120 = 450. Trích: 622: 56,4; 627: 7,05; 641: 14,1; 642: 28,2; Nợ 334: 47,25; Có 338: <b>153<\/b> (= 105,75 + 47,25).<\/p>","formulas":"<table class=\"t\"><thead><tr><th>Quỹ<\/th><th>DN chịu<\/th><th>NLĐ chịu<\/th><th>Tổng<\/th><\/tr><\/thead><tbody>\n<tr><td>BHXH<\/td><td class=\"num\">17,5%<\/td><td class=\"num\">8%<\/td><td class=\"num\">25,5%<\/td><\/tr>\n<tr><td>BHYT<\/td><td class=\"num\">3%<\/td><td class=\"num\">1,5%<\/td><td class=\"num\">4,5%<\/td><\/tr>\n<tr><td>BHTN<\/td><td class=\"num\">1%<\/td><td class=\"num\">1%<\/td><td class=\"num\">2%<\/td><\/tr>\n<tr><td>KPCĐ<\/td><td class=\"num\">2%<\/td><td class=\"num\">–<\/td><td class=\"num\">2%<\/td><\/tr>\n<tr><td><b>Cộng<\/b><\/td><td class=\"num\"><b>23,5%<\/b><\/td><td class=\"num\"><b>10,5%<\/b><\/td><td class=\"num\"><b>34%<\/b><\/td><\/tr><\/tbody><\/table><div class=\"formula\">Trích DN chịu = 23,5% × Lương làm căn cứ trích của từng bộ phận<\/div><div class=\"formula\">Khấu trừ NLĐ = 10,5% × Lương làm căn cứ trích<\/div><div class=\"formula\">Lương thực nhận = Lương phải trả − 10,5% (BHXH, BHYT, BHTN) − thuế TNCN (nếu có)<\/div><p>Ví dụ: lương CN SX 240 &rarr; 622 trích 240 × 23,5% = 56,4.<\/p>","compare":"<table class=\"t\"><thead><tr><th>Quỹ<\/th><th>Mục đích sử dụng<\/th><th>DN đóng góp?<\/th><\/tr><\/thead><tbody>\n<tr><td>BHXH<\/td><td>Trợ cấp khi mất sức lao động tạm thời/vĩnh viễn<\/td><td>Có (17,5%), NLĐ 8%<\/td><\/tr>\n<tr><td>BHYT<\/td><td>Khám chữa bệnh<\/td><td>Có (3%), NLĐ 1,5%<\/td><\/tr>\n<tr><td>BHTN<\/td><td>Chi trả khi thất nghiệp<\/td><td>Có (1%), NLĐ 1%<\/td><\/tr>\n<tr><td>KPCĐ<\/td><td>Hoạt động công đoàn các cấp<\/td><td>Chỉ DN (2%), NLĐ không đóng<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Phần DN chịu<\/th><th>Phần NLĐ chịu<\/th><\/tr><\/thead><tbody>\n<tr><td>Là <b>chi phí<\/b> (Nợ 622, 627, 641, 642)<\/td><td>Không phải chi phí DN; <b>trừ vào lương<\/b> (Nợ 334)<\/td><\/tr>\n<tr><td>Tỷ lệ 23,5%<\/td><td>Tỷ lệ 10,5%<\/td><\/tr>\n<tr><td>Có TK 338<\/td><td>Có TK 338<\/td><\/tr><\/tbody><\/table>\n<p><b>Lưu ý<\/b>: khi <b>trả lương<\/b> chỉ ghi Nợ 334 / Có 111, 112, <b>không<\/b> ghi lại chi phí (chi phí đã ghi khi tính lương).<\/p>","source":"Slide Chương 5, slide 34–47; (bổ sung: bank – tách phần DN 23,5%/NLĐ 10,5%)"},{"id":"ch5-t05","title":"Kế toán chi phí sản xuất (621, 622, 627)","core":"<p><b>Chi phí sản xuất<\/b> là toàn bộ hao phí lao động sống và lao động vật hóa mà DN bỏ ra cho hoạt động SXKD trong một thời kỳ. Gồm 3 khoản mục: <b>NVL trực tiếp, nhân công trực tiếp, sản xuất chung<\/b>.<\/p>\n<p><b>TK 621 – CP NVL trực tiếp<\/b>: Nợ = giá thực tế NVL xuất dùng SX; Có = NVL dùng không hết nhập lại kho, kết chuyển. Mở chi tiết theo <b>từng đối tượng<\/b> tập hợp CPSX. Không có số dư cuối kỳ.<\/p>\n<p><b>TK 622 – CP nhân công trực tiếp<\/b>: Nợ = lương và các khoản trích theo lương của công nhân trực tiếp SX; Có = kết chuyển. Chi tiết theo đối tượng.<\/p>\n<p><b>TK 627 – CP sản xuất chung<\/b>: tập hợp theo <b>từng phân xưởng<\/b>, chi tiết theo khoản mục (lương nhân viên PX, vật liệu, CCDC, khấu hao, dịch vụ mua ngoài như điện, nước…). Cuối kỳ <b>phân bổ<\/b> cho các sản phẩm của PX rồi kết chuyển 154.<\/p>\n<p><b>Cuối kỳ kết chuyển<\/b> sang TK 154 (để tính giá thành):<\/p><div class=\"je\"><div>Nợ TK 154<\/div><div class=\"cr\">Có TK 621<\/div><div class=\"cr\">Có TK 622<\/div><div class=\"cr\">Có TK 627 &nbsp; (sau phân bổ)<\/div><\/div><p>NVL xuất chưa dùng hết nhập lại kho: Nợ 152 / Có 621.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>TK 621<\/th><th>TK 622<\/th><th>TK 627<\/th><\/tr><\/thead><tbody>\n<tr><td>Nội dung<\/td><td>NVL trực tiếp tạo ra SP<\/td><td>Lương + trích theo lương CN trực tiếp<\/td><td>Chi phí chung ở phân xưởng<\/td><\/tr>\n<tr><td>Ví dụ<\/td><td>VL chính xuất SX SP<\/td><td>Lương CN SX<\/td><td>Lương NV quản lý PX, nhiên liệu chạy máy, khấu hao máy PX, điện PX, CCDC PX<\/td><\/tr>\n<tr><td>Đối tượng tập hợp<\/td><td>Từng SP/đối tượng<\/td><td>Từng SP/đối tượng<\/td><td>Từng phân xưởng, rồi <b>phân bổ<\/b><\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Cùng là NVL / lương<\/th><th>Vào 621/622<\/th><th>Vào 627<\/th><\/tr><\/thead><tbody>\n<tr><td>VL chính trực tiếp chế tạo SP<\/td><td>621<\/td><td><\/td><\/tr>\n<tr><td>Nhiên liệu chạy máy PX, vật liệu dùng chung PX<\/td><td><\/td><td>627<\/td><\/tr>\n<tr><td>Lương công nhân trực tiếp<\/td><td>622<\/td><td><\/td><\/tr>\n<tr><td>Lương nhân viên quản lý PX<\/td><td><\/td><td>627<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 48–58"},{"id":"ch5-t06","title":"Tập hợp chi phí và tính giá thành sản phẩm (154, 155)","core":"<p><b>Giá thành sản phẩm<\/b> là toàn bộ hao phí lao động sống và lao động vật hóa có liên quan đến <b>khối lượng sản phẩm, dịch vụ đã hoàn thành<\/b> (khác chi phí: chi phí gắn với thời kỳ, giá thành gắn với sản phẩm hoàn thành).<\/p>\n<p><b>TK 154 – CP SXKD dở dang<\/b>: SDĐK = SPDD đầu kỳ; Nợ = CPSX phát sinh (kết chuyển từ 621, 622, 627); Có = giá thành thực tế SP hoàn thành nhập kho/bán; SDCK (<b>bên Nợ<\/b>) = SPDD cuối kỳ.<\/p>\n<p><b>TK 155 – Thành phẩm<\/b>: Nợ = nhập kho theo giá thành thực tế; Có = xuất kho.<\/p>\n<p>Giá thành sản xuất chỉ gồm <b>3 khoản mục<\/b> 621, 622, 627; <b>không<\/b> gồm CP bán hàng, CP QLDN (chi phí thời kỳ, kết chuyển thẳng 911).<\/p>\n<p><b>Bút toán<\/b>:<\/p><div class=\"je\"><div>Nợ TK 155 &nbsp; giá thành SP nhập kho<\/div><div class=\"cr\">Có TK 154<\/div><\/div><div class=\"je\"><div>Nợ TK 152 &nbsp; phế liệu thu hồi (nếu có)<\/div><div class=\"cr\">Có TK 154<\/div><\/div><p>SP hoàn thành bán thẳng/gửi bán: Nợ 632 hoặc 157 / Có 154 (slide 64: 155, 157, 632).<\/p>\n<p>Khi <b>không có SPDD<\/b> cuối kỳ và không có phế liệu: Z = SPDD đầu kỳ + CPSX phát sinh.<\/p>","formulas":"<div class=\"formula\">Tổng giá thành SP hoàn thành = SPDD đầu kỳ + CPSX phát sinh trong kỳ − SPDD cuối kỳ − Phế liệu thu hồi (nếu có)<\/div><div class=\"formula\">CPSX phát sinh trong kỳ = CP NVLTT (621) + CP NCTT (622) + CP SXC (627)<\/div><div class=\"formula\">Giá thành đơn vị = Tổng giá thành ÷ Số lượng SP hoàn thành<\/div><p>Ví dụ: 100 + 900 − 150 − 10 = <b>840<\/b>; 840 ÷ 800 SP = <b>1,05<\/b>/SP.<\/p>\n<p><b>Bảng tính giá thành<\/b> lập theo từng khoản mục: CPNVLTT, CPNCTT, CPSXC – mỗi khoản mục có cột SPDD đầu kỳ, CPSX trong kỳ, SPDD cuối kỳ, tổng giá thành, giá thành đơn vị (cộng 3 dòng ra tổng).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Chi phí sản xuất<\/th><th>Giá thành sản phẩm<\/th><\/tr><\/thead><tbody>\n<tr><td>Phạm vi<\/td><td>Phát sinh trong <b>một kỳ<\/b>, cho cả SP hoàn thành và dở dang<\/td><td>Chỉ cho SP/dịch vụ <b>đã hoàn thành<\/b><\/td><\/tr>\n<tr><td>Quan hệ<\/td><td colspan=\"2\">Giá thành = CP kỳ trước chuyển sang (SPDD đầu kỳ) + CP kỳ này − CP chuyển sang kỳ sau (SPDD cuối kỳ) − phế liệu<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>TK 154<\/th><th>TK 155<\/th><\/tr><\/thead><tbody>\n<tr><td>Phản ánh<\/td><td>SP đang sản xuất dở dang<\/td><td>SP đã hoàn thành, nhập kho<\/td><\/tr>\n<tr><td>Số dư cuối kỳ (Nợ)<\/td><td>Giá trị SPDD<\/td><td>Giá trị thành phẩm tồn kho<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 59–64; (bổ sung: bank – phế liệu thu hồi Nợ 152/Có 154)"},{"id":"ch5-t07","title":"Kế toán tiêu thụ: doanh thu, giá vốn, giảm trừ doanh thu","core":"<p>Doanh thu bán hàng ghi nhận khi <b>quyền kiểm soát/rủi ro và lợi ích gắn với hàng hóa đã chuyển cho người mua<\/b> (đã giao hàng, khách chấp nhận thanh toán); nhận tiền ứng trước chưa phải doanh thu. <b>Thuế GTGT đầu ra không phải doanh thu.<\/b><\/p>\n<p><b>TK 511<\/b> – DT bán hàng và cung cấp dịch vụ: Có = doanh thu bán hàng trong kỳ; Nợ = kết chuyển các khoản giảm trừ (từ 521), kết chuyển doanh thu thuần sang 911. <b>TK 632<\/b> – Giá vốn hàng bán: Nợ = giá vốn SP bán ra; Có = kết chuyển 911. Chứng từ: hóa đơn GTGT, phiếu xuất kho.<\/p>\n<p><b>Bán hàng trong nước (khấu trừ)<\/b> – hai bút toán đi cùng nhau:<\/p><div class=\"je\"><div>Nợ TK 111, 112, 131 &nbsp; giá thanh toán<\/div><div class=\"cr\">Có TK 511 &nbsp; giá chưa thuế<\/div><div class=\"cr\">Có TK 3331 &nbsp; thuế GTGT đầu ra<\/div><\/div><div class=\"je\"><div>Nợ TK 632 &nbsp; giá vốn (theo giá thành thực tế)<\/div><div class=\"cr\">Có TK 155<\/div><\/div><p>Ví dụ: bán 100 + thuế 10% chưa thu tiền: Nợ 131: 110; Có 511: 100; Có 3331: 10.<\/p>\n<p><b>Giảm trừ doanh thu<\/b> (chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại) ghi trên <b>TK 521<\/b>, cuối kỳ kết chuyển trừ vào 511:<\/p><div class=\"je\"><div>Nợ TK 521 &nbsp; (và Nợ TK 3331 phần thuế điều chỉnh)<\/div><div class=\"cr\">Có TK 111, 112, 131<\/div><\/div><div class=\"je\"><div>Nợ TK 511<\/div><div class=\"cr\">Có TK 521 &nbsp; (cuối kỳ)<\/div><\/div><p>Hàng bán bị trả lại còn phải <b>nhập lại kho, ghi giảm giá vốn<\/b>: Nợ 155 / Có 632.<\/p>","formulas":"<div class=\"formula\">Doanh thu thuần = Doanh thu bán hàng − Chiết khấu thương mại − Giảm giá hàng bán − Hàng bán bị trả lại<\/div><div class=\"formula\">Lợi nhuận gộp = Doanh thu thuần − Giá vốn hàng bán<\/div><p>Ví dụ: 37.500 − 3.500 − 2.000 = <b>32.000<\/b> (chiết khấu thanh toán không trừ vào doanh thu thuần).<\/p>\n<p>Giá vốn = số lượng bán × giá thành đơn vị (VD: 800 SP × 14.400/1.200 = 9.600).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Khoản<\/th><th>Bản chất<\/th><th>Cách xử lý<\/th><\/tr><\/thead><tbody>\n<tr><td>Chiết khấu thương mại<\/td><td>Giảm giá cho khách mua nhiều<\/td><td>Giảm trừ DT (521)<\/td><\/tr>\n<tr><td>Giảm giá hàng bán<\/td><td>Giảm giá do hàng kém chất lượng, sai quy cách<\/td><td>Giảm trừ DT (521)<\/td><\/tr>\n<tr><td>Hàng bán bị trả lại<\/td><td>Khách trả hàng<\/td><td>Giảm trừ DT (521) + nhập kho, giảm giá vốn<\/td><\/tr>\n<tr><td>Chiết khấu thanh toán<\/td><td>Thưởng khách trả tiền sớm<\/td><td><b>Chi phí tài chính<\/b> (635), không giảm trừ DT <span class=\"tag ext\">Bổ sung<\/span><\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Doanh thu<\/th><th>Thu tiền<\/th><\/tr><\/thead><tbody>\n<tr><td>Ghi nhận khi chuyển giao hàng/dịch vụ<\/td><td>Có thể thu trước, ngay, hoặc sau (131)<\/td><\/tr>\n<tr><td>Chưa thu tiền vẫn là doanh thu<\/td><td>Nhận ứng trước chưa phải doanh thu<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 65–69; (bổ sung: TT200 TK 521; bank – hàng bán bị trả lại, chiết khấu thanh toán)"},{"id":"ch5-t08","title":"Chi phí bán hàng (641), chi phí quản lý doanh nghiệp (642)","core":"<p><b>TK 641 – CP bán hàng<\/b>: chi phí phát sinh trong quá trình tiêu thụ (lương nhân viên bán hàng, khấu hao TSCĐ bộ phận bán hàng, vận chuyển hàng bán DN chịu, sửa chữa TSCĐ bán hàng, quảng cáo…).<\/p>\n<p><b>TK 642 – CP quản lý DN<\/b>: chi phí quản lý chung (lương nhân viên quản lý, văn phòng, khấu hao TSCĐ văn phòng…).<\/p>\n<p>Cả hai là <b>chi phí thời kỳ<\/b>: Nợ = phát sinh trong kỳ (từ 334, 338, 214, 152, 153, 242, 111, 331…); Có = kết chuyển 911 cuối kỳ. Không có số dư cuối kỳ. <b>Không<\/b> tính vào giá thành sản xuất.<\/p><div class=\"je\"><div>Nợ TK 641, 642<\/div><div class=\"cr\">Có TK 152, 153, 214, 334, 338, 111, 112, 331…<\/div><\/div><div class=\"je\"><div>Nợ TK 911<\/div><div class=\"cr\">Có TK 641, 642 &nbsp; (cuối kỳ)<\/div><\/div>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>TK 641<\/th><th>TK 642<\/th><th>TK 627<\/th><\/tr><\/thead><tbody>\n<tr><td>Bộ phận<\/td><td>Bán hàng<\/td><td>Quản lý doanh nghiệp<\/td><td>Phân xưởng sản xuất<\/td><\/tr>\n<tr><td>Lương<\/td><td>NV bán hàng<\/td><td>NV quản lý DN, văn phòng<\/td><td>NV quản lý phân xưởng<\/td><\/tr>\n<tr><td>Khấu hao TSCĐ<\/td><td>Cửa hàng, bộ phận bán hàng<\/td><td>Văn phòng<\/td><td>Máy móc, nhà xưởng PX<\/td><\/tr>\n<tr><td>Cuối kỳ<\/td><td>K/c 911<\/td><td>K/c 911<\/td><td>Phân bổ, k/c 154 (vào giá thành)<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 70–71, 14, 29"},{"id":"ch5-t09","title":"Xác định kết quả tiêu thụ (TK 911)","core":"<p><b>TK 911 – Xác định kết quả kinh doanh<\/b>: <b>Nợ<\/b> = giá vốn hàng bán, CP bán hàng, CP QLDN; <b>Có<\/b> = doanh thu thuần. Cuối kỳ cân đối: Có &gt; Nợ là <b>lãi<\/b>; Nợ &gt; Có là <b>lỗ<\/b>. TK 911 không có số dư cuối kỳ.<\/p>\n<p><b>Trình tự kết chuyển cuối kỳ<\/b>:<\/p>\n<ol><li>K/c giảm trừ doanh thu: Nợ 511 / Có 521.<\/li><li>K/c doanh thu thuần.<\/li><li>K/c giá vốn, CPBH, CPQLDN.<\/li><li>K/c kết quả (lãi/lỗ) sang TK 421.<\/li><\/ol><div class=\"je\"><div>Nợ TK 511 &nbsp; doanh thu thuần<\/div><div class=\"cr\">Có TK 911<\/div><\/div><div class=\"je\"><div>Nợ TK 911<\/div><div class=\"cr\">Có TK 632 &nbsp; giá vốn<\/div><div class=\"cr\">Có TK 641<\/div><div class=\"cr\">Có TK 642<\/div><\/div><div class=\"je\"><div>Nợ TK 911 &nbsp; (lãi)<\/div><div class=\"cr\">Có TK 421<\/div><\/div><div class=\"je\"><div>Nợ TK 421 &nbsp; (lỗ)<\/div><div class=\"cr\">Có TK 911<\/div><\/div><p>Slide dừng ở bước kết chuyển vào 911; chuyển lãi/lỗ sang 421 theo TT200 <span class=\"tag ext\">Bổ sung<\/span>.<\/p>","formulas":"<div class=\"formula\">Kết quả tiêu thụ = Doanh thu thuần − Giá vốn hàng bán − Chi phí bán hàng − Chi phí QLDN<\/div><p>Ví dụ: 500 − 300 − 80 − 60 = <b>60<\/b> (lãi). Nếu 1.200 − 700 − 120 − 180 = <b>200<\/b> &rarr; Nợ 911 / Có 421: 200.<\/p>\n<p>Bỏ qua CP SX chung và giá thành trong công thức: chúng đã nằm trong giá vốn khi bán. Lợi nhuận gộp = DTT − giá vốn (chưa trừ CPBH, CPQLDN).<\/p>","compare":"<table class=\"t\"><thead><tr><th>Chỉ tiêu<\/th><th>Công thức<\/th><th>Trừ CPBH, CPQLDN?<\/th><\/tr><\/thead><tbody>\n<tr><td>Doanh thu thuần<\/td><td>DT − các khoản giảm trừ<\/td><td>Chưa<\/td><\/tr>\n<tr><td>Lợi nhuận gộp<\/td><td>DTT − Giá vốn<\/td><td>Chưa<\/td><\/tr>\n<tr><td>Kết quả tiêu thụ (lãi/lỗ)<\/td><td>Lợi nhuận gộp − CPBH − CPQLDN<\/td><td>Đã trừ<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Khoản mục<\/th><th>Thuộc giá thành sản xuất?<\/th><th>Kết chuyển<\/th><\/tr><\/thead><tbody>\n<tr><td>621, 622, 627<\/td><td>Có<\/td><td>Sang 154<\/td><\/tr>\n<tr><td>641, 642<\/td><td>Không<\/td><td>Sang 911<\/td><\/tr>\n<tr><td>Giá vốn 632<\/td><td>Là giá thành của SP đã bán<\/td><td>Sang 911<\/td><\/tr><\/tbody><\/table>","source":"Slide Chương 5, slide 72–73; (bổ sung: TT200 – k/c 911 sang 421)"},{"id":"ch5-t10","title":"Phân biệt tổng hợp: chi phí, chi tiền, TK hay nhầm","core":"<p>Nguyên tắc quyết định tài khoản chi phí: xét <b>bộ phận sử dụng<\/b> và <b>mục đích<\/b>, không xét loại chi phí.<\/p>\n<ul><li>Sử dụng trực tiếp chế tạo SP: 621/622. Phục vụ chung ở phân xưởng: <b>627<\/b>.<\/li><li>Bộ phận bán hàng: <b>641<\/b>. Bộ phận quản lý DN: <b>642<\/b>.<\/li><li>Tính lương, khấu hao, xuất kho: <b>ghi chi phí<\/b>; trả tiền/nộp tiền: chỉ làm giảm nợ phải trả, không ghi lại chi phí.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Nghiệp vụ<\/th><th>Nợ<\/th><th>Có<\/th><\/tr><\/thead><tbody>\n<tr><td>Tính lương CN SX<\/td><td>622<\/td><td>334<\/td><\/tr>\n<tr><td>Trả lương bằng chuyển khoản<\/td><td>334<\/td><td>112<\/td><\/tr>\n<tr><td>Khấu hao máy ở phân xưởng<\/td><td>627<\/td><td>214<\/td><\/tr>\n<tr><td>Xuất CCDC (1 lần) cho bộ phận bán hàng<\/td><td>641<\/td><td>153<\/td><\/tr>\n<tr><td>Nhập kho thành phẩm<\/td><td>155<\/td><td>154<\/td><\/tr>\n<tr><td>Giá vốn khi bán<\/td><td>632<\/td><td>155<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Chi phí<\/th><th>Chi tiền<\/th><\/tr><\/thead><tbody>\n<tr><td>Ghi nhận khi phát sinh (tính lương, trích khấu hao, xuất dùng), chưa chắc đã trả tiền<\/td><td>Tiền ra khỏi quỹ/ngân hàng (thanh toán nợ, mua tài sản…)<\/td><\/tr>\n<tr><td>Ví dụ: khấu hao là chi phí nhưng không chi tiền<\/td><td>Ví dụ: mua TSCĐ chi tiền nhưng chưa là chi phí<\/td><\/tr><\/tbody><\/table>\n<table class=\"t\"><thead><tr><th>Doanh thu<\/th><th>Thu nhập khác<\/th><\/tr><\/thead><tbody>\n<tr><td>Từ hoạt động bán hàng, cung cấp dịch vụ thông thường (511)<\/td><td>Từ hoạt động không thường xuyên (thanh lý TSCĐ, tiền phạt…) (711) <span class=\"tag ext\">Bổ sung<\/span><\/td><\/tr><\/tbody><\/table>","source":"Tổng hợp slide Chương 5; (bổ sung: bank – chi phí vs chi tiền; TT200 TK 711)"}],"flashcards":[{"id":"ch5-f01","topic":"ch5-t01","front":"Trình tự kế toán chủ yếu trong DNSX?","back":"Đầu vào (TSCĐ, NVL-CCDC, lương) &rarr; CPSX 621/622/627 &rarr; 154 &rarr; giá thành &rarr; 155 &rarr; bán (511, 632) &rarr; 641, 642 &rarr; 911 &rarr; 421."},{"id":"ch5-f02","topic":"ch5-t01","front":"DNTM khác DNSX ở điểm nào (theo slide)?","back":"Tương tự nhau, khác về <b>chi phí thu mua<\/b> khi mua hàng hóa."},{"id":"ch5-f03","topic":"ch5-t02","front":"Đặc điểm TSCĐ hữu hình?","back":"Tham gia nhiều chu kỳ SXKD; hình thái vật chất không đổi; giá trị chuyển dần vào chi phí."},{"id":"ch5-f04","topic":"ch5-t02","front":"Công thức nguyên giá TSCĐ mua (khấu trừ thuế)?","back":"(Giá thanh toán − thuế GTGT) + (CP vận chuyển, lắp đặt, chạy thử − thuế GTGT). VD: 550−50 + 11−1 = 510."},{"id":"ch5-f05","topic":"ch5-t02","front":"Bút toán mua TSCĐ chưa trả tiền (giá có thuế 770, thuế 70)?","back":"Nợ 211: 700; Nợ 133: 70; Có 331: 770 (cộng chi phí vận chuyển nếu có)."},{"id":"ch5-f06","topic":"ch5-t02","front":"Khấu hao TSCĐ tính vào TK nào? Có TK nào?","back":"Nợ 627 (phân xưởng) / 641 (bán hàng) / 642 (QLDN); Có <b>214<\/b>, không Có 211."},{"id":"ch5-f07","topic":"ch5-t02","front":"Khấu hao tháng theo đường thẳng?","back":"Nguyên giá ÷ (số năm × 12). VD 7.200 ÷ 72 = 100 triệu."},{"id":"ch5-f08","topic":"ch5-t02","front":"Sửa chữa thường xuyên thuê ngoài ghi thế nào?","back":"Nợ 627/641/642 (giá chưa thuế); Nợ 133; Có 331. Không tăng nguyên giá."},{"id":"ch5-f09","topic":"ch5-t02","front":"Mua TSCĐ theo PP trực tiếp khác khấu trừ?","back":"Không có TK 133; toàn bộ giá thanh toán (kể cả thuế) vào Nợ 211."},{"id":"ch5-f10","topic":"ch5-t02","front":"Nhận vốn góp bằng TSCĐ ghi thế nào?","back":"Nợ 211 / Có 411 theo giá hội đồng giao nhận đánh giá."},{"id":"ch5-f11","topic":"ch5-t03","front":"Đặc điểm NVL so với CCDC?","back":"NVL: 1 chu kỳ, chuyển toàn bộ giá trị, đổi hình thái. CCDC: nhiều chu kỳ, phân bổ 1 hoặc nhiều lần."},{"id":"ch5-f12","topic":"ch5-t03","front":"Phân loại NVL theo vai trò?","back":"NVL chính (thực thể SP); NVL phụ (đổi màu sắc, mùi vị); nhiên liệu (cung cấp nhiệt lượng)."},{"id":"ch5-f13","topic":"ch5-t03","front":"Bút toán nhập kho NVL mua (khấu trừ)?","back":"Nợ 152 (giá chưa thuế + CP thu mua); Nợ 133; Có 111/112/331."},{"id":"ch5-f14","topic":"ch5-t03","front":"Xuất VL chính trực tiếp SX SP, nhiên liệu chạy máy PX?","back":"VL chính: Nợ 621; nhiên liệu chạy máy PX: Nợ 627; Có 152."},{"id":"ch5-f15","topic":"ch5-t03","front":"CCDC phân bổ 1 lần xuất dùng ở phân xưởng?","back":"Nợ 627 / Có 153. Phân bổ nhiều lần thì Nợ 242 / Có 153, sau đó phân bổ dần từ 242."},{"id":"ch5-f16","topic":"ch5-t04","front":"Tỷ lệ trích theo lương DN chịu và NLĐ chịu?","back":"DN 23,5% (BHXH 17,5; BHYT 3; BHTN 1; KPCĐ 2). NLĐ 10,5% (8; 1,5; 1)."},{"id":"ch5-f17","topic":"ch5-t04","front":"Bút toán tính lương phải trả?","back":"Nợ 622 (CN SX), 627 (QLPX), 641 (bán hàng), 642 (QLDN); Có 334."},{"id":"ch5-f18","topic":"ch5-t04","front":"Bút toán trích phần DN chịu?","back":"Nợ 622, 627, 641, 642 (23,5% lương bộ phận) / Có 338."},{"id":"ch5-f19","topic":"ch5-t04","front":"Bút toán khấu trừ phần NLĐ chịu?","back":"Nợ 334 / Có 338 (10,5% tổng lương)."},{"id":"ch5-f20","topic":"ch5-t04","front":"Bút toán trả lương cho NLĐ?","back":"Nợ 334 / Có 111, 112. Không ghi lại chi phí."},{"id":"ch5-f21","topic":"ch5-t04","front":"Công dụng BHXH, BHYT, BHTN, KPCĐ?","back":"BHXH: trợ cấp mất sức lao động; BHYT: khám chữa bệnh; BHTN: trợ cấp thất nghiệp; KPCĐ: hoạt động công đoàn (chỉ DN đóng 2%)."},{"id":"ch5-f22","topic":"ch5-t04","front":"Lương 450, trích DN chịu và NLĐ chịu bao nhiêu?","back":"DN: 450 × 23,5% = 105,75; NLĐ: 450 × 10,5% = 47,25; Có 338: 153."},{"id":"ch5-f23","topic":"ch5-t05","front":"Chi phí sản xuất gồm những khoản mục nào?","back":"CP NVL trực tiếp (621), CP nhân công trực tiếp (622), CP sản xuất chung (627)."},{"id":"ch5-f24","topic":"ch5-t05","front":"Khác nhau 621 và 627 với NVL?","back":"621: NVL trực tiếp tạo thành SP. 627: vật liệu/nhiên liệu dùng chung ở phân xưởng."},{"id":"ch5-f25","topic":"ch5-t05","front":"TK 627 tập hợp theo đối tượng nào?","back":"Từng phân xưởng, bộ phận SX, chi tiết theo khoản mục; cuối kỳ phân bổ cho SP rồi k/c 154."},{"id":"ch5-f26","topic":"ch5-t05","front":"Cuối kỳ kết chuyển 621, 622, 627 sang đâu?","back":"Nợ 154 / Có 621, 622, 627."},{"id":"ch5-f27","topic":"ch5-t05","front":"Lương NV quản lý phân xưởng và khấu hao máy PX ghi vào TK nào?","back":"Đều Nợ 627 (CPSXC)."},{"id":"ch5-f28","topic":"ch5-t06","front":"Công thức tổng giá thành SP hoàn thành?","back":"SPDD đầu kỳ + CPSX phát sinh − SPDD cuối kỳ − phế liệu thu hồi (nếu có)."},{"id":"ch5-f29","topic":"ch5-t06","front":"Giá thành đơn vị?","back":"Tổng giá thành ÷ số lượng SP hoàn thành. VD 840 ÷ 800 = 1,05."},{"id":"ch5-f30","topic":"ch5-t06","front":"Bút toán nhập kho thành phẩm?","back":"Nợ 155 / Có 154 theo giá thành thực tế."},{"id":"ch5-f31","topic":"ch5-t06","front":"Số dư cuối kỳ TK 154 phản ánh gì?","back":"Giá trị SPDD cuối kỳ (số dư Nợ)."},{"id":"ch5-f32","topic":"ch5-t06","front":"Khoản nào không thuộc giá thành sản xuất?","back":"CP bán hàng, CP QLDN (chi phí thời kỳ)."},{"id":"ch5-f33","topic":"ch5-t06","front":"Giá thành khác chi phí SX?","back":"Giá thành gắn với SP hoàn thành; CPSX là chi phí phát sinh trong kỳ (gồm cả SP dở dang)."},{"id":"ch5-f34","topic":"ch5-t07","front":"Bút toán bán hàng chưa thu tiền (giá 100, thuế 10%)?","back":"Nợ 131: 110; Có 511: 100; Có 3331: 10."},{"id":"ch5-f35","topic":"ch5-t07","front":"Bút toán giá vốn khi xuất bán thành phẩm?","back":"Nợ 632 / Có 155 theo giá thành thực tế."},{"id":"ch5-f36","topic":"ch5-t07","front":"Doanh thu thuần tính thế nào?","back":"DT bán hàng − chiết khấu thương mại − giảm giá hàng bán − hàng bán bị trả lại."},{"id":"ch5-f37","topic":"ch5-t07","front":"Chiết khấu thanh toán có là giảm trừ doanh thu không?","back":"Không. Là chi phí tài chính, không trừ khi tính doanh thu thuần."},{"id":"ch5-f38","topic":"ch5-t07","front":"Hàng bán bị trả lại xử lý thế nào?","back":"Ghi giảm doanh thu (521) và nhập lại kho, giảm giá vốn: Nợ 155 / Có 632."},{"id":"ch5-f39","topic":"ch5-t07","front":"Lợi nhuận gộp?","back":"Doanh thu thuần − giá vốn hàng bán."},{"id":"ch5-f40","topic":"ch5-t08","front":"Phân biệt 641 và 642?","back":"641: chi phí bộ phận bán hàng; 642: chi phí quản lý doanh nghiệp. Cả hai k/c 911, không vào giá thành."},{"id":"ch5-f41","topic":"ch5-t08","front":"Khấu hao TSCĐ ở cửa hàng và văn phòng ghi vào TK nào?","back":"Cửa hàng: 641; văn phòng quản lý: 642; Có 214."},{"id":"ch5-f42","topic":"ch5-t09","front":"Kết cấu TK 911?","back":"Nợ: giá vốn, CPBH, CPQLDN. Có: doanh thu thuần. Cuối kỳ k/c lãi/lỗ sang 421."},{"id":"ch5-f43","topic":"ch5-t09","front":"Công thức kết quả tiêu thụ?","back":"DT thuần − giá vốn − CPBH − CPQLDN. VD 500−300−80−60 = 60 (lãi)."},{"id":"ch5-f44","topic":"ch5-t09","front":"Bút toán kết chuyển chi phí cuối kỳ?","back":"Nợ 911 / Có 632, 641, 642; doanh thu: Nợ 511 / Có 911; lãi: Nợ 911 / Có 421."},{"id":"ch5-f45","topic":"ch5-t10","front":"Chi phí khác chi tiền thế nào?","back":"Chi phí ghi khi phát sinh (tính lương, khấu hao, xuất kho) dù chưa trả tiền; chi tiền là tiền ra khỏi quỹ. Khấu hao là chi phí nhưng không chi tiền."},{"id":"ch5-f46","topic":"ch5-t10","front":"Khi nào dùng 627, 641, 642?","back":"Theo bộ phận sử dụng: phân xưởng 627; bán hàng 641; quản lý DN 642."},{"id":"ch5-f47","topic":"ch5-t10","front":"Doanh thu khác thu nhập khác?","back":"Doanh thu: hoạt động thông thường (bán hàng, dịch vụ, 511). Thu nhập khác: hoạt động bất thường (thanh lý, tiền phạt, 711)."}],"notes":"<ul><li>Slide 38 ghi TK 3382, 3383, 3386 cho khoản trích theo lương; theo TT200 thường dùng 3382 (KPCĐ), 3383 (BHXH), 3384 (BHYT), 3385 (BHTN). Bài này chỉ cần nhớ TK 338; nên hỏi giảng viên nếu đề yêu cầu tài khoản cấp 2.<\/li>\n<li>Slide dùng TK 521 cho giảm trừ doanh thu; theo TT133 không có TK 521 (ghi giảm thẳng TK 511). Làm theo slide.<\/li>\n<li>Slide không nêu bút toán chuyển lãi/lỗ 911 sang 421; bổ sung theo TT200 vì bank (câu 45) có hỏi.<\/li>\n<li>Phần DNTM (5.2) chỉ có 1 slide: tương tự DNSX, khác ở chi phí thu mua; không có nội dung bổ sung.<\/li>\n<li>Tỷ lệ 23,5%/10,5% theo slide 39–41 và ví dụ slide 47; có thể thay đổi theo quy định hiện hành, cần làm theo đề.<\/li><\/ul>","fx":{"items":[{"id":"ch5-f-01","name":"Nguyên giá TSCĐ mua ngoài (trong nước)","topic":"ch5-t02","formula":"<div class=\"formula\">Nguyên giá TSCĐ = Giá mua chưa thuế GTGT + Chi phí liên quan trực tiếp (vận chuyển, lắp đặt, chạy thử…) − Chiết khấu, giảm giá (nếu có)<\/div>","parts":"<ul><li><b>Giá mua chưa thuế GTGT<\/b>: giá trên hóa đơn không gồm thuế (với DN khấu trừ thuế; DN nộp thuế trực tiếp thì tính theo giá thanh toán)<\/li><li><b>Chi phí liên quan<\/b>: chi phí đưa TSCĐ vào trạng thái sẵn sàng sử dụng, không gồm thuế GTGT được khấu trừ<\/li><\/ul>","example":"<p>VD: giá thanh toán 770 gồm thuế 70 → giá mua 700; vận chuyển 20 (chưa thuế) → Nguyên giá = 700 + 20 = 720 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 8–10 (TK 211 = 720; thuế GTGT vào TK 133)"},{"id":"ch5-f-02","name":"Mức khấu hao TSCĐ theo phương pháp đường thẳng","topic":"ch5-t02","formula":"<div class=\"formula\">Mức khấu hao năm = Nguyên giá ÷ Thời gian sử dụng (năm)<\/div><div class=\"formula\">Mức khấu hao tháng = Mức khấu hao năm ÷ 12<\/div>","parts":"<ul><li><b>Nguyên giá<\/b>: giá trị ghi sổ ban đầu của TSCĐ (đồng)<\/li><li><b>Thời gian sử dụng<\/b>: thời gian trích khấu hao (năm)<\/li><li>Khấu hao tính thêm hoặc ngừng tính từ ngày TSCĐ tăng, giảm<\/li><\/ul>","example":"<p>VD: nguyên giá 7.200, thời gian khấu hao 6 năm → 7.200 ÷ 6 ÷ 12 = 100 (triệu đồng/tháng).<\/p>","source":"Slide Chương 5, slide 12, 15"},{"id":"ch5-f-03","name":"Mức khấu hao TSCĐ theo sản lượng","topic":"ch5-t02","formula":"<div class=\"formula\">Mức khấu hao trong kỳ = Nguyên giá × (Sản lượng thực tế trong kỳ ÷ Tổng sản lượng theo công suất thiết kế)<\/div>","parts":"<ul><li><b>Sản lượng thực tế trong kỳ<\/b>: số sản phẩm sản xuất trong kỳ (đơn vị sản phẩm)<\/li><li><b>Tổng sản lượng theo công suất thiết kế<\/b>: tổng sản lượng ước tính trong suốt thời gian sử dụng<\/li><\/ul>","example":"<p>VD: nguyên giá 3.000, sản lượng kỳ 60, tổng sản lượng thiết kế 600 → 3.000 × 60 ÷ 600 = 300 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 12 (chỉ nêu tên phương pháp) / bổ sung: Thông tư 45/2013/TT-BTC (VBHN 19/VBHN-BTC) <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch5-f-04","name":"Giá thực tế nguyên vật liệu mua nhập kho","topic":"ch5-t03","formula":"<div class=\"formula\">Giá nhập kho = Giá mua chưa thuế GTGT + Chi phí thu mua (vận chuyển, bốc dỡ…) − Chiết khấu, giảm giá<\/div>","parts":"<ul><li><b>Giá mua chưa thuế GTGT<\/b>: giá trên hóa đơn không gồm thuế (DN khấu trừ thuế)<\/li><li><b>Chi phí thu mua<\/b>: chi phí vận chuyển, bảo quản… liên quan đến việc mua (chưa thuế)<\/li><\/ul>","example":"<p>VD: giá thanh toán 330 gồm thuế 30 → 300; cước vận chuyển 5 (chưa thuế) → giá nhập kho = 300 + 5 = 305 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 26–28 (xem Chương 4 về tính giá)"},{"id":"ch5-f-05","name":"Các khoản trích theo lương tính vào chi phí (23,5%)","topic":"ch5-t04","formula":"<div class=\"formula\">Khoản trích tính vào chi phí = Tiền lương làm căn cứ trích × (17,5% + 3% + 1% + 2%) = Tiền lương × 23,5%<\/div>","parts":"<ul><li><b>17,5%<\/b>: BHXH; <b>3%<\/b>: BHYT; <b>1%<\/b>: BHTN; <b>2%<\/b>: KPCĐ (theo tỷ lệ trong slide)<\/li><li>Hạch toán vào chi phí theo bộ phận (TK 622, 627, 641, 642) cùng bộ phận hưởng lương<\/li><\/ul>","example":"<p>VD: tiền lương 450 → 450 × 23,5% = 105,75 (triệu đồng); riêng công nhân sản xuất: 240 × 23,5% = 56,4.<\/p>","source":"Slide Chương 5, slide 39–41, 47"},{"id":"ch5-f-06","name":"Các khoản NLĐ phải đóng, khấu trừ vào lương (10,5%)","topic":"ch5-t04","formula":"<div class=\"formula\">Khoản khấu trừ vào lương = Tiền lương làm căn cứ trích × (8% + 1,5% + 1%) = Tiền lương × 10,5%<\/div><div class=\"formula\">Lương thực nhận = Tiền lương phải trả − Khoản khấu trừ (10,5%) − Các khoản khấu trừ khác (nếu có)<\/div>","parts":"<ul><li><b>8%<\/b>: BHXH; <b>1,5%<\/b>: BHYT; <b>1%<\/b>: BHTN (phần NLĐ đóng)<\/li><li>Tổng trích nộp cả hai phần = 23,5% + 10,5% = 34% tiền lương<\/li><\/ul>","example":"<p>VD: lương 450 → khấu trừ 450 × 10,5% = 47,25; lương thực nhận = 450 − 47,25 = 402,75 (triệu đồng); tổng nộp 450 × 34% = 153.<\/p>","source":"Slide Chương 5, slide 39–41, 47 (Nợ TK 334 = 47,25; Có TK 338 = 153) / thuế TNCN và khấu trừ khác: bổ sung <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch5-f-07","name":"Chi phí sản xuất trong kỳ","topic":"ch5-t05","formula":"<div class=\"formula\">Chi phí sản xuất = CP NVL trực tiếp (TK 621) + CP nhân công trực tiếp (TK 622) + CP sản xuất chung (TK 627)<\/div>","parts":"<ul><li><b>CP NVL trực tiếp<\/b>: trị giá NVL xuất dùng sản xuất, trừ NVL dùng không hết nhập lại kho<\/li><li><b>CP nhân công trực tiếp<\/b>: lương và các khoản trích của công nhân trực tiếp sản xuất<\/li><li><b>CP sản xuất chung<\/b>: chi phí phục vụ sản xuất tại phân xưởng (lương nhân viên PX, khấu hao, vật liệu…)<\/li><\/ul>","example":"<p>VD: 320 + 240 + 60 = 620 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 49–58, 63"},{"id":"ch5-f-08","name":"Tổng giá thành sản phẩm hoàn thành","topic":"ch5-t06","formula":"<div class=\"formula\">Tổng giá thành = Giá trị SPDD đầu kỳ + CPSX phát sinh trong kỳ − Giá trị SPDD cuối kỳ − Phế liệu thu hồi (nếu có)<\/div>","parts":"<ul><li><b>SPDD đầu kỳ / cuối kỳ<\/b>: chi phí sản xuất dở dang (SDĐK / SDCK của TK 154)<\/li><li><b>CPSX phát sinh trong kỳ<\/b>: tổng NVLTT + NCTT + SXC kết chuyển vào TK 154<\/li><li><b>Phế liệu thu hồi<\/b>: giá trị phế liệu thu hồi từ quá trình sản xuất<\/li><\/ul>","example":"<p>VD: 50 + 620 − 30 − 10 = 630 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 60, 62–64"},{"id":"ch5-f-09","name":"Giá thành đơn vị sản phẩm","topic":"ch5-t06","formula":"<div class=\"formula\">Giá thành đơn vị = Tổng giá thành sản phẩm hoàn thành ÷ Số lượng sản phẩm hoàn thành<\/div>","parts":"<ul><li><b>Tổng giá thành<\/b>: kết quả công thức trên (đồng)<\/li><li><b>Số lượng sản phẩm hoàn thành<\/b>: số sản phẩm nhập kho trong kỳ (đơn vị sản phẩm)<\/li><\/ul>","example":"<p>VD: 630 ÷ 100 sản phẩm = 6,3 (triệu đồng/sản phẩm).<\/p>","source":"Slide Chương 5, slide 63 (bảng tính giá thành, cột giá thành đơn vị)"},{"id":"ch5-f-10","name":"Doanh thu thuần","topic":"ch5-t07","formula":"<div class=\"formula\">Doanh thu thuần = Doanh thu bán hàng và cung cấp dịch vụ − Các khoản giảm trừ doanh thu<\/div>","parts":"<ul><li><b>Doanh thu bán hàng<\/b>: doanh thu phát sinh bên Có TK 511 (chưa gồm thuế GTGT)<\/li><li><b>Các khoản giảm trừ<\/b>: chiết khấu thương mại, giảm giá hàng bán, hàng bán bị trả lại (TK 521)<\/li><\/ul>","example":"<p>VD: 1.000 − 50 − 30 − 20 = 900 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 66, 72–73"},{"id":"ch5-f-11","name":"Giá vốn hàng bán (sản phẩm tiêu thụ)","topic":"ch5-t07","formula":"<div class=\"formula\">Giá vốn hàng bán = Số lượng sản phẩm bán × Giá thành (giá xuất kho) đơn vị<\/div>","parts":"<ul><li><b>Số lượng sản phẩm bán<\/b>: số sản phẩm xuất kho tiêu thụ trong kỳ<\/li><li><b>Giá xuất kho đơn vị<\/b>: giá thành thực tế đơn vị theo phương pháp tính giá xuất kho (Chương 4)<\/li><\/ul>","example":"<p>VD: 80 sản phẩm × 6,3 = 504 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 68–69 (TK 632 từ TK 155)"},{"id":"ch5-f-12","name":"Lợi nhuận gộp về bán hàng","topic":"ch5-t09","formula":"<div class=\"formula\">Lợi nhuận gộp = Doanh thu thuần − Giá vốn hàng bán<\/div>","parts":"<ul><li><b>Doanh thu thuần<\/b>, <b>Giá vốn hàng bán<\/b>: như các công thức trên<\/li><\/ul>","example":"<p>VD: 900 − 504 = 396 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 72–73 / công thức gọi tên theo BCKQKD (Chương 2) <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch5-f-13","name":"Kết quả tiêu thụ (lợi nhuận thuần từ bán hàng)","topic":"ch5-t09","formula":"<div class=\"formula\">Kết quả tiêu thụ = Doanh thu thuần − Giá vốn hàng bán − Chi phí bán hàng − Chi phí quản lý doanh nghiệp<\/div>","parts":"<ul><li><b>Chi phí bán hàng<\/b> (TK 641), <b>chi phí quản lý DN<\/b> (TK 642): kết chuyển sang TK 911<\/li><li>Kết quả dương là lãi, âm là lỗ. Khi tính lợi nhuận thuần từ HĐKD đầy đủ còn cộng doanh thu tài chính, trừ chi phí tài chính<\/li><\/ul>","example":"<p>VD: 900 − 504 − 50 − 30 = 316 (triệu đồng).<\/p>","source":"Slide Chương 5, slide 70–73 (TK 911); phần doanh thu, chi phí tài chính: bổ sung <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch5-f-14","name":"Lợi nhuận kế toán trước thuế","topic":"ch5-t09","formula":"<div class=\"formula\">Lợi nhuận trước thuế = Lợi nhuận thuần từ HĐKD + Thu nhập khác − Chi phí khác<\/div>","parts":"<ul><li><b>Lợi nhuận thuần từ HĐKD<\/b>: kết quả tiêu thụ (cộng DT tài chính, trừ CP tài chính nếu có)<\/li><li><b>Thu nhập khác, chi phí khác<\/b>: thu nhập, chi phí ngoài hoạt động kinh doanh thông thường<\/li><\/ul>","example":"<p>VD: 316 + 10 − 6 = 320 (triệu đồng).<\/p>","source":"Bổ sung: kết cấu Báo cáo kết quả hoạt động kinh doanh (Chương 2, TT200/133) <span class=\"tag ext\">Bổ sung<\/span>"},{"id":"ch5-f-15","name":"Lợi nhuận sau thuế TNDN","topic":"ch5-t09","formula":"<div class=\"formula\">Thuế TNDN phải nộp = Lợi nhuận trước thuế × Thuế suất<\/div><div class=\"formula\">Lợi nhuận sau thuế = Lợi nhuận trước thuế − Chi phí thuế TNDN<\/div>","parts":"<ul><li><b>Thuế suất<\/b>: thuế suất thuế TNDN (phổ thông 20%)<\/li><li>Giả định thu nhập chịu thuế bằng lợi nhuận kế toán, không có điều chỉnh<\/li><\/ul>","example":"<p>VD: 320 × 20% = 64; lợi nhuận sau thuế = 320 − 64 = 256 (triệu đồng).<\/p>","source":"Bổ sung: Luật thuế TNDN, Báo cáo kết quả hoạt động kinh doanh <span class=\"tag ext\">Bổ sung<\/span>"}],"note":"<p>Số liệu ví dụ mang tính minh họa (đơn vị: triệu đồng). Tỷ lệ trích theo lương theo slide: DN 23,5% (BHXH 17,5%, BHYT 3%, BHTN 1%, KPCĐ 2%), NLĐ 10,5% (8%, 1,5%, 1%). Phương pháp khấu hao số dư giảm dần có điều chỉnh chỉ được nêu tên trong slide nên không đưa vào thẻ công thức. Chương 5 DNTM tương tự DNSX, khác ở chi phí thu mua hàng hóa.<\/p>"}},"ch6":{"chapter":"ch6","title":"Chương 6 – Kiểm kê tài sản; Tổ chức công tác kế toán","topics":[{"id":"ch6-t01","title":"Khái niệm, ý nghĩa và các trường hợp phải kiểm kê","core":"<p><b>Kiểm kê<\/b> là việc kiểm tra các loại tài sản hiện có để xác định <b>số thực có<\/b> trên thực tế, phát hiện <b>chênh lệch<\/b> giữa số thực tế và số liệu trên sổ kế toán (Điều 40 Luật Kế toán 2015).<\/p>\n<p>Là một trong 6 <b>phương pháp kế toán<\/b> (Chứng từ – Kiểm kê – Tính giá – Tài khoản – Ghi sổ kép – Tổng hợp và cân đối): <b>cân, đo, đong, đếm<\/b> số lượng; xác nhận, đánh giá chất lượng, giá trị tài sản và nguồn vốn tại thời điểm kiểm kê để đối chiếu với sổ.<\/p>\n<p><b>Các trường hợp phải kiểm kê:<\/b><\/p><ul>\n<li>Cuối kỳ kế toán năm, <b>trước khi lập BCTC<\/b>;<\/li>\n<li>Chia, tách, hợp nhất, sáp nhập, giải thể, bán, cho thuê doanh nghiệp;<\/li>\n<li>Chuyển đổi hình thức sở hữu doanh nghiệp;<\/li>\n<li>Đánh giá lại tài sản do sự kiện (hỏa hoạn, lũ lụt…);<\/li>\n<li>Các trường hợp khác theo yêu cầu của Nhà nước.<\/li><\/ul>\n<p><b>Ý nghĩa:<\/b> bảo vệ tài sản; ngăn tham ô, lãng phí, vi phạm kỷ luật tài chính; nâng cao trách nhiệm người quản lý tài sản; <b>cập nhật sổ sách đúng thực tế<\/b> (thông tin chính xác, đầy đủ, trung thực); giúp quản lý nắm số lượng, chất lượng tài sản (tài sản ứ đọng, cách bảo quản…) để nâng cao hiệu quả.<\/p>\n<p><i>Kiểm kê không<\/i> tăng doanh thu, không giảm thuế, không thay thế việc ghi sổ.<\/p>","formulas":null,"compare":null,"source":"Slide Chương 6, slide 6–8; Luật Kế toán 2015 Đ.40"},{"id":"ch6-t02","title":"Phân loại kiểm kê","core":"<p>Phân loại theo 3 tiêu chí độc lập: <b>phạm vi<\/b> (toàn diện / từng phần), <b>thời gian<\/b> (định kỳ / bất thường), <b>phương pháp<\/b> (hiện vật / đối chiếu – xem chủ đề sau).<\/p>\n<ul><li><b>Toàn diện:<\/b> kiểm kê mọi loại tài sản (TSCĐ, NVL, CCDC, tiền mặt, TGNH, khoản phải thu…); ít nhất <b>1 lần cuối kỳ kế toán, trước khi lập BCTC<\/b>.<\/li>\n<li><b>Từng phần:<\/b> một hoặc vài loại tài sản (tiền mặt tại quỹ, hàng tồn kho…); phục vụ yêu cầu quản lý hoặc khi <b>bàn giao tài sản<\/b>.<\/li>\n<li><b>Định kỳ:<\/b> theo thời hạn quy định trước (hàng hóa cuối tháng, toàn bộ tài sản cuối năm); kỳ hạn do Nhà nước hoặc đơn vị quy định.<\/li>\n<li><b>Bất thường:<\/b> đột xuất, ngoài thời hạn quy định: thay đổi người quản lý tài sản, cháy nổ – hỏa hoạn, thanh tra đột xuất, theo yêu cầu của kiểm toán.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Tiêu chí<\/th><th>Loại 1<\/th><th>Loại 2<\/th><\/tr><\/thead><tbody>\n<tr><td>Phạm vi<\/td><td><b>Toàn diện<\/b>: mọi tài sản; ≥ 1 lần/năm trước lập BCTC<\/td><td><b>Từng phần<\/b>: một/vài loại tài sản; theo yêu cầu quản lý, khi bàn giao<\/td><\/tr>\n<tr><td>Thời gian<\/td><td><b>Định kỳ<\/b>: đúng thời hạn quy định trước<\/td><td><b>Bất thường<\/b>: đột xuất (đổi người quản lý, sự cố, thanh tra, kiểm toán yêu cầu)<\/td><\/tr>\n<\/tbody><\/table><p>Mẹo: cái gì “xảy ra bất ngờ / sự cố / đổi thủ kho / thanh tra” → <b>bất thường<\/b>; cái gì “theo lịch” → <b>định kỳ<\/b>.<\/p>","source":"Slide Chương 6, slide 10–11"},{"id":"ch6-t03","title":"Phương pháp kiểm kê: hiện vật và đối chiếu","core":"<ul><li><b>Kiểm kê hiện vật:<\/b> tài sản <b>hiện diện tại đơn vị<\/b> (hàng hóa, TSCĐ, tiền mặt, CCDC…). Cân, đo, đong, đếm, <b>có sự chứng kiến của người quản lý tài sản<\/b>; số lượng quá nhiều có thể <b>chọn mẫu<\/b>; chú ý <b>chất lượng<\/b> tài sản.<\/li>\n<li><b>Kiểm kê đối chiếu:<\/b> tài sản của đơn vị nhưng <b>không hiện diện tại đơn vị<\/b> (TGNH, công nợ, vật liệu gia công ngoài, hàng gửi bán…). So sánh, đối chiếu <b>số dư từng tài khoản<\/b> giữa sổ của DN với sổ/xác nhận của ngân hàng hay đơn vị liên quan.<\/li><\/ul>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th><\/th><th>Hiện vật<\/th><th>Đối chiếu<\/th><\/tr><\/thead><tbody>\n<tr><td>Đối tượng<\/td><td>Tài sản có tại đơn vị<\/td><td>Tài sản không có tại đơn vị<\/td><\/tr>\n<tr><td>Cách làm<\/td><td>Cân, đo, đong, đếm<\/td><td>So sánh số dư sổ với đối tác<\/td><\/tr>\n<tr><td>Ví dụ<\/td><td>Hàng tồn kho, TSCĐ, <b>tiền mặt<\/b>, CCDC<\/td><td><b>TGNH<\/b>, phải thu/phải trả, vật liệu gia công ngoài, hàng gửi bán<\/td><\/tr>\n<tr><td>Người tham gia<\/td><td>Người quản lý tài sản chứng kiến<\/td><td>Ngân hàng / đơn vị liên quan xác nhận<\/td><\/tr>\n<\/tbody><\/table><p>Dễ nhầm: <b>hàng mua đang đi đường<\/b>, công nợ, TGNH <i>không<\/i> kiểm kê hiện vật. <span class=\"tag ext\">Bổ sung<\/span> Tiền mặt do thủ quỹ kiểm quỹ, đối chiếu sổ quỹ <b>hằng ngày<\/b>.<\/p>","source":"Slide Chương 6, slide 12, 14; (bổ sung: kiểm quỹ hằng ngày – chế độ kế toán)"},{"id":"ch6-t04","title":"Tổ chức công tác kiểm kê (3 giai đoạn)","core":"<ol><li><b>Trước kiểm kê:<\/b> kế toán <b>khóa sổ<\/b>, xác định giá trị tài sản trên sổ sách; nhân viên quản lý tài sản <b>sắp xếp, phân loại<\/b> tài sản.<\/li>\n<li><b>Thực hiện kiểm kê:<\/b> kiểm kê theo trình tự; thu thập, tổng hợp số liệu kiểm kê, <b>đối chiếu với sổ kế toán<\/b> (hiện vật hoặc đối chiếu).<\/li>\n<li><b>Xử lý kết quả:<\/b> điều chỉnh số liệu khi có chênh lệch; đề ra giải pháp xử lý phù hợp khi tài sản <b>thiếu, thừa<\/b>.<\/li><\/ol>\n<p><b>Biên bản kiểm kê<\/b> <span class=\"tag ext\">Bổ sung<\/span>: lập sau kiểm kê, ghi nhận kết quả kiểm kê và đề xuất biện pháp xử lý khi thừa/thiếu; lập <b>cả khi thừa, thiếu hoặc khớp<\/b> (không chỉ khi phát hiện thiếu hay thừa).<\/p>","formulas":null,"compare":null,"source":"Slide Chương 6, slide 14–15; bank lms-ch6 câu 6–7"},{"id":"ch6-t05","title":"Xử lý chênh lệch kiểm kê và bút toán","core":"<p>Nguyên tắc: <b>thừa<\/b> (thực tế &gt; sổ) hoặc <b>thiếu<\/b> (thực tế &lt; sổ) → trước hết <b>điều chỉnh sổ theo số thực tế<\/b>, ghi vào tài khoản chờ xử lý; sau khi có <b>quyết định xử lý<\/b> mới kết chuyển. <span class=\"tag ext\">Bổ sung<\/span> (slide chỉ nêu nguyên tắc; bút toán theo TT200).<\/p>","formulas":"<p><b>Tài sản thiếu<\/b> (ví dụ vật liệu thiếu 2 triệu chưa rõ nguyên nhân):<\/p>\n<div class=\"je\"><div>Nợ TK 1381 – Tài sản thiếu chờ xử lý &nbsp; 2.000.000<\/div><div class=\"cr\">Có TK 152 &nbsp; 2.000.000<\/div><\/div>\n<p>Quỹ tiền mặt thiếu: <b>Nợ TK 1381 / Có TK 111<\/b>. Khi có quyết định xử lý, ghi <b>Có TK 1381<\/b> đối ứng:<\/p>\n<ul><li>Cá nhân bồi thường (trừ lương/phải thu): Nợ TK 111 / 334 / 1388;<\/li><li>Hao hụt trong định mức: Nợ TK 632.<\/li><\/ul>\n<p><b>Tài sản thừa<\/b> chưa rõ nguyên nhân:<\/p>\n<div class=\"je\"><div>Nợ TK 111 (hoặc 152…) &nbsp; xxx<\/div><div class=\"cr\">Có TK 3381 – Tài sản thừa chờ giải quyết &nbsp; xxx<\/div><\/div>\n<p>Khi xử lý: Nợ TK 3381 đối ứng Có TK phải trả đơn vị khác (xác định được chủ) hoặc ghi nhận thu nhập khác (Có TK 711).<\/p>","compare":"<table class=\"t\"><thead><tr><th><\/th><th>Thiếu<\/th><th>Thừa<\/th><\/tr><\/thead><tbody>\n<tr><td>So sánh<\/td><td>Thực tế &lt; sổ<\/td><td>Thực tế &gt; sổ<\/td><\/tr>\n<tr><td>TK chờ xử lý<\/td><td><b>TK 1381<\/b> (bên Nợ – tài sản)<\/td><td><b>TK 3381<\/b> (bên Có – nguồn/nợ)<\/td><\/tr>\n<tr><td>Quỹ tiền mặt<\/td><td>Nợ 1381 / Có 111<\/td><td>Nợ 111 / Có 3381<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 6, slide 15; bổ sung TT200 (TK 138, 338); bank other-deon1 q061, other-de1 q013"},{"id":"ch6-t06","title":"Ý nghĩa, vai trò, căn cứ và nhiệm vụ tổ chức công tác kế toán","core":"<p><b>Tổ chức công tác kế toán<\/b> là tổ chức vận dụng các phương pháp kế toán, chế độ thể lệ kế toán, tổ chức <b>bộ máy kế toán<\/b> và <b>ứng dụng phương tiện kỹ thuật tính toán<\/b> (3 yếu tố cùng cấu thành).<\/p>\n<ul><li><b>Ý nghĩa:<\/b> quản lý hoạt động kế toán hiệu quả, linh hoạt; <b>nâng cao chất lượng thông tin kế toán<\/b>.<\/li>\n<li><b>Vai trò:<\/b> đáp ứng yêu cầu quản lý của DN; kiểm soát nguồn lực kinh tế hiệu quả; chủ động điều hành hoạt động kế toán.<\/li>\n<li><b>Căn cứ tổ chức:<\/b> (1) chế độ thể lệ quản lý kinh tế tài chính, Luật Kế toán, chuẩn mực và chế độ kế toán; (2) điều kiện cụ thể của đơn vị: đặc điểm – tính chất – mục đích hoạt động; <b>quy mô, địa bàn<\/b>; trình độ cán bộ kế toán; trình độ trang bị phương tiện kỹ thuật tính toán.<\/li>\n<li><b>Nhiệm vụ:<\/b> tổ chức khoa học, hợp lý công tác kế toán và bộ máy kế toán: thực hiện phương pháp/nguyên tắc/chế độ kế toán; hướng dẫn mọi người chấp hành chính sách, chế độ tài chính; đào tạo, bồi dưỡng cán bộ kế toán.<\/li><\/ul>","formulas":null,"compare":null,"source":"Slide Chương 6, slide 17–19; bank other-mau1, other-cau2"},{"id":"ch6-t07","title":"Nội dung tổ chức công tác kế toán","core":"<p><b>8 nội dung<\/b> (không bao gồm “tổ chức hệ thống quản trị điều hành”):<\/p><ol>\n<li><b>Chứng từ:<\/b> xây dựng danh mục; quy định mẫu phù hợp nghiệp vụ và yêu cầu quản lý; tổ chức luân chuyển, xử lý, lưu trữ, bảo quản; quy định người chịu trách nhiệm ghi chứng từ.<\/li>\n<li><b>Tài khoản:<\/b> vận dụng TK cấp 1 phù hợp; xây dựng TK chi tiết (cấp 2, 3…) theo yêu cầu quản lý nội bộ.<\/li>\n<li><b>Phương pháp tính giá:<\/b> chọn phương pháp tính giá hàng tồn kho, phân bổ chi phí, đánh giá sản phẩm dở dang, tính giá thành.<\/li>\n<li><b>Sổ kế toán:<\/b> chọn hình thức kế toán (Nhật ký – Sổ cái, Nhật ký chung, Chứng từ ghi sổ, Nhật ký chứng từ, Kế toán trên máy vi tính – <b>5 hình thức<\/b>); bảo đảm quan hệ ghi theo thời gian – theo hệ thống; sổ tổng hợp – sổ chi tiết; đối chiếu số liệu giữa các sổ.<\/li>\n<li><b>Báo cáo:<\/b> lập BCTC (báo cáo tình hình tài chính, kết quả HĐKD, lưu chuyển tiền tệ, thuyết minh BCTC) và báo cáo quản trị (dự toán tiêu thụ, hoạt động, BCTC).<\/li>\n<li><b>Hình thức tổ chức bộ máy kế toán<\/b> (tập trung / phân tán / vừa tập trung vừa phân tán).<\/li>\n<li><b>Kiểm tra kế toán:<\/b> kiểm soát nội bộ (tính hợp pháp, hợp lý, trung thực – chính xác của nghiệp vụ; yếu tố cơ bản của chứng từ), kiểm tra kết quả hoạt động, kiểm tra tài sản.<\/li>\n<li><b>Phân tích hoạt động kinh doanh:<\/b> chỉ tiêu hiệu quả sử dụng vốn, sinh lời, thanh toán, cơ cấu tài chính, vòng quay hàng tồn kho/tổng tài sản, kỳ thu tiền bình quân…<\/li><\/ol>","formulas":null,"compare":null,"source":"Slide Chương 6, slide 20–25, 27–28"},{"id":"ch6-t08","title":"Hình thức tổ chức bộ máy kế toán","core":"<p>Đơn vị chọn <b>một trong ba<\/b> hình thức, tùy quy mô, địa bàn, trình độ kế toán, phương tiện kỹ thuật. Dấu hiệu nhận biết: xem <b>đơn vị phụ thuộc có bộ máy kế toán riêng không<\/b>.<\/p>","formulas":null,"compare":"<table class=\"t\"><thead><tr><th>Hình thức<\/th><th>Cấu trúc bộ máy<\/th><th>Dấu hiệu nhận biết<\/th><\/tr><\/thead><tbody>\n<tr><td><b>Tập trung<\/b><\/td><td>1 phòng kế toán trung tâm + <b>nhân viên kinh tế<\/b> ở đơn vị phụ thuộc<\/td><td>Mọi công việc kế toán làm tại trung tâm; đơn vị phụ thuộc chỉ thu thập chứng từ<\/td><\/tr>\n<tr><td><b>Phân tán<\/b><\/td><td>Phòng kế toán trung tâm + <b>phòng/ban/tổ kế toán<\/b> ở <b>các<\/b> đơn vị phụ thuộc<\/td><td>Mọi đơn vị phụ thuộc đều có kế toán riêng (VD tổng công ty và các công ty con đều có phòng kế toán)<\/td><\/tr>\n<tr><td><b>Vừa tập trung vừa phân tán<\/b><\/td><td>Kế toán ở trung tâm và <b>một số<\/b> đơn vị phụ thuộc; các đơn vị còn lại chỉ có nhân viên kinh tế thu thập chứng từ<\/td><td>Có đơn vị phụ thuộc có bộ máy kế toán, có đơn vị không<\/td><\/tr>\n<\/tbody><\/table>","source":"Slide Chương 6, slide 26; bank other-cau2, lms-ch6 câu 10–11"},{"id":"ch6-t09","title":"Hình thức ghi sổ kế toán (nhắc nhanh)","core":"<p>Doanh nghiệp chọn một trong <b>5 hình thức kế toán<\/b>: Nhật ký – Sổ cái; <b>Nhật ký chung<\/b>; Chứng từ ghi sổ; Nhật ký chứng từ; Kế toán trên máy vi tính.<\/p>\n<p><b>Nhật ký chung<\/b> (hay hỏi): mọi nghiệp vụ ghi vào Nhật ký chung theo <b>thời gian<\/b> và nội dung kinh tế (định khoản), sau đó ghi <b>Sổ Cái<\/b> từ Nhật ký. Sổ tổng hợp: Nhật ký chung (và nhật ký chuyên dùng nếu có) + Sổ Cái. Trình tự: chứng từ gốc → Nhật ký chung → Sổ Cái → lập BCTC.<\/p>\n<p>Phân loại sổ theo cách ghi: <b>theo thời gian<\/b> (Nhật ký), <b>theo hệ thống<\/b> (Sổ Cái, sổ chi tiết), <b>kết hợp<\/b> (Nhật ký – Sổ Cái).<\/p>","formulas":null,"compare":null,"source":"Slide Chương 6, slide 24; bank other-deon1, other-deon2, other-cau2 (chi tiết hình thức sổ thuộc Chương 2)"}],"flashcards":[{"id":"ch6-f01","topic":"ch6-t01","front":"Kiểm kê là gì?","back":"Kiểm tra tài sản hiện có để xác định <b>số thực có<\/b>, phát hiện chênh lệch so với sổ kế toán (cân, đo, đong, đếm)."},{"id":"ch6-f02","topic":"ch6-t01","front":"Kiểm kê thuộc nhóm nào trong 6 phương pháp kế toán?","back":"Một phương pháp kế toán, cùng Chứng từ, Tính giá, Tài khoản, Ghi sổ kép, Tổng hợp và cân đối."},{"id":"ch6-f03","topic":"ch6-t01","front":"Kể các trường hợp phải kiểm kê.","back":"Cuối kỳ KT năm (trước lập BCTC); chia, tách, hợp nhất, sáp nhập, giải thể, bán, cho thuê DN; chuyển đổi hình thức sở hữu; đánh giá lại TS do hỏa hoạn, lũ lụt; theo yêu cầu Nhà nước."},{"id":"ch6-f04","topic":"ch6-t01","front":"Tác dụng của kiểm kê?","back":"Bảo vệ tài sản, chống tham ô lãng phí, nâng trách nhiệm người quản lý, <b>sổ sách khớp thực tế<\/b>. Không tăng doanh thu, không giảm thuế."},{"id":"ch6-f05","topic":"ch6-t01","front":"Thay đổi mẫu chứng từ, phần mềm, tăng lương có phải kiểm kê không?","back":"Không. Đây không thuộc các trường hợp phải kiểm kê."},{"id":"ch6-f06","topic":"ch6-t02","front":"Kiểm kê toàn diện vs từng phần?","back":"Toàn diện: mọi tài sản, ≥ 1 lần cuối kỳ trước lập BCTC. Từng phần: một/vài loại tài sản, theo yêu cầu quản lý hoặc khi bàn giao."},{"id":"ch6-f07","topic":"ch6-t02","front":"Kiểm kê định kỳ là gì?","back":"Theo thời hạn <b>quy định trước<\/b> (hàng hóa cuối tháng, toàn bộ TS cuối năm)."},{"id":"ch6-f08","topic":"ch6-t02","front":"Khi nào kiểm kê bất thường?","back":"Đổi người quản lý tài sản, cháy nổ – hỏa hoạn, thanh tra đột xuất, theo yêu cầu của kiểm toán."},{"id":"ch6-f09","topic":"ch6-t02","front":"Ba tiêu chí phân loại kiểm kê?","back":"Phạm vi (toàn diện/từng phần); thời gian (định kỳ/bất thường); phương pháp (hiện vật/đối chiếu)."},{"id":"ch6-f10","topic":"ch6-t03","front":"Kiểm kê hiện vật áp dụng cho?","back":"Tài sản có tại đơn vị: hàng tồn kho, TSCĐ, tiền mặt, CCDC. Cân, đo, đong, đếm, có người quản lý chứng kiến; nhiều thì chọn mẫu."},{"id":"ch6-f11","topic":"ch6-t03","front":"Kiểm kê đối chiếu áp dụng cho?","back":"Tài sản không có tại đơn vị: TGNH, công nợ, vật liệu gia công ngoài, hàng gửi bán. So số dư sổ với ngân hàng/đối tác."},{"id":"ch6-f12","topic":"ch6-t03","front":"Tiền mặt và TGNH kiểm kê bằng phương pháp nào?","back":"Tiền mặt: <b>hiện vật<\/b> (đếm). TGNH: <b>đối chiếu<\/b> với sổ phụ/xác nhận ngân hàng."},{"id":"ch6-f13","topic":"ch6-t03","front":"Phải thu khách hàng kiểm kê theo cách nào?","back":"<b>Đối chiếu<\/b> xác nhận công nợ (không có hình thái vật chất)."},{"id":"ch6-f14","topic":"ch6-t03","front":"Hàng mua đi đường có kiểm kê hiện vật không?","back":"Không: chưa về đơn vị, không hiện diện để cân, đo, đếm."},{"id":"ch6-f15","topic":"ch6-t04","front":"Ba giai đoạn tổ chức kiểm kê?","back":"Trước kiểm kê → thực hiện kiểm kê (thu thập, đối chiếu số liệu) → xử lý kết quả."},{"id":"ch6-f16","topic":"ch6-t04","front":"Việc cần làm trước khi kiểm kê?","back":"Kế toán <b>khóa sổ<\/b>, xác định giá trị TS trên sổ; nhân viên quản lý TS sắp xếp, phân loại TS."},{"id":"ch6-f17","topic":"ch6-t04","front":"Biên bản kiểm kê lập khi nào, để làm gì?","back":"Ghi nhận kết quả kiểm kê và đề xuất biện pháp xử lý; lập cả khi thừa hoặc thiếu, không chỉ một trong hai."},{"id":"ch6-f18","topic":"ch6-t05","front":"Nguyên tắc xử lý chênh lệch kiểm kê?","back":"Điều chỉnh sổ theo thực tế, ghi tài khoản chờ xử lý; có quyết định xử lý mới kết chuyển."},{"id":"ch6-f19","topic":"ch6-t05","front":"Bút toán vật liệu thiếu chưa rõ nguyên nhân?","back":"Nợ TK 1381 / Có TK 152."},{"id":"ch6-f20","topic":"ch6-t05","front":"Bút toán kiểm kê quỹ thiếu và thừa?","back":"Thiếu: Nợ 1381 / Có 111. Thừa: Nợ 111 / Có 3381."},{"id":"ch6-f21","topic":"ch6-t05","front":"TK 1381 và TK 3381 khác nhau thế nào?","back":"1381: tài sản thiếu chờ xử lý (tài sản, bên Nợ). 3381: tài sản thừa chờ giải quyết (nợ phải trả, bên Có)."},{"id":"ch6-f22","topic":"ch6-t06","front":"Tổ chức công tác kế toán gồm các yếu tố cấu thành nào?","back":"Vận dụng phương pháp và chế độ thể lệ kế toán; tổ chức bộ máy kế toán; ứng dụng phương tiện kỹ thuật tính toán."},{"id":"ch6-f23","topic":"ch6-t06","front":"Vai trò của tổ chức công tác kế toán?","back":"Đáp ứng yêu cầu quản lý; kiểm soát nguồn lực kinh tế hiệu quả; chủ động điều hành hoạt động kế toán."},{"id":"ch6-f24","topic":"ch6-t06","front":"Căn cứ để tổ chức công tác kế toán?","back":"Luật, chuẩn mực, chế độ kế toán; đặc điểm, quy mô, địa bàn đơn vị; trình độ cán bộ kế toán; trình độ phương tiện kỹ thuật."},{"id":"ch6-f25","topic":"ch6-t06","front":"Nhiệm vụ tổ chức công tác kế toán?","back":"Tổ chức khoa học, hợp lý công tác và bộ máy kế toán; hướng dẫn chấp hành chế độ; đào tạo bồi dưỡng cán bộ kế toán."},{"id":"ch6-f26","topic":"ch6-t07","front":"Liệt kê các nội dung tổ chức công tác kế toán.","back":"Chứng từ; tài khoản; tính giá; sổ; báo cáo; hình thức tổ chức bộ máy; kiểm tra kế toán; phân tích hoạt động kinh doanh."},{"id":"ch6-f27","topic":"ch6-t07","front":"Nội dung tổ chức hệ thống chứng từ?","back":"Danh mục, mẫu chứng từ; luân chuyển, xử lý, lưu trữ, bảo quản; người chịu trách nhiệm ghi. “Không cần luân chuyển chứng từ” là sai."},{"id":"ch6-f28","topic":"ch6-t07","front":"Tổ chức hệ thống tài khoản gồm gì?","back":"Vận dụng TK cấp 1 phù hợp và xây dựng TK chi tiết (cấp 2, 3…) theo yêu cầu quản lý nội bộ."},{"id":"ch6-f29","topic":"ch6-t07","front":"Tổ chức hệ thống sổ cần bảo đảm các quan hệ nào?","back":"Ghi theo thời gian – theo hệ thống; sổ tổng hợp – sổ chi tiết; đối chiếu giữa các sổ."},{"id":"ch6-f30","topic":"ch6-t07","front":"Báo cáo kế toán cần tổ chức lập gồm?","back":"BCTC (tình hình tài chính, kết quả HĐKD, lưu chuyển tiền tệ, thuyết minh) và báo cáo quản trị (các dự toán)."},{"id":"ch6-f31","topic":"ch6-t07","front":"Tổ chức kiểm tra kế toán gồm?","back":"Kiểm soát nội bộ (hợp pháp, hợp lý, trung thực – chính xác, yếu tố chứng từ), kiểm tra kết quả hoạt động, kiểm tra tài sản."},{"id":"ch6-f32","topic":"ch6-t08","front":"Bộ máy kế toán tập trung?","back":"1 phòng kế toán trung tâm + nhân viên kinh tế ở đơn vị phụ thuộc (chỉ thu thập chứng từ)."},{"id":"ch6-f33","topic":"ch6-t08","front":"Bộ máy kế toán phân tán?","back":"Kế toán ở cả đơn vị chính và các đơn vị phụ thuộc (có phòng/ban/tổ kế toán riêng)."},{"id":"ch6-f34","topic":"ch6-t08","front":"Bộ máy vừa tập trung vừa phân tán?","back":"Kế toán ở trung tâm và một số đơn vị phụ thuộc; các đơn vị khác chỉ có nhân viên kinh tế thu thập chứng từ."},{"id":"ch6-f35","topic":"ch6-t08","front":"Tổng công ty và 3 công ty con đều có phòng kế toán riêng là hình thức nào?","back":"Phân tán."},{"id":"ch6-f36","topic":"ch6-t09","front":"Năm hình thức kế toán?","back":"Nhật ký – Sổ cái; Nhật ký chung; Chứng từ ghi sổ; Nhật ký chứng từ; Kế toán trên máy vi tính."},{"id":"ch6-f37","topic":"ch6-t09","front":"Trình tự ghi sổ hình thức Nhật ký chung?","back":"Chứng từ gốc → Nhật ký chung → Sổ Cái → BCTC."}],"notes":"<ul><li>Slide không nêu bút toán xử lý chênh lệch; phần bút toán (TK 1381, 3381) lấy từ TT200 và bank đề đã làm. Với tài sản thiếu ngoài định mức không rõ nguyên nhân, ngân hàng đề (other-deon1 q061) ghi Nợ TK 811, còn TT200 tính vào giá vốn hàng bán (Nợ TK 632); chưa ghi vào bài để tránh sai, nên hỏi giảng viên.<\/li>\n<li>Slide chỉ nêu khái niệm kiểm kê; “biên bản kiểm kê” và “kiểm quỹ hằng ngày” là kiến thức bổ sung.<\/li>\n<li>Chi tiết các hình thức ghi sổ thuộc Chương 2; ở đây chỉ nhắc.<\/li><\/ul>","fx":{"items":[{"id":"ch6-f-01","name":"Chênh lệch kiểm kê","topic":"ch6-t05","formula":"<div class=\"formula\">Chênh lệch kiểm kê = Số liệu kiểm kê (thực tế) − Số liệu trên sổ kế toán<\/div>","parts":"<ul><li><b>Số liệu kiểm kê<\/b>: số thực có sau khi cân, đo, đong, đếm hoặc đối chiếu<\/li><li><b>Số liệu sổ kế toán<\/b>: số liệu ghi trên sổ tại thời điểm kiểm kê<\/li><li>Kết quả dương: tài sản thừa; âm: tài sản thiếu<\/li><\/ul>","example":"<p>VD: hàng tồn kho kiểm kê 480, sổ sách 500 → 480 − 500 = −20 (thiếu 20 đơn vị).<\/p>","source":"Slide Chương 6, slide 6 (khái niệm kiểm kê); dạng công thức: bổ sung <span class=\"tag ext\">Bổ sung<\/span>"}],"note":"<p>Chương 6 chủ yếu là lý thuyết (xem phần Đọc lý thuyết). Chỉ có một quan hệ tính số duy nhất, nêu ở khái niệm kiểm kê.<\/p>"}}},"accounts":{"source":"Phụ lục II – Hệ t

   Cấu trúc:  1) Dữ liệu  2) Lưu trữ  3) Phiên luyện tập (thứ tự/trộn)
              4) Hiển thị  5) Sự kiện / phím tắt
   Đáp án trắc nghiệm luôn được xác định bằng ID phương án (không bằng A/B/C/D).
   ===================================================================== */

/* ---------- 1) DỮ LIỆU ---------- */
const BANK = JSON.parse(document.getElementById('bank-data').textContent);
// BANK = { lms:[{key,title,sub,units:[...]}], other:[...] }
const AREAS = {
  lms:   {title:'Bài tập LMS',   sub:'Bài tập theo từng chương (Chương 1 – 6)', sets:BANK.lms},
  other: {title:'Bài tập khác',  sub:'Các đề và bộ câu hỏi ôn tập',            sets:BANK.other}
};
const THEORY = BANK.theory || {};   // {ch1:{title,topics:[],flashcards:[],notes}, ...}
const QINDEX = {};            // qid -> {q, unit, set}
for (const area of Object.values(AREAS))
  for (const set of area.sets)
    for (const u of set.units) for (const q of u.questions) QINDEX[q.id] = {q, unit:u, set};

/* ---------- 2) LƯU TRỮ ---------- */
const LS_KEY = 'nlkt-practice-v1';
let memStore = null;
function defaults(){ return {ans:{}, chk:{}, rev:{}, cls:{}, flag:{}, wrong:{}, sess:{}, th:{collapsed:{}, cards:{}}}; }
function loadState(){
  try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const o=JSON.parse(raw); return Object.assign(defaults(), o); } }catch(e){}
  return memStore || defaults();
}
let S = loadState();
function save(){ memStore = S; try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- 3) PHIÊN LUYỆN TẬP ---------- */
let view = {name:'home'};     // home | area{area} | practice{area,setKey} | theory{ch,mode:'read'|'cards'}
const sessKey = v => v.area+':'+v.setKey;
function getSess(key){
  if(!S.sess[key]) S.sess[key] = {order:null, opt:{}, cur:null, filter:'all', mode:'seq'};
  return S.sess[key];
}
function setsInScope(area, setKey){
  const sets = AREAS[area].sets;
  return setKey==='all' ? sets : sets.filter(s=>s.key===setKey);
}
function baseUnits(area, setKey){
  const out=[]; for(const s of setsInScope(area,setKey)) out.push(...s.units); return out;
}
// Danh sách unit (nhóm câu) theo thứ tự đã lưu của phiên. Câu dùng chung dữ liệu luôn nằm trong 1 unit.
function orderedUnits(area, setKey){
  const base = baseUnits(area,setKey), ss = getSess(area+':'+setKey);
  if(!ss.order) return base;
  const byId = new Map(base.map(u=>[u.id,u])), seen=new Set(), out=[];
  for(const id of ss.order){ const u=byId.get(id); if(u&&!seen.has(id)){out.push(u);seen.add(id);} }
  for(const u of base) if(!seen.has(u.id)) out.push(u);
  return out;
}
function shuffleArr(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function shuffleQuestions(v){
  const ss=getSess(sessKey(v)); const ids=baseUnits(v.area,v.setKey).map(u=>u.id);
  ss.order = shuffleArr(ids); ss.mode='rand'; save();
}
/* Trộn đáp án: chỉ trắc nghiệm. Phương án "ghim" (Tất cả đều đúng…) giữ nguyên vị trí gốc;
   câu có phương án tham chiếu chữ cái (A và B đúng…) không trộn để không đổi nghĩa. */
const RE_LETTERREF = /(^|[\s,(])(?:[A-D](?:\s*(?:,|và|hoặc|&)\s*[A-D])+|cả\s+[A-D]\s+và\s+[A-D]|cả\s+hai\s+(?:đáp\s+án|phương\s+án)|[A-D])\s+(?:đều\s+|cùng\s+)?(?:đúng|sai)\b/i;
const RE_PINNED = /^\s*(tất cả|cả hai|cả ba|không có (đáp án|phương án)|các (đáp án|phương án) (trên|đều)|none)/i;
function isPinned(o){ return !!o.pinned || RE_PINNED.test(o.text.replace(/<[^>]*>/g,'')); }
function hasLetterRef(q){ return q.options.some(o=>RE_LETTERREF.test(o.text.replace(/<[^>]*>/g,' '))); }
function shuffleOptionsOf(q){
  if(hasLetterRef(q)) return q.options.map(o=>o.id);
  const n=q.options.length, pos=[], free=[];
  q.options.forEach((o,i)=>{ if(isPinned(o)) pos[i]=o.id; else free.push(o.id); });
  const sh=shuffleArr(free); let k=0; const out=[];
  for(let i=0;i<n;i++) out.push(pos[i]!==undefined?pos[i]:sh[k++]);
  return out;
}
function shuffleOptions(v){
  const ss=getSess(sessKey(v));
  for(const u of baseUnits(v.area,v.setKey)) for(const q of u.questions) if(q.type==='mcq') ss.opt[q.id]=shuffleOptionsOf(q);
  save();
}
function optionList(v,q){   // phương án theo thứ tự hiển thị
  const ord=getSess(sessKey(v)).opt[q.id];
  if(!ord) return q.options;
  const m=new Map(q.options.map(o=>[o.id,o]));
  const out=ord.map(id=>m.get(id)).filter(Boolean);
  return out.length===q.options.length?out:q.options;
}
function resetOrder(v){ const ss=getSess(sessKey(v)); ss.order=null; ss.opt={}; ss.mode='seq'; save(); }

/* trạng thái câu hỏi */
function placedAll(q){ const p=S.cls[q.id]||{}; return q.items.every(it=>p[it.id]); }
function isDone(q){
  if(q.type==='mcq') return !!S.ans[q.id];
  if(q.type==='classify') return !!S.rev[q.id] || placedAll(q);
  return !!S.rev[q.id];
}
function isCorrect(q){ return q.type==='mcq' && S.ans[q.id]===q.correctOptionId; }
// danh sách "bước" (mỗi bước = 1 câu) theo thứ tự + bộ lọc; câu cùng nhóm luôn liền nhau
function buildSteps(v){
  const ss=getSess(sessKey(v)), steps=[];
  for(const u of orderedUnits(v.area,v.setKey))
    u.questions.forEach((q,i)=>{
      const f=ss.filter;
      if(q.id!==ss.cur){      // câu đang xem luôn được giữ lại để không bị nhảy khi vừa làm xong
      if(f==='todo'&&isDone(q)) return;
      if(f==='done'&&!isDone(q)) return;
      if(f==='flag'&&!S.flag[q.id]) return;
      if(f==='wrong'&&!S.wrong[q.id]) return;
      }
      steps.push({u,q,i,n:u.questions.length});
    });
  return steps;
}
function scopeQuestions(v){ const out=[]; for(const u of baseUnits(v.area,v.setKey)) out.push(...u.questions); return out; }

/* ---------- 4) HIỂN THỊ ---------- */
const $app=document.getElementById('app'), $nav=document.getElementById('nav');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let showNavigator=false, ctxCollapsed={}, pickedItem=null, flashMsg='';

/* ----- Bảng hệ thống tài khoản (TT 99/2025/TT-BTC) ----- */
const ACCT = BANK.accounts || {groups:[]};
const norm = s => String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase();
/* Chú thích khác biệt giữa bảng TT99/2025 và slide/đề trong app (chỉ ghi những điểm có bằng chứng trong tài liệu) */
const ACCT_NOTES = {
  '341':'Slide giảng viên và đề gọi là “Vay ngắn hạn”.',
  '411':'Slide giảng viên gọi là “Nguồn vốn kinh doanh”.',
  '155':'Bài tập (Chương 5) gọi là “Thành phẩm”.',
  '3381':'Slide giảng viên gọi là “Tài sản thừa chờ xử lý”.'
};
const ACCT_EXTRA_TITLE = 'Không có trong bảng TT99 (đề/slide vẫn dùng)';
const ACCT_EXTRA = [
  {c:'611',n:'Mua hàng',note:'Đề dùng cho phương pháp kiểm kê định kỳ (Đề thi mẫu 1 – Câu 29; Câu hỏi 2 – Chương 6). Bảng TT99 không liệt kê.'},
  {c:'631',n:'Giá thành sản xuất',note:'Đề dùng cho phương pháp kiểm kê định kỳ (Câu hỏi 2 – Chương 6, Câu 11). Bảng TT99 không liệt kê.'},
  {c:'129',n:'Dự phòng (cách gọi cũ)',note:'Đề ôn 2 – Câu 17 coi là tài khoản dự phòng. Bảng TT99 gộp dự phòng vào TK 229 (vd 2291, 2294).'},
  {c:'159',n:'Dự phòng (cách gọi cũ)',note:'Đề ôn 2 – Câu 17 coi là tài khoản dự phòng. Bảng TT99 gộp dự phòng vào TK 229 (vd 2291, 2294).'},
  {c:'311',n:'Vay ngắn hạn (cách gọi cũ)',note:'Đề ôn 2 – Câu 6 dùng như nguồn vốn vay. Bảng TT99 ghi khoản vay ở TK 341.'}
];
const ACCT_TITLES = ACCT.groups.map(g=>g.title).concat([ACCT_EXTRA_TITLE]);
const ACCT_ROWS = []; ACCT.groups.forEach((g,gi)=>g.items.forEach(it=>ACCT_ROWS.push({c:it.c,n:it.n,l:it.l,g:gi,note:ACCT_NOTES[it.c]||'',nn:norm(it.n+' '+(ACCT_NOTES[it.c]||''))})));
ACCT_EXTRA.forEach(x=>ACCT_ROWS.push({c:x.c,n:x.n,l:0,g:ACCT.groups.length,note:x.note,nn:norm(x.n+' '+x.note),extra:true}));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function markText(text,tokens){
  let h=esc(text); if(!tokens.length) return h;
  // đánh dấu theo bản không dấu để khớp cả khi gõ không dấu
  const nt=norm(text); const spans=[];
  for(const tk of tokens){ let i=0; while((i=nt.indexOf(tk,i))>=0){ spans.push([i,i+tk.length]); i+=tk.length; } }
  if(!spans.length) return h;
  spans.sort((a,b)=>a[0]-b[0]); const m=[]; for(const s of spans){ if(m.length&&s[0]<=m[m.length-1][1]) m[m.length-1][1]=Math.max(m[m.length-1][1],s[1]); else m.push(s.slice()); }
  let out='',pos=0; for(const [a,b] of m){ out+=esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; pos=b; } return out+esc(text.slice(pos));
}
function acctRender(q){
  q=String(q||'').trim().replace(/^tk\s*/i,'');
  const list=document.getElementById('acctlist'), cnt=document.getElementById('acctcnt');
  let rows, tokens=[], digits=/^\d+$/.test(q);
  if(!q){ rows=ACCT_ROWS; }
  else if(digits){ rows=ACCT_ROWS.filter(r=>r.c.startsWith(q)); tokens=[]; }
  else { tokens=norm(q).split(/\s+/).filter(Boolean); rows=ACCT_ROWS.filter(r=>tokens.every(t=>r.nn.includes(t)||r.c.includes(t))); }
  cnt.textContent = q ? (rows.length+' kết quả'+(digits?' (số hiệu bắt đầu bằng '+q+')':'')) : (ACCT_ROWS.length-ACCT_EXTRA.length)+' tài khoản theo TT99 · '+ACCT_EXTRA.length+' số hiệu chú thích ngoài bảng';
  if(!rows.length){ list.innerHTML='<div class="empty" style="padding:24px 0">Không tìm thấy tài khoản phù hợp.</div>'; return; }
  let h='', lastG=-1;
  for(const r of rows){
    if(r.g!==lastG){ h+=`<div class="acct-g${r.extra?' x':''}">${esc(ACCT_TITLES[r.g])}</div>`; lastG=r.g; }
    const ind = q ? 0 : r.l*16;
    h+=`<div class="acct-r l${r.l}"><span class="c">${digits?'<mark>'+esc(q)+'</mark>'+esc(r.c.slice(q.length)):esc(r.c)}</span><span class="n" style="padding-left:${ind}px">${markText(r.n,tokens)}${r.note?`<span class="nt">⚠ ${markText(r.note,tokens)}</span>`:''}</span></div>`;
  }
  list.innerHTML=h;
}
let acctOpen = !!(S.ui&&S.ui.acct);
function syncAcct(focus){
  const show = acctOpen && view.name==='practice';
  const el=document.getElementById('acct'); el.hidden=!show;
  document.body.classList.toggle('acct-open',show);
  if(show&&!el.dataset.ready){ el.dataset.ready='1'; document.getElementById('acctnote').textContent='Nguồn: '+ACCT.source+'. Dòng ⚠ ghi chú chỗ slide/đề khác bảng này; lời giải trong app giữ theo slide giảng viên.'; acctRender(''); }
  if(show&&focus&&window.innerWidth>=960) document.getElementById('acctq').focus();
}
function setAcct(v,focus){ acctOpen=v; S.ui=S.ui||{}; S.ui.acct=v; save(); syncAcct(focus); }
document.getElementById('acctq').addEventListener('input',e=>acctRender(e.target.value));
document.getElementById('acctq').addEventListener('keydown',e=>{ if(e.key==='Escape'){ e.preventDefault(); setAcct(false); } });

function render(){
  syncAcct(false);
  if(view.name==='home') return renderHome();
  if(view.name==='area') return renderArea();
  if(view.name==='theory') return renderTheory();
  return renderPractice();
}
function pct(a,b){return b?Math.round(a*100/b):0}
function areaProgress(area, setKey){
  const qs=[]; for(const s of setsInScope(area,setKey)) for(const u of s.units) qs.push(...u.questions);
  return {done:qs.filter(isDone).length, total:qs.length};
}
function renderHome(){
  $nav.hidden=true;
  const card=(k)=>{const a=AREAS[k], p=areaProgress(k,'all');
    return `<button class="card" data-act="area" data-area="${k}">
      <h2>${esc(a.title)}</h2><div class="sub">${esc(a.sub)}</div>
      <div class="big">${p.done}/${p.total} câu đã làm · ${a.sets.length} ${k==='lms'?'chương':'bộ đề'}</div>
      <div class="bar" style="margin-top:8px"><i style="width:${pct(p.done,p.total)}%"></i></div></button>`;};
  $app.innerHTML=`<div class="hero"><h1>Nguyên lý kế toán</h1><p>Chọn khu vực để bắt đầu luyện tập. Tiến độ được lưu tự động trên trình duyệt này.</p></div>
    <div class="cards">${card('lms')}${card('other')}</div>
    <p class="foot">Phím tắt khi luyện tập: <span class="kbd">1</span>–<span class="kbd">4</span> chọn đáp án A–D · <span class="kbd">←</span> <span class="kbd">→</span> chuyển câu.</p>`;
  window.scrollTo(0,0);
}
function renderArea(){
  $nav.hidden=true;
  const a=AREAS[view.area], all=areaProgress(view.area,'all');
  const rowHtml=(key,title,sub,p,cls='')=>`<button class="row ${cls}" data-act="open" data-set="${key}">
      <div class="t"><b>${esc(title)}</b><span>${esc(sub)}</span></div>
      <div class="pg"><small>${p.done}/${p.total}</small><div class="bar"><i style="width:${pct(p.done,p.total)}%"></i></div></div></button>`;
  $app.innerHTML=`<div class="crumb"><button class="btn ghost" data-act="home">← Trang chủ</button><h1>${esc(a.title)}</h1></div>
    <div class="list">
      ${rowHtml('all','Luyện tập tất cả', view.area==='lms'?'Gộp toàn bộ các chương':'Gộp toàn bộ các đề', all,'all')}
      ${a.sets.map(s=>{const n=s.units.reduce((t,u)=>t+u.questions.length,0);
        return rowHtml(s.key,s.title,`${n} câu${s.sub?' · '+s.sub:''}`,areaProgress(view.area,s.key));}).join('')}
    </div>${view.area==='lms'&&Object.keys(THEORY).length?`<div class="sech">Ôn tập lý thuyết</div><div class="list">`+
      Object.keys(THEORY).sort().map(k=>{const th=THEORY[k];return `<button class="row theory" data-act="theory" data-ch="${k}"><div class="t"><b>Ôn lý thuyết ${esc(th.title)}</b><span>${th.topics.length} chủ đề · ${th.flashcards.length} flashcard${th.fx&&th.fx.items&&th.fx.items.length?' · '+th.fx.items.length+' công thức':''}</span></div><span class="hint">Đọc · Flashcard · Công thức →</span></button>`;}).join('')+`</div>`:''}`;
  window.scrollTo(0,0);
}

function optHtml(v,q){
  const checked=!!S.chk[q.id], sel=S.ans[q.id];
  return optionList(v,q).map((o,i)=>{
    let c='opt';
    if(checked){ if(o.id===q.correctOptionId) c+=' right'; else if(o.id===sel) c+=' wrong'; }
    else if(o.id===sel) c+=' sel';
    return `<button class="${c}" data-act="pick" data-qid="${q.id}" data-oid="${o.id}" ${checked?'disabled':''}>
      <span class="k">${'ABCDEFGH'[i]}</span><span class="tx">${o.text}</span></button>`;
  }).join('');
}
function solutionMcq(v,q){
  const ol=optionList(v,q), ci=ol.findIndex(o=>o.id===q.correctOptionId), sel=S.ans[q.id];
  const ok=sel===q.correctOptionId;
  const verdict = sel==null ? `<div class="verdict">Đáp án đúng: ${'ABCDEFGH'[ci]}</div>`
    : ok ? `<div class="verdict ok">✓ Chính xác — đáp án ${'ABCDEFGH'[ci]}</div>`
         : `<div class="verdict bad">✗ Chưa đúng — đáp án đúng là ${'ABCDEFGH'[ci]}</div>`;
  return `<div class="sol">${verdict}<h4>Giải thích</h4><div>${q.explanation}</div>${solMeta(q)}</div>`;
}
function solMeta(q){
  let h='';
  if(q.status==='needs_review') h+=`<div class="note">⚠ Cần đối chiếu lại: ${esc(q.reviewNote||'')}</div>`;
  const basis=q.answerBasis==='given'?'Đáp án lấy từ tài liệu gốc.':'Đáp án do trợ lý tự giải theo slide + chế độ kế toán doanh nghiệp VN.';
  h+=`<div class="src"><b>Nguồn:</b> ${esc(q.source||'')}<br>${basis}</div>`;
  return h;
}
function essayHtml(q){
  const open=!!S.rev[q.id];
  return `<div class="actions"><button class="btn ${open?'':'primary'}" data-act="toggleRev" data-qid="${q.id}">${open?'Ẩn đáp án':'Hiện đáp án và cách giải'}</button>
    <span class="hint">Tự làm ra giấy trước rồi đối chiếu.</span></div>
    ${open?`<div class="sol"><h4>Đáp án và cách giải</h4><div>${q.answer}</div>${solMeta(q)}</div>`:''}`;
}
function classifyHtml(q){
  const pl=S.cls[q.id]||{}, rev=!!S.rev[q.id];
  const itemEl=it=>`<span class="item${pickedItem===it.id?' pick':''}" draggable="true" data-item="${it.id}" data-qid="${q.id}">${it.text}</span>`;
  const pool=q.items.filter(it=>!pl[it.id]);
  const zones=q.groups.map(g=>`<div class="zonewrap"><div class="zone" data-zone="${g.id}" data-qid="${q.id}"><h5>${g.label}</h5>${q.items.filter(it=>pl[it.id]===g.id).map(itemEl).join('')}</div></div>`).join('');
  let h=`<div class="cls"><div class="lbl2">Kéo thả (hoặc chạm vào đối tượng rồi chạm vào nhóm) để phân loại. Hệ thống không chấm đúng/sai.</div>
    <div class="pool" data-zone="" data-qid="${q.id}">${pool.length?pool.map(itemEl).join(''):'<span class="hint">Đã phân loại hết các đối tượng.</span>'}</div>
    <div class="zones">${zones}</div></div>
    <div class="actions"><button class="btn ${rev?'':'primary'}" data-act="toggleRev" data-qid="${q.id}">${rev?'Ẩn cách phân loại':'Xem cách phân loại'}</button>
      <button class="btn ghost" data-act="clsReset" data-qid="${q.id}">Đặt lại</button></div>`;
  if(rev){
    h+=`<div class="sol"><h4>Cách phân loại chuẩn</h4><div class="ans-cols">`+
      q.groups.map(g=>`<div class="ans-col"><h5>${g.label}</h5><ul>${q.items.filter(it=>it.groupId===g.id).map(it=>`<li>${it.text}<small>${it.reason}</small></li>`).join('')||'<li class="hint">—</li>'}</ul></div>`).join('')+
      `</div>${q.explanation?`<div style="margin-top:10px">${q.explanation}</div>`:''}${solMeta(q)}</div>`;
  }
  return h;
}
function questionHtml(v,st){
  const q=st.q, f=!!S.flag[q.id];
  const grp = st.n>1 ? `<span class="chip">Câu ${st.i+1}/${st.n} của nhóm</span>`:'';
  const sec = st.u.section ? `<span class="chip sec">${esc(st.u.section)}</span>`:'';
  let body='';
  if(q.type==='mcq'){
    const checked=!!S.chk[q.id];
    const noShuf = hasLetterRef(q);
    body=`<div class="opts">${optHtml(v,q)}</div>
      <div class="actions">
        ${checked?`<button class="btn" data-act="retry" data-qid="${q.id}">Làm lại câu này</button>`
                 :`<button class="btn" data-act="check" data-qid="${q.id}">Xem đáp án</button><span class="hint">Chọn một phương án để xem kết quả ngay.</span>`}
        ${noShuf?'<span class="hint">Câu này có phương án tham chiếu A/B/C/D nên không đảo vị trí khi trộn đáp án.</span>':''}
      </div>${checked?solutionMcq(v,q):''}`;
  } else if(q.type==='classify') body=classifyHtml(q);
  else body=essayHtml(q);
  return `<div class="qcard"><div class="qhead"><span class="qnum">${esc(q.num)}</span>${sec}${grp}
    <button class="flag ${f?'on':''}" data-act="flag" data-qid="${q.id}" title="Đánh dấu ôn lại">${f?'⚑ Đã đánh dấu':'⚐ Đánh dấu'}</button></div>
    <div class="qtext">${q.text}</div>${body}</div>`;
}
function renderPractice(){
  const v=view, key=sessKey(v), ss=getSess(key), steps=buildSteps(v);
  const sc=scopeQuestions(v), done=sc.filter(isDone).length;
  const mc=sc.filter(q=>q.type==='mcq'&&S.chk[q.id]), right=mc.filter(isCorrect).length;
  const title = v.setKey==='all' ? AREAS[v.area].title+' – tất cả' : setsInScope(v.area,v.setKey)[0].title;
  // vị trí hiện tại
  let idx = steps.findIndex(s=>s.q.id===ss.cur);
  if(idx<0){ idx=0; ss.cur=steps[0]?steps[0].q.id:null; }
  const st=steps[idx];
  const seg=(val,label)=>`<button class="${ss.filter===val?'on':''}" data-act="filter" data-v="${val}">${label}</button>`;
  const todo=sc.filter(q=>!isDone(q)).length, fl=sc.filter(q=>S.flag[q.id]).length, wr=sc.filter(q=>S.wrong[q.id]).length;
  let stage='';
  if(!st){
    stage=`<div class="empty">Không có câu nào khớp bộ lọc này.<br><br><button class="btn" data-act="filter" data-v="all">Hiện tất cả câu</button></div>`;
    if(ss.filter==='wrong') stage=`<div class="empty">Chưa có câu sai nào cần ôn lại. 🎉<br><br><button class="btn" data-act="filter" data-v="all">Hiện tất cả câu</button></div>`;
  } else {
    // dữ liệu chung: hiện trên cùng; gập lại sau khi đã xem ở câu đầu của nhóm
    let ctx='';
    if(st.u.context){
      const col = !!ctxCollapsed[st.u.id] && st.i>0;
      ctx=`<div class="ctxbox ${col?'collapsed':''}"><div class="lbl"><span>Dữ liệu chung (dùng cho ${st.n} câu)</span>
        <button class="tg" data-act="ctxtoggle" data-uid="${st.u.id}">${col?'Hiện dữ liệu':'Thu gọn'}</button></div><div class="body">${st.u.context}</div></div>`;
    }
    stage=`<div class="stage" id="stage">${ctx}${questionHtml(v,st)}</div>`;
  }
  $app.innerHTML=`<div class="topbar">
      <div class="topline"><button class="btn ghost" data-act="back">← Quay lại</button><span class="title">${esc(title)}</span>
        <span class="stats">${done}/${sc.length} đã làm${mc.length?` · đúng ${right}/${mc.length} câu đã kiểm tra`:''}</span>
        <button class="btn ${acctOpen?'on':''}" data-act="acct" title="Tra cứu hệ thống tài khoản (phím T)" aria-pressed="${acctOpen}">Hệ thống TK</button></div>
      <div class="progline"><div class="bar"><i style="width:${pct(done,sc.length)}%"></i></div></div>
      <div class="tools">
        <button class="btn" data-act="shuffleQ" title="Trộn thứ tự các câu (giữ nguyên nhóm dữ liệu chung)">Trộn câu hỏi</button>
        <button class="btn" data-act="shuffleO" title="Trộn vị trí phương án A–D của câu trắc nghiệm">Trộn đáp án</button>
        ${wr&&ss.filter==='wrong'?`<button class="btn primary" data-act="redoWrong" title="Xoá lựa chọn của các câu đã làm sai để làm lại">Làm lại câu sai (${wr})</button>`:''}
        <details class="more"><summary class="btn ghost">Thêm ▾</summary><div class="menu">
          ${wr?`<button class="btn" data-act="redoWrong">Làm lại câu sai (${wr})</button>`:''}
          <button class="btn" data-act="resetOrder">Khôi phục thứ tự gốc</button>
          <button class="btn danger" data-act="resetAll">Làm lại toàn bộ bài</button></div></details>
        <span class="sp"></span>
        <span class="seg">${seg('all','Tất cả')}${seg('todo','Chưa làm ('+todo+')')}${seg('done','Đã làm')}${seg('wrong','Câu sai ('+wr+')')}${seg('flag','Đánh dấu ('+fl+')')}</span>
      </div>
      ${ss.mode==='rand'?'<div class="hint" style="margin-top:8px">Đang ở thứ tự ngẫu nhiên.</div>':''}
    </div>
    ${showNavigator?navigatorHtml(steps,ss):''}
    ${flashMsg?`<div class="note" style="margin-top:10px">${esc(flashMsg)}</div>`:''}
    ${stage}`;
  flashMsg='';
  // thanh điều hướng dưới
  $nav.hidden=false;
  $nav.innerHTML=`<div class="in"><button class="btn" data-act="prev" ${idx<=0?'disabled':''}>← Câu trước</button>
    <div class="mid">${st?`Câu <b>${idx+1}</b>/${steps.length}`:'—'} · <button class="btn ghost" style="padding:2px 8px" data-act="navtoggle">${showNavigator?'Ẩn danh sách':'Danh sách câu'}</button></div>
    <button class="btn primary" data-act="next" ${idx>=steps.length-1?'disabled':''}>Câu tiếp theo →</button></div>`;
}
/* ----- Ôn tập lý thuyết ----- */
const TS = ()=>S.th||(S.th={collapsed:{},cards:{}});
function cardState(ch){
  const c=TS().cards; if(!c[ch]) c[ch]={order:null,idx:0};
  const ids=THEORY[ch].flashcards.map(f=>f.id);
  if(!c[ch].order||c[ch].order.length!==ids.length||c[ch].order.some(i=>!ids.includes(i))) c[ch].order=ids;
  if(c[ch].idx>=ids.length||c[ch].idx<0) c[ch].idx=0;
  return c[ch];
}
let cardFlipped=false;
function renderTheory(){
  const ch=view.ch, th=THEORY[ch], mode=view.mode;
  const head=`<div class="topbar"><div class="topline"><button class="btn ghost" data-act="back">← Quay lại</button><span class="title">Ôn lý thuyết</span></div>
    <div class="tools"><span class="seg"><button class="${mode==='read'?'on':''}" data-act="thmode" data-m="read">📖 Đọc lý thuyết</button><button class="${mode==='cards'?'on':''}" data-act="thmode" data-m="cards">🃏 Flashcard (${th.flashcards.length})</button><button class="${mode==='formulas'?'on':''}" data-act="thmode" data-m="formulas">🧮 Công thức (${(th.fx&&th.fx.items||[]).length})</button></span>
    ${mode==='read'?'<span class="sp"></span><button class="btn ghost" data-act="thall" data-v="open">Mở hết</button><button class="btn ghost" data-act="thall" data-v="close">Thu gọn hết</button>':''}</div></div>`;
  if(mode==='read'){
    $nav.hidden=true;
    const col=TS().collapsed;
    const body=th.topics.map((tp,i)=>`<section class="topic ${col[tp.id]?'closed':''}" id="${tp.id}">
      <button class="th" data-act="thtoggle" data-id="${tp.id}"><span class="qnum">${i+1}.</span> ${tp.title}<span class="cv">▾</span></button>
      <div class="tb">
        <div class="tsec"><span class="lb a">A · Khái niệm và kiến thức cốt lõi</span>${tp.core}</div>
        ${tp.formulas?`<div class="tsec"><span class="lb b">B · Công thức và cách tính</span>${tp.formulas}</div>`:''}
        ${tp.compare?`<div class="tsec"><span class="lb c">C · Phân biệt dễ nhầm</span>${tp.compare}</div>`:''}
        <div class="tsrc">Nguồn: ${esc(tp.source)}</div></div></section>`).join('');
    $app.innerHTML=head+`<h1 class="pagetitle ch">${esc(th.title)}</h1><div class="toc">${th.topics.map((tp,i)=>`<button data-act="thgoto" data-id="${tp.id}">${i+1}. ${tp.title}</button>`).join('')}</div>`+body+
      (th.notes?`<div class="note theory-notes"><b>Lưu ý:</b> ${th.notes}</div>`:'');
    return;
  }
  if(mode==='formulas'){
    $nav.hidden=true;
    const fx=th.fx||{items:[],note:null}, items=fx.items||[];
    $app.innerHTML=head+`<h1 class="pagetitle ch">${esc(th.title)}</h1><p class="hint" style="max-width:var(--read)">Công thức tính số của chương, kèm ý nghĩa từng thành phần và ví dụ.</p>`+
      (items.length?`<div class="toc">${items.map((it,i)=>`<button data-act="thgoto" data-id="${it.id}">${i+1}. ${it.name}</button>`).join('')}</div>`:'')+
      items.map((it,i)=>`<article class="fx" id="${it.id}"><h3><span class="qnum">${i+1}.</span>${it.name}</h3>${it.formula}<div class="parts">${it.parts}</div><div class="fx-ex">${it.example}</div><div class="tsrc">Nguồn: ${it.source}</div></article>`).join('')+
      (fx.note?`<div class="fxnote">${fx.note}</div>`:'');
    return;
  }
  const cs=cardState(ch), n=cs.order.length, f=th.flashcards.find(x=>x.id===cs.order[cs.idx]);
  const tp=th.topics.find(x=>x.id===f.topic);
  $app.innerHTML=head+`<h1 class="pagetitle ch">${esc(th.title)}</h1><div class="fc"><button class="fcard ${cardFlipped?'back':''}" data-act="cflip">
      <div class="side">${cardFlipped?'Mặt sau – đáp án':'Mặt trước'}</div>
      <div class="ct">${cardFlipped?f.back:f.front}</div>
      <div class="tp">${tp?esc(tp.title):''}</div></button>
    <div class="actions" style="justify-content:center"><button class="btn" data-act="cshuffle">🔀 Trộn flashcard</button><button class="btn ghost" data-act="creset">Thứ tự gốc</button>
      <span class="hint"><span class="kbd">Space</span> lật · <span class="kbd">←</span> <span class="kbd">→</span> chuyển thẻ</span></div></div>`;
  $nav.hidden=false;
  $nav.innerHTML=`<div class="in"><button class="btn" data-act="cprev" ${cs.idx<=0?'disabled':''}>← Thẻ trước</button><div class="mid">Thẻ <b>${cs.idx+1}</b>/${n}</div><button class="btn primary" data-act="cnext" ${cs.idx>=n-1?'disabled':''}>Thẻ sau →</button></div>`;
}
function cardGo(d){ const cs=cardState(view.ch), n=cs.idx+d; if(n<0||n>=cs.order.length) return; cs.idx=n; cardFlipped=false; save(); render(); window.scrollTo(0,0); }
function navigatorHtml(steps,ss){
  return `<div class="navigator">`+steps.map((s,i)=>{
    const q=s.q; let c='';
    if(q.type==='mcq'&&S.chk[q.id]) c=isCorrect(q)?'ok':'no'; else if(isDone(q)) c='done';
    if(q.id===ss.cur) c+=' cur'; if(S.flag[q.id]) c+=' fl';
    return `<button class="${c}" data-act="goto" data-qid="${q.id}" title="${esc(q.num)}">${i+1}</button>`;
  }).join('')+`</div>`;
}

/* ---------- 5) SỰ KIỆN ---------- */
function go(delta){
  const steps=buildSteps(view), ss=getSess(sessKey(view));
  let idx=steps.findIndex(s=>s.q.id===ss.cur); if(idx<0) idx=0;
  const n=idx+delta; if(n<0||n>=steps.length) return;
  ss.cur=steps[n].q.id; pickedItem=null; save(); render(); window.scrollTo(0,0);
}
function pickOption(qid,oid){      // chọn là hiện đáp án ngay; ghi nhớ câu sai để ôn lại
  if(S.chk[qid]) return;
  S.ans[qid]=oid; S.chk[qid]=true;
  if(oid===QINDEX[qid].q.correctOptionId) delete S.wrong[qid]; else S.wrong[qid]=true;
  save(); render();
}
function placeItem(qid,itemId,zoneId){
  const pl=S.cls[qid]||(S.cls[qid]={});
  if(zoneId) pl[itemId]=zoneId; else delete pl[itemId];
  pickedItem=null; save(); render();
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act],[data-item],[data-zone]'); if(!el) return;
  const act=el.dataset.act, qid=el.dataset.qid;
  if(!act){
    // chạm để chọn đối tượng / chạm vào nhóm để thả (bổ trợ cho kéo thả)
    if(el.dataset.item){ pickedItem = pickedItem===el.dataset.item?null:el.dataset.item; render(); return; }
    if(el.dataset.zone!==undefined && pickedItem){ placeItem(el.dataset.qid,pickedItem,el.dataset.zone); }
    return;
  }
  switch(act){
    case 'area': view={name:'area',area:el.dataset.area}; render(); break;
    case 'home': view={name:'home'}; render(); break;
    case 'open': view={name:'practice',area:view.area,setKey:el.dataset.set}; pickedItem=null; showNavigator=false; render(); break;
    case 'back': view={name:'area',area:view.name==='theory'?'lms':view.area}; render(); break;
    case 'theory': view={name:'theory',ch:el.dataset.ch,mode:'read'}; cardFlipped=false; render(); window.scrollTo(0,0); break;
    case 'thmode': view.mode=el.dataset.m; cardFlipped=false; render(); window.scrollTo(0,0); break;
    case 'thtoggle': { const c=TS().collapsed, id=el.dataset.id; if(c[id]) delete c[id]; else c[id]=true; save(); el.closest('.topic').classList.toggle('closed',!!c[id]); break; }
    case 'thall': { const c=TS().collapsed; for(const tp of THEORY[view.ch].topics){ if(el.dataset.v==='close') c[tp.id]=true; else delete c[tp.id]; } save(); render(); break; }
    case 'thgoto': { const c=TS().collapsed; delete c[el.dataset.id]; save(); render(); const x=document.getElementById(el.dataset.id); if(x) x.scrollIntoView({behavior:'smooth',block:'start'}); break; }
    case 'cflip': cardFlipped=!cardFlipped; render(); break;
    case 'cprev': cardGo(-1); break;
    case 'cnext': cardGo(1); break;
    case 'cshuffle': { const cs=cardState(view.ch); cs.order=shuffleArr(cs.order); cs.idx=0; cardFlipped=false; save(); render(); break; }
    case 'creset': { const cs=cardState(view.ch); cs.order=THEORY[view.ch].flashcards.map(f=>f.id); cs.idx=0; cardFlipped=false; save(); render(); break; }
    case 'acct': setAcct(!acctOpen,true); render(); break;
    case 'acctclose': setAcct(false); render(); break;
    case 'prev': go(-1); break;
    case 'next': go(1); break;
    case 'goto': getSess(sessKey(view)).cur=qid; pickedItem=null; save(); render(); window.scrollTo(0,0); break;
    case 'navtoggle': showNavigator=!showNavigator; render(); break;
    case 'pick': pickOption(qid,el.dataset.oid); break;
    case 'check': S.chk[qid]=true; save(); render(); break;
    case 'retry': delete S.chk[qid]; delete S.ans[qid]; save(); render(); break;
    case 'toggleRev': if(S.rev[qid]) delete S.rev[qid]; else S.rev[qid]=true; save(); render(); break;
    case 'clsReset': delete S.cls[qid]; delete S.rev[qid]; pickedItem=null; save(); render(); break;
    case 'flag': if(S.flag[qid]) delete S.flag[qid]; else S.flag[qid]=true; save(); render(); break;
    case 'redoWrong': {
      const ids=scopeQuestions(view).filter(q=>S.wrong[q.id]).map(q=>q.id);
      if(!ids.length) break;
      for(const id of ids){ delete S.ans[id]; delete S.chk[id]; }   // giữ S.wrong: câu chỉ rời danh sách khi làm đúng
      const ss=getSess(sessKey(view)); ss.filter='wrong'; ss.cur=null;
      const first=buildSteps(view)[0]; ss.cur=first?first.q.id:null;
      flashMsg='Đã xoá lựa chọn của '+ids.length+' câu sai. Làm đúng câu nào thì câu đó tự rời khỏi danh sách.';
      save(); render(); window.scrollTo(0,0); break; }
    case 'filter': { const ss=getSess(sessKey(view)); ss.filter=el.dataset.v; ss.cur=null; save(); render(); break; }
    case 'ctxtoggle': ctxCollapsed[el.dataset.uid]=!(ctxCollapsed[el.dataset.uid]&&true); render(); break;
    case 'shuffleQ': shuffleQuestions(view); getSess(sessKey(view)).cur=null; flashMsg='Đã trộn thứ tự câu hỏi (các nhóm dữ liệu chung được giữ nguyên).'; render(); window.scrollTo(0,0); break;
    case 'shuffleO': shuffleOptions(view); flashMsg='Đã trộn vị trí các phương án trắc nghiệm.'; render(); break;
    case 'resetOrder': resetOrder(view); getSess(sessKey(view)).cur=null; save(); flashMsg='Đã khôi phục thứ tự gốc.'; render(); break;
    case 'resetAll': {
      if(!confirm('Làm lại bài: xoá toàn bộ lựa chọn, đáp án đã xem và dấu đánh dấu của phạm vi này?')) break;
      for(const q of scopeQuestions(view)){ delete S.wrong[q.id]; delete S.ans[q.id]; delete S.chk[q.id]; delete S.rev[q.id]; delete S.cls[q.id]; delete S.flag[q.id]; }
      const ss=getSess(sessKey(view)); ss.cur=null; ss.filter='all'; save(); render(); window.scrollTo(0,0); break; }
  }
});
/* kéo thả (HTML5) */
let dragId=null;
document.addEventListener('dragstart',e=>{ const it=e.target.closest&&e.target.closest('[data-item]'); if(!it) return; dragId=it.dataset.item; it.classList.add('drag'); try{e.dataTransfer.setData('text/plain',dragId);e.dataTransfer.effectAllowed='move';}catch(_){} });
document.addEventListener('dragend',e=>{ dragId=null; document.querySelectorAll('.drag,.over').forEach(x=>x.classList.remove('drag','over')); });
document.addEventListener('dragover',e=>{ const z=e.target.closest&&e.target.closest('[data-zone]'); if(!z||!dragId) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x=>x!==z&&x.classList.remove('over')); z.classList.add('over'); });
document.addEventListener('drop',e=>{ const z=e.target.closest&&e.target.closest('[data-zone]'); if(!z||!dragId) return; e.preventDefault(); const id=dragId; dragId=null; placeItem(z.dataset.qid,id,z.dataset.zone); });
/* phím tắt: chỉ khi đang luyện tập và không gõ vào ô nhập liệu */
document.addEventListener('keydown',e=>{
  if(view.name==='theory'&&view.mode==='cards'){
    const t=e.target; if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key==='ArrowLeft'){ e.preventDefault(); cardGo(-1); }
    else if(e.key==='ArrowRight'){ e.preventDefault(); cardGo(1); }
    else if(e.key===' '||e.key==='Enter'){ e.preventDefault(); cardFlipped=!cardFlipped; render(); }
    return;
  }
  if(view.name==='practice'){
    const tt=e.target; const typing=tt&&(/^(INPUT|TEXTAREA|SELECT)$/.test(tt.tagName)||tt.isContentEditable);
    if(!typing&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&(e.key==='t'||e.key==='T')){ e.preventDefault(); setAcct(!acctOpen,true); render(); return; }
    if(e.key==='Escape'&&acctOpen){ setAcct(false); render(); return; }
  }
  if(view.name!=='practice') return;
  const t=e.target; if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)) return;
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==='ArrowLeft'){ e.preventDefault(); go(-1); }
  else if(e.key==='ArrowRight'){ e.preventDefault(); go(1); }
  else if(/^[1-4]$/.test(e.key)){
    const steps=buildSteps(view), ss=getSess(sessKey(view)), st=steps.find(s=>s.q.id===ss.cur);
    if(!st||st.q.type!=='mcq') return;
    const o=optionList(view,st.q)[Number(e.key)-1]; if(o){ e.preventDefault(); pickOption(st.q.id,o.id); }
  }
});
render();
</script>
</body>
</html>
